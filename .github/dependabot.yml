# Dependency update automation (`ACQ-R19`).
#
# OWNERSHIP IS DELIBERATELY SPLIT. Renovate owns npm dependency updates (and
# `config/agent-tools.json` through its JSONata custom manager), so Dependabot
# must not open competing npm PRs or rewrite the same lock file.
#
# Dependabot owns `github-actions` for a separate security reason. Third-party
# actions are pinned to immutable commit SHAs, so the code they run cannot move
# without a repository change. A pinned SHA then goes stale silently;
# Dependabot keeps those immutable pins current, which makes SHA pinning
# sustainable rather than a one-off that rots.
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci

# NOT CONFIGURABLE FROM THIS FILE, and still outstanding under `ACQ-R19`:
# Dependabot alerts and security updates are repository settings rather than
# repository files. Someone with repository administration has to manage the
# alerting half in Settings → Code security; this file only owns action-pin
# update pull requests.
