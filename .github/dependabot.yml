# Dependency update automation (`ACQ-R19`).
#
# WHAT THIS ADDS THAT CI DID NOT. `npm audit --omit=dev --audit-level=high`
# already runs in CI and is real coverage, but it is a GATE, not a WATCHMAN: it
# runs only when something else triggers a build, it looks only at production
# dependencies, and it blocks only at high severity. Nothing in the repository
# notices a new advisory on a quiet week, and nothing proposes the upgrade. That
# gap is what this closes; the audit step stays exactly as it is.
#
# The `github-actions` ecosystem is here for a second reason. Third-party
# actions were once referenced by moving tags (`@v4`), so the code they ran
# could change without any commit in this repository. That is no longer true —
# every external reference is now a full commit SHA, gated by
# `scripts/check-workflow-action-pins.mjs` — which makes this ecosystem MORE
# necessary, not less: a pin goes stale silently, and Dependabot is what keeps
# a pinned SHA current, which is what makes pinning sustainable rather than a
# one-off that rots.
#
# COOLDOWN. Both ecosystems hold new releases before proposing them. The
# supply-chain compromises this repository's own hardening is aimed at share a
# shape: a malicious version is published, and the window before it is caught
# and yanked is short. Adopting a release the day it appears puts this
# repository inside that window; waiting puts the rest of the ecosystem in
# front of it. Seven days for npm, where compromised packages are found in
# hours to days. Three for actions, which are pinned to SHAs anyway, so the
# cooldown is a second line rather than the only one, and a longer hold would
# mostly delay the security bumps that make pinning worth having.
version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    # Enough to be useful, few enough to be read. An update flood is ignored,
    # and an ignored queue is the same as no queue.
    open-pull-requests-limit: 5
    groups:
      # One pull request per concern rather than per package. Twelve separate
      # bumps of the same toolchain is a review cost with no review benefit.
      types:
        patterns:
          - '@types/*'
      vitest:
        patterns:
          - 'vitest'
          - '@vitest/*'
      playwright:
        patterns:
          - '@playwright/*'
          - 'playwright'
      react:
        patterns:
          - 'react'
          - 'react-dom'
          - 'react-router*'
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 3
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci

# NOT CONFIGURABLE FROM THIS FILE, and still outstanding under `ACQ-R19`:
# Dependabot *alerts* and *security updates* are repository settings rather than
# repository files, and the audit reported alerts as disabled. This file enables
# the update pull requests; someone with repository administration has to enable
# the alerting half in Settings → Code security. Recorded here so the two halves
# are not mistaken for one.
