name: Restack PR 480 final once

on:
  push:
    branches:
      - docs/reconcile-contract-108-follow-up
    paths:
      - .github/workflows/restack-pr480-final-once.yml

permissions:
  contents: write

jobs:
  restack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge current main and remove one-run workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main
          rm .github/workflows/restack-pr480-final-once.yml
          git add -A
          git diff --cached --check
          git commit -m "Remove final PR 480 restack tooling"
          git push
