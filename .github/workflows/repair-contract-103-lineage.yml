name: Repair contract 103 lineage scope

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  repair:
    if: github.head_ref == 'agent/contract-103-competition-instance-lineage'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/contract-103-competition-instance-lineage

      - name: Run isolated repair
        run: python scripts/repair-contract-103-once.py

      - name: Commit repaired contract
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add config/deployment-contract.json docs/ops/ops-pending-migrations.md docs/quality/current-status.md e2e/seed-contract.ts scripts/bonus-games/publish-catalogue.sql supabase/migrations/20260804333000_competition_instance_lineage.sql supabase/tests/154_competition_instance_lineage.sql tests/database-parity/competitionInstanceLineageSource.test.ts
          git diff --cached --check
          git commit -m 'Fix contract 103 public-private lineage and writer compatibility'
          git push origin HEAD:agent/contract-103-competition-instance-lineage
