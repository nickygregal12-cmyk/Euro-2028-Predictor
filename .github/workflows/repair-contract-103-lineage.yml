name: Repair contract 103 lineage scope

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  repair:
    if: github.head_ref == 'agent/contract-103-competition-instance-lineage'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/contract-103-competition-instance-lineage

      - name: Close public-private and conflict-target gaps
        shell: bash
        run: |
          set -euo pipefail
          if grep -q 'bonus_competitions_live_public_game_key' supabase/migrations/20260804333000_competition_instance_lineage.sql; then
            echo 'Contract 103 repair already present.'
            exit 0
          fi

          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, before: str, after: str, label: str) -> str:
              count = text.count(before)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              return text.replace(before, after)

          migration_path = Path('supabase/migrations/20260804333000_competition_instance_lineage.sql')
          migration = migration_path.read_text()

          migration = replace_once(
              migration,
              "-- exists, and **nothing in this contract can create one**. The restart\n-- lifecycle is contract 104, and contract 103 teaches those readers to resolve\n-- the live instance first.",
              "-- exists, and **nothing in this contract can create one**. The restart\n-- lifecycle is contract 105, and contract 104 teaches those readers to resolve\n-- the live PUBLIC instance first.",
              'migration sequence comment',
          )

          migration = replace_once(
              migration,
              "alter table public.bonus_competitions\n  add column if not exists series_id uuid,",
              "alter table public.bonus_competitions\n  add column if not exists visibility_kind text not null default 'public',\n  add column if not exists series_id uuid,",
              'visibility column',
          )

          migration = replace_once(
              migration,
              "alter table public.bonus_competitions\n  alter column series_id set not null;",
              "alter table public.bonus_competitions\n  alter column series_id set not null;\n\nalter table public.bonus_competitions\n  add constraint bonus_competitions_visibility_kind_allowed\n  check (visibility_kind in ('public', 'private'));\n\ncomment on column public.bonus_competitions.visibility_kind is\n  'Public is the one canonical season game instance; private instances belong to independent invitation-scoped series.';",
              'visibility constraint',
          )

          migration = replace_once(
              migration,
              "alter table public.bonus_competitions\n  add constraint bonus_competitions_series_member_key\n  unique (series_id, id);\n\n-- A predecessor must be a real competition. The composite reference also pins\n-- it to the SAME series, so a chain cannot wander between series or games.\nalter table public.bonus_competitions\n  add constraint bonus_competitions_predecessor_fkey\n  foreign key (series_id, predecessor_competition_id)\n  references public.bonus_competitions (series_id, id)\n  on delete restrict;",
              "alter table public.bonus_competitions\n  add constraint bonus_competitions_series_member_key\n  unique (series_id, id, tournament_id, game_key, visibility_kind);\n\n-- A predecessor must be a real competition. The composite reference pins the\n-- chain to the same series, season, game and public/private scope.\nalter table public.bonus_competitions\n  add constraint bonus_competitions_predecessor_fkey\n  foreign key (\n    series_id, predecessor_competition_id, tournament_id, game_key, visibility_kind\n  )\n  references public.bonus_competitions (\n    series_id, id, tournament_id, game_key, visibility_kind\n  )\n  on delete restrict;",
              'scoped predecessor key',
          )

          migration = replace_once(
              migration,
              "create unique index bonus_competitions_live_instance_key\n  on public.bonus_competitions (tournament_id, game_key)\n  where completed_at is null;",
              "-- Every series has at most one running instance. Independent private\n-- series may coexist, while the public catalogue still has one live instance\n-- for a season game.\ncreate unique index bonus_competitions_live_series_key\n  on public.bonus_competitions (series_id)\n  where completed_at is null;\n\ncreate unique index bonus_competitions_live_public_game_key\n  on public.bonus_competitions (tournament_id, game_key)\n  where visibility_kind = 'public' and completed_at is null;",
              'lifecycle indexes',
          )

          resolver_marker = "-- ---------------------------------------------------------------------------\n-- One named resolver, so twenty callers do not each invent the same filter.\n-- ---------------------------------------------------------------------------"
          compatibility_function = r'''-- ---------------------------------------------------------------------------
-- Existing public-availability writers must infer the new partial key.
-- ---------------------------------------------------------------------------
--
-- Dropping the total key without redefining this trigger function would make a
-- tournament update fail at runtime with "no unique or exclusion constraint
-- matching the ON CONFLICT specification". This is compatibility work for the
-- shape change, not contract 104's reader migration.
create or replace function predictor_internal.ensure_original_predictor_availability()
returns trigger
language plpgsql
security definer
set search_path = ''
as $$
begin
  if new.kind = 'tournament' then
    insert into public.bonus_competitions (
      tournament_id,
      game_key,
      published,
      availability_status,
      registration_opens_at,
      registration_closes_at,
      draw_required
    ) values (
      new.id,
      'original_predictor',
      false,
      'active',
      case
        when new.lock_at is not null and new.lock_at <= new.created_at
          then new.lock_at - interval '1 second'
        else new.created_at
      end,
      new.lock_at,
      false
    )
    on conflict (tournament_id, game_key)
      where visibility_kind = 'public' and completed_at is null
    do update
      set registration_opens_at = case
            when excluded.registration_closes_at is null then
              public.bonus_competitions.registration_opens_at
            else least(
              coalesce(
                public.bonus_competitions.registration_opens_at,
                excluded.registration_closes_at - interval '1 second'
              ),
              excluded.registration_closes_at - interval '1 second'
            )
          end,
          registration_closes_at = excluded.registration_closes_at,
          availability_status = 'active',
          updated_at = now()
      where public.bonus_competitions.game_key = 'original_predictor'
        and public.bonus_competitions.visibility_kind = 'public'
        and public.bonus_competitions.completed_at is null
        and not public.bonus_competitions.published;
  end if;

  return new;
end;
$$;

revoke all on function predictor_internal.ensure_original_predictor_availability()
  from public, anon, authenticated, service_role;

'''
          migration = replace_once(
              migration,
              resolver_marker,
              compatibility_function + resolver_marker,
              'compatibility writer insertion',
          )

          migration = replace_once(
              migration,
              "   where competition.tournament_id = p_tournament_id\n     and competition.game_key = p_game_key\n     and competition.completed_at is null",
              "   where competition.tournament_id = p_tournament_id\n     and competition.game_key = p_game_key\n     and competition.visibility_kind = 'public'\n     and competition.completed_at is null",
              'public resolver scope',
          )

          migration_path.write_text(migration)

          # Operational catalogue publication is also an active writer/read path.
          catalogue_path = Path('scripts/bonus-games/publish-catalogue.sql')
          catalogue = catalogue_path.read_text()
          catalogue = replace_once(
              catalogue,
              'on conflict (tournament_id, game_key) do update',
              "on conflict (tournament_id, game_key)\n  where visibility_kind = 'public' and completed_at is null\ndo update",
              'catalogue partial conflict target',
          )
          catalogue = replace_once(
              catalogue,
              " and competition.game_key = definition.game_key\non conflict (competition_id, sequence)",
              " and competition.game_key = definition.game_key\n and competition.visibility_kind = 'public'\n and competition.completed_at is null\non conflict (competition_id, sequence)",
              'catalogue window lookup',
          )
          catalogue = replace_once(
              catalogue,
              "   and competition.game_key in ('last_man_standing', 'predictor_cup')\n  join public.matches match",
              "   and competition.game_key in ('last_man_standing', 'predictor_cup')\n   and competition.visibility_kind = 'public'\n   and competition.completed_at is null\n  join public.matches match",
              'catalogue mapped competition lookup',
          )
          catalogue = replace_once(
              catalogue,
              "join public.bonus_competitions competition\n  on competition.tournament_id = tournament.id\nwhere tournament.name = 'UEFA Euro 2028'\n  and competition.game_key in ('ko_predictor', 'last_man_standing', 'predictor_cup')",
              "join public.bonus_competitions competition\n  on competition.tournament_id = tournament.id\n and competition.visibility_kind = 'public'\n and competition.completed_at is null\nwhere tournament.name = 'UEFA Euro 2028'\n  and competition.game_key in ('ko_predictor', 'last_man_standing', 'predictor_cup')",
              'catalogue audit lookup',
          )
          catalogue = replace_once(
              catalogue,
              "      and competition.game_key in ('ko_predictor', 'last_man_standing', 'predictor_cup')\n      and competition.published;",
              "      and competition.game_key in ('ko_predictor', 'last_man_standing', 'predictor_cup')\n      and competition.visibility_kind = 'public'\n      and competition.completed_at is null\n      and competition.published;",
              'catalogue competition count',
          )
          # Window and fixture counts both follow exact competition ids, but must
          # ignore historical/private instances when the script is rerun later.
          count_pattern = "      and competition.game_key in ('last_man_standing', 'predictor_cup');"
          if catalogue.count(count_pattern) != 2:
              raise SystemExit(f'catalogue count filters: expected two matches, found {catalogue.count(count_pattern)}')
          catalogue = catalogue.replace(
              count_pattern,
              "      and competition.game_key in ('last_man_standing', 'predictor_cup')\n      and competition.visibility_kind = 'public'\n      and competition.completed_at is null;",
          )
          catalogue_path.write_text(catalogue)

          # Expand the database proof from 18 to 28 assertions.
          test_path = Path('supabase/tests/154_competition_instance_lineage.sql')
          test = test_path.read_text()
          test = replace_once(test, 'select plan(18);', 'select plan(28);', 'pgTAP plan')
          test = replace_once(
              test,
              "declare\n  v_t uuid; v_comp uuid;\nbegin\n  select id into v_t from public.tournaments where kind = 'league_season' order by name limit 1;\n  select id into v_comp from public.bonus_competitions\n   where tournament_id = v_t and game_key = 'last_man_standing';\n  insert into lineage values ('season', v_t), ('first', v_comp);",
              "declare\n  v_t uuid; v_comp uuid; v_euro uuid;\nbegin\n  select id into v_t from public.tournaments where kind = 'league_season' order by name limit 1;\n  select id into v_comp from public.bonus_competitions\n   where tournament_id = v_t and game_key = 'last_man_standing';\n  select id into v_euro from public.tournaments where kind = 'tournament' order by name limit 1;\n  insert into lineage values ('season', v_t), ('first', v_comp), ('tournament', v_euro);\n  insert into public.game_definitions (\n    game_key, display_name, requires_prediction_entry, lock_scope, buffer_minutes, allow_rejoin\n  ) values ('lineage_probe', 'Lineage probe', false, 'round', 0, false);",
              'pgTAP seed scope',
          )
          test = replace_once(
              test,
              "select is(\n  (select count(*)::integer from public.bonus_competitions where completed_at is not null),\n  0,\n  'and none is completed, which is what makes the partial index below equivalent to the constraint it replaces'\n);",
              "select is(\n  (select count(*)::integer from public.bonus_competitions where completed_at is not null),\n  0,\n  'and none is completed, which is what makes the partial index below equivalent to the constraint it replaces'\n);\n\nselect is(\n  (select count(*)::integer from public.bonus_competitions where visibility_kind <> 'public'),\n  0,\n  'all pre-existing availability rows backfill as public rather than becoming private by accident'\n);",
              'pgTAP visibility backfill',
          )

          private_block_marker = "select lives_ok(\n  $$update public.bonus_competitions\n       set completed_at = now(), completion_reason = 'no_winner_restarted'\n     where id = (select id from lineage where label = 'first')$$,"
          private_block = r'''-- Private competitions are separate series. Two may run beside the public one.
select lives_ok(
  $$insert into public.bonus_competitions
      (id, tournament_id, game_key, published, availability_status,
       visibility_kind, series_id)
    values
      (md5('c103-private-a')::uuid,
       (select id from lineage where label = 'season'),
       'last_man_standing', false, 'active', 'private', md5('c103-private-a')::uuid),
      (md5('c103-private-b')::uuid,
       (select id from lineage where label = 'season'),
       'last_man_standing', false, 'active', 'private', md5('c103-private-b')::uuid)$$,
  'two independent private LMS series may coexist with the one live public instance'
);

select lives_ok(
  $$update public.bonus_competitions
       set completed_at = now(), completion_reason = 'no_winner_restarted'
     where id = md5('c103-private-a')::uuid$$,
  'a private series predecessor may complete without affecting the public slot'
);

select lives_ok(
  $$insert into public.bonus_competitions
      (id, tournament_id, game_key, published, availability_status,
       visibility_kind, series_id, series_sequence, predecessor_competition_id)
    values (
      md5('c103-private-a-2')::uuid,
      (select id from lineage where label = 'season'),
      'last_man_standing', false, 'active', 'private',
      md5('c103-private-a')::uuid, 2, md5('c103-private-a')::uuid
    )$$,
  'a private successor reuses its own series while another private series remains live'
);

select is(
  (select count(*)::integer from public.bonus_competitions
    where tournament_id = (select id from lineage where label = 'season')
      and game_key = 'last_man_standing'
      and visibility_kind = 'private'
      and completed_at is null),
  2,
  'private competitions coexist freely across independent live series'
);

select throws_ok(
  $$insert into public.bonus_competitions
      (tournament_id, game_key, published, availability_status,
       visibility_kind, series_id, series_sequence, predecessor_competition_id)
    values (
      (select id from lineage where label = 'season'),
      'last_man_standing', false, 'active', 'private',
      md5('c103-private-a')::uuid, 3, md5('c103-private-a-2')::uuid
    )$$,
  '23505',
  null,
  'one private series cannot have two live instances even though other private series may coexist'
);

'''
          test = replace_once(test, private_block_marker, private_block + private_block_marker, 'pgTAP private-series block')

          scope_marker = "-- Inserted already COMPLETED, deliberately: a live duplicate would be refused"
          scope_assertions = r'''select throws_ok(
  $$update public.bonus_competitions
       set tournament_id = (
         select id from public.tournaments
          where kind = 'league_season'
            and id <> (select id from lineage where label = 'season')
          order by name limit 1
       )
     where id = md5('c103-private-a-2')::uuid$$,
  '23503',
  null,
  'a successor cannot move to another season while retaining its predecessor'
);

select throws_ok(
  $$update public.bonus_competitions
       set game_key = 'lineage_probe'
     where id = md5('c103-private-a-2')::uuid$$,
  '23503',
  null,
  'a successor cannot change game while retaining its predecessor'
);

select throws_ok(
  $$update public.bonus_competitions
       set visibility_kind = 'public'
     where id = md5('c103-private-a')::uuid$$,
  '23503',
  null,
  'a completed predecessor cannot change public/private scope under its successor'
);

'''
          test = replace_once(test, scope_marker, scope_assertions + scope_marker, 'pgTAP scoped-lineage assertions')

          resolver_marker_test = "select is(\n  predictor_internal.live_competition_id(\n    (select id from lineage where label = 'season'), 'last_man_standing'),"
          compatibility_assertions = r'''select lives_ok(
  $$update public.tournaments
       set lock_at = lock_at
     where id = (select id from lineage where label = 'tournament')$$,
  'the Original Predictor availability trigger still upserts after the total key becomes partial'
);

select matches(
  pg_get_functiondef(
    'predictor_internal.ensure_original_predictor_availability()'::regprocedure
  ),
  'ON CONFLICT \(tournament_id, game_key\)[[:space:]]+WHERE \(\(visibility_kind = ''public''::text\) AND \(completed_at IS NULL\)\)',
  'the live writer names the partial public-instance conflict target explicitly'
);

'''
          test = replace_once(test, resolver_marker_test, compatibility_assertions + resolver_marker_test, 'pgTAP writer compatibility')

          # The existing resolver assertion now also proves private rows are ignored.
          test = test.replace(
              "'the resolver returns the live successor, not the completed predecessor'",
              "'the resolver returns the live PUBLIC successor, ignoring two live private competitions'",
          )
          test_path.write_text(test)

          # Static guard for the operational publication script.
          source_test = r'''import { readFileSync } from 'node:fs'
import { resolve } from 'node:path'
import { describe, expect, it } from 'vitest'

const root = process.cwd()
const migration = readFileSync(
  resolve(root, 'supabase/migrations/20260804333000_competition_instance_lineage.sql'),
  'utf8',
)
const catalogue = readFileSync(
  resolve(root, 'scripts/bonus-games/publish-catalogue.sql'),
  'utf8',
)

describe('contract 103 competition-instance source boundaries', () => {
  it('keeps independent private series beside one live public season game', () => {
    expect(migration).toContain("visibility_kind in ('public', 'private')")
    expect(migration).toContain('bonus_competitions_live_series_key')
    expect(migration).toContain('bonus_competitions_live_public_game_key')
    expect(migration).toMatch(
      /where visibility_kind = 'public' and completed_at is null/i,
    )
  })

  it('keeps the operational catalogue on the live public instance', () => {
    expect(catalogue).toMatch(
      /on conflict \(tournament_id, game_key\)\s+where visibility_kind = 'public' and completed_at is null\s+do update/i,
    )
    expect(catalogue).not.toMatch(
      /on conflict \(tournament_id, game_key\) do update/i,
    )
    expect(catalogue.match(/competition\.visibility_kind = 'public'/g)?.length).toBe(6)
    expect(catalogue.match(/competition\.completed_at is null/g)?.length).toBe(6)
  })
})
'''
          Path('tests/database-parity/competitionInstanceLineageSource.test.ts').write_text(source_test)

          # Reconcile authority wording to the corrected invariant.
          contract_path = Path('config/deployment-contract.json')
          contract = contract_path.read_text()
          contract = contract.replace(
              'live-instance uniqueness, series lineage, completion reasons and one server-only live-instance resolver',
              'one live public instance per season game, one live row per series, private-series coexistence, scoped lineage, completion reasons and one server-only public-instance resolver',
          )
          contract_path.write_text(contract)

          ops_path = Path('docs/ops/ops-pending-migrations.md')
          ops = ops_path.read_text().replace(
              'The total `(tournament_id, game_key)` key becomes a partial unique index over live instances; `bonus_competitions` gains series lineage and a bounded `completion_reason`; and `predictor_internal.live_competition_id` becomes the one server-only definition of the live row.',
              'The total `(tournament_id, game_key)` key becomes one partial key over the live public instance plus one live-row-per-series key, so independent private series coexist; `bonus_competitions` gains public/private scope, season/game-scoped lineage and a bounded `completion_reason`; and `predictor_internal.live_competition_id` becomes the one server-only definition of the live public row.',
          )
          ops_path.write_text(ops)

          status_path = Path('docs/quality/current-status.md')
          status = status_path.read_text().replace(
              '`(tournament_id, game_key)` is unique only across live instances; every row belongs to a series with sequence and predecessor lineage; `completion_reason` distinguishes a win, restart and abandonment; and one revoked `predictor_internal.live_competition_id` function defines the current instance.',
              '`(tournament_id, game_key)` is unique only across the live public instance while each series has at most one live row, allowing independent private series to coexist; every row carries public/private scope plus season/game-scoped predecessor lineage; `completion_reason` distinguishes a win, restart and abandonment; and one revoked `predictor_internal.live_competition_id` function defines the live public instance.',
          )
          status_path.write_text(status)

          seed_path = Path('e2e/seed-contract.ts')
          seed = seed_path.read_text().replace(
              ' * Contract 103 adds competition-instance lineage, a bounded completion reason\n * and live-instance uniqueness.',
              ' * Contract 103 adds public/private competition-instance scope, season/game-\n * pinned lineage, a bounded completion reason, one live row per series and one\n * live public instance per season game.',
          )
          seed_path.write_text(seed)
          PY

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add config/deployment-contract.json docs/ops/ops-pending-migrations.md \
            docs/quality/current-status.md e2e/seed-contract.ts \
            scripts/bonus-games/publish-catalogue.sql \
            supabase/migrations/20260804333000_competition_instance_lineage.sql \
            supabase/tests/154_competition_instance_lineage.sql \
            tests/database-parity/competitionInstanceLineageSource.test.ts
          git diff --cached --check
          git commit -m 'Fix contract 103 public-private lineage and writer compatibility'
          git push origin HEAD:agent/contract-103-competition-instance-lineage
