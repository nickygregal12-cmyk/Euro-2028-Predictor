name: Session contract 132 cleanup

on:
  push:
    branches:
      - feature/provider-initial-fixture-approval-contract-132

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Tighten contract 132 validation
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'feature/provider-initial-fixture-approval-contract-132'
          migration='supabase/migrations/20260807210812_provider_initial_fixture_approval.sql'
          test "$(grep -c "or p_provider not in ('sportmonks', 'api-football', 'football-data')" "$migration")" = '2'
          sed -i "/or p_provider not in ('sportmonks', 'api-football', 'football-data')/i\     or p_provider is null" "$migration"
          test "$(grep -c 'order by p.round_provider_id::integer' "$migration")" = '1'
          sed -i 's/order by p\.round_provider_id::integer/order by ordinal/' "$migration"
          git rm .github/workflows/session-contract132-cleanup.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$migration"
          git commit -m 'Tighten contract 132 SQL validation'
          git push origin HEAD:"$GITHUB_REF_NAME"
