name: AI hardening evidence

# Temporary execution plane for the final historical falsification rerun.
# Development-only, read-only and provider-free. It is deleted once the
# coverage-guard result is copied back into the dated investigation record.
on:
  pull_request:
    branches:
      - main
    paths:
      - 'ai/experiments.py'
      - 'ai/fitting.py'
      - 'ai/features.py'
      - '.github/workflows/ai-hardening-evidence.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-hardening-evidence-${{ github.ref }}
  cancel-in-progress: true

env:
  DEVELOPMENT_PROJECT_REF: iouzoutneyjpugbbtdem

jobs:
  coverage-falsification:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      DATABASE_URL: ${{ secrets.SUPABASE_DEV_DB_URL }}
      AI_READ_ONLY: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ai/requirements.txt

      - name: Prove this is Development and read-only
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL}" ]; then
            echo "SUPABASE_DEV_DB_URL is not available"
            exit 1
          fi
          case "${DATABASE_URL}" in
            *"${DEVELOPMENT_PROJECT_REF}"*) ;;
            *) echo "Refusing non-Development database"; exit 1 ;;
          esac
          echo "::add-mask::${DATABASE_URL}"
          echo "Target Development ${DEVELOPMENT_PROJECT_REF}; AI_READ_ONLY=${AI_READ_ONLY}"

      - name: Install
        working-directory: ai
        run: pip install -r requirements.txt

      - name: Prove package write scope before opening a credential
        working-directory: ai
        run: python check_write_scope.py

      - name: Rerun only the predeclared coverage-guard falsification
        working-directory: ai
        run: ./run_leagues.sh experiments.py --study coverage-guard

      - name: Print the nine-league falsification digest
        if: always()
        working-directory: ai
        run: |
          python - <<'PY'
          import glob, json, os
          paths = sorted(glob.glob('reports/study-coverage-guard-*.json'))
          if len(paths) != 9:
              raise SystemExit(f'expected 9 coverage reports, found {len(paths)}')
          for path in paths:
              row = json.loads(open(path).read())
              fired = row.get('fired') or []
              print('COVERAGE', row['league'],
                    f"delta={row.get('mean_delta', 0):+.12f}",
                    f"se={row.get('se_delta', 0):.12f}",
                    f"fired={[r['season'] for r in fired]}")
              for fold in fired:
                  print('FIRED', row['league'], fold['season'],
                        fold['dropped'],
                        f"{fold['control_log_loss']:.12f}",
                        f"{fold['guarded_log_loss']:.12f}")
          PY

      - name: Keep the targeted evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-falsification-${{ github.run_id }}
          path: ai/reports/study-coverage-guard-*.json
          retention-days: 30
          if-no-files-found: error
