name: AI hardening evidence

# Temporary execution plane for the closing hardening study. It is deliberately
# Development-only, read-only and provider-free. The workflow is removed once
# its result is copied back into the dated investigation record.
on:
  pull_request:
    branches:
      - main
    paths:
      - 'ai/final_hardening.py'
      - 'ai/fitting.py'
      - 'ai/features.py'
      - 'docs/quality/investigations/2026-08-14-final-model-selection-predeclaration.md'
      - '.github/workflows/ai-hardening-evidence.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-hardening-evidence-${{ github.ref }}
  cancel-in-progress: true

env:
  DEVELOPMENT_PROJECT_REF: iouzoutneyjpugbbtdem

jobs:
  final-guarded-comparison:
    # Secrets are unavailable to fork PRs. This branch lives in the repository,
    # but keep the boundary explicit so this workflow can never become a way for
    # an external PR to receive the Development database credential.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      DATABASE_URL: ${{ secrets.SUPABASE_DEV_DB_URL }}
      AI_READ_ONLY: '1'
      AI_COVERAGE_GUARD: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ai/requirements.txt

      - name: Prove this is Development and read-only
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL}" ]; then
            echo "SUPABASE_DEV_DB_URL is not available"
            exit 1
          fi
          case "${DATABASE_URL}" in
            *"${DEVELOPMENT_PROJECT_REF}"*) ;;
            *) echo "Refusing non-Development database"; exit 1 ;;
          esac
          echo "::add-mask::${DATABASE_URL}"
          echo "Target Development ${DEVELOPMENT_PROJECT_REF}; AI_READ_ONLY=${AI_READ_ONLY}"

      - name: Install
        working-directory: ai
        run: pip install -r requirements.txt

      - name: Prove package write scope before opening a credential
        working-directory: ai
        run: python check_write_scope.py

      - name: Run the predeclared all-nine guarded comparison
        working-directory: ai
        run: python final_hardening.py --all --output reports/final-guarded-model-selection.json

      - name: Print compact selection digest
        if: always()
        working-directory: ai
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('reports/final-guarded-model-selection.json')
          if not path.exists():
              print('no final report produced')
              raise SystemExit(0)
          report = json.loads(path.read_text())
          for league, row in report['leagues'].items():
              pick = row['selection']
              summary = row['summaries'][pick['configuration']]
              print('FINAL', league, pick['configuration'],
                    f"log_loss={summary['mean_log_loss']:.6f}",
                    f"dropped={pick['coverage_dropped_in_any_selected_fold']}")
          PY

      - name: Keep the evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: final-guarded-model-selection-${{ github.run_id }}
          path: ai/reports/final-guarded-model-selection.json
          retention-days: 30
          if-no-files-found: error
