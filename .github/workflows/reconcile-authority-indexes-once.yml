name: Reconcile authority indexes once

on:
  push:
    branches:
      - docs/reconcile-authority-indexes-2026-08-05
    paths:
      - scripts/reconcile-authority-indexes-once.py
      - .github/workflows/reconcile-authority-indexes-once.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/reconcile-authority-indexes-2026-08-05
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reconcile authority indexes
        run: python scripts/reconcile-authority-indexes-once.py
      - name: Remove one-run tooling and commit
        run: |
          rm scripts/reconcile-authority-indexes-once.py
          rm .github/workflows/reconcile-authority-indexes-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/quality/deferred-decisions.md docs/design/README.md docs/architecture/README.md docs/architecture/provider-ingestion-contract-97.md docs/competition-structure.md docs/architecture/multi-competition-hub-build-plan.md scripts/reconcile-authority-indexes-once.py .github/workflows/reconcile-authority-indexes-once.yml
          git commit -m "Docs: reconcile resolved decisions and authority indexes"
          git push origin HEAD:docs/reconcile-authority-indexes-2026-08-05
