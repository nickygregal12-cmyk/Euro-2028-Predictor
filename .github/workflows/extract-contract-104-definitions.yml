name: Extract Contract 104 definitions

on:
  push:
    branches:
      - agent/contract-104-live-competition-callers

permissions:
  contents: write

jobs:
  extract:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/contract-104-live-competition-callers

      - name: Extract latest definitions
        run: python scripts/extract-contract-104-definitions-once.py

      - name: Commit review aid
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/quality/contract-104-latest-function-definitions.sql
          git diff --cached --check
          git commit -m 'Extract latest Contract 104 function definitions'
          git push origin HEAD:agent/contract-104-live-competition-callers
