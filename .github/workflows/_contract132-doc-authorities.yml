name: Contract 132 authority sync

on:
  push:
    branches:
      - feature/provider-initial-fixture-approval-contract-132

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/provider-initial-fixture-approval-contract-132
      - name: Bring live authorities to contract 132
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          notes = {
            'AGENTS.md': '''\n\n## Contract 132 — initial provider calendar approval\n\nContract 132 adds the reviewed first-publication path for real season calendars: successfully decoded provider fixtures are staged as immutable pending evidence and only a competition administrator may approve a complete initial Scottish Premiership (198 fixtures / 33 rounds / 12 teams) or Premier League (380 / 38 / 20) calendar. Provider scores remain evidence only; official result truth continues through the protected season-result authority.\n''',
            'CLAUDE.md': '''\n\n## Contract 132 — provider initial publication boundary\n\nThe repository is at contract 132. Fresh provider calendars must follow archive/normalize → stage pending proposals → explicit competition-admin approval. Contract 132 does not authorize automatic provider result confirmation, and it must not be used to copy Development football rows into Production.\n''',
            'MASTER-TODO.md': '''\n\n## Contract 132 — completed foundation\n\n- [x] Add immutable pending proposals for fresh provider fixtures.\n- [x] Require explicit competition-admin approval for complete initial Scottish Premiership and Premier League calendars.\n- [x] Keep provider scores/status as evidence only; official results remain behind the protected confirmation authority.\n- [ ] Complete environment-specific Production provider credentials before live polling/import.\n''',
            'docs/roadmap.md': '''\n\n## Contract 132 checkpoint — real season data adoption\n\nContract 132 establishes the controlled first-publication authority for real domestic season calendars. It stages provider evidence first, requires an explicit administrator decision, rejects partial initial schedules, and leaves result confirmation outside provider automation. Development remains the first hosted validation target before Production promotion.\n''',
            'docs/quality/current-status.md': '''\n\n## Contract 132 current state\n\nContract 132 adds a tested initial provider-calendar approval boundary. New provider fixtures can be staged without becoming public, complete Scottish Premiership or Premier League calendars require explicit competition-admin approval, and provider scores cannot become official results through this path. Hosted rollout remains Development first, then Production after parity gates pass.\n''',
            'docs/ops/ops-pending-migrations.md': '''\n\n## Contract 132 — provider initial fixture approval\n\n`20260807210812_provider_initial_fixture_approval.sql` is the contract 132 migration. Promote it Development first and verify the proposal table, staging helper, authenticated admin approval/rejection RPCs, grants, and empty-season guard before applying the identical migration to Production. Production provider secrets remain an environment-level prerequisite for live ingestion and are not stored in repository migrations.\n''',
            'docs/quality/feature-baseline.md': '''\n\n## Contract 132 baseline\n\nThe domestic-season baseline now includes staged initial provider fixture proposals and explicit administrator approval/rejection. Initial Scottish publication is constrained to 12 teams, 33 pre-split rounds and 198 fixtures; Premier League publication is constrained to 20 teams, 38 rounds and 380 fixtures. Created fixtures remain scheduled with null official scores until the separate protected result-confirmation authority is used.\n''',
            'docs/adr/README.md': '''\n\n## Contract 132 decision note\n\nContract 132 preserves the ingestion/result boundary: provider payloads may establish a complete initial season calendar only after immutable staging and an explicit competition-admin approval; provider-reported scores are retained as evidence and never become official result truth through initial publication.\n''',
            'docs/design/README.md': '''\n\n## Contract 132 design boundary\n\nReal domestic fixture adoption now has a backend publication gate: provider evidence is staged first and a complete initial season is approved explicitly. UI surfaces may rely on canonical scheduled fixtures after approval, but must not treat provider score evidence as an official result until the protected result-confirmation path has run.\n''',
            'docs/competition-structure.md': '''\n\n## Contract 132 provider-calendar note\n\nFor supported domestic season competitions, contract 132 may create the initial canonical teams, rounds and scheduled fixtures only from a complete approved provider proposal set. It does not change competition scoring rules and does not confirm results automatically.\n''',
            'docs/architecture/programme-plan.md': '''\n\n## Contract 132 architecture checkpoint\n\nThe provider ingestion programme now has a controlled initial-publication stage between normalized evidence and canonical season fixtures. Complete-season approval is an explicit competition-admin action; later fixture revisions remain under the existing revision authority and official results remain separately protected.\n''',
            'docs/architecture/multi-competition-hub-build-plan.md': '''\n\n## Contract 132 multi-competition data boundary\n\nScottish Premiership and Premier League season calendars can now be initialized from provider evidence through a common staged approval contract. Competition-specific completeness constraints are enforced before publication, while provider result evidence remains outside official score truth.\n''',
          }

          for name, note in notes.items():
              p = Path(name)
              text = p.read_text()
              if 'Contract 132' not in text and 'contract 132' not in text:
                  p.write_text(text.rstrip() + note + '\n')

          PY
      - name: Commit authority updates
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AGENTS.md CLAUDE.md MASTER-TODO.md docs/roadmap.md docs/quality/current-status.md docs/ops/ops-pending-migrations.md docs/quality/feature-baseline.md docs/adr/README.md docs/design/README.md docs/competition-structure.md docs/architecture/programme-plan.md docs/architecture/multi-competition-hub-build-plan.md
          if git diff --cached --quiet; then
            echo "Authorities already current"
          else
            git commit -m "docs: align authorities with contract 132"
            git push origin HEAD:feature/provider-initial-fixture-approval-contract-132
          fi
