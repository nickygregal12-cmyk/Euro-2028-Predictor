name: Production 151 to 157 rehearsal

# Manual, and READ-ONLY against hosted Production. The only migration write in
# this workflow targets the disposable local restore on 127.0.0.1:54322.
#
# This rehearses the six-migration Production boundary 151 -> 157 against a
# database restored from a fresh encrypted Production dump, so the forward
# apply is exercised on Production-shaped data before it is exercised on
# Production. It does NOT promote Production and contains no statement that
# writes to it.
#
# Why a rehearsal for a set that is "only additive": additive is a property of
# the migration TEXT, and this batch does three things whose outcome depends on
# the data already present.
#
#   * Contract 152 ALTERS `public.bonus_competitions`, adds a foreign key to
#     `auth.users`, and BACKFILLS every existing league invite code into the new
#     shared namespace. Its own DO block refuses the migration if the backfill
#     covered fewer leagues than exist — so on a database with leagues, that
#     assertion is a live test, not a formality.
#   * Contract 152's identity constraint is `NOT VALID` because hosted
#     DEVELOPMENT holds one ownerless private competition from the contract 133
#     seed. Production is believed to hold none. The rehearsal is where that
#     belief gets tested against a real copy rather than asserted.
#   * Contract 153 REDEFINES `public.join_competition_game`, an entry authority
#     that ships and is in use, moving its body into
#     `predictor_internal.enter_competition_game` and narrowing the public
#     function to refuse a private competition.
#
# Proving the text additive is not the same as proving the chain replays onto
# THIS database. The rehearsal is what tells them apart.

on:
  workflow_dispatch:
    inputs:
      project_ref:
        description: Exact Production project ref confirmation
        required: true
      confirmation:
        description: Type REHEARSE-PRODUCTION-151-TO-157 to proceed
        required: true

permissions:
  contents: read

concurrency:
  group: production-151-to-157-rehearsal
  cancel-in-progress: false

env:
  EXPECTED_PROJECT_REF: vkfnsqdyhvtwyqkisxhk
  FORBIDDEN_DEVELOPMENT_REF: iouzoutneyjpugbbtdem
  CONFIRMATION_PHRASE: REHEARSE-PRODUCTION-151-TO-157
  SOURCE_CONTRACT: '151'
  SOURCE_VERSION: '20260810170000'
  SOURCE_NAME: season_player_profile
  TARGET_CONTRACT: '157'
  TARGET_VERSION: '20260810230000'
  TARGET_NAME: player_preferences
  WORK_DIR: /tmp/production-151-to-157-rehearsal
  LOCAL_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres

jobs:
  rehearse:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Refuse an unsafe dispatch or repository state
        env:
          INPUT_PROJECT_REF: ${{ inputs.project_ref }}
          INPUT_CONFIRMATION: ${{ inputs.confirmation }}
        shell: bash
        run: |
          set -euo pipefail
          [ "${INPUT_CONFIRMATION}" = "${CONFIRMATION_PHRASE}" ] || {
            echo "ERROR: confirmation phrase does not match ${CONFIRMATION_PHRASE}."
            exit 1
          }
          [ "${INPUT_PROJECT_REF}" = "${EXPECTED_PROJECT_REF}" ] || {
            echo 'ERROR: project ref confirmation does not name the Production project.'
            exit 1
          }
          [ "${GITHUB_REF}" = 'refs/heads/main' ] || {
            echo 'ERROR: this workflow runs only from refs/heads/main.'
            exit 1
          }
          git fetch --no-tags origin main
          [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" ] || {
            echo 'ERROR: checked-out HEAD is not exact origin/main.'
            exit 1
          }
          [ -z "$(git status --porcelain=v1 --untracked-files=all)" ] || {
            echo 'ERROR: checkout is not clean.'
            exit 1
          }

      - name: Prove the repository still holds exactly the approved 151-to-157 batch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${WORK_DIR}"
          expected_batch=$(cat <<'EOF'
          20260810180000_private_container_identity.sql
          20260810190000_private_season_lms.sql
          20260810200000_private_season_cup.sql
          20260810210000_universal_invite_resolver.sql
          20260810220000_season_wrapped_archive.sql
          20260810230000_player_preferences.sql
          EOF
          )
          actual_batch="$(git ls-files 'supabase/migrations/*.sql' | sort | sed -n '152,157p' | xargs -n1 basename)"
          [ "${actual_batch}" = "${expected_batch}" ] || {
            echo 'ERROR: repository rows 152 to 157 are not the approved contract-157 batch.'
            printf 'Expected:\n%s\nActual:\n%s\n' "${expected_batch}" "${actual_batch}"
            exit 1
          }

          source_row="$(git ls-files 'supabase/migrations/*.sql' | sort | sed -n '151p' | xargs -n1 basename)"
          [ "${source_row}" = "${SOURCE_VERSION}_${SOURCE_NAME}.sql" ] || {
            echo "ERROR: repository row 151 is ${source_row}, not the rehearsed source boundary."
            exit 1
          }

          # Development must already hold the target. Production is never the
          # first hosted environment to see a migration.
          development_count="$(node -p "require('./config/development-hosted-contract.json').requiredMigrationCount")"
          [ "${development_count}" -ge "${TARGET_CONTRACT}" ] || {
            echo "ERROR: Development is only contract ${development_count}; target is ${TARGET_CONTRACT}."
            exit 1
          }

      - name: Prove the batch is additive before rehearsing it
        shell: bash
        run: |
          set -euo pipefail
          # The checker takes files, not a range. It excludes routine bodies
          # while still judging DO blocks and statement level.
          #
          # Contract 152 pairs `drop trigger` with an immediate re-create of the
          # same trigger on the same table, twice, and contract 156 does it once.
          # The checker reclassifies exactly that pairing as structural and
          # REPORTS it rather than refusing — which is what the tee below
          # captures, so the rollout record names what moved.
          files="$(git ls-files 'supabase/migrations/*.sql' | sort | sed -n '152,157p' | tr '\n' ' ')"
          node scripts/check-migration-additive.mjs ${files} 2>&1 | tee "${WORK_DIR}/additive.txt"
          # Additive is necessary and not sufficient. Production still gets the
          # backup, the restore and the rehearsal below; this only establishes
          # that nothing in the batch drops or rewrites what Production holds.

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.2

      - uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf
        with:
          version: 2.109.1
          github-token: ${{ github.token }}

      - name: Install PostgreSQL 17 client tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17

      - name: Preflight the Production secret without printing it
        env:
          SUPABASE_PROD_DB_URL: ${{ secrets.SUPABASE_PROD_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${SUPABASE_PROD_DB_URL}" ] || {
            echo 'ERROR: repository secret SUPABASE_PROD_DB_URL is not set.'
            exit 1
          }
          case "${SUPABASE_PROD_DB_URL}" in
            *"${FORBIDDEN_DEVELOPMENT_REF}"*)
              echo 'ERROR: Production secret resolves to Development.'
              exit 1
              ;;
            *"${EXPECTED_PROJECT_REF}"*) ;;
            *)
              echo 'ERROR: Production secret does not name the expected Production project.'
              exit 1
              ;;
          esac

      - name: Prove the live source is exactly contract 151 (read-only)
        env:
          SUPABASE_PROD_DB_URL: ${{ secrets.SUPABASE_PROD_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          psql "${SUPABASE_PROD_DB_URL}" -X -q -v ON_ERROR_STOP=1 -A -t -c "
            select json_build_object(
              'migration_count', (select count(*) from supabase_migrations.schema_migrations),
              'latest_version', (select version from supabase_migrations.schema_migrations order by version desc limit 1),
              'latest_name', (select name from supabase_migrations.schema_migrations order by version desc limit 1)
            )
          " > "${WORK_DIR}/source-state.json"
          cat "${WORK_DIR}/source-state.json"

          SOURCE_STATE_FILE="${WORK_DIR}/source-state.json" node --input-type=module <<'NODE'
          import fs from 'node:fs'
          const state = JSON.parse(fs.readFileSync(process.env.SOURCE_STATE_FILE, 'utf8'))
          const expected = {
            migration_count: Number(process.env.SOURCE_CONTRACT),
            latest_version: process.env.SOURCE_VERSION,
            latest_name: process.env.SOURCE_NAME,
          }
          for (const [key, want] of Object.entries(expected)) {
            if (String(state[key]) !== String(want)) {
              console.error(`ERROR: live Production ${key} is ${state[key]}, expected ${want}.`)
              process.exit(1)
            }
          }
          console.log('Live Production is exactly the rehearsed contract-151 source boundary.')
          NODE

      - name: Take a fresh Production dump and restore it to a disposable local target
        env:
          SUPABASE_PROD_DB_URL: ${{ secrets.SUPABASE_PROD_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          supabase init --force --workdir "${WORK_DIR}" >/dev/null 2>&1 || true
          supabase start --workdir "${WORK_DIR}"

          # ---------------------------------------------------------------
          # READ-ONLY against Production. Dumps only.
          #
          # The ABSOLUTE pg_dump path is required, not stylistic: bare `pg_dump`
          # on this runner resolves to Ubuntu's 16 client, which refuses against
          # a 17.6 server outright.
          #
          # The Supabase-native four-file dump is used rather than one custom
          # -format archive because the archive route restores with
          # `--no-privileges`, which strips the source ACLs; the fresh local
          # stack's own ALTER DEFAULT PRIVILEGES then grants `anon` and
          # `authenticated` on every restored public table. A rehearsal that
          # does not carry privileges is not a rehearsal of Production — and
          # this batch asserts privilege facts in five separate DO blocks, so it
          # would fail against a target with the wrong ACLs and the failure
          # would be the target's, not the migration's.
          #
          # EVERY path below is absolute: `supabase init` makes WORK_DIR a
          # project root, and the CLI resolves a relative --file against the
          # project root it discovers rather than the working directory.
          # ---------------------------------------------------------------
          BUNDLE="${WORK_DIR}/bundle"
          ROLLOUT="${GITHUB_WORKSPACE}/scripts/database-rollout"
          mkdir -p "${BUNDLE}"

          supabase db dump --db-url "${SUPABASE_PROD_DB_URL}" \
            --file "${BUNDLE}/roles.sql" --role-only
          supabase db dump --db-url "${SUPABASE_PROD_DB_URL}" \
            --file "${BUNDLE}/schema.sql"
          supabase db dump --db-url "${SUPABASE_PROD_DB_URL}" \
            --file "${BUNDLE}/data.sql" --use-copy --data-only \
            -x storage.buckets_vectors -x storage.vector_indexes
          /usr/lib/postgresql/17/bin/pg_dump \
            --dbname "${SUPABASE_PROD_DB_URL}" \
            --schema supabase_migrations --no-owner --no-privileges \
            --file "${BUNDLE}/migration-history.sql"

          for required in roles.sql schema.sql data.sql migration-history.sql; do
            [ -s "${BUNDLE}/${required}" ] || {
              echo "ERROR: dump is empty or missing: ${BUNDLE}/${required}"
              echo 'Contents of the work directory, to show where the CLI actually wrote:'
              ls -la "${WORK_DIR}" "${BUNDLE}" || true
              exit 1
            }
          done

          # The dump must actually carry the account data, not merely exist.
          grep -Eq '(COPY|INSERT INTO)[[:space:]]+"?auth"?\."?users"?' "${BUNDLE}/data.sql" || {
            echo 'ERROR: data.sql does not contain auth.users; this is not a faithful copy.'
            exit 1
          }

          # Restore order matters. prepare-disposable-restore-target.sql revokes
          # the TARGET's default table privileges before any object exists, so
          # restored objects cannot inherit grants the source revoked. It runs
          # after roles.sql and before schema.sql.
          psql "${LOCAL_DB_URL}" -X --single-transaction -v ON_ERROR_STOP=1 --file "${BUNDLE}/roles.sql"
          psql "${LOCAL_DB_URL}" -X --single-transaction -v ON_ERROR_STOP=1 \
            --file "${ROLLOUT}/prepare-disposable-restore-target.sql"
          psql "${LOCAL_DB_URL}" -X --single-transaction -v ON_ERROR_STOP=1 --file "${BUNDLE}/schema.sql"
          psql "${LOCAL_DB_URL}" -X --single-transaction -v ON_ERROR_STOP=1 \
            --command 'SET session_replication_role = replica' --file "${BUNDLE}/data.sql"
          psql "${LOCAL_DB_URL}" -X --single-transaction -v ON_ERROR_STOP=1 \
            --file "${ROLLOUT}/managed-schema-customizations.sql"
          psql "${LOCAL_DB_URL}" -X --single-transaction -v ON_ERROR_STOP=1 --file "${BUNDLE}/migration-history.sql"

          restored="$(psql "${LOCAL_DB_URL}" -X -q -v ON_ERROR_STOP=1 -A -t -c \
            'select count(*) from supabase_migrations.schema_migrations')"
          [ "${restored}" = "${SOURCE_CONTRACT}" ] || {
            echo "ERROR: restored target holds ${restored} migrations, expected ${SOURCE_CONTRACT}."
            exit 1
          }

          # Prove the target carries Production's privilege shape before
          # rehearsing onto it, rather than discovering it six migrations in.
          leaked="$(psql "${LOCAL_DB_URL}" -X -q -v ON_ERROR_STOP=1 -A -t -c \
            "select count(*) from information_schema.role_table_grants
              where table_schema = 'public'
                and table_name = 'season_fixtures'
                and grantee in ('anon','authenticated')")"
          [ "${leaked}" = "0" ] || {
            echo "ERROR: restored target grants season_fixtures to browser roles (${leaked} grants); Production grants none."
            echo 'The restore did not carry the source privilege shape, so this is not a rehearsal of Production.'
            exit 1
          }
          echo "Disposable target restored at contract ${restored} with Production's privilege shape."

      - name: Record what the batch will have to replay onto
        shell: bash
        run: |
          set -euo pipefail
          # Contract 152 backfills every league invite code into the new shared
          # namespace and REFUSES the migration if it covered fewer leagues than
          # exist. That count is read from the restored copy BEFORE the apply, so
          # the verification below compares against measurement rather than
          # against a number written into this file.
          #
          # This step asks ONLY what the contract-151 schema can answer. Its
          # first version also counted private competitions with a null `name` —
          # and `name` is a column contract 152 ADDS, so the query failed with
          # `column "name" does not exist` on run 31445831137, before the apply
          # that would have created it. A pre-apply probe cannot read post-apply
          # columns; how many private competitions exist is the question that
          # matters here, and it is answerable at 151.
          psql "${LOCAL_DB_URL}" -X -q -v ON_ERROR_STOP=1 -A -t -c "
            select json_build_object(
              'leagues_with_code', (select count(*) from public.leagues where invite_code is not null),
              'private_competitions', (select count(*) from public.bonus_competitions where visibility_kind = 'private')
            )
          " > "${WORK_DIR}/preconditions.json"
          cat "${WORK_DIR}/preconditions.json"

      - name: Rehearse the forward apply on the disposable target
        shell: bash
        run: |
          set -euo pipefail

          # The repository moves faster than a pinned boundary, and it always
          # will: a contract above 157 can land on main between this file being
          # written and this run happening. `supabase db push` applies
          # everything pending, so without this it would carry an unauthorised
          # contract into a rehearsal pinned to 157.
          #
          # Anything above the target is moved out of the tree for the duration
          # and restored by the step below, which runs even on failure.
          mkdir -p "${WORK_DIR}/later-migrations"
          : > "${WORK_DIR}/moved-files.txt"
          for file in $(git ls-files 'supabase/migrations/*.sql' | sort); do
            filename="$(basename "${file}")"
            version="${filename:0:14}"
            if [[ "${version}" > "${TARGET_VERSION}" ]]; then
              mv "${file}" "${WORK_DIR}/later-migrations/${filename}"
              printf '%s\n' "${file}" >> "${WORK_DIR}/moved-files.txt"
            fi
          done
          if [ -s "${WORK_DIR}/moved-files.txt" ]; then
            echo 'Held back as ABOVE the pinned target, not rehearsed here:'
            cat "${WORK_DIR}/moved-files.txt"
          fi

          supabase db push --db-url "${LOCAL_DB_URL}" --dry-run \
            > "${WORK_DIR}/dry-run.txt" 2>&1
          cat "${WORK_DIR}/dry-run.txt"

          grep -oE '[0-9]{14}_[A-Za-z0-9_-]+\.sql' "${WORK_DIR}/dry-run.txt" \
            | awk '!seen[$0]++' > "${WORK_DIR}/dry-run-migrations.txt"
          expected=$(cat <<'EOF'
          20260810180000_private_container_identity.sql
          20260810190000_private_season_lms.sql
          20260810200000_private_season_cup.sql
          20260810210000_universal_invite_resolver.sql
          20260810220000_season_wrapped_archive.sql
          20260810230000_player_preferences.sql
          EOF
          )
          actual="$(cat "${WORK_DIR}/dry-run-migrations.txt")"
          [ "${actual}" = "${expected}" ] || {
            echo 'ERROR: rehearsal dry run is not exactly the approved 151-to-157 batch.'
            printf 'Expected:\n%s\nActual:\n%s\n' "${expected}" "${actual}"
            exit 1
          }

          supabase db push --db-url "${LOCAL_DB_URL}" 2>&1 | tee "${WORK_DIR}/apply.txt"

      - name: Restore the repository migration tree in the runner
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          # Runs even when the rehearsal failed, so a later step or a rerun on
          # this runner never sees a tree with migrations missing.
          if [ -f "${WORK_DIR}/moved-files.txt" ]; then
            while IFS= read -r file; do
              [ -n "${file}" ] || continue
              filename="$(basename "${file}")"
              if [ -e "${WORK_DIR}/later-migrations/${filename}" ]; then
                mv "${WORK_DIR}/later-migrations/${filename}" "${file}"
              fi
            done < "${WORK_DIR}/moved-files.txt"
          fi

      - name: Verify the rehearsed result reaches exactly contract 157
        shell: bash
        run: |
          set -euo pipefail
          psql "${LOCAL_DB_URL}" -X -q -v ON_ERROR_STOP=1 -A -t -c "
            select json_build_object(
              'migration_count', (select count(*) from supabase_migrations.schema_migrations),
              'latest_version', (select version from supabase_migrations.schema_migrations order by version desc limit 1),
              'latest_name', (select name from supabase_migrations.schema_migrations order by version desc limit 1),
              'auth_users', (select count(*) from auth.users),
              'profiles', (select count(*) from public.profiles),
              'entries', (select count(*) from public.entries),
              'leagues', (select count(*) from public.leagues),
              'league_members', (select count(*) from public.league_members),
              'score_events', (select count(*) from public.score_events),
              'entry_totals', (select count(*) from public.entry_totals),
              'leagues_with_code', (select count(*) from public.leagues where invite_code is not null),
              'registry_league_rows', (
                select count(*) from public.invite_code_registry where league_id is not null
              ),
              'registry_competition_rows', (
                select count(*) from public.invite_code_registry where competition_id is not null
              ),
              'private_competitions', (
                select count(*) from public.bonus_competitions where visibility_kind = 'private'
              ),
              'season_wrapped_rows', (select count(*) from public.season_wrapped),
              'competition_follow_rows', (select count(*) from public.competition_follows),
              'pinned_rival_rows', (select count(*) from public.pinned_rivals),
              'internal_table_browser_grants', (
                select count(*) from information_schema.role_table_grants
                 where table_schema = 'public'
                   and table_name in ('invite_code_registry', 'season_wrapped')
                   and grantee in ('anon', 'authenticated', 'PUBLIC')
              ),
              'new_rpcs_granted_to_authenticated', (
                select count(distinct routine_name) from information_schema.role_routine_grants
                 where routine_schema = 'public' and grantee = 'authenticated'
                   and routine_name in (
                     'create_private_season_lms', 'join_private_competition',
                     'create_private_season_cup', 'launch_private_season_cup',
                     'resolve_invite_code', 'get_season_wrapped',
                     'set_competition_follow', 'set_onboarding_progress',
                     'set_pinned_rival', 'get_my_preferences')
              ),
              'new_rpcs_reachable_anonymously', (
                select count(*) from information_schema.role_routine_grants
                 where routine_schema = 'public' and grantee in ('anon', 'PUBLIC')
                   and routine_name in (
                     'create_private_season_lms', 'join_private_competition',
                     'create_private_season_cup', 'launch_private_season_cup',
                     'resolve_invite_code', 'get_season_wrapped',
                     'set_competition_follow', 'set_onboarding_progress',
                     'set_pinned_rival', 'get_my_preferences')
              ),
              'public_join_refuses_private', (
                select pg_catalog.pg_get_functiondef(p.oid) like '%competition is private%'
                  from pg_catalog.pg_proc p
                  join pg_catalog.pg_namespace n on n.oid = p.pronamespace
                 where n.nspname = 'public' and p.proname = 'join_competition_game'
              ),
              'euro_publication_state', (select state::text from predictor_internal.euro_publication_state)
            )
          " > "${WORK_DIR}/target-state.json"
          cat "${WORK_DIR}/target-state.json"

          TARGET_STATE_FILE="${WORK_DIR}/target-state.json" \
          PRECONDITIONS_FILE="${WORK_DIR}/preconditions.json" \
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          const state = JSON.parse(fs.readFileSync(process.env.TARGET_STATE_FILE, 'utf8'))
          const before = JSON.parse(fs.readFileSync(process.env.PRECONDITIONS_FILE, 'utf8'))

          const expected = {
            migration_count: Number(process.env.TARGET_CONTRACT),
            latest_version: process.env.TARGET_VERSION,
            latest_name: process.env.TARGET_NAME,
            // The new containers arrive EMPTY. Nothing in this batch creates a
            // competition, finalises a season or records a preference; if any
            // of these is non-zero a migration did something nobody approved.
            season_wrapped_rows: 0,
            competition_follow_rows: 0,
            pinned_rival_rows: 0,
            // Contract 152 registers league codes only. A competition row here
            // would mean a private competition was invented by a migration.
            registry_competition_rows: 0,
            // Neither new table is browser-reachable. A player who can read the
            // registry can enumerate every private competition on the platform.
            internal_table_browser_grants: 0,
            // All ten new reads and writes are for signed-in players only.
            // Making one of them anonymous is a publication decision and this
            // is not where it gets taken.
            new_rpcs_granted_to_authenticated: 10,
            new_rpcs_reachable_anonymously: 0,
            // Contract 153 narrowed the public join. This is the privacy hole
            // it closed, so it is asserted rather than assumed.
            public_join_refuses_private: true,
            // Contract 143 is untouched by a batch about private containers.
            euro_publication_state: 'hidden',
          }
          for (const [key, want] of Object.entries(expected)) {
            if (String(state[key]) !== String(want)) {
              console.error(`ERROR: rehearsed ${key} is ${state[key]}, expected ${want}.`)
              process.exit(1)
            }
          }

          // The backfill covered EVERY league, measured against the count read
          // from the restored copy before the apply rather than against a
          // number written here. Contract 152's own DO block refuses a partial
          // backfill; this proves the assertion actually had leagues to cover.
          if (String(state.registry_league_rows) !== String(before.leagues_with_code)) {
            console.error(
              `ERROR: backfill covered ${state.registry_league_rows} of ${before.leagues_with_code} league codes.`)
            process.exit(1)
          }
          if (String(state.leagues_with_code) !== String(before.leagues_with_code)) {
            console.error('ERROR: the batch changed how many leagues hold an invite code.')
            process.exit(1)
          }

          // The NOT VALID identity constraint exists because Development holds
          // an ownerless private competition. Whatever Production holds, the
          // batch must not have changed it.
          if (String(state.private_competitions) !== String(before.private_competitions)) {
            console.error(
              `ERROR: private competitions moved ${before.private_competitions} -> ${state.private_competitions}.`)
            process.exit(1)
          }

          console.log('Rehearsal reached exactly contract 157.')
          console.log(`Backfill covered all ${state.registry_league_rows} league invite codes.`)
          console.log(`Private competitions on the restored copy: ${state.private_competitions}.`)
          NODE

      - name: Shred the plaintext dumps and stop the disposable target
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          # data.sql carries auth.users in the clear. This job uploads no
          # artifact, so the bundle must not survive the runner either.
          if [ -d "${WORK_DIR}/bundle" ]; then
            find "${WORK_DIR}/bundle" -type f -exec shred -u {} + 2>/dev/null || true
            rm -rf "${WORK_DIR}/bundle"
          fi
          supabase stop --no-backup --workdir "${WORK_DIR}" || true
