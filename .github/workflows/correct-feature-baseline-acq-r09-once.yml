name: Correct feature baseline ACQ-R09 once

on:
  push:
    branches:
      - docs/reconcile-feature-baseline-2026-08-05
    paths:
      - scripts/correct-feature-baseline-acq-r09-once.py
      - .github/workflows/correct-feature-baseline-acq-r09-once.yml

permissions:
  contents: write

jobs:
  correct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/reconcile-feature-baseline-2026-08-05
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Correct the ACQ-R09 boundary
        run: python scripts/correct-feature-baseline-acq-r09-once.py
      - name: Remove one-run tooling and commit
        run: |
          rm scripts/correct-feature-baseline-acq-r09-once.py
          rm .github/workflows/correct-feature-baseline-acq-r09-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/quality/feature-baseline.md scripts/correct-feature-baseline-acq-r09-once.py .github/workflows/correct-feature-baseline-acq-r09-once.yml
          git commit -m "Docs: correct the ACQ-R09 auth boundary"
          git push origin HEAD:docs/reconcile-feature-baseline-2026-08-05
