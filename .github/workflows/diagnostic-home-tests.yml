name: Diagnostic Home tests

on:
  pull_request:
    branches:
      - main
    paths:
      - src/features/home/**
      - src/services/supabase/profile.ts
      - tests/features/home/**
      - .github/workflows/diagnostic-home-tests.yml

permissions:
  contents: read

jobs:
  test-diagnostic:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Capture focused test output
        shell: bash
        run: |
          set +e
          npx vitest run \
            tests/features/home/StatStrip.test.tsx \
            tests/features/home/LeagueSnapshot.test.tsx \
            tests/features/home/HomePageAvailability.test.tsx \
            > test-output.txt 2>&1
          status=$?
          echo "$status" > test-status.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: home-test-diagnostic
          path: |
            test-output.txt
            test-status.txt
          if-no-files-found: error
          retention-days: 1
