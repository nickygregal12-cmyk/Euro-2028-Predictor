              "    const id = entryIdRef.current\n"
              "    if (!id) return\n"
              "    markLocalEdit('ties')\n"
              "    const key = tieKey(orderedTeamIds)\n",
              'tie edit revision',
          )

          provider = replace_once(
              provider,
              "  function setBracketProgression(next: Record<string, ProgressionStage>) {\n"
              "    setProgression(next)\n",
              "  function setBracketProgression(next: Record<string, ProgressionStage>) {\n"
              "    markLocalEdit('progression')\n"
              "    setProgression(next)\n",
              'progression edit revision',
          )

          provider = replace_once(
              provider,
              "  function setGoldenBoot(playerId: string | null) {\n"
              "    setGoldenBootPlayerId(playerId) // optimistic — local state is never rolled back\n",
              "  function setGoldenBoot(playerId: string | null) {\n"
              "    markLocalEdit('goldenBoot')\n"
              "    setGoldenBootPlayerId(playerId) // optimistic — local state is never rolled back\n",
              'golden boot edit revision',
          )

          provider_path.write_text(provider)

