name: Bootstrap REL-002 late-read guard

on:
  push:
    branches:
      - agent/prevent-late-read-overwrite

permissions:
  contents: write

jobs:
  implement-and-verify:
    if: github.event.head_commit.message != 'Guard prediction loads against stale reads'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm

      - name: Apply focused REL-002 implementation
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              return text.replace(old, new, 1)

          provider_path = Path('src/app/providers/PredictionsProvider.tsx')
          provider = provider_path.read_text()

          provider = replace_once(
              provider,
              "type GoldenBootSavePayload = { playerId: string | null }\n",
              "type GoldenBootSavePayload = { playerId: string | null }\n\n"
              "type LoadSlice = 'matches' | 'ties' | 'progression' | 'goldenBoot'\n"
              "type LoadRevisions = Record<LoadSlice, number>\n\n"
              "const createLoadRevisions = (): LoadRevisions => ({\n"
              "  matches: 0,\n"
              "  ties: 0,\n"
              "  progression: 0,\n"
              "  goldenBoot: 0,\n"
              "})\n",
              'load revision types',
          )

          provider = replace_once(
              provider,
              "  const timers = useRef<Record<string, ReturnType<typeof setTimeout>>>({})\n"
              "  const submittingRef = useRef(false)\n",
              "  const timers = useRef<Record<string, ReturnType<typeof setTimeout>>>({})\n"
              "  const submittingRef = useRef(false)\n"
              "  // Each initial best-effort read captures the corresponding local-edit\n"
              "  // revision. A response may populate state only when the user has not\n"
              "  // changed that slice since the read began. This prevents a slow success\n"
              "  // or failure default from replacing newer local work.\n"
              "  const localEditRevisionsRef = useRef<LoadRevisions>(createLoadRevisions())\n\n"
              "  function markLocalEdit(slice: LoadSlice) {\n"
              "    localEditRevisionsRef.current[slice] += 1\n"
              "  }\n\n"
              "  function initialLoadCanApply(slice: LoadSlice, revision: number) {\n"
              "    return localEditRevisionsRef.current[slice] === revision\n"
              "  }\n",
              'load revision ref',
          )

          start_marker = "  useEffect(() => {\n    if (!userId || !tournamentId) {"
          end_marker = "\n  // Hand the match's latest local state to the controller."
          start = provider.find(start_marker)
          end = provider.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('initial load effect markers not found')

          new_effect = '''  useEffect(() => {
    let active = true

    // Entry context is changing (or disappearing). Clear every local slice and
    // version baseline immediately so the previous account/tournament cannot
    // remain visible or receive a delayed save while the next entry loads.
    setReady(false)
    clearDebounceTimers()
    controllerRef.current?.reset()
    entryIdRef.current = null
    setEntryId(null)
    setSubmittedAt(null)
    predictionsRef.current = {}
    setPredictions({})
    setSaveStatus({})
    matchVersionsRef.current = {}
    setTieResolutions([])
    setTieSaveStatus({})
    setProgression({})
    progressionPersistedRef.current = {}
    progressionDesiredRef.current = {}
    progressionVersionsRef.current = {}
    setBracketSaveStatus('idle')
    setGoldenBootPlayerId(null)
    goldenBootVersionRef.current = 0
    setGoldenBootSaveStatus('idle')
    submittingRef.current = false
    setSubmitting(false)
    localEditRevisionsRef.current = createLoadRevisions()

    if (!userId || !tournamentId) {
      return () => {
        active = false
      }
    }

    getOrCreateEntry(userId, tournamentId)
      .then(async (entry) => {
        if (!active) return
        entryIdRef.current = entry.id
        setEntryId(entry.id)
        setSubmittedAt(entry.submittedAt)

        const matchLoadRevision = localEditRevisionsRef.current.matches
        const rows = await fetchMatchPredictions(entry.id)
        if (!active) return
        if (initialLoadCanApply('matches', matchLoadRevision)) {
          const map: Record<string, Prediction> = {}
          const vmap: Record<string, number> = {}
          for (const r of rows) {
            map[r.matchId] = {
              homeScore: r.homeScore,
              awayScore: r.awayScore,
              joker: r.joker,
            }
            vmap[r.matchId] = r.version
          }
          matchVersionsRef.current = vmap
          predictionsRef.current = map
          setPredictions(map)
        }
        setReady(true)

        // These secondary reads remain fail-soft so missing optional data cannot
        // block the entry. Their result/default may only apply if no newer local
        // edit has occurred since the individual read began.
        const tieLoadRevision = localEditRevisionsRef.current.ties
        void fetchTieResolutions(entry.id)
          .then((ties) => {
            if (!active || !initialLoadCanApply('ties', tieLoadRevision)) return
            setTieResolutions(ties.map((t) => ({ teamIds: t.teamIds, order: t.order })))
          })
          .catch(() => {
            if (active && initialLoadCanApply('ties', tieLoadRevision)) {
              setTieResolutions([])
            }
          })

        const progressionLoadRevision = localEditRevisionsRef.current.progression
        void fetchProgression(entry.id)
          .then((progressionRows) => {
            if (
              !active ||
              !initialLoadCanApply('progression', progressionLoadRevision)
            ) {
              return
            }
            const map: Record<string, ProgressionStage> = {}
            const vmap: Record<string, number> = {}
            for (const row of progressionRows) {
              map[row.teamId] = row.stage
              vmap[row.teamId] = row.version
            }
            setProgression(map)
            progressionPersistedRef.current = map
            progressionDesiredRef.current = map
            progressionVersionsRef.current = vmap
          })
          .catch(() => {
            if (
              !active ||
              !initialLoadCanApply('progression', progressionLoadRevision)
            ) {
              return
            }
            setProgression({})
            progressionPersistedRef.current = {}
            progressionDesiredRef.current = {}
            progressionVersionsRef.current = {}
          })

        const goldenBootLoadRevision = localEditRevisionsRef.current.goldenBoot
        void fetchGoldenBoot(entry.id)
          .then((gb) => {
            if (
              !active ||
              !initialLoadCanApply('goldenBoot', goldenBootLoadRevision)
            ) {
              return
            }
            setGoldenBootPlayerId(gb.playerId)
            goldenBootVersionRef.current = gb.version
          })
          .catch(() => {
            if (active && initialLoadCanApply('goldenBoot', goldenBootLoadRevision)) {
              setGoldenBootPlayerId(null)
            }
          })
      })
      .catch(() => {
        if (active) setReady(false)
      })

    return () => {
      active = false
    }
  }, [userId, tournamentId])
'''
          provider = provider[:start] + new_effect + provider[end:]

