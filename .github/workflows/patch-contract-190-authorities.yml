name: Patch Contract 190 authority acknowledgements

on:
  push:
    branches:
      - codex/ai-actionable-bet-evidence-190
    paths:
      - '.github/workflows/patch-contract-190-authorities.yml'

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Acknowledge Contract 190 across live authorities') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/ai-actionable-bet-evidence-190
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Add bounded current-contract note to required live authorities
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          files = [
              'CLAUDE.md',
              'MASTER-TODO.md',
              'docs/roadmap.md',
              'docs/quality/feature-baseline.md',
              'docs/adr/README.md',
              'docs/design/README.md',
              'docs/design/ui-finalisation.md',
              'docs/competition-structure.md',
              'docs/architecture/programme-plan.md',
              'docs/architecture/multi-competition-hub-build-plan.md',
          ]
          note = ("\n> **Contract 190 authority note — 14 August 2026:** the repository contract is 190 through "
                  "`20260814005000_ai_actionable_bet_evidence.sql`. This contract only strengthens private AI betting-evidence "
                  "actionability (`ai.valid_bets`, the insert guard and Bet Builder venue gate); it does not change the product, "
                  "competition, scoring, UI or roadmap authority described in this document. Hosted Development and Production "
                  "remain at 189 until the guarded Contract-190 rollout.\n")
          for name in files:
              path = Path(name)
              text = path.read_text()
              if 'Contract 190 authority note — 14 August 2026' in text:
                  continue
              path.write_text(text.rstrip() + '\n' + note)
          PY
          git diff --check
      - name: Validate all documentation authorities
        shell: bash
        run: |
          npm ci
          npm run check:documentation-authorities -- "$(git merge-base HEAD origin/main)" HEAD
          npx vitest run tests/scripts/documentationContractFreshness.test.ts
          npm run generate:now
          git diff --check
      - name: Commit only authority docs and generated now
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CLAUDE.md MASTER-TODO.md docs/roadmap.md docs/quality/feature-baseline.md docs/adr/README.md docs/design/README.md docs/design/ui-finalisation.md docs/competition-structure.md docs/architecture/programme-plan.md docs/architecture/multi-competition-hub-build-plan.md NOW.md
          git commit -m 'Acknowledge Contract 190 across live authorities'
          git push origin HEAD:codex/ai-actionable-bet-evidence-190
