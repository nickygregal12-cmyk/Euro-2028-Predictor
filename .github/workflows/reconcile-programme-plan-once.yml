name: Reconcile programme plan once

on:
  push:
    branches:
      - docs/reconcile-programme-plan-2026-08-05

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/reconcile-programme-plan-2026-08-05
          fetch-depth: 0
      - name: Apply guarded reconciliation and remove temporary tooling
        run: |
          python scripts/reconcile-programme-plan-once.py
          rm scripts/reconcile-programme-plan-once.py
          rm .github/workflows/reconcile-programme-plan-once.yml
      - name: Commit permanent documentation change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Docs: distinguish current programme progress from the historical snapshot"
          git push origin HEAD:docs/reconcile-programme-plan-2026-08-05
