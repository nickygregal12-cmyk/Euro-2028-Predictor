name: Temporary contract 48 production export

on:
  push:
    branches:
      - temp/contract48-production-export
    paths:
      - .github/workflows/temp-contract48-export.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact release source
        uses: actions/checkout@v4
        with:
          ref: a1664633fd05179670254ce47a10d01131da71d6
          fetch-depth: 1
      - name: Verify exact release source
        run: test "$(git rev-parse HEAD)" = "a1664633fd05179670254ce47a10d01131da71d6"
      - name: Upload canonical migrations
        uses: actions/upload-artifact@v4
        with:
          name: contract48-production-migrations
          path: |
            supabase/migrations/20260727214500_paginated_private_league_standings.sql
            supabase/migrations/20260727221000_private_league_summary_activity.sql
            supabase/migrations/20260728113000_other_player_profiles.sql
            supabase/migrations/20260728122500_h2h_rank_history.sql
          retention-days: 1
