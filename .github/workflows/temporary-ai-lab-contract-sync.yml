name: Temporary AI Lab contract sync

on:
  push:
    branches:
      - codex/ai-lab-vnext-rebuild

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: codex/ai-lab-vnext-rebuild
          fetch-depth: 0

      - name: Reconcile Contract 214 authorities
        shell: python
        run: |
          import json
          from pathlib import Path

          contract_path = Path('config/deployment-contract.json')
          contract = json.loads(contract_path.read_text())
          if contract['contractVersion'] != 213 or contract['requiredMigrationCount'] != 213:
              raise SystemExit(f"Expected repository contract 213, found {contract['contractVersion']}/{contract['requiredMigrationCount']}")
          contract['contractVersion'] = 214
          contract['requiredMigrationCount'] = 214
          note = (
              " Contract 214 ties current AI Lab value evidence to the fixture's canonical newest "
              "non-quarantined forecast. Historical forecast horizons and recommendations remain "
              "immutable audit evidence, but only the canonical horizon may produce the current "
              "BET/PASS and ai.current_fixture_recommendations fails closed while a fresher forecast "
              "awaits value evaluation. Repository-only at merge; hosted rollout is separately guarded."
          )
          if 'Contract 214 ties current AI Lab value evidence' not in contract.get('notes', ''):
              contract['notes'] = contract.get('notes', '').rstrip() + note
          contract_path.write_text(json.dumps(contract, indent=2) + '\n')

          def append_once(path: str, marker: str, text: str) -> None:
              p = Path(path)
              body = p.read_text()
              if marker not in body:
                  p.write_text(body.rstrip() + '\n\n' + text.strip() + '\n')

          append_once(
              'docs/roadmap.md',
              '## Contract 214 review — AI Lab forecast/value currency',
              '''
          ## Contract 214 review — AI Lab forecast/value currency

          Contract 214 is a repository-only consistency correction for the private AI Lab. The value loop keeps historical forecast horizons for audit but assesses only `ai.canonical_fixture_predictions`, and the current-recommendation read fails closed when a fresher canonical forecast has not yet been evaluated. This does not reorder the product roadmap, widen betting exposure, change model-selection policy or close #854: generated Bet Builder slips still need immutable slip-level settlement/performance evidence, and hosted rollout remains a separate guarded milestone.
          ''',
          )

          append_once(
              'docs/quality/current-status.md',
              '**Contract 214 — current value follows the current forecast',
              '''
          **Contract 214 — current value follows the current forecast (23 August 2026), repository only.** A fixture deliberately accumulates immutable forecast horizons as evidence improves. `find_value.py` previously allowed every valid historical horizon to compete for today's betting decision, while the Lab's fixture read displayed only the canonical newest forecast; separately, `ai.current_fixture_recommendations` could continue exposing an older recommendation after a fresher forecast arrived but before value was recalculated. Contract 214 keeps all historical forecasts and recommendations as audit evidence, marks the canonical row in the value candidate read and assesses only that row, and redefines the current recommendation view so a recommendation is current only when it belongs to the canonical forecast. The gap between a fresh forecast and its value run therefore reads as no current decision rather than stale advice. No hosted environment is changed by this repository contract; Development remains at its machine-recorded boundary and Production remains at its own separately authorised boundary.
          ''',
          )

          ops = Path('docs/ops/ops-pending-migrations.md')
          ops_body = ops.read_text()
          ops_body = ops_body.replace(
              '## Current state — repository 213, Production 211, Development 213 (21 August 2026)',
              '## Current state — repository 214, Production 211, Development 213 (23 August 2026)',
              1,
          )
          old_intro = (
              '**Development has completed the 211→213 boundary and is independently verified at 213.** '
              'Production remains at **211**. Contracts 212 and 213 are therefore pending on Production only; '
              'the next sequence is the reviewed Production backup → disposable-copy rehearsal → guarded rollout → '
              'independent postflight. PR #969 remains held back until Production is also 213; its migration number '
              'is not part of the current repository contract yet.'
          )
          new_intro = (
              '**Development is independently verified at 213; the repository is now 214 and Production remains at 211.** '
              'Contract 214 is therefore pending on both hosted environments. Contracts 212 and 213 remain pending on '
              'Production only. Every hosted mutation still requires its own reviewed boundary, backup/rehearsal where '
              'applicable, guarded rollout and independent postflight; repository progress is not rollout authority.'
          )
          if old_intro in ops_body:
              ops_body = ops_body.replace(old_intro, new_intro, 1)
          marker = '> **Contract 214 repository candidate — current value follows the canonical forecast'
          if marker not in ops_body:
              insert_at = ops_body.find('\n> **Contract 213 is DESTRUCTIVE')
              block = '''

          > **Contract 214 repository candidate — current value follows the canonical forecast (23 August 2026):** `20260823001000_ai_canonical_value_currency.sql` is **not hosted**. It redefines only the private `ai.current_fixture_recommendations` view: a decision is current only if its prediction is the fixture's canonical newest non-quarantined forecast. Historical recommendations remain append-only evidence. The companion Python change keeps historical candidate horizons inspectable but evaluates only the canonical-marked row, so an older horizon cannot create today's immutable paper advice while the Lab shows a newer probability. pgTAP suite **261** proves both fail-closed currency and preservation of the old audit row. No provider call, paid odds credit, public betting exposure or player-owned row is involved.
          '''
              if insert_at >= 0:
                  ops_body = ops_body[:insert_at] + block.rstrip() + ops_body[insert_at:]
              else:
                  ops_body = ops_body.rstrip() + block + '\n'
          ops.write_text(ops_body)

          append_once(
              'docs/quality/feature-baseline.md',
              '## Contract 214 review — private AI Lab evidence currency',
              '''
          ## Contract 214 review — private AI Lab evidence currency

          Contract 214 hardens an existing private administrative research capability rather than creating a new compact user feature or safeguard identifier. Historical forecasts remain inspectable, but only the canonical newest forecast may produce the current value decision and stale recommendation evidence fails closed across a forecast-version change. No public betting surface, scoring rule, competition state, player data boundary or hosted classification changes here, so the compact `FEAT-*` / `SAFE-*` rows above are unchanged.
          ''',
          )

          append_once(
              'docs/adr/README.md',
              '## Contract 214 review — no new product decision',
              '''
          ## Contract 214 review — no new product decision

          Contract 214 requires no new ADR. It is a consistency fix inside the already-private AI Lab: the betting decision shown as current must be derived from the same canonical forecast the Lab shows as current, while historical forecasts/recommendations remain evidence. It changes neither the accepted model-selection/publication authority nor the boundary that this is paper research with no public bet placement. Hosted rollout remains separately authorised.
          ''',
          )

          master = Path('MASTER-TODO.md').read_text()
          if 'Contract 214 in PR #997 closes forecast/value currency' not in master:
              raise SystemExit('MASTER-TODO.md Contract 214 disposition is missing')

      - name: Regenerate current-state surfaces
        run: node scripts/generate-now.mjs

      - name: Remove one-shot helper and commit the reconciliation
        run: |
          git rm .github/workflows/temporary-ai-lab-contract-sync.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/deployment-contract.json NOW.md MASTER-TODO.md docs/roadmap.md docs/quality/current-status.md docs/ops/ops-pending-migrations.md docs/quality/feature-baseline.md docs/adr/README.md
          git diff --cached --check
          git commit -m "docs: reconcile AI Lab contract 214"
          git push origin HEAD:codex/ai-lab-vnext-rebuild
