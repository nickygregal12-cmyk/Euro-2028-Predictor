name: Session reconcile DFA batch 2 status

on:
  push:
    branches:
      - agent/scottish-playable-development-journey

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Reconcile accepted requirement statuses
        shell: python
        run: |
          from pathlib import Path

          path = Path('docs/quality/accepted-requirements.md')
          text = path.read_text()
          replacements = {
              '| `DFA-003` | Reusable shirt-style club identity uses canonical team identity, bounded patterns/colours, accessible label, neutral fallback, light/dark support and layout-stable repeated rendering; it is never the sole identifier | Canonical domestic team identity and target design-system adoption | Reusable component, gallery/visual/accessibility contracts and adoption on the first high-value football surfaces | Accepted — unimplemented |':
              '| `DFA-003` | Reusable shirt-style club identity uses canonical team identity, bounded patterns/colours, accessible label, neutral fallback, light/dark support and layout-stable repeated rendering; it is never the sole identifier | Canonical domestic team identity and target design-system adoption | Reusable component, gallery/visual/accessibility contracts and adoption on the first high-value football surfaces | **Implemented** — reusable identity and high-value domestic adoption are covered by executable visual/accessibility contracts |',
              '| `DFA-005` | Every shipped non-root weekly route has a deterministic logical parent independent of browser history, including game, private-container, Match Centre, player/H2H, failure and not-found routes | `DFA-004` route convergence | Executable route/navigation matrix proving every shipped route has its required parent/fallback and useful Match Centre return context | Accepted — unimplemented as an exhaustive contract |':
              '| `DFA-005` | Every shipped non-root weekly route has a deterministic logical parent independent of browser history, including game, private-container, Match Centre, player/H2H, failure and not-found routes | `DFA-004` route convergence | Executable route/navigation matrix proving every shipped route has its required parent/fallback and useful Match Centre return context | **Implemented** — the deterministic parent model and exhaustive shipped-route matrix are executable |',
              '| `DFA-006` | Competition/game cards expose meaningful state and direct action; Competition Play answers “What do I need to do this week?” from game-owned truth; each game has the accepted compact secondary navigation | Bounded game/action reads | Component/browser tests for Match Predictor, LMS and Championship action states plus Play aggregation and secondary navigation | Accepted — partially implemented, full cross-game model unimplemented |':
              '| `DFA-006` | Competition/game cards expose meaningful state and direct action; Competition Play answers “What do I need to do this week?” from game-owned truth; each game has the accepted compact secondary navigation | Bounded game/action reads | Component/browser tests for Match Predictor, LMS and Championship action states plus Play aggregation and secondary navigation | Accepted — partially implemented: compact game secondary navigation is delivered; meaningful action cards and cross-game Play aggregation remain unimplemented |',
              '| `DFA-007` | Scottish Premiership is the first truthful Development rehearsal: real Matchweek 1 results feed normal protected scoring from lock-consistent seeded test predictions; LMS and seeded Predictor Championship begin at Matchweek 2 with no invented Matchweek 1 history | Current Development contract batch applied; protected result/scoring authorities; season competition setup | Seed/rehearsal evidence showing real MW1 football, reload-persistent MW2 LMS pick, Championship opponent/fixtures/phase/table and normal Match Predictor points feed | Accepted — unimplemented as the complete rehearsal |':
              '| `DFA-007` | Scottish Premiership is the first truthful Development rehearsal: real Matchweek 1 results feed normal protected scoring from lock-consistent seeded test predictions; LMS and seeded Predictor Championship begin at Matchweek 2 with no invented Matchweek 1 history | Current Development contract batch applied; protected result/scoring authorities; season competition setup | Seed/rehearsal evidence showing real MW1 football, reload-persistent MW2 LMS pick, Championship opponent/fixtures/phase/table and normal Match Predictor points feed | Accepted — partially rehearsed: real MW1 result truth and reload-persistent MW2 LMS are proven; lock-consistent MW1 points evidence and the seeded Championship journey remain incomplete |',
          }

          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'Expected exactly one status row to replace: {old[:20]}')
              text = text.replace(old, new)

          path.write_text(text)
      - name: Remove one-shot workflow and verify scope
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/session-reconcile-dfa-batch2-status.yml
          git diff --check
          changed="$(git diff --name-only)"
          test "$changed" = 'docs/quality/accepted-requirements.md'
      - name: Commit reconciliation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/quality/accepted-requirements.md
          git commit -m 'Reconcile delivered DFA requirement status'
          git push origin HEAD:agent/scottish-playable-development-journey