name: Production 157 to 158 rehearsal

# Manual, and READ-ONLY against hosted Production. The only migration write in
# this workflow targets the disposable local restore on 127.0.0.1:54322.
#
# WHY THIS BOUNDARY NEEDS A REHEARSAL MORE THAN THE LAST ONE DID. Contract 158
# is the first Production migration in this sequence that is DESTRUCTIVE by
# `check-migration-additive.mjs`: `get_league_preview` is dropped and recreated,
# because its return type narrows and PostgreSQL cannot narrow one with
# `create or replace`. There is a window, inside one transaction, in which that
# function does not exist.
#
# It also repairs a coupling that only exists on a database which already holds
# contracts 152 to 155 — the private-container and shared-registry code
# constraints, and contract 155's resolver, all widening from `{6}` to `{6,16}`
# so the twelve-character codes the new generator issues are accepted at all.
# That repair is exactly the kind of thing that is right in the migration text
# and wrong against real rows, which is what a rehearsal is for.

on:
  workflow_dispatch:
    inputs:
      project_ref:
        description: Exact Production project ref confirmation
        required: true
      confirmation:
        description: Type REHEARSE-PRODUCTION-157-TO-158 to proceed
        required: true

permissions:
  contents: read

concurrency:
  group: production-157-to-158-rehearsal
  cancel-in-progress: false

env:
  EXPECTED_PROJECT_REF: vkfnsqdyhvtwyqkisxhk
  FORBIDDEN_DEVELOPMENT_REF: iouzoutneyjpugbbtdem
  CONFIRMATION_PHRASE: REHEARSE-PRODUCTION-157-TO-158
  SOURCE_CONTRACT: '157'
  SOURCE_VERSION: '20260810230000'
  SOURCE_NAME: player_preferences
  TARGET_CONTRACT: '158'
  TARGET_VERSION: '20260811000000'
  TARGET_NAME: invite_code_hardening
  WORK_DIR: /tmp/production-157-to-158-rehearsal
  LOCAL_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres

jobs:
  rehearse:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Refuse an unsafe dispatch or repository state
        env:
          INPUT_PROJECT_REF: ${{ inputs.project_ref }}
          INPUT_CONFIRMATION: ${{ inputs.confirmation }}
        shell: bash
        run: |
          set -euo pipefail
          [ "${INPUT_CONFIRMATION}" = "${CONFIRMATION_PHRASE}" ] || {
            echo "ERROR: confirmation phrase does not match ${CONFIRMATION_PHRASE}."
            exit 1
          }
          [ "${INPUT_PROJECT_REF}" = "${EXPECTED_PROJECT_REF}" ] || {
            echo 'ERROR: project ref confirmation does not name the Production project.'
            exit 1
          }
          [ "${GITHUB_REF}" = 'refs/heads/main' ] || {
            echo 'ERROR: this workflow runs only from refs/heads/main.'
            exit 1
          }
          git fetch --no-tags origin main
          [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" ] || {
            echo 'ERROR: checked-out HEAD is not exact origin/main.'
            exit 1
          }
          [ -z "$(git status --porcelain=v1 --untracked-files=all)" ] || {
            echo 'ERROR: checkout is not clean.'
            exit 1
          }

      - name: Prove the repository still holds exactly the approved contract 158
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${WORK_DIR}"
          actual="$(git ls-files 'supabase/migrations/*.sql' | sort | sed -n '158p' | xargs -n1 basename)"
          [ "${actual}" = "${TARGET_VERSION}_${TARGET_NAME}.sql" ] || {
            echo "ERROR: repository row 158 is ${actual}, not the approved contract."
            exit 1
          }
          source_row="$(git ls-files 'supabase/migrations/*.sql' | sort | sed -n '157p' | xargs -n1 basename)"
          [ "${source_row}" = "${SOURCE_VERSION}_${SOURCE_NAME}.sql" ] || {
            echo "ERROR: repository row 157 is ${source_row}, not the rehearsed source boundary."
            exit 1
          }

          # Production is never the first hosted environment to see a migration.
          development_count="$(node -p "require('./config/development-hosted-contract.json').requiredMigrationCount")"
          [ "${development_count}" -ge "${TARGET_CONTRACT}" ] || {
            echo "ERROR: Development is only contract ${development_count}; target is ${TARGET_CONTRACT}."
            exit 1
          }

      - name: Report what the additive checker says, without pretending it passes
        shell: bash
        run: |
          set -euo pipefail
          # This one is EXPECTED to be refused, and that refusal is why this
          # rehearsal exists. Recording the reason beats a silent skip.
          if node scripts/check-migration-additive.mjs \
              "supabase/migrations/${TARGET_VERSION}_${TARGET_NAME}.sql" > "${WORK_DIR}/additive.txt" 2>&1; then
            echo 'Contract 158 reports as additive.'
          else
            echo 'Contract 158 is DESTRUCTIVE, as expected. The checker said:'
            cat "${WORK_DIR}/additive.txt"
            echo 'That is precisely why this boundary gets a backup and this rehearsal.'
          fi

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.2

      - uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf
        with:
          version: 2.109.1
          github-token: ${{ github.token }}

      - name: Install PostgreSQL 17 client tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17

      - name: Preflight the Production secret without printing it
        env:
          SUPABASE_PROD_DB_URL: ${{ secrets.SUPABASE_PROD_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${SUPABASE_PROD_DB_URL}" ] || {
            echo 'ERROR: repository secret SUPABASE_PROD_DB_URL is not set.'
            exit 1
          }
          case "${SUPABASE_PROD_DB_URL}" in
            *"${FORBIDDEN_DEVELOPMENT_REF}"*)
              echo 'ERROR: Production secret resolves to Development.'
              exit 1
              ;;
            *"${EXPECTED_PROJECT_REF}"*) ;;
            *)
              echo 'ERROR: Production secret does not name the expected Production project.'
              exit 1
              ;;
          esac

      - name: Prove the live source is exactly contract 157 (read-only)
        env:
          SUPABASE_PROD_DB_URL: ${{ secrets.SUPABASE_PROD_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          psql "${SUPABASE_PROD_DB_URL}" -X -q -v ON_ERROR_STOP=1 -A -t -c "
            select json_build_object(
              'migration_count', (select count(*) from supabase_migrations.schema_migrations),
              'latest_version', (select version from supabase_migrations.schema_migrations order by version desc limit 1),
              'latest_name', (select name from supabase_migrations.schema_migrations order by version desc limit 1)
            )
          " > "${WORK_DIR}/source-state.json"
          cat "${WORK_DIR}/source-state.json"

          SOURCE_STATE_FILE="${WORK_DIR}/source-state.json" node --input-type=module <<'NODE'
          import fs from 'node:fs'
          const state = JSON.parse(fs.readFileSync(process.env.SOURCE_STATE_FILE, 'utf8'))
          const expected = {
            migration_count: Number(process.env.SOURCE_CONTRACT),
            latest_version: process.env.SOURCE_VERSION,
            latest_name: process.env.SOURCE_NAME,
          }
          for (const [key, want] of Object.entries(expected)) {
            if (String(state[key]) !== String(want)) {
              console.error(`ERROR: live Production ${key} is ${state[key]}, expected ${want}.`)
              process.exit(1)
            }
          }
          console.log('Live Production is exactly the rehearsed contract-157 source boundary.')
          NODE

      - name: Take a fresh Production dump and restore it to a disposable local target
        env:
          SUPABASE_PROD_DB_URL: ${{ secrets.SUPABASE_PROD_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          supabase init --force --workdir "${WORK_DIR}" >/dev/null 2>&1 || true
          supabase start --workdir "${WORK_DIR}"

          # READ-ONLY against Production: dumps only. The absolute pg_dump path
          # is required — a bare `pg_dump` resolves to Ubuntu's 16 client, which
          # refuses against a 17.6 server. The four-file Supabase-native dump is
          # used rather than one archive because the archive route restores
          # without privileges, and this contract asserts privilege facts.
          BUNDLE="${WORK_DIR}/bundle"
          ROLLOUT="${GITHUB_WORKSPACE}/scripts/database-rollout"
          mkdir -p "${BUNDLE}"

          supabase db dump --db-url "${SUPABASE_PROD_DB_URL}" \
            --file "${BUNDLE}/roles.sql" --role-only
          supabase db dump --db-url "${SUPABASE_PROD_DB_URL}" \
            --file "${BUNDLE}/schema.sql"
          supabase db dump --db-url "${SUPABASE_PROD_DB_URL}" \
            --file "${BUNDLE}/data.sql" --use-copy --data-only \
            -x storage.buckets_vectors -x storage.vector_indexes
          /usr/lib/postgresql/17/bin/pg_dump \
            --dbname "${SUPABASE_PROD_DB_URL}" \
            --schema supabase_migrations --no-owner --no-privileges \
            --file "${BUNDLE}/migration-history.sql"

          for required in roles.sql schema.sql data.sql migration-history.sql; do
            [ -s "${BUNDLE}/${required}" ] || {
              echo "ERROR: dump is empty or missing: ${BUNDLE}/${required}"
              ls -la "${WORK_DIR}" "${BUNDLE}" || true
              exit 1
            }
          done

          grep -Eq '(COPY|INSERT INTO)[[:space:]]+"?auth"?\."?users"?' "${BUNDLE}/data.sql" || {
            echo 'ERROR: data.sql does not contain auth.users; this is not a faithful copy.'
            exit 1
          }

          psql "${LOCAL_DB_URL}" -X --single-transaction -v ON_ERROR_STOP=1 --file "${BUNDLE}/roles.sql"
          psql "${LOCAL_DB_URL}" -X --single-transaction -v ON_ERROR_STOP=1 \
            --file "${ROLLOUT}/prepare-disposable-restore-target.sql"
          psql "${LOCAL_DB_URL}" -X --single-transaction -v ON_ERROR_STOP=1 --file "${BUNDLE}/schema.sql"
          psql "${LOCAL_DB_URL}" -X --single-transaction -v ON_ERROR_STOP=1 \
            --command 'SET session_replication_role = replica' --file "${BUNDLE}/data.sql"
          psql "${LOCAL_DB_URL}" -X --single-transaction -v ON_ERROR_STOP=1 \
            --file "${ROLLOUT}/managed-schema-customizations.sql"
          psql "${LOCAL_DB_URL}" -X --single-transaction -v ON_ERROR_STOP=1 --file "${BUNDLE}/migration-history.sql"

          restored="$(psql "${LOCAL_DB_URL}" -X -q -v ON_ERROR_STOP=1 -A -t -c \
            'select count(*) from supabase_migrations.schema_migrations')"
          [ "${restored}" = "${SOURCE_CONTRACT}" ] || {
            echo "ERROR: restored target holds ${restored} migrations, expected ${SOURCE_CONTRACT}."
            exit 1
          }

          leaked="$(psql "${LOCAL_DB_URL}" -X -q -v ON_ERROR_STOP=1 -A -t -c \
            "select count(*) from information_schema.role_table_grants
              where table_schema = 'public'
                and table_name = 'season_fixtures'
                and grantee in ('anon','authenticated')")"
          [ "${leaked}" = "0" ] || {
            echo "ERROR: restored target grants season_fixtures to browser roles; Production grants none."
            exit 1
          }
          echo "Disposable target restored at contract ${restored} with Production's privilege shape."

      - name: Record the codes that already exist, before anything widens
        shell: bash
        run: |
          set -euo pipefail
          # Existing codes must keep working. Contract 158 rewrites no row, and
          # the check below compares against what was actually there rather than
          # a number written into this file.
          psql "${LOCAL_DB_URL}" -X -q -v ON_ERROR_STOP=1 -A -t -c "
            select json_build_object(
              'leagues_with_code', (select count(*) from public.leagues where invite_code is not null),
              'six_char_codes', (
                select count(*) from public.leagues
                 where invite_code is not null and length(invite_code) = 6
              ),
              'registry_rows', (select count(*) from public.invite_code_registry)
            )
          " > "${WORK_DIR}/preconditions.json"
          cat "${WORK_DIR}/preconditions.json"

      - name: Rehearse the forward apply on the disposable target
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${WORK_DIR}/later-migrations"
          : > "${WORK_DIR}/moved-files.txt"
          for file in $(git ls-files 'supabase/migrations/*.sql' | sort); do
            filename="$(basename "${file}")"
            version="${filename:0:14}"
            if [[ "${version}" > "${TARGET_VERSION}" ]]; then
              mv "${file}" "${WORK_DIR}/later-migrations/${filename}"
              printf '%s\n' "${file}" >> "${WORK_DIR}/moved-files.txt"
            fi
          done
          if [ -s "${WORK_DIR}/moved-files.txt" ]; then
            echo 'Held back as ABOVE the pinned target, not rehearsed here:'
            cat "${WORK_DIR}/moved-files.txt"
          fi

          supabase db push --db-url "${LOCAL_DB_URL}" --dry-run \
            > "${WORK_DIR}/dry-run.txt" 2>&1
          cat "${WORK_DIR}/dry-run.txt"

          grep -oE '[0-9]{14}_[A-Za-z0-9_-]+\.sql' "${WORK_DIR}/dry-run.txt" \
            | awk '!seen[$0]++' > "${WORK_DIR}/pending.txt"
          expected="${TARGET_VERSION}_${TARGET_NAME}.sql"
          actual="$(cat "${WORK_DIR}/pending.txt")"
          [ "${actual}" = "${expected}" ] || {
            echo 'ERROR: rehearsal dry run is not exactly contract 158.'
            printf 'Expected:\n%s\nActual:\n%s\n' "${expected}" "${actual}"
            exit 1
          }

          supabase db push --db-url "${LOCAL_DB_URL}" 2>&1 | tee "${WORK_DIR}/apply.txt"

      - name: Restore the repository migration tree in the runner
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "${WORK_DIR}/moved-files.txt" ]; then
            while IFS= read -r file; do
              [ -n "${file}" ] || continue
              filename="$(basename "${file}")"
              if [ -e "${WORK_DIR}/later-migrations/${filename}" ]; then
                mv "${WORK_DIR}/later-migrations/${filename}" "${file}"
              fi
            done < "${WORK_DIR}/moved-files.txt"
          fi

      - name: Verify the rehearsed result, including the coupling it repairs
        shell: bash
        run: |
          set -euo pipefail
          psql "${LOCAL_DB_URL}" -X -q -v ON_ERROR_STOP=1 -A -t -c "
            select json_build_object(
              'migration_count', (select count(*) from supabase_migrations.schema_migrations),
              'latest_version', (select version from supabase_migrations.schema_migrations order by version desc limit 1),
              'latest_name', (select name from supabase_migrations.schema_migrations order by version desc limit 1),
              'generated_code_length', length(public.gen_invite_code()),
              'competition_shape_widened', (
                select count(*) from pg_constraint
                 where conname = 'bonus_competitions_invite_code_shape'
                   and pg_get_constraintdef(oid) like '%6,16%'
              ),
              'registry_shape_widened', (
                select count(*) from pg_constraint
                 where conname = 'invite_code_registry_shape'
                   and pg_get_constraintdef(oid) like '%6,16%'
              ),
              'resolver_widened', (
                select pg_get_functiondef(p.oid) like '%6,16%'
                  from pg_proc p join pg_namespace n on n.oid = p.pronamespace
                 where n.nspname = 'public' and p.proname = 'resolve_invite_code'
              ),
              'preview_hides_owner', (
                select pg_get_function_result(p.oid) not like '%owner_name%'
                  from pg_proc p join pg_namespace n on n.oid = p.pronamespace
                 where n.nspname = 'public' and p.proname = 'get_league_preview'
              ),
              'rotate_exists', (
                select count(*) from pg_proc p join pg_namespace n on n.oid = p.pronamespace
                 where n.nspname = 'public' and p.proname = 'rotate_league_invite_code'
              ),
              'rotate_anonymous', (
                select count(*) from information_schema.role_routine_grants
                 where routine_schema = 'public' and routine_name = 'rotate_league_invite_code'
                   and grantee in ('anon', 'PUBLIC')
              ),
              'leagues_with_code', (select count(*) from public.leagues where invite_code is not null),
              'six_char_codes', (
                select count(*) from public.leagues
                 where invite_code is not null and length(invite_code) = 6
              ),
              'registry_rows', (select count(*) from public.invite_code_registry)
            )
          " > "${WORK_DIR}/target-state.json"
          cat "${WORK_DIR}/target-state.json"

          TARGET_STATE_FILE="${WORK_DIR}/target-state.json" \
          PRECONDITIONS_FILE="${WORK_DIR}/preconditions.json" \
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          const state = JSON.parse(fs.readFileSync(process.env.TARGET_STATE_FILE, 'utf8'))
          const before = JSON.parse(fs.readFileSync(process.env.PRECONDITIONS_FILE, 'utf8'))

          const expected = {
            migration_count: Number(process.env.TARGET_CONTRACT),
            latest_version: process.env.TARGET_VERSION,
            latest_name: process.env.TARGET_NAME,
            // Twelve, from the CSPRNG. This is the fact every check below exists
            // to accommodate.
            generated_code_length: 12,
            // The coupling repair. Without all three, a twelve-character code
            // cannot be stored, cannot be registered and cannot be resolved —
            // so private competition creation dies and every new code reads as
            // an unknown one.
            competition_shape_widened: 1,
            registry_shape_widened: 1,
            resolver_widened: true,
            // The oracle is closed.
            preview_hides_owner: true,
            rotate_exists: 1,
            rotate_anonymous: 0,
          }
          for (const [key, want] of Object.entries(expected)) {
            if (String(state[key]) !== String(want)) {
              console.error(`ERROR: rehearsed ${key} is ${state[key]}, expected ${want}.`)
              process.exit(1)
            }
          }

          // Codes already issued are untouched. The contract rewrites no row,
          // and an owner rotating one is a decision nobody has taken here.
          for (const key of ['leagues_with_code', 'six_char_codes', 'registry_rows']) {
            if (String(before[key]) !== String(state[key])) {
              console.error(`ERROR: ${key} moved ${before[key]} -> ${state[key]}; existing codes must be untouched.`)
              process.exit(1)
            }
          }

          console.log('Rehearsal reached exactly contract 158.')
          console.log(`Generator issues ${state.generated_code_length} characters; all three acceptors widened.`)
          console.log(`${state.six_char_codes} existing six-character code(s) still present and valid.`)
          NODE

      - name: Shred the plaintext dumps and stop the disposable target
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -d "${WORK_DIR}/bundle" ]; then
            find "${WORK_DIR}/bundle" -type f -exec shred -u {} + 2>/dev/null || true
            rm -rf "${WORK_DIR}/bundle"
          fi
          supabase stop --no-backup --workdir "${WORK_DIR}" || true
