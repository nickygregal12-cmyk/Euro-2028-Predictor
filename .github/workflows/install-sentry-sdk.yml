name: Install Sentry React SDK lockfile

on:
  pull_request:
    paths:
      - '.github/workflows/install-sentry-sdk.yml'

permissions:
  contents: write

jobs:
  install-sdk:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm

      - name: Install the pinned Sentry React SDK
        run: npm install --save-exact @sentry/react@10.67.0

      - name: Commit package metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo 'Package metadata is already current.'
            exit 0
          fi
          git commit -m 'Install Sentry React SDK'
          git push
