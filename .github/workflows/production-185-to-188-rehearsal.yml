name: Production 185 to 188 rehearsal

# Production-SHAPED rehearsal of the contract boundary 185 -> 188.
#
# The owner authorised this Production migration on 13 August 2026, asking for
# Production to be taken from 185 to 188 so that the identity repair contract
# 188 carries can be run against the corrupted forecasts Production generated
# that morning. That authorisation is what this file records; it is not a
# licence the workflow grants itself and it extends to no other boundary.
#
# WHAT THIS REHEARSES, and why three at once is defensible:
#
#   * every one of contracts 186, 187 and 188 is ADDITIVE by
#     `check-migration-additive.mjs`, so the checker runs here as a GATE rather
#     than as the report the destructive 157 -> 158 promotion needed. If a
#     future reader finds this softened back to a report, the boundary has
#     changed and this file no longer describes it;
#   * nothing in the range drops a relation, a column, a policy or a grant. The
#     only structural entries the checker reports are five triggers dropped and
#     re-created in the same statement pair, which is how `create or replace`
#     spells an unchanged trigger;
#   * contract 187 is the one redefinition worth naming. It generalises the
#     Championship qualification gate IN PLACE rather than adding beside, so the
#     tournament's own behaviour is a property this rehearsal has to prove
#     rather than assume — see `tournament_span_not_three` and
#     `tournament_group_table_still_bounded` below.
#
# THE RANGE IS THREE FILES AND THE DRY RUN ASSERTS EXACTLY THOSE THREE. A
# rehearsal that accepted "at least the ones I expected" would pass while
# promoting something nobody approved, which is the failure this shape exists
# to prevent. A fourth migration appearing on `main` — the parallel AI Lab
# session has been asked not to merge one, but asking is not a control — fails
# this step rather than silently widening the boundary.
#
# THE PROPERTIES MOST WORTH REHEARSING are the ones that were WRONG once
# already:
#
#   * `public.record_ai_odds_snapshot` must not create a temporary table.
#     Contract 188 was originally written with one and was rewritten as a CTE,
#     because `114_predictor_cup_lint_safe_qualification.sql` refuses any
#     `public` or `predictor_internal` function carrying a temporary-table
#     dependency. The migration text is not the claim that matters; this reads
#     `pg_get_functiondef` off the restored target and proves what is INSTALLED;
#   * the alias table must agree with the vocabulary `ai.raw_matches` actually
#     uses. Contract 188 found both the Python and SQL authorities agreeing on
#     `Raith Rovers -> Raith Rovers` when the history says `Raith Rvs` — two
#     authorities in perfect parity and both wrong. Parity is not correctness,
#     so every named canonical target below is resolved through
#     `ai.canonical_from_odds_api` AND checked to exist in the restored history.
#
# ZERO PROVIDER CALLS. Nothing here reaches football-data.org or The Odds API,
# and `ai.api_budget.collection_enabled` is asserted to be still `false` after
# the apply — the migration must not re-enable paid collection as a side effect
# of installing the budget columns.
#
# READ-ONLY against Production: the only Production connections here are a
# state query and dumps. Everything applied is applied to a disposable local
# target restored from those dumps.
#
# IT STILL REQUIRES A FRESH BACKUP, and the reason is worth stating because the
# read-only property above makes it look unnecessary. The backup does not
# protect this run; it protects the ROLLOUT this rehearsal exists to authorise.
# Demanding it at the FIRST step of the sequence rather than the last is what
# stops "take a backup first" from being a rule that survives only as long as
# the person in a hurry remembers it.
#
# Remove this one-shot workflow after the hosted contract/evidence record has
# been reconciled.

on:
  workflow_dispatch:
    inputs:
      project_ref:
        description: Exact Production project ref confirmation
        required: true
      confirmation:
        description: Type REHEARSE-PRODUCTION-185-TO-188 to proceed
        required: true
      backup_run_id:
        description: Run id of the successful FRESH Production backup
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: production-185-to-188-rehearsal
  cancel-in-progress: false

env:
  EXPECTED_PROJECT_REF: vkfnsqdyhvtwyqkisxhk
  FORBIDDEN_DEVELOPMENT_REF: iouzoutneyjpugbbtdem
  CONFIRMATION_PHRASE: REHEARSE-PRODUCTION-185-TO-188
  SOURCE_CONTRACT: '185'
  SOURCE_VERSION: '20260812070000'
  SOURCE_NAME: ai_lab_operational_loop
  TARGET_CONTRACT: '188'
  TARGET_VERSION: '20260813100000'
  TARGET_NAME: ai_lab_multi_model_evidence
  WORK_DIR: /tmp/production-185-to-188-rehearsal
  LOCAL_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres

jobs:
  rehearse:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Refuse an unsafe dispatch or repository state
        env:
          INPUT_PROJECT_REF: ${{ inputs.project_ref }}
          INPUT_CONFIRMATION: ${{ inputs.confirmation }}
        shell: bash
        run: |
          set -euo pipefail
          [ "${INPUT_CONFIRMATION}" = "${CONFIRMATION_PHRASE}" ] || {
            echo "ERROR: confirmation phrase does not match ${CONFIRMATION_PHRASE}."
            exit 1
          }
          if [ "${INPUT_PROJECT_REF}" = "${FORBIDDEN_DEVELOPMENT_REF}" ]; then
            echo 'ERROR: that is the Development project. This rehearses the Production boundary.'
            exit 1
          fi
          [ "${INPUT_PROJECT_REF}" = "${EXPECTED_PROJECT_REF}" ] || {
            echo "ERROR: only Production project ${EXPECTED_PROJECT_REF} is permitted."
            exit 1
          }
          [ -z "$(git status --porcelain=v1 --untracked-files=all)" ] || {
            echo 'ERROR: checkout is not clean.'
            exit 1
          }
          mkdir -p "${WORK_DIR}"

      - name: Prove a successful FRESH backup exists before Production is read
        env:
          GH_TOKEN: ${{ github.token }}
          BACKUP_RUN_ID: ${{ inputs.backup_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          # The rehearsal is read-only against Production — dumps and a state
          # query, nothing else — so a backup is not what protects THIS run. It
          # is required here because the backup is what protects the ROLLOUT
          # this rehearsal exists to authorise, and requiring it at the first
          # step of the sequence rather than the last is what stops "take a
          # backup first" from being a rule that survives only as long as the
          # person in a hurry remembers it. Checked against the API rather than
          # asserted by whoever dispatched this.
          json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${BACKUP_RUN_ID}")"
          conclusion="$(printf '%s' "${json}" | jq -r '.conclusion')"
          path="$(printf '%s' "${json}" | jq -r '.path')"
          created="$(printf '%s' "${json}" | jq -r '.created_at')"
          [ "${conclusion}" = 'success' ] || {
            echo "ERROR: backup run ${BACKUP_RUN_ID} concluded '${conclusion}', not success."
            exit 1
          }
          [ "${path}" = '.github/workflows/production-backup.yml' ] || {
            echo "ERROR: backup run ${BACKUP_RUN_ID} is ${path}, not the Production backup workflow."
            exit 1
          }
          echo "Backup run ${BACKUP_RUN_ID} verified: success, ${path}, created ${created}."

      - name: Prove the repository still holds exactly the approved contract 188
        shell: bash
        run: |
          set -euo pipefail
          committed="$(git ls-files 'supabase/migrations/*.sql' | wc -l | tr -d ' ')"
          [ "${committed}" = "${TARGET_CONTRACT}" ] || {
            echo "ERROR: repository holds ${committed} migrations, expected ${TARGET_CONTRACT}."
            echo 'If a fourth migration has landed on main, the approved boundary has moved.'
            echo 'STOP: do not extend the Production boundary silently.'
            exit 1
          }
          declared="$(node -p "require('./config/deployment-contract.json').requiredMigrationCount")"
          [ "${declared}" = "${TARGET_CONTRACT}" ] || {
            echo "ERROR: deployment contract declares ${declared}, expected ${TARGET_CONTRACT}."
            exit 1
          }
          newest="$(git ls-files 'supabase/migrations/*.sql' | sort | tail -1)"
          [ "$(basename "${newest}")" = "${TARGET_VERSION}_${TARGET_NAME}.sql" ] || {
            echo "ERROR: newest migration is $(basename "${newest}"), expected ${TARGET_VERSION}_${TARGET_NAME}.sql."
            exit 1
          }
          echo "Repository is exactly contract ${TARGET_CONTRACT}."

      - name: Prove every migration in the range is additive, as a GATE
        shell: bash
        run: |
          set -euo pipefail
          # A GATE, not a report. The destructive 157 -> 158 promotion had to
          # run this as a report because the checker would have refused it;
          # every migration in this range is additive, so it refuses nothing
          # and a failure here means the range is not what this file says.
          files=''
          for file in $(git ls-files 'supabase/migrations/*.sql' | sort); do
            version="$(basename "${file}")"
            version="${version:0:14}"
            if [[ "${version}" > "${SOURCE_VERSION}" && ! "${version}" > "${TARGET_VERSION}" ]]; then
              files="${files} ${file}"
            fi
          done
          # Declared, not rewritten: the migration list is split on purpose; quoting passes one argument, not many. This is a spent one-shot promotion
          # script; changing what it DOES to satisfy a style rule would edit the
          # record of a past production apply. shellcheck only began seeing it
          # when SHA-pinning marked the file changed, so it is pre-existing.
          # shellcheck disable=SC2086
          count="$(printf '%s\n' ${files} | grep -c . || true)"
          [ "${count}" = "3" ] || {
            echo "ERROR: the range holds ${count} migrations, expected 3."
            # Declared, not rewritten: the migration list is split on purpose; quoting passes one argument, not many. This is a spent one-shot promotion
            # script; changing what it DOES to satisfy a style rule would edit the
            # record of a past production apply. shellcheck only began seeing it
            # when SHA-pinning marked the file changed, so it is pre-existing.
            # shellcheck disable=SC2086
            printf '%s\n' ${files}
            exit 1
          }
          echo 'The three migrations in the range:'
          # Declared, not rewritten: the migration list is split on purpose; quoting passes one argument, not many. This is a spent one-shot promotion
          # script; changing what it DOES to satisfy a style rule would edit the
          # record of a past production apply. shellcheck only began seeing it
          # when SHA-pinning marked the file changed, so it is pre-existing.
          # shellcheck disable=SC2086
          printf '  %s\n' ${files}
          # Declared, not rewritten: the migration list is split on purpose; quoting passes one argument, not many. This is a spent one-shot promotion
          # script; changing what it DOES to satisfy a style rule would edit the
          # record of a past production apply. shellcheck only began seeing it
          # when SHA-pinning marked the file changed, so it is pre-existing.
          # shellcheck disable=SC2086
          node scripts/check-migration-additive.mjs ${files}
          echo 'All three are additive.'

      # Pinned to the same versions every proven pair has used. They are here
      # deliberately rather than by inheritance: the 172 -> 174 rehearsal's
      # first dispatch died on `supabase: command not found` because it was
      # derived from the 157 -> 158 pair and dropped exactly these two steps.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.22.2

      - uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        with:
          version: 2.109.1
          github-token: ${{ github.token }}

      - name: Install PostgreSQL 17 client tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17

      - name: Preflight the Production secret without printing it
        env:
          SUPABASE_PROD_DB_URL: ${{ secrets.SUPABASE_PROD_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${SUPABASE_PROD_DB_URL}" ] || {
            echo 'ERROR: repository secret SUPABASE_PROD_DB_URL is not set.'
            exit 1
          }
          case "${SUPABASE_PROD_DB_URL}" in
            *"${FORBIDDEN_DEVELOPMENT_REF}"*)
              echo 'ERROR: Production secret resolves to Development.'
              exit 1
              ;;
            *"${EXPECTED_PROJECT_REF}"*) ;;
            *)
              echo 'ERROR: Production secret does not name the expected Production project.'
              exit 1
              ;;
          esac

      - name: Prove the live source is exactly contract 185 (read-only)
        env:
          SUPABASE_PROD_DB_URL: ${{ secrets.SUPABASE_PROD_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          # Every relation read here exists at contract 185. The AI counts are
          # captured because the alias-correctness assertions below are only
          # meaningful against a faithful copy of the retained history — a dump
          # that silently omitted the `ai` schema would make every one of them
          # pass vacuously.
          psql "${SUPABASE_PROD_DB_URL}" -X -q -v ON_ERROR_STOP=1 -A -t \
            -f - > "${WORK_DIR}/source-state.json" <<'VERIFY_SQL'
            select json_build_object(
              'migration_count', (select count(*) from supabase_migrations.schema_migrations),
              'latest_version', (select version from supabase_migrations.schema_migrations order by version desc limit 1),
              'latest_name', (select name from supabase_migrations.schema_migrations order by version desc limit 1),
              'ai_raw_matches', (select count(*) from ai.raw_matches),
              'ai_odds_api_events', (select count(*) from ai.odds_api_events),
              'ai_predictions', (select count(*) from ai.predictions),
              'ai_market_prices', (select count(*) from ai.market_prices),
              'ai_collection_enabled', (select collection_enabled from ai.api_budget limit 1)
            )
          VERIFY_SQL
          cat "${WORK_DIR}/source-state.json"

          SOURCE_STATE_FILE="${WORK_DIR}/source-state.json" node --input-type=module <<'NODE'
          import fs from 'node:fs'
          const state = JSON.parse(fs.readFileSync(process.env.SOURCE_STATE_FILE, 'utf8'))
          const expected = {
            migration_count: Number(process.env.SOURCE_CONTRACT),
            latest_version: process.env.SOURCE_VERSION,
            latest_name: process.env.SOURCE_NAME,
          }
          for (const [key, want] of Object.entries(expected)) {
            if (String(state[key]) !== String(want)) {
              console.error(`ERROR: live Production ${key} is ${state[key]}, expected ${want}.`)
              process.exit(1)
            }
          }
          if (Number(state.ai_raw_matches) < 1) {
            console.error('ERROR: Production holds no ai.raw_matches; the alias-correctness rehearsal would be vacuous.')
            process.exit(1)
          }
          // Paid collection is deliberately disabled while the identity
          // pipeline is known corrupt. This rehearsal must not be run against
          // a Production that has quietly been re-enabled.
          if (String(state.ai_collection_enabled) !== 'f' && String(state.ai_collection_enabled) !== 'false') {
            console.error(`ERROR: Production ai.api_budget.collection_enabled is ${state.ai_collection_enabled}; it must stay disabled through promotion.`)
            process.exit(1)
          }
          console.log('Live Production is exactly the rehearsed contract-185 source boundary.')
          console.log(`Retained history to rehearse against: ${state.ai_raw_matches} raw matches, ${state.ai_odds_api_events} odds events.`)
          console.log('Paid collection is disabled, as it must be for the whole promotion.')
          NODE

      - name: Take a fresh Production dump and restore it to a disposable local target
        env:
          SUPABASE_PROD_DB_URL: ${{ secrets.SUPABASE_PROD_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          supabase init --force --workdir "${WORK_DIR}" >/dev/null 2>&1 || true
          supabase start --workdir "${WORK_DIR}"

          # READ-ONLY against Production: dumps only. The absolute pg_dump path
          # is required — a bare `pg_dump` resolves to Ubuntu's 16 client, which
          # refuses against a 17.x server. The four-file Supabase-native dump is
          # used rather than one archive because the archive route restores
          # without privileges, and this contract asserts privilege facts.
          BUNDLE="${WORK_DIR}/bundle"
          ROLLOUT="${GITHUB_WORKSPACE}/scripts/database-rollout"
          mkdir -p "${BUNDLE}"

          supabase db dump --db-url "${SUPABASE_PROD_DB_URL}" \
            --file "${BUNDLE}/roles.sql" --role-only
          supabase db dump --db-url "${SUPABASE_PROD_DB_URL}" \
            --file "${BUNDLE}/schema.sql"
          supabase db dump --db-url "${SUPABASE_PROD_DB_URL}" \
            --file "${BUNDLE}/data.sql" --use-copy --data-only \
            -x storage.buckets_vectors -x storage.vector_indexes
          /usr/lib/postgresql/17/bin/pg_dump \
            --dbname "${SUPABASE_PROD_DB_URL}" \
            --schema supabase_migrations --no-owner --no-privileges \
            --file "${BUNDLE}/migration-history.sql"

          for required in roles.sql schema.sql data.sql migration-history.sql; do
            [ -s "${BUNDLE}/${required}" ] || {
              echo "ERROR: dump is empty or missing: ${BUNDLE}/${required}"
              ls -la "${WORK_DIR}" "${BUNDLE}" || true
              exit 1
            }
          done

          grep -Eq '(COPY|INSERT INTO)[[:space:]]+"?auth"?\."?users"?' "${BUNDLE}/data.sql" || {
            echo 'ERROR: data.sql does not contain auth.users; this is not a faithful copy.'
            exit 1
          }
          # The `ai` schema is what contracts 188's identity work operates on.
          # A dump that dropped it would make the alias-correctness rehearsal
          # meaningless, so it is required by name rather than hoped for.
          grep -Eq '(COPY|INSERT INTO)[[:space:]]+"?ai"?\."?raw_matches"?' "${BUNDLE}/data.sql" || {
            echo 'ERROR: data.sql does not contain ai.raw_matches; the retained history did not come across.'
            exit 1
          }

          psql "${LOCAL_DB_URL}" -X --single-transaction -v ON_ERROR_STOP=1 --file "${BUNDLE}/roles.sql"
          psql "${LOCAL_DB_URL}" -X --single-transaction -v ON_ERROR_STOP=1 \
            --file "${ROLLOUT}/prepare-disposable-restore-target.sql"
          psql "${LOCAL_DB_URL}" -X --single-transaction -v ON_ERROR_STOP=1 --file "${BUNDLE}/schema.sql"
          psql "${LOCAL_DB_URL}" -X --single-transaction -v ON_ERROR_STOP=1 \
            --command 'SET session_replication_role = replica' --file "${BUNDLE}/data.sql"
          psql "${LOCAL_DB_URL}" -X --single-transaction -v ON_ERROR_STOP=1 \
            --file "${ROLLOUT}/managed-schema-customizations.sql"
          psql "${LOCAL_DB_URL}" -X --single-transaction -v ON_ERROR_STOP=1 --file "${BUNDLE}/migration-history.sql"

          restored="$(psql "${LOCAL_DB_URL}" -X -q -v ON_ERROR_STOP=1 -A -t -c \
            'select count(*) from supabase_migrations.schema_migrations')"
          [ "${restored}" = "${SOURCE_CONTRACT}" ] || {
            echo "ERROR: restored target holds ${restored} migrations, expected ${SOURCE_CONTRACT}."
            exit 1
          }

          leaked="$(psql "${LOCAL_DB_URL}" -X -q -v ON_ERROR_STOP=1 -A -t -c \
            "select count(*) from information_schema.role_table_grants
              where table_schema = 'public'
                and table_name = 'season_fixtures'
                and grantee in ('anon','authenticated')")"
          [ "${leaked}" = "0" ] || {
            echo "ERROR: restored target grants season_fixtures to browser roles; Production grants none."
            exit 1
          }
          echo "Disposable target restored at contract ${restored} with Production's privilege shape."

      - name: Record what Production holds before anything is applied
        shell: bash
        run: |
          set -euo pipefail
          # Nothing in contracts 186 to 188 rewrites a platform row. Every count
          # below is compared against itself after the apply, so "additive" is
          # proven on the data rather than asserted from the checker alone. The
          # AI counts are here too: the identity repair contract 188 SHIPS must
          # not run merely because the schema arrived — installing the authority
          # and calling it are separate decisions.
          psql "${LOCAL_DB_URL}" -X -q -v ON_ERROR_STOP=1 -A -t \
            -f - > "${WORK_DIR}/preconditions.json" <<'VERIFY_SQL'
            select json_build_object(
              'auth_users', (select count(*) from auth.users),
              'profiles', (select count(*) from public.profiles),
              'tournaments', (select count(*) from public.tournaments),
              'teams', (select count(*) from public.teams),
              'matches', (select count(*) from public.matches),
              'entries', (select count(*) from public.entries),
              'match_predictions', (select count(*) from public.match_predictions),
              'leagues', (select count(*) from public.leagues),
              'league_members', (select count(*) from public.league_members),
              'score_events', (select count(*) from public.score_events),
              'entry_totals', (select count(*) from public.entry_totals),
              'game_memberships', (select count(*) from public.game_memberships),
              'bonus_competitions', (select count(*) from public.bonus_competitions),
              'season_fixtures', (select count(*) from public.season_fixtures),
              'season_predictions', (select count(*) from public.season_predictions),
              'player_action_items', (select count(*) from public.player_action_items),
              'reminder_deliveries', (select count(*) from public.reminder_deliveries),
              'ai_raw_matches', (select count(*) from ai.raw_matches),
              'ai_odds_api_events', (select count(*) from ai.odds_api_events),
              'ai_predictions', (select count(*) from ai.predictions),
              'ai_market_prices', (select count(*) from ai.market_prices),
              'ai_fixture_odds', (select count(*) from ai.fixture_odds),
              'ai_bets', (select count(*) from ai.bets),
              'ai_api_usage', (select count(*) from ai.api_usage)
            )
          VERIFY_SQL
          cat "${WORK_DIR}/preconditions.json"

      - name: Rehearse the forward apply on the disposable target
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${WORK_DIR}/later-migrations"
          : > "${WORK_DIR}/moved-files.txt"
          for file in $(git ls-files 'supabase/migrations/*.sql' | sort); do
            filename="$(basename "${file}")"
            version="${filename:0:14}"
            if [[ "${version}" > "${TARGET_VERSION}" ]]; then
              mv "${file}" "${WORK_DIR}/later-migrations/${filename}"
              printf '%s\n' "${file}" >> "${WORK_DIR}/moved-files.txt"
            fi
          done
          if [ -s "${WORK_DIR}/moved-files.txt" ]; then
            echo 'Held back as ABOVE the pinned target, not rehearsed here:'
            cat "${WORK_DIR}/moved-files.txt"
          fi

          supabase db push --db-url "${LOCAL_DB_URL}" --dry-run \
            > "${WORK_DIR}/dry-run.txt" 2>&1
          cat "${WORK_DIR}/dry-run.txt"

          grep -oE '[0-9]{14}_[A-Za-z0-9_-]+\.sql' "${WORK_DIR}/dry-run.txt" \
            | awk '!seen[$0]++' | sort > "${WORK_DIR}/pending.txt"

          # EXACTLY the three, named. "At least the ones I expected" would pass
          # while promoting something nobody approved.
          printf '%s\n' \
            '20260812080000_cup_group_stage_span.sql' \
            '20260812090000_season_cup_qualification_driver.sql' \
            '20260813100000_ai_lab_multi_model_evidence.sql' \
            > "${WORK_DIR}/expected.txt"
          sort -o "${WORK_DIR}/expected.txt" "${WORK_DIR}/expected.txt"

          if ! diff -u "${WORK_DIR}/expected.txt" "${WORK_DIR}/pending.txt"; then
            echo 'ERROR: the rehearsal dry run is not exactly contracts 186 to 188.'
            exit 1
          fi
          echo 'Dry run is exactly the three approved migrations.'

          supabase db push --db-url "${LOCAL_DB_URL}" 2>&1 | tee "${WORK_DIR}/apply.txt"

      - name: Restore the repository migration tree in the runner
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "${WORK_DIR}/moved-files.txt" ]; then
            while IFS= read -r file; do
              [ -n "${file}" ] || continue
              filename="$(basename "${file}")"
              if [ -e "${WORK_DIR}/later-migrations/${filename}" ]; then
                mv "${WORK_DIR}/later-migrations/${filename}" "${file}"
              fi
            done < "${WORK_DIR}/moved-files.txt"
          fi

      - name: Verify the rehearsed result, and that nothing was lost
        shell: bash
        run: |
          set -euo pipefail
          psql "${LOCAL_DB_URL}" -X -q -v ON_ERROR_STOP=1 -A -t \
            -f - > "${WORK_DIR}/target-state.json" <<'VERIFY_SQL'
            -- Split across several jsonb_build_object calls and concatenated:
            -- PostgreSQL refuses more than 100 arguments to one function, and
            -- 73 keys is 146. Rehearsal run 31730622906 died here.
            select (
              jsonb_build_object(
              'migration_count', (select count(*) from supabase_migrations.schema_migrations),
              'latest_version', (select version from supabase_migrations.schema_migrations order by version desc limit 1),
              'latest_name', (select name from supabase_migrations.schema_migrations order by version desc limit 1),
              'range_rows_present', (
                select count(*) from supabase_migrations.schema_migrations
                 where version in ('20260812080000','20260812090000','20260813100000')),

              -- ============================================================
              -- CONTRACT 186 — where a season's group stage ends
              -- ============================================================
              'launch_table', (
                select count(*) from pg_tables
                 where schemaname = 'public' and tablename = 'bonus_cup_launches'),
              'launch_rls', (
                select c.relrowsecurity from pg_class c join pg_namespace n on n.oid = c.relnamespace
                 where n.nspname = 'public' and c.relname = 'bonus_cup_launches'),
              'launch_browser_grants', (
                select count(*) from information_schema.role_table_grants
                 where table_schema = 'public' and table_name = 'bonus_cup_launches'
                   and grantee in ('anon','authenticated')),
              'launch_immutable_trigger', (
                select count(*) from pg_trigger t join pg_class c on c.oid = t.tgrelid
                 where c.relname = 'bonus_cup_launches'
                   and t.tgname = 'bonus_cup_launches_immutable' and not t.tgisinternal),
              'span_last_sequence_fn', (
                select count(*) from pg_proc p join pg_namespace n on n.oid = p.pronamespace
                 where n.nspname = 'predictor_internal'
                   and p.proname = 'cup_group_stage_last_sequence'),
              -- Informational: how many launches the exact-read backfill found.
              'launch_rows', (select count(*) from public.bonus_cup_launches),

              -- ============================================================
              -- CONTRACT 187 — season Championship qualification
              -- ============================================================
              'span_fn', (
                select count(*) from pg_proc p join pg_namespace n on n.oid = p.pronamespace
                 where n.nspname = 'predictor_internal' and p.proname = 'cup_group_stage_span'),
              'knockout_windows_fn', (
                select count(*) from pg_proc p join pg_namespace n on n.oid = p.pronamespace
                 where n.nspname = 'predictor_internal'
                   and p.proname = 'ensure_season_cup_knockout_windows'),
              'season_finalise_fn', (
                select count(*) from pg_proc p join pg_namespace n on n.oid = p.pronamespace
                 where n.nspname = 'public' and p.proname = 'admin_finalise_season_cup_groups'),
              'season_finalise_authenticated', (
                select count(*) from information_schema.role_routine_grants
                 where routine_schema = 'public' and routine_name = 'admin_finalise_season_cup_groups'
                   and grantee = 'authenticated'),
              'season_finalise_anon', (
                select count(*) from information_schema.role_routine_grants
                 where routine_schema = 'public' and routine_name = 'admin_finalise_season_cup_groups'
                   and grantee in ('anon','PUBLIC')),
              'internal_cup_fns_browser_reachable', (
                select count(*) from information_schema.role_routine_grants
                 where routine_schema = 'predictor_internal'
                   and routine_name in ('cup_group_stage_span','cup_group_stage_last_sequence',
                                        'ensure_season_cup_knockout_windows')
                   and grantee in ('anon','authenticated','PUBLIC')),
              -- THE TOURNAMENT IS UNCHANGED BY CONSTRUCTION, and that is the
              -- claim contract 187 has to earn because it generalises IN PLACE.
              -- The span resolver must return exactly 3 for every tournament
              -- Championship on this target, and contract 169's tournament group
              -- table must still carry its three-matchday bound.
              'tournament_cup_competitions', (
                select count(*) from public.bonus_competitions bc
                 where not predictor_internal.cup_is_league_season(bc.id)),
              'tournament_span_not_three', (
                select count(*) from public.bonus_competitions bc
                 where not predictor_internal.cup_is_league_season(bc.id)
                   and predictor_internal.cup_group_stage_span(bc.id) <> 3),
              'tournament_group_table_still_bounded', (
                select pg_get_functiondef(p.oid) ~ 'between 1 and 3'
                  from pg_proc p join pg_namespace n on n.oid = p.pronamespace
                 where n.nspname = 'predictor_internal' and p.proname = 'cup_final_group_tables'),
              -- A league season whose launch record is missing must REFUSE
              -- rather than answer three, because three would qualify the wrong
              -- entrants off a three-matchweek table with nothing raising. Read
              -- off the installed definition rather than driven: the function
              -- RAISES, so calling it on such a season would abort this whole
              -- verification query instead of reporting a clean assertion.
              'season_span_refuses_without_launch', (
                select pg_get_functiondef(p.oid) ~ 'raise[[:space:]]+exception'
                  from pg_proc p join pg_namespace n on n.oid = p.pronamespace
                 where n.nspname = 'predictor_internal' and p.proname = 'cup_group_stage_span'),

              -- ============================================================
              -- CONTRACT 188 — multi-model evidence and identity custody
              -- ============================================================
              'ai_team_aliases_rows', (select count(*) from ai.team_aliases),
              'ai_canonical_fn', (
                select count(*) from pg_proc p join pg_namespace n on n.oid = p.pronamespace
                 where n.nspname = 'ai' and p.proname = 'canonical_from_odds_api'),
              'ai_valid_predictions_view', (
                select count(*) from pg_views where schemaname = 'ai' and viewname = 'valid_predictions'),
              'ai_new_tables', (
                select count(*) from pg_tables where schemaname = 'ai'
                   and tablename in ('recommendations','prediction_invalidations','provider_identity_repairs')),
              'ai_new_tables_rls', (
                select count(*) from pg_class c join pg_namespace n on n.oid = c.relnamespace
                 where n.nspname = 'ai' and c.relrowsecurity
                   and c.relname in ('recommendations','prediction_invalidations','provider_identity_repairs')),
              'ai_new_tables_empty', (
                select (select count(*) from ai.recommendations)
                     + (select count(*) from ai.prediction_invalidations)
                     + (select count(*) from ai.provider_identity_repairs)),
              'ai_repair_fn', (
                select count(*) from pg_proc p join pg_namespace n on n.oid = p.pronamespace
                 where n.nspname = 'ai' and p.proname = 'repair_provider_identity'),
              'ai_reconcile_budget_fn', (
                select count(*) from pg_proc p join pg_namespace n on n.oid = p.pronamespace
                 where n.nspname = 'ai' and p.proname = 'reconcile_api_budget'),
              'ai_quarantine_fn', (
                select count(*) from pg_proc p join pg_namespace n on n.oid = p.pronamespace
                 where n.nspname = 'ai' and p.proname = 'quarantine_identity_defective_predictions'),
              -- The repair and the reconciliation are service_role work. A
              -- browser role reaching either would be a far worse defect than
              -- the identity corruption they exist to fix.
              'ai_privileged_fns_browser_reachable', (
                select count(*) from information_schema.role_routine_grants
                 where routine_schema = 'ai'
                   and routine_name in ('repair_provider_identity','reconcile_api_budget',
                                        'quarantine_identity_defective_predictions')
                   and grantee in ('anon','authenticated','PUBLIC')),
              -- No browser role has direct DML on ANY ai relation. Contract 134
              -- is the record of what happens when a table is created under a
              -- comment saying nobody can read it and nothing is revoked.
              'ai_browser_table_dml', (
                select count(*) from information_schema.role_table_grants
                 where table_schema = 'ai' and grantee in ('anon','authenticated')),

              -- Model provenance: the columns contract 188 adds so an artefact
              -- states what it was actually trained on.
              'ai_model_provenance_columns', (
                select count(*) from information_schema.columns
                 where table_schema = 'ai' and table_name = 'models'
                   and column_name in ('training_matches','component_families','uses_market')),
              'ai_prediction_columns', (
                select count(*) from information_schema.columns
                 where table_schema = 'ai' and table_name = 'predictions'
                   and column_name in ('model_views','data_confidence')),
              'ai_prediction_results_diagnosis', (
                select count(*) from information_schema.columns
                 where table_schema = 'ai' and table_name = 'prediction_results'
                   and column_name = 'diagnosis'),
              'ai_budget_soft_cap_fraction', (
                select count(*) from information_schema.columns
                 where table_schema = 'ai' and table_name = 'api_budget'
                   and column_name = 'soft_cap_fraction'),

              -- Bounded admin reads, and their reachability.
              'admin_ai_rpcs', (
                select count(*) from pg_proc p join pg_namespace n on n.oid = p.pronamespace
                 where n.nspname = 'public'
                   and p.proname in ('admin_ai_recommendation_log','admin_ai_prediction_audit',
                                     'admin_ai_bet_builder_books','admin_ai_bet_builder_candidates')),
              'admin_ai_rpcs_authenticated', (
                select count(*) from information_schema.role_routine_grants
                 where routine_schema = 'public'
                   and routine_name in ('admin_ai_recommendation_log','admin_ai_prediction_audit',
                                        'admin_ai_bet_builder_books','admin_ai_bet_builder_candidates')
                   and grantee = 'authenticated'),
              'admin_ai_rpcs_anon', (
                select count(*) from information_schema.role_routine_grants
                 where routine_schema = 'public'
                   and routine_name in ('admin_ai_recommendation_log','admin_ai_prediction_audit',
                                        'admin_ai_bet_builder_books','admin_ai_bet_builder_candidates')
                   and grantee in ('anon','PUBLIC')),
              -- Bet Builder support, by its exact identity argument list. A
              -- signature drift here is the shape that would let a deployment
              -- contract claim an RPC it cannot actually call.
              -- TYPES ONLY, in order. `pg_get_function_identity_arguments`
              -- renders parameter NAMES on this server, so asserting against it
              -- would pass or fail on a rename that changes no call signature.
              -- This is the signature a caller actually has to match.
              'bet_builder_candidates_identity_args', (
                select array_to_string(array(
                         select format_type(t, null) from unnest(p.proargtypes) t), ', ')
                  from pg_proc p join pg_namespace n on n.oid = p.pronamespace
                 where n.nspname = 'public' and p.proname = 'admin_ai_bet_builder_candidates'),

              -- ============================================================
              -- THE DEFECT CONTRACT 188 WAS REWRITTEN TO AVOID
              -- ============================================================
              -- `record_ai_odds_snapshot` was originally written with a
              -- temporary table and rewritten as a CTE. Read off the INSTALLED
              -- definition, not the migration text.
              'snapshot_uses_temp_table', (
                select pg_get_functiondef(p.oid) ~* 'create\s+(temporary|temp)\s+table'
                  from pg_proc p join pg_namespace n on n.oid = p.pronamespace
                 where n.nspname = 'public' and p.proname = 'record_ai_odds_snapshot')
              -- And the general lint the rewrite exists to satisfy: no function
              -- in `public` or `predictor_internal` retains a temporary-table
              -- dependency. This is `114_predictor_cup_lint_safe_qualification`
              -- evaluated against what is installed.
              ) ||
              jsonb_build_object(
              'temp_table_lint_violations', (
                select count(*) from pg_proc p
                  join pg_namespace n on n.oid = p.pronamespace
                  join pg_language l on l.oid = p.prolang
                 where n.nspname in ('public','predictor_internal')
                   and p.prokind = 'f' and l.lanname in ('plpgsql','sql')
                   and (pg_get_functiondef(p.oid) ilike '%pg_temp.%'
                     or pg_get_functiondef(p.oid) ilike '%create temporary table%')),
              -- The snapshot writer must re-derive identity rather than trust
              -- its caller. That is the whole point of the custody fix.
              'snapshot_rederives_identity', (
                select pg_get_functiondef(p.oid) ~ 'canonical_from_odds_api'
                  from pg_proc p join pg_namespace n on n.oid = p.pronamespace
                 where n.nspname = 'public' and p.proname = 'record_ai_odds_snapshot'),

              -- ============================================================
              -- PARITY IS NOT CORRECTNESS. Every canonical target below is
              -- resolved through the SQL authority AND required to exist in the
              -- retained history. `Raith Rovers -> Raith Rovers` is what two
              -- authorities in perfect agreement and both wrong looks like.
              -- ============================================================
              'alias_resolutions', (
                select jsonb_object_agg(probe.src, coalesce(r.canonical, '<unmatched>'))
                  from (values ('Leicester City'),('Norwich City'),('West Bromwich Albion'),
                               ('Swansea City'),('Blackburn Rovers'),('Sheffield Wednesday'),
                               ('Queens Park Rangers'),('Huddersfield Town'),('Wimbledon'),
                               ('Raith Rovers')) as probe(src)
                  cross join lateral ai.canonical_from_odds_api(probe.src) r),
              'alias_targets_absent_from_history', (
                select count(*) from (
                  select r.canonical from (values ('Leicester City'),('Norwich City'),
                    ('West Bromwich Albion'),('Swansea City'),('Blackburn Rovers'),
                    ('Sheffield Wednesday'),('Queens Park Rangers'),('Huddersfield Town'),
                    ('Wimbledon'),('Raith Rovers')) as probe(src)
                    cross join lateral ai.canonical_from_odds_api(probe.src) r) resolved
                 where resolved.canonical is null
                    or not exists (select 1 from ai.raw_matches m
                                    where m.home_canonical = resolved.canonical
                                       or m.away_canonical = resolved.canonical)),

              -- Paid collection must still be OFF. Installing the budget
              -- columns must not re-enable collection as a side effect.
              'ai_collection_enabled', (select collection_enabled from ai.api_budget limit 1),
              -- And no provider request was made by this rehearsal.
              'ai_api_usage', (select count(*) from ai.api_usage),

              -- The identity repair must NOT have run merely because its
              -- authority arrived. Installing it and calling it are separate.
              'ai_repairs_recorded', (select count(*) from ai.provider_identity_repairs),
              'ai_predictions_invalidated', (select count(*) from ai.prediction_invalidations),

              'euro_state', (select state from public.euro_publication_state()),
              'cron_jobs', (select case when to_regclass('cron.job') is null then -1
                                        else (select count(*) from cron.job) end),

              -- And nothing was lost.
              'auth_users', (select count(*) from auth.users),
              'profiles', (select count(*) from public.profiles),
              'tournaments', (select count(*) from public.tournaments),
              'teams', (select count(*) from public.teams),
              'matches', (select count(*) from public.matches),
              'entries', (select count(*) from public.entries),
              'match_predictions', (select count(*) from public.match_predictions),
              'leagues', (select count(*) from public.leagues),
              'league_members', (select count(*) from public.league_members),
              'score_events', (select count(*) from public.score_events),
              'entry_totals', (select count(*) from public.entry_totals),
              'game_memberships', (select count(*) from public.game_memberships),
              'bonus_competitions', (select count(*) from public.bonus_competitions),
              'season_fixtures', (select count(*) from public.season_fixtures),
              'season_predictions', (select count(*) from public.season_predictions),
              'player_action_items', (select count(*) from public.player_action_items),
              'reminder_deliveries', (select count(*) from public.reminder_deliveries),
              'ai_raw_matches', (select count(*) from ai.raw_matches),
              'ai_odds_api_events', (select count(*) from ai.odds_api_events),
              'ai_predictions', (select count(*) from ai.predictions),
              'ai_market_prices', (select count(*) from ai.market_prices),
              'ai_fixture_odds', (select count(*) from ai.fixture_odds),
              'ai_bets', (select count(*) from ai.bets)
              )
            )::text
          VERIFY_SQL
          cat "${WORK_DIR}/target-state.json"

          TARGET_STATE_FILE="${WORK_DIR}/target-state.json" \
          PRECONDITIONS_FILE="${WORK_DIR}/preconditions.json" \
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          const state = JSON.parse(fs.readFileSync(process.env.TARGET_STATE_FILE, 'utf8'))
          const before = JSON.parse(fs.readFileSync(process.env.PRECONDITIONS_FILE, 'utf8'))

          const expected = {
            migration_count: Number(process.env.TARGET_CONTRACT),
            latest_version: process.env.TARGET_VERSION,
            latest_name: process.env.TARGET_NAME,
            range_rows_present: 3,

            // Contract 186
            launch_table: 1,
            launch_rls: true,
            launch_browser_grants: 0,
            launch_immutable_trigger: 1,
            span_last_sequence_fn: 1,

            // Contract 187
            span_fn: 1,
            knockout_windows_fn: 1,
            season_finalise_fn: 1,
            season_finalise_authenticated: 1,
            season_finalise_anon: 0,
            internal_cup_fns_browser_reachable: 0,
            tournament_span_not_three: 0,
            tournament_group_table_still_bounded: true,
            season_span_refuses_without_launch: true,

            // Contract 188
            ai_canonical_fn: 1,
            ai_valid_predictions_view: 1,
            ai_new_tables: 3,
            ai_new_tables_rls: 3,
            ai_new_tables_empty: 0,
            ai_repair_fn: 1,
            ai_reconcile_budget_fn: 1,
            ai_quarantine_fn: 1,
            ai_privileged_fns_browser_reachable: 0,
            ai_browser_table_dml: 0,
            ai_model_provenance_columns: 3,
            ai_prediction_columns: 2,
            ai_prediction_results_diagnosis: 1,
            ai_budget_soft_cap_fraction: 1,
            admin_ai_rpcs: 4,
            admin_ai_rpcs_authenticated: 4,
            admin_ai_rpcs_anon: 0,
            bet_builder_candidates_identity_args:
              'text, text[], timestamp with time zone, timestamp with time zone, integer',

            // The rewrite, and the lint it exists to satisfy.
            snapshot_uses_temp_table: false,
            temp_table_lint_violations: 0,
            snapshot_rederives_identity: true,

            // Parity is not correctness.
            alias_targets_absent_from_history: 0,

            // Nothing ran itself.
            ai_repairs_recorded: 0,
            ai_predictions_invalidated: 0,
            euro_state: 'hidden',
          }
          for (const [key, want] of Object.entries(expected)) {
            if (String(state[key]) !== String(want)) {
              console.error(`ERROR: rehearsed ${key} is ${state[key]}, expected ${want}.`)
              process.exit(1)
            }
          }

          // Paid collection stays off. psql renders a boolean as t/f.
          if (!['f', 'false'].includes(String(state.ai_collection_enabled))) {
            console.error(`ERROR: ai.api_budget.collection_enabled is ${state.ai_collection_enabled}; the migration must not re-enable paid collection.`)
            process.exit(1)
          }

          // The alias table must actually hold the seeded vocabulary.
          if (Number(state.ai_team_aliases_rows) < 90) {
            console.error(`ERROR: ai.team_aliases holds ${state.ai_team_aliases_rows} rows; the seed did not land.`)
            process.exit(1)
          }

          // The named mappings, checked one at a time so a failure says WHICH.
          const wantAliases = {
            'Leicester City': 'Leicester',
            'Norwich City': 'Norwich',
            'West Bromwich Albion': 'West Brom',
            'Swansea City': 'Swansea',
            'Blackburn Rovers': 'Blackburn',
            'Sheffield Wednesday': 'Sheffield Weds',
            'Queens Park Rangers': 'QPR',
            'Huddersfield Town': 'Huddersfield',
            'Wimbledon': 'AFC Wimbledon',
            'Raith Rovers': 'Raith Rvs',
          }
          const got = state.alias_resolutions || {}
          for (const [src, want] of Object.entries(wantAliases)) {
            if (got[src] !== want) {
              console.error(`ERROR: ai.canonical_from_odds_api('${src}') is '${got[src]}', expected '${want}'.`)
              process.exit(1)
            }
          }

          // Additive on the DATA, not just by the checker. The AI relations are
          // included: contract 188 installs the repair authority and must not
          // move a single retained row by arriving.
          const counted = ['auth_users','profiles','tournaments','teams','matches','entries',
                           'match_predictions','leagues','league_members','score_events',
                           'entry_totals','game_memberships','bonus_competitions',
                           'season_fixtures','season_predictions','player_action_items',
                           'reminder_deliveries','ai_raw_matches','ai_odds_api_events',
                           'ai_predictions','ai_market_prices','ai_fixture_odds','ai_bets']
          for (const key of counted) {
            if (String(before[key]) !== String(state[key])) {
              console.error(`ERROR: ${key} moved ${before[key]} -> ${state[key]}; this range rewrites no row.`)
              process.exit(1)
            }
          }

          // ZERO PROVIDER CALLS: the usage ledger did not move.
          if (String(before.ai_api_usage) !== String(state.ai_api_usage)) {
            console.error(`ERROR: ai.api_usage moved ${before.ai_api_usage} -> ${state.ai_api_usage}; this rehearsal makes no provider request.`)
            process.exit(1)
          }

          console.log(`Rehearsal reached exactly contract ${state.migration_count}, all three rows named and present.`)
          console.log(`Contract 186: bonus_cup_launches present, RLS on, no browser grant, immutable trigger installed, ${state.launch_rows} launch row(s) backfilled.`)
          console.log(`Contract 187: ${state.tournament_cup_competitions} tournament Championship(s) on this target, every one resolving a span of exactly 3; contract 169's group table still bounded 1..3.`)
          console.log(`Contract 188: ${state.ai_team_aliases_rows} alias rows; every named mapping resolves, and every canonical target exists in ${state.ai_raw_matches} retained matches.`)
          console.log('record_ai_odds_snapshot uses no temporary table and re-derives identity; the temp-table lint is clean.')
          console.log(`Bet Builder candidate identity args: ${state.bet_builder_candidates_identity_args}.`)
          console.log(`Paid collection: ${state.ai_collection_enabled} (disabled). Provider requests made: 0.`)
          console.log(`Repairs recorded: ${state.ai_repairs_recorded}. Predictions invalidated: ${state.ai_predictions_invalidated}. Installing the authority did not call it.`)
          console.log(`${state.cron_jobs} scheduled job(s). Euro publication: ${state.euro_state}.`)
          for (const key of counted) console.log(`  ${key}: ${state[key]} (unchanged)`)
          NODE

      - name: Shred the plaintext dumps and stop the disposable target
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -d "${WORK_DIR}/bundle" ]; then
            find "${WORK_DIR}/bundle" -type f -exec shred -u {} + 2>/dev/null || true
            rm -rf "${WORK_DIR}/bundle"
          fi
          supabase stop --no-backup --workdir "${WORK_DIR}" || true
