name: Final tooling bootstrap

on:
  push:
    branches:
      - agent/final-engineering-tooling
    paths:
      - '.github/workflows/final-tooling-bootstrap.yml'
      - 'src/services/supabase/aiLabBoundary.ts'
      - 'src/services/supabase/aiLab.ts'
      - 'tests/services/auth/pwnedPassword.test.ts'
      - 'tests/services/supabase/aiLabBoundary.test.ts'
      - 'tests/domain/calculateScore.property.test.ts'
      - 'vite.analyze.config.ts'
      - 'stryker.config.mjs'

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner (audit egress)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - name: Checkout tooling branch
        uses: actions/checkout@v7
        with:
          ref: agent/final-engineering-tooling
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22.22.2
          cache: npm
      - name: Install pinned runtime dependency
        run: npm install --save-exact zod@4.4.3
      - name: Install pinned development tooling
        run: >-
          npm install --save-dev --save-exact
          msw@2.15.0
          fast-check@4.9.0
          @stryker-mutator/core@9.6.1
          @stryker-mutator/vitest-runner@9.6.1
          rollup-plugin-visualizer@7.0.1
      - name: Register tooling commands
        shell: bash
        run: |
          set -euo pipefail
          npm pkg set 'scripts.test:property=vitest run tests/domain/calculateScore.property.test.ts'
          npm pkg set 'scripts.test:mutation=stryker run'
          npm pkg set 'scripts.analyze:bundle=npm run prebuild && tsc -b && vite build --config vite.analyze.config.ts'
      - name: Verify targeted network boundary
        run: npm run test -- tests/services/auth/pwnedPassword.test.ts
      - name: Verify AI Lab runtime boundary
        run: npm run test -- tests/services/supabase/aiLabBoundary.test.ts
      - name: Verify scoring properties
        run: npm run test:property
      - name: Lint
        run: npm run lint
      - name: Build production app
        run: npm run build
      - name: Build Storybook
        run: npm run build:storybook
      - name: Generate bundle analysis
        run: npm run analyze:bundle
      - name: Validate generated dependency diff
        shell: bash
        run: |
          set -euo pipefail
          test -f .artifacts/bundle-stats.html
          git diff --check
          git status --short
      - name: Commit generated lockfile and retire bootstrap
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/final-tooling-bootstrap.yml
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo 'Bootstrap produced no dependency changes.' >&2
            exit 1
          fi
          git commit -m 'Bootstrap final engineering tooling'
          git push origin HEAD:agent/final-engineering-tooling
