name: AI observability extras

on:
  pull_request:
    paths:
      - 'ai/requirements-observability.txt'
      - 'ai/observability.py'
      - 'ai/shap_explain.py'
      - 'ai/model_zoo.py'
      - 'ai/explain.py'
      - 'ai/test_observability.py'
      - '.dvc/**'
      - '.dvcignore'
      - 'dvc.yaml'
      - '.github/workflows/ai-observability-extras.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extras:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            ai/requirements.txt
            ai/requirements-observability.txt
      - name: Install core and optional AI tooling
        run: pip install -r ai/requirements.txt -r ai/requirements-observability.txt pytest
      - name: Compile and exercise optional integrations
        working-directory: ai
        run: |
          python -m compileall -q observability.py shap_explain.py
          pytest -q test_observability.py
      - name: Validate DVC reproducibility stage
        run: |
          dvc doctor
          dvc repro ai-offline-guardrails
