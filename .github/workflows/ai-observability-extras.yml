name: AI observability extras

on:
  pull_request:
    paths:
      - 'ai/pyproject.toml'
      - 'ai/uv.lock'
      - 'ai/observability.py'
      - 'ai/shap_explain.py'
      - 'ai/model_zoo.py'
      - 'ai/explain.py'
      - 'ai/test_observability.py'
      - '.dvc/**'
      - '.dvcignore'
      - 'dvc.yaml'
      - '.github/workflows/ai-observability-extras.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extras:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Harden runner (audit egress)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install core and optional AI tooling
        # The optional group remains isolated but is resolved in ai/uv.lock.
        run: bash scripts/agent-tools/ai-sync.sh observability
      - name: Compile and exercise optional integrations
        working-directory: ai
        run: |
          python -m compileall -q observability.py shap_explain.py
          pytest -q test_observability.py
      - name: Validate DVC reproducibility stage
        run: |
          dvc doctor
          dvc repro ai-offline-guardrails
