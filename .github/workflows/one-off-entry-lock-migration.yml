name: One-off entry-lock caller migration

on:
  push:
    branches:
      - agent/migrate-entry-lock-context
    paths:
      - scripts/migrate-entry-lock-callers.mjs
      - .github/workflows/one-off-entry-lock-migration.yml

permissions:
  contents: write

jobs:
  migrate-callers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/migrate-entry-lock-context
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply scoped caller migration
        run: node scripts/migrate-entry-lock-callers.mjs
      - name: Validate patch hygiene
        run: git diff --check
      - name: Commit migrated callers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Migrate entry-lock callers to shared context"
          git push origin HEAD:agent/migrate-entry-lock-context
