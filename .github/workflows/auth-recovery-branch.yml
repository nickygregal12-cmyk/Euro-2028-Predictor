name: Auth recovery branch validation

on:
  push:
    branches:
      - agent/add-auth-recovery-e2e
    paths-ignore:
      - 'docs/quality/reconciliations/.auth-recovery-branch-validation.json'
      - 'docs/quality/reconciliations/.auth-recovery-branch-diagnostics.txt'

permissions:
  contents: read

jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm test
      - run: npm audit --omit=dev

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm
      - name: Install browser dependencies
        id: browser_npm
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm ci 2>&1 | tee /tmp/browser-npm.log
      - name: Install Chromium
        id: chromium
        if: steps.browser_npm.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npx playwright install --with-deps chromium 2>&1 | tee /tmp/browser-chromium.log
      - name: Start disposable local Supabase
        id: supabase_start
        if: steps.chromium.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npx --yes supabase@2.84.2 start 2>&1 | tee /tmp/browser-supabase-start.log
      - name: Rebuild migrations and seed
        id: supabase_reset
        if: steps.supabase_start.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npx --yes supabase@2.84.2 db reset --local 2>&1 | tee /tmp/browser-supabase-reset.log
      - name: Export local-only browser environment
        id: browser_env
        if: steps.supabase_reset.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          npx --yes supabase@2.84.2 status -o env > /tmp/supabase.env
          # shellcheck disable=SC1091
          source /tmp/supabase.env
          : "${API_URL:?Supabase API_URL missing}"
          : "${ANON_KEY:?Supabase ANON_KEY missing}"
          : "${SERVICE_ROLE_KEY:?Supabase SERVICE_ROLE_KEY missing}"
          MAIL_URL="${INBUCKET_URL:-http://127.0.0.1:54324}"
          {
            echo "E2E_SUPABASE_URL=$API_URL"
            echo "E2E_SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "E2E_MAIL_URL=$MAIL_URL"
            echo 'E2E_USER_EMAIL=e2e@euro28.local'
            echo 'E2E_USER_PASSWORD=E2e-local-only-2028!'
            echo "VITE_SUPABASE_URL=$API_URL"
            echo "VITE_SUPABASE_ANON_KEY=$ANON_KEY"
            echo 'VITE_DEV_AUTOLOGIN=true'
            echo 'VITE_DEV_USER_EMAIL=e2e@euro28.local'
            echo 'VITE_DEV_USER_PASSWORD=E2e-local-only-2028!'
          } >> "$GITHUB_ENV"
          echo 'Local browser environment exported.' > /tmp/browser-env.log
      - name: Run authenticated application journeys
        id: application_journeys
        if: steps.browser_env.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run test:e2e 2>&1 | tee /tmp/application-e2e.log
      - name: Run signup and password-recovery journeys
        id: auth_journeys
        if: steps.browser_env.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run test:e2e:auth 2>&1 | tee /tmp/auth-recovery-e2e.log
      - name: Upload branch diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: auth-recovery-branch-diagnostics
          path: |
            /tmp/browser-*.log
            /tmp/application-e2e.log
            /tmp/auth-recovery-e2e.log
            playwright-report/
            playwright-report-auth/
            test-results/
          if-no-files-found: ignore
          retention-days: 3
      - name: Require browser setup and both suites to pass
        shell: bash
        run: |
          printf 'npm=%s chromium=%s start=%s reset=%s env=%s app=%s auth=%s\n' \
            '${{ steps.browser_npm.outcome }}' \
            '${{ steps.chromium.outcome }}' \
            '${{ steps.supabase_start.outcome }}' \
            '${{ steps.supabase_reset.outcome }}' \
            '${{ steps.browser_env.outcome }}' \
            '${{ steps.application_journeys.outcome }}' \
            '${{ steps.auth_journeys.outcome }}'
          if [[ '${{ steps.browser_npm.outcome }}' != 'success' || \
                '${{ steps.chromium.outcome }}' != 'success' || \
                '${{ steps.supabase_start.outcome }}' != 'success' || \
                '${{ steps.supabase_reset.outcome }}' != 'success' || \
                '${{ steps.browser_env.outcome }}' != 'success' || \
                '${{ steps.application_journeys.outcome }}' != 'success' || \
                '${{ steps.auth_journeys.outcome }}' != 'success' ]]; then
            exit 1
          fi
      - if: always()
        run: npx --yes supabase@2.84.2 stop --no-backup

  record:
    if: always()
    needs: [application, browser]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/add-auth-recovery-e2e
      - name: Download safe browser diagnostics
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: auth-recovery-branch-diagnostics
          path: /tmp/auth-recovery-diagnostics
      - name: Record non-secret branch validation result
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/quality/reconciliations
          cat > docs/quality/reconciliations/.auth-recovery-branch-validation.json <<EOF
          {
            "run_id": "${GITHUB_RUN_ID}",
            "validated_commit": "${GITHUB_SHA}",
            "application": "${{ needs.application.result }}",
            "browser": "${{ needs.browser.result }}"
          }
          EOF
          {
            for name in browser-npm browser-chromium browser-supabase-start browser-supabase-reset browser-env application-e2e auth-recovery-e2e; do
              echo "===== ${name} ====="
              if [[ -f "/tmp/auth-recovery-diagnostics/${name}.log" ]]; then
                tail -n 140 "/tmp/auth-recovery-diagnostics/${name}.log"
              else
                echo 'No log captured.'
              fi
              echo
            done
          } > docs/quality/reconciliations/.auth-recovery-branch-diagnostics.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/quality/reconciliations/.auth-recovery-branch-validation.json \
            docs/quality/reconciliations/.auth-recovery-branch-diagnostics.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Record auth recovery branch diagnostics'
          git push origin HEAD:agent/add-auth-recovery-e2e
