name: Session deploy provider-poll Contract 132

on:
  push:
    branches:
      - ops/dev-provider-poll-contract132

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ops/dev-provider-poll-contract132
      - uses: supabase/setup-cli@v2
        with:
          version: latest
      - name: Inspect functions deploy command
        run: supabase functions deploy --help
      - name: Deploy exact committed provider-poll to Development
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}" || { echo 'SUPABASE_ACCESS_TOKEN repository secret is not configured'; exit 1; }
          supabase functions deploy provider-poll \
            --project-ref iouzoutneyjpugbbtdem \
            --no-verify-jwt
      - name: Verify deployed function inventory
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions list --project-ref iouzoutneyjpugbbtdem
      - name: Remove disposable deployment branch
        if: success()
        run: git push origin --delete ops/dev-provider-poll-contract132
