name: Contract 132 pgTAP repair

on:
  push:
    branches:
      - feature/provider-initial-fixture-approval-contract-132

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/provider-initial-fixture-approval-contract-132
      - name: Patch demonstrated pgTAP failures
        shell: python
        run: |
          from pathlib import Path

          migration = Path('supabase/migrations/20260807210812_provider_initial_fixture_approval.sql')
          text = migration.read_text()
          old = "select count(*)::integer, min(t.id)\n        into v_existing_count, v_team_id"
          new = "select count(*)::integer, min(t.id::text)::uuid\n        into v_existing_count, v_team_id"
          if old not in text:
              raise SystemExit('Expected UUID aggregate site not found')
          migration.write_text(text.replace(old, new, 1))

          privileges = Path('supabase/tests/080_function_privileges.sql')
          text = privileges.read_text()
          old = "  ('admin_open_season_competition(uuid)'),\n  ('admin_resolve_actual_third_place_tie(uuid,uuid[],text)');"
          new = "  ('admin_open_season_competition(uuid)'),\n  -- Contract 132. Initial provider calendars are browser-reachable only for\n  -- authenticated competition administrators; each function enforces\n  -- require_competition_admin() internally and service_role is revoked.\n  ('admin_approve_initial_provider_fixtures(uuid,text,text)'),\n  ('admin_reject_initial_provider_fixtures(uuid,text,text)'),\n  ('admin_resolve_actual_third_place_tie(uuid,uuid[],text)');"
          if old not in text:
              raise SystemExit('Expected authenticated allowlist insertion point not found')
          privileges.write_text(text.replace(old, new, 1))
      - name: Commit repair
        run: |
          git diff --check
          git diff --exit-code --quiet && { echo 'No repair required'; exit 0; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/migrations/20260807210812_provider_initial_fixture_approval.sql supabase/tests/080_function_privileges.sql
          git commit -m 'fix(db): repair contract 132 pgTAP failures'
          git push origin HEAD:feature/provider-initial-fixture-approval-contract-132
