name: Branch-only regenerate database types

# Temporary branch-only recovery for PR #802. The committed generated types
# describe hosted Development at contract 185 even though fresh read-only
# verification proves Development is contract 190. Run the repository's normal
# generator once from the same Development secret, commit only its generated
# outputs, then this workflow is removed before merge.
on:
  push:
    branches:
      - agent/bet-builder-fresh-odds-loop
    paths:
      - '.github/workflows/branch-regenerate-database-types.yml'

permissions:
  contents: write

env:
  FORBIDDEN_PRODUCTION_REF: vkfnsqdyhvtwyqkisxhk

jobs:
  regenerate:
    if: github.event.head_commit.message == 'Branch-only regenerate database types'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/bet-builder-fresh-odds-loop
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22.22.2
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prove the secret is Development, never Production
        env:
          SUPABASE_DEV_DB_URL: ${{ secrets.SUPABASE_DEV_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${SUPABASE_DEV_DB_URL}" ] || { echo 'SUPABASE_DEV_DB_URL is missing.' >&2; exit 1; }
          case "${SUPABASE_DEV_DB_URL}" in
            *"${FORBIDDEN_PRODUCTION_REF}"*) echo 'Refusing Production.' >&2; exit 1 ;;
          esac

      - name: Regenerate from hosted Development
        env:
          SUPABASE_DEV_DB_URL: ${{ secrets.SUPABASE_DEV_DB_URL }}
        run: npm run generate:types

      - name: Commit only generated type outputs
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- . ':!src/services/supabase/database.types.ts' ':!src/services/supabase/database.types.meta.json'
          if git diff --quiet -- src/services/supabase/database.types.ts src/services/supabase/database.types.meta.json; then
            echo 'Generator produced no changes.' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/services/supabase/database.types.ts src/services/supabase/database.types.meta.json
          git commit -m 'Regenerate database types from Development contract 190'
          git push origin HEAD:agent/bet-builder-fresh-odds-loop
