name: Create C1 migration file

# Temporary branch-only helper. Removed before the migration PR leaves draft.
on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/create-c1-migration.yml

permissions:
  contents: write

jobs:
  create-migration:
    if: github.head_ref == 'agent/stage-c1-migration'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stage-c1-migration
      - uses: supabase/setup-cli@v2
      - name: Create migration with Supabase CLI
        run: |
          set -euo pipefail
          supabase migration new stage_c1_competition_season_foundation
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations
          git commit -m "Create Stage C1 migration file"
          git push origin HEAD:agent/stage-c1-migration
