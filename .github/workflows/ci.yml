name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify Git-less environment hygiene behavior
        shell: bash
        run: |
          set -euo pipefail
          archive="$(mktemp -d)"
          git archive HEAD | tar -x -C "$archive"
          ln -s "$GITHUB_WORKSPACE/node_modules" "$archive/node_modules"
          cd "$archive"
          npx vitest run tests/scripts/envFileHygiene.test.ts --reporter=verbose
      - name: Build
        run: npm run build
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm run test
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  refresh-signout-e2e:
    if: github.event_name == 'pull_request' && github.head_ref == 'ux/sign-out-confirmation' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux/sign-out-confirmation
          fetch-depth: 1
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm
      - name: Update established browser login helpers
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          old = """  await page.getByRole('button', { name: 'Sign out', exact: true }).click()
  await expect(page).toHaveURL((url) => url.pathname === '/auth/login', { timeout: 15_000 })
"""
          new = """  await page.getByRole('button', { name: 'Sign out', exact: true }).click()
  const signOutDialog = page.getByRole('dialog', { name: 'Sign out?' })
  await expect(signOutDialog).toBeVisible()
  await signOutDialog.getByRole('button', { name: 'Sign out', exact: true }).click()
  await expect(page).toHaveURL((url) => url.pathname === '/auth/login', { timeout: 15_000 })
"""

          for filename in ['e2e/bracket-conflict.spec.ts', 'e2e/locked-state.spec.ts']:
              path = Path(filename)
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{filename}: expected one immediate sign-out helper, found {count}')
              path.write_text(text.replace(old, new, 1))
          PY

          git fetch origin main --depth=1 --quiet
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
      - name: Install dependencies
        run: npm ci
      - name: Guarded production build
        run: npm run build
      - name: Lint
        run: npm run lint
      - name: Full test suite
        run: npm run test
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Commit browser helper update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add e2e/bracket-conflict.spec.ts e2e/locked-state.spec.ts .github/workflows/ci.yml
          git commit -m "Confirm sign-out in browser login helpers"
          git push origin HEAD:ux/sign-out-confirmation
