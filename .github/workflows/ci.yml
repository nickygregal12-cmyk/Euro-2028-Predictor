name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The documentation sweep compares this change against its base, so
          # it needs history. The default depth of 1 leaves `git diff A...B`
          # with no common ancestor to resolve.
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.22.2
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate migration timestamps
        run: npm run check:migration-timestamps
      - name: Check the documentation authorities against the contract
        # Two halves. Without arguments it asserts freshness: a document that
        # names contract numbers must name the current one as its newest. With
        # a base and head it also asserts the SWEEP — a change that adds a
        # migration must touch every document marked for it, which is the half
        # that stops the drift rather than reporting it a day later.
        run: |
          if [ -n "${{ github.event.pull_request.base.sha }}" ]; then
            npm run check:documentation-authorities -- \
              "${{ github.event.pull_request.base.sha }}" \
              "${{ github.event.pull_request.head.sha }}"
          else
            npm run check:documentation-authorities
          fi
      - name: Check the generated current-state surface is current
        # NOW.md is generated from the contract files, not maintained. This is
        # what stops it becoming another page that states a moving value and
        # goes stale — the failure `DOC-001` is open against. It fails on an
        # out-of-date file and on a hand edit, because both differ from what the
        # generator would produce.
        run: npm run check:now
      - name: Verify Git-less environment hygiene behavior
        shell: bash
        run: |
          set -euo pipefail
          archive="$(mktemp -d)"
          git archive HEAD | tar -x -C "$archive"
          ln -s "$GITHUB_WORKSPACE/node_modules" "$archive/node_modules"
          cd "$archive"
          npx vitest run tests/scripts/envFileHygiene.test.ts --reporter=verbose
      - name: Build
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee /tmp/euro28-build.log
      - name: Compressed bundle budgets
        run: npm run check:bundle-budget
      - name: Lint
        run: npm run lint
      - name: Lint CSS
        # BLOCKING from the day it lands, which is the opposite of how the Knip
        # and Lighthouse steps below are introduced — and deliberately so. Those
        # two have findings whose stability nobody has measured. This one was
        # driven to zero before it was wired: the first run produced 20
        # findings, 18 were false positives from two configuration mistakes
        # (box-shadow's composite value, and color-mix over tokens), and the
        # remaining 2 are real, justified literals carrying an inline exemption
        # that says why. There is no backlog to grandfather, so a warning here
        # would only be a rule nobody has to obey.
        run: npm run lint:css
      - name: Domain coverage thresholds
        run: npm run test:coverage:domain
      - name: Test
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/euro28-vitest.log
          test_files="$(mktemp)"
          committed_files="$(mktemp)"
          npx vitest list --filesOnly --static-parse | sed 's|^\./||' | sort > "$test_files"
          git ls-files '*.test.ts' '*.test.tsx' | sort > "$committed_files"
          test_count="$(wc -l < "$test_files" | tr -d ' ')"
          committed_count="$(wc -l < "$committed_files" | tr -d ' ')"

          # The loop below runs whatever `vitest list` found, so a config change
          # that finds nothing makes it iterate zero times and the step exit 0 —
          # the whole suite silently not running, reported as green. `vitest
          # list` exits 0 on an empty result, so nothing else here notices.
          #
          # The expectation is derived from `git ls-files` rather than written
          # down as a number. Two reasons:
          #
          #   1. A hardcoded floor had to be raised by hand every time a test
          #      file was added, which made this one line collide with every
          #      concurrent branch that added tests. It re-conflicted the C1b
          #      PR three times in one day.
          #   2. Set equality is a stronger check than a count. A committed test
          #      file that vitest stops discovering is the same silent-skip bug
          #      as discovering nothing, only quieter — and no floor, at any
          #      value, can see it.
          #
          # `git ls-files` is independent of the Vitest config, so a config that
          # breaks discovery cannot also move the expectation.
          sanity_floor=100
          if [ "$committed_count" -lt "$sanity_floor" ]; then
            echo "Only ${committed_count} committed test files found; expected at least ${sanity_floor}." >&2
            echo "The expectation itself looks wrong, so the comparison below would be meaningless." >&2
            exit 1
          fi
          if ! diff -u "$committed_files" "$test_files"; then
            echo "Vitest discovery does not match the committed test files " >&2
            echo "(${test_count} discovered, ${committed_count} committed)." >&2
            echo "Lines starting '-' are committed but not discovered: they would not run." >&2
            echo "Refusing to report a pass on a suite that did not run in full." >&2
            exit 1
          fi
          echo "Running ${test_count} Vitest files in isolated processes." | tee -a /tmp/euro28-vitest.log
          while IFS= read -r test_file; do
            [ -n "$test_file" ] || continue
            echo "=== ${test_file} ===" | tee -a /tmp/euro28-vitest.log
            npm run test -- "$test_file" 2>&1 | tee -a /tmp/euro28-vitest.log
          done < "$test_files"
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ci-failure-logs
          path: |
            /tmp/euro28-build.log
            /tmp/euro28-vitest.log
          if-no-files-found: warn
          retention-days: 7
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Audit all dependencies at moderate (report only)
        # A SECOND, wider question than the blocking step above: what is there at
        # moderate severity, including devDependencies. It is deliberately
        # non-blocking — the point of the first run is to learn the VOLUME. A
        # repository whose CI holds production database credentials cannot treat
        # dev-dependency compromise as out of scope, but neither can it adopt a
        # gate whose noise level nobody has measured.
        #
        # `|| true` rather than `--audit-level=none`: npm audit exits non-zero on
        # findings at or above the level, and there is no "report but pass" flag.
        continue-on-error: true
        run: npm audit --audit-level=moderate || true
      - name: Dead code report (knip, report only)
        # `check:dead-code` and its configuration have existed since 5 August
        # 2026 and no workflow ran them — the gate was built and never closed.
        #
        # Report-only, and it stays that way until the criteria in
        # docs/quality/knip-baseline.md are met: "it becomes a CI gate once the
        # report is stable and its intentional ignores are narrow". That baseline
        # classified 213 findings and found most of them benign — barrel
        # re-exports and module-local constants carrying a needless `export` —
        # so a blocking version today would fail every pull request for reasons
        # its own baseline calls false. The npm script already carries
        # `--no-exit-code`; `continue-on-error` is belt and braces for the day
        # somebody removes it without reading the baseline.
        continue-on-error: true
        run: npm run check:dead-code
      - name: Lighthouse (report only)
        # Same shape as the step above: lighthouserc.json, scripts/run-lighthouse.mjs
        # and @lhci/cli all existed and no workflow called them.
        #
        # It audits a LOCAL production build, not the deploy preview, and that is
        # a measured decision rather than a convenience — see
        # docs/quality/lighthouse-baseline.md. Two pull requests that changed no
        # runtime code at all scored 20 and 21 on their previews while the same
        # bundle scores 89-95 locally, so a preview-targeted job would report
        # infrastructure as product quality and send someone hunting a regression
        # in code that had not changed. The audit recommending "against the
        # deploy preview" did not have that evidence; the repository does.
        #
        # Report-only for the reason the same baseline gives: nobody has yet
        # measured how far performance drifts between runs on shared CI
        # infrastructure, and a floor set before that is a false-alarm generator.
        # The accessibility assertion inside lighthouserc.json is already `error`
        # at minScore 1, so when this step is promoted to blocking it arrives
        # with teeth already fitted.
        continue-on-error: true
        run: npm run check:lighthouse
