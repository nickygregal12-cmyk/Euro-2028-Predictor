name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate migration timestamps
        run: npm run check:migration-timestamps
      - name: Verify Git-less environment hygiene behavior
        shell: bash
        run: |
          set -euo pipefail
          archive="$(mktemp -d)"
          git archive HEAD | tar -x -C "$archive"
          ln -s "$GITHUB_WORKSPACE/node_modules" "$archive/node_modules"
          cd "$archive"
          npx vitest run tests/scripts/envFileHygiene.test.ts --reporter=verbose
      - name: Build
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee /tmp/euro28-build.log
      - name: Compressed bundle budgets
        run: npm run check:bundle-budget
      - name: Lint
        run: npm run lint
      - name: Domain coverage thresholds
        run: npm run test:coverage:domain
      - name: Test
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/euro28-vitest.log
          test_files="$(mktemp)"
          npx vitest list --filesOnly --static-parse > "$test_files"
          test_count="$(wc -l < "$test_files" | tr -d ' ')"
          # Discovery floor. The loop below runs whatever `vitest list` found, so
          # a config change that finds nothing makes it iterate zero times and
          # the step exit 0 — the whole suite silently not running, reported as
          # green. `vitest list` exits 0 on an empty result, so nothing else here
          # notices. `tests/scripts/ciTestDiscoveryFloor.test.ts` keeps this
          # number honest against the files actually on disk.
          minimum_test_files=207
          if [ "$test_count" -lt "$minimum_test_files" ]; then
            echo "Vitest discovered ${test_count} test files; at least ${minimum_test_files} are expected." >&2
            echo "Refusing to report a pass on a suite that did not run." >&2
            exit 1
          fi
          echo "Running ${test_count} Vitest files in isolated processes." | tee -a /tmp/euro28-vitest.log
          while IFS= read -r test_file; do
            [ -n "$test_file" ] || continue
            echo "=== ${test_file} ===" | tee -a /tmp/euro28-vitest.log
            npm run test -- "$test_file" 2>&1 | tee -a /tmp/euro28-vitest.log
          done < "$test_files"
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-failure-logs
          path: |
            /tmp/euro28-build.log
            /tmp/euro28-vitest.log
          if-no-files-found: warn
          retention-days: 7
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
