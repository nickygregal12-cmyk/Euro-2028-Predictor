name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair-c1b-final:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.number == 371 &&
      github.head_ref == 'agent/c1b-game-catalogue-memberships'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
      - name: Apply exact-head final C1b repair once
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin agent/c1b-game-catalogue-memberships
          remote_head="$(git rev-parse origin/agent/c1b-game-catalogue-memberships)"
          [ "${remote_head}" = "${EXPECTED_HEAD_SHA}" ] || {
            echo "ERROR: C1b branch moved concurrently; refusing repair push."
            exit 1
          }
          [ "$(git rev-parse HEAD)" = "${EXPECTED_HEAD_SHA}" ] || {
            echo "ERROR: checkout is not the exact PR head."
            exit 1
          }
          if [ -f .c1b-final-repair-applied ]; then
            echo "Final C1b repair already applied."
            exit 0
          fi
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs'
          const path = 'scripts/ops/apply-c1b-final-repair.mjs'
          const source = readFileSync(path, 'utf8')
          const guard = `  if (source.indexOf(before, first + before.length) >= 0) {
            throw new Error(\`Non-unique target: \${label}\`)
          }
          `
          const matches = source.split(guard).length - 1
          if (matches !== 1) throw new Error(`Expected one replaceOnce uniqueness guard, found ${matches}`)
          writeFileSync(path, source.replace(guard, ''))
          NODE
          node scripts/ops/apply-c1b-final-repair.mjs
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/architecture/stage-c-schema-coverage.md \
            supabase/migrations/20260803070000_c1b_game_catalogue_memberships.sql \
            supabase/tests/100_operating_cap_enforcement.sql \
            supabase/tests/102_other_player_profiles.sql \
            supabase/tests/118_c1b_game_catalogue_memberships.sql \
            .c1b-final-repair-applied
          git commit -m "Repair final C1b compatibility gates"
          git push origin "HEAD:agent/c1b-game-catalogue-memberships"

  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate migration timestamps
        run: npm run check:migration-timestamps
      - name: Verify Git-less environment hygiene behavior
        shell: bash
        run: |
          set -euo pipefail
          archive="$(mktemp -d)"
          git archive HEAD | tar -x -C "$archive"
          ln -s "$GITHUB_WORKSPACE/node_modules" "$archive/node_modules"
          cd "$archive"
          npx vitest run tests/scripts/envFileHygiene.test.ts --reporter=verbose
      - name: Build
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee /tmp/euro28-build.log
      - name: Compressed bundle budgets
        run: npm run check:bundle-budget
      - name: Lint
        run: npm run lint
      - name: Domain coverage thresholds
        run: npm run test:coverage:domain
      - name: Test
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/euro28-vitest.log
          test_files="$(mktemp)"
          npx vitest list --filesOnly --static-parse > "$test_files"
          test_count="$(wc -l < "$test_files" | tr -d ' ')"
          # Discovery floor. The loop below runs whatever `vitest list` found, so
          # a config change that finds nothing makes it iterate zero times and
          # the step exit 0 — the whole suite silently not running, reported as
          # green. `vitest list` exits 0 on an empty result, so nothing else here
          # notices. `tests/scripts/ciTestDiscoveryFloor.test.ts` keeps this
          # number honest against the files actually on disk.
          minimum_test_files=200
          if [ "$test_count" -lt "$minimum_test_files" ]; then
            echo "Vitest discovered ${test_count} test files; at least ${minimum_test_files} are expected." >&2
            echo "Refusing to report a pass on a suite that did not run." >&2
            exit 1
          fi
          echo "Running ${test_count} Vitest files in isolated processes." | tee -a /tmp/euro28-vitest.log
          while IFS= read -r test_file; do
            [ -n "$test_file" ] || continue
            echo "=== ${test_file} ===" | tee -a /tmp/euro28-vitest.log
            npm run test -- "$test_file" 2>&1 | tee -a /tmp/euro28-vitest.log
          done < "$test_files"
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-failure-logs
          path: |
            /tmp/euro28-build.log
            /tmp/euro28-vitest.log
          if-no-files-found: warn
          retention-days: 7
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
