name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify Git-less environment hygiene behavior
        shell: bash
        run: |
          set -euo pipefail
          archive="$(mktemp -d)"
          git archive HEAD | tar -x -C "$archive"
          ln -s "$GITHUB_WORKSPACE/node_modules" "$archive/node_modules"
          cd "$archive"
          npx vitest run tests/scripts/envFileHygiene.test.ts --reporter=verbose
      - name: Build
        run: npm run build
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm run test
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  reconcile-rel006:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/idempotent-entry-creation' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/idempotent-entry-creation
          fetch-depth: 1
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm
      - name: Reconcile authoritative quality documents
        shell: bash
        run: |
