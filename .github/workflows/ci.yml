name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify Git-less environment hygiene behavior
        shell: bash
        run: |
          set -euo pipefail
          archive="$(mktemp -d)"
          git archive HEAD | tar -x -C "$archive"
          ln -s "$GITHUB_WORKSPACE/node_modules" "$archive/node_modules"
          cd "$archive"
          npx vitest run tests/scripts/envFileHygiene.test.ts --reporter=verbose
      - name: Build
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee /tmp/euro28-build.log
      - name: Lint
        run: npm run lint
      - name: Test
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/euro28-vitest.log
          # The suite currently contains fewer than 120 files. Using more shards
          # than files gives each populated shard one file and starts a fresh Node
          # process for it; empty shards are accepted explicitly.
          shard_count=120
          for shard in $(seq 1 "$shard_count"); do
            echo "=== Vitest shard ${shard}/${shard_count} ===" | tee -a /tmp/euro28-vitest.log
            if [ "$shard" -eq 95 ]; then
              echo 'Files assigned to the high-memory shard:' | tee -a /tmp/euro28-vitest.log
              npx vitest list --shard="${shard}/${shard_count}" 2>&1 | tee -a /tmp/euro28-vitest.log
              NODE_OPTIONS=--max-old-space-size=6144 \
                npm run test -- --shard="${shard}/${shard_count}" --passWithNoTests 2>&1 \
                | tee -a /tmp/euro28-vitest.log
            else
              npm run test -- --shard="${shard}/${shard_count}" --passWithNoTests 2>&1 \
                | tee -a /tmp/euro28-vitest.log
            fi
          done
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-failure-logs
          path: |
            /tmp/euro28-build.log
            /tmp/euro28-vitest.log
          if-no-files-found: warn
          retention-days: 7
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
