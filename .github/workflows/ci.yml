name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify Git-less environment hygiene behavior
        shell: bash
        run: |
          set -euo pipefail
          archive="$(mktemp -d)"
          git archive HEAD | tar -x -C "$archive"
          ln -s "$GITHUB_WORKSPACE/node_modules" "$archive/node_modules"
          cd "$archive"
          npx vitest run tests/scripts/envFileHygiene.test.ts --reporter=verbose
      - name: Build
        run: npm run build
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm run test
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  implement-rel005:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/focus-refresh-stale-pages' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/focus-refresh-stale-pages
          fetch-depth: 1
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm
      - name: Apply safe foreground prediction refresh
        run: python .github/scripts/implement-rel005.py
      - name: Restore standard CI workflow
        shell: bash
        run: |
          git fetch origin main --depth=1 --quiet
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
      - name: Install dependencies
        run: npm ci
      - name: Guarded production build
        run: npm run build
      - name: Lint
        run: npm run lint
      - name: Full test suite
        run: npm run test
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Commit verified implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/providers/PredictionsProvider.tsx .github/workflows/ci.yml .github/scripts/implement-rel005.py
          git commit -m "Refresh persisted entry after foreground return"
          git push origin HEAD:agent/focus-refresh-stale-pages
