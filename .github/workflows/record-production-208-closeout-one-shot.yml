name: Record Production 208 closeout one-shot

on:
  push:
    branches:
      - ops/closeout-production-208
    paths:
      - .github/workflows/record-production-208-closeout-one-shot.yml

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ops/closeout-production-208
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.2

      - name: Record verified Production Contract 208
        shell: bash
        run: |
          set -euo pipefail
          cat > config/production-hosted-contract.json <<'JSON'
          {
            "projectRef": "vkfnsqdyhvtwyqkisxhk",
            "requiredMigrationCount": 208,
            "latestMigrationVersion": "20260819130000",
            "latestMigrationName": "cup_bracket_outcome_and_knockout_stage",
            "verifiedAt": "2026-08-20T00:43:00.528917Z",
            "evidence": {
              "source": "Contracts 206 through 208 were applied to Production on 20 August 2026 by guarded rollout run 32318082186 from exact main f2c244b6a4a0fb27e81624df41a9e893d39bd565, coordinated by run 32317678763 and gated on fresh encrypted backup run 32312404053 plus exact-head disposable-restore rehearsal run 32317690357. The rehearsal PASSED before Production mutation: the live Production database was dumped and restored to a disposable Supabase copy, exactly the three additive migrations 20260819110000_same_season_player_profile.sql, 20260819120000_cup_phase_determinate_membership.sql and 20260819130000_cup_bracket_outcome_and_knockout_stage.sql were applied, behavioural pgTAP suites passed, and Production-derived protected state was unchanged. The rollout then dry-ran exactly those three files, applied them, and its own postflight PASSED. An independent read-only query against Production after the workflow independently confirmed 208 ledger rows naming 20260819130000 cup_bracket_outcome_and_knockout_stage; authenticated-only execution for get_season_player_profile_by_ref, legacy get_season_player_profile, get_season_cup_phase and get_season_cup_bracket; determinate split-phase membership; your_outcome in the bracket payload; and knockout stages narrowed to playoff/knockout. Protected Production state matches the pre-rollout baseline exactly: 1 auth user, 1 profile, 3 entries, 16 season predictions, 36 match predictions, 0 season matchweek scores, 4 competition entrants, 1 league, 1 league member, 0 Cup launches, 0 Cup fixtures, 578 season fixtures, 230 ai bets, 397 ai.api_usage rows, 11 cron jobs, and both publication gates false. After this direct database proof, EURO28_DEPLOYED_DB_CONTRACT was raised from 205 to 208 in the Production build context of both active Netlify projects; direct Netlify read-back confirmed dev, branch-deploy, deploy-preview and production all declare 208 on both predictorhub and euro28predictor. The Netlify variable change is configuration evidence, not proof of a newly published bundle.",
              "workflowRunId": 32318082186,
              "rehearsalRunId": 32317690357,
              "backupRunId": 32312404053,
              "coordinatorRunId": 32317678763,
              "repositoryHead": "f2c244b6a4a0fb27e81624df41a9e893d39bd565"
            },
            "promotionAuthorised": false
          }
          JSON

      - name: Refresh live hosted migration index
        shell: bash
        run: |
          set -euo pipefail
          cat > docs/ops/ops-pending-migrations.md <<'DOC'
          # Hosted migration status

          > **Live index only.** The machine records are authoritative; this page exists so a human or AI can see the current rollout boundary without reading the historical contract chronology. The previous full narrative is preserved at [`docs/history/context-reset-2026-08-19/ops-pending-migrations.pre-reconciliation.txt`](../history/context-reset-2026-08-19/ops-pending-migrations.pre-reconciliation.txt).

          ## Current state — repository 208, Production 208, Development 208 (20 August 2026)

          Repository contract **208** is the head of the committed migration chain.

          | Environment | Recorded contract | Authority |
          | --- | ---: | --- |
          | Development Supabase `iouzoutneyjpugbbtdem` | **208** | [`config/development-hosted-contract.json`](../../config/development-hosted-contract.json) |
          | Production Supabase `vkfnsqdyhvtwyqkisxhk` | **208** | [`config/production-hosted-contract.json`](../../config/production-hosted-contract.json) |

          **Repository, Development and Production are level at Contract 208. There are no pending repository migrations in either hosted environment.**

          Contracts 206 through 208 reached Development first through guarded fast-lane run `32312618799`. Production then crossed the exact 205-to-208 boundary through guarded rollout run `32318082186` from exact `main` `f2c244b6a4a0fb27e81624df41a9e893d39bd565`, gated on encrypted backup `32312404053` and exact-head disposable-restore rehearsal `32317690357`; coordinator run `32317678763` also re-proved that `main` had not moved between rehearsal and rollout. The canonical rollout postflight passed, and an independent read-only Production query then named all 208 ledger rows and the final migration before the machine record was written.

          ## Netlify deployed-contract declarations

          `EURO28_DEPLOYED_DB_CONTRACT` is compatibility metadata for builds, not proof that a bundle was rebuilt or published. A declaration may trail its hosted database; it must never lead it.

          | Surface | Context | Declared contract |
          | --- | --- | ---: |
          | Netlify `predictorhub` | `dev`, `branch-deploy`, `deploy-preview` | **208** |
          | Netlify `predictorhub` | `production` | **208** |
          | Netlify `euro28predictor` | `dev`, `branch-deploy`, `deploy-preview` | **208** |
          | Netlify `euro28predictor` | `production` | **208** |

          The three non-production contexts were raised only after Development reached 208. The Production contexts stayed at 205 until Production itself was independently verified at 208, then both were raised to 208 and read back directly from Netlify.

          - **No repository migration is pending in Development or Production.**
          - `promotionAuthorised` remains false in the Production machine record; closing a completed rollout is not standing authority for a future one.
          - Repository, Development, Production and a published Netlify bundle remain separate closure states. Never infer one from another.
          - The historic Netlify project `euro28-predictor-dev` is out of scope for the current Development/Production migration lane.

          ## How to use this page

          1. Read the three machine records before any future rollout.
          2. If Development trails the repository, use the guarded Development lane required by the governing ADR/workflow.
          3. Production moves only under explicit authority for the exact boundary and with its own backup/rehearsal gates.
          4. For why a historical contract existed, use the archived narrative or the migration/PR itself — do not reconstruct history from this live index.

          The old “Repository candidate … applied to no hosted environment by this record” blocks are **historical contract records**, not a current pending queue; that wording is intentionally kept only in the archive.
          DOC

      - name: Refresh Netlify declaration runbook without rewriting history
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs'
          const path = 'docs/ops/netlify-deploy-access.md'
          let s = readFileSync(path, 'utf8')
          const oldTable = `| Context | Supabase target | Declared hosted contract |\n| --- | --- | ---: |\n| \`dev\` | Development | 178 |\n| \`branch-deploy\` | Development | 178 |\n| \`deploy-preview\` | Development | 178 |\n| \`production\` | Production | 178 |`
          const newTable = `| Context | Supabase target | Declared hosted contract |\n| --- | --- | ---: |\n| \`dev\` | Development | 208 |\n| \`branch-deploy\` | Development | 208 |\n| \`deploy-preview\` | Development | 208 |\n| \`production\` | Production | 208 |`
          if (!s.includes(oldTable)) throw new Error('expected Netlify declaration table not found')
          s = s.replace(oldTable, newTable)
          const anchor = `${newTable}\n\n`
          const current = `A direct Netlify environment read on **20 August 2026** confirmed all four active build-context declarations at **208 on both projects**. Development, branch-deploy and deploy-preview moved only after Development Supabase was verified at 208. Production remained at 205 until guarded Production rollout run \`32318082186\` and an independent read-only Production query both confirmed Contract 208; only then were the two Production declarations raised to 208 and read back. This environment-variable change is configuration evidence, not proof that a new application bundle has been published.\n\n`
          if (!s.includes(anchor)) throw new Error('Netlify declaration insertion anchor missing')
          s = s.replace(anchor, anchor + current)
          const heading = '## Published production artifact'
          const historicalHeading = '## Last fully smoke-verified published production artifact (12 August 2026)'
          if (!s.includes(heading)) throw new Error('published artifact heading missing')
          s = s.replace(heading, historicalHeading)
          const artifactIntro = `${historicalHeading}\n\n`
          const historicalNote = `> **Historical release evidence, not current deploy identity.** This table is retained because both artifacts were fully smoke-verified at the same commit. Current deploy identity must be read directly from Netlify; the live compatibility declarations are the table above.\n\n`
          s = s.replace(artifactIntro, artifactIntro + historicalNote)
          writeFileSync(path, s)
          NODE

      - name: Regenerate current-state authorities
        shell: bash
        run: |
          set -euo pipefail
          npm run generate:now
          npm run check:now

      - name: Retire spent one-shot rollout bridges
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/contract-208-production-coordinator-one-shot.yml
          rm -f .github/workflows/contract-206-development-one-shot.yml
          rm -f .github/workflows/record-production-208-closeout-one-shot.yml

      - name: Commit only the closeout delta
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            config/production-hosted-contract.json \
            docs/ops/ops-pending-migrations.md \
            docs/ops/netlify-deploy-access.md \
            NOW.md \
            docs/quality/current-status.md \
            .github/workflows/contract-208-production-coordinator-one-shot.yml \
            .github/workflows/contract-206-development-one-shot.yml \
            .github/workflows/record-production-208-closeout-one-shot.yml
          git diff --cached --check
          git diff --cached --name-only
          git commit -m 'Ops: record verified Production Contract 208'
          git push origin HEAD:ops/closeout-production-208
