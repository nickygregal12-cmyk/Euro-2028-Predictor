name: Production 190 to 198 rehearsal

# Read-only rehearsal of Contracts 191 to 198 against a disposable copy of
# Production. The encrypted backup remains the rollback authority; its private
# age key stays offline. This workflow independently reads Production only
# through dumps and applies the eight approved migrations to a disposable
# restore.
#
# This span differs from every earlier one in a way that matters: it is EIGHT
# migrations, not one. The boundary checks below therefore prove the exact SET
# rather than a single filename, and every one of the eight is additive.

on:
  workflow_dispatch:
    inputs:
      project_ref:
        description: Exact Production project ref confirmation
        required: true
      confirmation:
        description: Type REHEARSE-PRODUCTION-190-TO-198 to proceed
        required: true
      backup_run_id:
        description: Run id of the successful fresh Production backup
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: production-190-to-198-rehearsal
  cancel-in-progress: false

env:
  EXPECTED_PROJECT_REF: vkfnsqdyhvtwyqkisxhk
  FORBIDDEN_DEVELOPMENT_REF: iouzoutneyjpugbbtdem
  CONFIRMATION_PHRASE: REHEARSE-PRODUCTION-190-TO-198
  SOURCE_CONTRACT: '190'
  SOURCE_VERSION: '20260814005000'
  SOURCE_NAME: ai_actionable_bet_evidence
  TARGET_CONTRACT: '198'
  TARGET_VERSION: '20260818030000'
  TARGET_NAME: cup_knockout_reservation
  WORK_DIR: /tmp/production-190-to-198-rehearsal
  LOCAL_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres

jobs:
  rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Refuse an unsafe dispatch or repository state
        env:
          INPUT_PROJECT_REF: ${{ inputs.project_ref }}
          INPUT_CONFIRMATION: ${{ inputs.confirmation }}
        shell: bash
        run: |
          set -euo pipefail
          [ "${INPUT_CONFIRMATION}" = "${CONFIRMATION_PHRASE}" ] || { echo 'ERROR: confirmation phrase mismatch.'; exit 1; }
          [ "${INPUT_PROJECT_REF}" != "${FORBIDDEN_DEVELOPMENT_REF}" ] || { echo 'ERROR: that is Development.'; exit 1; }
          [ "${INPUT_PROJECT_REF}" = "${EXPECTED_PROJECT_REF}" ] || { echo 'ERROR: project ref is not Production.'; exit 1; }
          [ "${GITHUB_REF}" = 'refs/heads/main' ] || { echo 'ERROR: rehearsal runs only from main.'; exit 1; }
          git fetch --no-tags origin main
          [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" ] || { echo 'ERROR: HEAD is not exact main.'; exit 1; }
          [ -z "$(git status --porcelain=v1 --untracked-files=all)" ] || { echo 'ERROR: checkout is dirty.'; exit 1; }
          mkdir -p "${WORK_DIR}"

      - name: Prove a fresh encrypted backup succeeded first
        env:
          GH_TOKEN: ${{ github.token }}
          BACKUP_RUN_ID: ${{ inputs.backup_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${BACKUP_RUN_ID}")"
          [ "$(jq -r '.conclusion' <<<"${json}")" = success ] || { echo 'ERROR: backup did not succeed.'; exit 1; }
          [ "$(jq -r '.path' <<<"${json}")" = '.github/workflows/production-backup.yml' ] || { echo 'ERROR: not the backup workflow.'; exit 1; }
          backup_sha="$(jq -r '.head_sha' <<<"${json}")"
          git merge-base --is-ancestor "${backup_sha}" HEAD || { echo 'ERROR: backup head is not an ancestor of rehearsal head.'; exit 1; }
          artifacts="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${BACKUP_RUN_ID}/artifacts")"
          [ "$(jq '[.artifacts[] | select(.name == "production-backup-encrypted" and .expired == false)] | length' <<<"${artifacts}")" = 1 ] || { echo 'ERROR: encrypted backup artifact missing.'; exit 1; }
          echo "Backup ${BACKUP_RUN_ID} verified."

      - name: Refuse to make Production the first hosted environment to see these
        shell: bash
        run: |
          set -euo pipefail
          # ADR 0024's ordering rule, restored. It was enforced at the 145-to-151
          # boundary -- where it CAUGHT a stale record and refused before
          # touching anything -- and has not been present on a rehearsal since.
          # Eight migrations at once is the worst possible span on which to
          # discover that Production went first.
          #
          # This reads the machine record rather than the Development database:
          # the record is what CI keeps honest, and a rehearsal holding
          # Production credentials should not also hold Development's.
          dev_ref="$(node -p "require('./config/development-hosted-contract.json').projectRef")"
          dev_contract="$(node -p "require('./config/development-hosted-contract.json').requiredMigrationCount")"
          [ "${dev_ref}" = "${FORBIDDEN_DEVELOPMENT_REF}" ] || {
            echo "ERROR: the Development record names ${dev_ref}, not the Development project."
            exit 1
          }
          if [ "${dev_contract}" -lt "${TARGET_CONTRACT}" ]; then
            echo "ERROR: Development is recorded at contract ${dev_contract} and this boundary ends at ${TARGET_CONTRACT}."
            echo 'Production must not be the first hosted environment to see a migration.'
            echo 'Run the Development fast lane first, reconcile that record, and try again.'
            exit 1
          fi
          echo "Development is recorded at contract ${dev_contract}, at or beyond this boundary's ${TARGET_CONTRACT}."

      - name: Prove the repository boundary is exactly 190 to 198
        shell: bash
        run: |
          set -euo pipefail
          committed="$(git ls-files 'supabase/migrations/*.sql' | wc -l | tr -d ' ')"
          declared="$(node -p "require('./config/deployment-contract.json').requiredMigrationCount")"
          newest="$(basename "$(git ls-files 'supabase/migrations/*.sql' | sort | tail -1)")"
          [ "${committed}" = "${TARGET_CONTRACT}" ] || { echo "ERROR: repository has ${committed} migrations."; exit 1; }
          [ "${declared}" = "${TARGET_CONTRACT}" ] || { echo "ERROR: deployment contract is ${declared}."; exit 1; }
          [ "${newest}" = "${TARGET_VERSION}_${TARGET_NAME}.sql" ] || { echo "ERROR: newest migration is ${newest}."; exit 1; }
          : > "${WORK_DIR}/boundary.txt"
          for file in $(git ls-files 'supabase/migrations/*.sql' | sort); do
            version="$(basename "${file}")"; version="${version:0:14}"
            if [[ "${version}" > "${SOURCE_VERSION}" && ! "${version}" > "${TARGET_VERSION}" ]]; then
              basename "${file}" >> "${WORK_DIR}/boundary.txt"
              node scripts/check-migration-additive.mjs "${file}"
            fi
          done
          count="$(wc -l < "${WORK_DIR}/boundary.txt" | tr -d ' ')"
          [ "${count}" = 8 ] || { echo "ERROR: boundary holds ${count} migrations, expected 8."; cat "${WORK_DIR}/boundary.txt"; exit 1; }
          cat "${WORK_DIR}/boundary.txt"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.22.2

      - uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf
        with:
          version: 2.109.1
          github-token: ${{ github.token }}

      - name: Install PostgreSQL 17 client tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17

      - name: Confirm Production is exactly 190 before dumping it
        env:
          SUPABASE_PROD_DB_URL: ${{ secrets.SUPABASE_PROD_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${SUPABASE_PROD_DB_URL}" ] || { echo 'ERROR: SUPABASE_PROD_DB_URL missing.'; exit 1; }
          case "${SUPABASE_PROD_DB_URL}" in
            *"${FORBIDDEN_DEVELOPMENT_REF}"*) echo 'ERROR: Production secret resolves to Development.'; exit 1 ;;
            *"${EXPECTED_PROJECT_REF}"*) ;;
            *) echo 'ERROR: Production secret does not name Production.'; exit 1 ;;
          esac
          psql "${SUPABASE_PROD_DB_URL}" -X -q -A -t -v ON_ERROR_STOP=1 -f - > "${WORK_DIR}/live.json" <<'SQL'
          select jsonb_build_object(
            'migration_count',(select count(*) from supabase_migrations.schema_migrations),
            'latest_version',(select version from supabase_migrations.schema_migrations order by version desc limit 1),
            'latest_name',(select name from supabase_migrations.schema_migrations order by version desc limit 1));
          SQL
          cat "${WORK_DIR}/live.json"
          LIVE_FILE="${WORK_DIR}/live.json" node --input-type=module <<'NODE'
          import fs from 'node:fs'
          const x = JSON.parse(fs.readFileSync(process.env.LIVE_FILE, 'utf8'))
          const want = {
            migration_count: Number(process.env.SOURCE_CONTRACT),
            latest_version: process.env.SOURCE_VERSION,
            latest_name: process.env.SOURCE_NAME,
          }
          for (const [k, v] of Object.entries(want)) {
            if (String(x[k]) !== String(v)) throw new Error(`Production ${k}=${x[k]}, expected ${v}`)
          }
          NODE

      - name: Dump Production and restore disposable copy
        env:
          SUPABASE_PROD_DB_URL: ${{ secrets.SUPABASE_PROD_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          supabase init --force --workdir "${WORK_DIR}" >/dev/null 2>&1 || true
          supabase start --workdir "${WORK_DIR}"
          BUNDLE="${WORK_DIR}/bundle"; ROLLOUT="${GITHUB_WORKSPACE}/scripts/database-rollout"; mkdir -p "${BUNDLE}"
          supabase db dump --db-url "${SUPABASE_PROD_DB_URL}" --file "${BUNDLE}/roles.sql" --role-only
          supabase db dump --db-url "${SUPABASE_PROD_DB_URL}" --file "${BUNDLE}/schema.sql"
          supabase db dump --db-url "${SUPABASE_PROD_DB_URL}" --file "${BUNDLE}/data.sql" --use-copy --data-only -x storage.buckets_vectors -x storage.vector_indexes
          /usr/lib/postgresql/17/bin/pg_dump --dbname "${SUPABASE_PROD_DB_URL}" --schema supabase_migrations --no-owner --no-privileges --file "${BUNDLE}/migration-history.sql"
          for f in roles.sql schema.sql data.sql migration-history.sql; do [ -s "${BUNDLE}/${f}" ] || { echo "ERROR: missing ${f}"; exit 1; }; done
          psql "${LOCAL_DB_URL}" -X --single-transaction -v ON_ERROR_STOP=1 --file "${BUNDLE}/roles.sql"
          psql "${LOCAL_DB_URL}" -X --single-transaction -v ON_ERROR_STOP=1 --file "${ROLLOUT}/prepare-disposable-restore-target.sql"
          psql "${LOCAL_DB_URL}" -X --single-transaction -v ON_ERROR_STOP=1 --file "${BUNDLE}/schema.sql"
          psql "${LOCAL_DB_URL}" -X --single-transaction -v ON_ERROR_STOP=1 --command 'SET session_replication_role = replica' --file "${BUNDLE}/data.sql"
          psql "${LOCAL_DB_URL}" -X --single-transaction -v ON_ERROR_STOP=1 --file "${ROLLOUT}/managed-schema-customizations.sql"
          psql "${LOCAL_DB_URL}" -X --single-transaction -v ON_ERROR_STOP=1 --file "${BUNDLE}/migration-history.sql"
          restored="$(psql "${LOCAL_DB_URL}" -X -q -A -t -v ON_ERROR_STOP=1 -c 'select count(*) from supabase_migrations.schema_migrations')"
          [ "${restored}" = "${SOURCE_CONTRACT}" ] || { echo "ERROR: restored contract ${restored}."; exit 1; }

      - name: Measure the disposable copy before applying
        shell: bash
        run: |
          set -euo pipefail
          psql "${LOCAL_DB_URL}" -X -q -A -t -v ON_ERROR_STOP=1 -f - > "${WORK_DIR}/before.json" <<'SQL'
          select jsonb_build_object(
            'entries',(select count(*) from public.entries),
            'season_predictions',(select count(*) from public.season_predictions),
            'season_matchweek_scores',(select count(*) from public.season_matchweek_scores),
            'bonus_entrants',(select count(*) from public.bonus_competition_entrants),
            'leagues',(select count(*) from public.leagues),
            'league_members',(select count(*) from public.league_members),
            'profiles',(select count(*) from public.profiles),
            'cup_launches',(select count(*) from public.bonus_cup_launches),
            'cup_fixtures',(select count(*) from public.bonus_cup_fixtures),
            'action_items',(select count(*) from public.player_action_items),
            'api_usage',(select count(*) from ai.api_usage),
            'collection_enabled',(select collection_enabled from ai.api_budget limit 1),
            'cron_fingerprint',(select md5(coalesce(string_agg(jobid::text||'|'||jobname||'|'||schedule||'|'||command||'|'||active::text,E'\n' order by jobid),'')) from cron.job));
          SQL
          cat "${WORK_DIR}/before.json"

      - name: Apply exactly Contracts 191 to 198 to the disposable copy
        shell: bash
        run: |
          set -euo pipefail
          supabase db push --db-url "${LOCAL_DB_URL}" --dry-run > "${WORK_DIR}/dry-run.txt" 2>&1
          cat "${WORK_DIR}/dry-run.txt"
          grep -oE '[0-9]{14}_[A-Za-z0-9_-]+\.sql' "${WORK_DIR}/dry-run.txt" | awk '!seen[$0]++' | sort > "${WORK_DIR}/pending.txt"
          sort "${WORK_DIR}/boundary.txt" > "${WORK_DIR}/expected.txt"
          diff -u "${WORK_DIR}/expected.txt" "${WORK_DIR}/pending.txt" || { echo 'ERROR: dry run is not exactly the eight approved migrations.'; exit 1; }
          supabase db push --db-url "${LOCAL_DB_URL}"

      - name: Run the behavioural pgTAP suites for Contracts 191 to 198
        shell: bash
        run: |
          set +e
          PGTAP_LOG="${WORK_DIR}/pgtap.log"
          SUITES=(
            239_season_player_identity
            240_season_rank_history_and_rivalry
            241_season_cup_bracket_read
            242_cup_tie_eligibility
            243_cup_penalty_number_actions
            244_game_consequence_actions
            245_my_football_calendar
            246_cup_knockout_reservation
          )
          mkdir -p "${WORK_DIR}/supabase/tests"
          RELS=()
          for suite in "${SUITES[@]}"; do
            REL="supabase/tests/${suite}.sql"
            cp "${GITHUB_WORKSPACE}/${REL}" "${WORK_DIR}/${REL}"
            cmp "${GITHUB_WORKSPACE}/${REL}" "${WORK_DIR}/${REL}" || { echo "ERROR: ${REL} copy differs."; exit 1; }
            RELS+=("${REL}")
          done
          ( cd "${WORK_DIR}" && supabase test db "${RELS[@]}" --db-url "${LOCAL_DB_URL}" ) >"${PGTAP_LOG}" 2>&1
          status=$?
          cat "${PGTAP_LOG}"
          if [ "${status}" -ne 0 ]; then
            excerpt="$(tail -n 80 "${PGTAP_LOG}" | tr '\n' ' ' | sed 's/%/%25/g')"
            echo "::error title=Contracts 191-198 pgTAP failed::exit=${status}; ${excerpt}"
            exit "${status}"
          fi
          grep -q 'Result: PASS' "${PGTAP_LOG}" || { echo 'ERROR: pgTAP did not report PASS.'; exit 1; }

      - name: Verify installed behaviour and that nothing player-facing moved
        shell: bash
        run: |
          set -euo pipefail
          psql "${LOCAL_DB_URL}" -X -q -A -t -v ON_ERROR_STOP=1 -f - > "${WORK_DIR}/after.json" <<'SQL'
          select jsonb_build_object(
            'migration_count',(select count(*) from supabase_migrations.schema_migrations),
            'latest_version',(select version from supabase_migrations.schema_migrations order by version desc limit 1),
            'latest_name',(select name from supabase_migrations.schema_migrations order by version desc limit 1),
            'entries',(select count(*) from public.entries),
            'season_predictions',(select count(*) from public.season_predictions),
            'season_matchweek_scores',(select count(*) from public.season_matchweek_scores),
            'bonus_entrants',(select count(*) from public.bonus_competition_entrants),
            'leagues',(select count(*) from public.leagues),
            'league_members',(select count(*) from public.league_members),
            'profiles',(select count(*) from public.profiles),
            'cup_launches',(select count(*) from public.bonus_cup_launches),
            'cup_fixtures',(select count(*) from public.bonus_cup_fixtures),
            'action_items',(select count(*) from public.player_action_items),
            'api_usage',(select count(*) from ai.api_usage),
            'collection_enabled',(select collection_enabled from ai.api_budget limit 1),
            'cron_fingerprint',(select md5(coalesce(string_agg(jobid::text||'|'||jobname||'|'||schedule||'|'||command||'|'||active::text,E'\n' order by jobid),'')) from cron.job),
            'calendar_authenticated',(select count(*) from information_schema.role_routine_grants where routine_schema='public' and routine_name='get_my_football_calendar' and grantee='authenticated'),
            'calendar_leaked',(select count(*) from information_schema.role_routine_grants where routine_schema='public' and routine_name='get_my_football_calendar' and grantee in ('PUBLIC','anon','service_role')),
            'generators_unreachable',(select count(*) from information_schema.role_routine_grants where routine_schema='predictor_internal' and routine_name in ('generate_cup_penalty_number_actions','generate_game_consequence_actions','cup_knockout_rounds') and grantee in ('PUBLIC','anon','authenticated','service_role')),
            'settler_split_safe',(position('stage <> ''group''' in pg_get_functiondef('public.admin_settle_predictor_cup_round(uuid,uuid)'::regprocedure))=0),
            'settler_eligibility',(position('cup_entrant_eligibility' in pg_get_functiondef('public.admin_settle_predictor_cup_round(uuid,uuid)'::regprocedure))>0),
            'settler_dates_elimination',(position('set outcome = ''eliminated'', updated_at = now()' in pg_get_functiondef('public.admin_settle_predictor_cup_round(uuid,uuid)'::regprocedure))>0),
            'settler_dates_champion',(position('set outcome = ''champion'', updated_at = now()' in pg_get_functiondef('public.admin_settle_predictor_cup_round(uuid,uuid)'::regprocedure))>0),
            'finalise_dates_outcome',(position('then ''eliminated'' else ''qualified'' end, updated_at = now()' in pg_get_functiondef('public.admin_finalise_predictor_cup_groups(uuid)'::regprocedure))>0),
            'finalise_depth_authority',(position('cup_knockout_rounds' in pg_get_functiondef('public.admin_finalise_predictor_cup_groups(uuid)'::regprocedure))>0),
            'driver_runs_four',( (position('generate_lms_pick_actions' in pg_get_functiondef('public.process_player_action_items()'::regprocedure))>0)
                             and (position('generate_matchweek_prediction_actions' in pg_get_functiondef('public.process_player_action_items()'::regprocedure))>0)
                             and (position('generate_cup_penalty_number_actions' in pg_get_functiondef('public.process_player_action_items()'::regprocedure))>0)
                             and (position('generate_game_consequence_actions' in pg_get_functiondef('public.process_player_action_items()'::regprocedure))>0)),
            'ten_over_thirtyeight_has_no_knockout',(jsonb_typeof((predictor_internal.select_season_cup_format(10,38))->'knockout')='null'));
          SQL
          cat "${WORK_DIR}/after.json"
          BEFORE_FILE="${WORK_DIR}/before.json" AFTER_FILE="${WORK_DIR}/after.json" node --input-type=module <<'NODE'
          import fs from 'node:fs'
          const b = JSON.parse(fs.readFileSync(process.env.BEFORE_FILE, 'utf8'))
          const a = JSON.parse(fs.readFileSync(process.env.AFTER_FILE, 'utf8'))
          const problems = []
          const eq = (k, v) => String(a[k]) === String(v) || problems.push(`${k}=${a[k]}, expected ${v}`)
          eq('migration_count', Number(process.env.TARGET_CONTRACT))
          eq('latest_version', process.env.TARGET_VERSION)
          eq('latest_name', process.env.TARGET_NAME)
          // Every one of the eight contracts is additive: nothing a player owns moves.
          for (const k of ['entries','season_predictions','season_matchweek_scores','bonus_entrants','leagues','league_members','profiles','cup_launches','cup_fixtures','action_items','api_usage','collection_enabled','cron_fingerprint']) eq(k, b[k])
          eq('calendar_authenticated', 1); eq('calendar_leaked', 0); eq('generators_unreachable', 0)
          for (const k of ['settler_split_safe','settler_eligibility','settler_dates_elimination','settler_dates_champion','finalise_dates_outcome','finalise_depth_authority','driver_runs_four','ten_over_thirtyeight_has_no_knockout']) eq(k, true)
          if (problems.length) { console.error('REHEARSAL VERIFICATION FAILED:\n - ' + problems.join('\n - ')); process.exit(1) }
          console.log(`Disposable copy reached Contract ${a.migration_count}. Player-facing counts unchanged: entries ${a.entries}, predictions ${a.season_predictions}, scores ${a.season_matchweek_scores}, leagues ${a.leagues}.`)
          console.log('Grants correct, Championship rules 102/194/196/198 all present, action driver runs four generators.')
          NODE

      - name: Record the rehearsal outcome
        if: success()
        shell: bash
        run: |
          cat >> "${GITHUB_STEP_SUMMARY}" <<'SUMMARY'
          ## Rehearsal passed — Contracts 191 to 198 applied to a disposable Production copy

          - Exactly eight migrations were pending, each proven additive.
          - All eight behavioural pgTAP suites (239-246) passed against restored Production data.
          - Entries, predictions, matchweek scores, entrants, leagues, members, profiles, Cup launches, Cup fixtures and action items are all unchanged.
          - Provider usage, paid collection and the cron fingerprint are unchanged.
          - `get_my_football_calendar` is executable by `authenticated` only; the two action generators and the knockout-depth authority are executable by nobody.
          - Contract 102 split-safety, contract 194 eligibility, contract 196 outcome dating and contract 198 depth authority are all present on the installed Championship functions.

          This rehearsal authorises nothing. Production is untouched.
          SUMMARY
