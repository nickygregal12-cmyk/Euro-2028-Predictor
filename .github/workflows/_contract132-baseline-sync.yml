name: Contract 132 baseline sync

on:
  push:
    branches:
      - feature/provider-initial-fixture-approval-contract-132

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/provider-initial-fixture-approval-contract-132
      - uses: actions/setup-node@v7
        with:
          node-version: 22.22.2
          cache: npm
      - run: npm ci
      - name: Align repository and hosted baselines
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('AGENTS.md')
          s = p.read_text()
          s = s.replace(
              '- production Supabase is hosted at contract 131, level with the repository and Development, while the last published application remains at the Euro baseline contract;',
              '- Development Supabase and Production Supabase are hosted at contract 131, one migration behind the contract-132 repository candidate, while the last published application remains at the Euro baseline contract;'
          )
          old = 'The repository is at **contract 131** through `20260806220000_period_standings_display_names.sql`. Development Supabase is hosted at **131** — level with the repository, with no pending Development migrations.'
          new = 'The repository is at **contract 132** through `20260807210812_provider_initial_fixture_approval.sql`. Development Supabase is hosted at **131** — one migration behind this repository candidate until the authorised Contract 132 rollout is applied and verified.'
          if old not in s:
              raise SystemExit('AGENTS baseline prefix not found')
          s = s.replace(old, new, 1)
          s = s.replace(
              'Production Supabase is hosted at 131, level with the repository and Development; no migration promotion is pending, and any future Production migration requires a new authorisation.',
              'Production Supabase is hosted at 131, one migration behind this repository candidate; Contract 132 promotion is explicitly authorised for this rollout and must follow Development verification.',
              1
          )
          p.write_text(s)

          p = Path('docs/quality/current-status.md')
          s = p.read_text()
          s = s.replace('**Status date:** 7 August 2026', '**Status date:** 8 August 2026', 1)
          s = s.replace('| Last verified | 2026-08-07 |', '| Last verified | 2026-08-08 |', 1)
          s = s.replace(
              'Development Supabase and Production Supabase are both hosted at **131**, level with the repository; no migration promotion is pending.',
              'The repository candidate is **132**. Development Supabase and Production Supabase are both still hosted at **131** before the authorised Contract 132 rollout; Development is promoted and verified first, then Production.'
          )
          old = '| Repository contract | **131** — 131 canonical migrations through `20260806220000_period_standings_display_names.sql`.'
          new = '| Repository contract | **132** — 132 canonical migrations through `20260807210812_provider_initial_fixture_approval.sql`. Contract 132 stages immutable provider fixture proposals and requires explicit competition-admin approval before a complete initial Scottish Premiership or Premier League calendar becomes canonical; provider scores remain evidence only.'
          if old not in s:
              raise SystemExit('current-status repository contract prefix not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Regenerate current-state surface
        run: npm run generate:now
      - name: Commit baseline sync
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AGENTS.md docs/quality/current-status.md NOW.md
          if git diff --cached --quiet; then
            echo "Baseline already current"
          else
            git commit -m "docs: align contract 132 repository and hosted baselines"
            git push origin HEAD:feature/provider-initial-fixture-approval-contract-132
          fi
