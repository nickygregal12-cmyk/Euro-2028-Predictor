name: Documentation link integrity

# THE PULL-REQUEST FILTER IS GONE, AND THAT IS WHAT MAKES THIS REQUIRABLE.
#
# A `paths:`-filtered workflow does not run on a pull request it does not match,
# so its check never posts. Requiring a context that never posts blocks that pull
# request for ever — `DOC-001`, then `OPS-012`. The quieter half is what leaving
# the filter costs: the context cannot be required at all, so a pull request that
# breaks a documented link merges on a green core CI that never followed one.
#
# No `changes` job here, and no separate gate job either. The check below reads
# every tracked Markdown file rather than the changed ones, so a pull request
# that touches no Markdown costs exactly what one that rewrites it does — there
# is nothing for a filter to save. That leaves one unconditional job, which can
# simply be named the context a ruleset asks for.
#
# The `push:` filter stays. A push posts no context a ruleset can require.
on:
  pull_request:
  push:
    branches:
      - main
    paths:
      - '**/*.md'
      - '.github/workflows/link-integrity.yml'
  schedule:
    - cron: '31 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: link-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  links:
    # THE NAME IS THE RULESET'S CONTEXT STRING. A ruleset matches a status check
    # on the check-run name, which for an Actions job is the job's `name:` alone,
    # so it is written in the `Workflow / Job` form the rule asks for. `CI /
    # Required merge gate` was renamed for exactly this reason after every pull
    # request sat waiting on a context nothing emitted.
    name: Documentation link integrity / Required link gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden runner (audit egress)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install verified Lychee v0.24.2
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/lychee.tar.gz"
          destination="${RUNNER_TEMP}/lychee"
          curl --fail --location --silent --show-error \
            'https://github.com/lycheeverse/lychee/releases/download/lychee-v0.24.2/lychee-x86_64-unknown-linux-gnu.tar.gz' \
            --output "$archive"
          printf '%s  %s\n' \
            '1f4e0ef7f6554a6ed33dd7ac144fb2e1bbed98598e7af973042fc5cd43951c9a' \
            "$archive" \
            | sha256sum --check --strict
          mkdir -p "$destination"
          tar --no-same-owner -xzf "$archive" -C "$destination"
          install -m 0755 \
            "$destination/lychee-x86_64-unknown-linux-gnu/lychee" \
            /usr/local/bin/lychee
          lychee --version

      - name: Check tracked Markdown files and anchors offline
        shell: bash
        run: |
          set -euo pipefail
          inputs="${RUNNER_TEMP}/lychee-markdown-inputs"
          git ls-files '*.md' > "$inputs"
          test -s "$inputs"
          lychee \
            --offline \
            --include-fragments=anchor-only \
            --root-dir . \
            --no-progress \
            --files-from "$inputs"
