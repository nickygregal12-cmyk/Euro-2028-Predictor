name: Contract 132 NOW regeneration

on:
  push:
    branches:
      - feature/provider-initial-fixture-approval-contract-132

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/provider-initial-fixture-approval-contract-132
      - uses: actions/setup-node@v7
        with:
          node-version: 22.22.2
          cache: npm
      - run: npm ci
      - name: Regenerate canonical current-state surface
        run: npm run generate:now
      - name: Commit generated NOW.md
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add NOW.md
          if git diff --cached --quiet; then
            echo "NOW.md already current"
          else
            git commit -m "docs: regenerate NOW for contract 132"
            git push origin HEAD:feature/provider-initial-fixture-approval-contract-132
          fi
