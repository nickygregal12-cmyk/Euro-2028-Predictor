name: Production Batch B retry

# One-shot retry for the authorised Production contract 67 -> 96 rollout.
# The first Batch B run completed its restored forward rehearsal and encrypted
# backup successfully but stopped on a GitHub step-status expression bug before
# any hosted write. This retry uses an explicit success sentinel instead.

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/production-batch-b-retry.yml

permissions:
  contents: read

concurrency:
  group: production-migration-rollout
  cancel-in-progress: false

env:
  EXPECTED_PROJECT_REF: vkfnsqdyhvtwyqkisxhk
  FORBIDDEN_DEVELOPMENT_REF: iouzoutneyjpugbbtdem
  SOURCE_CONTRACT: '67'
  SOURCE_VERSION: '20260803180000'
  SOURCE_NAME: matchweek_lock_scope
  TARGET_CONTRACT: '96'
  TARGET_VERSION: '20260804243000'
  TARGET_NAME: cup_tie_settlement_refusal_order
  WORK_DIR: /tmp/production-batch-b-retry
  LOCAL_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres

jobs:
  batch-b-retry:
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Refuse unsafe repository or migration state
        shell: bash
        run: |
          set -euo pipefail
          [ "${GITHUB_REF}" = 'refs/heads/main' ] || exit 1
          git fetch --no-tags origin main
          [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" ] || exit 1
          [ -z "$(git status --porcelain=v1 --untracked-files=all)" ] || exit 1

          expected_batch=$(cat <<'EOF'
          20260803193000_season_fixtures.sql
          20260803203000_season_predictions.sql
          20260803213000_season_scoring.sql
          20260803223000_lms_pick_resolution.sql
          20260803233000_lms_persistence.sql
          20260804003000_lms_round_conclusion.sql
          20260804013000_season_cup_rules.sql
          20260804023000_cup_neutral_points_source.sql
          20260804033000_cup_neutral_settlement_source.sql
          20260804043000_season_cup_sources.sql
          20260804053000_cup_league_schedule.sql
          20260804063000_cup_store_competition_domains.sql
          20260804073000_season_card_lock_resolution.sql
          20260804093000_season_card_status.sql
          20260804103000_season_card_no_prefill.sql
          20260804113000_season_matchweek_scheduler.sql
          20260804123000_lms_eligibility_parity.sql
          20260804133000_lms_settlement.sql
          20260804143000_lms_season_selection.sql
          20260804153000_lms_used_cycle.sql
          20260804163000_lms_auto_assignment.sql
          20260804173000_lms_settlement_job.sql
          20260804183000_season_matchweek_scores.sql
          20260804193000_matchweek_settlement_parity.sql
          20260804203000_season_fixture_replay_link.sql
          20260804213000_season_matchweek_scoring_job.sql
          20260804223000_season_standings_parity.sql
          20260804233000_season_leaderboard_read.sql
          20260804243000_cup_tie_settlement_refusal_order.sql
          EOF
          )
          actual_batch="$(git ls-files 'supabase/migrations/*.sql' | sort | sed -n '68,96p' | xargs -n1 basename)"
          [ "${actual_batch}" = "${expected_batch}" ] || {
            echo 'ERROR: contracts 68-96 no longer match the authorised Batch B allowlist.'
            printf 'Expected:\n%s\nActual:\n%s\n' "${expected_batch}" "${actual_batch}"
            exit 1
          }

          development_count="$(node -p "require('./config/development-hosted-contract.json').requiredMigrationCount")"
          [ "${development_count}" -ge "${TARGET_CONTRACT}" ] || {
            echo "ERROR: Development authority is only ${development_count}; Batch B target is ${TARGET_CONTRACT}."
            exit 1
          }

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.22.2

      - uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf
        with:
          version: 2.109.1
          github-token: ${{ github.token }}

      - name: Install backup and PostgreSQL client tools
        run: |
          sudo apt-get update
          sudo apt-get install -y age postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17

      - name: Preflight Production secrets
        env:
          SUPABASE_PROD_DB_URL: ${{ secrets.SUPABASE_PROD_DB_URL }}
          BACKUP_AGE_PUBLIC_KEY: ${{ secrets.BACKUP_AGE_PUBLIC_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${SUPABASE_PROD_DB_URL}" ] || exit 1
          [ -n "${BACKUP_AGE_PUBLIC_KEY}" ] || exit 1
          case "${SUPABASE_PROD_DB_URL}" in
            *"${FORBIDDEN_DEVELOPMENT_REF}"*) echo 'ERROR: Production secret resolves to Development.'; exit 1 ;;
            *"${EXPECTED_PROJECT_REF}"*) ;;
            *) echo 'ERROR: Production secret does not name expected Production.'; exit 1 ;;
          esac
          case "${BACKUP_AGE_PUBLIC_KEY}" in age1*) ;; *) exit 1 ;; esac

      - name: Prove exact live contract-67 source
        env:
          SUPABASE_PROD_DB_URL: ${{ secrets.SUPABASE_PROD_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "${WORK_DIR}/bundle/verification" "${WORK_DIR}/evidence"
          psql "${SUPABASE_PROD_DB_URL}" -X -q -v ON_ERROR_STOP=1 -A -t -c "
            select json_build_object(
              'migration_count', (select count(*) from supabase_migrations.schema_migrations),
              'latest_version', (select version from supabase_migrations.schema_migrations order by version desc limit 1),
              'latest_name', (select name from supabase_migrations.schema_migrations order by version desc limit 1),
              'auth_users', (select count(*) from auth.users),
              'profiles', (select count(*) from public.profiles),
              'tournaments', (select count(*) from public.tournaments),
              'teams', (select count(*) from public.teams),
              'matches', (select count(*) from public.matches),
              'entries', (select count(*) from public.entries),
              'match_predictions', (select count(*) from public.match_predictions),
              'leagues', (select count(*) from public.leagues),
              'league_members', (select count(*) from public.league_members),
              'score_events', (select count(*) from public.score_events),
              'entry_totals', (select count(*) from public.entry_totals),
              'pg_net_installed', exists(select 1 from pg_extension where extname = 'pg_net'),
              'active_cron_jobs', (select coalesce(json_agg(json_build_object('schedule',schedule,'command',command) order by jobid),'[]'::json) from cron.job where active)
            )::text;
          " > "${WORK_DIR}/evidence/pre-state.json"

          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'
          const s = JSON.parse(readFileSync('/tmp/production-batch-b-retry/evidence/pre-state.json','utf8').trim())
          const expected = {
            migration_count: 67,
            latest_version: '20260803180000',
            latest_name: 'matchweek_lock_scope',
            auth_users: 1,
            profiles: 1,
            tournaments: 3,
            teams: 24,
            matches: 51,
            entries: 1,
            match_predictions: 36,
            leagues: 1,
            league_members: 1,
            score_events: 0,
            entry_totals: 1,
            pg_net_installed: false,
            active_cron_jobs: [{schedule:'* * * * *',command:'select public.process_due_entry_submissions();'}],
          }
          if (JSON.stringify(s) !== JSON.stringify(expected)) {
            console.error('ERROR: Production no longer matches the verified contract-67 boundary.')
            console.error(JSON.stringify(s))
            process.exit(1)
          }
          NODE

      - name: Capture fresh contract-67 backup source
        env:
          SUPABASE_PROD_DB_URL: ${{ secrets.SUPABASE_PROD_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          date -u +'%Y%m%dT%H%M%SZ' > "${WORK_DIR}/capture-timestamp.txt"
          printf '%s\n' "${GITHUB_SHA}" > "${WORK_DIR}/bundle/repository-commit.txt"
          printf '%s\n' "${EXPECTED_PROJECT_REF}" > "${WORK_DIR}/bundle/project-ref.txt"
          git ls-files 'supabase/migrations/*.sql' | sort > "${WORK_DIR}/bundle/migration-files.txt"
          psql "${SUPABASE_PROD_DB_URL}" -X -v ON_ERROR_STOP=1 -A -t \
            -f scripts/database-rollout/production-backup-inventory.sql \
            > "${WORK_DIR}/bundle/database-state.json"
          supabase db dump --db-url "${SUPABASE_PROD_DB_URL}" --file "${WORK_DIR}/bundle/roles.sql" --role-only
          supabase db dump --db-url "${SUPABASE_PROD_DB_URL}" --file "${WORK_DIR}/bundle/schema.sql"
          supabase db dump --db-url "${SUPABASE_PROD_DB_URL}" --file "${WORK_DIR}/bundle/data.sql" --use-copy --data-only \
            -x storage.buckets_vectors -x storage.vector_indexes
          /usr/lib/postgresql/17/bin/pg_dump --dbname "${SUPABASE_PROD_DB_URL}" \
            --schema supabase_migrations --no-owner --no-privileges \
            --file "${WORK_DIR}/bundle/migration-history.sql"
          cp scripts/database-rollout/managed-schema-customizations.sql "${WORK_DIR}/bundle/"
          for f in roles.sql schema.sql data.sql migration-history.sql database-state.json managed-schema-customizations.sql; do
            [ -s "${WORK_DIR}/bundle/${f}" ] || exit 1
          done

      - name: Start disposable local Supabase
        run: supabase start

      - name: Restore contract-67 source into disposable local Supabase
        shell: bash
        run: |
          set -euo pipefail
          psql "${LOCAL_DB_URL}" -X -v ON_ERROR_STOP=1 <<'SQL'
          begin;
          -- Local Supabase boots from the repository migration tip. Normalize
          -- platform-owned state so this disposable restore exactly matches the
          -- verified Production contract-67 source before Batch B is rehearsed.
          drop extension if exists pg_net cascade;
          do $cron$
          declare
            v_job record;
          begin
            for v_job in select jobid from cron.job loop
              perform cron.unschedule(v_job.jobid);
            end loop;
          end
          $cron$;
          drop schema if exists predictor_internal cascade;
          drop schema if exists public cascade;
          create schema public;
          grant usage on schema public to anon, authenticated, service_role;
          alter default privileges for role postgres in schema public revoke all on tables from anon, authenticated;
          drop schema if exists supabase_migrations cascade;
          truncate table auth.users cascade;
          truncate table storage.objects, storage.buckets cascade;
          commit;
          SQL
          cd "${WORK_DIR}/bundle"
          psql "${LOCAL_DB_URL}" -X --single-transaction -v ON_ERROR_STOP=1 --file roles.sql
          psql "${LOCAL_DB_URL}" -X --single-transaction -v ON_ERROR_STOP=1 --file schema.sql
          psql "${LOCAL_DB_URL}" -X --single-transaction -v ON_ERROR_STOP=1 --command 'SET session_replication_role = replica' --file data.sql
          psql "${LOCAL_DB_URL}" -X --single-transaction -v ON_ERROR_STOP=1 --file managed-schema-customizations.sql
          psql "${LOCAL_DB_URL}" -X --single-transaction -v ON_ERROR_STOP=1 --file migration-history.sql

          psql "${LOCAL_DB_URL}" -X -v ON_ERROR_STOP=1 <<'SQL'
          select cron.schedule(
            'euro28-auto-submit-due-entries',
            '* * * * *',
            'select public.process_due_entry_submissions();'
          );
          SQL

          restored="$(psql "${LOCAL_DB_URL}" -X -q -v ON_ERROR_STOP=1 -A -t -c "select count(*)||'|'||(select version from supabase_migrations.schema_migrations order by version desc limit 1)||'|'||(select name from supabase_migrations.schema_migrations order by version desc limit 1) from supabase_migrations.schema_migrations;")"
          [ "${restored}" = '67|20260803180000|matchweek_lock_scope' ] || { echo "ERROR: restored source is ${restored}"; exit 1; }
          pg_net_state="$(psql "${LOCAL_DB_URL}" -X -q -v ON_ERROR_STOP=1 -A -t -c "select exists(select 1 from pg_extension where extname='pg_net');")"
          [ "${pg_net_state}" = 'f' ] || { echo 'ERROR: disposable restored source still has pg_net installed.'; exit 1; }
          cron_count="$(psql "${LOCAL_DB_URL}" -X -q -v ON_ERROR_STOP=1 -A -t -c "select count(*) from cron.job where active;")"
          [ "${cron_count}" = '1' ] || { echo "ERROR: disposable restored source has ${cron_count} active cron jobs, expected 1."; exit 1; }
          source_cron_count="$(psql "${LOCAL_DB_URL}" -X -q -v ON_ERROR_STOP=1 -A -t -c "select count(*) from cron.job where active and jobname='euro28-auto-submit-due-entries' and schedule='* * * * *' and command='select public.process_due_entry_submissions();';")"
          [ "${source_cron_count}" = '1' ] || { echo 'ERROR: disposable restored source is missing the verified contract-67 cron job.'; exit 1; }

      - name: Forward-rehearse exactly contracts 68-96 locally
        id: rehearsal
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          node scripts/database-rollout/rehearse-production-batch-b.mjs \
            --db-url "${LOCAL_DB_URL}" \
            --source-inventory "${WORK_DIR}/bundle/database-state.json" \
            --output "${WORK_DIR}/bundle/verification/batch-b-rehearsal.json"
          cp "${WORK_DIR}/bundle/verification/batch-b-rehearsal.json" "${WORK_DIR}/evidence/batch-b-rehearsal.json"
          touch "${WORK_DIR}/rehearsal-passed"

      - name: Stop and delete disposable local data
        if: always()
        run: supabase stop --no-backup

      - name: Encrypt fresh contract-67 backup
        if: always()
        env:
          BACKUP_AGE_PUBLIC_KEY: ${{ secrets.BACKUP_AGE_PUBLIC_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          [ -d "${WORK_DIR}/bundle" ] || exit 1
          cd "${WORK_DIR}"
          mkdir -p artifact
          captured_at="$(cat capture-timestamp.txt)"
          bundle_tar="euro28-prod-batch-b-retry-${captured_at}.backup.tar.gz"
          tar -C bundle -czf "${bundle_tar}" .
          age -r "${BACKUP_AGE_PUBLIC_KEY}" -o "artifact/${bundle_tar}.age" "${bundle_tar}"
          find bundle -type f -exec shred -u {} +
          rm -rf bundle
          shred -u "${bundle_tar}"
          [ "$(find artifact -type f -name '*.backup.tar.gz.age' | wc -l | tr -d ' ')" = '1' ] || exit 1
          [ -z "$(find artifact -type f ! -name '*.backup.tar.gz.age')" ] || exit 1

      - name: Upload encrypted contract-67 backup
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: production-batch-b-retry-source-encrypted
          path: /tmp/production-batch-b-retry/artifact/*.backup.tar.gz.age
          retention-days: 7
          if-no-files-found: error

      - name: Fail closed unless rehearsal success sentinel exists
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          [ -f "${WORK_DIR}/rehearsal-passed" ] || {
            echo 'ERROR: Batch B rehearsal did not complete successfully; Production was not changed.'
            exit 1
          }

      - name: Re-prove live source immediately before write
        env:
          SUPABASE_PROD_DB_URL: ${{ secrets.SUPABASE_PROD_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          live="$(psql "${SUPABASE_PROD_DB_URL}" -X -q -v ON_ERROR_STOP=1 -A -t -c "select count(*)||'|'||(select version from supabase_migrations.schema_migrations order by version desc limit 1)||'|'||(select name from supabase_migrations.schema_migrations order by version desc limit 1) from supabase_migrations.schema_migrations;")"
          [ "${live}" = '67|20260803180000|matchweek_lock_scope' ] || { echo "ERROR: live source moved to ${live}"; exit 1; }

      - name: Isolate Batch B and prove exact hosted dry run
        env:
          SUPABASE_PROD_DB_URL: ${{ secrets.SUPABASE_PROD_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${WORK_DIR}/later-migrations"
          : > "${WORK_DIR}/moved-files.txt"
          for file in $(git ls-files 'supabase/migrations/*.sql' | sort); do
            filename="$(basename "${file}")"
            version="${filename:0:14}"
            if [[ "${version}" > "${TARGET_VERSION}" ]]; then
              mv "${file}" "${WORK_DIR}/later-migrations/${filename}"
              printf '%s\n' "${file}" >> "${WORK_DIR}/moved-files.txt"
            fi
          done

          supabase db push --db-url "${SUPABASE_PROD_DB_URL}" --dry-run > "${WORK_DIR}/evidence/dry-run.txt" 2>&1
          cat "${WORK_DIR}/evidence/dry-run.txt"
          grep -oE '[0-9]{14}_[A-Za-z0-9_-]+\.sql' "${WORK_DIR}/evidence/dry-run.txt" | awk '!seen[$0]++' > "${WORK_DIR}/evidence/dry-run-migrations.txt"
          expected="$(git ls-files 'supabase/migrations/*.sql' | sort | sed -n '68,96p' | xargs -n1 basename)"
          actual="$(cat "${WORK_DIR}/evidence/dry-run-migrations.txt")"
          [ "${actual}" = "${expected}" ] || {
            printf 'ERROR: hosted dry run is not exactly Batch B.\nExpected:\n%s\nActual:\n%s\n' "${expected}" "${actual}"
            exit 1
          }

      - name: Apply exactly Production Batch B
        env:
          SUPABASE_PROD_DB_URL: ${{ secrets.SUPABASE_PROD_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          supabase db push --db-url "${SUPABASE_PROD_DB_URL}" 2>&1 | tee "${WORK_DIR}/evidence/apply.txt"

      - name: Restore repository migration tree in runner
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "${WORK_DIR}/moved-files.txt" ]; then
            while IFS= read -r file; do
              [ -n "${file}" ] || continue
              filename="$(basename "${file}")"
              [ ! -e "${WORK_DIR}/later-migrations/${filename}" ] || mv "${WORK_DIR}/later-migrations/${filename}" "${file}"
            done < "${WORK_DIR}/moved-files.txt"
          fi

      - name: Verify exact contract-96 Production state
        env:
          SUPABASE_PROD_DB_URL: ${{ secrets.SUPABASE_PROD_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          psql "${SUPABASE_PROD_DB_URL}" -X -q -v ON_ERROR_STOP=1 -A -t -c "
            select json_build_object(
              'migration_count', (select count(*) from supabase_migrations.schema_migrations),
              'latest_version', (select version from supabase_migrations.schema_migrations order by version desc limit 1),
              'latest_name', (select name from supabase_migrations.schema_migrations order by version desc limit 1),
              'auth_users', (select count(*) from auth.users),
              'profiles', (select count(*) from public.profiles),
              'tournaments', (select count(*) from public.tournaments),
              'teams', (select count(*) from public.teams),
              'matches', (select count(*) from public.matches),
              'entries', (select count(*) from public.entries),
              'match_predictions', (select count(*) from public.match_predictions),
              'leagues', (select count(*) from public.leagues),
              'league_members', (select count(*) from public.league_members),
              'score_events', (select count(*) from public.score_events),
              'entry_totals', (select count(*) from public.entry_totals),
              'pg_net_installed', exists(select 1 from pg_extension where extname='pg_net'),
              'active_cron_jobs', (select coalesce(json_agg(json_build_object('schedule',schedule,'command',command) order by jobid),'[]'::json) from cron.job where active),
              'season_fixtures_exists', to_regclass('public.season_fixtures') is not null,
              'season_predictions_exists', to_regclass('public.season_predictions') is not null,
              'season_matchweek_scores_exists', to_regclass('public.season_matchweek_scores') is not null,
              'season_cup_window_fixtures_exists', to_regclass('public.season_cup_window_fixtures') is not null
            )::text;
          " > "${WORK_DIR}/evidence/post-state.json"

          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'
          const s = JSON.parse(readFileSync('/tmp/production-batch-b-retry/evidence/post-state.json','utf8').trim())
          const expected = {
            migration_count: 96,
            latest_version: '20260804243000',
            latest_name: 'cup_tie_settlement_refusal_order',
            auth_users: 1,
            profiles: 1,
            tournaments: 3,
            teams: 24,
            matches: 51,
            entries: 1,
            match_predictions: 36,
            leagues: 1,
            league_members: 1,
            score_events: 0,
            entry_totals: 1,
            pg_net_installed: false,
            active_cron_jobs: [
              {schedule:'* * * * *',command:'select public.process_due_entry_submissions();'},
              {schedule:'* * * * *',command:'select public.process_due_season_matchweek_submissions();'},
              {schedule:'0 * * * *',command:'select public.process_due_season_lms_settlements();'},
              {schedule:'30 * * * *',command:'select public.process_due_season_matchweek_scores();'},
            ],
            season_fixtures_exists: true,
            season_predictions_exists: true,
            season_matchweek_scores_exists: true,
            season_cup_window_fixtures_exists: true,
          }
          for (const [key,value] of Object.entries(expected)) {
            if (JSON.stringify(s[key]) !== JSON.stringify(value)) {
              console.error(`ERROR: contract-96 mismatch for ${key}`)
              console.error('Expected:',JSON.stringify(value),'Observed:',JSON.stringify(s[key]))
              process.exit(1)
            }
          }
          NODE
          supabase migration list --db-url "${SUPABASE_PROD_DB_URL}" > "${WORK_DIR}/evidence/migration-list-after.txt"

      - name: Upload non-sensitive Batch B retry evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: production-batch-b-retry-evidence
          path: /tmp/production-batch-b-retry/evidence
          retention-days: 7
          if-no-files-found: error
