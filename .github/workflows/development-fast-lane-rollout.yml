name: Development fast-lane rollout

# ADR 0024: an ADDITIVE, non-destructive development migration applies through
# this lane — CI, rebuild and the populated transition having already passed on
# the merged commit — instead of the full encrypted-backup, restore-rehearsal
# and manual-approval ceremony that belongs to production.
#
# What this lane does NOT relax:
#   - it runs only from main, only against the development project, and refuses
#     production outright;
#   - it PROVES the pending migrations are additive by reading them, rather
#     than trusting the person who dispatched it. Anything destructive is
#     refused and sent to `development-migration-rollout.yml`, the guarded lane,
#     which names its boundary by filename and requires a destructive batch to
#     be acknowledged before it applies anything;
#   - it takes a lightweight snapshot first, which ADR 0024 requires even here.
#
# Production has no fast lane and never will.

on:
  workflow_dispatch:
    inputs:
      project_ref:
        description: Exact development project ref confirmation
        required: true
      confirmation:
        description: Type APPLY-DEVELOPMENT-FAST-LANE to proceed
        required: true

permissions:
  contents: read

env:
  EXPECTED_PROJECT_REF: iouzoutneyjpugbbtdem
  FORBIDDEN_PRODUCTION_REF: vkfnsqdyhvtwyqkisxhk
  CONFIRMATION_PHRASE: APPLY-DEVELOPMENT-FAST-LANE

jobs:
  fast-lane:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Refuse an unsafe dispatch or repository state
        env:
          INPUT_PROJECT_REF: ${{ inputs.project_ref }}
          INPUT_CONFIRMATION: ${{ inputs.confirmation }}
        shell: bash
        run: |
          set -euo pipefail
          [ "${GITHUB_REF}" = 'refs/heads/main' ] || {
            echo 'ERROR: this workflow runs only from refs/heads/main.'
            exit 1
          }
          git fetch --no-tags origin main
          [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" ] || {
            echo 'ERROR: checked-out HEAD is not exact origin/main.'
            exit 1
          }
          [ -z "$(git status --porcelain=v1 --untracked-files=all)" ] || {
            echo 'ERROR: checkout is not clean.'
            exit 1
          }
          if [ "${INPUT_PROJECT_REF}" = "${FORBIDDEN_PRODUCTION_REF}" ]; then
            echo 'ERROR: production has no fast lane. Use the guarded production process.'
            exit 1
          fi
          [ "${INPUT_PROJECT_REF}" = "${EXPECTED_PROJECT_REF}" ] || {
            echo "ERROR: only development project ${EXPECTED_PROJECT_REF} is permitted."
            exit 1
          }
          [ "${INPUT_CONFIRMATION}" = "${CONFIRMATION_PHRASE}" ] || {
            echo 'ERROR: confirmation phrase does not match.'
            exit 1
          }

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.2

      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1
        with:
          version: 2.84.2

      - name: Preflight the development secret without printing it
        env:
          SUPABASE_DEV_DB_URL: ${{ secrets.SUPABASE_DEV_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${SUPABASE_DEV_DB_URL}" ] || {
            echo 'ERROR: repository secret SUPABASE_DEV_DB_URL is not set.'
            exit 1
          }
          case "${SUPABASE_DEV_DB_URL}" in
            *"${FORBIDDEN_PRODUCTION_REF}"*)
              echo 'ERROR: the development secret resolves to the production project.'
              exit 1
              ;;
            *"${EXPECTED_PROJECT_REF}"*) ;;
            *)
              echo 'ERROR: the development secret names neither known project.'
              exit 1
              ;;
          esac

      - name: Determine and prove the pending migrations are additive
        env:
          SUPABASE_DEV_DB_URL: ${{ secrets.SUPABASE_DEV_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          # Everything the hosted database has not yet applied.
          supabase migration list --db-url "${SUPABASE_DEV_DB_URL}" > /tmp/migration-list.txt 2>&1 || {
            echo 'ERROR: could not read the hosted migration state. The CLI said:'
            # Printed rather than swallowed. The first version of this step
            # captured the CLI's output and then replaced it with the sentence
            # above, so two consecutive real failures on 5 August 2026 said only
            # that something went wrong -- and the obvious inference, a stale
            # credential, sent the owner to check a secret that was correct.
            # A guard that hides the one fact needed to act on it is worse than
            # no guard, because it converts a five-minute fix into a diagnosis.
            #
            # The URL is a secret and never appears in the CLI's own error text,
            # which reports the host and the failure reason.
            sed -e 's/[[:alnum:]._-]*:[[:alnum:]._%-]*@/[redacted]@/g' /tmp/migration-list.txt
            exit 1
          }
          # Columns are LOCAL | REMOTE | TIME (UTC). A row with a local version
          # and an empty remote is pending.
          #
          # The version comes from $1. An earlier version printed $3, which is
          # the human-readable TIME column: that yielded "2026-08-0307:00:00"
          # instead of "20260803070000" and no migration file matched it. $1 is
          # reduced to digits so the 14-digit version survives the column
          # padding, and anything that is not a 14-digit version is dropped —
          # which also excludes the header and rule rows.
          pending="$(awk -F'|' '
            $3 ~ /[0-9]/ && $2 !~ /[0-9]/ {
              version = $1
              gsub(/[^0-9]/, "", version)
              if (length(version) == 14) print version
            }' /tmp/migration-list.txt || true)"
          if [ -z "${pending}" ]; then
            echo 'Nothing pending; the development database already matches the repository.'
            echo 'FAST_LANE_PENDING=' >> "$GITHUB_ENV"
            exit 0
          fi
          echo "Pending migrations:"
          echo "${pending}"

          # ADR 0024 admits only additive migrations here. Read them rather than
          # trusting the dispatcher: a destructive statement in a "fast lane"
          # run is exactly the case the full process exists for.
          #
          # This was an inline grep over the whole file, which refused contract
          # 66 over a `delete from` inside the body of the "leave a game" RPC —
          # what that function does when called, not what the migration does.
          # `scripts/check-migration-additive.mjs` excludes routine bodies while
          # still judging DO blocks and statement level, and is unit-tested in
          # `tests/scripts/migrationAdditiveCheck.test.ts`.
          files=''
          for version in ${pending}; do
            file="$(git ls-files "supabase/migrations/${version}_*.sql" | head -1)"
            [ -n "${file}" ] || { echo "ERROR: no committed file for ${version}."; exit 1; }
            files="${files} ${file}"
          done
          # The script prints what it refused and exits non-zero, so a failure
          # here already names the statement and the workflow to use instead.
          node scripts/check-migration-additive.mjs ${files}
          echo 'FAST_LANE_PENDING=1' >> "$GITHUB_ENV"

      # Contract 119 made this lane print the CLI's own error instead of
      # replacing it with a sentence. That was an improvement and still not an
      # answer: the CLI reported `SQLSTATE 28P01 password authentication
      # failed`, the obvious reading was a stale password, and the owner said
      # it was not — correctly, because a repository secret is ONE stored
      # value and the same value succeeded at 17:29 and failed at 20:08 the
      # same day. "The password has always been wrong" was never consistent
      # with that.
      #
      # The reason the message misleads is that Supavisor answers 28P01 for a
      # tenant it cannot find as well as for a password it rejects, and
      # deliberately does not distinguish them — so a URL pointing at the
      # wrong pooler cluster is indistinguishable from a bad credential.
      #
      # This step distinguishes them, by connecting with a password that is
      # KNOWN to be wrong:
      #
      #   - if a deliberately wrong password produces "Tenant or user not
      #     found", the tenant is not on that cluster. The real password is
      #     irrelevant and the host is the thing to fix;
      #   - if it produces the same 28P01 the real attempt produced, the
      #     tenant IS there and the stored credential is genuinely being
      #     rejected.
      #
      # It then asks the sibling cluster the same question, so the output
      # names the host that does recognise the project rather than leaving
      # that to be guessed too.
      #
      # Diagnosis only: it reads nothing, writes nothing, and cannot change
      # the outcome of the run it is explaining. It never exits non-zero,
      # because the failure it reports on has already failed the job and a
      # second error here would only obscure the first.
      - name: Name the connection failure rather than leaving it to inference
        if: failure()
        env:
          SUPABASE_DEV_DB_URL: ${{ secrets.SUPABASE_DEV_DB_URL }}
        shell: bash
        run: |
          set +e
          command -v psql >/dev/null 2>&1 || {
            echo 'psql is unavailable on this runner; skipping the probe.'
            exit 0
          }
          [ -n "${SUPABASE_DEV_DB_URL}" ] || exit 0

          # Only the non-secret parts leave this parse. The project ref is
          # already declared in this workflow in plain text, so the host and
          # user reveal nothing the file does not already state; the password
          # is never read out of the URL at all.
          read -r host port user <<< "$(node -e '
            try {
              const u = new URL(process.env.SUPABASE_DEV_DB_URL)
              process.stdout.write([u.hostname, u.port || "5432", u.username].join(" "))
            } catch { process.stdout.write("") }
          ')"
          [ -n "${host}" ] || { echo 'The secret is not a parseable URL; nothing to probe.'; exit 0; }

          case "${host}" in
            aws-0-*) sibling="aws-1-${host#aws-0-}" ;;
            aws-1-*) sibling="aws-0-${host#aws-1-}" ;;
            *)       sibling='' ;;
          esac

          echo "Configured host: ${host}:${port}"
          echo "Configured user: ${user}"
          echo

          # Long enough to be unmistakable in a log, and not a credential.
          wrong='this-password-is-deliberately-wrong-it-is-a-probe'

          probe() {
            PGCONNECT_TIMEOUT=15 psql \
              "postgresql://${user}:${wrong}@${1}:${port}/postgres" \
              -c 'select 1' 2>&1 \
              | sed -e 's#://[^@]*@#://[redacted]@#g' \
              | head -3
          }

          echo "--- configured cluster, with a KNOWN-WRONG password ---"
          probe "${host}"
          if [ -n "${sibling}" ]; then
            echo
            echo "--- sibling cluster ${sibling}, same known-wrong password ---"
            probe "${sibling}"
          fi

          echo
          echo 'HOW TO READ THIS:'
          echo '  "Tenant or user not found"        -> the project is not on that cluster.'
          echo '                                      The host is wrong; the password is not.'
          echo '  "password authentication failed"  -> the cluster knows the project, so the'
          echo '                                      stored credential is the thing rejected.'
          echo '  a timeout on both                 -> egress to 5432 is blocked, and this'
          echo '                                      probe has proven nothing either way.'
          exit 0

      - name: Take the lightweight pre-apply snapshot
        if: env.FAST_LANE_PENDING == '1'
        env:
          SUPABASE_DEV_DB_URL: ${{ secrets.SUPABASE_DEV_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          # ADR 0024 keeps a snapshot even in the fast lane. It is a plain dump,
          # not the encrypted, restore-rehearsed artefact production requires.
          mkdir -p /tmp/fast-lane
          supabase db dump --db-url "${SUPABASE_DEV_DB_URL}" --data-only -f /tmp/fast-lane/pre-apply-data.sql
          supabase db dump --db-url "${SUPABASE_DEV_DB_URL}" -f /tmp/fast-lane/pre-apply-schema.sql
          echo "Snapshot bytes: $(wc -c < /tmp/fast-lane/pre-apply-data.sql) data, $(wc -c < /tmp/fast-lane/pre-apply-schema.sql) schema"

      - name: Apply the pending migrations
        if: env.FAST_LANE_PENDING == '1'
        env:
          SUPABASE_DEV_DB_URL: ${{ secrets.SUPABASE_DEV_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          supabase db push --db-url "${SUPABASE_DEV_DB_URL}"

      - name: Confirm the hosted contract now matches the repository
        if: env.FAST_LANE_PENDING == '1'
        env:
          SUPABASE_DEV_DB_URL: ${{ secrets.SUPABASE_DEV_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          supabase migration list --db-url "${SUPABASE_DEV_DB_URL}" > /tmp/migration-list-after.txt
          if awk -F'|' '$3 ~ /[0-9]/ && $2 !~ /[0-9]/ { found=1 } END { exit !found }' /tmp/migration-list-after.txt; then
            echo 'ERROR: migrations remain unapplied after the push.'
            exit 1
          fi
          expected="$(node -p "require('./config/deployment-contract.json').requiredMigrationCount")"
          committed="$(git ls-files 'supabase/migrations/*.sql' | wc -l | tr -d ' ')"
          [ "${committed}" = "${expected}" ] || {
            echo "ERROR: repository has ${committed} migrations but the contract requires ${expected}."
            exit 1
          }
          echo "Development is at contract ${expected}."

      - name: Upload the snapshot and logs
        if: ${{ !cancelled() && env.FAST_LANE_PENDING == '1' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: development-fast-lane-evidence
          path: |
            /tmp/fast-lane/
            /tmp/migration-list.txt
            /tmp/migration-list-after.txt
          retention-days: 7
