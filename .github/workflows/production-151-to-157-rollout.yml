name: Production 151 to 157 rollout

# One-shot guarded promotion of the Production contract boundary 151 -> 157.
#
# The owner authorised this Production migration on 10 August 2026 by asking for
# the six MIG-UI items to be rolled out to Development and then Production. That
# authorisation is what this file records; it is not a licence the workflow
# grants itself, and it does not extend to any other boundary.
#
# This is deliberately NOT a Production fast lane, and there will never be one.
# It accepts only the six reviewed migrations named below, requires the exact
# contract-151 hosted source, and requires evidence that BOTH the encrypted
# backup and the Production-shaped rehearsal already succeeded — by run id,
# checked against the API rather than asserted by whoever dispatched it.
#
# Why the run-id gates exist. "Take a backup first" is a rule that survives
# exactly as long as the person in a hurry remembers it. Every other guard here
# is mechanical, so these two are as well: the workflow refuses to write to
# Production until it has confirmed, itself, that a successful backup run and a
# successful rehearsal run exist for this repository.
#
# Remove this one-shot workflow after the hosted contract/evidence record has
# been reconciled.

on:
  workflow_dispatch:
    inputs:
      project_ref:
        description: Exact Production project ref confirmation
        required: true
      confirmation:
        description: Type APPLY-PRODUCTION-151-TO-157 to proceed
        required: true
      backup_run_id:
        description: Run id of the successful Production backup
        required: true
      rehearsal_run_id:
        description: Run id of the successful 151-to-157 rehearsal
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: production-migration-rollout
  cancel-in-progress: false

env:
  EXPECTED_PROJECT_REF: vkfnsqdyhvtwyqkisxhk
  FORBIDDEN_DEVELOPMENT_REF: iouzoutneyjpugbbtdem
  CONFIRMATION_PHRASE: APPLY-PRODUCTION-151-TO-157
  SOURCE_CONTRACT: '151'
  SOURCE_VERSION: '20260810170000'
  SOURCE_NAME: season_player_profile
  TARGET_CONTRACT: '157'
  TARGET_VERSION: '20260810230000'
  TARGET_NAME: player_preferences
  WORK_DIR: /tmp/production-151-to-157

jobs:
  rollout:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Refuse an unsafe dispatch or repository state
        env:
          INPUT_PROJECT_REF: ${{ inputs.project_ref }}
          INPUT_CONFIRMATION: ${{ inputs.confirmation }}
        shell: bash
        run: |
          set -euo pipefail
          [ "${INPUT_CONFIRMATION}" = "${CONFIRMATION_PHRASE}" ] || {
            echo "ERROR: confirmation phrase does not match ${CONFIRMATION_PHRASE}."
            exit 1
          }
          [ "${INPUT_PROJECT_REF}" = "${EXPECTED_PROJECT_REF}" ] || {
            echo 'ERROR: project ref confirmation does not name the Production project.'
            exit 1
          }
          [ "${GITHUB_REF}" = 'refs/heads/main' ] || {
            echo 'ERROR: Production rollout runs only from refs/heads/main.'
            exit 1
          }
          git fetch --no-tags origin main
          [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" ] || {
            echo 'ERROR: checked-out HEAD is not exact origin/main.'
            exit 1
          }
          [ -z "$(git status --porcelain=v1 --untracked-files=all)" ] || {
            echo 'ERROR: checkout is not clean.'
            exit 1
          }

      - name: Prove a successful backup and rehearsal exist
        env:
          GH_TOKEN: ${{ github.token }}
          BACKUP_RUN_ID: ${{ inputs.backup_run_id }}
          REHEARSAL_RUN_ID: ${{ inputs.rehearsal_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          check_run() {
            local run_id="$1" want_workflow="$2" label="$3"
            local json conclusion path
            json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}")"
            conclusion="$(printf '%s' "${json}" | jq -r '.conclusion')"
            path="$(printf '%s' "${json}" | jq -r '.path')"
            [ "${conclusion}" = 'success' ] || {
              echo "ERROR: ${label} run ${run_id} concluded '${conclusion}', not success."
              exit 1
            }
            [ "${path}" = "${want_workflow}" ] || {
              echo "ERROR: ${label} run ${run_id} is ${path}, not ${want_workflow}."
              exit 1
            }
            echo "${label} run ${run_id} verified: success, ${path}."
          }
          check_run "${BACKUP_RUN_ID}" \
            '.github/workflows/production-backup.yml' 'Backup'
          check_run "${REHEARSAL_RUN_ID}" \
            '.github/workflows/production-151-to-157-rehearsal.yml' 'Rehearsal'

      - name: Prove the repository still holds exactly the approved 151-to-157 batch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${WORK_DIR}"
          expected_batch=$(cat <<'EOF'
          20260810180000_private_container_identity.sql
          20260810190000_private_season_lms.sql
          20260810200000_private_season_cup.sql
          20260810210000_universal_invite_resolver.sql
          20260810220000_season_wrapped_archive.sql
          20260810230000_player_preferences.sql
          EOF
          )
          actual_batch="$(git ls-files 'supabase/migrations/*.sql' | sort | sed -n '152,157p' | xargs -n1 basename)"
          [ "${actual_batch}" = "${expected_batch}" ] || {
            echo 'ERROR: repository rows 152 to 157 are not the approved contract-157 batch.'
            printf 'Expected:\n%s\nActual:\n%s\n' "${expected_batch}" "${actual_batch}"
            exit 1
          }

          # The repository moves faster than a pinned boundary. The authorised
          # set is exactly the six. Anything ABOVE the target is held back in
          # the step that applies, and the dry run below is still required to
          # equal the six exactly, so a later migration cannot ride along inside
          # `supabase db push`.
          total="$(git ls-files 'supabase/migrations/*.sql' | wc -l | tr -d ' ')"
          [ "${total}" -ge "${TARGET_CONTRACT}" ] || {
            echo "ERROR: repository holds only ${total} migrations; this rollout targets ${TARGET_CONTRACT}."
            exit 1
          }
          if [ "${total}" -gt "${TARGET_CONTRACT}" ]; then
            echo "Repository is at ${total}; this promotion is pinned to ${TARGET_CONTRACT}."
            echo 'Migrations above the target will be held back and are NOT promoted by this run.'
          fi

          development_count="$(node -p "require('./config/development-hosted-contract.json').requiredMigrationCount")"
          [ "${development_count}" -ge "${TARGET_CONTRACT}" ] || {
            echo "ERROR: Development is only contract ${development_count}; target is ${TARGET_CONTRACT}."
            exit 1
          }

          files="$(git ls-files 'supabase/migrations/*.sql' | sort | sed -n '152,157p' | tr '\n' ' ')"
          # Declared, not rewritten: the migration list is split on purpose; quoting passes one argument, not many. This is a spent one-shot promotion
          # script; changing what it DOES to satisfy a style rule would edit the
          # record of a past production apply. shellcheck only began seeing it
          # when SHA-pinning marked the file changed, so it is pre-existing.
          # shellcheck disable=SC2086
          node scripts/check-migration-additive.mjs ${files}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.22.2

      - uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        with:
          version: 2.109.1
          github-token: ${{ github.token }}

      - name: Install PostgreSQL 17 client tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17

      - name: Preflight the Production secret without printing it
        env:
          SUPABASE_PROD_DB_URL: ${{ secrets.SUPABASE_PROD_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${SUPABASE_PROD_DB_URL}" ] || {
            echo 'ERROR: repository secret SUPABASE_PROD_DB_URL is not set.'
            exit 1
          }
          case "${SUPABASE_PROD_DB_URL}" in
            *"${FORBIDDEN_DEVELOPMENT_REF}"*)
              echo 'ERROR: Production secret resolves to Development.'
              exit 1
              ;;
            *"${EXPECTED_PROJECT_REF}"*) ;;
            *)
              echo 'ERROR: Production secret does not name the expected Production project.'
              exit 1
              ;;
          esac

      - name: Capture the exact pre-apply Production state
        env:
          SUPABASE_PROD_DB_URL: ${{ secrets.SUPABASE_PROD_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          psql "${SUPABASE_PROD_DB_URL}" -X -q -v ON_ERROR_STOP=1 -A -t -c "
            select json_build_object(
              'migration_count', (select count(*) from supabase_migrations.schema_migrations),
              'latest_version', (select version from supabase_migrations.schema_migrations order by version desc limit 1),
              'latest_name', (select name from supabase_migrations.schema_migrations order by version desc limit 1),
              'auth_users', (select count(*) from auth.users),
              'profiles', (select count(*) from public.profiles),
              'tournaments', (select count(*) from public.tournaments),
              'teams', (select count(*) from public.teams),
              'matches', (select count(*) from public.matches),
              'entries', (select count(*) from public.entries),
              'match_predictions', (select count(*) from public.match_predictions),
              'leagues', (select count(*) from public.leagues),
              'league_members', (select count(*) from public.league_members),
              'score_events', (select count(*) from public.score_events),
              'entry_totals', (select count(*) from public.entry_totals),
              'game_memberships', (select count(*) from public.game_memberships),
              'bonus_competitions', (select count(*) from public.bonus_competitions),
              'leagues_with_code', (select count(*) from public.leagues where invite_code is not null),
              'private_competitions', (
                select count(*) from public.bonus_competitions where visibility_kind = 'private'
              )
            )
          " > "${WORK_DIR}/before.json"
          cat "${WORK_DIR}/before.json"

          BEFORE_FILE="${WORK_DIR}/before.json" node --input-type=module <<'NODE'
          import fs from 'node:fs'
          const before = JSON.parse(fs.readFileSync(process.env.BEFORE_FILE, 'utf8'))
          const expected = {
            migration_count: Number(process.env.SOURCE_CONTRACT),
            latest_version: process.env.SOURCE_VERSION,
            latest_name: process.env.SOURCE_NAME,
          }
          for (const [key, want] of Object.entries(expected)) {
            if (String(before[key]) !== String(want)) {
              console.error(`ERROR: live Production ${key} is ${before[key]}, expected ${want}.`)
              console.error('Production is not the boundary this rollout was rehearsed against.')
              process.exit(1)
            }
          }
          console.log('Live Production is exactly the rehearsed contract-151 source boundary.')
          NODE

      - name: Dry run, and refuse anything that is not exactly the approved batch
        env:
          SUPABASE_PROD_DB_URL: ${{ secrets.SUPABASE_PROD_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail

          # Hold back everything above the pinned target BEFORE the dry run, so
          # the dry run describes what will actually be applied. Restored by the
          # step after the apply, which runs even on failure.
          mkdir -p "${WORK_DIR}/later-migrations"
          : > "${WORK_DIR}/moved-files.txt"
          for file in $(git ls-files 'supabase/migrations/*.sql' | sort); do
            filename="$(basename "${file}")"
            version="${filename:0:14}"
            if [[ "${version}" > "${TARGET_VERSION}" ]]; then
              mv "${file}" "${WORK_DIR}/later-migrations/${filename}"
              printf '%s\n' "${file}" >> "${WORK_DIR}/moved-files.txt"
            fi
          done
          if [ -s "${WORK_DIR}/moved-files.txt" ]; then
            echo 'Held back as ABOVE the pinned target, NOT promoted by this run:'
            cat "${WORK_DIR}/moved-files.txt"
          fi

          supabase migration list --db-url "${SUPABASE_PROD_DB_URL}" \
            > "${WORK_DIR}/migration-list-before.txt"
          supabase db push --db-url "${SUPABASE_PROD_DB_URL}" --dry-run \
            > "${WORK_DIR}/dry-run.txt" 2>&1
          cat "${WORK_DIR}/dry-run.txt"

          grep -oE '[0-9]{14}_[A-Za-z0-9_-]+\.sql' "${WORK_DIR}/dry-run.txt" \
            | awk '!seen[$0]++' > "${WORK_DIR}/dry-run-migrations.txt"
          expected=$(cat <<'EOF'
          20260810180000_private_container_identity.sql
          20260810190000_private_season_lms.sql
          20260810200000_private_season_cup.sql
          20260810210000_universal_invite_resolver.sql
          20260810220000_season_wrapped_archive.sql
          20260810230000_player_preferences.sql
          EOF
          )
          actual="$(cat "${WORK_DIR}/dry-run-migrations.txt")"
          [ "${actual}" = "${expected}" ] || {
            echo 'ERROR: Production dry run is not exactly the approved 152-to-157 batch.'
            printf 'Expected:\n%s\nActual:\n%s\n' "${expected}" "${actual}"
            exit 1
          }

      - name: Apply exactly the approved 151-to-157 batch
        env:
          SUPABASE_PROD_DB_URL: ${{ secrets.SUPABASE_PROD_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          supabase db push --db-url "${SUPABASE_PROD_DB_URL}" \
            2>&1 | tee "${WORK_DIR}/apply.txt"

      - name: Restore the repository migration tree in the runner
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          # Runs even when the apply failed. The verification step below reads
          # the database rather than the tree.
          if [ -f "${WORK_DIR}/moved-files.txt" ]; then
            while IFS= read -r file; do
              [ -n "${file}" ] || continue
              filename="$(basename "${file}")"
              if [ -e "${WORK_DIR}/later-migrations/${filename}" ]; then
                mv "${WORK_DIR}/later-migrations/${filename}" "${file}"
              fi
            done < "${WORK_DIR}/moved-files.txt"
          fi

      - name: Verify exact contract-157 Production state and that nothing was lost
        env:
          SUPABASE_PROD_DB_URL: ${{ secrets.SUPABASE_PROD_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          psql "${SUPABASE_PROD_DB_URL}" -X -q -v ON_ERROR_STOP=1 -A -t -c "
            select json_build_object(
              'migration_count', (select count(*) from supabase_migrations.schema_migrations),
              'latest_version', (select version from supabase_migrations.schema_migrations order by version desc limit 1),
              'latest_name', (select name from supabase_migrations.schema_migrations order by version desc limit 1),
              'auth_users', (select count(*) from auth.users),
              'profiles', (select count(*) from public.profiles),
              'tournaments', (select count(*) from public.tournaments),
              'teams', (select count(*) from public.teams),
              'matches', (select count(*) from public.matches),
              'entries', (select count(*) from public.entries),
              'match_predictions', (select count(*) from public.match_predictions),
              'leagues', (select count(*) from public.leagues),
              'league_members', (select count(*) from public.league_members),
              'score_events', (select count(*) from public.score_events),
              'entry_totals', (select count(*) from public.entry_totals),
              'game_memberships', (select count(*) from public.game_memberships),
              'bonus_competitions', (select count(*) from public.bonus_competitions),
              'leagues_with_code', (select count(*) from public.leagues where invite_code is not null),
              'private_competitions', (
                select count(*) from public.bonus_competitions where visibility_kind = 'private'
              ),
              'registry_league_rows', (
                select count(*) from public.invite_code_registry where league_id is not null
              ),
              'registry_competition_rows', (
                select count(*) from public.invite_code_registry where competition_id is not null
              ),
              'season_wrapped_rows', (select count(*) from public.season_wrapped),
              'competition_follow_rows', (select count(*) from public.competition_follows),
              'pinned_rival_rows', (select count(*) from public.pinned_rivals),
              'internal_table_browser_grants', (
                select count(*) from information_schema.role_table_grants
                 where table_schema = 'public'
                   and table_name in ('invite_code_registry', 'season_wrapped',
                                      'competition_follows', 'pinned_rivals')
                   and grantee in ('anon', 'authenticated', 'PUBLIC')
              ),
              'new_rpcs_granted_to_authenticated', (
                select count(distinct routine_name) from information_schema.role_routine_grants
                 where routine_schema = 'public' and grantee = 'authenticated'
                   and routine_name in (
                     'create_private_season_lms', 'join_private_competition',
                     'create_private_season_cup', 'launch_private_season_cup',
                     'resolve_invite_code', 'get_season_wrapped',
                     'set_competition_follow', 'set_onboarding_progress',
                     'set_pinned_rival', 'get_my_preferences')
              ),
              'new_rpcs_reachable_anonymously', (
                select count(*) from information_schema.role_routine_grants
                 where routine_schema = 'public' and grantee in ('anon', 'PUBLIC')
                   and routine_name in (
                     'create_private_season_lms', 'join_private_competition',
                     'create_private_season_cup', 'launch_private_season_cup',
                     'resolve_invite_code', 'get_season_wrapped',
                     'set_competition_follow', 'set_onboarding_progress',
                     'set_pinned_rival', 'get_my_preferences')
              ),
              'public_join_refuses_private', (
                select pg_catalog.pg_get_functiondef(p.oid) like '%competition is private%'
                  from pg_catalog.pg_proc p
                  join pg_catalog.pg_namespace n on n.oid = p.pronamespace
                 where n.nspname = 'public' and p.proname = 'join_competition_game'
              ),
              'euro_publication_state', (select state::text from predictor_internal.euro_publication_state)
            )
          " > "${WORK_DIR}/after.json"
          cat "${WORK_DIR}/after.json"

          BEFORE_FILE="${WORK_DIR}/before.json" AFTER_FILE="${WORK_DIR}/after.json" \
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          const before = JSON.parse(fs.readFileSync(process.env.BEFORE_FILE, 'utf8'))
          const after = JSON.parse(fs.readFileSync(process.env.AFTER_FILE, 'utf8'))

          const reached = {
            migration_count: Number(process.env.TARGET_CONTRACT),
            latest_version: process.env.TARGET_VERSION,
            latest_name: process.env.TARGET_NAME,
          }
          for (const [key, want] of Object.entries(reached)) {
            if (String(after[key]) !== String(want)) {
              console.error(`ERROR: contract-157 verification mismatch for ${key}: ${after[key]} != ${want}.`)
              process.exit(1)
            }
          }

          // Additive means nothing player-owned moves. Asserted, not assumed:
          // a schema migration that changed any of these counts would be a
          // data migration nobody approved. `bonus_competitions` is in this
          // list deliberately — contract 152 ALTERS that table, and altering a
          // table must not add or remove a row of it.
          const preserved = [
            'auth_users', 'profiles', 'tournaments', 'teams', 'matches',
            'entries', 'match_predictions', 'leagues', 'league_members',
            'score_events', 'entry_totals', 'game_memberships',
            'bonus_competitions', 'leagues_with_code', 'private_competitions',
          ]
          for (const key of preserved) {
            if (String(before[key]) !== String(after[key])) {
              console.error(`ERROR: ${key} changed across the migration: ${before[key]} -> ${after[key]}.`)
              process.exit(1)
            }
          }

          // Contract 152 backfills every league invite code into the shared
          // namespace and its own DO block refuses a partial backfill. Compared
          // against the count read from live Production BEFORE the apply, so
          // this is measurement rather than a number written into a workflow.
          if (String(after.registry_league_rows) !== String(before.leagues_with_code)) {
            console.error(
              `ERROR: backfill covered ${after.registry_league_rows} of ${before.leagues_with_code} league codes.`)
            process.exit(1)
          }

          // Everything this batch adds must arrive INERT. It creates no
          // competition, finalises no season, records no preference and issues
          // no competition invite code.
          const expected = {
            registry_competition_rows: 0,
            season_wrapped_rows: 0,
            competition_follow_rows: 0,
            pinned_rival_rows: 0,
            // Four new relations, none browser-reachable. A player who can read
            // the registry can enumerate every private competition there is.
            internal_table_browser_grants: 0,
            // Ten new reads and writes, all for signed-in players only.
            // Making one anonymous is a publication decision, not this.
            new_rpcs_granted_to_authenticated: 10,
            new_rpcs_reachable_anonymously: 0,
            // Contract 153 narrowed the public join so it refuses a private
            // competition. That is the privacy hole this batch closed, so it is
            // asserted on the live database rather than assumed from the file.
            public_join_refuses_private: true,
            // Contract 143 is untouched by a batch about private containers.
            euro_publication_state: 'hidden',
          }
          for (const [key, want] of Object.entries(expected)) {
            if (String(after[key]) !== String(want)) {
              console.error(`ERROR: ${key} arrived as ${after[key]}, expected ${want}.`)
              process.exit(1)
            }
          }

          console.log('Production reached exactly contract 157. No player-owned row moved.')
          console.log(JSON.stringify(after, null, 2))
          NODE

      - name: Say plainly what remains gated
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '## Production is at contract 157'
            echo
            echo 'Schema only. This rollout did NOT:'
            echo
            echo '- create a single private league, Last Man Standing or Championship — it added the'
            echo '  authorities a player uses to create one, and every container arrived empty;'
            # Declared, not rewritten: backticks are literal markdown for the step summary and must not expand. This is a spent one-shot promotion
            # script; changing what it DOES to satisfy a style rule would edit the
            # record of a past production apply. shellcheck only began seeing it
            # when SHA-pinning marked the file changed, so it is pre-existing.
            # shellcheck disable=SC2016
            echo '- publish Euro 2028 — contract 143 stays `hidden` and publication is an owner act;'
            echo '- promote the application — the deployed site is a separate, separately approved'
            echo '  step, and until it happens no browser can reach any of these ten functions;'
            echo '- import any football, and copying Development football rows into Production'
            echo '  remains forbidden by the contract 132 boundary.'
            echo
            # Declared, not rewritten: backticks are literal markdown for the step summary and must not expand. This is a spent one-shot promotion
            # script; changing what it DOES to satisfy a style rule would edit the
            # record of a past production apply. shellcheck only began seeing it
            # when SHA-pinning marked the file changed, so it is pre-existing.
            # shellcheck disable=SC2016
            echo 'Reconcile `config/production-hosted-contract.json` from an independent read-only'
            echo 'ledger query, not from this job'"'"'s own output.'
          } >> "${GITHUB_STEP_SUMMARY}"
