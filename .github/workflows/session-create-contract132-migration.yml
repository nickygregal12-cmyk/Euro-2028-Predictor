name: Session create contract 132 migration

on:
  push:
    branches:
      - feature/provider-initial-fixture-approval-contract-132

permissions:
  contents: write

jobs:
  create-migration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf
        with:
          version: 2.84.2
      - name: Refuse unexpected branch content
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'feature/provider-initial-fixture-approval-contract-132'
          test "$(git diff --name-only HEAD^ HEAD)" = '.github/workflows/session-create-contract132-migration.yml'
          test "$(find supabase/migrations -maxdepth 1 -type f -name '*provider_initial_fixture_approval.sql' | wc -l)" = '0'
      - name: Create migration through Supabase CLI
        shell: bash
        run: |
          set -euo pipefail
          supabase migration new provider_initial_fixture_approval
          migration="$(find supabase/migrations -maxdepth 1 -type f -name '*provider_initial_fixture_approval.sql' | sort | tail -n1)"
          test -n "$migration"
          echo "Created $migration"
          printf '%s\n' '-- Contract 132 placeholder generated by Supabase CLI; populated in the reviewed branch.' > "$migration"
          git rm .github/workflows/session-create-contract132-migration.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$migration"
          git commit -m 'Create contract 132 migration file'
          git push origin HEAD:"$GITHUB_REF_NAME"
