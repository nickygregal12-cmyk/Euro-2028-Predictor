name: Account contract patch

on:
  push:
    branches:
      - agent/account-privacy-controls
    paths:
      - .github/workflows/account-contract-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/account-privacy-controls

      - name: Update contract tests
        shell: python
        run: |
          from pathlib import Path

          privileges = Path('supabase/tests/080_function_privileges.sql')
          text = privileges.read_text()
          needle = "  ('delete_match_prediction(uuid,uuid,integer)'),\n"
          replacement = needle + "  ('clear_my_entry(uuid)'),\n"
          if needle not in text:
              raise SystemExit('delete_match_prediction allowlist anchor not found')
          privileges.write_text(text.replace(needle, replacement, 1))

          account_test = Path('supabase/tests/111_account_privacy_controls.sql')
          text = account_test.read_text()
          broken = "  '{\"search_path=\"\"\"}',\n"
          fixed = "  '{\"search_path=\\\"\\\"\"}',\n"
          if broken not in text:
              raise SystemExit('search-path assertion anchor not found')
          text = text.replace(broken, fixed, 1)
          null_anchor = "  null,\n  'the caller entry returns to an unsubmitted state'\n"
          null_fixed = "  null::timestamptz,\n  'the caller entry returns to an unsubmitted state'\n"
          if null_anchor not in text:
              raise SystemExit('submitted_at null assertion anchor not found')
          account_test.write_text(text.replace(null_anchor, null_fixed, 1))

      - name: Commit contract test corrections
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add supabase/tests/080_function_privileges.sql supabase/tests/111_account_privacy_controls.sql
          git commit -m "Complete account contract database tests"
          git push origin HEAD:agent/account-privacy-controls
