name: Production 205 to 206 rehearsal

# Contract 206 rehearsal. Production remains read-only in this workflow.
# Manual trigger only. A successful encrypted Production backup must already
# exist, Development must be recorded at 206 or later, and the repository must
# still have Contract 206 as its exact migration head.
on:
  workflow_dispatch:
    inputs:
      project_ref:
        description: Exact Production project ref confirmation
        required: true
      confirmation:
        description: Type REHEARSE-PRODUCTION-205-TO-206 to proceed
        required: true
      backup_run_id:
        description: Run id of the successful fresh Production backup
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: production-205-to-206-rehearsal
  cancel-in-progress: false

env:
  EXPECTED_PROJECT_REF: vkfnsqdyhvtwyqkisxhk
  FORBIDDEN_DEVELOPMENT_REF: iouzoutneyjpugbbtdem
  CONFIRMATION_PHRASE: REHEARSE-PRODUCTION-205-TO-206
  SOURCE_CONTRACT: '205'
  SOURCE_VERSION: '20260819100000'
  SOURCE_NAME: cup_bracket_seed_initial_phase
  TARGET_CONTRACT: '206'
  TARGET_VERSION: '20260819110000'
  TARGET_NAME: same_season_player_profile
  WORK_DIR: /tmp/production-205-to-206-rehearsal
  LOCAL_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres

jobs:
  rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Refuse an unsafe dispatch or repository state
        env:
          INPUT_PROJECT_REF: ${{ inputs.project_ref }}
          INPUT_CONFIRMATION: ${{ inputs.confirmation }}
        shell: bash
        run: |
          set -euo pipefail
          [ "${INPUT_CONFIRMATION}" = "${CONFIRMATION_PHRASE}" ] || { echo 'ERROR: confirmation phrase mismatch.'; exit 1; }
          [ "${INPUT_PROJECT_REF}" != "${FORBIDDEN_DEVELOPMENT_REF}" ] || { echo 'ERROR: that is Development.'; exit 1; }
          [ "${INPUT_PROJECT_REF}" = "${EXPECTED_PROJECT_REF}" ] || { echo 'ERROR: project ref is not Production.'; exit 1; }
          [ "${GITHUB_REF}" = 'refs/heads/main' ] || { echo 'ERROR: rehearsal runs only from main.'; exit 1; }
          git fetch --no-tags origin main
          [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" ] || { echo 'ERROR: HEAD is not exact main.'; exit 1; }
          [ -z "$(git status --porcelain=v1 --untracked-files=all)" ] || { echo 'ERROR: checkout is dirty.'; exit 1; }
          mkdir -p "${WORK_DIR}"

      - name: Prove a fresh encrypted backup succeeded first
        env:
          GH_TOKEN: ${{ github.token }}
          BACKUP_RUN_ID: ${{ inputs.backup_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${BACKUP_RUN_ID}")"
          [ "$(jq -r '.conclusion' <<<"${json}")" = success ] || { echo 'ERROR: backup did not succeed.'; exit 1; }
          [ "$(jq -r '.path' <<<"${json}")" = '.github/workflows/production-backup.yml' ] || { echo 'ERROR: not the Production backup workflow.'; exit 1; }
          backup_sha="$(jq -r '.head_sha' <<<"${json}")"
          git merge-base --is-ancestor "${backup_sha}" HEAD || { echo 'ERROR: backup head is not an ancestor of rehearsal head.'; exit 1; }
          artifacts="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${BACKUP_RUN_ID}/artifacts")"
          [ "$(jq '[.artifacts[] | select(.name == "production-backup-encrypted" and .expired == false)] | length' <<<"${artifacts}")" = 1 ] || {
            echo 'ERROR: encrypted backup artifact missing.'
            exit 1
          }

      - name: Refuse to make Production the first hosted environment to see Contract 206
        shell: bash
        run: |
          set -euo pipefail
          dev_ref="$(node -p "require('./config/development-hosted-contract.json').projectRef")"
          dev_contract="$(node -p "require('./config/development-hosted-contract.json').requiredMigrationCount")"
          [ "${dev_ref}" = "${FORBIDDEN_DEVELOPMENT_REF}" ] || { echo 'ERROR: Development record names the wrong project.'; exit 1; }
          [ "${dev_contract}" -ge "${TARGET_CONTRACT}" ] || {
            echo "ERROR: Development is recorded at contract ${dev_contract}, below ${TARGET_CONTRACT}."
            exit 1
          }

      - name: Prove the repository boundary is exactly 205 to 206
        shell: bash
        run: |
          set -euo pipefail
          committed="$(git ls-files 'supabase/migrations/*.sql' | wc -l | tr -d ' ')"
          declared="$(node -p "require('./config/deployment-contract.json').requiredMigrationCount")"
          newest="$(basename "$(git ls-files 'supabase/migrations/*.sql' | sort | tail -1)")"
          [ "${committed}" = "${TARGET_CONTRACT}" ] || { echo "ERROR: repository has ${committed} migrations."; exit 1; }
          [ "${declared}" = "${TARGET_CONTRACT}" ] || { echo "ERROR: deployment contract is ${declared}."; exit 1; }
          [ "${newest}" = "${TARGET_VERSION}_${TARGET_NAME}.sql" ] || { echo "ERROR: newest migration is ${newest}."; exit 1; }
          : > "${WORK_DIR}/boundary.txt"
          for file in $(git ls-files 'supabase/migrations/*.sql' | sort); do
            version="$(basename "${file}")"; version="${version:0:14}"
            if [[ "${version}" > "${SOURCE_VERSION}" && ! "${version}" > "${TARGET_VERSION}" ]]; then
              basename "${file}" >> "${WORK_DIR}/boundary.txt"
              node scripts/check-migration-additive.mjs "${file}"
            fi
          done
          count="$(wc -l < "${WORK_DIR}/boundary.txt" | tr -d ' ')"
          expected="$(( TARGET_CONTRACT - SOURCE_CONTRACT ))"
          [ "${count}" = "${expected}" ] || { echo "ERROR: boundary holds ${count} migrations, expected ${expected}."; cat "${WORK_DIR}/boundary.txt"; exit 1; }
          [ "$(cat "${WORK_DIR}/boundary.txt")" = "${TARGET_VERSION}_${TARGET_NAME}.sql" ] || { echo 'ERROR: boundary is not exactly Contract 206.'; exit 1; }

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.2

      - uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2
        with:
          version: 2.109.1
          github-token: ${{ github.token }}

      - name: Install PostgreSQL 17 client tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17

      - name: Confirm Production is exactly 205 before dumping it
        env:
          SUPABASE_PROD_DB_URL: ${{ secrets.SUPABASE_PROD_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${SUPABASE_PROD_DB_URL}" ] || { echo 'ERROR: SUPABASE_PROD_DB_URL missing.'; exit 1; }
          case "${SUPABASE_PROD_DB_URL}" in
            *"${FORBIDDEN_DEVELOPMENT_REF}"*) echo 'ERROR: Production secret resolves to Development.'; exit 1 ;;
            *"${EXPECTED_PROJECT_REF}"*) ;;
            *) echo 'ERROR: Production secret does not name Production.'; exit 1 ;;
          esac
          psql "${SUPABASE_PROD_DB_URL}" -X -q -A -t -v ON_ERROR_STOP=1 -f - > "${WORK_DIR}/live.json" <<'SQL'
          select jsonb_build_object(
            'migration_count',(select count(*) from supabase_migrations.schema_migrations),
            'latest_version',(select version from supabase_migrations.schema_migrations order by version desc limit 1),
            'latest_name',(select name from supabase_migrations.schema_migrations order by version desc limit 1));
          SQL
          LIVE_FILE="${WORK_DIR}/live.json" node --input-type=module <<'NODE'
          import fs from 'node:fs'
          const x = JSON.parse(fs.readFileSync(process.env.LIVE_FILE, 'utf8'))
          const want = {
            migration_count: Number(process.env.SOURCE_CONTRACT),
            latest_version: process.env.SOURCE_VERSION,
            latest_name: process.env.SOURCE_NAME,
          }
          for (const [k, v] of Object.entries(want)) {
            if (String(x[k]) !== String(v)) throw new Error(`Production ${k}=${x[k]}, expected ${v}`)
          }
          NODE

      - name: Dump Production and restore disposable copy
        env:
          SUPABASE_PROD_DB_URL: ${{ secrets.SUPABASE_PROD_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          supabase init --force --workdir "${WORK_DIR}" >/dev/null 2>&1 || true
          supabase start --workdir "${WORK_DIR}"
          BUNDLE="${WORK_DIR}/bundle"
          ROLLOUT="${GITHUB_WORKSPACE}/scripts/database-rollout"
          mkdir -p "${BUNDLE}"
          supabase db dump --db-url "${SUPABASE_PROD_DB_URL}" --file "${BUNDLE}/roles.sql" --role-only
          supabase db dump --db-url "${SUPABASE_PROD_DB_URL}" --file "${BUNDLE}/schema.sql"
          supabase db dump --db-url "${SUPABASE_PROD_DB_URL}" --file "${BUNDLE}/data.sql" --use-copy --data-only -x storage.buckets_vectors -x storage.vector_indexes
          /usr/lib/postgresql/17/bin/pg_dump --dbname "${SUPABASE_PROD_DB_URL}" --schema supabase_migrations --no-owner --no-privileges --file "${BUNDLE}/migration-history.sql"
          for f in roles.sql schema.sql data.sql migration-history.sql; do
            [ -s "${BUNDLE}/${f}" ] || { echo "ERROR: missing ${f}"; exit 1; }
          done
          psql "${LOCAL_DB_URL}" -X --single-transaction -v ON_ERROR_STOP=1 --file "${BUNDLE}/roles.sql"
          psql "${LOCAL_DB_URL}" -X --single-transaction -v ON_ERROR_STOP=1 --file "${ROLLOUT}/prepare-disposable-restore-target.sql"
          psql "${LOCAL_DB_URL}" -X --single-transaction -v ON_ERROR_STOP=1 --file "${BUNDLE}/schema.sql"
          psql "${LOCAL_DB_URL}" -X --single-transaction -v ON_ERROR_STOP=1 --command 'SET session_replication_role = replica' --file "${BUNDLE}/data.sql"
          psql "${LOCAL_DB_URL}" -X --single-transaction -v ON_ERROR_STOP=1 --file "${ROLLOUT}/managed-schema-customizations.sql"
          psql "${LOCAL_DB_URL}" -X --single-transaction -v ON_ERROR_STOP=1 --file "${BUNDLE}/migration-history.sql"
          restored="$(psql "${LOCAL_DB_URL}" -X -q -A -t -v ON_ERROR_STOP=1 -c 'select count(*) from supabase_migrations.schema_migrations')"
          [ "${restored}" = "${SOURCE_CONTRACT}" ] || { echo "ERROR: restored contract ${restored}."; exit 1; }

      - name: Measure the disposable copy before applying
        shell: bash
        run: |
          set -euo pipefail
          psql "${LOCAL_DB_URL}" -X -q -A -t -v ON_ERROR_STOP=1 -f - > "${WORK_DIR}/before.json" <<'SQL'
          select jsonb_build_object(
            'auth_users',(select count(*) from auth.users),
            'profiles',(select count(*) from public.profiles),
            'entries',(select count(*) from public.entries),
            'season_predictions',(select count(*) from public.season_predictions),
            'league_members',(select count(*) from public.league_members),
            'ai_bets',(select count(*) from ai.bets),
            'cron_jobs',(select count(*) from cron.job),
            'public_enabled',(select public_enabled from ai.publication_gate limit 1),
            'betting_public_enabled',(select betting_public_enabled from ai.publication_gate limit 1));
          SQL

      - name: Apply exactly Contract 206 to the disposable copy
        shell: bash
        run: |
          set -euo pipefail
          supabase db push --db-url "${LOCAL_DB_URL}" --dry-run > "${WORK_DIR}/dry-run.txt" 2>&1
          cat "${WORK_DIR}/dry-run.txt"
          grep -oE '[0-9]{14}_[A-Za-z0-9_-]+\.sql' "${WORK_DIR}/dry-run.txt" | awk '!seen[$0]++' | sort > "${WORK_DIR}/pending.txt"
          sort "${WORK_DIR}/boundary.txt" > "${WORK_DIR}/expected.txt"
          diff -u "${WORK_DIR}/expected.txt" "${WORK_DIR}/pending.txt" || { echo 'ERROR: dry run is not exactly Contract 206.'; exit 1; }
          supabase db push --db-url "${LOCAL_DB_URL}"

      - name: Run Contract 206 behavioural pgTAP
        shell: bash
        run: |
          set +e
          PGTAP_LOG="${WORK_DIR}/pgtap.log"
          mkdir -p "${WORK_DIR}/supabase/tests"
          REL="supabase/tests/252_same_season_player_profile_visibility.sql"
          cp "${GITHUB_WORKSPACE}/${REL}" "${WORK_DIR}/${REL}"
          cmp "${GITHUB_WORKSPACE}/${REL}" "${WORK_DIR}/${REL}" || { echo "ERROR: ${REL} copy differs."; exit 1; }
          ( cd "${WORK_DIR}" && supabase test db "${REL}" --db-url "${LOCAL_DB_URL}" ) >"${PGTAP_LOG}" 2>&1
          status=$?
          cat "${PGTAP_LOG}"
          if [ "${status}" -ne 0 ]; then
            excerpt="$(tail -n 80 "${PGTAP_LOG}" | tr '\n' ' ' | sed 's/%/%25/g')"
            echo "::error title=Contract 206 pgTAP failed::exit=${status}; ${excerpt}"
            exit "${status}"
          fi
          grep -q 'Result: PASS' "${PGTAP_LOG}" || { echo 'ERROR: pgTAP did not report PASS.'; exit 1; }

      - name: Verify Contract 206 and unchanged Production-derived state on the copy
        shell: bash
        run: |
          set -euo pipefail
          psql "${LOCAL_DB_URL}" -X -q -A -t -v ON_ERROR_STOP=1 -f - > "${WORK_DIR}/after.json" <<'SQL'
          select jsonb_build_object(
            'migration_count',(select count(*) from supabase_migrations.schema_migrations),
            'latest_version',(select version from supabase_migrations.schema_migrations order by version desc limit 1),
            'latest_name',(select name from supabase_migrations.schema_migrations order by version desc limit 1),
            'auth_users',(select count(*) from auth.users),
            'profiles',(select count(*) from public.profiles),
            'entries',(select count(*) from public.entries),
            'season_predictions',(select count(*) from public.season_predictions),
            'league_members',(select count(*) from public.league_members),
            'ai_bets',(select count(*) from ai.bets),
            'cron_jobs',(select count(*) from cron.job),
            'public_enabled',(select public_enabled from ai.publication_gate limit 1),
            'betting_public_enabled',(select betting_public_enabled from ai.publication_gate limit 1),
            'by_ref_authenticated',has_function_privilege('authenticated','public.get_season_player_profile_by_ref(uuid,uuid)','EXECUTE'),
            'by_ref_anon',has_function_privilege('anon','public.get_season_player_profile_by_ref(uuid,uuid)','EXECUTE'),
            'legacy_authenticated',has_function_privilege('authenticated','public.get_season_player_profile(uuid,uuid)','EXECUTE'),
            'legacy_anon',has_function_privilege('anon','public.get_season_player_profile(uuid,uuid)','EXECUTE'));
          SQL
          BEFORE_FILE="${WORK_DIR}/before.json" AFTER_FILE="${WORK_DIR}/after.json" node --input-type=module <<'NODE'
          import fs from 'node:fs'
          const b = JSON.parse(fs.readFileSync(process.env.BEFORE_FILE, 'utf8'))
          const a = JSON.parse(fs.readFileSync(process.env.AFTER_FILE, 'utf8'))
          const problems = []
          const eq = (k, v) => String(a[k]) === String(v) || problems.push(`${k}=${a[k]}, expected ${v}`)
          eq('migration_count', Number(process.env.TARGET_CONTRACT))
          eq('latest_version', process.env.TARGET_VERSION)
          eq('latest_name', process.env.TARGET_NAME)
          for (const k of ['auth_users','profiles','entries','season_predictions','league_members','ai_bets','cron_jobs','public_enabled','betting_public_enabled']) eq(k, b[k])
          eq('by_ref_authenticated', true)
          eq('by_ref_anon', false)
          eq('legacy_authenticated', true)
          eq('legacy_anon', false)
          if (problems.length) throw new Error(`REHEARSAL VERIFICATION FAILED:\n - ${problems.join('\n - ')}`)
          NODE

      - name: Stop disposable Supabase
        if: always()
        shell: bash
        run: supabase stop --workdir "${WORK_DIR}" --no-backup || true

      - name: Upload rehearsal evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: production-205-to-206-rehearsal-evidence
          path: |
            /tmp/production-205-to-206-rehearsal/live.json
            /tmp/production-205-to-206-rehearsal/before.json
            /tmp/production-205-to-206-rehearsal/after.json
            /tmp/production-205-to-206-rehearsal/boundary.txt
            /tmp/production-205-to-206-rehearsal/dry-run.txt
            /tmp/production-205-to-206-rehearsal/pgtap.log
          retention-days: 7
          if-no-files-found: warn
