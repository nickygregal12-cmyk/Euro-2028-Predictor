name: Fix Contract 105 historical draw proof

on:
  push:
    branches:
      - claude/next-build-stage-aufrh6

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/next-build-stage-aufrh6

      - name: Make the duplicate-draw probe ancestry-valid and remove helper
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('supabase/tests/153_cup_split_stage_persistence.sql')
          text = path.read_text()
          marker = """select is(pg_temp.capture_sqlstate($sql$insert into public.bonus_cup_members
            (competition_id,user_id,group_id,draw_number,phase_kind) values
            (md5('c102-comp')::uuid,md5('c102-user-7')::uuid,md5('c102-split-top')::uuid,7,'initial')$sql$),
            '23503', 'an initial membership cannot point at a split group');
          """
          insertion = marker + """insert into public.bonus_cup_members
            (competition_id,user_id,group_id,draw_number,phase_kind) values
            (md5('c102-comp')::uuid,md5('c102-user-7')::uuid,
             md5('c102-initial')::uuid,7,'initial');
          """
          if text.count(marker) != 1:
              raise SystemExit(f'expected one invalid initial-group probe, found {text.count(marker)}')
          path.write_text(text.replace(marker, insertion))
          PY

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/fix-contract-105-historical-draw-proof.yml
          git add supabase/tests/153_cup_split_stage_persistence.sql
          git diff --cached --check
          git commit -m 'Keep Contract 102 draw uniqueness proof ancestry-valid'
          git push origin HEAD:claude/next-build-stage-aufrh6
