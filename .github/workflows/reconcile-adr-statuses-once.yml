name: Reconcile ADR statuses once

on:
  push:
    branches:
      - docs/reconcile-adr-statuses-2026-08-05
    paths:
      - scripts/reconcile-adr-statuses-once.py
      - .github/workflows/reconcile-adr-statuses-once.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/reconcile-adr-statuses-2026-08-05
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reconcile ADR implementation statuses
        run: python scripts/reconcile-adr-statuses-once.py
      - name: Remove one-run tooling and commit
        run: |
          rm scripts/reconcile-adr-statuses-once.py
          rm .github/workflows/reconcile-adr-statuses-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/adr scripts/reconcile-adr-statuses-once.py .github/workflows/reconcile-adr-statuses-once.yml
          git commit -m "Docs: reconcile ADR implementation statuses"
          git push origin HEAD:docs/reconcile-adr-statuses-2026-08-05
