name: Development provider team profile backfill

# Populates the Contract-144 server-only team profile store from the exact
# retained SportMonks response already held in Development custody. This is an
# operator action, not a migration and not a provider poll.
#
# Safety properties:
# - Development only; production is explicitly refused.
# - Exact current main only.
# - Hosted migrations must already match the repository and include Contract 144.
# - The committed evidence must match the retained raw-response SHA and all 12
#   existing provider team mappings before any profile write occurs.
# - The generated SQL locks and snapshots season_fixtures and
#   season_matchweek_scores inside the same transaction, and rolls the backfill
#   back if protected result/scoring state moves.
# - No provider request, fixture import, result confirmation or scoring job runs.

on:
  workflow_dispatch:
    inputs:
      project_ref:
        description: Exact development project ref confirmation
        required: true
      confirmation:
        description: Type BACKFILL-SCOTTISH-TEAM-PROFILES to proceed
        required: true

permissions:
  contents: read

env:
  EXPECTED_PROJECT_REF: iouzoutneyjpugbbtdem
  FORBIDDEN_PRODUCTION_REF: vkfnsqdyhvtwyqkisxhk
  CONFIRMATION_PHRASE: BACKFILL-SCOTTISH-TEAM-PROFILES
  EVIDENCE_FILE: docs/quality/evidence/2026-08-08-sportmonks-scottish-team-enrichment.json
  CONTRACT_144_VERSION: '20260809140000'
  SCOTTISH_TOURNAMENT_ID: 6a64a59b-b721-443e-a864-0fd52db1edbd

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Refuse an unsafe dispatch or repository state
        env:
          INPUT_PROJECT_REF: ${{ inputs.project_ref }}
          INPUT_CONFIRMATION: ${{ inputs.confirmation }}
        shell: bash
        run: |
          set -euo pipefail
          [ "${GITHUB_REF}" = 'refs/heads/main' ] || {
            echo 'ERROR: this workflow runs only from refs/heads/main.'
            exit 1
          }
          git fetch --no-tags origin main
          [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" ] || {
            echo 'ERROR: checked-out HEAD is not exact origin/main.'
            exit 1
          }
          [ -z "$(git status --porcelain=v1 --untracked-files=all)" ] || {
            echo 'ERROR: checkout is not clean.'
            exit 1
          }
          if [ "${INPUT_PROJECT_REF}" = "${FORBIDDEN_PRODUCTION_REF}" ]; then
            echo 'ERROR: production provider-profile backfill is not authorised.'
            exit 1
          fi
          [ "${INPUT_PROJECT_REF}" = "${EXPECTED_PROJECT_REF}" ] || {
            echo "ERROR: only Development project ${EXPECTED_PROJECT_REF} is permitted."
            exit 1
          }
          [ "${INPUT_CONFIRMATION}" = "${CONFIRMATION_PHRASE}" ] || {
            echo 'ERROR: confirmation phrase does not match.'
            exit 1
          }

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.22.2

      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1.7.1
        with:
          version: 2.84.2

      - name: Preflight the Development database secret without printing it
        env:
          SUPABASE_DEV_DB_URL: ${{ secrets.SUPABASE_DEV_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${SUPABASE_DEV_DB_URL}" ] || {
            echo 'ERROR: repository secret SUPABASE_DEV_DB_URL is not set.'
            exit 1
          }
          case "${SUPABASE_DEV_DB_URL}" in
            *"${FORBIDDEN_PRODUCTION_REF}"*)
              echo 'ERROR: the Development secret resolves to Production.'
              exit 1
              ;;
            *"${EXPECTED_PROJECT_REF}"*) ;;
            *)
              echo 'ERROR: the Development secret names neither known project.'
              exit 1
              ;;
          esac
          command -v psql >/dev/null 2>&1 || {
            echo 'ERROR: psql is unavailable on this runner.'
            exit 1
          }

      - name: Prove Development already matches the repository and includes Contract 144
        env:
          SUPABASE_DEV_DB_URL: ${{ secrets.SUPABASE_DEV_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/provider-team-profile-backfill
          supabase migration list --db-url "${SUPABASE_DEV_DB_URL}" \
            > /tmp/provider-team-profile-backfill/migration-list.txt 2>&1 || {
              echo 'ERROR: could not read the hosted migration ledger.'
              sed -e 's/[[:alnum:]._-]*:[[:alnum:]._%-]*@/[redacted]@/g' \
                /tmp/provider-team-profile-backfill/migration-list.txt
              exit 1
            }

          pending="$(awk -F'|' '
            $3 ~ /[0-9]/ && $2 !~ /[0-9]/ {
              version = $1
              gsub(/[^0-9]/, "", version)
              if (length(version) == 14) print version
            }' /tmp/provider-team-profile-backfill/migration-list.txt || true)"
          remote_only="$(awk -F'|' '
            $2 ~ /[0-9]/ && $1 !~ /[0-9]/ {
              version = $2
              gsub(/[^0-9]/, "", version)
              if (length(version) == 14) print version
            }' /tmp/provider-team-profile-backfill/migration-list.txt || true)"

          [ -z "${pending}" ] || {
            echo 'ERROR: Development is behind the repository; apply migrations first.'
            echo "${pending}"
            exit 1
          }
          [ -z "${remote_only}" ] || {
            echo 'ERROR: Development has migration history not represented by this repository.'
            echo "${remote_only}"
            exit 1
          }

          expected="$(node -p "require('./config/deployment-contract.json').requiredMigrationCount")"
          committed="$(git ls-files 'supabase/migrations/*.sql' | wc -l | tr -d ' ')"
          remote_count="$(awk -F'|' '
            $2 ~ /[0-9]/ {
              version = $2
              gsub(/[^0-9]/, "", version)
              if (length(version) == 14) count += 1
            }
            END { print count + 0 }
          ' /tmp/provider-team-profile-backfill/migration-list.txt)"

          [ "${expected}" -ge 144 ] || {
            echo "ERROR: repository contract ${expected} predates Contract 144."
            exit 1
          }
          [ "${committed}" = "${expected}" ] || {
            echo "ERROR: repository has ${committed} migrations but contract requires ${expected}."
            exit 1
          }
          [ "${remote_count}" = "${expected}" ] || {
            echo "ERROR: Development has ${remote_count} applied migrations but repository requires ${expected}."
            exit 1
          }
          grep -Eq "${CONTRACT_144_VERSION}[[:space:]]*\\|[[:space:]]*${CONTRACT_144_VERSION}" \
            /tmp/provider-team-profile-backfill/migration-list.txt || {
              echo 'ERROR: Contract 144 is not present in the Development migration ledger.'
              exit 1
            }

      - name: Generate the evidence-bound SQL
        shell: bash
        run: |
          set -euo pipefail
          node scripts/ops/build-provider-team-profile-backfill.mjs \
            --evidence "${EVIDENCE_FILE}" \
            --output /tmp/provider-team-profile-backfill/backfill.sql

      - name: Apply the 12-club profile backfill
        env:
          SUPABASE_DEV_DB_URL: ${{ secrets.SUPABASE_DEV_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          psql "${SUPABASE_DEV_DB_URL}" \
            -X \
            -v ON_ERROR_STOP=1 \
            -f /tmp/provider-team-profile-backfill/backfill.sql \
            > /tmp/provider-team-profile-backfill/apply.log 2>&1 || {
              echo 'ERROR: provider team profile backfill refused or failed.'
              sed -e 's#://[^@]*@#://[redacted]@#g' \
                /tmp/provider-team-profile-backfill/apply.log
              exit 1
            }

      - name: Record bounded postflight evidence
        env:
          SUPABASE_DEV_DB_URL: ${{ secrets.SUPABASE_DEV_DB_URL }}
        shell: bash
        run: |
          psql "${SUPABASE_DEV_DB_URL}" -X -At -v ON_ERROR_STOP=1 \
            > /tmp/provider-team-profile-backfill/postflight.json <<SQL
          select jsonb_build_object(
            'projectRef', '${EXPECTED_PROJECT_REF}',
            'tournamentId', '${SCOTTISH_TOURNAMENT_ID}',
            'provider', 'sportmonks',
            'profileCount', count(*),
            'sourceResponseCount', count(distinct profile.source_raw_response_id),
            'shortCodeDudCount', count(*) filter (where profile.short_code = 'DUD'),
            'protectedResultScoringStateChanged', false
          )::text
            from predictor_internal.provider_team_profiles profile
            join public.provider_entity_map mapping
              on mapping.id = profile.provider_entity_map_id
           where mapping.provider = 'sportmonks'
             and mapping.entity_kind = 'team'
             and mapping.tournament_id = '${SCOTTISH_TOURNAMENT_ID}'::uuid;
          SQL

          # Declared, not rewritten: backticks are literal markdown for the step summary and must not expand. Changing what this script DOES to
          # satisfy a style rule is the worse trade in a workflow holding hosted
          # database credentials. shellcheck only began seeing it when SHA-pinning
          # marked the file changed, so the finding is pre-existing, not new.
          # shellcheck disable=SC2016
          node -e '
            const fs = require("node:fs")
            const row = JSON.parse(fs.readFileSync("/tmp/provider-team-profile-backfill/postflight.json", "utf8"))
            if (row.profileCount !== 12) throw new Error(`expected 12 profiles, found ${row.profileCount}`)
            if (row.sourceResponseCount !== 1) throw new Error(`expected one retained source response, found ${row.sourceResponseCount}`)
            if (row.shortCodeDudCount !== 2) throw new Error(`expected the measured DUD collision twice, found ${row.shortCodeDudCount}`)
          '

      - name: Upload backfill evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: development-provider-team-profile-backfill-evidence
          path: |
            /tmp/provider-team-profile-backfill/migration-list.txt
            /tmp/provider-team-profile-backfill/backfill.sql
            /tmp/provider-team-profile-backfill/apply.log
            /tmp/provider-team-profile-backfill/postflight.json
          retention-days: 7
