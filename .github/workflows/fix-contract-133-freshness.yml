name: One-shot Contract 133 freshness repair

on:
  push:
    branches:
      - feature/contract-133-private-championship-restack
    paths:
      - .github/workflows/fix-contract-133-freshness.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/contract-133-private-championship-restack
          fetch-depth: 0
      - name: Repair stale development-contract parser and remove helper
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tests/scripts/documentationContractFreshness.test.ts')
          text = path.read_text()
          old = r'/Development Supabase is hosted at \*\*(\d+)\*\*/'
          new = r'/Development Supabase(?: is| and Production Supabase are both) hosted at \*\*(\d+)\*\*/'
          count = text.count(old)
          if count != 2:
              raise SystemExit(f'expected 2 stale parser occurrences, found {count}')
          path.write_text(text.replace(old, new))
          PY
          git rm .github/workflows/fix-contract-133-freshness.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/scripts/documentationContractFreshness.test.ts
          git commit -m "test: accept combined hosted contract wording"
          git push origin HEAD:feature/contract-133-private-championship-restack
