name: Temporary Contract 134 status wording repair

on:
  push:
    branches:
      - agent/euro-002-publication-state-contract-134
    paths:
      - .github/workflows/temp-contract-134-status-wording.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/euro-002-publication-state-contract-134
      - name: Restore canonical live-status wording
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/quality/current-status.md')
          text = p.read_text()
          old = 'The repository candidate is **134**. Development Supabase and Production Supabase are recorded here at **132** pending the separately queued hosted-authority reconciliation; Contract 134 remains repository-only and has not been applied to either hosted environment.'
          new = 'The repository candidate is **134**. Development Supabase and Production Supabase are both hosted at **132** in the current machine authority pending the separately queued hosted-authority reconciliation; fresh read-only verification outside this candidate has observed Development at 133. Contract 134 remains repository-only and has not been applied to either hosted environment.'
          if text.count(old) != 1:
              raise SystemExit('expected current-status wording exactly once')
          p.write_text(text.replace(old, new))
          PY
          rm .github/workflows/temp-contract-134-status-wording.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/quality/current-status.md .github/workflows/temp-contract-134-status-wording.yml
          git commit -m "fix: restore canonical hosted-status wording"
          git push origin HEAD:agent/euro-002-publication-state-contract-134
