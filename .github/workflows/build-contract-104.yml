name: Build Contract 104 caller migration

on:
  push:
    branches:
      - agent/contract-104-live-competition-callers

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/contract-104-live-competition-callers

      - name: Build migration, proofs and authorities
        run: python scripts/build-contract-104-once.py

      - name: Commit Contract 104
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add config/deployment-contract.json docs/ops/ops-pending-migrations.md docs/quality/current-status.md e2e/seed-contract.ts supabase/migrations/20260805001000_live_competition_callers.sql supabase/tests/155_live_competition_callers.sql tests/database-parity/liveCompetitionCallerBoundary.test.ts
          git diff --cached --check
          git commit -m 'Contract 104: resolve live competition callers'
          git push origin HEAD:agent/contract-104-live-competition-callers
