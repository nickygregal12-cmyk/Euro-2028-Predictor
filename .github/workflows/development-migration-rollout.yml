name: Development migration rollout

# The guarded development lane, taking its boundary as INPUT rather than being
# pinned to one contract. ADR 0024's other half: the fast lane carries additive
# migrations, and everything the fast lane refuses comes here.
#
# WHY THIS EXISTS, which is a gap that stayed open for a long time because the
# error message hid it. `check-migration-additive.mjs` refuses a destructive
# migration and says to use `stage-c1-development-rollout.yml` "which keeps the
# backup and rehearsal". That workflow is a SPENT ONE-SHOT pinned to contract
# 65: it refuses everything else by name, which is what it did on run
# 31472268116. Its name reads general and it is not, so for months a destructive
# development migration had no runnable lane at all and the checker pointed at a
# door that was bricked up. Contract 158 got its own pinned lane because
# inventing a general one while landing a security contract is two risks where
# one will do; this is that generalisation, done on its own.
#
# THE HARD PART OF GENERALISING is that the pin WAS the safety. A workflow that
# names one migration cannot apply the wrong one. Take the pin out and the
# question becomes: what stops somebody applying a boundary they did not mean,
# or applying something destructive without noticing? Three things, all
# mechanical, none of them trust:
#
#   1. The boundary is named by FILENAME, not by a number. `158` is a typo away
#      from `159`; `20260811000000_invite_code_hardening.sql` is not. The
#      workflow resolves the row from the name and refuses a name that is not
#      in the tree exactly once.
#   2. The dispatcher states where Development is EXPECTED to be, and the lane
#      proves it against the live database before applying. A stale belief about
#      the source boundary is the failure that took the first 151-to-157
#      rehearsal down, and it is worth catching here too.
#   3. A destructive batch requires an acknowledgement that quotes the target
#      filename back. A generic "yes" is a box to tick; retyping the thing you
#      are about to drop is reading it.
#
# NO ENCRYPTED BACKUP, DELIBERATELY, and this is ADR 0024's reasoning rather
# than an omission. Development data is disposable — that premise is what the
# whole fast lane rests on. What the fast lane's refusal actually protects is
# applying something destructive WITHOUT NOTICING, so this lane keeps every part
# of the noticing and drops the ceremony that exists for Production's
# irreplaceable rows. Production has no general lane and never will: each
# Production boundary gets its own reviewed, pinned pair with a real backup and
# a Production-shaped rehearsal.
#
# It applies and deliberately does NOT verify. A job reporting on its own write
# is not independent evidence, which is why every hosted claim in this
# repository comes from a separate read-only query.

on:
  workflow_dispatch:
    inputs:
      project_ref:
        description: Exact Development project ref confirmation
        required: true
      confirmation:
        description: Type APPLY-DEVELOPMENT-MIGRATION to proceed
        required: true
      target_migration:
        description: >-
          Exact filename of the LAST migration to apply, e.g.
          20260811000000_invite_code_hardening.sql. Anything above it is held
          back and is not applied.
        required: true
      expected_source_contract:
        description: >-
          The contract Development is expected to hold right now. The lane
          proves this against the live database and refuses if it differs.
        required: true
      destructive_acknowledgement:
        description: >-
          Required ONLY when the batch is destructive. Type
          ACKNOWLEDGE-DESTRUCTIVE-<target_migration> to proceed.
        required: false

permissions:
  contents: read

concurrency:
  group: development-migration-rollout
  cancel-in-progress: false

env:
  EXPECTED_PROJECT_REF: iouzoutneyjpugbbtdem
  FORBIDDEN_PRODUCTION_REF: vkfnsqdyhvtwyqkisxhk
  CONFIRMATION_PHRASE: APPLY-DEVELOPMENT-MIGRATION
  WORK_DIR: /tmp/development-migration-rollout

jobs:
  rollout:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Refuse an unsafe dispatch or repository state
        env:
          INPUT_PROJECT_REF: ${{ inputs.project_ref }}
          INPUT_CONFIRMATION: ${{ inputs.confirmation }}
        shell: bash
        run: |
          set -euo pipefail
          [ "${INPUT_CONFIRMATION}" = "${CONFIRMATION_PHRASE}" ] || {
            echo "ERROR: confirmation phrase does not match ${CONFIRMATION_PHRASE}."
            exit 1
          }
          # Production is refused by name BEFORE the development ref is checked,
          # so the refusal names the mistake rather than reporting a mismatch.
          # Production has no general lane and never will.
          if [ "${INPUT_PROJECT_REF}" = "${FORBIDDEN_PRODUCTION_REF}" ]; then
            echo 'ERROR: this is the development lane. Production has no general lane:'
            echo 'each Production boundary gets its own pinned pair with a backup and rehearsal.'
            exit 1
          fi
          [ "${INPUT_PROJECT_REF}" = "${EXPECTED_PROJECT_REF}" ] || {
            echo "ERROR: only development project ${EXPECTED_PROJECT_REF} is permitted."
            exit 1
          }
          [ "${GITHUB_REF}" = 'refs/heads/main' ] || {
            echo 'ERROR: this workflow runs only from refs/heads/main.'
            exit 1
          }
          git fetch --no-tags origin main
          [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" ] || {
            echo 'ERROR: checked-out HEAD is not exact origin/main.'
            exit 1
          }
          [ -z "$(git status --porcelain=v1 --untracked-files=all)" ] || {
            echo 'ERROR: checkout is not clean.'
            exit 1
          }

      - name: Resolve the batch from the named boundary
        env:
          INPUT_TARGET_MIGRATION: ${{ inputs.target_migration }}
          INPUT_EXPECTED_SOURCE: ${{ inputs.expected_source_contract }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${WORK_DIR}"

          case "${INPUT_EXPECTED_SOURCE}" in
            ''|*[!0-9]*)
              echo 'ERROR: expected_source_contract must be a whole number.'
              exit 1
              ;;
          esac

          git ls-files 'supabase/migrations/*.sql' | sort > "${WORK_DIR}/all.txt"

          # Named by filename rather than by row number, and required to appear
          # EXACTLY once: a duplicate basename would make "the boundary"
          # ambiguous, which is precisely the state two concurrent branches
          # produced when both claimed contract 152.
          matches="$(grep -c "/${INPUT_TARGET_MIGRATION}\$" "${WORK_DIR}/all.txt" || true)"
          [ "${matches}" = '1' ] || {
            echo "ERROR: ${INPUT_TARGET_MIGRATION} appears ${matches} times in the migration tree; expected exactly 1."
            exit 1
          }

          target_row="$(grep -n "/${INPUT_TARGET_MIGRATION}\$" "${WORK_DIR}/all.txt" | cut -d: -f1)"
          total="$(wc -l < "${WORK_DIR}/all.txt" | tr -d ' ')"
          source_row="${INPUT_EXPECTED_SOURCE}"

          [ "${target_row}" -gt "${source_row}" ] || {
            echo "ERROR: ${INPUT_TARGET_MIGRATION} is row ${target_row}, which is not above the stated source ${source_row}."
            echo 'This lane only moves forward. It never rolls back and never re-applies.'
            exit 1
          }

          sed -n "$((source_row + 1)),${target_row}p" "${WORK_DIR}/all.txt" > "${WORK_DIR}/batch.txt"
          target_version="${INPUT_TARGET_MIGRATION:0:14}"

          {
            echo "TARGET_ROW=${target_row}"
            echo "SOURCE_ROW=${source_row}"
            echo "TARGET_VERSION=${target_version}"
            echo "REPOSITORY_TOTAL=${total}"
          } >> "${GITHUB_ENV}"

          echo "Repository holds ${total} migrations."
          echo "Applying rows $((source_row + 1)) to ${target_row}:"
          cat "${WORK_DIR}/batch.txt"
          if [ "${total}" -gt "${target_row}" ]; then
            echo "Held back as ABOVE the named boundary, NOT applied by this run:"
            sed -n "$((target_row + 1)),${total}p" "${WORK_DIR}/all.txt"
          fi

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.2

      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1
        with:
          version: 2.84.2

      - name: Report what the additive checker says, and gate on it being acknowledged
        env:
          INPUT_TARGET_MIGRATION: ${{ inputs.target_migration }}
          INPUT_DESTRUCTIVE_ACK: ${{ inputs.destructive_acknowledgement }}
        shell: bash
        run: |
          set -euo pipefail
          # A REPORT, never a gate that silently passes. Carrying a destructive
          # migration is this lane's whole purpose, so the checker refusing is
          # an expected outcome — but it must be an outcome somebody SAW.
          if node scripts/check-migration-additive.mjs $(tr '\n' ' ' < "${WORK_DIR}/batch.txt") \
              > "${WORK_DIR}/additive.txt" 2>&1; then
            cat "${WORK_DIR}/additive.txt"
            echo 'This batch is additive. It could also have taken the fast lane.'
            if [ -n "${INPUT_DESTRUCTIVE_ACK}" ]; then
              echo 'NOTE: a destructive acknowledgement was supplied and was not needed.'
            fi
            exit 0
          fi

          echo 'This batch is DESTRUCTIVE. The checker said:'
          cat "${WORK_DIR}/additive.txt"
          echo

          required="ACKNOWLEDGE-DESTRUCTIVE-${INPUT_TARGET_MIGRATION}"
          [ "${INPUT_DESTRUCTIVE_ACK}" = "${required}" ] || {
            echo 'ERROR: a destructive batch needs an explicit acknowledgement.'
            echo "Re-dispatch with destructive_acknowledgement set to exactly:"
            echo "  ${required}"
            echo
            echo 'Retyping the filename is the point. A generic confirmation is a box'
            echo 'to tick; quoting back the migration you are about to apply is reading it.'
            exit 1
          }
          echo "Destructive batch acknowledged as ${required}."

      - name: Preflight the Development secret without printing it
        env:
          SUPABASE_DEV_DB_URL: ${{ secrets.SUPABASE_DEV_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${SUPABASE_DEV_DB_URL}" ] || {
            echo 'ERROR: repository secret SUPABASE_DEV_DB_URL is not set.'
            exit 1
          }
          # The dispatcher types a ref, but the SECRET is what the push uses. A
          # correct input with a misconfigured secret would otherwise write to
          # whatever the secret happens to name.
          case "${SUPABASE_DEV_DB_URL}" in
            *"${FORBIDDEN_PRODUCTION_REF}"*)
              echo 'ERROR: the development secret resolves to the production project.'
              exit 1
              ;;
            *"${EXPECTED_PROJECT_REF}"*) ;;
            *)
              echo 'ERROR: the development secret names neither known project.'
              exit 1
              ;;
          esac

      - name: Prove the live source is exactly the stated contract
        env:
          SUPABASE_DEV_DB_URL: ${{ secrets.SUPABASE_DEV_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          count="$(supabase migration list --db-url "${SUPABASE_DEV_DB_URL}" 2>&1 \
            | awk -F'|' '$2 ~ /[0-9]/ { v = $2; gsub(/[^0-9]/, "", v); if (length(v) == 14) print v }' \
            | wc -l | tr -d ' ')"
          echo "Development currently holds ${count} applied migrations."
          [ "${count}" = "${SOURCE_ROW}" ] || {
            echo "ERROR: Development is at ${count}, not the stated ${SOURCE_ROW}."
            echo 'The batch was resolved from the stated source, so applying it now would'
            echo 'either skip a migration or re-apply one. Restate the source and re-dispatch.'
            exit 1
          }

      - name: Hold back anything above the boundary, then dry run
        env:
          SUPABASE_DEV_DB_URL: ${{ secrets.SUPABASE_DEV_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${WORK_DIR}/later-migrations"
          : > "${WORK_DIR}/moved-files.txt"
          for file in $(cat "${WORK_DIR}/all.txt"); do
            filename="$(basename "${file}")"
            version="${filename:0:14}"
            if [[ "${version}" > "${TARGET_VERSION}" ]]; then
              mv "${file}" "${WORK_DIR}/later-migrations/${filename}"
              printf '%s\n' "${file}" >> "${WORK_DIR}/moved-files.txt"
            fi
          done

          supabase db push --db-url "${SUPABASE_DEV_DB_URL}" --dry-run \
            > "${WORK_DIR}/dry-run.txt" 2>&1
          cat "${WORK_DIR}/dry-run.txt"

          grep -oE '[0-9]{14}_[A-Za-z0-9_-]+\.sql' "${WORK_DIR}/dry-run.txt" \
            | awk '!seen[$0]++' > "${WORK_DIR}/pending.txt"
          xargs -n1 basename < "${WORK_DIR}/batch.txt" > "${WORK_DIR}/expected.txt"

          # The dry run is the last word, not the resolved batch: it is what the
          # CLI will actually push. If the two disagree, the disagreement is the
          # finding and nothing is applied.
          diff -u "${WORK_DIR}/expected.txt" "${WORK_DIR}/pending.txt" || {
            echo 'ERROR: the dry run is not exactly the resolved batch.'
            exit 1
          }

      - name: Apply the batch
        env:
          SUPABASE_DEV_DB_URL: ${{ secrets.SUPABASE_DEV_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          supabase db push --db-url "${SUPABASE_DEV_DB_URL}" 2>&1 | tee "${WORK_DIR}/apply.txt"

      - name: Restore the repository migration tree in the runner
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "${WORK_DIR}/moved-files.txt" ]; then
            while IFS= read -r file; do
              [ -n "${file}" ] || continue
              filename="$(basename "${file}")"
              if [ -e "${WORK_DIR}/later-migrations/${filename}" ]; then
                mv "${WORK_DIR}/later-migrations/${filename}" "${file}"
              fi
            done < "${WORK_DIR}/moved-files.txt"
          fi

      - name: Say what to verify, rather than claiming it here
        if: success()
        env:
          INPUT_TARGET_MIGRATION: ${{ inputs.target_migration }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Development applied rows $((SOURCE_ROW + 1)) to ${TARGET_ROW}"
            echo
            echo "Boundary: \`${INPUT_TARGET_MIGRATION}\`"
            echo
            echo 'Applied:'
            echo
            sed 's/^/- `/; s/$/`/' "${WORK_DIR}/expected.txt"
            echo
            echo 'This job applied the migrations. It does NOT verify them — a job'
            echo 'reporting on its own write is not independent evidence, which is why'
            echo 'every hosted claim in this repository comes from a separate read-only'
            echo 'query. Confirm before recording anything:'
            echo
            echo "- the ledger holds ${TARGET_ROW} rows ending \`${INPUT_TARGET_MIGRATION%.sql}\`;"
            echo '- whatever each migration claims to change is true on the target;'
            echo '- nothing the batch was not supposed to touch has moved.'
            echo
            echo 'Then update `config/development-hosted-contract.json` from that query,'
            echo 'not from this summary.'
          } >> "${GITHUB_STEP_SUMMARY}"
