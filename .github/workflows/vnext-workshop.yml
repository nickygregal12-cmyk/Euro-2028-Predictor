name: vNext workshop browser checks

# THE ONE CHECK jsdom CANNOT DO FOR vNext.
#
# The vNext frame's whole claim is that a 375px shell inside a wide desktop
# browser reviews as a phone. Container queries keep that claim and jsdom
# evaluates none of them, so every Vitest guard on this lane reads the
# stylesheet and reasons about it. This workflow opens the five workshop widths
# in Chromium and asserts the composition each one actually produces.
#
# Storybook is the server, not the application: vNext is deliberately
# unreachable from `src/main.tsx`, so the app build contains none of the code
# under test here.
#
# No screenshots, so no baselines and no runner-specific images. The frame
# suite asserts structure — regions, column counts, sticky behaviour,
# horizontal overflow — which is what has to survive a redesign on top of it.
#
# The concept suite runs beside it and asserts LESS on purpose: the three Home
# concepts exist to be compared and then mostly discarded, so it checks only
# what is true of any acceptable concept — no sideways overflow, one real
# navigation, 44px targets, and a desktop composition that is not the phone
# stretched — and never their markup.

on:
  # Scoped to what can move the frame. The workshop is not on any application
  # route, so an application-only change cannot break it.
  pull_request:
    paths:
      - 'src/vnext/**'
      - '.storybook/**'
      # A GLOB RATHER THAN A LIST, because the list was already one spec short:
      # `e2e/vnext-predictor.spec.ts` landed in Stage 7 and was never added
      # here, so a change to it alone did not run the workshop that owns it.
      # Stage 7.5 adds a fourth, and a list that has to be edited for every new
      # spec is a list that will be one short again.
      - 'e2e/vnext-*.spec.ts'
      - 'playwright.vnext.config.ts'
      - 'package-lock.json'
      - '.github/workflows/vnext-workshop.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  layout:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Measure the workshop frames and the Home concepts
        run: npm run test:e2e:vnext

      - name: Upload failure evidence
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: vnext-workshop-browser
          if-no-files-found: ignore
          retention-days: 14
          path: |
            test-results/
            playwright-report-vnext/
