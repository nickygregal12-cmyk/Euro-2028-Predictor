name: Session reconcile PR 597

on:
  push:
    branches:
      - docs/live-authority-reconciliation-20260808

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: docs/live-authority-reconciliation-20260808
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Reconcile moving authority state
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'expected text not found in {path}: {old[:100]!r}')
              p.write_text(text.replace(old, new, 1))

          replace(
              'docs/quality/current-status.md',
              'The repository candidate is **133**. Development Supabase and Production Supabase are both hosted at **132** after the verified Contract 132 rollouts; Contract 133 remains repository-only until its guarded Development rollout is applied and verified.',
              'The repository candidate is **133**. Development Supabase is hosted at **133** after Development Fast Lane run 31276698062 / #46 applied and postflight-verified `20260808003000_private_season_cup_player_reads.sql` from exact repository head `1138d0967bcff4168680980dc3352517f1e9c772`. Production Supabase remains independently hosted at **132** and was untouched by that Development rollout.'
          )
          p = Path('docs/quality/current-status.md')
          text = p.read_text()
          text, n = re.subn(r'Development Supabase is hosted at \*\*131\*\*', 'Development Supabase was hosted at **131**', text)
          if n < 1:
              raise SystemExit('expected at least one stale Development-131 present-tense statement')
          p.write_text(text)

          p = Path('docs/ops/ops-pending-migrations.md')
          text = p.read_text()
          text, n = re.subn(
              r'^\| Development Supabase `iouzoutneyjpugbbtdem` \| \*\*132\*\* \| Independent read-only ledger verification on 8 August 2026 ends at `20260807210812_provider_initial_fixture_approval`\. \| ONE BEHIND CONTRACT-133 REPOSITORY CANDIDATE \|$',
              '| Development Supabase `iouzoutneyjpugbbtdem` | **133** | Development Fast Lane run `31276698062` / #46 from exact `main` `1138d0967bcff4168680980dc3352517f1e9c772` proved the sole pending migration additive, applied `20260808003000_private_season_cup_player_reads.sql`, and postflight confirmed Contract 133; independent read-only verification confirmed the ledger tip. | LEVEL WITH CONTRACT-133 REPOSITORY CANDIDATE |',
              text,
              count=1,
              flags=re.M,
          )
          if n != 1:
              raise SystemExit('Development inventory row not found exactly once')
          text = text.replace(
              '| Netlify `euro28predictor` non-production contexts | **132 hosted declaration** | Direct Netlify read on 8 August 2026: `dev`, `branch-deploy` and `deploy-preview` point to Development, each declare 132, and Team SSO protects all contexts. `dev-server` remains blank and fails closed. | LEVEL WITH HOSTED DEVELOPMENT; ONE MIGRATION BEHIND THE CONTRACT-133 REPOSITORY CANDIDATE |',
              '| Netlify `euro28predictor` non-production contexts | **132 hosted declaration** | Direct Netlify read on 8 August 2026: `dev`, `branch-deploy` and `deploy-preview` point to Development, each declare 132, and Team SSO protects all contexts. `dev-server` remains blank and fails closed. A declaration may intentionally trail its hosted database but must never lead it. | TRAILS HOSTED DEVELOPMENT 133 BY ONE; VALID UNDER THE GUARDED TRAILING-DECLARATION MODEL |',
              1,
          )
          p.write_text(text)

          replace(
              'docs/quality/accepted-requirements.md',
              'Accepted — partially rehearsed: real MW1 result truth and reload-persistent MW2 LMS are proven; the private Championship read contract is merged to the repository but still awaits hosted Development rollout, so lock-consistent MW1 points evidence and the real signed-in seeded Championship journey remain incomplete',
              'Accepted — partially rehearsed: real MW1 result truth and reload-persistent MW2 LMS are proven; Contract 133 is now applied and persistently verifies the seeded private Championship discovery/opponent/fixtures/phase/table/privacy boundary. Lock-consistent MW1 points evidence, the later ordinary MW2 Match Predictor points feed, and the real Team-SSO-protected signed-in desktop/phone Championship journey remain incomplete'
          )

          replace(
              'docs/design/ui-modernisation-execution.md',
              '9. **Scottish Predictor Championship begins at Matchweek 2** (`DFA-007`) — **next critical Alpha proof**: the private read contract is merged to the repository; promote it through the guarded Development lane, then verify the signed-in #593 opponent/fixtures/phase/table journey and Match Predictor points feed.',
              '9. **Scottish Predictor Championship begins at Matchweek 2** (`DFA-007`) — **partial; hosted server boundary proven**: Contract 133 is applied in Development and persistently proves private instance discovery, opponent, fixtures, phase, server-ranked table and non-member privacy. PR #593 remains parked only on the exact Team-SSO-protected signed-in desktop/phone browser acceptance; ordinary Match Predictor points feed remains a separate rehearsal gap.'
          )

          replace(
              'docs/roadmap.md',
              '- `DFA-007` is partial: real Scottish Matchweek 1 result truth and reload-persistent Matchweek 2 LMS are proven. The private Championship read contract is merged to the repository, while hosted Development still trails that repository change; exact contract numbers belong only in the live status authority. PR #593 remains the signed-in Championship UI proof/merge candidate after the guarded rollout.',
              '- `DFA-007` is partial: real Scottish Matchweek 1 result truth and reload-persistent Matchweek 2 LMS are proven. The private Championship read contract is now applied and persistently verified in Development; PR #593 remains parked only on the real Team-SSO-protected signed-in desktop/phone browser acceptance. The ordinary MW1 scoring/rederivation proof and later MW2 Match Predictor points feed remain separate rehearsal gaps.'
          )

          p = Path('docs/ops/netlify-deploy-access.md')
          text = p.read_text()
          old = 'The repository test does not hard-code these numbers. It requires the three non-production documentation values to match `config/development-hosted-contract.json` and the production documentation value to match `config/production-hosted-contract.json`. A hosted database rollout therefore has one machine-backed value to reconcile into Netlify configuration rather than another permanent magic number.'
          new = 'The repository test does not hard-code these numbers. It requires the documentation records to agree about each declared Netlify value, and it proves that a declaration never leads the hosted database targeted by that context. Equality is valid and an intentional trailing declaration is valid; a leading declaration is refused. Hosted database movement therefore does not manufacture a Netlify configuration change merely to keep numbers equal.'
          if old not in text:
              raise SystemExit('Netlify runbook invariant paragraph not found')
          p.write_text(text.replace(old, new, 1))
          PY
      - name: Regenerate NOW
        run: npm run generate:now
      - name: Validate documentation reconciliation
        run: npx vitest run tests/scripts/documentationContractFreshness.test.ts
      - name: Validate generated NOW is stable
        run: |
          npm run generate:now
          git diff --exit-code -- NOW.md
      - name: Commit reconciled branch and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/session-reconcile-597.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add config/development-hosted-contract.json tests/scripts/documentationContractFreshness.test.ts docs/quality/current-status.md docs/ops/ops-pending-migrations.md docs/quality/accepted-requirements.md docs/design/ui-modernisation-execution.md docs/roadmap.md docs/ops/netlify-deploy-access.md NOW.md
          git commit -m 'docs: reconcile Development contract 133 state'
          git push origin HEAD:docs/live-authority-reconciliation-20260808
