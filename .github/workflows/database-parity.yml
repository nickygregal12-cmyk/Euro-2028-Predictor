name: Database parity

on:
  pull_request:
    paths:
      - '.github/workflows/database-parity.yml'
      - '.github/workflows/stage-c1-development-rollout.yml'
      - 'config/deployment-contract.json'
      # `liveCompetitionCallerBoundary` asserts against the development hosted
      # record, so a change to it must re-run the suite that reads it.
      - 'config/development-hosted-contract.json'
      - 'fixtures/predicted-group-order.json'
      # `liveCompetitionConflictTargets` names the published catalogue SQL.
      - 'scripts/bonus-games/**'
      - 'scripts/database-rollout/**'
      - 'scripts/ops/**'
      # Cover every shared domain sibling, including competition and future season modules.
      - 'src/domain/**'
      # `enumUnionParity` and `seasonComparisonReadsParity` read these reads to
      # compare their TypeScript unions against the database enums. Scoped to the
      # Supabase service directory rather than all of `src/services`, because that
      # is the whole of what the suites consume.
      - 'src/services/supabase/**'
      - 'supabase/**'
      - 'tests/database-parity/**'
      - 'tests/migration-transition/**'
      - 'tests/scripts/databaseParityWorkflow.test.ts'
      - 'tests/scripts/stageC1DevelopmentRolloutWorkflow.test.ts'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-supabase:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.22.2
          cache: npm

      - uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        with:
          version: 2.84.2
          github-token: ${{ github.token }}

      - name: Install application dependencies
        run: npm ci

      - name: Start disposable local Supabase
        uses: ./.github/actions/start-local-supabase

      - name: Rebuild from committed migrations
        run: supabase db reset --local

      - name: Prove provider poll rejects unauthorized requests
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl \
            --silent \
            --show-error \
            --output /tmp/provider-poll-unauthorized.json \
            --write-out '%{http_code}' \
            --request POST \
            --header 'content-type: application/json' \
            --data '{"provider":"sportmonks","path":"/fixtures"}' \
            http://127.0.0.1:54321/functions/v1/provider-poll)"
          cat /tmp/provider-poll-unauthorized.json
          test "$status" = '401'
          node --input-type=module -e '
            import { readFileSync } from "node:fs"
            const body = JSON.parse(readFileSync("/tmp/provider-poll-unauthorized.json", "utf8"))
            if (body.error !== "unauthorized") process.exit(1)
          '

      - name: Lint local database
        run: supabase db lint --local

      - name: Run pgTAP database tests
        shell: bash
        run: |
          set +e
          supabase test db --local > /tmp/pgtap.log 2>&1
          status=$?
          tail -n 220 /tmp/pgtap.log
          exit "$status"

      - name: Upload failed pgTAP diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pgtap-failure-log
          path: /tmp/pgtap.log
          retention-days: 3

      - name: Compare TypeScript and PostgreSQL outputs
        env:
          DATABASE_PARITY: '1'
          SUPABASE_DB_CONTAINER: supabase_db_euro-2028-predictor-local
        # The whole directory, never a named file. The `paths:` filter above
        # already triggers on `tests/database-parity/**`, so naming one file made
        # the job appear to cover parity while running a single subject — a new
        # parity test was triggered by, but not executed in, this job.
        run: npx vitest run tests/database-parity/

      - name: Stop and delete disposable local data
        if: always()
        run: supabase stop --no-backup

  # Zero-to-current rebuilds reach every migration with empty tables. Transition
  # subjects instead arrive at the exact prior contract with representative rows
  # already present. Each subject owns one baseline and rolls its probes back, so
  # they run explicitly after a reset to that baseline rather than as one mixed
  # directory whose tests could silently exercise the wrong schema version.
  migration-transition:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.22.2
          cache: npm

      - uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        with:
          version: 2.84.2
          github-token: ${{ github.token }}

      - name: Install application dependencies
        run: npm ci

      - name: Start disposable local Supabase
        uses: ./.github/actions/start-local-supabase

      - name: Rebuild to canonical contract 64
        run: supabase db reset --local --version 20260730180000

      - name: Rehearse populated contract 64 to 65 Stage C1 transition
        env:
          DATABASE_PARITY: '1'
          SUPABASE_DB_CONTAINER: supabase_db_euro-2028-predictor-local
        run: npx vitest run tests/migration-transition/stageC1AuditScopeTransition.test.ts

      - name: Rebuild to canonical contract 65
        run: supabase db reset --local --version 20260730235602

      - name: Rehearse populated contract 65 to 66 C1b transition
        env:
          DATABASE_PARITY: '1'
          SUPABASE_DB_CONTAINER: supabase_db_euro-2028-predictor-local
        run: npx vitest run tests/migration-transition/c1bGameCatalogueMembershipsTransition.test.ts

      - name: Stop and delete disposable local data
        if: always()
        run: supabase stop --no-backup
