name: Database parity

on:
  pull_request:
    paths:
      - '.github/workflows/database-parity.yml'
      - 'config/deployment-contract.json'
      - 'fixtures/predicted-group-order.json'
      - 'scripts/database-rollout/**'
      - 'src/domain/tournament/**'
      - 'supabase/**'
      - 'tests/database-parity/**'
      - 'tests/scripts/databaseParityWorkflow.test.ts'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-supabase:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm

      - uses: supabase/setup-cli@v2
        with:
          version: 2.84.2
          github-token: ${{ github.token }}

      - name: Install application dependencies
        run: npm ci

      - name: Start disposable local Supabase
        run: supabase start

      - name: Rebuild from committed migrations
        run: supabase db reset --local

      - name: Lint local database
        run: supabase db lint --local

      - name: Run pgTAP database tests
        shell: bash
        run: |
          set +e
          supabase test db --local > /tmp/pgtap.log 2>&1
          status=$?
          tail -n 220 /tmp/pgtap.log
          exit "$status"

      - name: Upload failed pgTAP diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pgtap-failure-log
          path: /tmp/pgtap.log
          retention-days: 3

      - name: Compare TypeScript and PostgreSQL outputs
        env:
          DATABASE_PARITY: '1'
          SUPABASE_DB_CONTAINER: supabase_db_euro-2028-predictor-local
        run: npx vitest run tests/database-parity/predictedGroupOrderParity.test.ts

      - name: Stop and delete disposable local data
        if: always()
        run: supabase stop --no-backup


  production-contract-promotion:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref_name == 'agent/production-contract-38-dry-run' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      EXPECTED_PROJECT_REF: vkfnsqdyhvtwyqkisxhk

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v2
        with:
          version: 2.109.1
          github-token: ${{ github.token }}

      - name: Reverify and apply production contract 38
        shell: bash
        env:
          SUPABASE_PROD_DB_URL: ${{ secrets.SUPABASE_PROD_DB_URL }}
        run: |
          set -euo pipefail
          [ -n "${SUPABASE_PROD_DB_URL}" ] || {
            echo 'ERROR: SUPABASE_PROD_DB_URL is not configured.'
            exit 1
          }
          case "${SUPABASE_PROD_DB_URL}" in
            *"${EXPECTED_PROJECT_REF}"*) ;;
            *)
              echo "ERROR: production URL does not reference ${EXPECTED_PROJECT_REF}."
              exit 1
              ;;
          esac

          supabase db push \
            --db-url "${SUPABASE_PROD_DB_URL}" \
            --dry-run 2>&1 | tee /tmp/production-contract-38-dry-run.txt

          mapfile -t pending < <(grep -oE '[0-9]{14}_[A-Za-z0-9_]+\.sql' /tmp/production-contract-38-dry-run.txt | awk '!seen[$0]++')
          [ "${#pending[@]}" -eq 2 ]
          [ "${pending[0]}" = '20260727075922_admin_result_authorization.sql' ]
          [ "${pending[1]}" = '20260727080159_admin_result_revision_timestamp.sql' ]

          supabase db push --db-url "${SUPABASE_PROD_DB_URL}"

          {
            echo '## Production contract 38 promotion'
            echo ''
            echo 'Dry-run reverified exactly migrations 37 and 38, then the production push completed.'
            echo ''
            echo '```text'
            cat /tmp/production-contract-38-dry-run.txt
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
