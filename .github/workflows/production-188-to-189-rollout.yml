name: Production 188 to 189 rollout

# One-shot guarded promotion of the Production contract boundary 188 -> 189.
#
# WHY THIS BOUNDARY EXISTS AND WHY IT IS TIME-BOUND. Contract 188 quarantined 37
# Production forecasts built on a broken provider identity, and declared that
# every evidence path reads `ai.valid_predictions`. Measured against the
# INSTALLED Production definitions, seven admin reads did not: four selected
# from `ai.predictions`, and `admin_ai_betting_dashboard`,
# `admin_ai_evidence_by_market` and `admin_ai_betting_gate_status` counted
# `ai.bets`/`ai.bet_results` unfiltered — the publication gate joining `ai.bets`
# not at all, so the settled-bet count and mean CLV that decide whether a
# betting record may be shown came from every bet ever recorded. Nothing is
# wrong on screen today ONLY because `ai.prediction_results` holds zero rows,
# every quarantined forecast being still upcoming. The earliest kicks off at
# 2026-08-14T19:00Z, and 35 of the 49 recorded bets already point at a
# quarantined forecast.
#
# THE BOUNDARY IS EXACTLY ONE ADDITIVE MIGRATION, so
# `check-migration-additive.mjs` runs here as a GATE rather than as the report
# the destructive 157 -> 158 promotion needed. The dry run asserts that one file
# BY NAME and refuses a second: "at least the one I expected" would pass while
# promoting something nobody approved, and a parallel AI Lab session is working
# in this repository.
#
# THE VERIFICATION IS A COMPARISON, NOT A CHECKLIST. The same admin reads are
# called on live Production before and after, and the quarantined forecasts must
# LEAVE them — by invalidated prediction id rather than by row count — while
# every underlying count stays identical. A migration that filtered nothing, or
# that deleted rows to make a dashboard tidy, fails here rather than being
# discovered later.
#
# WHAT THIS DOES NOT DO:
#
#   * it makes ZERO provider requests, and `ai.api_usage` must not move;
#   * it does NOT disable paid odds collection. Collection was restored on
#     13 August 2026 after contract 188's repair, this change alters admin
#     evidence reads rather than provider custody, and switching it off for an
#     unrelated promotion would be a production change nobody asked for. The
#     flag is asserted UNCHANGED across the apply, in whichever state it is in;
#   * it changes NO cron schedule — the total and the four `ai-odds-*` jobs are
#     asserted unchanged;
#   * it writes, edits or deletes NO prediction, bet, result, recommendation or
#     invalidation. All 37 quarantined forecasts and all 49 bets remain;
#   * it publishes no Euro 2028, launches no competition, imports no football
#     and promotes no application.
#
# Remove this one-shot workflow after the hosted contract record is reconciled.

on:
  workflow_dispatch:
    inputs:
      project_ref:
        description: Exact Production project ref confirmation
        required: true
      confirmation:
        description: Type APPLY-PRODUCTION-188-TO-189 to proceed
        required: true
      backup_run_id:
        description: Run id of the successful FRESH Production backup
        required: true
      rehearsal_run_id:
        description: Run id of the successful 188-to-189 rehearsal
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: production-migration-rollout
  cancel-in-progress: false

env:
  EXPECTED_PROJECT_REF: vkfnsqdyhvtwyqkisxhk
  FORBIDDEN_DEVELOPMENT_REF: iouzoutneyjpugbbtdem
  CONFIRMATION_PHRASE: APPLY-PRODUCTION-188-TO-189
  SOURCE_CONTRACT: '188'
  SOURCE_VERSION: '20260813100000'
  SOURCE_NAME: ai_lab_multi_model_evidence
  TARGET_CONTRACT: '189'
  TARGET_VERSION: '20260813215920'
  TARGET_NAME: ai_quarantined_evidence_reads
  WORK_DIR: /tmp/production-188-to-189

jobs:
  rollout:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Refuse an unsafe dispatch or repository state
        env:
          INPUT_PROJECT_REF: ${{ inputs.project_ref }}
          INPUT_CONFIRMATION: ${{ inputs.confirmation }}
        shell: bash
        run: |
          set -euo pipefail
          [ "${INPUT_CONFIRMATION}" = "${CONFIRMATION_PHRASE}" ] || {
            echo "ERROR: confirmation phrase does not match ${CONFIRMATION_PHRASE}."
            exit 1
          }
          if [ "${INPUT_PROJECT_REF}" = "${FORBIDDEN_DEVELOPMENT_REF}" ]; then
            echo 'ERROR: that is the Development project.'
            exit 1
          fi
          [ "${INPUT_PROJECT_REF}" = "${EXPECTED_PROJECT_REF}" ] || {
            echo 'ERROR: project ref confirmation does not name the Production project.'
            exit 1
          }
          [ "${GITHUB_REF}" = 'refs/heads/main' ] || {
            echo 'ERROR: Production rollout runs only from refs/heads/main.'
            exit 1
          }
          git fetch --no-tags origin main
          [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" ] || {
            echo 'ERROR: checked-out HEAD is not exact origin/main.'
            exit 1
          }
          [ -z "$(git status --porcelain=v1 --untracked-files=all)" ] || {
            echo 'ERROR: checkout is not clean.'
            exit 1
          }
          mkdir -p "${WORK_DIR}"

      - name: Prove a successful backup and rehearsal exist, in that order
        env:
          GH_TOKEN: ${{ github.token }}
          BACKUP_RUN_ID: ${{ inputs.backup_run_id }}
          REHEARSAL_RUN_ID: ${{ inputs.rehearsal_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          # Checked against the API rather than asserted by whoever dispatched
          # this. "Take a backup first" is a rule that survives exactly as long
          # as the person in a hurry remembers it; every other guard here is
          # mechanical, so these are as well.
          check_run() {
            local run_id="$1" want_workflow="$2" label="$3"
            local json conclusion path head_sha
            json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}")"
            conclusion="$(printf '%s' "${json}" | jq -r '.conclusion')"
            path="$(printf '%s' "${json}" | jq -r '.path')"
            head_sha="$(printf '%s' "${json}" | jq -r '.head_sha')"
            [ "${conclusion}" = 'success' ] || {
              echo "ERROR: ${label} run ${run_id} concluded '${conclusion}', not success."
              exit 1
            }
            [ "${path}" = "${want_workflow}" ] || {
              echo "ERROR: ${label} run ${run_id} is ${path}, not ${want_workflow}."
              exit 1
            }
            echo "${label} run ${run_id} verified: success, ${path}, head ${head_sha}."
          }
          check_run "${BACKUP_RUN_ID}" \
            '.github/workflows/production-backup.yml' 'Backup'
          check_run "${REHEARSAL_RUN_ID}" \
            '.github/workflows/production-188-to-189-rehearsal.yml' 'Rehearsal'

          # The rehearsal must have been run against THIS boundary's code. A
          # rehearsal of an earlier head proves nothing about what is about to
          # be applied.
          rehearsal_sha="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${REHEARSAL_RUN_ID}" --jq '.head_sha')"
          [ "${rehearsal_sha}" = "$(git rev-parse HEAD)" ] || {
            echo "ERROR: rehearsal ran at ${rehearsal_sha}, but this rollout is at $(git rev-parse HEAD)."
            echo 'Re-rehearse at the exact head being promoted.'
            exit 1
          }
          echo 'The rehearsal ran at exactly the head being promoted.'

          # And the backup must PRECEDE the rehearsal. A backup taken after the
          # rehearsal is not the state this promotion would be rolled back to,
          # and a backup taken for an earlier boundary is not this one's.
          backup_at="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${BACKUP_RUN_ID}" --jq '.created_at')"
          rehearsal_at="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${REHEARSAL_RUN_ID}" --jq '.created_at')"
          [ "${backup_at}" \< "${rehearsal_at}" ] || {
            echo "ERROR: backup ${backup_at} does not precede rehearsal ${rehearsal_at}."
            exit 1
          }
          echo "Sequence verified: backup ${backup_at} -> rehearsal ${rehearsal_at} -> this rollout."

      - name: Prove the repository holds exactly the approved contract 189
        shell: bash
        run: |
          set -euo pipefail
          committed="$(git ls-files 'supabase/migrations/*.sql' | wc -l | tr -d ' ')"
          [ "${committed}" = "${TARGET_CONTRACT}" ] || {
            echo "ERROR: repository holds ${committed} migrations, expected ${TARGET_CONTRACT}."
            echo 'If another migration has landed on main, the approved boundary has moved.'
            exit 1
          }
          declared="$(node -p "require('./config/deployment-contract.json').requiredMigrationCount")"
          [ "${declared}" = "${TARGET_CONTRACT}" ] || {
            echo "ERROR: deployment contract declares ${declared}, expected ${TARGET_CONTRACT}."
            exit 1
          }
          newest="$(git ls-files 'supabase/migrations/*.sql' | sort | tail -1)"
          [ "$(basename "${newest}")" = "${TARGET_VERSION}_${TARGET_NAME}.sql" ] || {
            echo "ERROR: newest migration is $(basename "${newest}"), expected ${TARGET_VERSION}_${TARGET_NAME}.sql."
            exit 1
          }
          echo "Repository is exactly contract ${TARGET_CONTRACT}."


      - name: Prove the one migration in the range is additive, as a GATE
        shell: bash
        run: |
          set -euo pipefail
          files=''
          for file in $(git ls-files 'supabase/migrations/*.sql' | sort); do
            version="$(basename "${file}")"
            version="${version:0:14}"
            if [[ "${version}" > "${SOURCE_VERSION}" && ! "${version}" > "${TARGET_VERSION}" ]]; then
              files="${files} ${file}"
            fi
          done
          # Declared, not rewritten: the migration list is split on purpose; quoting passes one argument, not many. This is a spent one-shot promotion
          # script; changing what it DOES to satisfy a style rule would edit the
          # record of a past production apply. shellcheck only began seeing it
          # when SHA-pinning marked the file changed, so it is pre-existing.
          # shellcheck disable=SC2086
          count="$(printf '%s\n' ${files} | grep -c . || true)"
          [ "${count}" = "1" ] || {
            echo "ERROR: the range holds ${count} migrations, expected exactly 1."
            # Declared, not rewritten: the migration list is split on purpose; quoting passes one argument, not many. This is a spent one-shot promotion
            # script; changing what it DOES to satisfy a style rule would edit the
            # record of a past production apply. shellcheck only began seeing it
            # when SHA-pinning marked the file changed, so it is pre-existing.
            # shellcheck disable=SC2086
            printf '%s\n' ${files}
            exit 1
          }
          echo 'The one migration being promoted:'
          # Declared, not rewritten: the migration list is split on purpose; quoting passes one argument, not many. This is a spent one-shot promotion
          # script; changing what it DOES to satisfy a style rule would edit the
          # record of a past production apply. shellcheck only began seeing it
          # when SHA-pinning marked the file changed, so it is pre-existing.
          # shellcheck disable=SC2086
          printf '  %s\n' ${files}
          # Declared, not rewritten: the migration list is split on purpose; quoting passes one argument, not many. This is a spent one-shot promotion
          # script; changing what it DOES to satisfy a style rule would edit the
          # record of a past production apply. shellcheck only began seeing it
          # when SHA-pinning marked the file changed, so it is pre-existing.
          # shellcheck disable=SC2086
          node scripts/check-migration-additive.mjs ${files}
          echo 'It is additive.'


      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.2

      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520
        with:
          version: 2.109.1
          github-token: ${{ github.token }}

      - name: Install PostgreSQL 17 client tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17


      - name: Preflight the Production secret without printing it
        env:
          SUPABASE_PROD_DB_URL: ${{ secrets.SUPABASE_PROD_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${SUPABASE_PROD_DB_URL}" ] || {
            echo 'ERROR: repository secret SUPABASE_PROD_DB_URL is not set.'
            exit 1
          }
          case "${SUPABASE_PROD_DB_URL}" in
            *"${FORBIDDEN_DEVELOPMENT_REF}"*)
              echo 'ERROR: Production secret resolves to Development.'
              exit 1
              ;;
            *"${EXPECTED_PROJECT_REF}"*) ;;
            *)
              echo 'ERROR: Production secret does not name the expected Production project.'
              exit 1
              ;;
          esac


      - name: Capture the exact pre-apply Production state, through the real reads
        env:
          SUPABASE_PROD_DB_URL: ${{ secrets.SUPABASE_PROD_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          # The real admin reads, on the real quarantined data, through the same
          # competition-admin gate a browser would use. These are the numbers
          # the apply has to move.
          psql "${SUPABASE_PROD_DB_URL}" -X -q -v ON_ERROR_STOP=1 -A -t \
            -f - <<'BEFORE_SQL' | grep '^{' | tail -1 > "${WORK_DIR}/before.json"
            -- Session-level rather than transaction-local: the statement that
            -- follows is its own transaction. The output is filtered to the
            -- line that starts a JSON object, so a command tag or the echoed
            -- claim cannot end up in the file.
            select set_config('request.jwt.claims',
              '{"sub":"00000000-0000-0000-0000-000000000000","role":"authenticated","app_metadata":{"admin_role":"super_admin"}}',
              false);
            select jsonb_build_object(
              'migration_count', (select count(*) from supabase_migrations.schema_migrations),
              'latest_version', (select version from supabase_migrations.schema_migrations order by version desc limit 1),
              'latest_name', (select name from supabase_migrations.schema_migrations order by version desc limit 1),
              'cron_jobs', (select count(*) from cron.job),
              'ai_odds_cron_jobs', (select count(*) from cron.job where jobname like 'ai-odds%'),
              'upcoming_rows', jsonb_array_length(public.admin_ai_upcoming_predictions(null, 200)),
              'upcoming_invalid', (
                select count(*) from jsonb_array_elements(public.admin_ai_upcoming_predictions(null, 200)) e
                  join ai.prediction_invalidations i on i.prediction_id = (e ->> 'id')::uuid),
              'recent_rows', jsonb_array_length(public.admin_ai_recent_results(null, 200)),
              'dashboard_graded', public.admin_ai_dashboard(null) -> 'performance' ->> 'graded',
              'breakdown_n', public.admin_ai_performance_breakdown(null) -> 'overall' ->> 'n',
              'open_bets', public.admin_ai_betting_dashboard(null) -> 'open' ->> 'open_bets',
              'open_exposure', public.admin_ai_betting_dashboard(null) -> 'open' ->> 'exposure',
              'settled_bets', public.admin_ai_betting_dashboard(null) -> 'profit' ->> 'settled_bets',
              'gate_settled', public.admin_ai_betting_gate_status() -> 'settled_bets' ->> 'value',
              'predictions', (select count(*) from ai.predictions),
              'valid_predictions', (select count(*) from ai.valid_predictions),
              'invalidations', (select count(*) from ai.prediction_invalidations),
              'bets', (select count(*) from ai.bets),
              'invalid_linked_bets', (
                select count(*) from ai.bets b
                 where exists (select 1 from ai.prediction_invalidations i
                                where i.prediction_id = b.prediction_id)),
              'recommendations', (select count(*) from ai.recommendations),
              'api_usage', (select count(*) from ai.api_usage),
              'collection_enabled', (select collection_enabled from ai.api_budget limit 1),
              'auth_users', (select count(*) from auth.users),
              'entries', (select count(*) from public.entries),
              'match_predictions', (select count(*) from public.match_predictions),
              'season_predictions', (select count(*) from public.season_predictions),
              'score_events', (select count(*) from public.score_events),
              'bonus_competitions', (select count(*) from public.bonus_competitions)
            )
          BEFORE_SQL
          cat "${WORK_DIR}/before.json"

          BEFORE_FILE="${WORK_DIR}/before.json" node --input-type=module <<'NODE'
          import fs from 'node:fs'
          const before = JSON.parse(fs.readFileSync(process.env.BEFORE_FILE, 'utf8'))
          // Live Production must be exactly the boundary that was rehearsed.
          for (const [key, want] of Object.entries({
            migration_count: Number(process.env.SOURCE_CONTRACT),
            latest_version: process.env.SOURCE_VERSION,
            latest_name: process.env.SOURCE_NAME,
          })) {
            if (String(before[key]) !== String(want)) {
              console.error(`ERROR: live Production ${key} is ${before[key]}, expected ${want}.`)
              console.error('Production is not the boundary this rollout was rehearsed against.')
              process.exit(1)
            }
          }
          // And it must start from the defect, or the comparison after the
          // apply proves nothing: if no quarantined forecast reaches the
          // upcoming read, either the quarantine is gone or the boundary is
          // already closed, and both need looking at rather than applying.
          if (Number(before.upcoming_invalid) < 1) {
            console.error('ERROR: no quarantined forecast reaches the upcoming read on Production.')
            console.error('There is nothing here for contract 189 to remove; stop and find out why.')
            process.exit(1)
          }
          if (Number(before.invalid_linked_bets) < 1) {
            console.error('ERROR: no Production bet references a quarantined forecast.')
            process.exit(1)
          }
          console.log(`Before: ${before.upcoming_rows} upcoming (${before.upcoming_invalid} quarantined), ${before.open_bets} open bets, ${before.invalid_linked_bets} of them quarantine-linked.`)
          NODE


      - name: Dry run, and refuse anything that is not exactly contract 189
        env:
          SUPABASE_PROD_DB_URL: ${{ secrets.SUPABASE_PROD_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          # Anything ABOVE the pinned target is held back, so the dry run
          # describes what will actually be applied. Restored by the step after
          # the apply, whatever happens.
          mkdir -p "${WORK_DIR}/later-migrations"
          : > "${WORK_DIR}/moved-files.txt"
          for file in $(git ls-files 'supabase/migrations/*.sql' | sort); do
            filename="$(basename "${file}")"
            version="${filename:0:14}"
            if [[ "${version}" > "${TARGET_VERSION}" ]]; then
              mv "${file}" "${WORK_DIR}/later-migrations/${filename}"
              printf '%s\n' "${file}" >> "${WORK_DIR}/moved-files.txt"
            fi
          done
          if [ -s "${WORK_DIR}/moved-files.txt" ]; then
            echo 'Held back as ABOVE the pinned target:'
            cat "${WORK_DIR}/moved-files.txt"
          fi

          supabase migration list --db-url "${SUPABASE_PROD_DB_URL}" | tail -20
          supabase db push --db-url "${SUPABASE_PROD_DB_URL}" --dry-run \
            > "${WORK_DIR}/dry-run.txt" 2>&1
          cat "${WORK_DIR}/dry-run.txt"

          grep -oE '[0-9]{14}_[A-Za-z0-9_-]+\.sql' "${WORK_DIR}/dry-run.txt" \
            | awk '!seen[$0]++' | sort > "${WORK_DIR}/pending.txt"

          printf '%s\n' "${TARGET_VERSION}_${TARGET_NAME}.sql" > "${WORK_DIR}/expected.txt"

          if ! diff -u "${WORK_DIR}/expected.txt" "${WORK_DIR}/pending.txt"; then
            echo 'ERROR: the Production dry run is not exactly contract 189.'
            echo 'A second pending migration means the approved boundary has moved. STOP.'
            exit 1
          fi
          echo 'Dry run is exactly the one approved migration.'

      - name: Apply exactly contract 189
        env:
          SUPABASE_PROD_DB_URL: ${{ secrets.SUPABASE_PROD_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          supabase db push --db-url "${SUPABASE_PROD_DB_URL}" \
            2>&1 | tee "${WORK_DIR}/apply.txt"

      - name: Restore the repository migration tree in the runner
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          # Runs even when the apply failed. The verification below reads the
          # database rather than the tree.
          if [ -f "${WORK_DIR}/moved-files.txt" ]; then
            while IFS= read -r file; do
              [ -n "${file}" ] || continue
              filename="$(basename "${file}")"
              if [ -e "${WORK_DIR}/later-migrations/${filename}" ]; then
                mv "${WORK_DIR}/later-migrations/${filename}" "${file}"
              fi
            done < "${WORK_DIR}/moved-files.txt"
          fi

      - name: Verify exact contract-189 Production state, and that nothing was lost
        env:
          SUPABASE_PROD_DB_URL: ${{ secrets.SUPABASE_PROD_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          psql "${SUPABASE_PROD_DB_URL}" -X -q -v ON_ERROR_STOP=1 -A -t \
            -f - <<'AFTER_SQL' | grep '^{' | tail -1 > "${WORK_DIR}/after.json"
            select set_config('request.jwt.claims',
              '{"sub":"00000000-0000-0000-0000-000000000000","role":"authenticated","app_metadata":{"admin_role":"super_admin"}}',
              false);
            select (
              jsonb_build_object(
                'migration_count', (select count(*) from supabase_migrations.schema_migrations),
                'latest_version', (select version from supabase_migrations.schema_migrations order by version desc limit 1),
                'latest_name', (select name from supabase_migrations.schema_migrations order by version desc limit 1),
                'target_row_present', (
                  select count(*) from supabase_migrations.schema_migrations
                   where version = '20260813215920'),

                -- The new view, and that no browser role can reach it.
                'valid_bets_view', (
                  select count(*) from pg_views
                   where schemaname = 'ai' and viewname = 'valid_bets'),
                'valid_bets_browser_grants', (
                  select count(*) from information_schema.role_table_grants
                   where table_schema = 'ai' and table_name = 'valid_bets'
                     and grantee in ('anon','authenticated')),
                'valid_predictions_browser_grants', (
                  select count(*) from information_schema.role_table_grants
                   where table_schema = 'ai' and table_name = 'valid_predictions'
                     and grantee in ('anon','authenticated')),

                -- Installed definitions, not migration text. Zero admin AI read
                -- may reach the base tables; the decision log is the one stated
                -- exception and must name the quarantine to earn it.
                'reads_base_tables', (
                  select count(*) from pg_proc p join pg_namespace n on n.oid = p.pronamespace
                   where n.nspname = 'public' and p.proname like 'admin\_ai\_%'
                     and p.proname <> 'admin_ai_recommendation_log'
                     -- Line comments stripped first: a comment that NAMES a
                     -- base table while explaining why the function does not
                     -- read it is prose, not a read.
                     and (regexp_replace(pg_get_functiondef(p.oid), '--[^\n]*', '', 'g') ~ '\mai\.predictions\M'
                       or regexp_replace(pg_get_functiondef(p.oid), '--[^\n]*', '', 'g') ~ '\mai\.bets\M')),
                'prediction_reads_on_valid', (
                  select count(*) from pg_proc p join pg_namespace n on n.oid = p.pronamespace
                   where n.nspname = 'public'
                     and p.proname in ('admin_ai_dashboard','admin_ai_performance_breakdown',
                                       'admin_ai_recent_results','admin_ai_upcoming_predictions')
                     and pg_get_functiondef(p.oid) like '%ai.valid_predictions%'),
                'betting_reads_on_valid', (
                  select count(*) from pg_proc p join pg_namespace n on n.oid = p.pronamespace
                   where n.nspname = 'public'
                     and p.proname in ('admin_ai_betting_dashboard','admin_ai_evidence_by_market',
                                       'admin_ai_betting_gate_status')
                     and pg_get_functiondef(p.oid) like '%ai.valid_bets%'),
                'log_names_quarantine', (
                  select count(*) from pg_proc p join pg_namespace n on n.oid = p.pronamespace
                   where n.nspname = 'public' and p.proname = 'admin_ai_recommendation_log'
                     and pg_get_functiondef(p.oid) like '%prediction_invalidations%'),

                -- Security shape, unchanged by construction and proven anyway.
                'definer_count', (
                  select count(*) from pg_proc p join pg_namespace n on n.oid = p.pronamespace
                   where n.nspname = 'public' and p.proname like 'admin\_ai\_%'
                     and p.prosecdef
                     and exists (select 1 from unnest(p.proconfig) c where c like 'search\_path=%')),
                'admin_ai_total', (
                  select count(*) from pg_proc p join pg_namespace n on n.oid = p.pronamespace
                   where n.nspname = 'public' and p.proname like 'admin\_ai\_%'),
                'authenticated_execute', (
                  select count(*) from information_schema.role_routine_grants
                   where specific_schema = 'public' and routine_name like 'admin\_ai\_%'
                     and grantee = 'authenticated'),
                'admin_gated', (
                  select count(*) from pg_proc p join pg_namespace n on n.oid = p.pronamespace
                   where n.nspname = 'public' and p.proname like 'admin\_ai\_%'
                     and pg_get_functiondef(p.oid) like '%require_competition_admin%'),
                'anon_execute', (
                  select count(*) from information_schema.role_routine_grants
                   where specific_schema = 'public' and routine_name like 'admin\_ai\_%'
                     and grantee = 'anon')
              ) || jsonb_build_object(
                -- The eight replaced reads, called for real.
                'upcoming_rows', jsonb_array_length(public.admin_ai_upcoming_predictions(null, 200)),
                'upcoming_invalid', (
                  select count(*) from jsonb_array_elements(public.admin_ai_upcoming_predictions(null, 200)) e
                    join ai.prediction_invalidations i on i.prediction_id = (e ->> 'id')::uuid),
                'recent_rows', jsonb_array_length(public.admin_ai_recent_results(null, 200)),
                'recent_invalid', (
                  select count(*) from jsonb_array_elements(public.admin_ai_recent_results(null, 200)) e
                    join ai.prediction_invalidations i on i.prediction_id = (e ->> 'id')::uuid),
                'dashboard_graded', public.admin_ai_dashboard(null) -> 'performance' ->> 'graded',
