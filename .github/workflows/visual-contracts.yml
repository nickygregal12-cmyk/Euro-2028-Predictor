name: Visual contracts

# BOOTSTRAP FIRST, COMPARE LATER — and that ordering is why this workflow is
# dispatch-only today.
#
# Playwright compares screenshots pixel by pixel. An image rendered in a
# development container never matches one rendered on a GitHub runner: different
# kernel, different font build, different graphics stack. So baselines committed
# from anywhere other than the runner that will compare them hand CI a suite
# that fails on its first run for reasons nobody can act on, and the usual next
# step is to raise the tolerance until it passes — at which point the contract
# stops holding anything.
#
# The sequence is therefore:
#
#   1. run this workflow with `update_baselines: true`. It renders the images on
#      the runner and uploads them as an artifact. Nothing is compared;
#   2. get the PNGs under `e2e/visual-baselines/` onto the branch and review them
#      — they are the reference every later diff is judged against, so they get
#      read like code rather than accepted like output;
#   3. add `pull_request` to the triggers below. From then on the suite compares
#      every change against images produced by the same kind of machine.
#
# ALL THREE STEPS ARE DONE. `e2e/visual-baselines/` holds four images per curated
# gallery section — two widths in both themes — rendered on an `ubuntu-latest`
# runner, which is what every later comparison runs on. The count is no longer
# stated here or in the guard: `visualContractHarness` derives it from the spec's
# own SECTIONS list, because a pinned number stayed green through four sections
# being added with no baselines behind them.
# Re-render them with the two inputs below whenever a deliberate design change
# makes the current images wrong; the new ones arrive as a commit on the branch
# and are reviewed in the pull request beside the change that caused them.
#
# STEP 2 IS NOW A WORKFLOW INPUT RATHER THAN A MANUAL DOWNLOAD. `commit_baselines`
# pushes the rendered images straight to the dispatched branch, so the bootstrap
# is one action instead of a download, an unzip and a hand-made commit — three
# steps that each silently invite the wrong file. The artifact upload stays: on a
# comparison run it is the only way a failure is reviewable.
#
# It refuses to write to the default branch. Baselines are reviewed in a pull
# request like any other change to what CI enforces, and a workflow that can push
# to `main` is a workflow that will eventually push to `main` by accident.

on:
  # Scoped to what can actually move a pixel. A documentation-only pull request
  # does not need four minutes of Chromium to prove the gallery is unchanged —
  # and a filter that skipped something real would show up as a baseline that
  # never fails, which is the failure mode this suite is built to avoid.
  pull_request:
    paths:
      - 'src/**'
      - 'e2e/visual-gallery.spec.ts'
      - 'e2e/visual-baselines/**'
      - 'playwright.visual.config.ts'
      - 'package-lock.json'
      - '.github/workflows/visual-contracts.yml'
  workflow_dispatch:
    inputs:
      update_baselines:
        description: 'Render baselines on this runner and upload them, instead of comparing'
        type: boolean
        default: false
      commit_baselines:
        description: 'Push the rendered baselines to the dispatched branch (requires update_baselines; never main)'
        type: boolean
        default: false

jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: write

    steps:
      # Refuse the unsafe combinations before spending twenty minutes rendering.
      - name: Check the requested bootstrap is allowed
        if: ${{ inputs.commit_baselines }}
        run: |
          if [ "${{ inputs.update_baselines }}" != "true" ]; then
            echo "commit_baselines requires update_baselines: there is nothing new to commit." >&2
            exit 1
          fi
          if [ "${{ github.ref_name }}" = "${{ github.event.repository.default_branch }}" ]; then
            echo "Refusing to commit baselines to the default branch. Dispatch this on a branch." >&2
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Pinned explicitly, as every other workflow here does. An image is only
      # comparable to another produced by the same toolchain.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.2
          cache: 'npm'

      - name: Install application dependencies
        run: npm ci

      # The pinned browser build is part of the contract: an image is only
      # comparable to another rendered by the same engine.
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Render baselines
        if: ${{ inputs.update_baselines }}
        run: npx playwright test --config=playwright.visual.config.ts --update-snapshots

      - name: Compare against committed baselines
        if: ${{ !inputs.update_baselines }}
        run: npx playwright test --config=playwright.visual.config.ts

      # Only the images. `test-results/` and the HTML report are run output, not
      # contract, and committing them would make every later run a diff.
      - name: Commit the rendered baselines to this branch
        if: ${{ inputs.commit_baselines }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all e2e/visual-baselines
          if git diff --cached --quiet; then
            echo "Baselines are unchanged; nothing to commit."
            exit 0
          fi
          git commit -m 'Render the visual-contract baselines on the comparison runner'
          git push origin "HEAD:${{ github.ref_name }}"

      # On a bootstrap run this is the deliverable. On a comparison run it is
      # the evidence: the diff images are what make a failure reviewable rather
      # than a wall of "screenshot mismatch".
      - name: Upload baselines and diffs
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: visual-contracts
          if-no-files-found: warn
          retention-days: 30
          path: |
            e2e/visual-baselines/
            test-results/
            playwright-report-visual/
