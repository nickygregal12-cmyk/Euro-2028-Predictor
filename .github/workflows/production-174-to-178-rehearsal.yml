name: Production 174 to 178 rehearsal

# Production-SHAPED rehearsal of the contract boundary 174 -> 178.
#
# The owner authorised this Production migration on 12 August 2026, in the
# session that built contracts 175 to 178, by asking for the batch to be merged
# and then rolled out to Production. That authorisation is what this file
# records; it is not a licence the workflow grants itself and it extends to no
# other boundary.
#
# WHAT THIS REHEARSES:
#
#   * every one of contracts 175 to 178 is ADDITIVE by
#     `check-migration-additive.mjs`, so the checker runs here as a GATE rather
#     than as the report the destructive 157 -> 158 promotion needed. If a
#     future reader finds this softened back to a report, the boundary has
#     changed and this file no longer describes it;
#   * nothing in the range drops or alters a relation, a column, a policy, a
#     trigger or a grant. Five functions are created under names that did not
#     previously exist and two tables are created in `predictor_internal`;
#   * no existing function is redefined at all. That is unusual for a range
#     this size and it is asserted rather than assumed: the four verification
#     properties below each read a NEW object, and the data comparison proves
#     no row moved.
#
# THE RANGE IS FOUR FILES AND THE DRY RUN ASSERTS EXACTLY THOSE FOUR. A
# rehearsal that accepted "at least the ones I expected" would pass while
# promoting something nobody approved.
#
# THE PROPERTY MOST WORTH REHEARSING is contract 178's independence. The shadow
# scoring verifier must not name either canonical scoring function, and the
# migration refuses to install one that does — but a source assertion inside a
# migration proves what was WRITTEN. This rehearsal reads `pg_get_functiondef`
# off the restored target and proves what is INSTALLED, which is the claim that
# matters when the question is whether Production has a real control or a
# mirror that reports a green tick for ever.
#
# READ-ONLY against Production: the only Production connections here are a
# state query and dumps. Everything applied is applied to a disposable local
# target restored from those dumps.
#
# Remove this one-shot workflow after the hosted contract/evidence record has
# been reconciled.

on:
  workflow_dispatch:
    inputs:
      project_ref:
        description: Exact Production project ref confirmation
        required: true
      confirmation:
        description: Type REHEARSE-PRODUCTION-174-TO-178 to proceed
        required: true

permissions:
  contents: read

concurrency:
  group: production-174-to-178-rehearsal
  cancel-in-progress: false

env:
  EXPECTED_PROJECT_REF: vkfnsqdyhvtwyqkisxhk
  FORBIDDEN_DEVELOPMENT_REF: iouzoutneyjpugbbtdem
  CONFIRMATION_PHRASE: REHEARSE-PRODUCTION-174-TO-178
  SOURCE_CONTRACT: '174'
  SOURCE_VERSION: '20260811234000'
  SOURCE_NAME: provider_calendar_change_proposals
  TARGET_CONTRACT: '178'
  TARGET_VERSION: '20260812003000'
  TARGET_NAME: shadow_scoring_verifier
  WORK_DIR: /tmp/production-174-to-178-rehearsal
  LOCAL_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres

jobs:
  rehearse:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Refuse an unsafe dispatch or repository state
        env:
          INPUT_PROJECT_REF: ${{ inputs.project_ref }}
          INPUT_CONFIRMATION: ${{ inputs.confirmation }}
        shell: bash
        run: |
          set -euo pipefail
          [ "${INPUT_CONFIRMATION}" = "${CONFIRMATION_PHRASE}" ] || {
            echo "ERROR: confirmation phrase does not match ${CONFIRMATION_PHRASE}."
            exit 1
          }
          if [ "${INPUT_PROJECT_REF}" = "${FORBIDDEN_DEVELOPMENT_REF}" ]; then
            echo 'ERROR: that is the Development project. This rehearses the Production boundary.'
            exit 1
          fi
          [ "${INPUT_PROJECT_REF}" = "${EXPECTED_PROJECT_REF}" ] || {
            echo "ERROR: only Production project ${EXPECTED_PROJECT_REF} is permitted."
            exit 1
          }
          [ -z "$(git status --porcelain=v1 --untracked-files=all)" ] || {
            echo 'ERROR: checkout is not clean.'
            exit 1
          }
          mkdir -p "${WORK_DIR}"

      - name: Prove the repository still holds exactly the approved contract 178
        shell: bash
        run: |
          set -euo pipefail
          committed="$(git ls-files 'supabase/migrations/*.sql' | wc -l | tr -d ' ')"
          [ "${committed}" = "${TARGET_CONTRACT}" ] || {
            echo "ERROR: repository holds ${committed} migrations, expected ${TARGET_CONTRACT}."
            exit 1
          }
          declared="$(node -p "require('./config/deployment-contract.json').requiredMigrationCount")"
          [ "${declared}" = "${TARGET_CONTRACT}" ] || {
            echo "ERROR: deployment contract declares ${declared}, expected ${TARGET_CONTRACT}."
            exit 1
          }
          newest="$(git ls-files 'supabase/migrations/*.sql' | sort | tail -1)"
          [ "$(basename "${newest}")" = "${TARGET_VERSION}_${TARGET_NAME}.sql" ] || {
            echo "ERROR: newest migration is $(basename "${newest}"), expected ${TARGET_VERSION}_${TARGET_NAME}.sql."
            exit 1
          }
          echo "Repository is exactly contract ${TARGET_CONTRACT}."

      - name: Prove every migration in the range is additive, as a GATE
        shell: bash
        run: |
          set -euo pipefail
          # A GATE, not a report. The destructive 157 -> 158 promotion had to
          # run this as a report because the checker would have refused it;
          # every migration in this range is additive, so it refuses nothing
          # and a failure here means the range is not what this file says.
          files=''
          for file in $(git ls-files 'supabase/migrations/*.sql' | sort); do
            version="$(basename "${file}")"
            version="${version:0:14}"
            if [[ "${version}" > "${SOURCE_VERSION}" && ! "${version}" > "${TARGET_VERSION}" ]]; then
              files="${files} ${file}"
            fi
          done
          count="$(printf '%s\n' ${files} | grep -c . || true)"
          [ "${count}" = "4" ] || {
            echo "ERROR: the range holds ${count} migrations, expected 4."
            printf '%s\n' ${files}
            exit 1
          }
          echo 'The four migrations in the range:'
          printf '  %s\n' ${files}
          node scripts/check-migration-additive.mjs ${files}
          echo 'All four are additive.'

      # Pinned to the same versions the proven 157 -> 158 rehearsal used. The
      # first dispatch of this file omitted both and died on
      # `supabase: command not found` the moment it reached the dump, which is
      # exactly what a rehearsal is for: it failed on the runner rather than
      # part-way through a Production apply.
      - uses: actions/setup-node@v7
        with:
          node-version: 22.22.2

      - uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf
        with:
          version: 2.109.1
          github-token: ${{ github.token }}

      - name: Install PostgreSQL 17 client tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17

      - name: Preflight the Production secret without printing it
        env:
          SUPABASE_PROD_DB_URL: ${{ secrets.SUPABASE_PROD_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${SUPABASE_PROD_DB_URL}" ] || {
            echo 'ERROR: repository secret SUPABASE_PROD_DB_URL is not set.'
            exit 1
          }
          case "${SUPABASE_PROD_DB_URL}" in
            *"${FORBIDDEN_DEVELOPMENT_REF}"*)
              echo 'ERROR: Production secret resolves to Development.'
              exit 1
              ;;
            *"${EXPECTED_PROJECT_REF}"*) ;;
            *)
              echo 'ERROR: Production secret does not name the expected Production project.'
              exit 1
              ;;
          esac

      - name: Prove the live source is exactly contract 174 (read-only)
        env:
          SUPABASE_PROD_DB_URL: ${{ secrets.SUPABASE_PROD_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          psql "${SUPABASE_PROD_DB_URL}" -X -q -v ON_ERROR_STOP=1 -A -t -c "
            select json_build_object(
              'migration_count', (select count(*) from supabase_migrations.schema_migrations),
              'latest_version', (select version from supabase_migrations.schema_migrations order by version desc limit 1),
              'latest_name', (select name from supabase_migrations.schema_migrations order by version desc limit 1)
            )
          " > "${WORK_DIR}/source-state.json"
          cat "${WORK_DIR}/source-state.json"

          SOURCE_STATE_FILE="${WORK_DIR}/source-state.json" node --input-type=module <<'NODE'
          import fs from 'node:fs'
          const state = JSON.parse(fs.readFileSync(process.env.SOURCE_STATE_FILE, 'utf8'))
          const expected = {
            migration_count: Number(process.env.SOURCE_CONTRACT),
            latest_version: process.env.SOURCE_VERSION,
            latest_name: process.env.SOURCE_NAME,
          }
          for (const [key, want] of Object.entries(expected)) {
            if (String(state[key]) !== String(want)) {
              console.error(`ERROR: live Production ${key} is ${state[key]}, expected ${want}.`)
              process.exit(1)
            }
          }
          console.log('Live Production is exactly the rehearsed contract-174 source boundary.')
          NODE

      - name: Take a fresh Production dump and restore it to a disposable local target
        env:
          SUPABASE_PROD_DB_URL: ${{ secrets.SUPABASE_PROD_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          supabase init --force --workdir "${WORK_DIR}" >/dev/null 2>&1 || true
          supabase start --workdir "${WORK_DIR}"

          # READ-ONLY against Production: dumps only. The absolute pg_dump path
          # is required — a bare `pg_dump` resolves to Ubuntu's 16 client, which
          # refuses against a 17.6 server. The four-file Supabase-native dump is
          # used rather than one archive because the archive route restores
          # without privileges, and this contract asserts privilege facts.
          BUNDLE="${WORK_DIR}/bundle"
          ROLLOUT="${GITHUB_WORKSPACE}/scripts/database-rollout"
          mkdir -p "${BUNDLE}"

          supabase db dump --db-url "${SUPABASE_PROD_DB_URL}" \
            --file "${BUNDLE}/roles.sql" --role-only
          supabase db dump --db-url "${SUPABASE_PROD_DB_URL}" \
            --file "${BUNDLE}/schema.sql"
          supabase db dump --db-url "${SUPABASE_PROD_DB_URL}" \
            --file "${BUNDLE}/data.sql" --use-copy --data-only \
            -x storage.buckets_vectors -x storage.vector_indexes
          /usr/lib/postgresql/17/bin/pg_dump \
            --dbname "${SUPABASE_PROD_DB_URL}" \
            --schema supabase_migrations --no-owner --no-privileges \
            --file "${BUNDLE}/migration-history.sql"

          for required in roles.sql schema.sql data.sql migration-history.sql; do
            [ -s "${BUNDLE}/${required}" ] || {
              echo "ERROR: dump is empty or missing: ${BUNDLE}/${required}"
              ls -la "${WORK_DIR}" "${BUNDLE}" || true
              exit 1
            }
          done

          grep -Eq '(COPY|INSERT INTO)[[:space:]]+"?auth"?\."?users"?' "${BUNDLE}/data.sql" || {
            echo 'ERROR: data.sql does not contain auth.users; this is not a faithful copy.'
            exit 1
          }

          psql "${LOCAL_DB_URL}" -X --single-transaction -v ON_ERROR_STOP=1 --file "${BUNDLE}/roles.sql"
          psql "${LOCAL_DB_URL}" -X --single-transaction -v ON_ERROR_STOP=1 \
            --file "${ROLLOUT}/prepare-disposable-restore-target.sql"
          psql "${LOCAL_DB_URL}" -X --single-transaction -v ON_ERROR_STOP=1 --file "${BUNDLE}/schema.sql"
          psql "${LOCAL_DB_URL}" -X --single-transaction -v ON_ERROR_STOP=1 \
            --command 'SET session_replication_role = replica' --file "${BUNDLE}/data.sql"
          psql "${LOCAL_DB_URL}" -X --single-transaction -v ON_ERROR_STOP=1 \
            --file "${ROLLOUT}/managed-schema-customizations.sql"
          psql "${LOCAL_DB_URL}" -X --single-transaction -v ON_ERROR_STOP=1 --file "${BUNDLE}/migration-history.sql"

          restored="$(psql "${LOCAL_DB_URL}" -X -q -v ON_ERROR_STOP=1 -A -t -c \
            'select count(*) from supabase_migrations.schema_migrations')"
          [ "${restored}" = "${SOURCE_CONTRACT}" ] || {
            echo "ERROR: restored target holds ${restored} migrations, expected ${SOURCE_CONTRACT}."
            exit 1
          }

          leaked="$(psql "${LOCAL_DB_URL}" -X -q -v ON_ERROR_STOP=1 -A -t -c \
            "select count(*) from information_schema.role_table_grants
              where table_schema = 'public'
                and table_name = 'season_fixtures'
                and grantee in ('anon','authenticated')")"
          [ "${leaked}" = "0" ] || {
            echo "ERROR: restored target grants season_fixtures to browser roles; Production grants none."
            exit 1
          }
          echo "Disposable target restored at contract ${restored} with Production's privilege shape."

      - name: Record what Production holds before anything is applied
        shell: bash
        run: |
          set -euo pipefail
          # Nothing in contracts 175 to 178 rewrites a row. Every count below is
          # compared against itself after the apply, so "additive" is proven on
          # the data rather than asserted from the checker alone.
          psql "${LOCAL_DB_URL}" -X -q -v ON_ERROR_STOP=1 -A -t -c "
            select json_build_object(
              'profiles', (select count(*) from public.profiles),
              'entries', (select count(*) from public.entries),
              'leagues', (select count(*) from public.leagues),
              'league_members', (select count(*) from public.league_members),
              'match_predictions', (select count(*) from public.match_predictions),
              'season_predictions', (select count(*) from public.season_predictions),
              'season_fixtures', (select count(*) from public.season_fixtures),
              'bonus_competitions', (select count(*) from public.bonus_competitions),
              'score_events', (select count(*) from public.score_events)
            )
          " > "${WORK_DIR}/preconditions.json"
          cat "${WORK_DIR}/preconditions.json"

      - name: Rehearse the forward apply on the disposable target
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${WORK_DIR}/later-migrations"
          : > "${WORK_DIR}/moved-files.txt"
          for file in $(git ls-files 'supabase/migrations/*.sql' | sort); do
            filename="$(basename "${file}")"
            version="${filename:0:14}"
            if [[ "${version}" > "${TARGET_VERSION}" ]]; then
              mv "${file}" "${WORK_DIR}/later-migrations/${filename}"
              printf '%s\n' "${file}" >> "${WORK_DIR}/moved-files.txt"
            fi
          done
          if [ -s "${WORK_DIR}/moved-files.txt" ]; then
            echo 'Held back as ABOVE the pinned target, not rehearsed here:'
            cat "${WORK_DIR}/moved-files.txt"
          fi

          supabase db push --db-url "${LOCAL_DB_URL}" --dry-run \
            > "${WORK_DIR}/dry-run.txt" 2>&1
          cat "${WORK_DIR}/dry-run.txt"

          grep -oE '[0-9]{14}_[A-Za-z0-9_-]+\.sql' "${WORK_DIR}/dry-run.txt" \
            | awk '!seen[$0]++' | sort > "${WORK_DIR}/pending.txt"

          # EXACTLY the thirteen, named. "At least the ones I expected" would
          # pass while promoting something nobody approved.
          printf '%s\n' \
            '20260812000000_what_if_projection.sql' \
            '20260812001000_prediction_dna.sql' \
            '20260812002000_offline_draft_reconciliation.sql' \
            '20260812003000_shadow_scoring_verifier.sql' \
            > "${WORK_DIR}/expected.txt"
          sort -o "${WORK_DIR}/expected.txt" "${WORK_DIR}/expected.txt"

          if ! diff -u "${WORK_DIR}/expected.txt" "${WORK_DIR}/pending.txt"; then
            echo 'ERROR: the rehearsal dry run is not exactly contracts 175 to 178.'
            exit 1
          fi
          echo 'Dry run is exactly the thirteen approved migrations.'

          supabase db push --db-url "${LOCAL_DB_URL}" 2>&1 | tee "${WORK_DIR}/apply.txt"

      - name: Restore the repository migration tree in the runner
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "${WORK_DIR}/moved-files.txt" ]; then
            while IFS= read -r file; do
              [ -n "${file}" ] || continue
              filename="$(basename "${file}")"
              if [ -e "${WORK_DIR}/later-migrations/${filename}" ]; then
                mv "${WORK_DIR}/later-migrations/${filename}" "${file}"
              fi
            done < "${WORK_DIR}/moved-files.txt"
          fi

      - name: Verify the rehearsed result, and that nothing was lost
        shell: bash
        run: |
          set -euo pipefail
          psql "${LOCAL_DB_URL}" -X -q -v ON_ERROR_STOP=1 -A -t -c "
            select json_build_object(
              'migration_count', (select count(*) from supabase_migrations.schema_migrations),
              'latest_version', (select version from supabase_migrations.schema_migrations order by version desc limit 1),
              'latest_name', (select name from supabase_migrations.schema_migrations order by version desc limit 1),

              -- THE PROPERTY THIS REHEARSAL EXISTS FOR. Contract 178's verifier
              -- must not name either canonical scoring function: one that calls
              -- what it verifies agrees with it by construction and reports a
              -- green tick for ever. The migration asserts what was WRITTEN;
              -- this reads what is INSTALLED.
              'verifier_is_independent', (
                select pg_get_functiondef(p.oid) !~ 'season_fixture_points'
                   and pg_get_functiondef(p.oid) !~ 'season_matchweek_points'
                  from pg_proc p join pg_namespace n on n.oid = p.pronamespace
                 where n.nspname = 'predictor_internal' and p.proname = 'shadow_matchweek_points'),

              -- And its mirror image: contract 175's projection MUST name the
              -- canonical per-fixture authority, because a projection that
              -- computed its own points would be the second scoring engine the
              -- contract exists to avoid.
              'projection_reuses_authority', (
                select pg_get_functiondef(p.oid) ~ 'season_fixture_points'
                  from pg_proc p join pg_namespace n on n.oid = p.pronamespace
                 where n.nspname = 'predictor_internal' and p.proname = 'season_matchweek_projection'),

              -- Contract 177 submits THROUGH the existing writer and never
              -- around it.
              'batch_has_no_second_write_path', (
                select pg_get_functiondef(p.oid) ~ 'save_season_prediction\('
                   and pg_get_functiondef(p.oid) !~* 'insert\s+into\s+public\.season_predictions'
                  from pg_proc p join pg_namespace n on n.oid = p.pronamespace
                 where n.nspname = 'public' and p.proname = 'save_season_predictions_batch'),

              -- The five new functions exist.
              'new_functions', (
                select count(*) from pg_proc p join pg_namespace n on n.oid = p.pronamespace
                 where n.nspname = 'public'
                   and p.proname in ('get_season_matchweek_projection','get_season_prediction_dna',
                                     'save_season_predictions_batch','run_shadow_scoring_verification',
                                     'admin_shadow_scoring_report')),

              -- The verification RUN is a job, so no browser role may start one.
              'run_browser_reachable', (
                select count(*) from information_schema.role_routine_grants
                 where routine_schema = 'public' and routine_name = 'run_shadow_scoring_verification'
                   and grantee in ('anon','authenticated','PUBLIC')),

              -- The two new relations are internal, and no browser role reaches
              -- them. Contract 134 is the record of what happens when a table is
              -- created under a comment saying nobody can read it and nothing is
              -- actually revoked.
              'new_internal_tables', (
                select count(*) from pg_tables
                 where schemaname = 'predictor_internal'
                   and tablename in ('shadow_scoring_runs','shadow_scoring_mismatches')),
              'new_tables_granted_to_browser', (
                select count(*) from information_schema.role_table_grants
                 where table_schema = 'predictor_internal'
                   and table_name in ('shadow_scoring_runs','shadow_scoring_mismatches')
                   and grantee in ('anon','authenticated')),
              'new_tables_empty', (
                select (select count(*) from predictor_internal.shadow_scoring_runs)
                     + (select count(*) from predictor_internal.shadow_scoring_mismatches)),

              -- Nothing scheduled itself: contract 178's run has no caller, and
              -- giving it one is a separate decision.
              'verifier_scheduled', (
                select case when to_regclass('cron.job') is null then 0
                            else (select count(*) from cron.job
                                   where command like '%run_shadow_scoring_verification%') end),
              'cron_jobs', (select case when to_regclass('cron.job') is null then -1
                                        else (select count(*) from cron.job) end),

              -- Euro publication is untouched.
              'euro_state', (select public.euro_publication_state() ->> 'state'),

              -- And nothing was lost.
              'profiles', (select count(*) from public.profiles),
              'entries', (select count(*) from public.entries),
              'leagues', (select count(*) from public.leagues),
              'league_members', (select count(*) from public.league_members),
              'match_predictions', (select count(*) from public.match_predictions),
              'season_predictions', (select count(*) from public.season_predictions),
              'season_fixtures', (select count(*) from public.season_fixtures),
              'bonus_competitions', (select count(*) from public.bonus_competitions),
              'score_events', (select count(*) from public.score_events)
            )
          " > "${WORK_DIR}/target-state.json"
          cat "${WORK_DIR}/target-state.json"

          TARGET_STATE_FILE="${WORK_DIR}/target-state.json" \
          PRECONDITIONS_FILE="${WORK_DIR}/preconditions.json" \
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          const state = JSON.parse(fs.readFileSync(process.env.TARGET_STATE_FILE, 'utf8'))
          const before = JSON.parse(fs.readFileSync(process.env.PRECONDITIONS_FILE, 'utf8'))

          const expected = {
            migration_count: Number(process.env.TARGET_CONTRACT),
            latest_version: process.env.TARGET_VERSION,
            latest_name: process.env.TARGET_NAME,
            // The one that would matter most if it were wrong.
            verifier_is_independent: true,
            projection_reuses_authority: true,
            batch_has_no_second_write_path: true,
            new_functions: 5,
            run_browser_reachable: 0,
            new_internal_tables: 2,
            new_tables_granted_to_browser: 0,
            new_tables_empty: 0,
            verifier_scheduled: 0,
            euro_state: 'hidden',
          }
          for (const [key, want] of Object.entries(expected)) {
            if (String(state[key]) !== String(want)) {
              console.error(`ERROR: rehearsed ${key} is ${state[key]}, expected ${want}.`)
              process.exit(1)
            }
          }

          // Additive on the DATA, not just by the checker.
          const counted = ['profiles','entries','leagues','league_members','match_predictions',
                           'season_predictions','season_fixtures','bonus_competitions','score_events']
          for (const key of counted) {
            if (String(before[key]) !== String(state[key])) {
              console.error(`ERROR: ${key} moved ${before[key]} -> ${state[key]}; this range rewrites no row.`)
              process.exit(1)
            }
          }

          console.log(`Rehearsal reached exactly contract ${state.migration_count}.`)
          console.log('The verifier names neither canonical scoring function; the projection names one.')
          console.log('Two new internal relations, empty, and reachable by no browser role.')
          console.log(`${state.cron_jobs} scheduled job(s) — none of them the verifier, which has no caller.`)
          for (const key of counted) console.log(`  ${key}: ${state[key]} (unchanged)`)
          NODE

      - name: Shred the plaintext dumps and stop the disposable target
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -d "${WORK_DIR}/bundle" ]; then
            find "${WORK_DIR}/bundle" -type f -exec shred -u {} + 2>/dev/null || true
            rm -rf "${WORK_DIR}/bundle"
          fi
          supabase stop --no-backup --workdir "${WORK_DIR}" || true
