name: One-off final MatchTemporalState retirement

on:
  push:
    branches:
      - agent/retire-match-temporal-state
    paths:
      - scripts/finish-match-temporal-retirement.mjs
      - .github/workflows/one-off-finish-match-temporal-retirement.yml
  pull_request:
    branches:
      - agent/migrate-entry-lock-context
    paths:
      - scripts/finish-match-temporal-retirement.mjs
      - .github/workflows/one-off-finish-match-temporal-retirement.yml

permissions:
  contents: write

jobs:
  finish-retirement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/retire-match-temporal-state
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply guarded caller migration
        run: node scripts/finish-match-temporal-retirement.mjs
      - name: Validate patch hygiene
        run: git diff --check
      - name: Commit final retirement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Finish MatchTemporalState retirement"
          git push origin HEAD:agent/retire-match-temporal-state
