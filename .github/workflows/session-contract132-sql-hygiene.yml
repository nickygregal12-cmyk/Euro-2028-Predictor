name: Session contract 132 SQL hygiene

on:
  push:
    branches:
      - feature/provider-initial-fixture-approval-contract-132

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Patch reviewed SQL edge cases
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'feature/provider-initial-fixture-approval-contract-132'
          python - <<'PY'
          from pathlib import Path

          migration = Path('supabase/migrations/20260807210812_provider_initial_fixture_approval.sql')
          text = migration.read_text()

          old = """  if p_tournament_id is null
     or p_provider not in ('sportmonks', 'api-football', 'football-data')
  then"""
          new = """  if p_tournament_id is null
     or p_provider is null
     or p_provider not in ('sportmonks', 'api-football', 'football-data')
  then"""
          assert text.count(old) == 2, f'expected two provider validation blocks, found {text.count(old)}'
          text = text.replace(old, new)

          old_order = '     order by p.round_provider_id::integer\n'
          new_order = '     order by ordinal\n'
          assert text.count(old_order) == 1, f'unexpected round ordering count: {text.count(old_order)}'
          text = text.replace(old_order, new_order)

          migration.write_text(text)
          PY

          git rm .github/workflows/session-contract132-sql-hygiene.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/migrations/20260807210812_provider_initial_fixture_approval.sql
          git commit -m 'Tighten contract 132 SQL validation'
          git push origin HEAD:"$GITHUB_REF_NAME"
