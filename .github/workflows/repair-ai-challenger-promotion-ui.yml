name: Temporary repair AI challenger promotion UI

on:
  push:
    branches:
      - agent/record-production-190-and-smoke

permissions:
  contents: write

jobs:
  repair:
    if: "${{ startsWith(github.event.head_commit.message, 'Ops: repair AI challenger promotion UI') }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/record-production-190-and-smoke
          fetch-depth: 0

      - name: Repair the challenger promotion affordance and add regression coverage
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          page = Path('src/features/admin/AiLabPage.tsx')
          text = page.read_text()
          old = "model.status === 'candidate' ? <button className={styles.textAction} type=\"button\" onClick={() => onPromote(model)}>Promote</button> : null"
          new = "model.status === 'challenger' ? <button className={styles.textAction} type=\"button\" onClick={() => onPromote(model)}>Promote</button> : null"
          if text.count(old) != 1:
              raise SystemExit('expected exactly one stale candidate promotion predicate')
          page.write_text(text.replace(old, new))

          test = Path('tests/features/admin/AiLabPage.test.tsx')
          text = test.read_text()
          old_import = "import { fetchAiLabSnapshot } from '../../../src/services/supabase/aiLab'"
          new_import = "import { fetchAiLabSnapshot, promoteAiModel } from '../../../src/services/supabase/aiLab'"
          if text.count(old_import) != 1:
              raise SystemExit('expected exactly one AI Lab service import')
          text = text.replace(old_import, new_import)

          marker = "\ndescribe('AI Lab page', () => {\n"
          challenger = (
              "\nconst challengerSnapshot = {\n"
              "  ...snapshot,\n"
              "  models: [{\n"
              "    id: 'challenger-epl',\n"
              "    league: 'EPL',\n"
              "    version: 'selected-20260814-v1',\n"
              "    family: 'ensemble',\n"
              "    status: 'challenger',\n"
              "    trainedAt: '2026-08-14T14:30:00Z',\n"
              "    trainingMatches: 12345,\n"
              "    validationAccuracy: 0.51,\n"
              "    validationLogLoss: 0.971,\n"
              "    baselineLogLoss: null,\n"
              "    marketLogLoss: null,\n"
              "  }],\n"
              "}\n"
          )
          if text.count(marker) != 1:
              raise SystemExit('expected exactly one AI Lab describe marker')
          text = text.replace(marker, challenger + marker)

          reset_old = "    vi.mocked(fetchAiLabSnapshot).mockReset().mockResolvedValue(snapshot)\n"
          reset_new = reset_old + "    vi.mocked(promoteAiModel).mockReset().mockResolvedValue(undefined)\n"
          if text.count(reset_old) != 1:
              raise SystemExit('expected exactly one fetch mock reset')
          text = text.replace(reset_old, reset_new)

          end_marker = "\n  it('filters every dashboard read by the selected league and exposes the evidence tabs', async () => {"
          regression = (
              "\n  it('offers the audited promotion flow for a database challenger model', async () => {\n"
              "    render(<AiLabPage previewSnapshot={challengerSnapshot} />)\n\n"
              "    fireEvent.click(screen.getByRole('button', { name: 'Promote' }))\n"
              "    expect(screen.getByText('Promote model')).toBeTruthy()\n\n"
              "    fireEvent.change(screen.getByLabelText('Reason for promotion'), {\n"
              "      target: { value: 'Selected by the final guarded model study' },\n"
              "    })\n"
              "    fireEvent.click(screen.getByRole('button', { name: 'Make current' }))\n\n"
              "    await waitFor(() => expect(promoteAiModel).toHaveBeenCalledWith(\n"
              "      'challenger-epl',\n"
              "      'Selected by the final guarded model study',\n"
              "    ))\n"
              "    expect(await screen.findByText('EPL selected-20260814-v1 is now the current model.')).toBeTruthy()\n"
              "  })\n"
          )
          if text.count(end_marker) != 1:
              raise SystemExit('expected exactly one insertion point before filter test')
          text = text.replace(end_marker, regression + end_marker)
          test.write_text(text)
          PY

          rm .github/workflows/repair-ai-challenger-promotion-ui.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/features/admin/AiLabPage.tsx tests/features/admin/AiLabPage.test.tsx .github/workflows/repair-ai-challenger-promotion-ui.yml
          git commit -m 'Fix AI Lab challenger promotion affordance'
          git push origin HEAD:agent/record-production-190-and-smoke
