name: Diagnostic Home build

on:
  push:
    branches:
      - fix/home-data-availability

permissions:
  contents: read

jobs:
  build-diagnostic:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Capture build output
        shell: bash
        run: |
          set +e
          npm run build > build-output.txt 2>&1
          status=$?
          echo "$status" > build-status.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: home-build-diagnostic
          path: |
            build-output.txt
            build-status.txt
          if-no-files-found: error
          retention-days: 1
