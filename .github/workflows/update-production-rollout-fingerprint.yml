name: Update production rollout fingerprint

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/update-production-rollout-fingerprint.yml'
      - 'scripts/database-rollout/production-preflight.sql'
      - 'scripts/database-rollout/post-rollout-verification.sql'

permissions:
  contents: write

jobs:
  update-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Replace obsolete rehearsed prediction fingerprint
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          old = '8d76619fe4b44fdac17de1cc2afe5aaa'
          new = '320cf25d62767dee307d3602212909af'
          paths = [
              Path('scripts/database-rollout/production-preflight.sql'),
              Path('scripts/database-rollout/post-rollout-verification.sql'),
          ]

          total_old = 0
          total_new_before = 0
          for path in paths:
              text = path.read_text()
              old_count = text.count(old)
              new_count = text.count(new)
              total_old += old_count
              total_new_before += new_count

              if old_count == 0:
                  if new_count == 0:
                      raise SystemExit(f'STOP: neither old nor new fingerprint found in {path}')
                  continue

              path.write_text(text.replace(old, new))

          if total_old not in (0, 3):
              raise SystemExit(f'STOP: expected exactly 3 obsolete fingerprint occurrences, found {total_old}')

          if total_old == 0 and total_new_before != 3:
              raise SystemExit(f'STOP: expected exactly 3 current fingerprint occurrences, found {total_new_before}')

          final_old = sum(path.read_text().count(old) for path in paths)
          final_new = sum(path.read_text().count(new) for path in paths)
          if final_old != 0 or final_new != 3:
              raise SystemExit(f'STOP: final fingerprint counts old={final_old}, new={final_new}')
          PY

          git diff --check

      - name: Verify rollout scripts remain read-only and fingerprint-bound
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'READ-ONLY' scripts/database-rollout/production-preflight.sql
          grep -F 'READ-ONLY' scripts/database-rollout/post-rollout-verification.sql
          test "$(grep -h -o '320cf25d62767dee307d3602212909af' \
            scripts/database-rollout/production-preflight.sql \
            scripts/database-rollout/post-rollout-verification.sql | wc -l | tr -d ' ')" = "3"
          ! grep -q '8d76619fe4b44fdac17de1cc2afe5aaa' \
            scripts/database-rollout/production-preflight.sql \
            scripts/database-rollout/post-rollout-verification.sql

      - name: Commit reviewed guard update
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          if git diff --quiet -- \
            scripts/database-rollout/production-preflight.sql \
            scripts/database-rollout/post-rollout-verification.sql; then
            echo 'Rollout fingerprint is already current.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            scripts/database-rollout/production-preflight.sql \
            scripts/database-rollout/post-rollout-verification.sql
          git commit -m 'Update production rollout guard fingerprint'
          git push origin "HEAD:${HEAD_BRANCH}"
