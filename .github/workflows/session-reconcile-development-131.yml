name: Session reconcile Development 131

on:
  push:
    branches:
      - ops/dev-fastlane-126-131-20260807

permissions:
  contents: write

jobs:
  reconcile:
    if: github.event.head_commit.message == 'ops: reconcile hosted status 131'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ops/dev-fastlane-126-131-20260807
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22.22.2

      - name: Reconcile human hosted-status authorities and remove bridge
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs'

          const inventoryPath = 'docs/ops/ops-pending-migrations.md'
          let inventory = fs.readFileSync(inventoryPath, 'utf8')
          const oldHeading = '## Current state — 6 August 2026'
          if (!inventory.includes(oldHeading)) throw new Error('Expected current-state heading not found')
          inventory = inventory.replace(oldHeading, '## Current state — 7 August 2026')

          const start = 'The repository is at **contract 131** and development is at **125**'
          const end = '**The record of that rollout did not reach `main` on its own.**'
          const startAt = inventory.indexOf(start)
          const endAt = inventory.indexOf(end)
          if (startAt < 0 || endAt < 0 || endAt <= startAt) throw new Error('Expected current Development paragraph boundaries not found')
          const replacement = `The repository and hosted Development are both at **contract 131**. Contracts 126–131 were applied on 7 August 2026 by guarded fast-lane evidence run \`31186564948\`, pinned to exact repository head \`50b01154e5a6cfc2ebc1b2312eaceb42e8a39b57\`. Before any hosted write the lane proved the target was Development project \`iouzoutneyjpugbbtdem\`, hard-refused Production, required the pending set to be exactly the six canonical versions \`20260806170000\` through \`20260806220000\`, passed the repository additive-migration checker, and took the ADR 0024 lightweight snapshot. \`supabase db push\` then applied all six; the lane's parity check reported no remaining migration and contract/count 131. Independent verification through the Supabase management API returned the same six canonical ledger rows, ending at \`20260806220000_period_standings_display_names\`. A read-only catalogue check confirmed contract 126–131's internal helpers remain unavailable to browser roles while the intended authenticated RPCs are exposed. Evidence artifact \`development-fast-lane-126-131-evidence\` is retained for seven days as artifact \`8997049916\`. **Production remains contract 63 and promotion remains unauthorised.**\n\n`
          inventory = inventory.slice(0, startAt) + replacement + inventory.slice(endAt)

          const devRow = /^\| Development Supabase `iouzoutneyjpugbbtdem` \| \*\*125\*\* \|.*$/m
          if (!devRow.test(inventory)) throw new Error('Expected Development table row at contract 125 not found')
          inventory = inventory.replace(devRow, '| Development Supabase `iouzoutneyjpugbbtdem` | **131** | Guarded fast-lane run `31186564948` applied canonical contracts 126–131 on 7 August 2026 after exact pending-set, additive and Development-target proofs plus a lightweight snapshot. The workflow parity check and an independent Supabase migration-ledger read both end at `20260806220000_period_standings_display_names`. Evidence artifact `8997049916` is retained for seven days. | LEVEL WITH REPOSITORY |')
          fs.writeFileSync(inventoryPath, inventory)

          const statusPath = 'docs/quality/current-status.md'
          let status = fs.readFileSync(statusPath, 'utf8')
          if (!status.includes('**Status date:** 6 August 2026')) throw new Error('Expected current-status date not found')
          if (!status.includes('| Last verified | 2026-08-06 |')) throw new Error('Expected current-status verification date not found')
          status = status.replace('**Status date:** 6 August 2026', '**Status date:** 7 August 2026')
          status = status.replace('| Last verified | 2026-08-06 |', '| Last verified | 2026-08-07 |')
          fs.writeFileSync(statusPath, status)
          NODE

          rm .github/workflows/session-reconcile-development-131.yml

          node scripts/check-hosted-migration-inventory.mjs

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/ops/ops-pending-migrations.md docs/quality/current-status.md .github/workflows/session-reconcile-development-131.yml
          git commit -m 'Record Development rollout through contract 131'
          git push origin HEAD:ops/dev-fastlane-126-131-20260807
