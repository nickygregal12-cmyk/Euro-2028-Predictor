name: Temporary production source export

on:
  push:
    branches:
      - temp/production-contract48-source
    paths:
      - .github/workflows/temp-production-source-export.yml
  pull_request:
    paths:
      - .github/workflows/temp-production-source-export.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact production source
        uses: actions/checkout@v4
        with:
          ref: 1da5fb0d3011d02184b14391b6d240fefe4882e6
          fetch-depth: 1
      - name: Verify exact production source
        run: test "$(git rev-parse HEAD)" = "1da5fb0d3011d02184b14391b6d240fefe4882e6"
      - name: Upload exact production checkout
        uses: actions/upload-artifact@v4
        with:
          name: contract48-production-source
          path: .
          include-hidden-files: true
          retention-days: 1
