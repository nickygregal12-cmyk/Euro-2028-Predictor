name: Production 211 to 218 rollout

# One-shot guarded Production promotion for Contracts 212 through 218.
# Requires a fresh encrypted backup and a successful exact-head 211-to-218
# rehearsal, and refuses unless BOTH destructive filenames in the boundary are
# explicitly acknowledged.
#
# Development is moved first and Production second. That order is not a
# convention here: the step below reads the Development machine record and
# refuses to make Production the first hosted environment to see Contract 218.
#
# It applies and then measures. The measurement it runs is the same file the
# rehearsal ran, for the same reason the rehearsal exists: a rehearsal that asks
# a different question from the rollout has rehearsed nothing.
on:
  workflow_dispatch:
    inputs:
      project_ref:
        description: Exact Production project ref confirmation
        required: true
      confirmation:
        description: Type APPLY-PRODUCTION-211-TO-218 to proceed
        required: true
      destructive_acknowledgement_213:
        description: Type ACKNOWLEDGE-DESTRUCTIVE-20260820150000_drop_unmeasured_sportmonks_tokens.sql
        required: true
      destructive_acknowledgement_217:
        description: Type ACKNOWLEDGE-DESTRUCTIVE-20260824090000_web_push_channel.sql
        required: true
      backup_run_id:
        description: Run id of the successful fresh Production backup
        required: true
      rehearsal_run_id:
        description: Run id of the successful 211-to-218 rehearsal
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: production-migration-rollout
  cancel-in-progress: false

env:
  EXPECTED_PROJECT_REF: vkfnsqdyhvtwyqkisxhk
  FORBIDDEN_DEVELOPMENT_REF: iouzoutneyjpugbbtdem
  CONFIRMATION_PHRASE: APPLY-PRODUCTION-211-TO-218
  DESTRUCTIVE_ACK_213: ACKNOWLEDGE-DESTRUCTIVE-20260820150000_drop_unmeasured_sportmonks_tokens.sql
  DESTRUCTIVE_ACK_217: ACKNOWLEDGE-DESTRUCTIVE-20260824090000_web_push_channel.sql
  SOURCE_CONTRACT: '211'
  SOURCE_VERSION: '20260820090000'
  SOURCE_NAME: provider_deadline_watch_tier
  TARGET_CONTRACT: '218'
  TARGET_VERSION: '20260824100000'
  TARGET_NAME: live_results_channel
  CONTRACT_212: 20260820130000_matchweek_card_publishes_the_fixture_lock.sql
  CONTRACT_213: 20260820150000_drop_unmeasured_sportmonks_tokens.sql
  CONTRACT_214: 20260820170000_confirmation_tracks_current_card.sql
  CONTRACT_215: 20260823001000_ai_canonical_value_currency.sql
  CONTRACT_216: 20260823120000_reminder_dispatch_wiring.sql
  CONTRACT_217: 20260824090000_web_push_channel.sql
  CONTRACT_218: 20260824100000_live_results_channel.sql
  WORK_DIR: /tmp/production-211-to-218-rollout

jobs:
  rollout:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Refuse an unsafe dispatch or repository state
        env:
          INPUT_PROJECT_REF: ${{ inputs.project_ref }}
          INPUT_CONFIRMATION: ${{ inputs.confirmation }}
          INPUT_ACK_213: ${{ inputs.destructive_acknowledgement_213 }}
          INPUT_ACK_217: ${{ inputs.destructive_acknowledgement_217 }}
        shell: bash
        run: |
          set -euo pipefail
          [ "${INPUT_CONFIRMATION}" = "${CONFIRMATION_PHRASE}" ] || { echo 'ERROR: confirmation phrase mismatch.'; exit 1; }
          # Two acknowledgements rather than one, because there are two
          # destructive contracts in this boundary and a single tick-box would
          # let the second one through on the strength of having read the first.
          [ "${INPUT_ACK_213}" = "${DESTRUCTIVE_ACK_213}" ] || { echo 'ERROR: Contract 213 acknowledgement mismatch.'; exit 1; }
          [ "${INPUT_ACK_217}" = "${DESTRUCTIVE_ACK_217}" ] || { echo 'ERROR: Contract 217 acknowledgement mismatch.'; exit 1; }
          [ "${INPUT_PROJECT_REF}" != "${FORBIDDEN_DEVELOPMENT_REF}" ] || { echo 'ERROR: that is Development.'; exit 1; }
          [ "${INPUT_PROJECT_REF}" = "${EXPECTED_PROJECT_REF}" ] || { echo 'ERROR: project ref is not Production.'; exit 1; }
          [ "${GITHUB_REF}" = 'refs/heads/main' ] || { echo 'ERROR: rollout runs only from main.'; exit 1; }
          git fetch --no-tags origin main
          [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" ] || { echo 'ERROR: HEAD is not exact main.'; exit 1; }
          [ -z "$(git status --porcelain=v1 --untracked-files=all)" ] || { echo 'ERROR: checkout is dirty.'; exit 1; }
          mkdir -p "${WORK_DIR}"

      - name: Prove fresh backup then exact-head rehearsal succeeded
        env:
          GH_TOKEN: ${{ github.token }}
          BACKUP_RUN_ID: ${{ inputs.backup_run_id }}
          REHEARSAL_RUN_ID: ${{ inputs.rehearsal_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          check_run() {
            local id="$1" path="$2" label="$3" json
            json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${id}")"
            [ "$(jq -r '.conclusion' <<<"${json}")" = success ] || { echo "ERROR: ${label} ${id} did not succeed."; exit 1; }
            [ "$(jq -r '.path' <<<"${json}")" = "${path}" ] || { echo "ERROR: ${label} ${id} has wrong workflow path."; exit 1; }
            printf '%s' "${json}"
          }
          backup="$(check_run "${BACKUP_RUN_ID}" '.github/workflows/production-backup.yml' Backup)"
          rehearsal="$(check_run "${REHEARSAL_RUN_ID}" '.github/workflows/production-211-to-218-rehearsal.yml' Rehearsal)"
          # EXACT head, not an ancestor: a rehearsal of a different tree has
          # rehearsed a different migration set.
          rehearsal_sha="$(jq -r '.head_sha' <<<"${rehearsal}")"
          [ "${rehearsal_sha}" = "$(git rev-parse HEAD)" ] || { echo "ERROR: rehearsal head ${rehearsal_sha} is not rollout head."; exit 1; }
          backup_sha="$(jq -r '.head_sha' <<<"${backup}")"
          git merge-base --is-ancestor "${backup_sha}" HEAD || { echo 'ERROR: backup head is not an ancestor of rollout head.'; exit 1; }
          backup_at="$(jq -r '.created_at' <<<"${backup}")"
          rehearsal_at="$(jq -r '.created_at' <<<"${rehearsal}")"
          [ "${backup_at}" \< "${rehearsal_at}" ] || { echo 'ERROR: backup does not precede rehearsal.'; exit 1; }
          artifacts="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${BACKUP_RUN_ID}/artifacts")"
          [ "$(jq '[.artifacts[] | select(.name == "production-backup-encrypted" and .expired == false)] | length' <<<"${artifacts}")" = 1 ] || {
            echo 'ERROR: encrypted backup artifact missing.'
            exit 1
          }

      - name: Refuse to make Production the first hosted environment to see Contract 218
        shell: bash
        run: |
          set -euo pipefail
          dev_ref="$(node -p "require('./config/development-hosted-contract.json').projectRef")"
          dev_contract="$(node -p "require('./config/development-hosted-contract.json').requiredMigrationCount")"
          [ "${dev_ref}" = "${FORBIDDEN_DEVELOPMENT_REF}" ] || { echo 'ERROR: Development record names the wrong project.'; exit 1; }
          [ "${dev_contract}" -ge "${TARGET_CONTRACT}" ] || {
            echo "ERROR: Development record is ${dev_contract}, below ${TARGET_CONTRACT}."
            exit 1
          }

      - name: Prove the repository boundary is exactly 211 to 218
        shell: bash
        run: |
          set -euo pipefail
          # PINNED TO THE BOUNDARY, NOT TO A FROZEN REPOSITORY.
          #
          # This check used to require the repository to hold EXACTLY
          # TARGET_CONTRACT migrations. That is the wrong invariant, and it cost
          # a rehearsal to learn: it means the lane can only run while `main` is
          # standing still, and on this repository `main` moved three times
          # during one promotion. A lane that unrelated work can invalidate
          # mid-flight is not a safe lane, it is an unrunnable one.
          #
          # What actually has to be true is that the boundary is where it was
          # reviewed: contract N is the Nth migration in the chain, so the file
          # at row TARGET_CONTRACT must be the target, and rows SOURCE+1 to
          # TARGET must be exactly the reviewed files. Anything ABOVE the target
          # is held back below and never reaches the database, so it cannot
          # change what this run applies. The dry run is still diffed against the
          # reviewed list before anything is written.
          committed="$(git ls-files 'supabase/migrations/*.sql' | wc -l | tr -d ' ')"
          declared="$(node -p "require('./config/deployment-contract.json').requiredMigrationCount")"
          at_target="$(basename "$(git ls-files 'supabase/migrations/*.sql' | sort | sed -n "${TARGET_CONTRACT}p")")"
          [ "${committed}" -ge "${TARGET_CONTRACT}" ] || {
            echo "ERROR: repository holds ${committed} migrations, fewer than the boundary target ${TARGET_CONTRACT}."
            exit 1
          }
          [ "${declared}" -ge "${TARGET_CONTRACT}" ] || {
            echo "ERROR: deployment contract is ${declared}, below the boundary target ${TARGET_CONTRACT}."
            exit 1
          }
          [ "${at_target}" = "${TARGET_VERSION}_${TARGET_NAME}.sql" ] || {
            echo "ERROR: migration row ${TARGET_CONTRACT} is ${at_target}, not ${TARGET_VERSION}_${TARGET_NAME}.sql."
            echo 'The boundary has moved in the chain. Re-review it rather than running this lane.'
            exit 1
          }
          if [ "${committed}" -gt "${TARGET_CONTRACT}" ]; then
            echo "Repository holds ${committed} migrations; rows above ${TARGET_CONTRACT} are held back and NOT applied by this run:"
            git ls-files 'supabase/migrations/*.sql' | sort | sed -n "$((TARGET_CONTRACT + 1)),${committed}p"
          fi

          : > "${WORK_DIR}/boundary.txt"
          for file in $(git ls-files 'supabase/migrations/*.sql' | sort); do
            version="$(basename "${file}")"; version="${version:0:14}"
            if [[ "${version}" > "${SOURCE_VERSION}" && ! "${version}" > "${TARGET_VERSION}" ]]; then
              basename "${file}" >> "${WORK_DIR}/boundary.txt"
            fi
          done

          printf '%s\n' "${CONTRACT_212}" "${CONTRACT_213}" "${CONTRACT_214}" \
                        "${CONTRACT_215}" "${CONTRACT_216}" "${CONTRACT_217}" \
                        "${CONTRACT_218}" \
            > "${WORK_DIR}/expected-boundary.txt"
          diff -u "${WORK_DIR}/expected-boundary.txt" "${WORK_DIR}/boundary.txt" || {
            echo 'ERROR: boundary is not exactly Contracts 212 through 218.'
            exit 1
          }

      - name: Hold back anything above the boundary
        shell: bash
        run: |
          set -euo pipefail
          # Moved out of the checkout so the CLI cannot see them. Without this,
          # a migration merged to `main` after this boundary was reviewed would
          # be pushed by the same `db push` — which is the exact thing a pinned
          # lane exists to prevent. The dry run below still proves what is left
          # is precisely the reviewed boundary.
          mkdir -p "${WORK_DIR}/later-migrations"
          : > "${WORK_DIR}/moved-files.txt"
          # shellcheck disable=SC2013
          for file in $(git ls-files 'supabase/migrations/*.sql' | sort); do
            filename="$(basename "${file}")"
            version="${filename:0:14}"
            if [[ "${version}" > "${TARGET_VERSION}" ]]; then
              mv "${file}" "${WORK_DIR}/later-migrations/${filename}"
              printf '%s\n' "${file}" >> "${WORK_DIR}/moved-files.txt"
              echo "held back: ${filename}"
            fi
          done
          visible="$(find supabase/migrations -maxdepth 1 -name '*.sql' | sort)"
          echo "Migrations visible to the CLI: $(printf '%s\n' "${visible}" | wc -l | tr -d ' '), newest $(basename "$(printf '%s\n' "${visible}" | tail -1)")"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.2

      - name: Prove which of the seven are additive and which are destructive
        shell: bash
        run: |
          set -euo pipefail
          for additive in "${CONTRACT_212}" "${CONTRACT_214}" "${CONTRACT_215}" "${CONTRACT_216}" "${CONTRACT_218}"; do
            node scripts/check-migration-additive.mjs "supabase/migrations/${additive}"
          done

          : > "${WORK_DIR}/destructive-guard.txt"
          for destructive in "${CONTRACT_213}" "${CONTRACT_217}"; do
            set +e
            node scripts/check-migration-additive.mjs "supabase/migrations/${destructive}" >> "${WORK_DIR}/destructive-guard.txt" 2>&1
            status=$?
            set -e
            [ "${status}" -ne 0 ] || {
              cat "${WORK_DIR}/destructive-guard.txt"
              echo "ERROR: ${destructive} unexpectedly passed the additive guard."
              exit 1
            }
          done
          cat "${WORK_DIR}/destructive-guard.txt"

      - uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2
        with:
          version: 2.109.1
          github-token: ${{ github.token }}

      - name: Capture exact pre-apply Production state
        env:
          SUPABASE_PROD_DB_URL: ${{ secrets.SUPABASE_PROD_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${SUPABASE_PROD_DB_URL}" ] || { echo 'ERROR: SUPABASE_PROD_DB_URL missing.'; exit 1; }
          case "${SUPABASE_PROD_DB_URL}" in
            *"${FORBIDDEN_DEVELOPMENT_REF}"*) echo 'ERROR: Production secret resolves to Development.'; exit 1 ;;
            *"${EXPECTED_PROJECT_REF}"*) ;;
            *) echo 'ERROR: Production secret does not name Production.'; exit 1 ;;
          esac
          psql "${SUPABASE_PROD_DB_URL}" -X -q -A -t -v ON_ERROR_STOP=1 \
            -f scripts/database-rollout/production-211-to-218-preserved-state.sql \
            > "${WORK_DIR}/before.json"
          cat "${WORK_DIR}/before.json"

          BEFORE_FILE="${WORK_DIR}/before.json" node --input-type=module <<'NODE'
          import fs from 'node:fs'
          const x = JSON.parse(fs.readFileSync(process.env.BEFORE_FILE, 'utf8'))
          const want = {
            migration_count: Number(process.env.SOURCE_CONTRACT),
            latest_version: process.env.SOURCE_VERSION,
            latest_name: process.env.SOURCE_NAME,
          }
          for (const [k, v] of Object.entries(want)) {
            if (String(x[k]) !== String(v)) throw new Error(`Production ${k}=${x[k]}, expected ${v}`)
          }
          NODE

      - name: Dry run and apply exactly Contracts 212 through 218 to Production
        env:
          SUPABASE_PROD_DB_URL: ${{ secrets.SUPABASE_PROD_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          supabase db push --db-url "${SUPABASE_PROD_DB_URL}" --dry-run > "${WORK_DIR}/dry-run.txt" 2>&1
          cat "${WORK_DIR}/dry-run.txt"
          grep -oE '[0-9]{14}_[A-Za-z0-9_-]+\.sql' "${WORK_DIR}/dry-run.txt" | awk '!seen[$0]++' > "${WORK_DIR}/pending.txt"
          # The dry run is the last word, not the resolved boundary: it is what
          # the CLI will actually push. Disagreement is the finding.
          diff -u "${WORK_DIR}/expected-boundary.txt" "${WORK_DIR}/pending.txt" || {
            echo 'ERROR: Production dry run is not exactly Contracts 212 through 218.'
            exit 1
          }
          supabase db push --db-url "${SUPABASE_PROD_DB_URL}"

      - name: Verify Production is at Contract 217 and protected state is unchanged
        env:
          SUPABASE_PROD_DB_URL: ${{ secrets.SUPABASE_PROD_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          psql "${SUPABASE_PROD_DB_URL}" -X -q -A -t -v ON_ERROR_STOP=1 \
            -f scripts/database-rollout/production-211-to-218-preserved-state.sql \
            > "${WORK_DIR}/after.json"
          psql "${SUPABASE_PROD_DB_URL}" -X -q -A -t -v ON_ERROR_STOP=1 \
            -f scripts/database-rollout/production-211-to-218-boundary-state.sql \
            > "${WORK_DIR}/boundary-state.json"
          cat "${WORK_DIR}/after.json"
          cat "${WORK_DIR}/boundary-state.json"
          BEFORE_FILE="${WORK_DIR}/before.json" \
          AFTER_FILE="${WORK_DIR}/after.json" \
          BOUNDARY_FILE="${WORK_DIR}/boundary-state.json" \
            node scripts/database-rollout/verify-production-211-to-218.mjs

      - name: Say what to record, rather than claiming it here
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          # A QUOTED heredoc rather than a run of `echo`s in single quotes.
          # Every backtick below is literal markdown for the step summary and
          # must not expand, which is exactly what shellcheck's SC2016 asks about
          # one `echo` at a time. The repository's usual answer is to declare the
          # intent and disable the rule; here the construct that raises it can
          # simply be removed, and a heredoc reads better than twenty echoes.
          cat >> "${GITHUB_STEP_SUMMARY}" <<'SUMMARY'
          ## Production applied Contracts 212 through 218

          This job applied the boundary and ran its own postflight. That postflight
          is NOT the evidence this repository records: a job reporting on its own
          write is not independent. Before updating any machine record, take a
          SEPARATE read-only query against the Production project and read:

          - the ledger holds 217 rows ending `20260824090000_web_push_channel`;
          - every player-owned count is unchanged from `before.json` in this run's artifact;
          - `predictor_internal.reminder_sender_configuration()` reports `secrets_present` false,
            so the newly scheduled dispatch job refuses and posts nothing;
          - both publication gates are still false and Euro publication is still hidden.

          Then write `config/production-hosted-contract.json` BY HAND from that query.
          `promotionAuthorised` stays `false`: it is a property of the record, pinned
          there by `check-hosted-migration-inventory.mjs` and
          `production-hosted-contract-expectations.mjs`, and not a statement about
          whether this promotion happened.
          SUMMARY

      - name: Restore the held-back migrations in the runner
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "${WORK_DIR}/moved-files.txt" ]; then
            while IFS= read -r file; do
              [ -n "${file}" ] || continue
              filename="$(basename "${file}")"
              if [ -e "${WORK_DIR}/later-migrations/${filename}" ]; then
                mv "${WORK_DIR}/later-migrations/${filename}" "${file}"
              fi
            done < "${WORK_DIR}/moved-files.txt"
          fi

      - name: Upload rollout evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: production-211-to-218-rollout-evidence
          path: |
            /tmp/production-211-to-218-rollout/before.json
            /tmp/production-211-to-218-rollout/after.json
            /tmp/production-211-to-218-rollout/boundary-state.json
            /tmp/production-211-to-218-rollout/boundary.txt
            /tmp/production-211-to-218-rollout/dry-run.txt
            /tmp/production-211-to-218-rollout/destructive-guard.txt
          retention-days: 7
          if-no-files-found: error
