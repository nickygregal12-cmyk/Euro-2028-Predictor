name: Contract 134 seed evidence note fix

on:
  push:
    branches:
      - feature/provider-enrichment-foundation-contract-134
    paths:
      - '.github/workflows/contract134-seed-note-fix.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/provider-enrichment-foundation-contract-134
          fetch-depth: 0

      - name: Correct the seed review evidence note
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          seed = Path('e2e/seed-contract.ts')
          text = seed.read_text()
          old = 'Exact-head Database parity and Browser E2E both passed on the Contract-133 PR before this marker was raised.'
          new = 'Exact-head Database parity and Browser E2E both passed on the Contract-134 branch candidate before this marker was raised.'
          if old not in text:
              raise SystemExit('expected Contract 133 seed evidence sentence not found')
          seed.write_text(text.replace(old, new, 1))
          PY

      - name: Commit and push corrected evidence note
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add e2e/seed-contract.ts
          git commit -m 'Contract 134: correct seed verification evidence note'
          git push origin HEAD:feature/provider-enrichment-foundation-contract-134
