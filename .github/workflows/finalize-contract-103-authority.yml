name: Finalize contract 103 authority

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'claude/lms-restart-lifecycle'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/lms-restart-lifecycle

      - name: Align contract authority
        run: python scripts/finalize-contract-103-authority-once.py

      - name: Commit authority alignment
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add config/deployment-contract.json e2e/seed-contract.ts tests/database-parity/liveCompetitionConflictTargets.test.ts
          git diff --cached --check
          git commit -m 'Align contract 103 authority with public-private lineage'
          git push origin HEAD:claude/lms-restart-lifecycle
