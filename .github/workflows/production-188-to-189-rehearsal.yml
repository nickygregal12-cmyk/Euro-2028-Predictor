name: Production 188 to 189 rehearsal

# Read-only rehearsal of the Production contract boundary 188 -> 189, against a
# disposable restore of Production rather than against Production.
#
# WHY THIS BOUNDARY IS URGENT RATHER THAN ROUTINE. Contract 188 quarantined 37
# Production forecasts built on a broken provider identity, and declared that
# every evidence path reads `ai.valid_predictions`. Measured against the
# INSTALLED definitions, seven admin reads did not: four selected from
# `ai.predictions` and three counted `ai.bets`/`ai.bet_results` unfiltered, the
# publication gate joining `ai.bets` not at all. It is masked today only because
# `ai.prediction_results` holds zero rows — every quarantined forecast is still
# upcoming — and the earliest of them kicks off at 2026-08-14T19:00Z.
#
# THE BOUNDARY IS EXACTLY ONE MIGRATION. The dry run asserts that file by name
# and refuses a second, because "at least the one I expected" would pass while
# promoting something nobody approved.
#
# THE ASSERTION WORTH READING is the last one. Because the disposable target is
# a faithful copy of Production, this rehearsal calls the real admin reads on
# the real quarantined data, before and after the apply, and requires the
# numbers to MOVE: 92 upcoming forecasts become 55, 49 open bets become 14, and
# the count of invalidated prediction ids appearing in the upcoming read falls
# from 37 to 0. A rehearsal that only proved the migration applies would not
# have caught a filter that silently matched nothing.
#
# WHAT THIS DOES NOT DO: it makes no provider request, changes no cron schedule,
# does not touch `ai.api_budget.collection_enabled` — which is `true` on
# Production and must stay so, this being an evidence-read change rather than a
# provider-custody one — and writes nothing whatever to Production. Production
# is read through dumps only.

on:
  workflow_dispatch:
    inputs:
      project_ref:
        description: Exact Production project ref confirmation
        required: true
      confirmation:
        description: Type REHEARSE-PRODUCTION-188-TO-189 to proceed
        required: true
      backup_run_id:
        description: Run id of the successful FRESH Production backup
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: production-188-to-189-rehearsal
  cancel-in-progress: false

env:
  EXPECTED_PROJECT_REF: vkfnsqdyhvtwyqkisxhk
  FORBIDDEN_DEVELOPMENT_REF: iouzoutneyjpugbbtdem
  CONFIRMATION_PHRASE: REHEARSE-PRODUCTION-188-TO-189
  SOURCE_CONTRACT: '188'
  SOURCE_VERSION: '20260813100000'
  SOURCE_NAME: ai_lab_multi_model_evidence
  TARGET_CONTRACT: '189'
  TARGET_VERSION: '20260813215920'
  TARGET_NAME: ai_quarantined_evidence_reads
  WORK_DIR: /tmp/production-188-to-189-rehearsal
  LOCAL_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres

jobs:
  rehearse:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Refuse an unsafe dispatch or repository state
        env:
          INPUT_PROJECT_REF: ${{ inputs.project_ref }}
          INPUT_CONFIRMATION: ${{ inputs.confirmation }}
        shell: bash
        run: |
          set -euo pipefail
          [ "${INPUT_CONFIRMATION}" = "${CONFIRMATION_PHRASE}" ] || {
            echo "ERROR: confirmation phrase does not match ${CONFIRMATION_PHRASE}."
            exit 1
          }
          if [ "${INPUT_PROJECT_REF}" = "${FORBIDDEN_DEVELOPMENT_REF}" ]; then
            echo 'ERROR: that is the Development project.'
            exit 1
          fi
          [ "${INPUT_PROJECT_REF}" = "${EXPECTED_PROJECT_REF}" ] || {
            echo 'ERROR: project ref confirmation does not name the Production project.'
            exit 1
          }
          [ -z "$(git status --porcelain=v1 --untracked-files=all)" ] || {
            echo 'ERROR: checkout is not clean.'
            exit 1
          }
          mkdir -p "${WORK_DIR}"

      - name: Prove a successful FRESH backup exists before Production is read
        env:
          GH_TOKEN: ${{ github.token }}
          BACKUP_RUN_ID: ${{ inputs.backup_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          # This rehearsal is read-only against Production, so the backup is not
          # what protects THIS run. It is required at the FIRST step of the
          # sequence because it protects the rollout this rehearsal authorises,
          # and requiring it first is what stops "take a backup first" from
          # being a rule that lasts only as long as the person in a hurry
          # remembers it. Checked against the API rather than asserted.
          json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${BACKUP_RUN_ID}")"
          conclusion="$(printf '%s' "${json}" | jq -r '.conclusion')"
          path="$(printf '%s' "${json}" | jq -r '.path')"
          created="$(printf '%s' "${json}" | jq -r '.created_at')"
          [ "${conclusion}" = 'success' ] || {
            echo "ERROR: backup run ${BACKUP_RUN_ID} concluded '${conclusion}', not success."
            exit 1
          }
          [ "${path}" = '.github/workflows/production-backup.yml' ] || {
            echo "ERROR: backup run ${BACKUP_RUN_ID} is ${path}, not the Production backup workflow."
            exit 1
          }
          echo "Backup run ${BACKUP_RUN_ID} verified: success, ${path}, created ${created}."

      - name: Prove the repository holds exactly the approved contract 189
        shell: bash
        run: |
          set -euo pipefail
          committed="$(git ls-files 'supabase/migrations/*.sql' | wc -l | tr -d ' ')"
          [ "${committed}" = "${TARGET_CONTRACT}" ] || {
            echo "ERROR: repository holds ${committed} migrations, expected ${TARGET_CONTRACT}."
            echo 'If another migration has landed on main, the approved boundary has moved.'
            exit 1
          }
          declared="$(node -p "require('./config/deployment-contract.json').requiredMigrationCount")"
          [ "${declared}" = "${TARGET_CONTRACT}" ] || {
            echo "ERROR: deployment contract declares ${declared}, expected ${TARGET_CONTRACT}."
            exit 1
          }
          newest="$(git ls-files 'supabase/migrations/*.sql' | sort | tail -1)"
          [ "$(basename "${newest}")" = "${TARGET_VERSION}_${TARGET_NAME}.sql" ] || {
            echo "ERROR: newest migration is $(basename "${newest}"), expected ${TARGET_VERSION}_${TARGET_NAME}.sql."
            exit 1
          }
          echo "Repository is exactly contract ${TARGET_CONTRACT}."

      - name: Prove the one migration in the range is additive, as a GATE
        shell: bash
        run: |
          set -euo pipefail
          files=''
          for file in $(git ls-files 'supabase/migrations/*.sql' | sort); do
            version="$(basename "${file}")"
            version="${version:0:14}"
            if [[ "${version}" > "${SOURCE_VERSION}" && ! "${version}" > "${TARGET_VERSION}" ]]; then
              files="${files} ${file}"
            fi
          done
          # Declared, not rewritten: the migration list is split on purpose; quoting passes one argument, not many. This is a spent one-shot promotion
          # script; changing what it DOES to satisfy a style rule would edit the
          # record of a past production apply. shellcheck only began seeing it
          # when SHA-pinning marked the file changed, so it is pre-existing.
          # shellcheck disable=SC2086
          count="$(printf '%s\n' ${files} | grep -c . || true)"
          [ "${count}" = "1" ] || {
            echo "ERROR: the range holds ${count} migrations, expected exactly 1."
            # Declared, not rewritten: the migration list is split on purpose; quoting passes one argument, not many. This is a spent one-shot promotion
            # script; changing what it DOES to satisfy a style rule would edit the
            # record of a past production apply. shellcheck only began seeing it
            # when SHA-pinning marked the file changed, so it is pre-existing.
            # shellcheck disable=SC2086
            printf '%s\n' ${files}
            exit 1
          }
          echo 'The one migration being promoted:'
          # Declared, not rewritten: the migration list is split on purpose; quoting passes one argument, not many. This is a spent one-shot promotion
          # script; changing what it DOES to satisfy a style rule would edit the
          # record of a past production apply. shellcheck only began seeing it
          # when SHA-pinning marked the file changed, so it is pre-existing.
          # shellcheck disable=SC2086
          printf '  %s\n' ${files}
          # Declared, not rewritten: the migration list is split on purpose; quoting passes one argument, not many. This is a spent one-shot promotion
          # script; changing what it DOES to satisfy a style rule would edit the
          # record of a past production apply. shellcheck only began seeing it
          # when SHA-pinning marked the file changed, so it is pre-existing.
          # shellcheck disable=SC2086
          node scripts/check-migration-additive.mjs ${files}
          echo 'It is additive.'

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.22.2

      - uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        with:
          version: 2.109.1
          github-token: ${{ github.token }}

      # The PostgreSQL 17 client is required: Ubuntu's default 16 `pg_dump`
      # refuses against a 17.x server. Both files in the 172 -> 174 pair omitted
      # this and the rehearsal died on `supabase: command not found`.
      - name: Install PostgreSQL 17 client tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17

      - name: Preflight the Production secret without printing it
        env:
          SUPABASE_PROD_DB_URL: ${{ secrets.SUPABASE_PROD_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${SUPABASE_PROD_DB_URL}" ] || {
            echo 'ERROR: repository secret SUPABASE_PROD_DB_URL is not set.'
            exit 1
          }
          case "${SUPABASE_PROD_DB_URL}" in
            *"${FORBIDDEN_DEVELOPMENT_REF}"*)
              echo 'ERROR: Production secret resolves to Development.'
              exit 1
              ;;
            *"${EXPECTED_PROJECT_REF}"*) ;;
            *)
              echo 'ERROR: Production secret does not name the expected Production project.'
              exit 1
              ;;
          esac

      - name: Prove the live source is exactly contract 188 (read-only)
        env:
          SUPABASE_PROD_DB_URL: ${{ secrets.SUPABASE_PROD_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          psql "${SUPABASE_PROD_DB_URL}" -X -q -v ON_ERROR_STOP=1 -A -t \
            -f - > "${WORK_DIR}/live-source.json" <<'SOURCE_SQL'
            select json_build_object(
              'migration_count', (select count(*) from supabase_migrations.schema_migrations),
              'latest_version', (select version from supabase_migrations.schema_migrations order by version desc limit 1),
              'latest_name', (select name from supabase_migrations.schema_migrations order by version desc limit 1),
              'quarantined', (select count(*) from ai.prediction_invalidations),
              'collection_enabled', (select collection_enabled from ai.api_budget limit 1),
              'cron_jobs', (select count(*) from cron.job),
              'ai_odds_cron_jobs', (select count(*) from cron.job where jobname like 'ai-odds%')
            )
          SOURCE_SQL
          cat "${WORK_DIR}/live-source.json"

          SOURCE_FILE="${WORK_DIR}/live-source.json" node --input-type=module <<'NODE'
          import fs from 'node:fs'
          const live = JSON.parse(fs.readFileSync(process.env.SOURCE_FILE, 'utf8'))
          for (const [key, want] of Object.entries({
            migration_count: Number(process.env.SOURCE_CONTRACT),
            latest_version: process.env.SOURCE_VERSION,
            latest_name: process.env.SOURCE_NAME,
          })) {
            if (String(live[key]) !== String(want)) {
              console.error(`ERROR: live Production ${key} is ${live[key]}, expected ${want}.`)
              process.exit(1)
            }
          }
          // Deliberately NOT required to be disabled. Contract 189 changes
          // admin evidence reads and no provider custody, so switching paid
          // collection off for it would be an unrelated production change made
          // by a migration lane. It is recorded and asserted unchanged instead.
          console.log(`Live Production is exactly contract ${live.migration_count}.`)
          console.log(`Paid collection is ${live.collection_enabled}; ${live.ai_odds_cron_jobs} ai-odds jobs of ${live.cron_jobs} total.`)
          console.log(`${live.quarantined} forecasts are quarantined.`)
          NODE

      - name: Take a fresh Production dump and restore it to a disposable local target
        env:
          SUPABASE_PROD_DB_URL: ${{ secrets.SUPABASE_PROD_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          supabase init --force --workdir "${WORK_DIR}" >/dev/null 2>&1 || true
          supabase start --workdir "${WORK_DIR}"

          BUNDLE="${WORK_DIR}/bundle"
          ROLLOUT="${GITHUB_WORKSPACE}/scripts/database-rollout"
          mkdir -p "${BUNDLE}"

          supabase db dump --db-url "${SUPABASE_PROD_DB_URL}" \
            --file "${BUNDLE}/roles.sql" --role-only
          supabase db dump --db-url "${SUPABASE_PROD_DB_URL}" \
            --file "${BUNDLE}/schema.sql"
          supabase db dump --db-url "${SUPABASE_PROD_DB_URL}" \
            --file "${BUNDLE}/data.sql" --use-copy --data-only \
            -x storage.buckets_vectors -x storage.vector_indexes
          /usr/lib/postgresql/17/bin/pg_dump \
            --dbname "${SUPABASE_PROD_DB_URL}" \
            --schema supabase_migrations --no-owner --no-privileges \
            --file "${BUNDLE}/migration-history.sql"

          for required in roles.sql schema.sql data.sql migration-history.sql; do
            [ -s "${BUNDLE}/${required}" ] || {
              echo "ERROR: dump is empty or missing: ${BUNDLE}/${required}"
              exit 1
            }
          done

          grep -Eq '(COPY|INSERT INTO)[[:space:]]+"?auth"?\."?users"?' "${BUNDLE}/data.sql" || {
            echo 'ERROR: data.sql does not contain auth.users; this is not a faithful copy.'
            exit 1
          }
          # This boundary is about quarantined evidence, so the quarantine
          # ledger and the bets built on it are required BY NAME. A dump that
          # dropped them would make the whole rehearsal vacuous while passing.
          grep -Eq '(COPY|INSERT INTO)[[:space:]]+"?ai"?\."?prediction_invalidations"?' "${BUNDLE}/data.sql" || {
            echo 'ERROR: data.sql does not contain ai.prediction_invalidations; the quarantine did not come across.'
            exit 1
          }
          grep -Eq '(COPY|INSERT INTO)[[:space:]]+"?ai"?\."?bets"?' "${BUNDLE}/data.sql" || {
            echo 'ERROR: data.sql does not contain ai.bets.'
            exit 1
          }

          psql "${LOCAL_DB_URL}" -X --single-transaction -v ON_ERROR_STOP=1 --file "${BUNDLE}/roles.sql"
          psql "${LOCAL_DB_URL}" -X --single-transaction -v ON_ERROR_STOP=1 \
            --file "${ROLLOUT}/prepare-disposable-restore-target.sql"
          psql "${LOCAL_DB_URL}" -X --single-transaction -v ON_ERROR_STOP=1 --file "${BUNDLE}/schema.sql"
          psql "${LOCAL_DB_URL}" -X --single-transaction -v ON_ERROR_STOP=1 \
            --command 'SET session_replication_role = replica' --file "${BUNDLE}/data.sql"
          psql "${LOCAL_DB_URL}" -X --single-transaction -v ON_ERROR_STOP=1 \
            --file "${ROLLOUT}/managed-schema-customizations.sql"
          psql "${LOCAL_DB_URL}" -X --single-transaction -v ON_ERROR_STOP=1 --file "${BUNDLE}/migration-history.sql"

          restored="$(psql "${LOCAL_DB_URL}" -X -q -v ON_ERROR_STOP=1 -A -t -c \
            'select count(*) from supabase_migrations.schema_migrations')"
          [ "${restored}" = "${SOURCE_CONTRACT}" ] || {
            echo "ERROR: restored target holds ${restored} migrations, expected ${SOURCE_CONTRACT}."
            exit 1
          }
          echo "Disposable target restored at contract ${restored}."

      - name: Record what the copy answers BEFORE anything is applied
        shell: bash
        run: |
          set -euo pipefail
          # The real admin reads, on the real quarantined data, through the same
          # competition-admin gate a browser would use. These are the numbers
          # the apply has to move.
          psql "${LOCAL_DB_URL}" -X -q -v ON_ERROR_STOP=1 -A -t \
            -f - <<'BEFORE_SQL' | grep '^{' | tail -1 > "${WORK_DIR}/before.json"
            -- Session-level rather than transaction-local: the statement that
            -- follows is its own transaction. The output is filtered to the
            -- line that starts a JSON object, so a command tag or the echoed
            -- claim cannot end up in the file.
            select set_config('request.jwt.claims',
              '{"sub":"00000000-0000-0000-0000-000000000000","role":"authenticated","app_metadata":{"admin_role":"super_admin"}}',
              false);
            select jsonb_build_object(
              'upcoming_rows', jsonb_array_length(public.admin_ai_upcoming_predictions(null, 200)),
              'upcoming_invalid', (
                select count(*) from jsonb_array_elements(public.admin_ai_upcoming_predictions(null, 200)) e
                  join ai.prediction_invalidations i on i.prediction_id = (e ->> 'id')::uuid),
              'recent_rows', jsonb_array_length(public.admin_ai_recent_results(null, 200)),
              'dashboard_graded', public.admin_ai_dashboard(null) -> 'performance' ->> 'graded',
              'breakdown_n', public.admin_ai_performance_breakdown(null) -> 'overall' ->> 'n',
              'open_bets', public.admin_ai_betting_dashboard(null) -> 'open' ->> 'open_bets',
              'open_exposure', public.admin_ai_betting_dashboard(null) -> 'open' ->> 'exposure',
              'settled_bets', public.admin_ai_betting_dashboard(null) -> 'profit' ->> 'settled_bets',
              'gate_settled', public.admin_ai_betting_gate_status() -> 'settled_bets' ->> 'value',
              'predictions', (select count(*) from ai.predictions),
              'valid_predictions', (select count(*) from ai.valid_predictions),
              'invalidations', (select count(*) from ai.prediction_invalidations),
              'bets', (select count(*) from ai.bets),
              'invalid_linked_bets', (
                select count(*) from ai.bets b
                 where exists (select 1 from ai.prediction_invalidations i
                                where i.prediction_id = b.prediction_id)),
              'recommendations', (select count(*) from ai.recommendations),
              'api_usage', (select count(*) from ai.api_usage),
              'collection_enabled', (select collection_enabled from ai.api_budget limit 1),
              'auth_users', (select count(*) from auth.users),
              'entries', (select count(*) from public.entries),
              'match_predictions', (select count(*) from public.match_predictions),
              'season_predictions', (select count(*) from public.season_predictions),
              'score_events', (select count(*) from public.score_events),
              'bonus_competitions', (select count(*) from public.bonus_competitions)
            )
          BEFORE_SQL
          cat "${WORK_DIR}/before.json"

          BEFORE_FILE="${WORK_DIR}/before.json" node --input-type=module <<'NODE'
          import fs from 'node:fs'
          const before = JSON.parse(fs.readFileSync(process.env.BEFORE_FILE, 'utf8'))
          // The rehearsal must start from the defect, or it proves nothing. If
          // the copy shows no quarantined forecast reaching the upcoming read,
          // either the data did not come across or the boundary is already
          // closed, and in both cases the comparison below is meaningless.
          if (Number(before.upcoming_invalid) < 1) {
            console.error('ERROR: no quarantined forecast reaches the upcoming read on the copy.')
            console.error('There is nothing here for contract 189 to remove; stop and find out why.')
            process.exit(1)
          }
          if (Number(before.invalid_linked_bets) < 1) {
            console.error('ERROR: no bet on the copy references a quarantined forecast.')
            process.exit(1)
          }
          console.log(`Before: ${before.upcoming_rows} upcoming (${before.upcoming_invalid} quarantined), ${before.open_bets} open bets, ${before.invalid_linked_bets} of them quarantine-linked.`)
          NODE

      - name: Rehearse the forward apply on the disposable target
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${WORK_DIR}/later-migrations"
          : > "${WORK_DIR}/moved-files.txt"
          for file in $(git ls-files 'supabase/migrations/*.sql' | sort); do
            filename="$(basename "${file}")"
            version="${filename:0:14}"
            if [[ "${version}" > "${TARGET_VERSION}" ]]; then
              mv "${file}" "${WORK_DIR}/later-migrations/${filename}"
              printf '%s\n' "${file}" >> "${WORK_DIR}/moved-files.txt"
            fi
          done
          if [ -s "${WORK_DIR}/moved-files.txt" ]; then
            echo 'Held back as ABOVE the pinned target, not rehearsed here:'
            cat "${WORK_DIR}/moved-files.txt"
          fi

          supabase db push --db-url "${LOCAL_DB_URL}" --dry-run \
            > "${WORK_DIR}/dry-run.txt" 2>&1
          cat "${WORK_DIR}/dry-run.txt"

          grep -oE '[0-9]{14}_[A-Za-z0-9_-]+\.sql' "${WORK_DIR}/dry-run.txt" \
            | awk '!seen[$0]++' | sort > "${WORK_DIR}/pending.txt"

          printf '%s\n' "${TARGET_VERSION}_${TARGET_NAME}.sql" > "${WORK_DIR}/expected.txt"

          if ! diff -u "${WORK_DIR}/expected.txt" "${WORK_DIR}/pending.txt"; then
            echo 'ERROR: the rehearsal dry run is not exactly contract 189.'
            exit 1
          fi
          echo 'Dry run is exactly the one approved migration.'

          supabase db push --db-url "${LOCAL_DB_URL}" 2>&1 | tee "${WORK_DIR}/apply.txt"

      - name: Restore the repository migration tree in the runner
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "${WORK_DIR}/moved-files.txt" ]; then
            while IFS= read -r file; do
              [ -n "${file}" ] || continue
              filename="$(basename "${file}")"
              if [ -e "${WORK_DIR}/later-migrations/${filename}" ]; then
                mv "${WORK_DIR}/later-migrations/${filename}" "${file}"
              fi
            done < "${WORK_DIR}/moved-files.txt"
          fi

      - name: Verify the rehearsed result on Production's own quarantined data
        shell: bash
        run: |
          set -euo pipefail
          psql "${LOCAL_DB_URL}" -X -q -v ON_ERROR_STOP=1 -A -t \
            -f - <<'AFTER_SQL' | grep '^{' | tail -1 > "${WORK_DIR}/after.json"
            select set_config('request.jwt.claims',
              '{"sub":"00000000-0000-0000-0000-000000000000","role":"authenticated","app_metadata":{"admin_role":"super_admin"}}',
              false);
            select (
              jsonb_build_object(
                'migration_count', (select count(*) from supabase_migrations.schema_migrations),
                'latest_version', (select version from supabase_migrations.schema_migrations order by version desc limit 1),
                'latest_name', (select name from supabase_migrations.schema_migrations order by version desc limit 1),
                'target_row_present', (
                  select count(*) from supabase_migrations.schema_migrations
                   where version = '20260813215920'),

                -- The new view, and that no browser role can reach it.
                'valid_bets_view', (
                  select count(*) from pg_views
                   where schemaname = 'ai' and viewname = 'valid_bets'),
                'valid_bets_browser_grants', (
                  select count(*) from information_schema.role_table_grants
                   where table_schema = 'ai' and table_name = 'valid_bets'
                     and grantee in ('anon','authenticated')),
                'valid_predictions_browser_grants', (
                  select count(*) from information_schema.role_table_grants
                   where table_schema = 'ai' and table_name = 'valid_predictions'
                     and grantee in ('anon','authenticated')),

                -- Installed definitions, not migration text. Zero admin AI read
                -- may reach the base tables; the decision log is the one stated
                -- exception and must name the quarantine to earn it.
                'reads_base_tables', (
                  select count(*) from pg_proc p join pg_namespace n on n.oid = p.pronamespace
                   where n.nspname = 'public' and p.proname like 'admin\_ai\_%'
                     and p.proname <> 'admin_ai_recommendation_log'
                     -- Line comments stripped first: a comment that NAMES a
                     -- base table while explaining why the function does not
                     -- read it is prose, not a read.
                     and (regexp_replace(pg_get_functiondef(p.oid), '--[^\n]*', '', 'g') ~ '\mai\.predictions\M'
                       or regexp_replace(pg_get_functiondef(p.oid), '--[^\n]*', '', 'g') ~ '\mai\.bets\M')),
                'prediction_reads_on_valid', (
                  select count(*) from pg_proc p join pg_namespace n on n.oid = p.pronamespace
                   where n.nspname = 'public'
                     and p.proname in ('admin_ai_dashboard','admin_ai_performance_breakdown',
                                       'admin_ai_recent_results','admin_ai_upcoming_predictions')
                     and pg_get_functiondef(p.oid) like '%ai.valid_predictions%'),
                'betting_reads_on_valid', (
                  select count(*) from pg_proc p join pg_namespace n on n.oid = p.pronamespace
                   where n.nspname = 'public'
                     and p.proname in ('admin_ai_betting_dashboard','admin_ai_evidence_by_market',
                                       'admin_ai_betting_gate_status')
                     and pg_get_functiondef(p.oid) like '%ai.valid_bets%'),
                'log_names_quarantine', (
                  select count(*) from pg_proc p join pg_namespace n on n.oid = p.pronamespace
                   where n.nspname = 'public' and p.proname = 'admin_ai_recommendation_log'
                     and pg_get_functiondef(p.oid) like '%prediction_invalidations%'),

                -- Security shape, unchanged by construction and proven anyway.
                'definer_count', (
                  select count(*) from pg_proc p join pg_namespace n on n.oid = p.pronamespace
                   where n.nspname = 'public' and p.proname like 'admin\_ai\_%'
                     and p.prosecdef
                     and exists (select 1 from unnest(p.proconfig) c where c like 'search\_path=%')),
                'admin_ai_total', (
                  select count(*) from pg_proc p join pg_namespace n on n.oid = p.pronamespace
                   where n.nspname = 'public' and p.proname like 'admin\_ai\_%'),
                'authenticated_execute', (
                  select count(*) from information_schema.role_routine_grants
                   where specific_schema = 'public' and routine_name like 'admin\_ai\_%'
                     and grantee = 'authenticated'),
                'admin_gated', (
                  select count(*) from pg_proc p join pg_namespace n on n.oid = p.pronamespace
                   where n.nspname = 'public' and p.proname like 'admin\_ai\_%'
                     and pg_get_functiondef(p.oid) like '%require_competition_admin%'),
                'anon_execute', (
                  select count(*) from information_schema.role_routine_grants
                   where specific_schema = 'public' and routine_name like 'admin\_ai\_%'
                     and grantee = 'anon')
              ) || jsonb_build_object(
                -- The eight replaced reads, called for real.
                'upcoming_rows', jsonb_array_length(public.admin_ai_upcoming_predictions(null, 200)),
                'upcoming_invalid', (
                  select count(*) from jsonb_array_elements(public.admin_ai_upcoming_predictions(null, 200)) e
                    join ai.prediction_invalidations i on i.prediction_id = (e ->> 'id')::uuid),
                'recent_rows', jsonb_array_length(public.admin_ai_recent_results(null, 200)),
                'recent_invalid', (
                  select count(*) from jsonb_array_elements(public.admin_ai_recent_results(null, 200)) e
                    join ai.prediction_invalidations i on i.prediction_id = (e ->> 'id')::uuid),
                'dashboard_graded', public.admin_ai_dashboard(null) -> 'performance' ->> 'graded',
                'dashboard_basis', public.admin_ai_dashboard(null) ->> 'evidence_basis',
                'breakdown_n', public.admin_ai_performance_breakdown(null) -> 'overall' ->> 'n',
                'open_bets', public.admin_ai_betting_dashboard(null) -> 'open' ->> 'open_bets',
                'open_exposure', public.admin_ai_betting_dashboard(null) -> 'open' ->> 'exposure',
                'settled_bets', public.admin_ai_betting_dashboard(null) -> 'profit' ->> 'settled_bets',
                'gate_settled', public.admin_ai_betting_gate_status() -> 'settled_bets' ->> 'value',

                -- Nothing was rewritten to make any of that true.
                'predictions', (select count(*) from ai.predictions),
                'valid_predictions', (select count(*) from ai.valid_predictions),
                'invalidations', (select count(*) from ai.prediction_invalidations),
                'bets', (select count(*) from ai.bets),
                'invalid_linked_bets', (
                  select count(*) from ai.bets b
                   where exists (select 1 from ai.prediction_invalidations i
                                  where i.prediction_id = b.prediction_id)),
                'recommendations', (select count(*) from ai.recommendations),
                'api_usage', (select count(*) from ai.api_usage),
                'collection_enabled', (select collection_enabled from ai.api_budget limit 1),
                'auth_users', (select count(*) from auth.users),
                'entries', (select count(*) from public.entries),
                'match_predictions', (select count(*) from public.match_predictions),
                'season_predictions', (select count(*) from public.season_predictions),
                'score_events', (select count(*) from public.score_events),
                'bonus_competitions', (select count(*) from public.bonus_competitions)
              )
            )
          AFTER_SQL
          cat "${WORK_DIR}/after.json"

          BEFORE_FILE="${WORK_DIR}/before.json" AFTER_FILE="${WORK_DIR}/after.json" \
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          const before = JSON.parse(fs.readFileSync(process.env.BEFORE_FILE, 'utf8'))
          const after = JSON.parse(fs.readFileSync(process.env.AFTER_FILE, 'utf8'))
          const problems = []
          const expect = (key, want, why) => {
            if (String(after[key]) !== String(want)) problems.push(`${key} is ${after[key]}, expected ${want} — ${why}`)
          }

          expect('migration_count', Number(process.env.TARGET_CONTRACT), 'the boundary is one migration')
          expect('latest_version', process.env.TARGET_VERSION, 'the newest applied row must be the target')
          expect('latest_name', process.env.TARGET_NAME, 'named rather than counted')
          expect('target_row_present', 1, 'the ledger must NAME the row rather than merely hold 189 of them')

          expect('valid_bets_view', 1, 'ai.valid_bets must exist')
          expect('valid_bets_browser_grants', 0, 'no browser role may reach it')
          expect('valid_predictions_browser_grants', 0, 'nor contract 188s view')

          expect('reads_base_tables', 0, 'no admin AI read may reach ai.predictions or ai.bets')
          expect('prediction_reads_on_valid', 4, 'all four prediction reads name ai.valid_predictions')
          expect('betting_reads_on_valid', 3, 'all three betting reads name ai.valid_bets')
          expect('log_names_quarantine', 1, 'the decision log labels withdrawn rows rather than dropping them')
          expect('anon_execute', 0, 'anonymous callers reach none of them')

          // Measured on Production at contract 188: thirteen admin AI reads,
          // all SECURITY DEFINER with an empty search_path, all gated, all
          // executable by `authenticated` and none by `anon`. Contract 189
          // replaces eight of them and adds none, so all four figures are
          // asserted EXACTLY rather than as a floor.
          expect('admin_ai_total', 13, 'contract 189 adds no admin AI read')
          expect('definer_count', 13, 'every admin AI read stays SECURITY DEFINER with an empty search_path')
          expect('admin_gated', 13, 'every admin AI read still calls require_competition_admin')
          expect('authenticated_execute', 13, 'the authenticated EXECUTE boundary is unchanged')

          // THE POINT OF THE REHEARSAL. Production's own quarantined forecasts
          // must disappear from the reads, by id rather than by count.
          if (Number(after.upcoming_invalid) !== 0) {
            problems.push(`${after.upcoming_invalid} quarantined forecasts still reach the upcoming read`)
          }
          if (Number(after.recent_invalid) !== 0) {
            problems.push(`${after.recent_invalid} quarantined forecasts still reach recent results`)
          }
          const movedUpcoming = Number(before.upcoming_rows) - Number(after.upcoming_rows)
          if (movedUpcoming !== Number(before.upcoming_invalid)) {
            problems.push(`the upcoming read lost ${movedUpcoming} rows, expected exactly the ${before.upcoming_invalid} quarantined ones`)
          }
          const movedOpen = Number(before.open_bets) - Number(after.open_bets)
          if (movedOpen !== Number(before.invalid_linked_bets)) {
            problems.push(`open bets fell by ${movedOpen}, expected exactly the ${before.invalid_linked_bets} quarantine-linked ones`)
          }

          // And nothing underneath moved at all.
          for (const key of ['predictions', 'valid_predictions', 'invalidations', 'bets',
                             'invalid_linked_bets', 'recommendations', 'api_usage',
                             'collection_enabled', 'auth_users', 'entries', 'match_predictions',
                             'season_predictions', 'score_events', 'bonus_competitions']) {
            if (String(before[key]) !== String(after[key])) {
              problems.push(`${key} moved ${before[key]} -> ${after[key]}; contract 189 must write no row`)
            }
          }

          if (problems.length > 0) {
            console.error('REHEARSAL FAILED:')
            for (const problem of problems) console.error(`  - ${problem}`)
            process.exit(1)
          }

          console.log(`Rehearsed contract ${after.migration_count} on a faithful copy of Production.`)
          console.log(`Upcoming ${before.upcoming_rows} -> ${after.upcoming_rows}, quarantined in it ${before.upcoming_invalid} -> 0.`)
          console.log(`Open bets ${before.open_bets} -> ${after.open_bets}, exposure ${before.open_exposure} -> ${after.open_exposure}.`)
          console.log(`Every underlying count is unchanged, paid collection still ${after.collection_enabled}.`)
          NODE

      - name: Shred the plaintext dumps and stop the disposable target
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -d "${WORK_DIR}/bundle" ]; then
            find "${WORK_DIR}/bundle" -type f -exec shred -u {} + 2>/dev/null || true
            rm -rf "${WORK_DIR}/bundle"
          fi
          supabase stop --no-backup --workdir "${WORK_DIR}" || true
