name: Contract 132 proposal scope fix

on:
  push:
    branches:
      - feature/provider-initial-fixture-approval-contract-132

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/provider-initial-fixture-approval-contract-132
      - name: Scope proposal idempotence to the target tournament
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('supabase/migrations/20260807210812_provider_initial_fixture_approval.sql')
          s = p.read_text()
          old_unique = "  constraint provider_fixture_proposals_raw_fixture_unique\n    unique (raw_response_id, provider_fixture_id)"
          new_unique = "  constraint provider_fixture_proposals_raw_fixture_unique\n    unique (raw_response_id, tournament_id, provider_fixture_id)"
          old_conflict = "    on conflict (raw_response_id, provider_fixture_id) do nothing;"
          new_conflict = "    on conflict (raw_response_id, tournament_id, provider_fixture_id) do nothing;"
          if old_unique not in s:
              raise SystemExit('proposal unique constraint target not found')
          if old_conflict not in s:
              raise SystemExit('proposal ON CONFLICT target not found')
          s = s.replace(old_unique, new_unique, 1)
          s = s.replace(old_conflict, new_conflict, 1)
          p.write_text(s)
          PY
          git rm .github/workflows/_contract132-proposal-scope-fix.yml
      - name: Commit reviewed proposal-scope fix and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations/20260807210812_provider_initial_fixture_approval.sql
          git commit -m "fix: scope contract 132 proposals by tournament"
          git push origin HEAD:feature/provider-initial-fixture-approval-contract-132
