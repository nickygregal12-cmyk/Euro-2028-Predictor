name: One-off MatchTemporalState retirement

on:
  push:
    branches:
      - agent/retire-match-temporal-state
    paths:
      - scripts/retire-match-temporal-state.mjs
      - .github/workflows/one-off-retire-match-temporal-state.yml
  pull_request:
    branches:
      - agent/migrate-entry-lock-context
    paths:
      - scripts/retire-match-temporal-state.mjs
      - .github/workflows/one-off-retire-match-temporal-state.yml

permissions:
  contents: write

jobs:
  retire-temporal-state:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/retire-match-temporal-state
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply scoped retirement
        run: node scripts/retire-match-temporal-state.mjs
      - name: Validate patch hygiene
        run: git diff --check
      - name: Commit retirement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Retire legacy MatchTemporalState"
          git push origin HEAD:agent/retire-match-temporal-state
