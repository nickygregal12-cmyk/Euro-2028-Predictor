name: PR 920 stage-c manifest fix

on:
  push:
    branches:
      - agent/same-season-player-profile

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/same-season-player-profile
          persist-credentials: true
      - name: Add Contract 206 RPC to Stage C manifest and remove helper
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('docs/architecture/stage-c-schema-coverage.md')
          text = path.read_text()
          old = "- `get_season_player_profile`\n- `resolve_season_player`"
          new = "- `get_season_player_profile`\n- `get_season_player_profile_by_ref`\n- `resolve_season_player`"
          if old not in text:
              raise SystemExit('expected Stage C manifest anchor not found')
          if '`get_season_player_profile_by_ref`' in text:
              raise SystemExit('Stage C manifest already contains by-ref profile RPC')
          path.write_text(text.replace(old, new, 1))
          PY
          rm .github/workflows/pr920-stage-c-manifest-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/architecture/stage-c-schema-coverage.md .github/workflows/pr920-stage-c-manifest-fix.yml
          git commit -m "docs: register Contract 206 profile RPC in Stage C manifest"
          git push origin HEAD:agent/same-season-player-profile
