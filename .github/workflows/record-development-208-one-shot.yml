name: Generate Development 208 current-state surfaces

on:
  push:
    branches:
      - ops/record-development-208
    paths:
      - .github/workflows/record-development-208-one-shot.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ops/record-development-208
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.2

      - name: Generate and verify the canonical current-state surfaces
        shell: bash
        run: |
          set -euo pipefail
          [ "$(node -p "require('./config/deployment-contract.json').contractVersion")" = '208' ]
          [ "$(node -p "require('./config/development-hosted-contract.json').requiredMigrationCount")" = '208' ]
          [ "$(node -p "require('./config/production-hosted-contract.json').requiredMigrationCount")" = '205' ]
          npm run generate:now
          npm run check:now
          node scripts/check-hosted-migration-inventory.mjs
          npm run check:documentation-authorities

      - name: Commit generated output and remove this temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/record-development-208-one-shot.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add NOW.md docs/quality/current-status.md .github/workflows/record-development-208-one-shot.yml
          git diff --cached --check
          git commit -m 'Generate current state for Development Contract 208'
          git push origin HEAD:ops/record-development-208
