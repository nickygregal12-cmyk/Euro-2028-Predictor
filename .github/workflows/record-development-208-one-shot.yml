name: Record Development 208 one-shot

on:
  push:
    branches:
      - ops/record-development-208
    paths:
      - .github/workflows/record-development-208-one-shot.yml

permissions:
  contents: write

env:
  EXPECTED_PROJECT_REF: iouzoutneyjpugbbtdem
  FORBIDDEN_PRODUCTION_REF: vkfnsqdyhvtwyqkisxhk
  TARGET_CONTRACT: '208'
  TARGET_VERSION: '20260819130000'
  TARGET_NAME: cup_bracket_outcome_and_knockout_stage
  SOURCE_RUN_ID: '32312618799'
  SOURCE_HEAD_SHA: 0c489629d299c2e57bd0981d0b2b2b4f6b56c287

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ops/record-development-208
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.2

      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1
        with:
          version: 2.84.2

      - name: Verify hosted Development is exactly Contract 208
        env:
          SUPABASE_DEV_DB_URL: ${{ secrets.SUPABASE_DEV_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${SUPABASE_DEV_DB_URL}" ] || { echo 'ERROR: SUPABASE_DEV_DB_URL is missing.'; exit 1; }
          case "${SUPABASE_DEV_DB_URL}" in
            *"${FORBIDDEN_PRODUCTION_REF}"*) echo 'ERROR: Development secret resolves to Production.'; exit 1 ;;
            *"${EXPECTED_PROJECT_REF}"*) ;;
            *) echo 'ERROR: Development secret does not name the expected project.'; exit 1 ;;
          esac
          repository_contract="$(node -p "require('./config/deployment-contract.json').contractVersion")"
          [ "${repository_contract}" = "${TARGET_CONTRACT}" ] || { echo "ERROR: repository is ${repository_contract}, expected ${TARGET_CONTRACT}."; exit 1; }
          supabase migration list --db-url "${SUPABASE_DEV_DB_URL}" > /tmp/development-208-list.txt
          remote_count="$(awk -F'|' '$2 ~ /[0-9]/ { v=$2; gsub(/[^0-9]/,"",v); if (length(v)==14) print v }' /tmp/development-208-list.txt | wc -l | tr -d ' ')"
          remote_latest="$(awk -F'|' '$2 ~ /[0-9]/ { v=$2; gsub(/[^0-9]/,"",v); if (length(v)==14) print v }' /tmp/development-208-list.txt | tail -1)"
          [ "${remote_count}" = "${TARGET_CONTRACT}" ] || { echo "ERROR: Development is ${remote_count}, expected ${TARGET_CONTRACT}."; exit 1; }
          [ "${remote_latest}" = "${TARGET_VERSION}" ] || { echo "ERROR: Development latest is ${remote_latest}."; exit 1; }

      - name: Record Development 208 and align the live rollout authorities
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs'

          const recordPath = 'config/development-hosted-contract.json'
          const record = JSON.parse(fs.readFileSync(recordPath, 'utf8'))
          record.requiredMigrationCount = 208
          record.latestMigrationVersion = '20260819130000'
          record.latestMigrationName = 'cup_bracket_outcome_and_knockout_stage'
          record.verifiedAt = new Date().toISOString()
          record.evidence = {
            source:
              'Development fast-lane rollout run 32312618799 succeeded from exact main 0c489629d299c2e57bd0981d0b2b2b4f6b56c287. Independent read-only Supabase verification then named 208 ledger rows with newest 20260819130000 cup_bracket_outcome_and_knockout_stage. All Contract-205 protected counts remain unchanged: 24 auth users, 24 profiles, 34 entries, 64 season predictions, 756 match predictions, 8 season matchweek scores, 20 competition entrants, 0 bonus score events, 5 leagues, 39 league members, 1 Cup launch, 112 Cup fixtures and 578 season fixtures. Cron remains 14 jobs, ai.api_usage remains 0 and both publication gates remain false. The Contract-206 by-ref profile RPC and legacy profile RPC remain authenticated-only; the season Cup phase and bracket RPCs are authenticated-only; the installed phase definition uses the determinate split membership rule; the bracket emits the caller own outcome and limits knockout reads to playoff/knockout stages.',
            workflowRunId: 32312618799,
            repositoryHead: '0c489629d299c2e57bd0981d0b2b2b4f6b56c287',
            verificationSource: 'independent Supabase read-only query after successful fast-lane run'
          }
          delete record.productionContract
          delete record.productionPromotionAuthorised
          fs.writeFileSync(recordPath, `${JSON.stringify(record, null, 2)}\n`)

          const inventoryPath = 'docs/ops/ops-pending-migrations.md'
          let inventory = fs.readFileSync(inventoryPath, 'utf8')
          inventory = inventory.replace(
            /^## Current state — repository 208, Production 205, Development 205 \([^)]+\)$/m,
            '## Current state — repository 208, Production 205, Development 208 (20 August 2026)',
          )
          inventory = inventory.replace(
            '| Development Supabase `iouzoutneyjpugbbtdem` | **205** |',
            '| Development Supabase `iouzoutneyjpugbbtdem` | **208** |',
          )
          inventory = inventory.replace(
            /\*\*Three repository migrations are pending on both hosted environments\.\*\*[\s\S]*?The two cup migrations are numbered 207 and 208 rather than 206 and 207 because PR #920 landed first — a contract number is the migration's position in the chain, and #920's timestamp sorts before both of these\./,
            '**Development is level with the repository at Contract 208; Production remains at Contract 205 with exactly three migrations pending.** Contracts 206 through 208 were applied to Development by guarded fast-lane run 32312618799 and independently verified before this record was written. Production remains a separately gated promotion: encrypted backup, disposable-restore rehearsal and the exact 205-to-208 rollout are still required before it can move.',
          )
          inventory = inventory.replace(
            '| Netlify `euro28predictor` non-production contexts | **178 hosted declaration** |',
            '| Netlify `euro28predictor` non-production contexts | **208 hosted declaration** |',
          )
          inventory = inventory.replace(
            '| Netlify `euro28predictor` production | **178 hosted declaration** |',
            '| Netlify `euro28predictor` production | **205 hosted declaration** |',
          )
          inventory = inventory.replace(
            '- Development and Production each have **3** repository migration(s) still to apply. Development is the next authorised rollout lane; this does not authorise Production.',
            '- Development has no pending repository migration. Production has exactly **3** repository migrations still to apply, forming the controlled 205-to-208 promotion boundary.',
          )
          inventory = inventory.replace(
            '- Production promotion is **not authorised**, and that flag stayed fail-closed through the 198-to-205 rollout rather than being left open behind it. Production is level with Development here, not lower; when it is lower, that is a controlled state and not permission to apply anything.',
            '- Production remains below Development by design while the fresh backup, exact-head rehearsal and guarded rollout gates are completed; the gap is not itself permission to apply anything.',
          )
          fs.writeFileSync(inventoryPath, inventory)

          const netlifyPath = 'docs/ops/netlify-deploy-access.md'
          let netlify = fs.readFileSync(netlifyPath, 'utf8')
          for (const context of ['dev', 'branch-deploy', 'deploy-preview']) {
            netlify = netlify.replace(new RegExp(`\\| \\`${context}\\` \\| Development \\| \\d+ \\|`), `| \`${context}\` | Development | 208 |`)
          }
          netlify = netlify.replace(/\| `production` \| Production \| \d+ \|/, '| `production` | Production | 205 |')
          fs.writeFileSync(netlifyPath, netlify)
          NODE

          npm run generate:now
          npm run check:now
          node scripts/check-hosted-migration-inventory.mjs
          npm run check:documentation-authorities

      - name: Commit the verified record and remove this one-shot
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/record-development-208-one-shot.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add config/development-hosted-contract.json NOW.md docs/quality/current-status.md docs/ops/ops-pending-migrations.md docs/ops/netlify-deploy-access.md .github/workflows/record-development-208-one-shot.yml
          git diff --cached --check
          git commit -m 'Record Development at Contract 208'
          git push origin HEAD:ops/record-development-208
