name: Restack Contract 105 Cup split

on:
  push:
    branches:
      - claude/next-build-stage-aufrh6

permissions:
  contents: write

jobs:
  restack:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/next-build-stage-aufrh6
          fetch-depth: 0

      - name: Merge exact Contract 104 main
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main
          if ! git merge --no-edit origin/main; then
            conflicts="$(git diff --name-only --diff-filter=U | sort)"
            expected="$(printf '%s\n' AGENTS.md config/deployment-contract.json docs/ops/ops-pending-migrations.md docs/quality/current-status.md e2e/seed-contract.ts | sort)"
            test "$conflicts" = "$expected"
            git checkout --theirs AGENTS.md config/deployment-contract.json docs/ops/ops-pending-migrations.md docs/quality/current-status.md e2e/seed-contract.ts
            git add AGENTS.md config/deployment-contract.json docs/ops/ops-pending-migrations.md docs/quality/current-status.md e2e/seed-contract.ts
            git commit --no-edit
          fi

      - name: Apply Contract 105 integrity and authority restack
        run: python scripts/restack-contract-105-cup-split-once.py

      - name: Commit restacked Contract 105
        run: |
          set -euo pipefail
          git add AGENTS.md config/deployment-contract.json docs/ops/ops-pending-migrations.md docs/quality/current-status.md e2e/seed-contract.ts supabase/migrations/20260805010000_cup_split_group_tables.sql supabase/tests/156_cup_split_group_tables.sql tests/database-parity/cupSplitGroupTablesBoundary.test.ts
          git diff --cached --check
          git commit -m 'Contract 105: enforce split ancestry and derive the table'
          git push origin HEAD:claude/next-build-stage-aufrh6
