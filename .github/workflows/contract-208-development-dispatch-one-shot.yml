name: Contract 208 rollout dispatcher one-shot

# Temporary dispatcher only. It never connects to Supabase itself and never
# duplicates migration or backup logic. When this file first lands on main it
# dispatches two canonical workflow_dispatch-only workflows:
#   1. Development fast lane for repository Contract 208;
#   2. the read-only encrypted Production backup while Production is still 205.
# Each target workflow keeps all of its own guards and evidence requirements.
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/contract-208-development-dispatch-one-shot.yml

permissions:
  contents: read
  actions: write

jobs:
  dispatch-canonical-workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Refuse unless main is exactly Contract 208
        shell: bash
        run: |
          set -euo pipefail
          [ "${GITHUB_REF}" = 'refs/heads/main' ] || { echo 'ERROR: dispatcher runs only from main.'; exit 1; }
          git fetch --no-tags origin main
          [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" ] || { echo 'ERROR: HEAD is not exact origin/main.'; exit 1; }
          contract="$(node -p "require('./config/deployment-contract.json').requiredMigrationCount")"
          newest="$(basename "$(git ls-files 'supabase/migrations/*.sql' | sort | tail -1)")"
          production_contract="$(node -p "require('./config/production-hosted-contract.json').requiredMigrationCount")"
          [ "${contract}" = '208' ] || { echo "ERROR: repository contract is ${contract}, expected 208."; exit 1; }
          [ "${newest}" = '20260819130000_cup_bracket_outcome_and_knockout_stage.sql' ] || {
            echo "ERROR: newest migration is ${newest}; expected Contract 208 head."
            exit 1
          }
          [ "${production_contract}" = '205' ] || {
            echo "ERROR: committed Production record is ${production_contract}; expected source Contract 205."
            exit 1
          }

      - name: Dispatch the canonical Development fast lane
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api \
            --method POST \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/development-fast-lane-rollout.yml/dispatches" \
            -f ref='main' \
            -f 'inputs[project_ref]=iouzoutneyjpugbbtdem' \
            -f 'inputs[confirmation]=APPLY-DEVELOPMENT-FAST-LANE'
          echo 'Dispatched canonical Development fast-lane rollout for exact main Contract 208.'

      - name: Dispatch the canonical read-only encrypted Production backup
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api \
            --method POST \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/production-backup.yml/dispatches" \
            -f ref='main'
          echo 'Dispatched canonical Production backup; the target workflow is read-only against Production.'
