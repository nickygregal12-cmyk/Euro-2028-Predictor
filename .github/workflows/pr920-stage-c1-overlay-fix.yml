name: PR 920 Stage C1 overlay fix

on:
  push:
    branches:
      - agent/same-season-player-profile

permissions:
  contents: write

jobs:
  patch-overlay:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner (audit egress)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/same-season-player-profile
          persist-credentials: true
      - name: Register Contract 206 in Stage C1 overlay
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          overlay = Path('docs/architecture/stage-c1-schema-overlay.md')
          text = overlay.read_text()
          marker = "- `get_season_rank_history`\n- `get_season_rivalry`\n\nContracts 175 to 178 add five more"
          insertion = """- `get_season_rank_history`
- `get_season_rivalry`

Contract 206 adds one more taking `p_tournament_id`, with the same season-scoped
disposition. `get_season_player_profile_by_ref` addresses the target by that
season's `entries.id`, requires the caller to belong to the same season, emits
no target auth/profile UUID, writes nothing and changes no auth ownership.

- `get_season_player_profile_by_ref`

Contracts 175 to 178 add five more"""
          if '`get_season_player_profile_by_ref`' not in text:
              if text.count(marker) != 1:
                  raise SystemExit(f'expected exactly one overlay insertion point, found {text.count(marker)}')
              text = text.replace(marker, insertion, 1)
              overlay.write_text(text)

          test = Path('tests/scripts/stageC1SchemaOverlayCoverage.test.ts')
          source = test.read_text()
          if 'toHaveLength(93)' not in source:
              old = """    // reuse contract 94's ranking rather than adding a competitive authority.\n    expect(reviewedFunctions).toHaveLength(92)"""
              new = """    // reuse contract 94's ranking rather than adding a competitive authority.\n    // Raised 92 → 93 by contract 206's `get_season_player_profile_by_ref`,\n    // which keeps the same season-scoped/no-auth-ownership disposition.\n    expect(reviewedFunctions).toHaveLength(93)"""
              if source.count(old) != 1:
                  raise SystemExit(f'expected exactly one overlay count anchor, found {source.count(old)}')
              test.write_text(source.replace(old, new, 1))
          PY
          rm .github/workflows/pr920-stage-c1-overlay-fix.yml
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/architecture/stage-c1-schema-overlay.md tests/scripts/stageC1SchemaOverlayCoverage.test.ts .github/workflows/pr920-stage-c1-overlay-fix.yml
          git commit -m "docs: register Contract 206 in Stage C1 overlay"
          git push origin HEAD:agent/same-season-player-profile
