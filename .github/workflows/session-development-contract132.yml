name: Session Development Contract 132

# One-run connector bridge for the already-authorised Development fast lane.
# This branch is pinned to exact merged main 305b4e12 and is refused unless its
# only delta from that main commit is this workflow file. No migration SQL is
# branch-authored.

on:
  push:
    branches:
      - ops/dev-contract132-20260808

permissions:
  contents: read

env:
  EXPECTED_PROJECT_REF: iouzoutneyjpugbbtdem
  FORBIDDEN_PRODUCTION_REF: vkfnsqdyhvtwyqkisxhk
  BASE_MAIN_SHA: 305b4e12b43a28f349f5fd27c954bd8247742a52
  EXPECTED_MIGRATION: 20260807210812

jobs:
  fast-lane:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Prove this is exact merged main plus only the session bridge
        shell: bash
        run: |
          set -euo pipefail
          [ "${GITHUB_REF}" = 'refs/heads/ops/dev-contract132-20260808' ] || {
            echo 'ERROR: unexpected branch.'
            exit 1
          }
          [ "$(git rev-parse HEAD^)" = "${BASE_MAIN_SHA}" ] || {
            echo 'ERROR: session bridge is not based on the authorised merged main commit.'
            exit 1
          }
          git fetch origin main --quiet
          [ "$(git rev-parse origin/main)" = "${BASE_MAIN_SHA}" ] || {
            echo 'ERROR: main advanced after rollout authorisation.'
            exit 1
          }
          delta="$(git diff --name-only "${BASE_MAIN_SHA}"..HEAD)"
          [ "${delta}" = '.github/workflows/session-development-contract132.yml' ] || {
            echo 'ERROR: branch contains changes beyond the session bridge:'
            printf '%s\n' "${delta}"
            exit 1
          }
          [ "$(node -p "require('./config/deployment-contract.json').requiredMigrationCount")" = '132' ] || {
            echo 'ERROR: repository contract is not 132.'
            exit 1
          }
          [ "$(git ls-files 'supabase/migrations/*.sql' | wc -l | tr -d ' ')" = '132' ] || {
            echo 'ERROR: committed migration count is not 132.'
            exit 1
          }

      - uses: actions/setup-node@v7
        with:
          node-version: 22.22.2

      - uses: supabase/setup-cli@v1
        with:
          version: 2.84.2

      - name: Prove the secret targets Development, never Production
        env:
          SUPABASE_DEV_DB_URL: ${{ secrets.SUPABASE_DEV_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${SUPABASE_DEV_DB_URL}" ] || {
            echo 'ERROR: SUPABASE_DEV_DB_URL is not set.'
            exit 1
          }
          case "${SUPABASE_DEV_DB_URL}" in
            *"${FORBIDDEN_PRODUCTION_REF}"*)
              echo 'ERROR: production is forbidden.'
              exit 1
              ;;
            *"${EXPECTED_PROJECT_REF}"*) ;;
            *)
              echo 'ERROR: secret does not target the known Development project.'
              exit 1
              ;;
          esac

      - name: Require exactly Contract 132 and prove it additive
        env:
          SUPABASE_DEV_DB_URL: ${{ secrets.SUPABASE_DEV_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          supabase migration list --db-url "${SUPABASE_DEV_DB_URL}" > /tmp/migration-list.txt 2>&1 || {
            sed -e 's/[[:alnum:]._-]*:[[:alnum:]._%-]*@/[redacted]@/g' /tmp/migration-list.txt
            exit 1
          }
          pending="$(awk -F'|' '
            $3 ~ /[0-9]/ && $2 !~ /[0-9]/ {
              version = $1
              gsub(/[^0-9]/, "", version)
              if (length(version) == 14) print version
            }' /tmp/migration-list.txt || true)"
          [ "${pending}" = "${EXPECTED_MIGRATION}" ] || {
            echo 'ERROR: pending set is not exactly Contract 132.'
            echo 'Observed:'
            printf '%s\n' "${pending:-<none>}"
            exit 1
          }
          file="$(git ls-files "supabase/migrations/${EXPECTED_MIGRATION}_*.sql" | head -1)"
          [ "${file}" = 'supabase/migrations/20260807210812_provider_initial_fixture_approval.sql' ] || {
            echo 'ERROR: Contract 132 migration path is not canonical.'
            exit 1
          }
          node scripts/check-migration-additive.mjs "${file}"

      - name: Take lightweight pre-apply snapshot
        env:
          SUPABASE_DEV_DB_URL: ${{ secrets.SUPABASE_DEV_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/contract132
          supabase db dump --db-url "${SUPABASE_DEV_DB_URL}" --data-only -f /tmp/contract132/pre-apply-data.sql
          supabase db dump --db-url "${SUPABASE_DEV_DB_URL}" -f /tmp/contract132/pre-apply-schema.sql
          echo "Snapshot bytes: $(wc -c < /tmp/contract132/pre-apply-data.sql) data, $(wc -c < /tmp/contract132/pre-apply-schema.sql) schema"

      - name: Apply canonical Contract 132 migration
        env:
          SUPABASE_DEV_DB_URL: ${{ secrets.SUPABASE_DEV_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          supabase db push --db-url "${SUPABASE_DEV_DB_URL}"

      - name: Verify exact hosted Contract 132 ledger
        env:
          SUPABASE_DEV_DB_URL: ${{ secrets.SUPABASE_DEV_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          supabase migration list --db-url "${SUPABASE_DEV_DB_URL}" > /tmp/migration-list-after.txt
          if awk -F'|' '$3 ~ /[0-9]/ && $2 !~ /[0-9]/ { found=1 } END { exit !found }' /tmp/migration-list-after.txt; then
            echo 'ERROR: migrations remain unapplied after push.'
            exit 1
          fi
          grep -q '20260807210812' /tmp/migration-list-after.txt || {
            echo 'ERROR: Contract 132 timestamp is absent after push.'
            exit 1
          }
          [ "$(node -p "require('./config/deployment-contract.json').requiredMigrationCount")" = '132' ] || exit 1
          [ "$(git ls-files 'supabase/migrations/*.sql' | wc -l | tr -d ' ')" = '132' ] || exit 1
          echo 'Development is at canonical Contract 132.'

      - name: Upload Development rollout evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: development-contract132-evidence
          path: |
            /tmp/contract132/
            /tmp/migration-list.txt
            /tmp/migration-list-after.txt
          if-no-files-found: warn
          retention-days: 7
