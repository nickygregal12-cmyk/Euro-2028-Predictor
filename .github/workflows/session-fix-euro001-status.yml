name: Session fix EURO-001 status
on:
  push:
    branches: [docs/live-authority-reconciliation-20260808]
    paths: ['.github/workflows/session-fix-euro001-status.yml']
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Correct stale EURO-001 status reason
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/quality/accepted-requirements.md')
          s = p.read_text()
          old = "Accepted — **currently violated**: the weekly Hub lists Euro 2028 from its static catalogue"
          new = "Accepted — **currently violated**: Euro 2028 is absent from the weekly Hub catalogue, but the weekly/public surface still exposes Euro through landing/metadata and no server-owned publication-state route guard exists yet"
          if old not in s:
              raise SystemExit('expected stale EURO-001 status text not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Validate documentation freshness
        run: npm test -- --run tests/repository/documentationContractFreshness.test.ts
      - name: Regenerate NOW and verify current
        run: |
          npm run generate:now
          git diff --exit-code NOW.md
      - name: Commit correction and remove one-shot workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/session-fix-euro001-status.yml
          git add docs/quality/accepted-requirements.md .github/workflows/session-fix-euro001-status.yml
          git commit -m 'docs: correct EURO-001 current violation reason'
          git push
