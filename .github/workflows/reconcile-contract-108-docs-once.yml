name: Reconcile Contract 108 docs once

on:
  push:
    branches:
      - docs/reconcile-contract-108-follow-up
    paths:
      - .github/scripts/reconcile_contract108_docs.py

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reconcile Contract 108 documentation
        run: python .github/scripts/reconcile_contract108_docs.py
      - name: Remove one-run tooling and commit
        run: |
          rm .github/scripts/reconcile_contract108_docs.py
          rm .github/workflows/reconcile-contract-108-docs-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Docs: reconcile Contract 108 across live summaries"
          git push
