name: Repair contract 103 scope

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  repair:
    if: github.head_ref == 'claude/lms-restart-lifecycle'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/lms-restart-lifecycle

      - name: Apply public-private and lineage-scope repair
        run: python scripts/repair-contract-103-scope-once.py

      - name: Commit repaired contract
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add AGENTS.md docs/ops/ops-pending-migrations.md docs/quality/current-status.md scripts/bonus-games/publish-catalogue.sql supabase/migrations/20260804333000_competition_instance_lineage.sql supabase/tests/112_clear_predictions_race_safety.sql supabase/tests/154_competition_instance_lineage.sql tests/database-parity/liveCompetitionConflictTargets.test.ts
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Repair already applied; nothing to commit.'
            exit 0
          fi
          git commit -m 'Fix contract 103 public-private scope and lineage'
          git push origin HEAD:claude/lms-restart-lifecycle
