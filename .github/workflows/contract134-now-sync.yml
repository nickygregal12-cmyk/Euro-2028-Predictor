name: Contract 134 NOW sync

on:
  push:
    branches:
      - agent/euro-002-publication-state-contract-134
    paths:
      - .github/workflows/contract134-now-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/euro-002-publication-state-contract-134
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.22.2
          cache: npm
      - run: npm ci
      - run: npm run generate:now
      - name: Commit generated NOW state
        run: |
          if git diff --quiet -- NOW.md; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add NOW.md
          git commit -m "Contract 134: regenerate NOW state"
          git push origin HEAD:agent/euro-002-publication-state-contract-134
