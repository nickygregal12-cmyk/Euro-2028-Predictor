name: Session hosted inventory Contract 132 repair

on:
  push:
    branches:
      - feature/contract-133-private-championship-restack

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/contract-133-private-championship-restack
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Reconcile live migration inventory
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p = Path('docs/ops/ops-pending-migrations.md')
          s = p.read_text()
          start = s.index('## Current state')
          end = s.index('\n## Superseded — 5 August 2026', start)
          current = '''## Current state — 8 August 2026

The repository candidate is **contract 133**. Hosted Development and Production are both independently verified at **contract 132**, ending at `20260807210812_provider_initial_fixture_approval`; Contract 133 (`20260808003000_private_season_cup_player_reads.sql`) is therefore the only pending migration and remains repository-only until the guarded Development rollout is applied and verified. Production follows only through the separately controlled Production process.

The Contract 132 machine records had remained at 131 after the hosted rollouts, even though both migration ledgers had advanced. They were reconciled on 8 August 2026 from independent read-only ledger checks. This current section and the table below are live operating state; the dated superseded sections below remain historical evidence and are intentionally not rewritten.
'''
          s = s[:start] + current + s[end:]
          s = s.replace('| Repository `main` | **131** |', '| Repository candidate | **133** |', 1)
          old_dev = '| Development Supabase `iouzoutneyjpugbbtdem` | **131** | Guarded fast-lane run `31186564948` applied canonical contracts 126–131 on 7 August 2026; workflow parity and an independent ledger read both end at `20260806220000_period_standings_display_names`. | LEVEL WITH REPOSITORY |'
          new_dev = '| Development Supabase `iouzoutneyjpugbbtdem` | **132** | Independent read-only ledger verification on 8 August 2026 ends at `20260807210812_provider_initial_fixture_approval`. | ONE BEHIND CONTRACT-133 REPOSITORY CANDIDATE |'
          old_prod = '| Production Supabase | **131** | Guarded continuation run `31216257649` applied canonical batches C (97-114), D (115-125) and E (126-131); final and independent reads end at `20260806220000_period_standings_display_names`, with pg_net installed, six active cron jobs and zero provider poll targets. | LEVEL WITH REPOSITORY |'
          new_prod = '| Production Supabase | **132** | Independent read-only ledger verification on 8 August 2026 ends at `20260807210812_provider_initial_fixture_approval`; application promotion remains separately controlled. | ONE BEHIND CONTRACT-133 REPOSITORY CANDIDATE |'
          if old_dev not in s or old_prod not in s:
              raise SystemExit('Expected hosted inventory rows not found')
          s = s.replace(old_dev, new_dev, 1).replace(old_prod, new_prod, 1)
          p.write_text(s)
          PY
          rm .github/workflows/session-hosted-inventory-132-repair.yml
      - name: Commit reconciliation
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/ops/ops-pending-migrations.md .github/workflows/session-hosted-inventory-132-repair.yml
          git diff --cached --exit-code && exit 0
          git commit -m 'Reconcile hosted migration inventory to Contract 132'
          git push origin HEAD:feature/contract-133-private-championship-restack
