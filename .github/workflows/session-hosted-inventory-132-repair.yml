name: Session hosted inventory Contract 132 repair

on:
  push:
    branches:
      - feature/contract-133-private-championship-restack

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/contract-133-private-championship-restack
      - uses: actions/setup-node@v7
        with:
          node-version: 22.22.2
      - name: Reconcile live migration inventory
        run: node scripts/session-reconcile-hosted-inventory.mjs
      - name: Commit reconciliation and remove temporary helpers
        run: |
          set -euo pipefail
          rm -f scripts/session-reconcile-hosted-inventory.mjs
          rm -f .github/workflows/session-hosted-inventory-132-repair.yml
          rm -f .github/hosted-inventory-trigger.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/ops/ops-pending-migrations.md scripts/session-reconcile-hosted-inventory.mjs .github/workflows/session-hosted-inventory-132-repair.yml .github/hosted-inventory-trigger.txt
          git diff --cached --exit-code && exit 0
          git commit -m 'Reconcile hosted migration inventory to Contract 132'
          git push origin HEAD:feature/contract-133-private-championship-restack
