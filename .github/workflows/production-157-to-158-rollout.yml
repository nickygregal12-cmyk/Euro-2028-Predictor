name: Production 157 to 158 rollout

# One-shot guarded promotion of the Production contract boundary 157 -> 158.
#
# The owner authorised this Production migration on 11 August 2026 by asking for
# the rollout to be finished on Development and then Production. That
# authorisation is what this file records; it is not a licence the workflow
# grants itself, and it does not extend to any other boundary.
#
# WHY THIS ONE IS DIFFERENT FROM THE 151-TO-157 PROMOTION, and it is worth
# saying plainly rather than leaving to a reader to notice: contract 158 is
# DESTRUCTIVE by `check-migration-additive.mjs`. `get_league_preview` is dropped
# and recreated, because its return type narrows — it stops returning the
# league id, the member count and the owner's name — and PostgreSQL cannot
# narrow a return type with `create or replace`. So this file does NOT run the
# additive checker as a gate, because it would refuse; it runs it as a REPORT,
# prints the refusal, and relies on the backup and the Production-shaped
# rehearsal that this boundary has precisely because it is destructive.
#
# The drop is inside the migration's transaction, so the window in which
# `get_league_preview` does not exist is that transaction and no longer. A
# browser calling it during the apply gets an error, not a wrong answer.
#
# THE SECOND THING THIS ROLLOUT MUST GET RIGHT is a coupling rather than a
# feature. Contract 158's generator issues TWELVE-character codes; contracts 152
# to 155 stored, registered and resolved SIX. All three acceptors widen to
# `{6,16}` in the same migration, and the verification below asserts all three
# on the live database — because if any one of them were missed, every private
# competition creation on Production would raise `check_violation` and every
# newly issued code would read as unknown.
#
# Remove this one-shot workflow after the hosted contract/evidence record has
# been reconciled.

on:
  workflow_dispatch:
    inputs:
      project_ref:
        description: Exact Production project ref confirmation
        required: true
      confirmation:
        description: Type APPLY-PRODUCTION-157-TO-158 to proceed
        required: true
      backup_run_id:
        description: Run id of the successful Production backup
        required: true
      rehearsal_run_id:
        description: Run id of the successful 157-to-158 rehearsal
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: production-migration-rollout
  cancel-in-progress: false

env:
  EXPECTED_PROJECT_REF: vkfnsqdyhvtwyqkisxhk
  FORBIDDEN_DEVELOPMENT_REF: iouzoutneyjpugbbtdem
  CONFIRMATION_PHRASE: APPLY-PRODUCTION-157-TO-158
  SOURCE_CONTRACT: '157'
  SOURCE_VERSION: '20260810230000'
  SOURCE_NAME: player_preferences
  TARGET_CONTRACT: '158'
  TARGET_VERSION: '20260811000000'
  TARGET_NAME: invite_code_hardening
  WORK_DIR: /tmp/production-157-to-158

jobs:
  rollout:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Refuse an unsafe dispatch or repository state
        env:
          INPUT_PROJECT_REF: ${{ inputs.project_ref }}
          INPUT_CONFIRMATION: ${{ inputs.confirmation }}
        shell: bash
        run: |
          set -euo pipefail
          [ "${INPUT_CONFIRMATION}" = "${CONFIRMATION_PHRASE}" ] || {
            echo "ERROR: confirmation phrase does not match ${CONFIRMATION_PHRASE}."
            exit 1
          }
          [ "${INPUT_PROJECT_REF}" = "${EXPECTED_PROJECT_REF}" ] || {
            echo 'ERROR: project ref confirmation does not name the Production project.'
            exit 1
          }
          [ "${GITHUB_REF}" = 'refs/heads/main' ] || {
            echo 'ERROR: Production rollout runs only from refs/heads/main.'
            exit 1
          }
          git fetch --no-tags origin main
          [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" ] || {
            echo 'ERROR: checked-out HEAD is not exact origin/main.'
            exit 1
          }
          [ -z "$(git status --porcelain=v1 --untracked-files=all)" ] || {
            echo 'ERROR: checkout is not clean.'
            exit 1
          }

      - name: Prove a successful backup and rehearsal exist
        env:
          GH_TOKEN: ${{ github.token }}
          BACKUP_RUN_ID: ${{ inputs.backup_run_id }}
          REHEARSAL_RUN_ID: ${{ inputs.rehearsal_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          # Checked against the API rather than asserted by whoever dispatched
          # this. "Take a backup first" is a rule that survives exactly as long
          # as the person in a hurry remembers it; every other guard here is
          # mechanical, so these two are as well.
          check_run() {
            local run_id="$1" want_workflow="$2" label="$3"
            local json conclusion path
            json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}")"
            conclusion="$(printf '%s' "${json}" | jq -r '.conclusion')"
            path="$(printf '%s' "${json}" | jq -r '.path')"
            [ "${conclusion}" = 'success' ] || {
              echo "ERROR: ${label} run ${run_id} concluded '${conclusion}', not success."
              exit 1
            }
            [ "${path}" = "${want_workflow}" ] || {
              echo "ERROR: ${label} run ${run_id} is ${path}, not ${want_workflow}."
              exit 1
            }
            echo "${label} run ${run_id} verified: success, ${path}."
          }
          check_run "${BACKUP_RUN_ID}" \
            '.github/workflows/production-backup.yml' 'Backup'
          check_run "${REHEARSAL_RUN_ID}" \
            '.github/workflows/production-157-to-158-rehearsal.yml' 'Rehearsal'

      - name: Prove the repository still holds exactly the approved contract 158
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${WORK_DIR}"
          actual="$(git ls-files 'supabase/migrations/*.sql' | sort | sed -n '158p' | xargs -n1 basename)"
          [ "${actual}" = "${TARGET_VERSION}_${TARGET_NAME}.sql" ] || {
            echo "ERROR: repository row 158 is ${actual}, not the approved contract."
            exit 1
          }
          source_row="$(git ls-files 'supabase/migrations/*.sql' | sort | sed -n '157p' | xargs -n1 basename)"
          [ "${source_row}" = "${SOURCE_VERSION}_${SOURCE_NAME}.sql" ] || {
            echo "ERROR: repository row 157 is ${source_row}, not the promoted source boundary."
            exit 1
          }

          # The repository moves faster than a pinned boundary. Anything ABOVE
          # the target is held back in the step that applies, and the dry run is
          # still required to equal contract 158 exactly, so a later migration
          # cannot ride along inside `supabase db push`.
          total="$(git ls-files 'supabase/migrations/*.sql' | wc -l | tr -d ' ')"
          [ "${total}" -ge "${TARGET_CONTRACT}" ] || {
            echo "ERROR: repository holds only ${total} migrations; this rollout targets ${TARGET_CONTRACT}."
            exit 1
          }
          if [ "${total}" -gt "${TARGET_CONTRACT}" ]; then
            echo "Repository is at ${total}; this promotion is pinned to ${TARGET_CONTRACT}."
            echo 'Migrations above the target will be held back and are NOT promoted by this run.'
          fi

          # Production is never the first hosted environment to see a migration.
          development_count="$(node -p "require('./config/development-hosted-contract.json').requiredMigrationCount")"
          [ "${development_count}" -ge "${TARGET_CONTRACT}" ] || {
            echo "ERROR: Development is only contract ${development_count}; target is ${TARGET_CONTRACT}."
            exit 1
          }

      - name: Report what the additive checker says, without pretending it passes
        shell: bash
        run: |
          set -euo pipefail
          # A REPORT, not a gate — see the header. Recording the reason beats a
          # silent skip, and beats a gate quietly weakened to let one file past.
          if node scripts/check-migration-additive.mjs \
              "supabase/migrations/${TARGET_VERSION}_${TARGET_NAME}.sql" > "${WORK_DIR}/additive.txt" 2>&1; then
            echo 'Contract 158 reports as additive.'
            cat "${WORK_DIR}/additive.txt"
          else
            echo 'Contract 158 is DESTRUCTIVE, as expected and as reviewed. The checker said:'
            cat "${WORK_DIR}/additive.txt"
            echo 'The backup and the rehearsal this run is gated on exist for exactly this.'
          fi

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.2

      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520
        with:
          version: 2.109.1
          github-token: ${{ github.token }}

      - name: Install PostgreSQL 17 client tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17

      - name: Preflight the Production secret without printing it
        env:
          SUPABASE_PROD_DB_URL: ${{ secrets.SUPABASE_PROD_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${SUPABASE_PROD_DB_URL}" ] || {
            echo 'ERROR: repository secret SUPABASE_PROD_DB_URL is not set.'
            exit 1
          }
          case "${SUPABASE_PROD_DB_URL}" in
            *"${FORBIDDEN_DEVELOPMENT_REF}"*)
              echo 'ERROR: Production secret resolves to Development.'
              exit 1
              ;;
            *"${EXPECTED_PROJECT_REF}"*) ;;
            *)
              echo 'ERROR: Production secret does not name the expected Production project.'
              exit 1
              ;;
          esac

      - name: Capture the exact pre-apply Production state
        env:
          SUPABASE_PROD_DB_URL: ${{ secrets.SUPABASE_PROD_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          # Every column read here exists at contract 157. A pre-apply probe that
          # reads a post-apply column is how the 151-to-157 rehearsal failed on
          # run 31445831137, and the fix was to stop asking early rather than to
          # relax the check.
          psql "${SUPABASE_PROD_DB_URL}" -X -q -v ON_ERROR_STOP=1 -A -t -c "
            select json_build_object(
              'migration_count', (select count(*) from supabase_migrations.schema_migrations),
              'latest_version', (select version from supabase_migrations.schema_migrations order by version desc limit 1),
              'latest_name', (select name from supabase_migrations.schema_migrations order by version desc limit 1),
              'auth_users', (select count(*) from auth.users),
              'profiles', (select count(*) from public.profiles),
              'tournaments', (select count(*) from public.tournaments),
              'teams', (select count(*) from public.teams),
              'matches', (select count(*) from public.matches),
              'entries', (select count(*) from public.entries),
              'match_predictions', (select count(*) from public.match_predictions),
              'leagues', (select count(*) from public.leagues),
              'league_members', (select count(*) from public.league_members),
              'score_events', (select count(*) from public.score_events),
              'entry_totals', (select count(*) from public.entry_totals),
              'game_memberships', (select count(*) from public.game_memberships),
              'bonus_competitions', (select count(*) from public.bonus_competitions),
              'leagues_with_code', (select count(*) from public.leagues where invite_code is not null),
              'six_char_codes', (
                select count(*) from public.leagues
                 where invite_code is not null and length(invite_code) = 6
              ),
              'registry_rows', (select count(*) from public.invite_code_registry)
            )
          " > "${WORK_DIR}/before.json"
          cat "${WORK_DIR}/before.json"

          BEFORE_FILE="${WORK_DIR}/before.json" node --input-type=module <<'NODE'
          import fs from 'node:fs'
          const before = JSON.parse(fs.readFileSync(process.env.BEFORE_FILE, 'utf8'))
          const expected = {
            migration_count: Number(process.env.SOURCE_CONTRACT),
            latest_version: process.env.SOURCE_VERSION,
            latest_name: process.env.SOURCE_NAME,
          }
          for (const [key, want] of Object.entries(expected)) {
            if (String(before[key]) !== String(want)) {
              console.error(`ERROR: live Production ${key} is ${before[key]}, expected ${want}.`)
              console.error('Production is not the boundary this rollout was rehearsed against.')
              process.exit(1)
            }
          }
          console.log('Live Production is exactly the rehearsed contract-157 source boundary.')
          NODE

      - name: Dry run, and refuse anything that is not exactly contract 158
        env:
          SUPABASE_PROD_DB_URL: ${{ secrets.SUPABASE_PROD_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail

          # Hold back everything above the pinned target BEFORE the dry run, so
          # the dry run describes what will actually be applied. Restored by the
          # step after the apply, which runs even on failure.
          mkdir -p "${WORK_DIR}/later-migrations"
          : > "${WORK_DIR}/moved-files.txt"
          for file in $(git ls-files 'supabase/migrations/*.sql' | sort); do
            filename="$(basename "${file}")"
            version="${filename:0:14}"
            if [[ "${version}" > "${TARGET_VERSION}" ]]; then
              mv "${file}" "${WORK_DIR}/later-migrations/${filename}"
              printf '%s\n' "${file}" >> "${WORK_DIR}/moved-files.txt"
            fi
          done
          if [ -s "${WORK_DIR}/moved-files.txt" ]; then
            echo 'Held back as ABOVE the pinned target, NOT promoted by this run:'
            cat "${WORK_DIR}/moved-files.txt"
          fi

          supabase migration list --db-url "${SUPABASE_PROD_DB_URL}" \
            > "${WORK_DIR}/migration-list-before.txt"
          supabase db push --db-url "${SUPABASE_PROD_DB_URL}" --dry-run \
            > "${WORK_DIR}/dry-run.txt" 2>&1
          cat "${WORK_DIR}/dry-run.txt"

          grep -oE '[0-9]{14}_[A-Za-z0-9_-]+\.sql' "${WORK_DIR}/dry-run.txt" \
            | awk '!seen[$0]++' > "${WORK_DIR}/dry-run-migrations.txt"
          expected="${TARGET_VERSION}_${TARGET_NAME}.sql"
          actual="$(cat "${WORK_DIR}/dry-run-migrations.txt")"
          [ "${actual}" = "${expected}" ] || {
            echo 'ERROR: Production dry run is not exactly contract 158.'
            printf 'Expected:\n%s\nActual:\n%s\n' "${expected}" "${actual}"
            exit 1
          }

      - name: Apply exactly contract 158
        env:
          SUPABASE_PROD_DB_URL: ${{ secrets.SUPABASE_PROD_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          supabase db push --db-url "${SUPABASE_PROD_DB_URL}" \
            2>&1 | tee "${WORK_DIR}/apply.txt"

      - name: Restore the repository migration tree in the runner
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          # Runs even when the apply failed. The verification below reads the
          # database rather than the tree.
          if [ -f "${WORK_DIR}/moved-files.txt" ]; then
            while IFS= read -r file; do
              [ -n "${file}" ] || continue
              filename="$(basename "${file}")"
              if [ -e "${WORK_DIR}/later-migrations/${filename}" ]; then
                mv "${WORK_DIR}/later-migrations/${filename}" "${file}"
              fi
            done < "${WORK_DIR}/moved-files.txt"
          fi

      - name: Verify exact contract-158 Production state and that nothing was lost
        env:
          SUPABASE_PROD_DB_URL: ${{ secrets.SUPABASE_PROD_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          psql "${SUPABASE_PROD_DB_URL}" -X -q -v ON_ERROR_STOP=1 -A -t -c "
            select json_build_object(
              'migration_count', (select count(*) from supabase_migrations.schema_migrations),
              'latest_version', (select version from supabase_migrations.schema_migrations order by version desc limit 1),
              'latest_name', (select name from supabase_migrations.schema_migrations order by version desc limit 1),
              'auth_users', (select count(*) from auth.users),
              'profiles', (select count(*) from public.profiles),
              'tournaments', (select count(*) from public.tournaments),
              'teams', (select count(*) from public.teams),
              'matches', (select count(*) from public.matches),
              'entries', (select count(*) from public.entries),
              'match_predictions', (select count(*) from public.match_predictions),
              'leagues', (select count(*) from public.leagues),
              'league_members', (select count(*) from public.league_members),
              'score_events', (select count(*) from public.score_events),
              'entry_totals', (select count(*) from public.entry_totals),
              'game_memberships', (select count(*) from public.game_memberships),
              'bonus_competitions', (select count(*) from public.bonus_competitions),
              'leagues_with_code', (select count(*) from public.leagues where invite_code is not null),
              'six_char_codes', (
                select count(*) from public.leagues
                 where invite_code is not null and length(invite_code) = 6
              ),
              'registry_rows', (select count(*) from public.invite_code_registry),
              'generated_code_length', length(public.gen_invite_code()),
              'competition_shape_widened', (
                select count(*) from pg_constraint
                 where conname = 'bonus_competitions_invite_code_shape'
                   and pg_get_constraintdef(oid) like '%6,16%'
              ),
              'registry_shape_widened', (
                select count(*) from pg_constraint
                 where conname = 'invite_code_registry_shape'
                   and pg_get_constraintdef(oid) like '%6,16%'
              ),
              'resolver_widened', (
                select pg_get_functiondef(p.oid) like '%6,16%'
                  from pg_proc p join pg_namespace n on n.oid = p.pronamespace
                 where n.nspname = 'public' and p.proname = 'resolve_invite_code'
              ),
              'preview_hides_owner', (
                select pg_get_function_result(p.oid) not like '%owner_name%'
                  from pg_proc p join pg_namespace n on n.oid = p.pronamespace
                 where n.nspname = 'public' and p.proname = 'get_league_preview'
              ),
              'preview_still_exists', (
                select count(*) from pg_proc p join pg_namespace n on n.oid = p.pronamespace
                 where n.nspname = 'public' and p.proname = 'get_league_preview'
              ),
              'rotate_exists', (
                select count(*) from pg_proc p join pg_namespace n on n.oid = p.pronamespace
                 where n.nspname = 'public' and p.proname = 'rotate_league_invite_code'
              ),
              'rotate_anonymous', (
                select count(*) from information_schema.role_routine_grants
                 where routine_schema = 'public' and routine_name = 'rotate_league_invite_code'
                   and grantee in ('anon', 'PUBLIC')
              ),
              'euro_publication_state', (select state::text from predictor_internal.euro_publication_state)
            )
          " > "${WORK_DIR}/after.json"
          cat "${WORK_DIR}/after.json"

          BEFORE_FILE="${WORK_DIR}/before.json" AFTER_FILE="${WORK_DIR}/after.json" \
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          const before = JSON.parse(fs.readFileSync(process.env.BEFORE_FILE, 'utf8'))
          const after = JSON.parse(fs.readFileSync(process.env.AFTER_FILE, 'utf8'))

          const reached = {
            migration_count: Number(process.env.TARGET_CONTRACT),
            latest_version: process.env.TARGET_VERSION,
            latest_name: process.env.TARGET_NAME,
          }
          for (const [key, want] of Object.entries(reached)) {
            if (String(after[key]) !== String(want)) {
              console.error(`ERROR: contract-158 verification mismatch for ${key}: ${after[key]} != ${want}.`)
              process.exit(1)
            }
          }

          // Nothing player-owned moves. Asserted, not assumed. The three code
          // counts are in this list on purpose: contract 158 strengthens the
          // GENERATOR and widens the ACCEPTORS, and rewrites no code anybody is
          // already using. A league whose six-character code stopped working
          // would be a live invite link that silently died.
          const preserved = [
            'auth_users', 'profiles', 'tournaments', 'teams', 'matches',
            'entries', 'match_predictions', 'leagues', 'league_members',
            'score_events', 'entry_totals', 'game_memberships',
            'bonus_competitions', 'leagues_with_code', 'six_char_codes',
            'registry_rows',
          ]
          for (const key of preserved) {
            if (String(before[key]) !== String(after[key])) {
              console.error(`ERROR: ${key} changed across the migration: ${before[key]} -> ${after[key]}.`)
              process.exit(1)
            }
          }

          const expected = {
            // Twelve, from the rejection-sampled CSPRNG. This is the fact every
            // widening below exists to accommodate.
            generated_code_length: 12,
            // The coupling. Without all three, a twelve-character code cannot be
            // stored, cannot be registered and cannot be resolved — so private
            // competition creation raises `check_violation` and every newly
            // issued code reads as an unknown one.
            competition_shape_widened: 1,
            registry_shape_widened: 1,
            resolver_widened: true,
            // The oracle is closed: an authenticated guess at a code no longer
            // comes back with a real group's member count and owner's name.
            preview_hides_owner: true,
            // And the drop-and-recreate landed on its feet. A narrowed return
            // type is the reason this boundary is destructive at all, so the
            // function still existing is asserted rather than assumed.
            preview_still_exists: 1,
            rotate_exists: 1,
            rotate_anonymous: 0,
            // Contract 143 is untouched by a batch about invite codes.
            euro_publication_state: 'hidden',
          }
          for (const [key, want] of Object.entries(expected)) {
            if (String(after[key]) !== String(want)) {
              console.error(`ERROR: ${key} arrived as ${after[key]}, expected ${want}.`)
              process.exit(1)
            }
          }

          console.log('Production reached exactly contract 158. No player-owned row moved.')
          console.log(`${after.six_char_codes} existing six-character code(s) still present and valid.`)
          console.log(JSON.stringify(after, null, 2))
          NODE

      - name: Say plainly what remains gated
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '## Production is at contract 158'
            echo
            echo 'Schema only. This rollout did NOT:'
            echo
            echo '- rotate anybody'"'"'s invite code — existing codes are untouched and still work;'
            # Declared, not rewritten: backticks are literal markdown for the step summary and must not expand. This is a spent one-shot promotion
            # script; changing what it DOES to satisfy a style rule would edit the
            # record of a past production apply. shellcheck only began seeing it
            # when SHA-pinning marked the file changed, so it is pre-existing.
            # shellcheck disable=SC2016
            echo '  rotation is an owner act through `rotate_league_invite_code`, taken per league;'
            # Declared, not rewritten: backticks are literal markdown for the step summary and must not expand. This is a spent one-shot promotion
            # script; changing what it DOES to satisfy a style rule would edit the
            # record of a past production apply. shellcheck only began seeing it
            # when SHA-pinning marked the file changed, so it is pre-existing.
            # shellcheck disable=SC2016
            echo '- publish Euro 2028 — contract 143 stays `hidden` and publication is an owner act;'
            echo '- promote the application — the deployed site is a separate, separately approved'
            echo '  step, and the Netlify contract variable is still owner-gated;'
            echo '- import any football, and copying Development football rows into Production'
            echo '  remains forbidden by the contract 132 boundary.'
            echo
            # Declared, not rewritten: backticks are literal markdown for the step summary and must not expand. This is a spent one-shot promotion
            # script; changing what it DOES to satisfy a style rule would edit the
            # record of a past production apply. shellcheck only began seeing it
            # when SHA-pinning marked the file changed, so it is pre-existing.
            # shellcheck disable=SC2016
            echo 'Reconcile `config/production-hosted-contract.json` from an independent read-only'
            echo 'ledger query, not from this job'"'"'s own output.'
          } >> "${GITHUB_STEP_SUMMARY}"
