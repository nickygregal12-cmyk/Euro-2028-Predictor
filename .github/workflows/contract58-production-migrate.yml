name: Contract 58 production migration

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/contract58-production-migrate.yml

permissions:
  contents: read

concurrency:
  group: contract58-production-migration
  cancel-in-progress: false

jobs:
  migrate-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPECTED_PROJECT_REF: vkfnsqdyhvtwyqkisxhk
      EXPECTED_START_COUNT: '55'
      EXPECTED_END_COUNT: '58'
      EXPECTED_LATEST_VERSION: '20260729090000'
      EXPECTED_LATEST_NAME: clear_predictions_race_safety
      RELEASE_COMMIT: cb75e9d29b26ad6b0952ee822c21fa795486f435

    steps:
      - name: Check out the exact verified main release
        uses: actions/checkout@v4
        with:
          ref: cb75e9d29b26ad6b0952ee822c21fa795486f435
          fetch-depth: 1

      - uses: supabase/setup-cli@v2
        with:
          version: 2.109.1
          github-token: ${{ github.token }}

      - name: Validate production secret and exact release
        env:
          SUPABASE_PROD_DB_URL: ${{ secrets.SUPABASE_PROD_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          : "${SUPABASE_PROD_DB_URL:?SUPABASE_PROD_DB_URL is not set}"
          case "$SUPABASE_PROD_DB_URL" in
            *"$EXPECTED_PROJECT_REF"*) ;;
            *)
              echo "STOP: database URL is not the approved production project $EXPECTED_PROJECT_REF." >&2
              exit 1
              ;;
          esac

      - name: Preflight exact pending migration chain
        env:
          SUPABASE_PROD_DB_URL: ${{ secrets.SUPABASE_PROD_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          psql "$SUPABASE_PROD_DB_URL" -X -q -v ON_ERROR_STOP=1 -A -t \
            -c "select version || E'\t' || name from supabase_migrations.schema_migrations order by version" \
            > /tmp/remote-migrations.tsv
          find supabase/migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\n' \
            | sort > /tmp/local-migrations.txt

          python - <<'PY'
          from pathlib import Path

          expected = [
              '20260729050000_predictor_cup_knockouts.sql',
              '20260729070000_account_entry_controls.sql',
              '20260729090000_clear_predictions_race_safety.sql',
          ]
          remote_versions = {
              line.split('\t', 1)[0]
              for line in Path('/tmp/remote-migrations.tsv').read_text().splitlines()
              if line.strip()
          }
          local_files = [
              line.strip()
              for line in Path('/tmp/local-migrations.txt').read_text().splitlines()
              if line.strip()
          ]
          pending = [
              filename for filename in local_files
              if filename.split('_', 1)[0] not in remote_versions
          ]
          if len(remote_versions) != 55:
              raise SystemExit(
                  f'STOP: expected 55 production migrations before promotion, found {len(remote_versions)}.'
              )
          if pending != expected:
              raise SystemExit(
                  'STOP: pending production migrations are not the approved contract 56-58 chain.\n'
                  f'Expected: {expected}\nActual: {pending}'
              )
          print('Approved pending chain:')
          print('\n'.join(pending))
          PY

      - name: Capture preserved-data baseline
        env:
          SUPABASE_PROD_DB_URL: ${{ secrets.SUPABASE_PROD_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          psql "$SUPABASE_PROD_DB_URL" -X -q -v ON_ERROR_STOP=1 -A -t <<'SQL' \
            > /tmp/contract58-production-before.json
          select jsonb_build_object(
            'auth_users', (select count(*) from auth.users),
            'profiles', (select count(*) from public.profiles),
            'entries', (select count(*) from public.entries),
            'leagues', (select count(*) from public.leagues),
            'league_members', (select count(*) from public.league_members),
            'matches', (select count(*) from public.matches),
            'match_predictions', (select count(*) from public.match_predictions),
            'bonus_competitions', (select count(*) from public.bonus_competitions),
            'bonus_entrants', (select count(*) from public.bonus_competition_entrants),
            'bonus_knockout_predictions', (select count(*) from public.bonus_knockout_predictions),
            'lms_selections', (select count(*) from public.bonus_lms_selections),
            'cup_groups', (select count(*) from public.bonus_cup_groups),
            'cup_members', (select count(*) from public.bonus_cup_members),
            'cup_fixtures', (select count(*) from public.bonus_cup_fixtures)
          );
          SQL
          jq -e . /tmp/contract58-production-before.json >/dev/null
          cat /tmp/contract58-production-before.json

      - name: Dry-run production migration push
        env:
          SUPABASE_PROD_DB_URL: ${{ secrets.SUPABASE_PROD_DB_URL }}
        shell: bash
        run: |
          set -o pipefail
          supabase db push --db-url "$SUPABASE_PROD_DB_URL" --include-all --dry-run \
            2>&1 | tee /tmp/contract58-production-dry-run.log

      - name: Apply contracts 56 through 58
        env:
          SUPABASE_PROD_DB_URL: ${{ secrets.SUPABASE_PROD_DB_URL }}
        run: supabase db push --db-url "$SUPABASE_PROD_DB_URL" --include-all --yes

      - name: Verify production contract, data and privileges
        env:
          SUPABASE_PROD_DB_URL: ${{ secrets.SUPABASE_PROD_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail

          psql "$SUPABASE_PROD_DB_URL" -X -q -v ON_ERROR_STOP=1 -A -t <<'SQL' \
            > /tmp/contract58-production-after.json
          select jsonb_build_object(
            'auth_users', (select count(*) from auth.users),
            'profiles', (select count(*) from public.profiles),
            'entries', (select count(*) from public.entries),
            'leagues', (select count(*) from public.leagues),
            'league_members', (select count(*) from public.league_members),
            'matches', (select count(*) from public.matches),
            'match_predictions', (select count(*) from public.match_predictions),
            'bonus_competitions', (select count(*) from public.bonus_competitions),
            'bonus_entrants', (select count(*) from public.bonus_competition_entrants),
            'bonus_knockout_predictions', (select count(*) from public.bonus_knockout_predictions),
            'lms_selections', (select count(*) from public.bonus_lms_selections),
            'cup_groups', (select count(*) from public.bonus_cup_groups),
            'cup_members', (select count(*) from public.bonus_cup_members),
            'cup_fixtures', (select count(*) from public.bonus_cup_fixtures)
          );
          SQL

          jq -e . /tmp/contract58-production-after.json >/dev/null
          diff -u \
            <(jq -S . /tmp/contract58-production-before.json) \
            <(jq -S . /tmp/contract58-production-after.json)

          psql "$SUPABASE_PROD_DB_URL" -X -q -v ON_ERROR_STOP=1 -A -t <<'SQL' \
            | tee /tmp/contract58-production-verification.txt
          select jsonb_build_object(
            'migration_count', (select count(*) from supabase_migrations.schema_migrations),
            'latest_version', (select max(version) from supabase_migrations.schema_migrations),
            'latest_name', (
              select name from supabase_migrations.schema_migrations order by version desc limit 1
            ),
            'penalty_rows', (select count(*) from public.bonus_cup_penalty_numbers),
            'reminder_emails', (select reminder_emails from public.profiles limit 1),
            'clear_anon_execute', has_function_privilege('anon', 'public.clear_my_predictions(uuid)', 'execute'),
            'clear_authenticated_execute', has_function_privilege('authenticated', 'public.clear_my_predictions(uuid)', 'execute'),
            'clear_service_execute', has_function_privilege('service_role', 'public.clear_my_predictions(uuid)', 'execute')
          );

          do $$
          declare
            actual_count integer;
            actual_version text;
            actual_name text;
            clear_config text;
          begin
            select count(*)::integer into actual_count
            from supabase_migrations.schema_migrations;
            select version, name into actual_version, actual_name
            from supabase_migrations.schema_migrations
            order by version desc limit 1;
            if actual_count <> 58
              or actual_version <> '20260729090000'
              or actual_name <> 'clear_predictions_race_safety'
            then
              raise exception 'Contract verification failed: count %, version %, name %',
                actual_count, actual_version, actual_name;
            end if;

            if not exists (
              select 1 from information_schema.columns
              where table_schema='public' and table_name='bonus_cup_members'
                and column_name in ('group_position','qualified_as','seed')
              group by table_schema, table_name having count(*) = 3
            ) then
              raise exception 'Predictor Cup member qualification columns are incomplete.';
            end if;
            if not exists (
              select 1 from information_schema.columns
              where table_schema='public' and table_name='bonus_cup_fixtures'
                and column_name in ('round_size','bracket_slot','winner_user_id','decided_by','settled_at')
              group by table_schema, table_name having count(*) = 5
            ) then
              raise exception 'Predictor Cup knockout fixture columns are incomplete.';
            end if;
            if not exists (
              select 1 from information_schema.columns
              where table_schema='public' and table_name='profiles'
                and column_name='reminder_emails' and is_nullable='NO'
            ) then
              raise exception 'Account reminder preference is missing or nullable.';
            end if;

            if not (select relrowsecurity from pg_class where oid='public.bonus_cup_penalty_numbers'::regclass)
              or has_table_privilege('anon','public.bonus_cup_penalty_numbers','select')
              or has_table_privilege('authenticated','public.bonus_cup_penalty_numbers','select')
              or (select count(*) from public.bonus_cup_penalty_numbers) <> 0
            then
              raise exception 'Penalty Number table posture or empty-state verification failed.';
            end if;

            select coalesce(array_to_string(proconfig, ','), '') into clear_config
            from pg_proc where oid='public.clear_my_predictions(uuid)'::regprocedure;
            if not (select prosecdef from pg_proc where oid='public.clear_my_predictions(uuid)'::regprocedure)
              or clear_config <> 'search_path=""'
              or has_function_privilege('anon','public.clear_my_predictions(uuid)','execute')
              or not has_function_privilege('authenticated','public.clear_my_predictions(uuid)','execute')
              or not has_function_privilege('service_role','public.clear_my_predictions(uuid)','execute')
            then
              raise exception 'clear_my_predictions privilege or search-path posture failed.';
            end if;

            if has_function_privilege('anon','public.admin_finalise_predictor_cup_groups(uuid)','execute')
              or has_function_privilege('authenticated','public.admin_finalise_predictor_cup_groups(uuid)','execute')
              or not has_function_privilege('service_role','public.admin_finalise_predictor_cup_groups(uuid)','execute')
              or has_function_privilege('anon','public.admin_settle_predictor_cup_round(uuid,uuid)','execute')
              or has_function_privilege('authenticated','public.admin_settle_predictor_cup_round(uuid,uuid)','execute')
              or not has_function_privilege('service_role','public.admin_settle_predictor_cup_round(uuid,uuid)','execute')
            then
              raise exception 'Predictor Cup service-only gate posture failed.';
            end if;
          end
          $$;
          SQL

          echo 'Preserved production counts:'
          cat /tmp/contract58-production-after.json

      - name: Lint production database
        env:
          SUPABASE_PROD_DB_URL: ${{ secrets.SUPABASE_PROD_DB_URL }}
        run: supabase db lint --db-url "$SUPABASE_PROD_DB_URL" --fail-on error

      - name: Upload production migration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contract58-production-migration-evidence
          path: |
            /tmp/contract58-production-before.json
            /tmp/contract58-production-after.json
            /tmp/contract58-production-dry-run.log
            /tmp/contract58-production-verification.txt
          if-no-files-found: warn
          retention-days: 14
