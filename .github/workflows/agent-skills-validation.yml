name: Agent skills validation

on:
  pull_request:
    paths:
      - '.agents/skills/**'
      - '.github/workflows/agent-skills-validation.yml'
  push:
    branches:
      - main
    paths:
      - '.agents/skills/**'
      - '.github/workflows/agent-skills-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Harden runner (audit egress)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Install pinned Agent Skills reference validator
        run: python -m pip install 'git+https://github.com/agentskills/agentskills.git@69ef37e9424c0a7ea9dd2293b559e43ec8176379#subdirectory=skills-ref'
      - name: Validate Predictor skills
        shell: bash
        run: |
          set -euo pipefail
          found=0
          for skill in .agents/skills/*; do
            [ -d "$skill" ] || continue
            found=1
            echo "=== $skill ==="
            skills-ref validate "$skill"
          done
          if [ "$found" -eq 0 ]; then
            echo 'No Predictor skills found to validate.' >&2
            exit 1
          fi
