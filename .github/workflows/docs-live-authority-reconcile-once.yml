name: Reconcile live authorities once

on:
  push:
    branches:
      - docs/live-authority-reconciliation-20260808
    paths:
      - '.github/workflows/docs-live-authority-reconcile-once.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: docs/live-authority-reconciliation-20260808
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22.22.2'
      - name: Reconcile current documentation and controls
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text()

          def write(path, text):
              Path(path).write_text(text)

          def replace_once(path, old, new):
              text = read(path)
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one anchor, found {count}: {old[:120]!r}')
              write(path, text.replace(old, new, 1))

          def regex_once(path, pattern, replacement, flags=0):
              text = read(path)
              new, count = re.subn(pattern, replacement, text, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one regex match, found {count}: {pattern[:120]!r}')
              write(path, new)

          # AGENTS.md — make documentation impact a mandatory closeout step.
          anchor = 'A planning document never overrides an ADR. Process, prepared tooling or a chat statement is not implementation evidence.\n'
          addition = '''A planning document never overrides an ADR. Process, prepared tooling or a chat statement is not implementation evidence.\n\n## Documentation-impact closeout\n\nEvery PR that changes implementation, schema, routes, hosted configuration or operating state must close its documentation impact before merge. A PR is not complete while the code/platform state and the live authorities disagree.\n\n- Check `docs/quality/current-status.md`, `docs/roadmap.md`, `MASTER-TODO.md`, `docs/quality/accepted-requirements.md`, the relevant design/operations runbook, and the machine contract records for impact. Update the affected current authority in the same PR, or state **No documentation impact** in the PR body with the reason.\n- Never rewrite dated audits, investigations or rollout evidence to make them look current. Add or update the current pointer/authority and leave historical evidence immutable.\n- Any hosted claim requires fresh target-specific evidence. A Netlify environment declaration, a Supabase hosted contract and an actually published application artifact are separate facts and must never be collapsed into one status.\n- After any machine contract or accepted-requirement change, run `npm run generate:now` and commit the generated `NOW.md` if it changes.\n- The documentation freshness/authority tests are minimum controls, not permission to leave known prose drift because CI cannot detect it.\n'''
          replace_once('AGENTS.md', anchor, addition)

          # Accepted requirements — keep DFA-007 truthful about repository vs hosted state.
          replace_once('docs/quality/accepted-requirements.md', '**Status:** Active |\n| Last verified | 2026-08-07 |', '**Status:** Active |\n| Last verified | 2026-08-08 |') if False else None
          replace_once('docs/quality/accepted-requirements.md', '| Last verified | 2026-08-07 |', '| Last verified | 2026-08-08 |')
          old_dfa7 = '| `DFA-007` | Scottish Premiership is the first truthful Development rehearsal: real Matchweek 1 results feed normal protected scoring from lock-consistent seeded test predictions; LMS and seeded Predictor Championship begin at Matchweek 2 with no invented Matchweek 1 history | Current Development contract batch applied; protected result/scoring authorities; season competition setup | Seed/rehearsal evidence showing real MW1 football, reload-persistent MW2 LMS pick, Championship opponent/fixtures/phase/table and normal Match Predictor points feed | Accepted — partially rehearsed: real MW1 result truth and reload-persistent MW2 LMS are proven; lock-consistent MW1 points evidence and the seeded Championship journey remain incomplete |'
          new_dfa7 = '| `DFA-007` | Scottish Premiership is the first truthful Development rehearsal: real Matchweek 1 results feed normal protected scoring from lock-consistent seeded test predictions; LMS and seeded Predictor Championship begin at Matchweek 2 with no invented Matchweek 1 history | Current Development contract batch applied; protected result/scoring authorities; season competition setup | Seed/rehearsal evidence showing real MW1 football, reload-persistent MW2 LMS pick, Championship opponent/fixtures/phase/table and normal Match Predictor points feed | Accepted — partially rehearsed: real MW1 result truth and reload-persistent MW2 LMS are proven; the private Championship read contract is merged to the repository but still awaits hosted Development rollout, so lock-consistent MW1 points evidence and the real signed-in seeded Championship journey remain incomplete |'
          replace_once('docs/quality/accepted-requirements.md', old_dfa7, new_dfa7)

          # UI execution authority — status markers now reflect delivered DFA work.
          replace_once('docs/design/ui-modernisation-execution.md', '2. **Canonical weekly route/navigation replacement** (`DFA-004`): converge on Hub → competition → game and one route-construction authority.', '2. **Canonical weekly route/navigation replacement** (`DFA-004`) — **partial; continue convergence**: converge on Hub → competition → game and one route-construction authority.')
          replace_once('docs/design/ui-modernisation-execution.md', '4. **Deterministic parent/back navigation** (`DFA-005`): every shipped deep route has an explicit logical parent and executable orphan-route coverage.', '4. **Deterministic parent/back navigation** (`DFA-005`) — **implemented**: every shipped deep route has an explicit logical parent and executable orphan-route coverage.')
          replace_once('docs/design/ui-modernisation-execution.md', '6. **Reusable shirt-style club identity** (`DFA-003`): one canonical-team component, accessible label/fallback and bounded pattern vocabulary, adopted first on repeated football rows/selections.', '6. **Reusable shirt-style club identity** (`DFA-003`) — **implemented**: one canonical-team component, accessible label/fallback and bounded pattern vocabulary, adopted on the first high-value domestic football surfaces.')
          replace_once('docs/design/ui-modernisation-execution.md', '7. **Truthful Scottish Matchweek 1 settled Development state** (`DFA-007`): real football results; lock-consistent synthetic test-user predictions only where needed; ordinary protected scoring/rederivation.', '7. **Truthful Scottish Matchweek 1 settled Development state** (`DFA-007`) — **partial**: real football result truth is proven; lock-consistent Match Predictor points evidence remains to close.')
          replace_once('docs/design/ui-modernisation-execution.md', '8. **Scottish Last Man Standing begins at Matchweek 2** (`DFA-007`): join, real clubs, select/change before lock and reload persistence; no invented Matchweek 1 LMS history.', '8. **Scottish Last Man Standing begins at Matchweek 2** (`DFA-007`) — **rehearsal proven**: join, real clubs, select/change before lock and reload persistence; no invented Matchweek 1 LMS history.')
          replace_once('docs/design/ui-modernisation-execution.md', '9. **Scottish Predictor Championship begins at Matchweek 2** (`DFA-007`): seeded deterministic field, opponent/fixtures/phase/table reachable, Match Predictor points feeding it through the existing authority.', '9. **Scottish Predictor Championship begins at Matchweek 2** (`DFA-007`) — **next critical Alpha proof**: the private read contract is merged to the repository; promote it through the guarded Development lane, then verify the signed-in #593 opponent/fixtures/phase/table journey and Match Predictor points feed.')
          replace_once('docs/design/ui-modernisation-execution.md', 'The reusable shirt-style club identity remains a **target component contract** until implementation evidence exists; `docs/design-system.md` should not pretend it is already built.', 'The reusable shirt-style club identity is **implemented** under `DFA-003`; `docs/design-system.md` and the executable visual/accessibility contracts are implementation evidence. Remaining work is adoption breadth on later surfaces, not inventing a second identity component.')

          # MASTER-TODO — remove obsolete production-63 and no-provider-contact claims.
          replace_once('MASTER-TODO.md', '**Status date:** 6 August 2026', '**Status date:** 8 August 2026')
          replace_once('MASTER-TODO.md', '- [ ] Keep production at contract 63 and paused until an intentional release milestone. *(Standing constraint, not a task to complete; production remains at 63.)*', '- [x] Preserve Production as a separately controlled release lane; never promote merely to equalise contract numbers. Production database movement is recorded only in the live status/machine records and never implies an application release.')
          old_stage_d = '**Custody foundation delivered; live rehearsal remains.** The repository now has strict provider decoders, a server-only request boundary, raw-response archive-before-processing custody and append-only processing evidence. Provider data remains provisional and cannot write official competition truth.\n\n**The Edge Function is deployed to development** (`provider-poll` version 1, `ACTIVE`, 5 August 2026, owner-authorised; [`docs/ops/ops-provider-poll-deployment.md`](docs/ops/ops-provider-poll-deployment.md)). That is a smaller step than it sounds: no provider has been contacted, no credential has been spent, nothing has been archived, and the named caller key has not been observed to resolve. All three providers are supported simultaneously — `provider` is a per-request field, not a deployment-time choice — so the outstanding question is which provider\'s terms and coverage are confirmed, not which one is wired.'
          new_stage_d = '**Custody foundation delivered; Development Scottish live rehearsal is active.** The repository has strict provider decoders, a server-only request boundary, raw-response archive-before-processing custody and append-only processing evidence. SportMonks now polls Scottish Premiership evidence on Development at the configured five-minute cadence and retained responses are decoding successfully. Provider scores remain provisional evidence and cannot write official competition truth.\n\nThe current provider capability/terms authority is [`docs/architecture/provider-enrichment-capability-audit.md`](docs/architecture/provider-enrichment-capability-audit.md), backed by the immutable 8 August investigation. It measures the actual configured subscriptions rather than assuming endpoint documentation equals account entitlement. Production polling remains a separate operational lane and is not implied by Development success.'
          replace_once('MASTER-TODO.md', old_stage_d, new_stage_d)
          regex_once('MASTER-TODO.md', r'- \[ \] Confirm provider terms, coverage, timezone and exceptional-state mappings with dated evidence\. \*\([^\n]*\)\*', '- [x] Measure current provider terms, subscription coverage and enrichment suitability with dated evidence. The 8 August capability audit proves SportMonks Scottish 2026/27 access, football-data.org Premier League access / Scottish restriction, API-Football current-season plan restriction, and the SportDB integration gap.\n- [ ] Measure endpoint-specific timezone/exceptional-state and deeper enrichment payloads before expanding schema/runtime reliance (SportMonks lineups/events/statistics first; API-Football current-season kit colours only after entitlement; SportDB only through a reviewed enrichment-only adapter).')

          # Roadmap — current checkpoint without duplicating moving contract numbers.
          replace_once('docs/roadmap.md', '**Status date:** 7 August 2026', '**Status date:** 8 August 2026')
          roadmap_anchor = '- lock policy is **game-owned** (ADR 0020, PR #353): the competition supplies identity, calendar and structure; each game supplies its own explicit lock policy, failing closed when missing or incompatible.\n\n## Development operating model'
          roadmap_insert = '''- lock policy is **game-owned** (ADR 0020, PR #353): the competition supplies identity, calendar and structure; each game supplies its own explicit lock policy, failing closed when missing or incompatible.\n\n## Domestic Frontend Alpha checkpoint — 8 August 2026\n\nThe accepted sequence in the UI execution authority still governs, but its first items are no longer all open:\n\n- `DFA-003` reusable club identity and `DFA-005` deterministic parent navigation are implemented.\n- `DFA-004` route convergence and `DFA-006` meaningful action/Play aggregation are partial and remain active.\n- `DFA-007` is partial: real Scottish Matchweek 1 result truth and reload-persistent Matchweek 2 LMS are proven. The private Championship read contract is merged to the repository, while hosted Development still trails that repository change; exact contract numbers belong only in the live status authority. PR #593 remains the signed-in Championship UI proof/merge candidate after the guarded rollout.\n- The four-provider capability/terms audit is merged as PR #594. The first provenance-backed team-profile schema candidate is PR #595, with the Development-only retained-response population lane stacked as PR #596. Both remain deliberately behind the `DFA-007` hosted/signed-in dependency and add no provider-to-official-result authority.\n- Production release posture is not inferred from any of these candidates; read the live status and operations inventory for the database, Netlify declaration and actually published artifact separately.\n\n## Development operating model'''
          replace_once('docs/roadmap.md', roadmap_anchor, roadmap_insert)

          # Current status — explicitly separate DB, Netlify declaration and published bundle.
          current_anchor = 'The repository candidate is **133**. Development Supabase and Production Supabase are both hosted at **132** after the verified Contract 132 rollouts; Contract 133 remains repository-only until its guarded Development rollout is applied and verified.\n'
          current_replace = current_anchor + '\nNetlify is a separate release layer. A fresh project read on 8 August 2026 shows `EURO28_DEPLOYED_DB_CONTRACT=132` in `dev`, `branch-deploy`, `deploy-preview` and `production`, and Team SSO is required for **all** deploy contexts. Those declarations describe the hosted database each future build targets; they do **not** mean the application was rebuilt. The currently published production artifact is still the 30 July 2026 build from `8244b7222b9d108e59380fd16351c02b578497ee`, a Contract-63-era application bundle.\n'
          replace_once('docs/quality/current-status.md', current_anchor, current_replace)

          # Netlify runbook — current platform facts replace the stale 97/63 model.
          netlify = '''# Netlify deployment access and verification\n\nThis runbook defines the live Netlify project boundary for the Football Prediction Hub.\n\n## Authoritative project\n\n- Live Netlify project: `euro28predictor`.\n- Production domain: `https://euro28predictor.com`.\n- Historic project `euro28-predictor-dev` is retired and must not be configured, deployed or treated as current evidence.\n- Netlify Team SSO currently protects **all deploy contexts**, including production.\n\n## Contract declarations\n\nNetlify's `EURO28_DEPLOYED_DB_CONTRACT` value describes the hosted database reached by a build in that deploy context. It is compatibility metadata for the build gate; it is **not** proof that an application bundle has been rebuilt or published.\n\n| Context | Supabase target | Declared hosted contract |\n| --- | --- | ---: |\n| `dev` | Development | 132 |\n| `branch-deploy` | Development | 132 |\n| `deploy-preview` | Development | 132 |\n| `production` | Production | 132 |\n\nA direct Netlify project/environment read on 8 August 2026 confirmed all four values above. The three non-production contexts point to the Development Supabase project; production points to the Production Supabase project. A fifth `dev-server` context still carries an empty declaration and therefore fails closed under `scripts/validate-deployment-contract.mjs`.\n\nThe repository test does not hard-code these numbers. It requires the three non-production documentation values to match `config/development-hosted-contract.json` and the production documentation value to match `config/production-hosted-contract.json`. A hosted database rollout therefore has one machine-backed value to reconcile into Netlify configuration rather than another permanent magic number.\n\nThe declaration must never be raised ahead of the hosted database or used to manufacture a green build. After a separately authorised hosted rollout, update the matching Netlify context only from fresh target-specific evidence. An environment-variable update is configuration, not a deployment.\n\nThe blank `dev-server` override is a Netlify configuration debt. Remove it or set it deliberately before relying on Netlify Dev as hosted-contract evidence.\n\n## Published production artifact\n\nThe currently published production deploy is still the 30 July 2026 build from commit `8244b7222b9d108e59380fd16351c02b578497ee` (deploy `6a6bac566b6e440008d44e5b`). It is a Contract-63-era application artifact even though the current production environment declaration now says 132 and the Production database is hosted at 132.\n\nThat distinction is intentional and mandatory in status reporting:\n\n1. **repository application contract** — what current source requires;\n2. **hosted database contract** — what Supabase has applied;\n3. **Netlify environment declaration** — what a new build says it targets;\n4. **published artifact** — the source/build users would actually receive.\n\nNever call Production application-aligned or deployed merely because (2) and (3) match. A source-backed deploy of the exact tested application is still required.\n\n## Build authority\n\nThe repository owns the deploy build settings in `netlify.toml`:\n\n```toml\n[build]\n  command = "npm run build"\n  publish = "dist"\n```\n\nThe Netlify UI must not carry a conflicting command or publish directory. `npm run build` executes the environment and deployment-contract gates before Vite publishes the SPA.\n\n## Protected preview verification\n\nNetlify team-login protection is intentionally human-authenticated. It does not provide a supported non-interactive site session for GitHub Actions.\n\nThe `deploy-preview-smoke` job runs only for pull requests targeting `main`, because Netlify does not publish a deploy-preview status for stacked pull requests whose base is another feature branch. It verifies two facts without weakening protection:\n\n1. Netlify reports a successful `netlify/euro28predictor/deploy-preview` commit status for the exact pull-request head SHA.\n2. The preview's `/release.json` is not publicly readable as release metadata.\n\nThe job fails if Netlify reports failure/error, never certifies the exact head, exposes valid deploy-preview release metadata publicly, returns a missing/error response instead of a recognisable protection response, or points its status away from Netlify.\n\nA pull-request base change or reopen is not deploy evidence by itself. After rebasing or retargeting, push a genuine head commit so Netlify receives a normal synchronize event and publishes a status for that exact SHA.\n\nThis is not a substitute for application browser testing. The same workflow runs the authenticated application journeys against a disposable local Supabase rebuilt from every committed migration. Public CDN HTTP and browser smoke remain release-specific gates; while Team SSO protects production, the private signed-in verification is the relevant outer-access posture.\n\nDo not add a shared password, hard-coded credential, commit-derived password or secret-bearing `Basic-Auth` rule merely to make CI enter a protected preview.\n\n## Pull requests and concurrent work\n\nA Netlify access/configuration PR must:\n\n- start from the latest relevant `main` or active dependency branch;\n- avoid changing hosted database state;\n- change a contract declaration only from fresh hosted evidence for that exact target;\n- preserve the exact-head Netlify status gate;\n- include tests that read the workflow and `netlify.toml`;\n- be compared with current `main` immediately before merge;\n- be merged only when required checks are green and no concurrent branch has introduced conflicting Netlify or hosted-status changes.\n\n## Manual account actions\n\nThe following settings remain account/team controls rather than repository changes:\n\n- enable MFA on the Netlify owner account;\n- enforce team MFA when the plan supports it;\n- replace the personal public support address with a dedicated working alias;\n- remove the blank `dev-server` contract override.\n\nNo Netlify Function or Edge Function is required for the current static Vite SPA. Add one only for a distinct server-side responsibility that cannot remain in Supabase or the static build.\n\n## Production protection\n\nTeam SSO is the current private-testing perimeter across all contexts. Production database promotion, Netlify declaration alignment and application deployment are still separate operations. Before publishing a new application artifact, require the ordinary Production backup/preflight/exact-range/postflight controls, exact source/contract alignment, the intended feature flags, release smoke and a recorded rollback deploy.\n\nEvery production release must record the exact source commit, deploy ID, application contract, Supabase project/contract, Netlify declaration, access-control posture, smoke evidence and rollback deploy ID.\n'''
          write('docs/ops/netlify-deploy-access.md', netlify)

          # Ops inventory — update only live rows; preserve dated historical evidence below.
          regex_once('docs/ops/ops-pending-migrations.md', r'\| Netlify `euro28predictor` non-production contexts \| \*\*97 hosted declaration\*\* \|[^\n]*\|[^\n]*\|', '| Netlify `euro28predictor` non-production contexts | **132 hosted declaration** | Direct Netlify read on 8 August 2026: `dev`, `branch-deploy` and `deploy-preview` point to Development, each declare 132, and Team SSO protects all contexts. `dev-server` remains blank and fails closed. | LEVEL WITH HOSTED DEVELOPMENT; ONE MIGRATION BEHIND THE CONTRACT-133 REPOSITORY CANDIDATE |')
          regex_once('docs/ops/ops-pending-migrations.md', r'\| Netlify `euro28predictor` production \| \*\*63 hosted declaration\*\* \|[^\n]*\|[^\n]*\|', '| Netlify `euro28predictor` production | **132 hosted declaration** | Direct Netlify read on 8 August 2026: production points to Production Supabase and declares 132; Team SSO protects production. The published artifact is still the 30 July `8244b722…` Contract-63-era bundle, so declaration alignment is **not** an application deployment. | LEVEL WITH HOSTED PRODUCTION; PUBLISHED APPLICATION STILL OLD |')
          replace_once('docs/ops/ops-pending-migrations.md', '### Corroborating the Netlify declaration', '### Historical Netlify declaration evidence — 5 August 2026\n\nThe section below is retained as dated evidence of how the previous 97/63 declarations were verified and how the trailing-preview gate behaves. Its old numeric actions are **not current instructions**; the live table above and [`netlify-deploy-access.md`](netlify-deploy-access.md) now carry the current 132/132 declarations and published-artifact distinction.\n\n### Corroborating the Netlify declaration')

          # Freshness test — compare documentation to machine-hosted records, never magic 63.
          test_path = 'tests/scripts/documentationContractFreshness.test.ts'
          test = read(test_path)
          contract_anchor = "const contract = JSON.parse(\n  readFileSync(resolve(repositoryRoot, 'config/deployment-contract.json'), 'utf8'),\n) as { contractVersion: number; requiredMigrationCount: number }\n"
          contract_add = contract_anchor + "\nconst developmentHosted = JSON.parse(\n  readFileSync(resolve(repositoryRoot, 'config/development-hosted-contract.json'), 'utf8'),\n) as { requiredMigrationCount: number }\n\nconst productionHosted = JSON.parse(\n  readFileSync(resolve(repositoryRoot, 'config/production-hosted-contract.json'), 'utf8'),\n) as { requiredMigrationCount: number }\n"
          if test.count(contract_anchor) != 1:
              raise SystemExit('documentation freshness test: contract anchor missing/duplicated')
          test = test.replace(contract_anchor, contract_add, 1)
          old_test = '''  it('keeps production at the Euro baseline contract in both documents', () => {\n    // Production is pinned at 63 with a fatal gate until an explicitly approved\n    // promotion. Raising it in a document is how the real one gets raised next.\n    expect(runbookRows.get('production')).toBe(63)\n    expect(inventoryProduction[0]?.[1]).toBe(63)\n  })\n'''
          new_test = '''  it('matches non-production declarations to the Development hosted machine record', () => {\n    const expected = developmentHosted.requiredMigrationCount\n    for (const context of runbookNonProduction) {\n      expect(runbookRows.get(context), `${context} does not match hosted Development`).toBe(expected)\n    }\n    expect(inventoryNonProduction[0]?.[1]).toBe(expected)\n  })\n\n  it('matches the production declaration to the Production hosted machine record', () => {\n    const expected = productionHosted.requiredMigrationCount\n    expect(runbookRows.get('production')).toBe(expected)\n    expect(inventoryProduction[0]?.[1]).toBe(expected)\n  })\n'''
          if test.count(old_test) != 1:
              raise SystemExit('documentation freshness test: production pin block missing/duplicated')
          test = test.replace(old_test, new_test, 1)
          closeout_anchor = "describe('live-authority documents do not pin a moving commit', () => {"
          closeout = '''describe('agent documentation closeout control', () => {\n  it('requires every implementation or hosted-state change to close its documentation impact', () => {\n    const agents = read('AGENTS.md')\n    expect(agents).toContain('## Documentation-impact closeout')\n    expect(agents).toContain('No documentation impact')\n    expect(agents).toContain('npm run generate:now')\n    expect(agents).toContain('dated audits, investigations or rollout evidence')\n  })\n})\n\n'''
          if test.count(closeout_anchor) != 1:
              raise SystemExit('documentation freshness test: live-authority heading missing/duplicated')
          test = test.replace(closeout_anchor, closeout + closeout_anchor, 1)
          write(test_path, test)
          PY

          node scripts/generate-now.mjs

          git diff --check
          git status --short

      - name: Commit reconciled authorities
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AGENTS.md MASTER-TODO.md NOW.md docs/quality/current-status.md docs/quality/accepted-requirements.md docs/design/ui-modernisation-execution.md docs/roadmap.md docs/ops/ops-pending-migrations.md docs/ops/netlify-deploy-access.md tests/scripts/documentationContractFreshness.test.ts
          git diff --cached --quiet && { echo 'No reconciliation changes produced'; exit 1; }
          git commit -m 'Docs: reconcile live authorities and Netlify posture'
          git push origin HEAD:docs/live-authority-reconciliation-20260808
