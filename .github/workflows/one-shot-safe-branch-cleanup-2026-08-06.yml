name: One-shot safe branch cleanup

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-shot-safe-branch-cleanup-2026-08-06.yml

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: one-shot-safe-branch-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Delete objectively redundant branches
        id: cleanup
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const fullName = `${owner}/${repo}`;

            const repository = await github.rest.repos.get({ owner, repo });
            const defaultBranch = repository.data.default_branch;

            const branches = await github.paginate(
              github.rest.repos.listBranches,
              { owner, repo, per_page: 100 },
            );

            const openPulls = await github.paginate(
              github.rest.pulls.list,
              { owner, repo, state: 'open', per_page: 100 },
            );

            const closedPulls = await github.paginate(
              github.rest.pulls.list,
              { owner, repo, state: 'closed', per_page: 100, sort: 'updated', direction: 'desc' },
            );

            const protectedRefs = new Set([defaultBranch]);
            for (const pull of openPulls) {
              if (pull.head.repo?.full_name === fullName) protectedRefs.add(pull.head.ref);
              if (pull.base.repo?.full_name === fullName) protectedRefs.add(pull.base.ref);
            }

            const mergedHeadShasByRef = new Map();
            for (const pull of closedPulls) {
              if (!pull.merged_at || pull.head.repo?.full_name !== fullName) continue;
              if (!mergedHeadShasByRef.has(pull.head.ref)) {
                mergedHeadShasByRef.set(pull.head.ref, new Set());
              }
              mergedHeadShasByRef.get(pull.head.ref).add(pull.head.sha);
            }

            const report = {
              generated_at: new Date().toISOString(),
              repository: fullName,
              default_branch: defaultBranch,
              initial_branch_count: branches.length,
              protected_refs: [...protectedRefs].sort(),
              deleted: [],
              survivors: [],
              failures: [],
            };

            for (const branch of branches) {
              const name = branch.name;
              const sha = branch.commit.sha;

              if (protectedRefs.has(name)) {
                report.survivors.push({ name, sha, reason: 'default-or-open-pr-ref' });
                continue;
              }

              let safeReason = null;
              try {
                const comparison = await github.rest.repos.compareCommits({
                  owner,
                  repo,
                  base: defaultBranch,
                  head: name,
                  per_page: 1,
                });

                if (comparison.data.ahead_by === 0) {
                  safeReason = 'no-commits-ahead-of-default';
                } else if (mergedHeadShasByRef.get(name)?.has(sha)) {
                  safeReason = 'tip-matches-merged-pr-head';
                } else {
                  report.survivors.push({
                    name,
                    sha,
                    reason: 'unique-or-unproven-commits',
                    ahead_by: comparison.data.ahead_by,
                    behind_by: comparison.data.behind_by,
                  });
                  continue;
                }
              } catch (error) {
                report.failures.push({
                  name,
                  sha,
                  stage: 'classification',
                  error: error.message,
                });
                continue;
              }

              try {
                await github.rest.git.deleteRef({ owner, repo, ref: `heads/${name}` });
                report.deleted.push({ name, sha, reason: safeReason });
              } catch (error) {
                report.failures.push({
                  name,
                  sha,
                  stage: 'deletion',
                  reason: safeReason,
                  error: error.message,
                });
              }
            }

            report.final_expected_branch_count =
              report.initial_branch_count - report.deleted.length;

            fs.writeFileSync(
              'branch-cleanup-report.json',
              JSON.stringify(report, null, 2) + '\n',
            );

            core.summary
              .addHeading('Safe branch cleanup')
              .addTable([
                [{ data: 'Metric', header: true }, { data: 'Count', header: true }],
                ['Initial branches', String(report.initial_branch_count)],
                ['Deleted', String(report.deleted.length)],
                ['Survivors', String(report.survivors.length)],
                ['Failures', String(report.failures.length)],
                ['Expected remaining', String(report.final_expected_branch_count)],
              ])
              .addHeading('Protected refs')
              .addList(report.protected_refs)
              .write();

            core.info(`BRANCH_CLEANUP_REPORT=${JSON.stringify(report)}`);

      - name: Upload cleanup report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: branch-cleanup-report
          path: branch-cleanup-report.json
          if-no-files-found: warn
          retention-days: 30
