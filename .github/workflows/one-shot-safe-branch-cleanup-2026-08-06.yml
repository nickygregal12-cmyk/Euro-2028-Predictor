name: One-shot archive and branch cleanup

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-shot-safe-branch-cleanup-2026-08-06.yml

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: one-shot-safe-branch-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Archive historical tips and delete inactive branches
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const fullName = `${owner}/${repo}`;

            const repository = await github.rest.repos.get({ owner, repo });
            const defaultBranch = repository.data.default_branch;

            const listOpenProtectedRefs = async () => {
              const pulls = await github.paginate(
                github.rest.pulls.list,
                { owner, repo, state: 'open', per_page: 100 },
              );
              const refs = new Set([defaultBranch]);
              for (const pull of pulls) {
                if (pull.head.repo?.full_name === fullName) refs.add(pull.head.ref);
                if (pull.base.repo?.full_name === fullName) refs.add(pull.base.ref);
              }
              return refs;
            };

            const branches = await github.paginate(
              github.rest.repos.listBranches,
              { owner, repo, per_page: 100 },
            );
            const protectedAtStart = await listOpenProtectedRefs();
            const candidates = branches.filter((branch) => !protectedAtStart.has(branch.name));

            const defaultRef = await github.rest.git.getRef({
              owner,
              repo,
              ref: `heads/${defaultBranch}`,
            });
            const defaultSha = defaultRef.data.object.sha;
            const defaultCommit = await github.rest.git.getCommit({
              owner,
              repo,
              commit_sha: defaultSha,
            });
            const defaultTreeSha = defaultCommit.data.tree.sha;

            const manifest = {
              generated_at: new Date().toISOString(),
              repository: fullName,
              default_branch: defaultBranch,
              default_sha: defaultSha,
              protected_refs_at_start: [...protectedAtStart].sort(),
              archived_branches: candidates
                .map((branch) => ({ name: branch.name, sha: branch.commit.sha }))
                .sort((a, b) => a.name.localeCompare(b.name)),
            };

            let archiveHead = defaultSha;
            const uniqueTips = [...new Set(candidates.map((branch) => branch.commit.sha))]
              .filter((sha) => sha !== defaultSha);
            const batchSize = 20;

            for (let index = 0; index < uniqueTips.length; index += batchSize) {
              const batch = uniqueTips.slice(index, index + batchSize)
                .filter((sha) => sha !== archiveHead);
              if (batch.length === 0) continue;
              const archiveCommit = await github.rest.git.createCommit({
                owner,
                repo,
                message: `Archive historical branch tips ${index + 1}-${index + batch.length}`,
                tree: defaultTreeSha,
                parents: [archiveHead, ...batch],
              });
              archiveHead = archiveCommit.data.sha;
            }

            const manifestPath = `.branch-archive/manifest-2026-08-06-run-${context.runId}.json`;
            const manifestBlob = await github.rest.git.createBlob({
              owner,
              repo,
              content: JSON.stringify(manifest, null, 2) + '\n',
              encoding: 'utf-8',
            });
            const archiveTree = await github.rest.git.createTree({
              owner,
              repo,
              base_tree: defaultTreeSha,
              tree: [{
                path: manifestPath,
                mode: '100644',
                type: 'blob',
                sha: manifestBlob.data.sha,
              }],
            });
            const finalArchiveCommit = await github.rest.git.createCommit({
              owner,
              repo,
              message: `Archive ${candidates.length} historical branch refs before cleanup`,
              tree: archiveTree.data.sha,
              parents: [archiveHead],
            });

            const archiveTag = `branch-archive-2026-08-06-run-${context.runId}`;
            await github.rest.git.createRef({
              owner,
              repo,
              ref: `refs/tags/${archiveTag}`,
              sha: finalArchiveCommit.data.sha,
            });

            const protectedBeforeDelete = await listOpenProtectedRefs();
            const report = {
              generated_at: new Date().toISOString(),
              repository: fullName,
              initial_branch_count: branches.length,
              archive_tag: archiveTag,
              archive_commit: finalArchiveCommit.data.sha,
              manifest_path: manifestPath,
              protected_refs: [...protectedBeforeDelete].sort(),
              deleted: [],
              skipped: [],
              failures: [],
            };

            for (const branch of candidates) {
              const name = branch.name;
              const archivedSha = branch.commit.sha;

              if (protectedBeforeDelete.has(name)) {
                report.skipped.push({ name, sha: archivedSha, reason: 'open-pr-created-before-deletion' });
                continue;
              }

              let liveSha;
              try {
                const liveRef = await github.rest.git.getRef({ owner, repo, ref: `heads/${name}` });
                liveSha = liveRef.data.object.sha;
              } catch (error) {
                if (error.status === 404) {
                  report.skipped.push({ name, sha: archivedSha, reason: 'already-deleted' });
                  continue;
                }
                report.failures.push({ name, sha: archivedSha, stage: 'recheck', error: error.message });
                continue;
              }

              if (liveSha !== archivedSha) {
                report.skipped.push({
                  name,
                  archived_sha: archivedSha,
                  live_sha: liveSha,
                  reason: 'branch-changed-after-archive',
                });
                continue;
              }

              try {
                await github.rest.git.deleteRef({ owner, repo, ref: `heads/${name}` });
                report.deleted.push({ name, sha: archivedSha });
              } catch (error) {
                report.failures.push({ name, sha: archivedSha, stage: 'deletion', error: error.message });
              }
            }

            report.expected_remaining_branch_count =
              report.initial_branch_count - report.deleted.length;

            fs.writeFileSync(
              'branch-archive-cleanup-report.json',
              JSON.stringify(report, null, 2) + '\n',
            );

            core.summary
              .addHeading('Archived branch cleanup')
              .addTable([
                [{ data: 'Metric', header: true }, { data: 'Count', header: true }],
                ['Initial branches', String(report.initial_branch_count)],
                ['Archived candidates', String(candidates.length)],
                ['Deleted', String(report.deleted.length)],
                ['Skipped', String(report.skipped.length)],
                ['Failures', String(report.failures.length)],
                ['Expected remaining', String(report.expected_remaining_branch_count)],
              ])
              .addHeading('Archive tag')
              .addCodeBlock(archiveTag)
              .addHeading('Protected refs')
              .addList(report.protected_refs)
              .write();

            core.info(`BRANCH_ARCHIVE_CLEANUP_REPORT=${JSON.stringify(report)}`);

      - name: Upload archive cleanup report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: branch-archive-cleanup-report
          path: branch-archive-cleanup-report.json
          if-no-files-found: warn
          retention-days: 30
