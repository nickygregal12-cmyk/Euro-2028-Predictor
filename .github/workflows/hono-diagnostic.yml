name: Hono dependency diagnostic

on:
  pull_request:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.22.2
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Show Hono dependency chain
        shell: bash
        run: |
          set -o pipefail
          npm ls hono --all || true
          npm explain hono || true
      - name: Reproduce production audit
        run: npm audit --omit=dev --audit-level=high
