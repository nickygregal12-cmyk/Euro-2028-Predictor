name: Reconcile Stage C1 live status

on:
  push:
    branches:
      - agent/stage-c1-migration
    paths:
      - .github/workflows/patch-stage-c1-live-status.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stage-c1-migration
      - name: Update contract authorities
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path_name: str, replacements: list[tuple[str, str]]) -> None:
              path = Path(path_name)
              source = path.read_text()
              for old, new in replacements:
                  if old not in source:
                      raise SystemExit(f'missing expected text in {path_name}: {old[:100]}')
                  source = source.replace(old, new, 1)
              path.write_text(source)

          replace('docs/quality/current-status.md', [
              ('**Status date:** 30 July 2026', '**Status date:** 31 July 2026'),
              ('| Repository contract | **64** canonical migrations through `20260730180000_cup_winner_deletion_semantics.sql` |', '| Repository contract | **66** canonical migrations through `20260730235721_stage_c1_competition_season_compatibility.sql`; contracts 65–66 are PR #317 repository/disposable evidence and are not applied to hosted Supabase |'),
              ('| Next executable issue | **#303 — exact C1 migration planning and disposable proof.** No C2 work belongs in that issue and no hosted write is authorised |', '| Next executable issue | **PR #317 migration review and recovery/rollout evidence.** C1 repository/disposable implementation exists; no C2 work or hosted write is authorised |'),
              ('**Production deploys are paused from contract 64 onward** because the repository requires 64 while production Supabase remains 63.', '**Production deploys are paused from contract 64 onward**; PR #317 raises the repository candidate to contract 66 while production Supabase remains 63.'),
              ('| Timezone authority | **Seam landed; persistence belongs to C1.** PR #252 separates `competitionTimeZone` from `viewerTimeZone`, but adapters still fall back to the viewer until C1 supplies `tournaments.display_timezone`. |', '| Timezone authority | **Persisted in the C1 repository candidate.** PR #317 supplies `tournaments.display_timezone` to the PR #252 seam while retaining a contract-64 hosted fallback until an approved migration rollout. |'),
              ('| Stage C1 | **Pre-SQL governance, assertion classification and detailed schema/coverage reconciliation are complete.** Migration drafting and disposable proof are next; no migration or hosted write exists. |', '| Stage C1 | **Implemented in repository/disposable evidence at contract 66.** Zero-to-current rebuild, database lint, pgTAP and TypeScript/PostgreSQL parity pass; hosted development and production remain unchanged pending review and explicit approval. |'),
              ('These are evidence for the first competition. They do not imply that season rules, season scoping or multi-competition surfaces already exist.', 'These are evidence for the first competition. Contract 66 adds the shared competition-season schema foundation, but domestic-season game rules, ingestion and multi-competition surfaces do not yet exist.'),
              ('four proposed C1 relations', 'four implemented C1 relations'),
              ('No migration exists and no hosted schema operation is authorised.', 'Two ordered C1 migrations exist in PR #317 and pass disposable proof. No hosted schema operation is authorised.'),
              ('- Stage C1 migration implementation and disposable proof;', '- Stage C1 migration review, recovery evidence and separately approved hosted rollout;'),
          ])

          replace('docs/ops/ops-pending-migrations.md', [
              ('## Current repository state — 30 July 2026', '## Current repository state — 31 July 2026'),
              ('| Repository `main` | **64** | 64 canonical files through `20260730180000_cup_winner_deletion_semantics.sql` | VERIFIED |', '| Repository PR #317 | **66** | 66 canonical files through `20260730235721_stage_c1_competition_season_compatibility.sql`; zero-to-current rebuild, lint, pgTAP and TS/Postgres parity pass | DISPOSABLE VERIFIED; HOSTED NOT APPLIED |\n| Repository `main` | **64** | 64 canonical files through `20260730180000_cup_winner_deletion_semantics.sql` until PR #317 is reviewed and merged | VERIFIED |'),
              ('| Netlify `deploy-preview` / `branch-deploy` | **64** | `EURO28_DEPLOYED_DB_CONTRACT=64`; preview build passes the contract gate and the exact-head smoke reports contract 64 | VERIFIED |', '| Netlify `deploy-preview` / `branch-deploy` | **64 hosted declaration** | PR #317 expects repository contract 66, but an exact Netlify preview was unavailable during validation; no hosted contract claim is made | REQUIRES EXACT PREVIEW |'),
              ('| Netlify `production` | 63 | **production deploys are paused**: the repository requires 64, so the prebuild gate refuses the build. The last good deploy stays live. Owner-accepted 30 July 2026 | BLOCKED BY DESIGN |', '| Netlify `production` | 63 | **production deploys remain paused**. `main` requires 64 today and the PR #317 candidate requires 66; the last good contract-63 deploy stays live | BLOCKED BY DESIGN |'),
              ('### Contract 64', '### Contracts 65–66 — Stage C1 repository candidate\n\n| # | Canonical migration | Repository-side purpose | Hosted status |\n| ---: | --- | --- | --- |\n| 65 | `20260730235602_stage_c1_competition_season_foundation.sql` | Stable competition identity, season metadata/timezone, rounds, fixture administration, lock evidence, awards and same-season relationship constraints | disposable VERIFIED; not hosted |\n| 66 | `20260730235721_stage_c1_competition_season_compatibility.sql` | Effective lock/Joker compatibility, private trigger authorities and always-on scope preparation discovered by the first rebuild | disposable VERIFIED; not hosted |\n\nContracts 65–66 preserve the complete C2 auth ownership/deletion boundary. Issue #272 still blocks profile ownership, pseudonymisation and account-erasure changes. No development or production migration is authorised merely because disposable parity passes.\n\n### Contract 64'),
              ('**To unblock production:** apply the migration to production Supabase, confirm `confdeltype = \'r\'`, then set `EURO28_DEPLOYED_DB_CONTRACT=64` on the `production` context. Do not set the production value before the database is verified — that is the exact inversion the gate exists to prevent.', '**Historical contract-64 release note:** production remains intentionally at 63. Do not apply contract 64, 65 or 66 merely to equalise numbers. The next production milestone requires exact review, backup/recovery evidence, explicit owner approval, sequential migration verification and an exact approved release.'),
              ('1. development migration count/highest version and public/private function privileges;', '1. development migration count/highest version and public/private function privileges before any contract-65/66 write;'),
          ])

          replace('AGENTS.md', [
              ('- repository and development Supabase are contract **64**;\n- production Supabase and the last published application remain contract **63**;', '- the PR #317 repository candidate is contract **66**;\n- current `main` and development Supabase remain contract **64**;\n- production Supabase and the last published application remain contract **63**;'),
              ('PR #252 lands the competition/viewer timezone seam but intentionally keeps viewer fallback until Stage C1 supplies `tournaments.display_timezone`.', 'PR #252 lands the competition/viewer timezone seam. PR #317 supplies persisted `tournaments.display_timezone` in the contract-66 repository candidate while retaining hosted contract-64 fallback.'),
              ('- **Stage C1 — issue #303:** competition-season identity, fields, rounds, timezone, locks, same-season safeguards and Euro preservation. C1 may proceed through design/contract reconciliation and disposable proof, but must leave current auth-owned competitive rows, foreign-key actions and ownership RLS unchanged.', '- **Stage C1 — issue #303 / PR #317:** competition-season identity, fields, rounds, timezone, locks, same-season safeguards and Euro preservation are implemented in repository/disposable evidence at contract 66. The current auth-owned competitive rows, foreign-key actions and ownership RLS remain unchanged; no hosted write is authorised.'),
              ('The repository is at **contract 64** through `20260730180000_cup_winner_deletion_semantics.sql`. That is not a Stage C migration. Development Supabase is at contract 64; production remains at 63. Any hosted schema mutation requires explicit owner approval and the applicable preflight.', 'The PR #317 repository candidate is at **contract 66** through `20260730235721_stage_c1_competition_season_compatibility.sql`. Current `main` and development Supabase remain at contract 64; production remains at 63. Contracts 65–66 are disposable-only C1 evidence until separately reviewed and explicitly approved. Any hosted schema mutation requires explicit owner approval and the applicable preflight.'),
          ])
          PY
          git rm .github/workflows/patch-stage-c1-live-status.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/quality/current-status.md docs/ops/ops-pending-migrations.md AGENTS.md
          git commit -m "Reconcile live authorities to contract 66"
          git push origin HEAD:agent/stage-c1-migration
