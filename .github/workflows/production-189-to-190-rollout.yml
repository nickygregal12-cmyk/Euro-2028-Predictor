name: Production 189 to 190 rollout

# One-shot guarded promotion of Contract 190. The migration changes betting
# evidence authority only: historical ai.bets rows remain, synthetic/reference
# venues stop contributing to actionable evidence, and future non-real/unknown
# bookmaker inserts are rejected. No provider call or model promotion belongs in
# this workflow.

on:
  workflow_dispatch:
    inputs:
      project_ref:
        description: Exact Production project ref confirmation
        required: true
      confirmation:
        description: Type APPLY-PRODUCTION-189-TO-190 to proceed
        required: true
      backup_run_id:
        description: Run id of the successful fresh Production backup
        required: true
      rehearsal_run_id:
        description: Run id of the successful 189-to-190 rehearsal
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: production-migration-rollout
  cancel-in-progress: false

env:
  EXPECTED_PROJECT_REF: vkfnsqdyhvtwyqkisxhk
  FORBIDDEN_DEVELOPMENT_REF: iouzoutneyjpugbbtdem
  CONFIRMATION_PHRASE: APPLY-PRODUCTION-189-TO-190
  SOURCE_CONTRACT: '189'
  SOURCE_VERSION: '20260813215920'
  SOURCE_NAME: ai_quarantined_evidence_reads
  TARGET_CONTRACT: '190'
  TARGET_VERSION: '20260814005000'
  TARGET_NAME: ai_actionable_bet_evidence
  WORK_DIR: /tmp/production-189-to-190

jobs:
  rollout:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Refuse an unsafe dispatch or repository state
        env:
          INPUT_PROJECT_REF: ${{ inputs.project_ref }}
          INPUT_CONFIRMATION: ${{ inputs.confirmation }}
        shell: bash
        run: |
          set -euo pipefail
          [ "${INPUT_CONFIRMATION}" = "${CONFIRMATION_PHRASE}" ] || { echo 'ERROR: confirmation phrase mismatch.'; exit 1; }
          [ "${INPUT_PROJECT_REF}" != "${FORBIDDEN_DEVELOPMENT_REF}" ] || { echo 'ERROR: that is Development.'; exit 1; }
          [ "${INPUT_PROJECT_REF}" = "${EXPECTED_PROJECT_REF}" ] || { echo 'ERROR: project ref is not Production.'; exit 1; }
          [ "${GITHUB_REF}" = 'refs/heads/main' ] || { echo 'ERROR: rollout runs only from main.'; exit 1; }
          git fetch --no-tags origin main
          [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" ] || { echo 'ERROR: HEAD is not exact main.'; exit 1; }
          [ -z "$(git status --porcelain=v1 --untracked-files=all)" ] || { echo 'ERROR: checkout is dirty.'; exit 1; }
          mkdir -p "${WORK_DIR}"

      - name: Prove fresh backup then exact-head rehearsal succeeded
        env:
          GH_TOKEN: ${{ github.token }}
          BACKUP_RUN_ID: ${{ inputs.backup_run_id }}
          REHEARSAL_RUN_ID: ${{ inputs.rehearsal_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          check_run() {
            local id="$1" path="$2" label="$3" json
            json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${id}")"
            [ "$(jq -r '.conclusion' <<<"${json}")" = success ] || { echo "ERROR: ${label} ${id} did not succeed."; exit 1; }
            [ "$(jq -r '.path' <<<"${json}")" = "${path}" ] || { echo "ERROR: ${label} ${id} has wrong workflow path."; exit 1; }
            printf '%s' "${json}"
          }
          backup="$(check_run "${BACKUP_RUN_ID}" '.github/workflows/production-backup.yml' Backup)"
          rehearsal="$(check_run "${REHEARSAL_RUN_ID}" '.github/workflows/production-189-to-190-rehearsal.yml' Rehearsal)"
          rehearsal_sha="$(jq -r '.head_sha' <<<"${rehearsal}")"
          [ "${rehearsal_sha}" = "$(git rev-parse HEAD)" ] || { echo "ERROR: rehearsal head ${rehearsal_sha} is not rollout head."; exit 1; }
          backup_sha="$(jq -r '.head_sha' <<<"${backup}")"
          git merge-base --is-ancestor "${backup_sha}" HEAD || { echo 'ERROR: backup head is not an ancestor of rollout head.'; exit 1; }
          backup_at="$(jq -r '.created_at' <<<"${backup}")"; rehearsal_at="$(jq -r '.created_at' <<<"${rehearsal}")"
          [ "${backup_at}" \< "${rehearsal_at}" ] || { echo 'ERROR: backup does not precede rehearsal.'; exit 1; }
          artifacts="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${BACKUP_RUN_ID}/artifacts")"
          [ "$(jq '[.artifacts[] | select(.name == "production-backup-encrypted" and .expired == false)] | length' <<<"${artifacts}")" = 1 ] || { echo 'ERROR: encrypted backup artifact missing.'; exit 1; }
          echo "Sequence verified: backup ${BACKUP_RUN_ID} -> rehearsal ${REHEARSAL_RUN_ID} -> rollout."

      - name: Prove repository boundary is exactly 189 to 190
        shell: bash
        run: |
          set -euo pipefail
          committed="$(git ls-files 'supabase/migrations/*.sql' | wc -l | tr -d ' ')"
          declared="$(node -p "require('./config/deployment-contract.json').requiredMigrationCount")"
          newest="$(basename "$(git ls-files 'supabase/migrations/*.sql' | sort | tail -1)")"
          [ "${committed}" = "${TARGET_CONTRACT}" ] || { echo "ERROR: repository has ${committed} migrations."; exit 1; }
          [ "${declared}" = "${TARGET_CONTRACT}" ] || { echo "ERROR: deployment contract is ${declared}."; exit 1; }
          [ "${newest}" = "${TARGET_VERSION}_${TARGET_NAME}.sql" ] || { echo "ERROR: newest migration is ${newest}."; exit 1; }
          files=''
          for file in $(git ls-files 'supabase/migrations/*.sql' | sort); do
            version="$(basename "${file}")"; version="${version:0:14}"
            if [[ "${version}" > "${SOURCE_VERSION}" && ! "${version}" > "${TARGET_VERSION}" ]]; then files="${files} ${file}"; fi
          done
          # Declared, not rewritten: the migration list is split on purpose; quoting passes one argument, not many. This is a spent one-shot promotion
          # script; changing what it DOES to satisfy a style rule would edit the
          # record of a past production apply. shellcheck only began seeing it
          # when SHA-pinning marked the file changed, so it is pre-existing.
          # shellcheck disable=SC2086
          [ "$(printf '%s\n' ${files} | grep -c . || true)" = 1 ] || { echo 'ERROR: boundary contains other migrations.'; exit 1; }
          # Declared, not rewritten: the migration list is split on purpose; quoting passes one argument, not many. This is a spent one-shot promotion
          # script; changing what it DOES to satisfy a style rule would edit the
          # record of a past production apply. shellcheck only began seeing it
          # when SHA-pinning marked the file changed, so it is pre-existing.
          # shellcheck disable=SC2086
          [ "$(basename ${files})" = "${TARGET_VERSION}_${TARGET_NAME}.sql" ] || { echo 'ERROR: pending migration is not Contract 190.'; exit 1; }
          # Declared, not rewritten: the migration list is split on purpose; quoting passes one argument, not many. This is a spent one-shot promotion
          # script; changing what it DOES to satisfy a style rule would edit the
          # record of a past production apply. shellcheck only began seeing it
          # when SHA-pinning marked the file changed, so it is pre-existing.
          # shellcheck disable=SC2086
          node scripts/check-migration-additive.mjs ${files}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.2

      - uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf
        with:
          version: 2.109.1
          github-token: ${{ github.token }}

      - name: Install PostgreSQL 17 client tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17

      - name: Capture exact pre-apply Production state
        env:
          SUPABASE_PROD_DB_URL: ${{ secrets.SUPABASE_PROD_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${SUPABASE_PROD_DB_URL}" ] || { echo 'ERROR: SUPABASE_PROD_DB_URL missing.'; exit 1; }
          case "${SUPABASE_PROD_DB_URL}" in
            *"${FORBIDDEN_DEVELOPMENT_REF}"*) echo 'ERROR: Production secret resolves to Development.'; exit 1 ;;
            *"${EXPECTED_PROJECT_REF}"*) ;;
            *) echo 'ERROR: Production secret does not name Production.'; exit 1 ;;
          esac
          psql "${SUPABASE_PROD_DB_URL}" -X -q -A -t -v ON_ERROR_STOP=1 -f - > "${WORK_DIR}/before.json" <<'SQL'
          select jsonb_build_object(
            'migration_count',(select count(*) from supabase_migrations.schema_migrations),
            'latest_version',(select version from supabase_migrations.schema_migrations order by version desc limit 1),
            'latest_name',(select name from supabase_migrations.schema_migrations order by version desc limit 1),
            'bets',(select count(*) from ai.bets),
            'valid_bets',(select count(*) from ai.valid_bets),
            'synthetic_valid',(select count(*) from ai.valid_bets vb left join ai.bookmakers bk on bk.code=vb.bookmaker where bk.code is null or not coalesce(bk.is_real_price,false) or bk.kind='aggregate'),
            'real_valid',(select count(*) from ai.valid_bets vb join ai.bookmakers bk on bk.code=vb.bookmaker where bk.is_real_price and bk.kind<>'aggregate'),
            'models',(select count(*) from ai.models),
            'current_models',(select count(*) from ai.models where status='current'),
            'challengers',(select count(*) from ai.models where status='challenger'),
            'api_usage',(select count(*) from ai.api_usage),
            'collection_enabled',(select collection_enabled from ai.api_budget limit 1),
            'cron_jobs',(select count(*) from cron.job),
            'ai_odds_cron_jobs',(select count(*) from cron.job where jobname like 'ai-odds%'),
            'cron_fingerprint',(select md5(coalesce(string_agg(jobid::text||'|'||jobname||'|'||schedule||'|'||command||'|'||active::text,E'\n' order by jobid),'')) from cron.job));
          SQL
          cat "${WORK_DIR}/before.json"
          BEFORE_FILE="${WORK_DIR}/before.json" node --input-type=module <<'NODE'
          import fs from 'node:fs'; const x=JSON.parse(fs.readFileSync(process.env.BEFORE_FILE,'utf8'))
          const want={migration_count:Number(process.env.SOURCE_CONTRACT),latest_version:process.env.SOURCE_VERSION,latest_name:process.env.SOURCE_NAME}
          for (const [k,v] of Object.entries(want)) if(String(x[k])!==String(v)) throw new Error(`Production ${k}=${x[k]}, expected ${v}`)
          if(Number(x.synthetic_valid)<1) throw new Error('Production has no synthetic actionable evidence; stop and inspect the boundary instead of applying blindly.')
          if(x.collection_enabled!==true) throw new Error('Paid odds collection is not enabled before rollout.')
          if(Number(x.ai_odds_cron_jobs)!==4) throw new Error(`Expected four ai-odds cron jobs, found ${x.ai_odds_cron_jobs}`)
          NODE

      - name: Dry run and refuse anything except Contract 190
        env:
          SUPABASE_PROD_DB_URL: ${{ secrets.SUPABASE_PROD_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          supabase migration list --db-url "${SUPABASE_PROD_DB_URL}" | tail -20
          supabase db push --db-url "${SUPABASE_PROD_DB_URL}" --dry-run > "${WORK_DIR}/dry-run.txt" 2>&1
          cat "${WORK_DIR}/dry-run.txt"
          grep -oE '[0-9]{14}_[A-Za-z0-9_-]+\.sql' "${WORK_DIR}/dry-run.txt" | awk '!seen[$0]++' | sort > "${WORK_DIR}/pending.txt"
          printf '%s\n' "${TARGET_VERSION}_${TARGET_NAME}.sql" > "${WORK_DIR}/expected.txt"
          diff -u "${WORK_DIR}/expected.txt" "${WORK_DIR}/pending.txt" || { echo 'ERROR: Production dry run is not exactly Contract 190.'; exit 1; }

      - name: Apply exactly Contract 190
        env:
          SUPABASE_PROD_DB_URL: ${{ secrets.SUPABASE_PROD_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          supabase db push --db-url "${SUPABASE_PROD_DB_URL}" 2>&1 | tee "${WORK_DIR}/apply.txt"

      - name: Verify exact Production 190 behavior and unchanged operations
        env:
          SUPABASE_PROD_DB_URL: ${{ secrets.SUPABASE_PROD_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          psql "${SUPABASE_PROD_DB_URL}" -X -q -A -t -v ON_ERROR_STOP=1 -f - > "${WORK_DIR}/after.json" <<'SQL'
          select jsonb_build_object(
            'migration_count',(select count(*) from supabase_migrations.schema_migrations),
            'latest_version',(select version from supabase_migrations.schema_migrations order by version desc limit 1),
            'latest_name',(select name from supabase_migrations.schema_migrations order by version desc limit 1),
            'target_row_present',(select count(*) from supabase_migrations.schema_migrations where version='20260814005000' and name='ai_actionable_bet_evidence'),
            'bets',(select count(*) from ai.bets),
            'valid_bets',(select count(*) from ai.valid_bets),
            'synthetic_valid',(select count(*) from ai.valid_bets vb left join ai.bookmakers bk on bk.code=vb.bookmaker where bk.code is null or not coalesce(bk.is_real_price,false) or bk.kind='aggregate'),
            'real_valid',(select count(*) from ai.valid_bets vb join ai.bookmakers bk on bk.code=vb.bookmaker where bk.is_real_price and bk.kind<>'aggregate'),
            'models',(select count(*) from ai.models),
            'current_models',(select count(*) from ai.models where status='current'),
            'challengers',(select count(*) from ai.models where status='challenger'),
            'api_usage',(select count(*) from ai.api_usage),
            'collection_enabled',(select collection_enabled from ai.api_budget limit 1),
            'cron_jobs',(select count(*) from cron.job),
            'ai_odds_cron_jobs',(select count(*) from cron.job where jobname like 'ai-odds%'),
            'cron_fingerprint',(select md5(coalesce(string_agg(jobid::text||'|'||jobname||'|'||schedule||'|'||command||'|'||active::text,E'\n' order by jobid),'')) from cron.job),
            'valid_view_real_guard',(position('is_real_price' in pg_get_viewdef('ai.valid_bets'::regclass,true))>0 and position('aggregate' in pg_get_viewdef('ai.valid_bets'::regclass,true))>0),
            'insert_guard',(position('not v_real' in pg_get_functiondef('ai.reject_unbettable_price()'::regprocedure))>0 and position('aggregate' in pg_get_functiondef('ai.reject_unbettable_price()'::regprocedure))>0),
            'dashboard_uses_valid',(position('ai.valid_bets' in pg_get_functiondef('public.admin_ai_betting_dashboard(text)'::regprocedure))>0),
            'market_uses_valid',(position('ai.valid_bets' in pg_get_functiondef('public.admin_ai_evidence_by_market()'::regprocedure))>0),
            'gate_uses_valid',(position('ai.valid_bets' in pg_get_functiondef('public.admin_ai_betting_gate_status()'::regprocedure))>0),
            'bet_builder_guard',(position('not v_book.is_real_price' in pg_get_functiondef('public.admin_ai_bet_builder_candidates(text,text[],timestamp with time zone,timestamp with time zone,integer)'::regprocedure))>0));
          SQL
          cat "${WORK_DIR}/after.json"
          BEFORE_FILE="${WORK_DIR}/before.json" AFTER_FILE="${WORK_DIR}/after.json" node --input-type=module <<'NODE'
          import fs from 'node:fs'
          const b=JSON.parse(fs.readFileSync(process.env.BEFORE_FILE,'utf8')),a=JSON.parse(fs.readFileSync(process.env.AFTER_FILE,'utf8'))
          const p=[]; const eq=(k,v)=>String(a[k])===String(v)||p.push(`${k}=${a[k]}, expected ${v}`)
          eq('migration_count',Number(process.env.TARGET_CONTRACT)); eq('latest_version',process.env.TARGET_VERSION); eq('latest_name',process.env.TARGET_NAME); eq('target_row_present',1)
          eq('bets',b.bets); eq('synthetic_valid',0); eq('real_valid',b.real_valid); eq('valid_bets',b.real_valid)
          for(const k of ['models','current_models','challengers','api_usage','collection_enabled','cron_jobs','ai_odds_cron_jobs','cron_fingerprint']) eq(k,b[k])
          for(const k of ['valid_view_real_guard','insert_guard','dashboard_uses_valid','market_uses_valid','gate_uses_valid','bet_builder_guard']) eq(k,true)
          if(a.collection_enabled!==true) p.push('paid collection is not enabled after rollout')
          if(Number(a.ai_odds_cron_jobs)!==4) p.push(`ai-odds cron count is ${a.ai_odds_cron_jobs}, expected 4`)
          if(p.length){console.error('ROLLOUT VERIFICATION FAILED:\n - '+p.join('\n - '));process.exit(1)}
          console.log(`Production Contract 190 verified. Base bets ${b.bets} preserved; actionable ${b.valid_bets} -> ${a.valid_bets}; synthetic ${b.synthetic_valid} -> 0.`)
          console.log(`Provider usage ${b.api_usage} unchanged; paid collection remains ${a.collection_enabled}; cron fingerprint unchanged.`)
          NODE

      - name: Record the completed safety boundary
        if: success()
        shell: bash
        run: |
          {
            echo '## Production is at Contract 190'
            echo
            # Declared, not rewritten: backticks are literal markdown for the step summary and must not expand. This is a spent one-shot promotion
            # script; changing what it DOES to satisfy a style rule would edit the
            # record of a past production apply. shellcheck only began seeing it
            # when SHA-pinning marked the file changed, so it is pre-existing.
            # shellcheck disable=SC2016
            echo '- Historical `ai.bets` rows were preserved.'
            # Declared, not rewritten: backticks are literal markdown for the step summary and must not expand. This is a spent one-shot promotion
            # script; changing what it DOES to satisfy a style rule would edit the
            # record of a past production apply. shellcheck only began seeing it
            # when SHA-pinning marked the file changed, so it is pre-existing.
            # shellcheck disable=SC2016
            echo '- `ai.valid_bets` now admits only valid-prediction bets from real, non-aggregate registry venues.'
            echo '- Future MAX, AVG, unknown and other non-real bookmaker inserts are rejected by the installed trigger function.'
            # Declared, not rewritten: backticks are literal markdown for the step summary and must not expand. This is a spent one-shot promotion
            # script; changing what it DOES to satisfy a style rule would edit the
            # record of a past production apply. shellcheck only began seeing it
            # when SHA-pinning marked the file changed, so it is pre-existing.
            # shellcheck disable=SC2016
            echo '- Admin betting dashboard, market evidence and publication gate remain on `ai.valid_bets`.'
            echo '- Bet Builder refuses reference-only bookmaker codes.'
            echo '- Provider usage, paid collection, cron schedules and model statuses were unchanged.'
            # Declared, not rewritten: backticks are literal markdown for the step summary and must not expand. This is a spent one-shot promotion
            # script; changing what it DOES to satisfy a style rule would edit the
            # record of a past production apply. shellcheck only began seeing it
            # when SHA-pinning marked the file changed, so it is pre-existing.
            # shellcheck disable=SC2016
            echo '- Reconcile `config/production-hosted-contract.json` from an independent read-only query that names the Contract 190 ledger row.'
          } >> "${GITHUB_STEP_SUMMARY}"
