name: AI tooling bootstrap

on:
  push:
    branches:
      - agent/integrate-ai-development-tooling
    paths:
      - '.github/workflows/ai-tooling-bootstrap.yml'

permissions:
  contents: read

jobs:
  storybook-diagnostic:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/integrate-ai-development-tooling
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install proposed frontend dependencies
        run: |
          npm install @tanstack/react-query@latest posthog-js@latest recharts@latest
          npm install --save-dev storybook@latest @storybook/react-vite@latest
          node <<'NODE'
          const fs = require('fs')
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'))
          pkg.scripts['build:storybook'] = 'storybook build'
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n')
          NODE
      - name: Build Storybook and capture complete output
        id: storybook
        shell: bash
        run: |
          set +e
          npm run build:storybook 2>&1 | tee storybook-build.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload diagnostic log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: storybook-build-log
          path: storybook-build.log
          if-no-files-found: error
      - name: Report Storybook failure
        if: steps.storybook.outputs.status != '0'
        run: exit 1
