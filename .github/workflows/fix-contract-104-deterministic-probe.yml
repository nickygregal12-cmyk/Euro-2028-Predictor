name: Fix Contract 104 deterministic probe

on:
  push:
    branches:
      - agent/contract-104-live-competition-callers

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/contract-104-live-competition-callers

      - name: Make runtime fixture deterministic and remove helper
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('supabase/tests/155_live_competition_callers.sql')
          text = path.read_text()
          before = """  select * into v_old
            from public.bonus_competitions competition
            where competition.visibility_kind = 'public'
              and competition.completed_at is null
              and competition.published
            order by competition.game_key, competition.id
            limit 1;
            if v_old.id is null then raise exception 'Contract 104 needs one published public competition'; end if;
            select id into v_user from public.profiles order by id limit 1;
            if v_user is null then raise exception 'Contract 104 needs one seeded profile'; end if;
            update public.bonus_competitions
            set completed_at = now(), completion_reason = 'abandoned' where id = v_old.id;
          """
          after = """  select * into v_old
            from public.bonus_competitions competition
            where competition.visibility_kind = 'public'
              and competition.completed_at is null
              and competition.game_key = 'last_man_standing'
            order by competition.id
            limit 1;
            if v_old.id is null then raise exception 'Contract 104 needs the canonical live public LMS competition'; end if;
            select id into v_user from public.profiles order by id limit 1;
            if v_user is null then raise exception 'Contract 104 needs one seeded profile'; end if;
            update public.bonus_competitions
            set published = true,
                availability_status = 'active',
                completed_at = now(),
                completion_reason = 'abandoned'
            where id = v_old.id;
            v_old.published := true;
            v_old.availability_status := 'active';
          """
          if text.count(before) != 1:
              raise SystemExit(f'expected one runtime fixture block, found {text.count(before)}')
          path.write_text(text.replace(before, after))
          PY

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/fix-contract-104-deterministic-probe.yml
          git add supabase/tests/155_live_competition_callers.sql
          git diff --cached --check
          git commit -m 'Make Contract 104 predecessor probe deterministic'
          git push origin HEAD:agent/contract-104-live-competition-callers
