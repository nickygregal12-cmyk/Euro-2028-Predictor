name: Architecture contracts

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - '.dependency-cruiser.cjs'
      - 'config/agent-tools.json'
      - 'scripts/agent-tools/architecture-check.sh'
      - '.github/workflows/architecture-contracts.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - '.dependency-cruiser.cjs'
      - 'config/agent-tools.json'
      - 'scripts/agent-tools/architecture-check.sh'
      - '.github/workflows/architecture-contracts.yml'

permissions:
  contents: read

jobs:
  dependency-boundaries:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden runner (audit egress)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up repository Node version
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.2
          cache: 'npm'

      - name: Install application dependencies
        run: npm ci

      - name: Enforce dependency boundaries
        run: bash scripts/agent-tools/architecture-check.sh

      - name: Summary
        if: ${{ always() }}
        run: |
          {
            echo '## Architecture contracts'
            echo
            echo '- Runtime/dev-harness direction checked, with App.tsx as the deliberate DEV-gated preview registry.'
            echo '- Domain framework boundary checked.'
            echo '- vNext presentation/integration and legacy-design boundaries checked.'
            echo '- Relative source imports must resolve.'
            echo '- Circular dependencies are blocking.'
            echo '- The wrapper fails closed if dependency-cruiser analyses zero modules or reports any error-severity violation.'
          } >> "$GITHUB_STEP_SUMMARY"
