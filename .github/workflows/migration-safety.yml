name: Migration safety

on:
  pull_request:
    paths:
      - 'supabase/migrations/*.sql'

permissions:
  contents: read

jobs:
  squawk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Harden runner (audit egress)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Find changed migrations
        id: changed
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          files="$(git diff --diff-filter=d --name-only "$BASE_SHA...$HEAD_SHA" -- 'supabase/migrations/*.sql' | paste -sd ' ' -)"
          echo "files=$files" >> "$GITHUB_OUTPUT"
          if [ -z "$files" ]; then
            echo 'No added or modified migrations to lint.'
          else
            printf 'Squawk will lint: %s\n' "$files"
          fi
      - name: Squawk changed migrations
        if: steps.changed.outputs.files != ''
        uses: sbdchd/squawk-action@8d113898e16c6cfd417ceba848b0edad97882be3 # v2.1.0
        with:
          files: ${{ steps.changed.outputs.files }}
