name: One-shot dispatch Contract 190 rehearsal

# Connector bridge only. The guarded rehearsal remains workflow_dispatch-only.
# This workflow may start on a push, but the single shell step refuses every
# event except the dedicated main-branch merge commit before dispatching it.

on: push

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch the unchanged guarded Production-derived rehearsal
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF}" != 'refs/heads/main' ]; then
            echo "Skip: ${GITHUB_REF} is not main."
            exit 0
          fi
          message="$(jq -r '.head_commit.message // ""' "${GITHUB_EVENT_PATH}")"
          case "${message}" in
            'Ops: dispatch Contract 190 rehearsal'*) ;;
            *) echo 'Skip: main push is not the dedicated Contract 190 dispatch commit.'; exit 0 ;;
          esac
          gh workflow run production-189-to-190-rehearsal.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref main \
            -f project_ref=vkfnsqdyhvtwyqkisxhk \
            -f confirmation=REHEARSE-PRODUCTION-189-TO-190 \
            -f backup_run_id=31785056556
          echo 'Guarded Contract 190 rehearsal dispatched on refs/heads/main.'
