name: Patch coverage falsification call site

on:
  push:
    branches:
      - claude/euro-2028-ai-hardening-cxmah1
    paths:
      - '.github/workflows/patch-coverage-falsification.yml'

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Apply explicit coverage falsification arms') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: claude/euro-2028-ai-hardening-cxmah1
          fetch-depth: 0

      - name: Replace exactly the historical control/guard call site
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('ai/experiments.py')
          lines = path.read_text().splitlines(keepends=True)
          i8, i12, i31 = ' ' * 8, ' ' * 12, ' ' * 31
          needle = i8 + 'for label, use in (("control", groups), ("guarded", kept)):\n'
          matches = [i for i, line in enumerate(lines) if line == needle]
          if len(matches) != 1:
              raise SystemExit(f'expected one exact call site, found {len(matches)}')
          i = matches[0]
          expected = [
              needle,
              i12 + 'columns = feature_names(use)\n',
              i12 + 'weights = time_weights(train["match_date"], args.half_life_days)\n',
              i12 + 'model = fit_family(args.family, train, columns, args.half_life_days,\n',
              i31 + 'weights=weights)\n',
          ]
          if lines[i:i + len(expected)] != expected:
              raise SystemExit('coverage call site shape changed; refusing broad patch')
          replacement = [
              i8 + 'for label, use, coverage_guard in (\n',
              i12 + '("control", groups, False),\n',
              i12 + '("guarded", kept, True),\n',
              i8 + '):\n',
              i12 + 'columns = feature_names(use)\n',
              i12 + 'weights = time_weights(train["match_date"], args.half_life_days)\n',
              i12 + 'model = fit_family(args.family, train, columns, args.half_life_days,\n',
              i31 + 'weights=weights, coverage_guard=coverage_guard)\n',
          ]
          lines[i:i + len(expected)] = replacement
          path.write_text(''.join(lines))
          PY

          git diff --exit-code -- . ':!ai/experiments.py'
          git diff --check
          test "$(git diff --name-only)" = 'ai/experiments.py'
          grep -F 'weights=weights, coverage_guard=coverage_guard)' ai/experiments.py
          grep -F '("control", groups, False)' ai/experiments.py
          grep -F '("guarded", kept, True)' ai/experiments.py

      - name: Commit only the bounded experiments.py diff
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ai/experiments.py
          test "$(git diff --cached --name-only)" = 'ai/experiments.py'
          git commit -m 'Apply explicit coverage falsification arms'
          git push origin HEAD:claude/euro-2028-ai-hardening-cxmah1
