          clear_function = r'''
  async function clearEntry(): Promise<{ ok: boolean; message?: string }> {
    if (!tournamentId) return { ok: false, message: 'Tournament data is still loading.' }
    if (clearingEntry) return { ok: false, message: 'Your entry is already being cleared.' }

    setClearingEntry(true)
    try {
      // Discard unsent debounce work and wait for any request already on the wire.
      // The authoritative clear then runs after the saver is quiet, so a late
      // autosave cannot recreate a row immediately after the transaction commits.
      clearDebounceTimers()
      await controller.waitForSettled()
      controller.reset()
      await clearMyEntry(tournamentId)

      predictionsRef.current = {}
      setPredictions({})
      setSaveStatus({})
      matchVersionsRef.current = {}
      setTieResolutions([])
      setTieSaveStatus({})
      setProgression({})
      progressionPersistedRef.current = {}
      progressionDesiredRef.current = {}
      progressionVersionsRef.current = {}
      setBracketSaveStatus('idle')
      setGoldenBootPlayerId(null)
      goldenBootVersionRef.current = 0
      setGoldenBootSaveStatus('idle')
      setSubmittedAt(null)
      localEditRevisionsRef.current = createLoadRevisions()
      setLoadStatus('ready')
      setLoadMessage(null)
      return { ok: true }
    } catch (error) {
      return {
        ok: false,
        message: userFacingError(error, 'Could not clear your predictions. Please try again.'),
      }
    } finally {
      setClearingEntry(false)
    }
  }

