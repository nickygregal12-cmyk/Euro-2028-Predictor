name: Production 190 to 198 rollout

# One-shot guarded promotion of Contracts 191 to 198.
#
# This span is EIGHT migrations rather than the single migration every earlier
# rollout carried, so the boundary proof below establishes the exact SET and
# every member of it is proven additive before anything is applied.
#
# What the eight do, and why none of them moves player data: 191 and 192 add
# season identity, rank-history and rivalry reads; 193 adds a Championship
# bracket read; 194 makes tie settlement consult eligibility; 195 and 196 add
# two `predictor_internal` action generators granted to nobody and patch the
# action driver and expiry sweep; 197 adds one `authenticated` calendar read
# scoped to the caller's own entries; 198 reserves the knockout calendar a
# Championship implies. No scoring rule, reveal rule, membership rule or
# settled result is redefined, and nothing here publishes Euro 2028, launches a
# competition, draws a Championship or schedules a job.
#
# `promotionAuthorised` in `config/production-hosted-contract.json` stays
# `false` throughout, as it has through every previous Production rollout. It is
# a fail-closed property of that record rather than this workflow's gate; the
# gate is the dispatch below — a fresh encrypted backup, an exact-head
# rehearsal, and a typed confirmation naming this boundary.

on:
  workflow_dispatch:
    inputs:
      project_ref:
        description: Exact Production project ref confirmation
        required: true
      confirmation:
        description: Type APPLY-PRODUCTION-190-TO-198 to proceed
        required: true
      backup_run_id:
        description: Run id of the successful fresh Production backup
        required: true
      rehearsal_run_id:
        description: Run id of the successful 190-to-198 rehearsal
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: production-migration-rollout
  cancel-in-progress: false

env:
  EXPECTED_PROJECT_REF: vkfnsqdyhvtwyqkisxhk
  FORBIDDEN_DEVELOPMENT_REF: iouzoutneyjpugbbtdem
  CONFIRMATION_PHRASE: APPLY-PRODUCTION-190-TO-198
  SOURCE_CONTRACT: '190'
  SOURCE_VERSION: '20260814005000'
  SOURCE_NAME: ai_actionable_bet_evidence
  TARGET_CONTRACT: '198'
  TARGET_VERSION: '20260818030000'
  TARGET_NAME: cup_knockout_reservation
  WORK_DIR: /tmp/production-190-to-198

jobs:
  rollout:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Refuse an unsafe dispatch or repository state
        env:
          INPUT_PROJECT_REF: ${{ inputs.project_ref }}
          INPUT_CONFIRMATION: ${{ inputs.confirmation }}
        shell: bash
        run: |
          set -euo pipefail
          [ "${INPUT_CONFIRMATION}" = "${CONFIRMATION_PHRASE}" ] || { echo 'ERROR: confirmation phrase mismatch.'; exit 1; }
          [ "${INPUT_PROJECT_REF}" != "${FORBIDDEN_DEVELOPMENT_REF}" ] || { echo 'ERROR: that is Development.'; exit 1; }
          [ "${INPUT_PROJECT_REF}" = "${EXPECTED_PROJECT_REF}" ] || { echo 'ERROR: project ref is not Production.'; exit 1; }
          [ "${GITHUB_REF}" = 'refs/heads/main' ] || { echo 'ERROR: rollout runs only from main.'; exit 1; }
          git fetch --no-tags origin main
          [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" ] || { echo 'ERROR: HEAD is not exact main.'; exit 1; }
          [ -z "$(git status --porcelain=v1 --untracked-files=all)" ] || { echo 'ERROR: checkout is dirty.'; exit 1; }
          mkdir -p "${WORK_DIR}"

      - name: Prove fresh backup then exact-head rehearsal succeeded
        env:
          GH_TOKEN: ${{ github.token }}
          BACKUP_RUN_ID: ${{ inputs.backup_run_id }}
          REHEARSAL_RUN_ID: ${{ inputs.rehearsal_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          check_run() {
            local id="$1" path="$2" label="$3" json
            json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${id}")"
            [ "$(jq -r '.conclusion' <<<"${json}")" = success ] || { echo "ERROR: ${label} ${id} did not succeed."; exit 1; }
            [ "$(jq -r '.path' <<<"${json}")" = "${path}" ] || { echo "ERROR: ${label} ${id} has wrong workflow path."; exit 1; }
            printf '%s' "${json}"
          }
          backup="$(check_run "${BACKUP_RUN_ID}" '.github/workflows/production-backup.yml' Backup)"
          rehearsal="$(check_run "${REHEARSAL_RUN_ID}" '.github/workflows/production-190-to-198-rehearsal.yml' Rehearsal)"
          rehearsal_sha="$(jq -r '.head_sha' <<<"${rehearsal}")"
          [ "${rehearsal_sha}" = "$(git rev-parse HEAD)" ] || { echo "ERROR: rehearsal head ${rehearsal_sha} is not rollout head."; exit 1; }
          backup_sha="$(jq -r '.head_sha' <<<"${backup}")"
          git merge-base --is-ancestor "${backup_sha}" HEAD || { echo 'ERROR: backup head is not an ancestor of rollout head.'; exit 1; }
          backup_at="$(jq -r '.created_at' <<<"${backup}")"; rehearsal_at="$(jq -r '.created_at' <<<"${rehearsal}")"
          [ "${backup_at}" \< "${rehearsal_at}" ] || { echo 'ERROR: backup does not precede rehearsal.'; exit 1; }
          artifacts="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${BACKUP_RUN_ID}/artifacts")"
          [ "$(jq '[.artifacts[] | select(.name == "production-backup-encrypted" and .expired == false)] | length' <<<"${artifacts}")" = 1 ] || { echo 'ERROR: encrypted backup artifact missing.'; exit 1; }
          echo "Sequence verified: backup ${BACKUP_RUN_ID} -> rehearsal ${REHEARSAL_RUN_ID} -> rollout."

      - name: Refuse to make Production the first hosted environment to see these
        shell: bash
        run: |
          set -euo pipefail
          # ADR 0024's ordering rule, restored. It was enforced at the 145-to-151
          # boundary -- where it CAUGHT a stale record and refused before
          # touching anything -- and has not been present on a rehearsal since.
          # Eight migrations at once is the worst possible span on which to
          # discover that Production went first.
          #
          # This reads the machine record rather than the Development database:
          # the record is what CI keeps honest, and a rehearsal holding
          # Production credentials should not also hold Development's.
          dev_ref="$(node -p "require('./config/development-hosted-contract.json').projectRef")"
          dev_contract="$(node -p "require('./config/development-hosted-contract.json').requiredMigrationCount")"
          [ "${dev_ref}" = "${FORBIDDEN_DEVELOPMENT_REF}" ] || {
            echo "ERROR: the Development record names ${dev_ref}, not the Development project."
            exit 1
          }
          if [ "${dev_contract}" -lt "${TARGET_CONTRACT}" ]; then
            echo "ERROR: Development is recorded at contract ${dev_contract} and this boundary ends at ${TARGET_CONTRACT}."
            echo 'Production must not be the first hosted environment to see a migration.'
            echo 'Run the Development fast lane first, reconcile that record, and try again.'
            exit 1
          fi
          echo "Development is recorded at contract ${dev_contract}, at or beyond this boundary's ${TARGET_CONTRACT}."

      - name: Prove the repository boundary is exactly 190 to 198
        shell: bash
        run: |
          set -euo pipefail
          committed="$(git ls-files 'supabase/migrations/*.sql' | wc -l | tr -d ' ')"
          declared="$(node -p "require('./config/deployment-contract.json').requiredMigrationCount")"
          newest="$(basename "$(git ls-files 'supabase/migrations/*.sql' | sort | tail -1)")"
          [ "${committed}" = "${TARGET_CONTRACT}" ] || { echo "ERROR: repository has ${committed} migrations."; exit 1; }
          [ "${declared}" = "${TARGET_CONTRACT}" ] || { echo "ERROR: deployment contract is ${declared}."; exit 1; }
          [ "${newest}" = "${TARGET_VERSION}_${TARGET_NAME}.sql" ] || { echo "ERROR: newest migration is ${newest}."; exit 1; }
          : > "${WORK_DIR}/boundary.txt"
          for file in $(git ls-files 'supabase/migrations/*.sql' | sort); do
            version="$(basename "${file}")"; version="${version:0:14}"
            if [[ "${version}" > "${SOURCE_VERSION}" && ! "${version}" > "${TARGET_VERSION}" ]]; then
              basename "${file}" >> "${WORK_DIR}/boundary.txt"
              node scripts/check-migration-additive.mjs "${file}"
            fi
          done
          count="$(wc -l < "${WORK_DIR}/boundary.txt" | tr -d ' ')"
          [ "${count}" = 8 ] || { echo "ERROR: boundary holds ${count} migrations, expected 8."; cat "${WORK_DIR}/boundary.txt"; exit 1; }
          cat "${WORK_DIR}/boundary.txt"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.2

      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520
        with:
          version: 2.109.1
          github-token: ${{ github.token }}

      - name: Install PostgreSQL 17 client tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17

      - name: Capture exact pre-apply Production state
        env:
          SUPABASE_PROD_DB_URL: ${{ secrets.SUPABASE_PROD_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${SUPABASE_PROD_DB_URL}" ] || { echo 'ERROR: SUPABASE_PROD_DB_URL missing.'; exit 1; }
          case "${SUPABASE_PROD_DB_URL}" in
            *"${FORBIDDEN_DEVELOPMENT_REF}"*) echo 'ERROR: Production secret resolves to Development.'; exit 1 ;;
            *"${EXPECTED_PROJECT_REF}"*) ;;
            *) echo 'ERROR: Production secret does not name Production.'; exit 1 ;;
          esac
          psql "${SUPABASE_PROD_DB_URL}" -X -q -A -t -v ON_ERROR_STOP=1 -f - > "${WORK_DIR}/before.json" <<'SQL'
          select jsonb_build_object(
            'migration_count',(select count(*) from supabase_migrations.schema_migrations),
            'latest_version',(select version from supabase_migrations.schema_migrations order by version desc limit 1),
            'latest_name',(select name from supabase_migrations.schema_migrations order by version desc limit 1),
            'auth_users',(select count(*) from auth.users),
            'profiles',(select count(*) from public.profiles),
            'entries',(select count(*) from public.entries),
            'season_predictions',(select count(*) from public.season_predictions),
            'match_predictions',(select count(*) from public.match_predictions),
            'season_matchweek_scores',(select count(*) from public.season_matchweek_scores),
            'bonus_entrants',(select count(*) from public.bonus_competition_entrants),
            'bonus_score_events',(select count(*) from public.bonus_score_events),
            'leagues',(select count(*) from public.leagues),
            'league_members',(select count(*) from public.league_members),
            'cup_launches',(select count(*) from public.bonus_cup_launches),
            'cup_fixtures',(select count(*) from public.bonus_cup_fixtures),
            'season_fixtures',(select count(*) from public.season_fixtures),
            'action_items',(select count(*) from public.player_action_items),
            'api_usage',(select count(*) from ai.api_usage),
            'collection_enabled',(select collection_enabled from ai.api_budget limit 1),
            'euro_publication',(select state from public.euro_publication_state()),
            'cron_jobs',(select count(*) from cron.job),
            'cron_fingerprint',(select md5(coalesce(string_agg(jobid::text||'|'||jobname||'|'||schedule||'|'||command||'|'||active::text,E'\n' order by jobid),'')) from cron.job));
          SQL
          cat "${WORK_DIR}/before.json"
          BEFORE_FILE="${WORK_DIR}/before.json" node --input-type=module <<'NODE'
          import fs from 'node:fs'
          const x = JSON.parse(fs.readFileSync(process.env.BEFORE_FILE, 'utf8'))
          const want = {
            migration_count: Number(process.env.SOURCE_CONTRACT),
            latest_version: process.env.SOURCE_VERSION,
            latest_name: process.env.SOURCE_NAME,
          }
          for (const [k, v] of Object.entries(want)) {
            if (String(x[k]) !== String(v)) throw new Error(`Production ${k}=${x[k]}, expected ${v}`)
          }
          NODE

      - name: Dry run and refuse anything except the eight approved migrations
        env:
          SUPABASE_PROD_DB_URL: ${{ secrets.SUPABASE_PROD_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          supabase migration list --db-url "${SUPABASE_PROD_DB_URL}" | tail -20
          supabase db push --db-url "${SUPABASE_PROD_DB_URL}" --dry-run > "${WORK_DIR}/dry-run.txt" 2>&1
          cat "${WORK_DIR}/dry-run.txt"
          grep -oE '[0-9]{14}_[A-Za-z0-9_-]+\.sql' "${WORK_DIR}/dry-run.txt" | awk '!seen[$0]++' | sort > "${WORK_DIR}/pending.txt"
          sort "${WORK_DIR}/boundary.txt" > "${WORK_DIR}/expected.txt"
          diff -u "${WORK_DIR}/expected.txt" "${WORK_DIR}/pending.txt" || { echo 'ERROR: Production dry run is not exactly Contracts 191 to 198.'; exit 1; }

      - name: Apply exactly Contracts 191 to 198
        env:
          SUPABASE_PROD_DB_URL: ${{ secrets.SUPABASE_PROD_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          supabase db push --db-url "${SUPABASE_PROD_DB_URL}" 2>&1 | tee "${WORK_DIR}/apply.txt"

      - name: Verify installed behaviour and that nothing player-facing moved
        env:
          SUPABASE_PROD_DB_URL: ${{ secrets.SUPABASE_PROD_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          psql "${SUPABASE_PROD_DB_URL}" -X -q -A -t -v ON_ERROR_STOP=1 -f - > "${WORK_DIR}/after.json" <<'SQL'
          select jsonb_build_object(
            'migration_count',(select count(*) from supabase_migrations.schema_migrations),
            'latest_version',(select version from supabase_migrations.schema_migrations order by version desc limit 1),
            'latest_name',(select name from supabase_migrations.schema_migrations order by version desc limit 1),
            'target_row_present',(select count(*) from supabase_migrations.schema_migrations where version='20260818030000' and name='cup_knockout_reservation'),
            'auth_users',(select count(*) from auth.users),
            'profiles',(select count(*) from public.profiles),
            'entries',(select count(*) from public.entries),
            'season_predictions',(select count(*) from public.season_predictions),
            'match_predictions',(select count(*) from public.match_predictions),
            'season_matchweek_scores',(select count(*) from public.season_matchweek_scores),
            'bonus_entrants',(select count(*) from public.bonus_competition_entrants),
            'bonus_score_events',(select count(*) from public.bonus_score_events),
            'leagues',(select count(*) from public.leagues),
            'league_members',(select count(*) from public.league_members),
            'cup_launches',(select count(*) from public.bonus_cup_launches),
            'cup_fixtures',(select count(*) from public.bonus_cup_fixtures),
            'season_fixtures',(select count(*) from public.season_fixtures),
            'action_items',(select count(*) from public.player_action_items),
            'api_usage',(select count(*) from ai.api_usage),
            'collection_enabled',(select collection_enabled from ai.api_budget limit 1),
            'euro_publication',(select state from public.euro_publication_state()),
            'cron_jobs',(select count(*) from cron.job),
            'cron_fingerprint',(select md5(coalesce(string_agg(jobid::text||'|'||jobname||'|'||schedule||'|'||command||'|'||active::text,E'\n' order by jobid),'')) from cron.job),
            'calendar_authenticated',(select count(*) from information_schema.role_routine_grants where routine_schema='public' and routine_name='get_my_football_calendar' and grantee='authenticated'),
            'calendar_leaked',(select count(*) from information_schema.role_routine_grants where routine_schema='public' and routine_name='get_my_football_calendar' and grantee in ('PUBLIC','anon','service_role')),
            'new_reads_authenticated',(select count(distinct routine_name) from information_schema.role_routine_grants where routine_schema='public' and grantee='authenticated' and routine_name in ('resolve_season_player','get_season_rank_history','get_season_rivalry','get_season_cup_bracket','get_my_football_calendar')),
            'new_reads_leaked',(select count(*) from information_schema.role_routine_grants where routine_schema='public' and grantee in ('PUBLIC','anon') and routine_name in ('resolve_season_player','get_season_rank_history','get_season_rivalry','get_season_cup_bracket','get_my_football_calendar')),
            'generators_unreachable',(select count(*) from information_schema.role_routine_grants where routine_schema='predictor_internal' and routine_name in ('generate_cup_penalty_number_actions','generate_game_consequence_actions','cup_knockout_rounds') and grantee in ('PUBLIC','anon','authenticated','service_role')),
            'settler_split_safe',(position('stage <> ''group''' in pg_get_functiondef('public.admin_settle_predictor_cup_round(uuid,uuid)'::regprocedure))=0),
            'settler_initial_roster',(position('member.phase_kind = ''initial''' in pg_get_functiondef('public.admin_settle_predictor_cup_round(uuid,uuid)'::regprocedure))>0),
            'settler_eligibility',(position('cup_entrant_eligibility' in pg_get_functiondef('public.admin_settle_predictor_cup_round(uuid,uuid)'::regprocedure))>0),
            'settler_dates_elimination',(position('set outcome = ''eliminated'', updated_at = now()' in pg_get_functiondef('public.admin_settle_predictor_cup_round(uuid,uuid)'::regprocedure))>0),
            'settler_dates_champion',(position('set outcome = ''champion'', updated_at = now()' in pg_get_functiondef('public.admin_settle_predictor_cup_round(uuid,uuid)'::regprocedure))>0),
            'finalise_dates_outcome',(position('then ''eliminated'' else ''qualified'' end, updated_at = now()' in pg_get_functiondef('public.admin_finalise_predictor_cup_groups(uuid)'::regprocedure))>0),
            'finalise_depth_authority',(position('cup_knockout_rounds' in pg_get_functiondef('public.admin_finalise_predictor_cup_groups(uuid)'::regprocedure))>0),
            'driver_runs_four',( (position('generate_lms_pick_actions' in pg_get_functiondef('public.process_player_action_items()'::regprocedure))>0)
                             and (position('generate_matchweek_prediction_actions' in pg_get_functiondef('public.process_player_action_items()'::regprocedure))>0)
                             and (position('generate_cup_penalty_number_actions' in pg_get_functiondef('public.process_player_action_items()'::regprocedure))>0)
                             and (position('generate_game_consequence_actions' in pg_get_functiondef('public.process_player_action_items()'::regprocedure))>0)),
            'knockout_depth_seventy',(predictor_internal.cup_knockout_rounds(70)),
            'ten_over_thirtyeight_has_no_knockout',(jsonb_typeof((predictor_internal.select_season_cup_format(10,38))->'knockout')='null'),
            'hundred_reserves_seven',(((predictor_internal.select_season_cup_format(100,38))->'knockout'->>'rounds')::int));
          SQL
          cat "${WORK_DIR}/after.json"
          BEFORE_FILE="${WORK_DIR}/before.json" AFTER_FILE="${WORK_DIR}/after.json" node --input-type=module <<'NODE'
          import fs from 'node:fs'
          const b = JSON.parse(fs.readFileSync(process.env.BEFORE_FILE, 'utf8'))
          const a = JSON.parse(fs.readFileSync(process.env.AFTER_FILE, 'utf8'))
          const problems = []
          const eq = (k, v) => String(a[k]) === String(v) || problems.push(`${k}=${a[k]}, expected ${v}`)

          eq('migration_count', Number(process.env.TARGET_CONTRACT))
          eq('latest_version', process.env.TARGET_VERSION)
          eq('latest_name', process.env.TARGET_NAME)
          eq('target_row_present', 1)

          // Nothing here writes player data, and no timer can create any of
          // these without a human, so they must be identical across the apply.
          for (const k of [
            'auth_users','profiles','entries','season_predictions','match_predictions',
            'bonus_entrants','bonus_score_events','leagues','league_members',
            'cup_launches','cup_fixtures','season_fixtures',
            'collection_enabled','euro_publication','cron_jobs','cron_fingerprint',
          ]) eq(k, b[k])

          // These two CAN move legitimately while the rollout runs: Production
          // keeps scheduled jobs, and contract 135's provider path and the
          // action driver both write on a timer. Requiring exact equality would
          // report a false alarm after the migrations had already applied, so
          // the check is that neither went BACKWARDS, with the delta printed.
          for (const k of ['season_matchweek_scores','api_usage','action_items']) {
            if (Number(a[k]) < Number(b[k])) problems.push(`${k} fell from ${b[k]} to ${a[k]}`)
          }

          // Contract 197's read is reachable by a signed-in player and by
          // nobody else; the five new reads are all authenticated-only; the
          // generators and the depth authority are reachable by no role at all.
          eq('calendar_authenticated', 1)
          eq('calendar_leaked', 0)
          eq('new_reads_authenticated', 5)
          eq('new_reads_leaked', 0)
          eq('generators_unreachable', 0)

          // Contracts 102, 194, 196 and 198 are all present on the installed
          // Championship functions -- the in-place patching order held.
          for (const k of [
            'settler_split_safe','settler_initial_roster','settler_eligibility',
            'settler_dates_elimination','settler_dates_champion','finalise_dates_outcome',
            'finalise_depth_authority','driver_runs_four',
            'ten_over_thirtyeight_has_no_knockout',
          ]) eq(k, true)

          // Contract 198's arithmetic answers on the live database, not just in
          // rehearsal: seventy qualifiers need seven rounds, a hundred entrants
          // reserve exactly those seven, and ten over a full season reserve none.
          eq('knockout_depth_seventy', 7)
          eq('hundred_reserves_seven', 7)

          if (problems.length) {
            console.error('ROLLOUT VERIFICATION FAILED:\n - ' + problems.join('\n - '))
            process.exit(1)
          }
          console.log(`Production reached Contract ${a.migration_count} (${a.latest_name}).`)
          console.log(`Player-facing counts unchanged: ${a.auth_users} auth users, ${a.profiles} profiles, ${a.entries} entries, ${a.match_predictions} match predictions, ${a.leagues} leagues, ${a.league_members} members, ${a.season_fixtures} season fixtures.`)
          console.log(`Timer-driven counters: matchweek scores ${b.season_matchweek_scores} -> ${a.season_matchweek_scores}, provider usage ${b.api_usage} -> ${a.api_usage}, action items ${b.action_items} -> ${a.action_items}.`)
          console.log(`Euro publication remains ${a.euro_publication}; ${a.cron_jobs} cron jobs with an unchanged fingerprint; paid collection remains ${a.collection_enabled}.`)
          NODE

      - name: Record the completed safety boundary
        if: success()
        shell: bash
        run: |
          cat >> "${GITHUB_STEP_SUMMARY}" <<'SUMMARY'
          ## Production is at Contract 198

          - Exactly eight migrations applied, each proven additive before the apply.
          - Auth users, profiles, entries, predictions, entrants, score events, leagues, members, Cup launches, Cup fixtures and season fixtures are all unchanged.
          - Euro publication state, cron job count and cron fingerprint are unchanged, and paid collection is unchanged.
          - The five new reads are executable by `authenticated` and by no anonymous role; the two action generators and the knockout-depth authority are executable by nobody.
          - Contract 102 split-safety and initial-roster pinning, contract 194 eligibility, contract 196 outcome dating and contract 198 depth authority are all present on the installed Championship functions.
          - The action driver runs all four generators.

          This promotion is schema only. It published no Euro 2028, launched no competition, drew no Championship, opened no Last Man Standing, scheduled no job and imported no football.

          Reconcile `config/production-hosted-contract.json` from an independent read-only query that names the Contract 198 ledger row. `promotionAuthorised` stays `false`.
          SUMMARY
