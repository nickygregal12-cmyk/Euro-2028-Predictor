name: 0100 authority reconcile

on:
  push:
    branches:
      - automation/2026-08-08-0100-final-handover
    paths:
      - .github/workflows/_0100-authority-reconcile.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: automation/2026-08-08-0100-final-handover
      - name: Reconcile production promotion authority
        shell: python
        run: |
          from pathlib import Path

          agents = Path('AGENTS.md')
          text = agents.read_text()
          old = "Production Supabase is hosted at 131, one migration behind this repository candidate; Contract 132 promotion is explicitly authorised for this rollout and must follow Development verification."
          new = "Production Supabase is hosted at 131, one migration behind this repository candidate; `config/production-hosted-contract.json` records `promotionAuthorised: false`, so Contract 132 production promotion is not authorised by this repository state."
          if old not in text:
              raise SystemExit('AGENTS.md expected Contract 132 production-authorisation sentence not found')
          agents.write_text(text.replace(old, new, 1))

          status = Path('docs/quality/current-status.md')
          text = status.read_text()
          old = "The repository candidate is **132**. Development Supabase and Production Supabase are both still hosted at **131** before the authorised Contract 132 rollout; Development is promoted and verified first, then Production."
          new = "The repository is **132**. Development Supabase and Production Supabase are both hosted at **131**. Development is eligible for the guarded Contract 132 rollout; Production is not authorised for Contract 132 because `config/production-hosted-contract.json` records `promotionAuthorised: false`."
          if old not in text:
              raise SystemExit('current-status.md expected Contract 132 rollout sentence not found')
          status.write_text(text.replace(old, new, 1))

          handover = Path('docs/automation-runs/2026-08-08-0100-predictor-progress.md')
          text = handover.read_text()
          needle = "2. **Production is also one contract behind, intentionally.** There is no reason to promote it merely to match the repository. A future production rollout needs separate repository-controlled authorisation and all production hard gates."
          replacement = needle + " The live authority audit also found stale prose in `AGENTS.md` and `docs/quality/current-status.md` claiming Contract 132 Production promotion was authorised; this PR reconciles both to the machine record `promotionAuthorised: false`."
          if needle not in text:
              raise SystemExit('handover production-risk sentence not found')
          handover.write_text(text.replace(needle, replacement, 1))
      - name: Remove one-shot workflow
        run: git rm .github/workflows/_0100-authority-reconcile.yml
      - name: Commit reconciled authority
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AGENTS.md docs/quality/current-status.md docs/automation-runs/2026-08-08-0100-predictor-progress.md
          git commit -m 'docs: reconcile Contract 132 production authority'
          git push origin HEAD:automation/2026-08-08-0100-final-handover
