name: OpenSSF Scorecard

on:
  push:
    branches:
      - main
    paths:
      - '.github/**'
      - 'package.json'
      - 'package-lock.json'
      - 'renovate.json'
  schedule:
    - cron: '23 5 * * 4'
  workflow_dispatch:

# Scorecard reads repository posture broadly, but the only write permission is
# the SARIF upload to this repository's code-scanning surface. Results are not
# published to scorecard.dev from this workflow.
permissions: read-all

concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      checks: read
      issues: read
      pull-requests: read
      security-events: write
    steps:
      - name: Harden runner (audit egress)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Analyse repository supply-chain posture
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: false
      - name: Upload Scorecard evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: openssf-scorecard-sarif
          path: results.sarif
          if-no-files-found: warn
          retention-days: 14
      - name: Upload Scorecard findings to code scanning
        if: success()
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          sarif_file: results.sarif
