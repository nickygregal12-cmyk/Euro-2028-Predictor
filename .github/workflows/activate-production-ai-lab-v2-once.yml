name: One-shot activate verified Production AI Lab v2

# Final bridge after the nine selected-20260814-v2 models have been promoted
# through the signed-in competition-admin authority. Branch pushes cannot run
# this job: it is main-only and additionally requires the deliberate activation
# merge title below.
on:
  push:
    branches:
      - main

permissions:
  contents: read
  actions: write

concurrency:
  group: activate-production-ai-lab-selected-20260814-v2
  cancel-in-progress: false

env:
  EXPECTED_PROJECT_REF: vkfnsqdyhvtwyqkisxhk
  SELECTED_VERSION: selected-20260814-v2
  DATABASE_URL: ${{ secrets.SUPABASE_PROD_DB_URL }}
  GH_TOKEN: ${{ github.token }}
  AI_WORKFLOW: ai-lab.yml

jobs:
  activate:
    if: startsWith(github.event.head_commit.message, 'Ops: activate Production AI Lab verified v2')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Prove exact Production main
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL:-}" ]; then
            echo 'ERROR: SUPABASE_PROD_DB_URL is unavailable.' >&2
            exit 1
          fi
          case "${DATABASE_URL}" in
            *"${EXPECTED_PROJECT_REF}"*) ;;
            *) echo 'ERROR: Production database secret does not name the expected project.' >&2; exit 1 ;;
          esac
          remote_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          [ "${remote_sha}" = "${GITHUB_SHA}" ] || {
            echo "ERROR: main moved to ${remote_sha}; refusing activation from ${GITHUB_SHA}." >&2
            exit 1
          }

      - name: Install bounded database client
        run: python -m pip install --disable-pip-version-check 'psycopg[binary]==3.2.10'

      - name: Prove admin promotion and resolve real-bookmaker evidence
        id: evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import psycopg
          from psycopg.types.json import Jsonb

          db = os.environ['DATABASE_URL']
          version = os.environ['SELECTED_VERSION']
          sha = os.environ['GITHUB_SHA']
          marker_job = 'activate-selected-20260814-v2'
          expected_sports = {
              'soccer_epl',
              'soccer_efl_champ',
              'soccer_england_league1',
              'soccer_england_league2',
              'soccer_spl',
          }

          with psycopg.connect(db) as conn:
              with conn.cursor() as cur:
                  cur.execute("select pg_advisory_xact_lock(hashtextextended(%s, 0))", (marker_job,))
                  cur.execute(
                      """
                      select count(*) filter (where status='current') as current_total,
                             count(*) filter (where status='current' and version=%s) as selected_current,
                             count(distinct league) filter (where status='current' and version=%s) as selected_leagues,
                             count(*) filter (where status='challenger' and version=%s) as selected_challengers
                        from ai.models
                      """,
                      (version, version, version),
                  )
                  state = dict(zip(
                      ('current_total','selected_current','selected_leagues','selected_challengers'),
                      cur.fetchone(),
                  ))
                  required = {
                      'current_total': 9,
                      'selected_current': 9,
                      'selected_leagues': 9,
                      'selected_challengers': 0,
                  }
                  if state != required:
                      raise SystemExit(f'REFUSE: signed-in admin promotion is incomplete: {state}')

                  cur.execute(
                      "select id,status,started_at from ai.job_runs where job=%s order by started_at desc limit 1",
                      (marker_job,),
                  )
                  prior = cur.fetchone()
                  if prior is not None:
                      raise SystemExit(
                          f'REFUSE: activation marker already exists: id={prior[0]} '
                          f'status={prior[1]} started_at={prior[2]}'
                      )

                  cur.execute(
                      """
                      select distinct on (sport_key)
                             id::text,sport_key,http_status,called_at
                        from ai.api_usage
                       where provider='the-odds-api'
                         and is_historical=false
                         and called_at >= now() - interval '45 minutes'
                         and sport_key=any(%s::text[])
                       order by sport_key,called_at desc
                      """,
                      (sorted(expected_sports),),
                  )
                  recent = cur.fetchall()
                  fresh = (
                      {row[1] for row in recent} == expected_sports
                      and all(row[2] == 200 for row in recent)
                  )
                  refresh_performed = not fresh

                  cur.execute(
                      """
                      insert into ai.job_runs(job,status,message,detail)
                      values (%s,'running',%s,%s)
                      returning id,started_at
                      """,
                      (
                          marker_job,
                          ('Owner activation: reusing fresh real-bookmaker evidence'
                           if fresh else
                           'Owner activation: dispatching one bounded real-bookmaker refresh'),
                          Jsonb({
                              'model_version': version,
                              'repository_head': sha,
                              'provider': 'the-odds-api',
                              'provider_refresh_performed': refresh_performed,
                              'fresh_usage_ids': [row[0] for row in recent] if fresh else [],
                              'fresh_usage_called_at': [row[3].isoformat() for row in recent] if fresh else [],
                          }),
                      ),
                  )
                  marker_id, started_at = cur.fetchone()
                  request_ids = []

                  if refresh_performed:
                      cur.execute("select public.dispatch_ai_odds_polls(true)")
                      result = cur.fetchone()[0]
                      if not isinstance(result, dict):
                          result = json.loads(result)
                      if result.get('dispatched') != 5 or result.get('estimated_credits') != 10:
                          raise SystemExit(f'REFUSE: provider dispatcher returned {result}')
                      cur.execute(
                          """
                          select net_request_id,path
                            from ai.odds_api_dispatches
                           where dispatched_at >= %s
                           order by dispatched_at,id
                          """,
                          (started_at,),
                      )
                      dispatches = cur.fetchall()
                      if len(dispatches) != 5:
                          raise SystemExit(f'REFUSE: expected five dispatches, got {len(dispatches)}')
                      paths = [row[1] for row in dispatches]
                      if any('bookmakers=pinnacle,betfair_ex_uk,smarkets,matchbook' not in path for path in paths):
                          raise SystemExit(f'REFUSE: path left real-bookmaker allowlist: {paths}')
                      if any('MAX' in path or 'AVG' in path for path in paths):
                          raise SystemExit('REFUSE: aggregate code appeared in provider path')
                      request_ids = [int(row[0]) for row in dispatches]
                      cur.execute(
                          """
                          update ai.job_runs
                             set detail=coalesce(detail,'{}'::jsonb) || %s
                           where id=%s
                          """,
                          (Jsonb({'net_request_ids': request_ids, 'estimated_credits': 10}), marker_id),
                      )
              conn.commit()

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              print(f'marker_id={marker_id}', file=out)
              print(f'started_at={started_at.isoformat()}', file=out)
              print(f'refresh_performed={str(refresh_performed).lower()}', file=out)
              print('request_ids=' + ','.join(str(v) for v in request_ids), file=out)
          print(f'Activation marker {marker_id}; refresh_performed={refresh_performed}.')
          PY

      - name: Verify paid refresh when one was required
        if: steps.evidence.outputs.refresh_performed == 'true'
        shell: bash
        env:
          STARTED_AT: ${{ steps.evidence.outputs.started_at }}
          REQUEST_IDS: ${{ steps.evidence.outputs.request_ids }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import time
          import psycopg

          db = os.environ['DATABASE_URL']
          started_at = os.environ['STARTED_AT']
          request_ids = [int(v) for v in os.environ['REQUEST_IDS'].split(',') if v]
          expected_sports = {
              'soccer_epl','soccer_efl_champ','soccer_england_league1',
              'soccer_england_league2','soccer_spl',
          }
          deadline = time.time() + 600
          responses = []
          usage = []
          while time.time() < deadline:
              with psycopg.connect(db) as conn:
                  with conn.cursor() as cur:
                      cur.execute(
                          "select id,status_code,timed_out,error_msg from net._http_response where id=any(%s::bigint[]) order by id",
                          (request_ids,),
                      )
                      responses = cur.fetchall()
                      cur.execute(
                          """
                          select distinct on (sport_key) sport_key,http_status,called_at
                            from ai.api_usage
                           where provider='the-odds-api' and called_at >= %s::timestamptz
                             and sport_key=any(%s::text[])
                           order by sport_key,called_at desc
                          """,
                          (started_at, sorted(expected_sports)),
                      )
                      usage = cur.fetchall()
              if len(responses) == 5 and len(usage) == 5:
                  break
              time.sleep(5)
          if not (
              len(responses) == 5
              and all(200 <= row[1] < 300 and not row[2] and row[3] is None for row in responses)
              and {row[0] for row in usage} == expected_sports
              and all(row[1] == 200 for row in usage)
          ):
              raise SystemExit(f'Provider refresh verification failed: responses={responses}, usage={usage}')
          print('Verified five fresh real-bookmaker provider responses.')
          PY

      - name: Re-prove exact main before forecast execution
        shell: bash
        run: |
          set -euo pipefail
          remote_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          [ "${remote_sha}" = "${GITHUB_SHA}" ] || {
            echo "ERROR: main moved to ${remote_sha}; refusing to run stale forecast code." >&2
            exit 1
          }

      - name: Generate fresh v2 forecasts then refresh all fixture prices and find value
        id: ai
        shell: bash
        run: |
          set -euo pipefail

          find_exact_run() {
            local after_epoch="$1"
            gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/workflows/${AI_WORKFLOW}/runs?branch=main&event=workflow_dispatch&per_page=100" \
              --jq ".workflow_runs[] | select(.head_sha == \"${GITHUB_SHA}\") | select((.created_at | fromdateiso8601) >= ${after_epoch}) | .id" \
              | head -1
          }

          wait_for_run() {
            local run_id="$1" label="$2" i status conclusion
            for i in $(seq 1 180); do
              status="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq '.status')"
              if [ "${status}" = completed ]; then
                conclusion="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq '.conclusion')"
                [ "${conclusion}" = success ] || {
                  echo "ERROR: ${label} run ${run_id} completed with ${conclusion}." >&2
                  exit 1
                }
                echo "${label} run ${run_id} succeeded." >&2
                return 0
              fi
              sleep 10
            done
            echo "ERROR: ${label} run ${run_id} exceeded the bounded polling window." >&2
            exit 1
          }

          dispatch_task() {
            local task="$1" after run_id i
            after="$(date -u +%s)"
            gh workflow run "${AI_WORKFLOW}" --repo "${GITHUB_REPOSITORY}" --ref main \
              -f target=production -f task="${task}"
            run_id=''
            for i in $(seq 1 30); do
              run_id="$(find_exact_run "${after}" || true)"
              [ -n "${run_id}" ] && break
              sleep 2
            done
            [ -n "${run_id}" ] || { echo "ERROR: ${task} run was not discoverable." >&2; exit 1; }
            wait_for_run "${run_id}" "AI Lab ${task}"
            printf '%s\n' "${run_id}"
          }

          predict_id="$(dispatch_task predict)"
          value_id="$(dispatch_task free-odds)"
          echo "predict_run_id=${predict_id}" >> "${GITHUB_OUTPUT}"
          echo "value_run_id=${value_id}" >> "${GITHUB_OUTPUT}"

      - name: Verify v2 forecast and real-bookmaker recommendation evidence
        shell: bash
        env:
          MARKER_ID: ${{ steps.evidence.outputs.marker_id }}
          STARTED_AT: ${{ steps.evidence.outputs.started_at }}
          PREDICT_RUN_ID: ${{ steps.ai.outputs.predict_run_id }}
          VALUE_RUN_ID: ${{ steps.ai.outputs.value_run_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import psycopg
          from psycopg.types.json import Jsonb

          db = os.environ['DATABASE_URL']
          version = os.environ['SELECTED_VERSION']
          marker_id = os.environ['MARKER_ID']
          started_at = os.environ['STARTED_AT']
          with psycopg.connect(db) as conn:
              with conn.cursor() as cur:
                  cur.execute(
                      """
                      select count(*) as n,
                             count(distinct p.league) as leagues,
                             count(*) filter (where m.version <> %s) as wrong_version
                        from ai.valid_predictions p
                        join ai.models m on m.id=p.model_id
                       where p.created_at >= %s::timestamptz
                      """,
                      (version, started_at),
                  )
                  prediction_count, prediction_leagues, wrong_predictions = cur.fetchone()
                  if prediction_count < 1 or wrong_predictions != 0:
                      raise SystemExit(
                          f'REFUSE: fresh prediction evidence is not exclusively {version}: '
                          f'n={prediction_count} leagues={prediction_leagues} wrong={wrong_predictions}'
                      )

                  cur.execute(
                      """
                      select count(*) as n,
                             count(distinct r.league) as leagues,
                             count(*) filter (where m.version <> %s) as wrong_version,
                             count(*) filter (
                               where r.decision='BET'
                                 and (bk.code is null or not bk.is_real_price or bk.kind='aggregate')
                             ) as unreal_actionable
                        from ai.recommendations r
                        join ai.models m on m.id=r.model_id
                        left join ai.bookmakers bk on bk.code=r.bookmaker
                       where r.decided_at >= %s::timestamptz
                      """,
                      (version, started_at),
                  )
                  recommendation_count, recommendation_leagues, wrong_recommendations, unreal_actionable = cur.fetchone()
                  if recommendation_count < 1 or wrong_recommendations != 0 or unreal_actionable != 0:
                      raise SystemExit(
                          'REFUSE: recommendation evidence failed: '
                          f'n={recommendation_count} leagues={recommendation_leagues} '
                          f'wrong={wrong_recommendations} unreal_actionable={unreal_actionable}'
                      )

                  cur.execute(
                      """
                      select count(*)
                        from ai.valid_bets b
                        join ai.bookmakers bk on bk.code=b.bookmaker
                       where not bk.is_real_price or bk.kind='aggregate'
                      """
                  )
                  invalid_valid_bets = cur.fetchone()[0]
                  if invalid_valid_bets != 0:
                      raise SystemExit(f'REFUSE: ai.valid_bets contains {invalid_valid_bets} non-real/aggregate rows')

                  detail = Jsonb({
                      'predict_run_id': int(os.environ['PREDICT_RUN_ID']),
                      'value_run_id': int(os.environ['VALUE_RUN_ID']),
                      'value_task': 'free-odds',
                      'fresh_valid_predictions': prediction_count,
                      'prediction_leagues': prediction_leagues,
                      'fresh_recommendations': recommendation_count,
                      'recommendation_leagues': recommendation_leagues,
                      'unreal_actionable_recommendations': unreal_actionable,
                      'invalid_valid_bets': invalid_valid_bets,
                  })
                  cur.execute(
                      """
                      update ai.job_runs
                         set status='succeeded', finished_at=now(), rows_written=%s,
                             message='Verified v2 Production forecasts and real-bookmaker value recommendations',
                             detail=coalesce(detail,'{}'::jsonb) || %s
                       where id=%s::uuid
                      """,
                      (prediction_count + recommendation_count, detail, marker_id),
                  )
              conn.commit()
          print(
              f'VERIFIED: {prediction_count} fresh valid predictions across {prediction_leagues} leagues; '
              f'{recommendation_count} recommendations across {recommendation_leagues} leagues; '
              '0 synthetic/unreal actionable recommendations; 0 aggregate ai.valid_bets rows.'
          )
          PY

      - name: Activation summary
        if: success()
        shell: bash
        run: |
          {
            echo '## Production AI Lab v2 activated'
            echo
            echo "- Selected model version: \`${SELECTED_VERSION}\`"
            echo "- Exact main: \`${GITHUB_SHA}\`"
            echo "- Provider refresh performed: \`${{ steps.evidence.outputs.refresh_performed }}\`"
            echo "- Predict run: \`${{ steps.ai.outputs.predict_run_id }}\`"
            echo "- Price refresh + value run: \`${{ steps.ai.outputs.value_run_id }}\`"
            echo '- Recommendations are paper research only; aggregate MAX/AVG rows remain non-actionable.'
          } >> "${GITHUB_STEP_SUMMARY}"
