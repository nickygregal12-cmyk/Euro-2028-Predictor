name: Browser end-to-end

# THE PATH LIST MOVED INSIDE, AND THAT IS WHAT MAKES THIS REQUIRABLE.
#
# A `paths:`-filtered workflow does not run on a pull request it does not match,
# so its check never posts, and a required context that never posts blocks that
# pull request for ever — `DOC-001`, then `OPS-012`. The quieter half is what
# leaving the filter costs: the context cannot be required at all, so a change
# that breaks the browser journey merges on a green core CI that never opened a
# browser.
#
# This is the `database-parity.yml` shape, and for the same reason: the suite
# below spins a local Supabase and drives a browser for up to fifty minutes, so
# an unrelated pull request must still not run it. The filter becomes a
# seconds-long `changes` job, both suites stay gated on its answer, and one
# always-reporting gate publishes the stable context.
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  statuses: read

jobs:
  changes:
    name: Browser E2E paths changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      e2e: ${{ steps.decide.outputs.e2e }}
    env:
      # THE ONE COPY OF THE PATH LIST, moved here from the trigger's `paths:`.
      # Kept as a parseable block rather than dissolved into grep patterns, so
      # `tests/scripts/browserE2EPathFilter.test.ts` can still check it against
      # what the harness actually reads — that test derives its expectations from
      # the suites' own imports, and it is the reason this list is trustworthy.
      #
      # An entry is a shell pattern matched against each changed file, so an exact
      # path and a `dir/**` prefix both work. Comment lines are skipped.
      E2E_PATHS: |
        .github/workflows/browser-e2e.yml
        .github/actions/start-local-supabase/**
        e2e/**
        production-smoke/**
        playwright.config.ts
        playwright.auth.config.ts
        playwright.production.config.ts
        scripts/bonus-games/**
        scripts/production-smoke.mjs
        vite.config.ts
        package.json
        package-lock.json
        src/**
        supabase/**
        config/deployment-contract.json
        index.html
        public/**
        netlify.toml
        tests/design-system/visualContractHarness.test.ts
        tests/scripts/browserE2EWorkflow.test.ts
        tests/scripts/authRecoveryE2E.test.ts
        tests/scripts/e2eProjectGating.test.ts
        tests/scripts/browserE2EPathFilter.test.ts
        tests/scripts/localSupabaseStart.test.ts
        tests/scripts/productionSmokePerimeter.test.ts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # The base commit is what `git diff` needs, and full history is the
          # dependable way to have it. This job is seconds either way.
          fetch-depth: 0

      - name: Decide whether the browser evidence is owed
        id: decide
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          if [ -z "${BASE_SHA:-}" ]; then
            # A manual dispatch has no base to compare against. Measure.
            printf 'e2e=true\n' >> "$GITHUB_OUTPUT"
            echo 'No pull-request base: running the browser suites.'
            exit 0
          fi

          # THREE DOTS, NOT TWO. `git diff A B` compares the two trees, so once
          # the base branch advances it reports files changed *on the base* as
          # though this pull request had touched them — and a pull request that
          # touched none of these would then be told the browser evidence was
          # owed and spend fifty minutes proving it. `A...B` diffs from the merge
          # base, which is the question actually being asked: what did this
          # branch change?
          changed_file="$(mktemp)"
          git diff --name-only "$BASE_SHA...$HEAD_SHA" > "$changed_file"

          matched=''
          while IFS= read -r entry; do
            entry="${entry#"${entry%[![:space:]]*}"}"
            case "$entry" in '' | '#'*) continue ;; esac
            while IFS= read -r file; do
              # Unquoted on purpose: inside `case`, the word is a pattern, which
              # is what every entry above is meant to be.
              # shellcheck disable=SC2254
              case "$file" in
                $entry) matched="$entry" ;;
              esac
            done < "$changed_file"
          done <<E2E_ENTRIES
          $E2E_PATHS
          E2E_ENTRIES

          if [ -n "$matched" ]; then
            printf 'e2e=true\n' >> "$GITHUB_OUTPUT"
            printf 'Browser evidence is owed: %s changed.\n' "$matched"
          else
            printf 'e2e=false\n' >> "$GITHUB_OUTPUT"
            echo 'No path the browser suites read was changed.'
          fi

  authenticated-browser:
    needs: changes
    if: ${{ needs.changes.outputs.e2e == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Harden runner (audit egress)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.2
          cache: npm

      - uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2
        with:
          version: 2.84.2
          github-token: ${{ github.token }}

      - name: Install application dependencies
        run: npm ci

      - name: Install the gated browser engines and system dependencies
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Start disposable local Supabase
        uses: ./.github/actions/start-local-supabase

      - name: Rebuild from committed migrations and seed
        run: supabase db reset --local

      - name: Publish disposable Bonus Games browser catalogue
        shell: bash
        run: e2e/seed-browser-database.sh

      - name: Export local-only browser environment
        shell: bash
        run: |
          set -euo pipefail
          supabase status -o env > /tmp/supabase.env
          # shellcheck disable=SC1091
          source /tmp/supabase.env
          : "${API_URL:?Supabase API_URL missing}"
          : "${ANON_KEY:?Supabase ANON_KEY missing}"
          : "${SERVICE_ROLE_KEY:?Supabase SERVICE_ROLE_KEY missing}"
          MAIL_URL="${INBUCKET_URL:-http://127.0.0.1:54324}"
          {
            echo "E2E_SUPABASE_URL=$API_URL"
            echo "E2E_SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "E2E_MAIL_URL=$MAIL_URL"
            echo 'E2E_USER_EMAIL=e2e@euro28.local'
            echo 'E2E_USER_PASSWORD=E2e-local-only-2028!'
            echo "VITE_SUPABASE_URL=$API_URL"
            echo "VITE_SUPABASE_ANON_KEY=$ANON_KEY"
            echo 'VITE_DEV_AUTOLOGIN=true'
            echo 'VITE_DEV_USER_EMAIL=e2e@euro28.local'
            echo 'VITE_DEV_USER_PASSWORD=E2e-local-only-2028!'
          } >> "$GITHUB_ENV"

      - name: Select the journeys this change requires
        id: journeys
        # A branch name is attacker-chosen on a fork pull request, so it is
        # passed as data rather than pasted into the script.
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags origin "${BASE_REF}"
          SELECTED="$(node scripts/select-browser-journeys.mjs "origin/${BASE_REF}")"
          echo "BROWSER_JOURNEYS=${SELECTED}" >> "$GITHUB_ENV"

      - name: Run authenticated application journeys
        run: |
          if [ -z "${BROWSER_JOURNEYS}" ]; then
            echo 'Running the full authenticated suite.'
            npm run test:e2e
          else
            echo "Running targeted journeys: ${BROWSER_JOURNEYS}"
            # Declared, not rewritten: intentional. shellcheck only began seeing this
            # when SHA-pinning marked the file changed, so it is pre-existing.
            # shellcheck disable=SC2086
            npm run test:e2e -- ${BROWSER_JOURNEYS}
          fi

      - name: Run signup and password-recovery journeys
        run: npm run test:e2e:auth

      - name: Upload Playwright diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            playwright-report-auth/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop and delete disposable local data
        if: always()
        run: supabase stop --no-backup

  deploy-preview-smoke:
    needs: changes
    # The pre-existing condition is kept and the paths decision added to it. This
    # job verifies the Netlify preview identity for a pull request targeting
    # `main`, so it is legitimately skipped on other bases — which is why the gate
    # below accepts `skipped` from it and not from the browser suite.
    if: >-
      ${{ needs.changes.outputs.e2e == 'true'
      && github.event_name == 'pull_request'
      && github.base_ref == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Harden runner (audit egress)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.2

      - name: Wait for exact Netlify deploy preview status
        id: preview-deploy
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EXPECTED_COMMIT: ${{ github.event.pull_request.head.sha }}
          EXPECTED_PREVIEW_ORIGIN: https://deploy-preview-${{ github.event.pull_request.number }}--euro28predictor.netlify.app
          STATUS_CONTEXT: netlify/euro28predictor/deploy-preview
        run: |
          set -euo pipefail

          ready=false
          for attempt in $(seq 1 60); do
            curl \
              --fail \
              --silent \
              --show-error \
              --connect-timeout 10 \
              --max-time 20 \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer $GITHUB_TOKEN" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$REPOSITORY/commits/$EXPECTED_COMMIT/status" \
              --output /tmp/euro28-preview-status.json

            STATUS_STATE="$(node - <<'NODE'
          const fs = require('node:fs')
          const response = JSON.parse(
            fs.readFileSync('/tmp/euro28-preview-status.json', 'utf8'),
          )
          const status = response.statuses?.find(
            (candidate) => candidate.context === process.env.STATUS_CONTEXT,
          )
          process.stdout.write(status?.state ?? 'missing')
          NODE
            )"

            if [ "$STATUS_STATE" = 'success' ]; then
              ready=true
              break
            fi

            if [ "$STATUS_STATE" = 'failure' ] || [ "$STATUS_STATE" = 'error' ]; then
              echo "STOP: Netlify reported $STATUS_STATE for the exact PR head." >&2
              exit 1
            fi

            echo "Netlify preview status is $STATUS_STATE (attempt $attempt/60)."
            sleep 5
          done

          if [ "$ready" != true ]; then
            echo 'STOP: Netlify did not certify a successful deploy preview for the exact PR head.' >&2
            exit 1
          fi

          node - <<'NODE'
          const fs = require('node:fs')
          const response = JSON.parse(
            fs.readFileSync('/tmp/euro28-preview-status.json', 'utf8'),
          )
          const status = response.statuses?.find(
            (candidate) => candidate.context === process.env.STATUS_CONTEXT,
          )

          if (!status || status.state !== 'success') process.exit(1)
          if (status.sha && status.sha !== process.env.EXPECTED_COMMIT) process.exit(1)
          if (status.target_url && !status.target_url.includes('netlify')) process.exit(1)
          NODE

          echo "preview_origin=$EXPECTED_PREVIEW_ORIGIN" >> "$GITHUB_OUTPUT"

      - name: Verify protected release identity is not public
        shell: bash
        env:
          PREVIEW_ORIGIN: ${{ steps.preview-deploy.outputs.preview_origin }}
        run: |
          set -euo pipefail

          HTTP_CODE="$(curl \
            --silent \
            --show-error \
            --connect-timeout 10 \
            --max-time 20 \
            --max-redirs 0 \
            --dump-header /tmp/euro28-preview-headers.txt \
            --output /tmp/euro28-preview-body.txt \
            --write-out '%{http_code}' \
            "$PREVIEW_ORIGIN/release.json" || true)"

          if node - <<'NODE'
          const fs = require('node:fs')
          try {
            const release = JSON.parse(
              fs.readFileSync('/tmp/euro28-preview-body.txt', 'utf8'),
            )
            const exposed =
              release.environment === 'deploy-preview' &&
              typeof release.commit === 'string' &&
              Number.isInteger(release.applicationContract) &&
              Number.isInteger(release.hostedContract)
            process.exit(exposed ? 0 : 1)
          } catch {
            process.exit(1)
          }
          NODE
          then
            echo 'STOP: protected deploy-preview release.json is publicly readable.' >&2
            exit 1
          fi

          case "$HTTP_CODE" in
            200|301|302|303|307|308|401|403)
              ;;
            *)
              echo "STOP: expected a Netlify protection response, received HTTP $HTTP_CODE." >&2
              exit 1
              ;;
          esac

          if [ "$HTTP_CODE" = '200' ] && ! grep -Eiq 'netlify|log[ -]?in|sign[ -]?in' /tmp/euro28-preview-body.txt; then
            echo 'STOP: HTTP 200 response was neither release metadata nor a recognisable login page.' >&2
            exit 1
          fi

          echo "Exact PR head deployed successfully and release metadata is protected (HTTP $HTTP_CODE)."

      - name: Record protected-preview test boundary
        run: |
          echo 'Netlify team-login protection has no supported non-interactive site session.'
          echo 'The exact deploy is certified by the Netlify commit status and public release metadata is refused.'
          echo 'Authenticated browser behaviour remains covered by the disposable local-Supabase job.'
          echo 'CDN HTTP and browser smoke remain a manual, release-specific production gate.'

  gate:
    # THE NAME IS THE RULESET'S CONTEXT STRING. A ruleset matches a status check
    # on the check-run name, which for an Actions job is the job's `name:` alone,
    # so it is written in the `Workflow / Job` form the rule asks for. `CI /
    # Required merge gate` was renamed for exactly this reason after every pull
    # request sat waiting on a context nothing emitted.
    name: Browser end-to-end / Required browser gate
    # ALWAYS. This context has to exist on every pull request — including the ones
    # with nothing to measure, and including the ones where a suite failed,
    # because a gate that vanished on failure would be indistinguishable from one
    # that passed.
    if: ${{ always() }}
    needs: [changes, authenticated-browser, deploy-preview-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # AN UNANSWERED DECISION IS NOT "NOTHING TO MEASURE". Its output would be
      # empty, and an empty output is not 'true' — so without this the gate would
      # report success for a pull request nobody had classified.
      - name: Refuse an unanswered decision
        if: ${{ needs.changes.result != 'success' }}
        run: |
          echo "ERROR: the paths decision concluded '${{ needs.changes.result }}'."
          echo 'Whether this change owes browser evidence is unknown, which is'
          echo 'not a pass.'
          exit 1

      - name: Refuse a browser suite that did not succeed where it was owed
        if: >-
          ${{ needs.changes.result == 'success'
          && needs.changes.outputs.e2e == 'true'
          && needs.authenticated-browser.result != 'success' }}
        run: |
          echo 'ERROR: browser evidence was owed on this pull request.'
          echo "authenticated-browser concluded '${{ needs.authenticated-browser.result }}'."
          echo 'Red, cancelled and absent are all "not proven", and none of them'
          echo 'is a pass.'
          exit 1

      # `skipped` is accepted here and nowhere else. This job only runs for a pull
      # request targeting `main`, so on any other base its absence is the correct
      # outcome rather than missing evidence. Red and cancelled are still refused.
      - name: Refuse a preview smoke that ran and failed
        if: >-
          ${{ needs.changes.result == 'success'
          && needs.changes.outputs.e2e == 'true'
          && needs.deploy-preview-smoke.result != 'success'
          && needs.deploy-preview-smoke.result != 'skipped' }}
        run: |
          echo 'ERROR: the deploy-preview smoke did not prove the preview identity.'
          echo "deploy-preview-smoke concluded '${{ needs.deploy-preview-smoke.result }}'."
          exit 1

      - name: Report success where no browser path changed
        if: ${{ needs.changes.result == 'success' && needs.changes.outputs.e2e != 'true' }}
        run: |
          echo 'No path the browser suites read was changed on this pull request.'
          echo 'Nothing this change touches can move the browser journey or the'
          echo 'preview boundary. Reporting success so the gate stays a stable'
          echo 'required context.'
