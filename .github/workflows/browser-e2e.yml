name: Browser E2E

on:
  pull_request:
    paths:
      - '.github/workflows/browser-e2e.yml'
      - 'e2e/**'
      - 'production-smoke/**'
      - 'playwright.config.ts'
      - 'playwright.auth.config.ts'
      - 'playwright.production.config.ts'
      - 'scripts/production-smoke.mjs'
      - 'vite.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'src/**'
      - 'supabase/**'
      - 'tests/scripts/browserE2EWorkflow.test.ts'
      - 'tests/scripts/authRecoveryE2E.test.ts'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authenticated-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm

      - uses: supabase/setup-cli@v2
        with:
          version: 2.84.2
          github-token: ${{ github.token }}

      - name: Install application dependencies
        run: npm ci

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Start disposable local Supabase
        run: supabase start

      - name: Rebuild from committed migrations and seed
        run: supabase db reset --local

      - name: Export local-only browser environment
        shell: bash
        run: |
          set -euo pipefail
          supabase status -o env > /tmp/supabase.env
          # shellcheck disable=SC1091
          source /tmp/supabase.env
          : "${API_URL:?Supabase API_URL missing}"
          : "${ANON_KEY:?Supabase ANON_KEY missing}"
          : "${SERVICE_ROLE_KEY:?Supabase SERVICE_ROLE_KEY missing}"
          MAIL_URL="${INBUCKET_URL:-http://127.0.0.1:54324}"
          {
            echo "E2E_SUPABASE_URL=$API_URL"
            echo "E2E_SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "E2E_MAIL_URL=$MAIL_URL"
            echo 'E2E_USER_EMAIL=e2e@euro28.local'
            echo 'E2E_USER_PASSWORD=E2e-local-only-2028!'
            echo "VITE_SUPABASE_URL=$API_URL"
            echo "VITE_SUPABASE_ANON_KEY=$ANON_KEY"
            echo 'VITE_DEV_AUTOLOGIN=true'
            echo 'VITE_DEV_USER_EMAIL=e2e@euro28.local'
            echo 'VITE_DEV_USER_PASSWORD=E2e-local-only-2028!'
          } >> "$GITHUB_ENV"

      - name: Run authenticated application journeys
        run: npm run test:e2e

      - name: Run signup and password-recovery journeys
        run: npm run test:e2e:auth

      - name: Upload Playwright diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            playwright-report-auth/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop and delete disposable local data
        if: always()
        run: supabase stop --no-backup

  deploy-preview-smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm

      - name: Install application dependencies
        run: npm ci

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Wait for exact Netlify deploy preview
        shell: bash
        env:
          PREVIEW_ORIGIN: https://deploy-preview-${{ github.event.pull_request.number }}--euro28-predictor-dev.netlify.app
          EXPECTED_COMMIT: ${{ github.event.pull_request.head.sha }}
          EXPECTED_SUPABASE_REF: iouzoutneyjpugbbtdem
        run: |
          set -euo pipefail

          ready=false
          for attempt in $(seq 1 60); do
            if curl \
              --fail \
              --silent \
              --show-error \
              --connect-timeout 10 \
              --max-time 20 \
              "$PREVIEW_ORIGIN/release.json" \
              --output /tmp/euro28-preview-release.json
            then
              if node - <<'NODE'
          const fs = require('node:fs')
          const release = JSON.parse(
            fs.readFileSync('/tmp/euro28-preview-release.json', 'utf8'),
          )

          const valid =
            release.environment === 'deploy-preview' &&
            release.commit === process.env.EXPECTED_COMMIT &&
            release.applicationContract === 35 &&
            release.hostedContract === 35 &&
            release.supabaseProjectRef === process.env.EXPECTED_SUPABASE_REF

          process.exit(valid ? 0 : 1)
          NODE
              then
                ready=true
                break
              fi
            fi

            echo "Preview is not yet the exact PR head (attempt $attempt/60)."
            sleep 5
          done

          if [ "$ready" != true ]; then
            echo 'STOP: Netlify preview did not reach the exact expected release identity.' >&2
            exit 1
          fi

          {
            echo "EURO28_SMOKE_ORIGIN=$PREVIEW_ORIGIN"
            echo 'EURO28_SMOKE_ALLOW_NON_PRODUCTION=true'
            echo 'EURO28_SMOKE_EXPECTED_CONTEXT=deploy-preview'
            echo "EURO28_SMOKE_EXPECTED_SUPABASE_REF=$EXPECTED_SUPABASE_REF"
            echo "EURO28_SMOKE_EXPECTED_COMMIT=$EXPECTED_COMMIT"
          } >> "$GITHUB_ENV"

      - name: Run deploy-preview HTTP smoke
        run: npm run smoke:production

      - name: Run deploy-preview browser smoke
        run: npm run smoke:production:browser

      - name: Upload deploy-preview smoke diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: deploy-preview-smoke-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
