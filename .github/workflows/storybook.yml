name: Storybook

on:
  pull_request:
    paths:
      - '.storybook/**'
      - 'src/design-system/**'
      - 'src/**/*.stories.tsx'
      - 'package.json'
      - 'package-lock.json'
      - 'vitest.storybook.config.ts'
      - '.github/workflows/storybook.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # Playwright's system-package install can spend more than ten minutes in
    # apt on a contended hosted runner before the browser tests even start.
    timeout-minutes: 25
    steps:
      - name: Harden runner (audit egress)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Build Storybook
        run: npm run build:storybook
      - name: Run Storybook render and accessibility tests
        run: npm run test:storybook
