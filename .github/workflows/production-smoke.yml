name: Production Smoke

on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Exact published production commit to verify
        required: true
      expected_contract:
        description: >-
          Contract version the published release must report. Leave blank to
          use the checked-out deployment contract. Set it only when verifying a
          previously published release whose contract differs from this branch.
        required: false

permissions:
  contents: read

concurrency:
  group: production-smoke
  cancel-in-progress: false

jobs:
  anonymous-production-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22.22.2
          cache: npm

      - name: Install application dependencies
        run: npm ci

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Wait for the exact milestone production release
        shell: bash
        env:
          PRODUCTION_ORIGIN: https://euro28predictor.com
          EXPECTED_SUPABASE_REF: vkfnsqdyhvtwyqkisxhk
          EXPECTED_CONTRACT_INPUT: ${{ inputs.expected_contract }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        run: |
          set -euo pipefail

          if ! [[ "$EXPECTED_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'STOP: expected_commit must be an exact 40-character Git SHA.' >&2
            exit 1
          fi

          # Derive from committed authority by default so this guard cannot
          # drift behind config/deployment-contract.json. An explicit input
          # stays available for verifying an already-published older release.
          if [ -n "${EXPECTED_CONTRACT_INPUT:-}" ]; then
            EXPECTED_CONTRACT="${EXPECTED_CONTRACT_INPUT}"
            echo "Using operator-supplied expected contract ${EXPECTED_CONTRACT}."
          else
            EXPECTED_CONTRACT="$(node -p "require('./config/deployment-contract.json').contractVersion")"
            echo "Using deployment-contract expected contract ${EXPECTED_CONTRACT}."
          fi

          if ! [[ "$EXPECTED_CONTRACT" =~ ^[1-9][0-9]*$ ]]; then
            echo 'STOP: expected contract must be a positive integer.' >&2
            exit 1
          fi

          export EXPECTED_CONTRACT

          ready=false
          for attempt in $(seq 1 120); do
            if curl \
              --fail \
              --silent \
              --show-error \
              --connect-timeout 10 \
              --max-time 20 \
              "$PRODUCTION_ORIGIN/release.json" \
              --output /tmp/euro28-production-release.json
            then
              if node - <<'NODE'
          const fs = require('node:fs')
          const release = JSON.parse(
            fs.readFileSync('/tmp/euro28-production-release.json', 'utf8'),
          )
          const expectedContract = Number(process.env.EXPECTED_CONTRACT)

          const valid =
            Number.isInteger(expectedContract) &&
            release.environment === 'production' &&
            release.applicationContract === expectedContract &&
            release.hostedContract === expectedContract &&
            release.supabaseProjectRef === process.env.EXPECTED_SUPABASE_REF &&
            release.commit === process.env.EXPECTED_COMMIT &&
            release.commit !== 'local' &&
            release.deployId !== 'local'

          process.exit(valid ? 0 : 1)
          NODE
              then
                ready=true
                break
              fi
            fi

            echo "Production is not the expected milestone release (attempt $attempt/120)."
            sleep 5
          done

          if [ "$ready" != true ]; then
            echo 'STOP: Netlify production did not publish the expected milestone release identity.' >&2
            cat /tmp/euro28-production-release.json 2>/dev/null || true
            exit 1
          fi

          {
            echo "EURO28_SMOKE_ORIGIN=$PRODUCTION_ORIGIN"
            echo 'EURO28_SMOKE_EXPECTED_CONTEXT=production'
            echo "EURO28_SMOKE_EXPECTED_SUPABASE_REF=$EXPECTED_SUPABASE_REF"
            echo "EURO28_SMOKE_EXPECTED_CONTRACT=$EXPECTED_CONTRACT"
            echo "EURO28_SMOKE_EXPECTED_COMMIT=$EXPECTED_COMMIT"
          } >> "$GITHUB_ENV"

      - name: Run production HTTP smoke
        run: npm run smoke:production

      - name: Run production browser smoke
        run: npm run smoke:production:browser

      - name: Upload production smoke diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: production-smoke-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
