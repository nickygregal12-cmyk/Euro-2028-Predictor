name: Production Smoke

# Two assertions, not one.
#
# Production is password protected, so the release checks need a session. But an
# authenticated-only smoke would be WEAKER than the accidental red it replaces:
# before this workflow could authenticate, its failure at least proved that an
# anonymous visitor is refused. That property is worth keeping deliberately
# rather than losing it as a side effect of fixing the gate, so:
#
#   1. Anonymous  — /release.json with no credential MUST answer 401. This
#      asserts the perimeter holds, and it fails loudly if the site is ever
#      made public without a decision.
#   2. Authenticated — the release identity, security headers and browser
#      journeys, using a session opened from a repository secret.
#
# The exchange in step 2 was measured, not assumed. See the header of
# scripts/production-site-session.mjs for the probe results: Netlify's site
# password is a login form, HTTP Basic auth is refused, and the anonymous 401
# carries no WWW-Authenticate header at all.
#
# SECRETS. The password is a repository secret and GitHub masks it. The session
# cookie is a JWT minted at runtime and GitHub does NOT mask it, so it is never
# placed in an environment variable or a run: line — it lives inside Node, or in
# a storage-state file under RUNNER_TEMP that is shredded in an always() step.

on:
  workflow_dispatch:
    inputs:
      site:
        description: >-
          Which production deployment to smoke. ADR 0026 builds two from one
          commit and both must be verified separately: they share a Supabase
          project and a release identity but not a bundle, so a green run
          against one says nothing about the other.
        type: choice
        default: euro
        options:
          - euro
          - hub
      expected_commit:
        description: Exact published production commit to verify
        required: true
      expected_contract:
        description: >-
          Contract version the published release must report. Leave blank to
          use the checked-out deployment contract. Set it only when verifying a
          previously published release whose contract differs from this branch.
        required: false

permissions:
  contents: read

concurrency:
  # PER SITE, so smoking one deployment never cancels or queues behind the
  # other. They are independent artifacts and a release means checking both.
  group: production-smoke-${{ inputs.site }}
  cancel-in-progress: false

jobs:
  production-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # ONE SUPABASE PROJECT, TWO ORIGINS. ADR 0026's two deployments share the
      # backend and the account model, so the expected project reference is the
      # same for both and only the address differs. `scripts/production-smoke.mjs`
      # and `production-smoke/anonymous.spec.ts` derive the PRODUCT each origin
      # must serve from the origin itself, so nothing here needs to name a brand.
      #
      # THE HUB IS SMOKEABLE ONLY WHILE IT SHARES THE EURO SITE'S PASSWORD. Both
      # halves of this workflow assume that one perimeter: the anonymous half
      # requires exactly 401, which is the site-password refusal and not what
      # Netlify Team SSO returns, and the authenticated half opens a session by
      # posting to the site-password form, which Team SSO does not have. If a
      # project is moved back to Team SSO, this input stops working for it and
      # the honest fix is to say so rather than to relax the 401.
      PRODUCTION_ORIGIN: ${{ inputs.site == 'hub' && 'https://predictorhub.netlify.app' || 'https://euro28predictor.com' }}
      EXPECTED_SUPABASE_REF: vkfnsqdyhvtwyqkisxhk

    steps:
      - name: Harden runner (audit egress)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.2
          cache: npm

      - name: Install application dependencies
        run: npm ci

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Refuse to continue if the site is not protected
        shell: bash
        run: |
          set -euo pipefail

          # No credential on purpose. A 200 here means the perimeter is gone,
          # which is a finding in its own right and must never be smoothed over
          # by the authenticated pass that follows.
          status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --connect-timeout 10 --max-time 20 \
            "${PRODUCTION_ORIGIN}/release.json")"

          if [ "${status}" != '401' ]; then
            echo "STOP: an anonymous request for /release.json returned HTTP ${status}; expected 401." >&2
            echo 'The site is not password protected. Publishing is not a decision this workflow may make' >&2
            echo 'on the owner behalf, and AGE-001 is still unbuilt, so this is a stop rather than a warning.' >&2
            exit 1
          fi

          echo 'Perimeter holds: an anonymous request for /release.json is refused with 401.'

      - name: Resolve the expected release identity
        shell: bash
        env:
          EXPECTED_CONTRACT_INPUT: ${{ inputs.expected_contract }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        run: |
          set -euo pipefail

          if ! [[ "$EXPECTED_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'STOP: expected_commit must be an exact 40-character Git SHA.' >&2
            exit 1
          fi

          # Derive from committed authority by default so this guard cannot
          # drift behind config/deployment-contract.json. An explicit input
          # stays available for verifying an already-published older release.
          if [ -n "${EXPECTED_CONTRACT_INPUT:-}" ]; then
            EXPECTED_CONTRACT="${EXPECTED_CONTRACT_INPUT}"
            echo "Using operator-supplied expected contract ${EXPECTED_CONTRACT}."
          else
            EXPECTED_CONTRACT="$(node -p "require('./config/deployment-contract.json').contractVersion")"
            echo "Using deployment-contract expected contract ${EXPECTED_CONTRACT}."
          fi

          if ! [[ "$EXPECTED_CONTRACT" =~ ^[1-9][0-9]*$ ]]; then
            echo 'STOP: expected contract must be a positive integer.' >&2
            exit 1
          fi

          {
            echo "EURO28_SMOKE_ORIGIN=$PRODUCTION_ORIGIN"
            echo 'EURO28_SMOKE_EXPECTED_CONTEXT=production'
            echo "EURO28_SMOKE_EXPECTED_SUPABASE_REF=$EXPECTED_SUPABASE_REF"
            echo "EURO28_SMOKE_EXPECTED_CONTRACT=$EXPECTED_CONTRACT"
            echo "EURO28_SMOKE_EXPECTED_COMMIT=$EXPECTED_COMMIT"
            echo "EURO28_SMOKE_STORAGE_STATE=${RUNNER_TEMP}/production-storage-state.json"
          } >> "$GITHUB_ENV"

      - name: Wait for the exact milestone production release
        env:
          EURO28_SITE_PASSWORD: ${{ secrets.PRODUCTION_SITE_PASSWORD }}
        run: node scripts/wait-for-production-release.mjs

      - name: Open a browser session against the protected site
        env:
          EURO28_SITE_PASSWORD: ${{ secrets.PRODUCTION_SITE_PASSWORD }}
        run: node scripts/write-production-storage-state.mjs "${EURO28_SMOKE_STORAGE_STATE}"

      - name: Run production HTTP smoke
        env:
          EURO28_SITE_PASSWORD: ${{ secrets.PRODUCTION_SITE_PASSWORD }}
        run: npm run smoke:production

      - name: Run production browser smoke
        run: npm run smoke:production:browser

      - name: Shred the browser session
        if: ${{ always() }}
        shell: bash
        run: |
          set -uo pipefail
          find "${RUNNER_TEMP}" -maxdepth 1 -name 'production-storage-state.json' -type f -print0 \
            | xargs -0 -r shred --remove --zero 2>/dev/null || true
          echo 'Browser session file removed.'

      # A Playwright trace records request headers, so a trace retained from a
      # FAILED browser run can contain the site session cookie. That is accepted
      # rather than overlooked: the artifact is visible only to people who can
      # already read this repository's secrets, the cookie is a short-lived
      # session for a perimeter the owner has recorded as a convenience barrier
      # rather than a confidentiality control, and a trace is the one thing that
      # makes a failed release diagnosable. Retention is shortened accordingly.
      # If the perimeter ever protects something that matters, turn `trace` off
      # in playwright.production.config.ts before that changes.
      - name: Upload production smoke diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: production-smoke-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 3
