name: AI Lab value catch-up

# Two recovery duties share this provider-free workflow:
#
# 1. GitHub scheduled workflows may start late. The explicit Tuesday/Friday
#    recovery triggers still decide from durable ai.job_runs evidence rather
#    than runner wall-clock time.
# 2. The hosted pg_cron paid-odds heartbeat is fixture-aware. Every ten minutes
#    this workflow checks whether a newer paid dispatch exists than the last
#    complete nine-league value pass. If so it waits for the five provider
#    responses, reconciles them, refreshes free fixture prices, and reruns value.
#
# This workflow NEVER dispatches the paid provider itself. Provider spend stays
# inside public.dispatch_ai_odds_polls() and its database budget guard.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ai-lab-value-catchup.yml'
  schedule:
    - cron: '*/10 * * * *'
    - cron: '45 15 * * 2'
    - cron: '45 19 * * 5'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Same group as .github/workflows/ai-lab.yml for Production, so scheduled,
  # delayed and paid-dispatch recovery runs cannot mutate the lab concurrently.
  group: ai-lab-production
  cancel-in-progress: false

env:
  PRODUCTION_PROJECT_REF: vkfnsqdyhvtwyqkisxhk

jobs:
  recover-value-pass:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PROD_DB_URL: ${{ secrets.SUPABASE_PROD_DB_URL }}
      SOURCE_SCHEDULE: ${{ github.event.schedule || '' }}
    steps:
      - name: Harden runner (audit egress)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Resolve and verify Production
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${PROD_DB_URL}" ]; then
            echo 'SUPABASE_PROD_DB_URL is not set.'
            exit 1
          fi
          case "${PROD_DB_URL}" in
            *"${PRODUCTION_PROJECT_REF}"*) ;;
            *) echo "SUPABASE_PROD_DB_URL does not name Production ${PRODUCTION_PROJECT_REF}."; exit 1 ;;
          esac
          echo "::add-mask::${PROD_DB_URL}"
          echo "DATABASE_URL=${PROD_DB_URL}" >> "$GITHUB_ENV"

      - name: Install
        # Resolves nothing: the hosted job consumes the committed ai/uv.lock.
        run: bash scripts/agent-tools/ai-sync.sh core

      - name: Prove the package writes to schema ai and nowhere else
        working-directory: ai
        run: python check_write_scope.py

      - name: Decide from durable paid-dispatch and job evidence
        id: need
        working-directory: ai
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from db import connect

          recovery_schedules = {'45 15 * * 2', '45 19 * * 5'}
          source_schedule = os.environ.get('SOURCE_SCHEDULE', '').strip()
          with connect() as conn:
              row = conn.execute("""
                  with latest_dispatch as (
                    select max(dispatched_at) as at from ai.odds_api_dispatches
                  )
                  select d.at as latest_dispatch,
                         coalesce(d.at >= now() - interval '24 hours', false) as dispatch_recent,
                         (select count(distinct league)
                            from ai.job_runs j
                           where j.job = 'find_value'
                             and j.status = 'succeeded'
                             and d.at is not null
                             and j.started_at >= d.at) as completed_since_dispatch,
                         (select count(distinct league)
                            from ai.job_runs j
                           where j.job = 'find_value'
                             and j.status = 'succeeded'
                             and j.started_at >= now() - interval '6 hours') as recent_completed
                    from latest_dispatch d
              """).fetchone()

          latest = row['latest_dispatch']
          completed_since = int(row['completed_since_dispatch'] or 0)
          recent = int(row['recent_completed'] or 0)
          explicit_recovery = source_schedule in recovery_schedules
          paid_recovery = bool(latest and row['dispatch_recent'] and completed_since < 9)
          need = (explicit_recovery and recent < 9) or paid_recovery
          wait_for_paid = paid_recovery

          print(f"Latest paid dispatch: {latest or 'none'}")
          print(f"Value leagues since paid dispatch: {completed_since}/9")
          print(f"Recent successful value leagues: {recent}/9")
          print(f"Trigger schedule: {source_schedule or 'push/manual'}")
          print(f"Need value pass: {need}; wait for paid responses: {wait_for_paid}")

          output = os.environ['GITHUB_OUTPUT']
          with open(output, 'a', encoding='utf-8') as handle:
              print(f"run={'true' if need else 'false'}", file=handle)
              print(f"wait_for_paid={'true' if wait_for_paid else 'false'}", file=handle)
              print(f"dispatch_at={latest.isoformat() if latest else ''}", file=handle)
          PY

      - name: Wait for the paid dispatch to finish ingesting
        if: steps.need.outputs.run == 'true' && steps.need.outputs.wait_for_paid == 'true'
        working-directory: ai
        env:
          DISPATCH_AT: ${{ steps.need.outputs.dispatch_at }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import time
          from db import connect

          dispatch_at = os.environ['DISPATCH_AT']
          for attempt in range(24):
              with connect() as conn:
                  row = conn.execute("""
                      select count(*) as responses,
                             count(*) filter (where http_status = 200) as ok
                        from ai.api_usage
                       where provider = 'the-odds-api'
                         and called_at >= %s::timestamptz
                  """, (dispatch_at,)).fetchone()
              responses = int(row['responses'])
              ok = int(row['ok'])
              print(f"Paid responses after {dispatch_at}: {responses}/5 observed, {ok} HTTP 200")
              if responses >= 5:
                  if ok < 5:
                      raise SystemExit(f'paid dispatch completed with only {ok}/5 HTTP 200 responses')
                  break
              time.sleep(10)
          else:
              raise SystemExit('timed out waiting for all five paid-odds responses')
          PY

      - name: Snapshot paid-provider usage
        if: steps.need.outputs.run == 'true'
        working-directory: ai
        shell: bash
        run: |
          python - <<'PY' > /tmp/paid-usage-before
          from db import connect
          with connect() as conn:
              row = conn.execute(
                  "select count(*)::bigint as n, coalesce(max(called_at)::text, '') as latest from ai.api_usage"
              ).fetchone()
          print(f"{row['n']}|{row['latest']}")
          PY

      - name: Recover value pass without a paid provider call
        if: steps.need.outputs.run == 'true'
        working-directory: ai
        shell: bash
        run: |
          set -euo pipefail
          python sync_fixtures.py
          python reconcile_paid_fixture_evidence.py
          python fetch_fixtures_odds.py
          ./run_leagues.sh find_value.py

      - name: Prove all nine leagues completed and this workflow spent no paid credit
        if: steps.need.outputs.run == 'true'
        working-directory: ai
        shell: bash
        run: |
          set -euo pipefail
          completed="$(python - <<'PY'
          from db import connect
          with connect() as conn:
              row = conn.execute("""
                  select count(distinct league) as n
                    from ai.job_runs
                   where job = 'find_value'
                     and status = 'succeeded'
                     and started_at >= now() - interval '90 minutes'
              """).fetchone()
          print(int(row['n']))
          PY
          )"
          [ "${completed}" -eq 9 ] || {
            echo "Expected all nine value jobs in the recovery run, got ${completed}."
            exit 1
          }
          python - <<'PY' > /tmp/paid-usage-after
          from db import connect
          with connect() as conn:
              row = conn.execute(
                  "select count(*)::bigint as n, coalesce(max(called_at)::text, '') as latest from ai.api_usage"
              ).fetchone()
          print(f"{row['n']}|{row['latest']}")
          PY
          diff -u /tmp/paid-usage-before /tmp/paid-usage-after

      - name: Summary
        if: success()
        shell: bash
        run: |
          if [ "${{ steps.need.outputs.run }}" = true ]; then
            message='Completed a nine-league value pass from durable recovery evidence; this workflow made no paid provider call.'
          else
            message='No newer paid dispatch or missing explicit recovery pass was found; recovery was a no-op.'
          fi
          {
            echo '## AI Lab value catch-up'
            echo
            echo "- ${message}"
            echo '- Paid dispatches are detected from `ai.odds_api_dispatches`; completion is proven from `ai.api_usage` and `ai.job_runs`.'
            echo '- Decision is based on durable evidence, not runner wall-clock time.'
          } >> "$GITHUB_STEP_SUMMARY"
