name: Contract 206 development fast-lane one-shot

# Temporary bridge because the connected GitHub app cannot invoke workflow_dispatch.
# This preserves ADR 0024's Development fast-lane mechanics and is deliberately
# hard-pinned to Contract 206, exact main, and the Development project only.
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/contract-206-development-one-shot.yml

permissions:
  contents: read

env:
  EXPECTED_PROJECT_REF: iouzoutneyjpugbbtdem
  FORBIDDEN_PRODUCTION_REF: vkfnsqdyhvtwyqkisxhk
  EXPECTED_CONTRACT: '206'
  EXPECTED_MIGRATION: '20260819110000'

jobs:
  fast-lane:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Refuse anything except exact Contract 206 main
        shell: bash
        run: |
          set -euo pipefail
          [ "${GITHUB_REF}" = 'refs/heads/main' ] || { echo 'ERROR: main only.'; exit 1; }
          git fetch --no-tags origin main
          [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" ] || { echo 'ERROR: not exact origin/main.'; exit 1; }
          [ -z "$(git status --porcelain=v1 --untracked-files=all)" ] || { echo 'ERROR: checkout is not clean.'; exit 1; }
          contract="$(node -p "require('./config/deployment-contract.json').contractVersion")"
          [ "${contract}" = "${EXPECTED_CONTRACT}" ] || { echo "ERROR: repository contract is ${contract}, expected ${EXPECTED_CONTRACT}."; exit 1; }
          latest="$(git ls-files 'supabase/migrations/*.sql' | sed -E 's#^.*/([0-9]{14})_.*#\1#' | sort | tail -1)"
          [ "${latest}" = "${EXPECTED_MIGRATION}" ] || { echo "ERROR: latest migration is ${latest}, expected ${EXPECTED_MIGRATION}."; exit 1; }

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.2

      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1
        with:
          version: 2.84.2

      - name: Preflight the Development secret and pending boundary
        env:
          SUPABASE_DEV_DB_URL: ${{ secrets.SUPABASE_DEV_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${SUPABASE_DEV_DB_URL}" ] || { echo 'ERROR: SUPABASE_DEV_DB_URL is not set.'; exit 1; }
          case "${SUPABASE_DEV_DB_URL}" in
            *"${FORBIDDEN_PRODUCTION_REF}"*) echo 'ERROR: secret resolves to Production.'; exit 1 ;;
            *"${EXPECTED_PROJECT_REF}"*) ;;
            *) echo 'ERROR: secret does not resolve to the Development project.'; exit 1 ;;
          esac
          supabase migration list --db-url "${SUPABASE_DEV_DB_URL}" > /tmp/migration-list.txt
          pending="$(awk -F'|' '$3 ~ /[0-9]/ && $2 !~ /[0-9]/ { v=$1; gsub(/[^0-9]/,"",v); if (length(v)==14) print v }' /tmp/migration-list.txt)"
          [ "${pending}" = "${EXPECTED_MIGRATION}" ] || {
            echo 'ERROR: pending migration boundary is not exactly Contract 206.'
            echo "Pending: ${pending:-<none>}"
            exit 1
          }
          file="$(git ls-files "supabase/migrations/${EXPECTED_MIGRATION}_*.sql")"
          [ -n "${file}" ] || { echo 'ERROR: Contract 206 migration file missing.'; exit 1; }
          node scripts/check-migration-additive.mjs "${file}"

      - name: Take the ADR 0024 lightweight snapshot
        env:
          SUPABASE_DEV_DB_URL: ${{ secrets.SUPABASE_DEV_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/fast-lane
          supabase db dump --db-url "${SUPABASE_DEV_DB_URL}" --data-only -f /tmp/fast-lane/pre-apply-data.sql
          supabase db dump --db-url "${SUPABASE_DEV_DB_URL}" -f /tmp/fast-lane/pre-apply-schema.sql
          echo "Snapshot bytes: $(wc -c < /tmp/fast-lane/pre-apply-data.sql) data, $(wc -c < /tmp/fast-lane/pre-apply-schema.sql) schema"

      - name: Apply Contract 206 to Development
        env:
          SUPABASE_DEV_DB_URL: ${{ secrets.SUPABASE_DEV_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          supabase db push --db-url "${SUPABASE_DEV_DB_URL}"

      - name: Verify Development is exactly Contract 206
        env:
          SUPABASE_DEV_DB_URL: ${{ secrets.SUPABASE_DEV_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          supabase migration list --db-url "${SUPABASE_DEV_DB_URL}" > /tmp/migration-list-after.txt
          if awk -F'|' '$3 ~ /[0-9]/ && $2 !~ /[0-9]/ { found=1 } END { exit !found }' /tmp/migration-list-after.txt; then
            echo 'ERROR: migrations remain pending after push.'
            exit 1
          fi
          grep -q "${EXPECTED_MIGRATION}" /tmp/migration-list-after.txt || { echo 'ERROR: Contract 206 is absent from hosted migration ledger.'; exit 1; }
          expected="$(node -p "require('./config/deployment-contract.json').requiredMigrationCount")"
          [ "${expected}" = "${EXPECTED_CONTRACT}" ] || { echo 'ERROR: deployment contract moved during rollout.'; exit 1; }
          echo 'Development is verified at Contract 206.'

      - name: Upload fast-lane evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: contract-206-development-fast-lane-evidence
          path: |
            /tmp/fast-lane/
            /tmp/migration-list.txt
            /tmp/migration-list-after.txt
          retention-days: 7
