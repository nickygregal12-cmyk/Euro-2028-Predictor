name: PR 804 refresh database types

# Temporary branch-only bootstrap. The normal regeneration workflow is
# workflow_dispatch-only; this file exists solely because the connected GitHub
# client cannot supply workflow_dispatch inputs. It is deleted again before the
# PR is eligible to merge.
on:
  push:
    branches:
      - agent/ui-ux-pro-max-polish
    paths:
      - '.github/workflows/pr-804-refresh-database-types.yml'

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FORBIDDEN_PRODUCTION_REF: vkfnsqdyhvtwyqkisxhk

    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/ui-ux-pro-max-polish
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22.22.2
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prove the secret names Development and not Production
        env:
          SUPABASE_DEV_DB_URL: ${{ secrets.SUPABASE_DEV_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${SUPABASE_DEV_DB_URL}" ] || {
            echo 'ERROR: repository secret SUPABASE_DEV_DB_URL is not set.'
            exit 1
          }
          case "${SUPABASE_DEV_DB_URL}" in
            *"${FORBIDDEN_PRODUCTION_REF}"*)
              echo 'ERROR: the development secret resolves to the Production project.'
              exit 1
              ;;
          esac

      - name: Regenerate from hosted Development
        env:
          SUPABASE_DEV_DB_URL: ${{ secrets.SUPABASE_DEV_DB_URL }}
        run: npm run generate:types

      # The generator normally runs after Development catches the repository up,
      # so it labels the artifact with the repository migration count. Here the
      # repository is intentionally one migration ahead (190 vs Development 189).
      # The generated TypeScript describes Development, so record 189 rather than
      # falsely claiming the not-yet-applied repository migration. The committed
      # databaseTypes test explicitly allows this normal ADR-0024 trailing state.
      - name: Record the hosted Development contract truthfully
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const path = 'src/services/supabase/database.types.meta.json'
          const meta = JSON.parse(fs.readFileSync(path, 'utf8'))
          if (meta.generatedFromContract !== meta.developmentHostedContract) {
            console.log(
              `Recording hosted Development contract ${meta.developmentHostedContract} ` +
              `instead of repository count ${meta.generatedFromContract}.`,
            )
            meta.generatedFromContract = meta.developmentHostedContract
            fs.writeFileSync(path, `${JSON.stringify(meta, null, 2)}\n`)
          }
          NODE

      - name: Commit generated artifact to this PR branch
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain=v1 -- src/services/supabase/database.types.ts src/services/supabase/database.types.meta.json)" ]; then
            echo 'Database types already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/services/supabase/database.types.ts src/services/supabase/database.types.meta.json
          git commit -m 'Regenerate database types from Development'
          git push origin HEAD:agent/ui-ux-pro-max-polish
