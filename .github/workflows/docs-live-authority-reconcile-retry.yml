name: Reconcile live authorities retry

on:
  push:
    branches:
      - docs/live-authority-reconciliation-20260808
    paths:
      - '.github/workflows/docs-live-authority-reconcile-retry.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: docs/live-authority-reconciliation-20260808
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22.22.2'
      - name: Re-run the reviewed fail-closed patch and normalize changed status lines
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/docs-live-authority-reconcile-once.yml').read_text()
          start_marker = "          python - <<'PY'\n"
          end_marker = "          PY\n"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          embedded = workflow[start:end]
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in embedded.splitlines())
          exec(compile(script, 'embedded-live-authority-patch.py', 'exec'), {})

          for path in [Path('MASTER-TODO.md'), Path('docs/roadmap.md')]:
              text = path.read_text()
              text = text.replace('**Status date:** 8 August 2026  \n', '**Status date:** 8 August 2026\n', 1)
              path.write_text(text)
          PY

          node scripts/generate-now.mjs
          git diff --check
          git status --short
      - name: Commit reconciled authorities
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AGENTS.md MASTER-TODO.md NOW.md docs/quality/current-status.md docs/quality/accepted-requirements.md docs/design/ui-modernisation-execution.md docs/roadmap.md docs/ops/ops-pending-migrations.md docs/ops/netlify-deploy-access.md tests/scripts/documentationContractFreshness.test.ts
          git diff --cached --quiet && { echo 'No reconciliation changes produced'; exit 1; }
          git commit -m 'Docs: reconcile live authorities and Netlify posture'
          git push origin HEAD:docs/live-authority-reconciliation-20260808
