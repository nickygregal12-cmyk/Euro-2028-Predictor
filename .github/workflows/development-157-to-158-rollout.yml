name: Development 157 to 158 rollout

# One-shot guarded application of contract 158 to hosted DEVELOPMENT.
#
# WHY THIS FILE EXISTS AT ALL, which is a gap worth recording rather than
# quietly working around.
#
# `check-migration-additive.mjs` refuses contract 158 — correctly, on
# `drop function`: `get_league_preview`'s return type narrows, and PostgreSQL
# cannot narrow a return type with `create or replace`. Its refusal says:
#
#   Destructive migrations do not use the fast lane.
#   Use stage-c1-development-rollout.yml, which keeps the backup and rehearsal.
#
# That advice cannot be followed. `stage-c1-development-rollout.yml` is a SPENT
# one-shot pinned to contract 65 — it refuses anything else with "repository
# contract must be 65", which is what it did on run 31472268116. Its name reads
# general and it is not. So a destructive development migration has had no
# runnable lane, and the checker has been pointing at a door that is bricked up.
#
# This file is that boundary's lane, in the same pinned per-boundary shape the
# Production promotions use. The generalisation — one guarded development lane
# that takes a boundary as input — is a better answer and is not this change:
# inventing a general-purpose destructive lane while landing a security contract
# is two risks where one will do.
#
# NO ENCRYPTED BACKUP, DELIBERATELY, and this is ADR 0024's reasoning rather
# than an omission. Development data is disposable; that is the premise the
# whole fast lane rests on. What the fast lane's refusal actually protects is
# the possibility of applying something destructive WITHOUT NOTICING, so this
# lane keeps the noticing — the exact batch, the source boundary, a dry run that
# must equal the batch, and a verification that names what changed — and drops
# the ceremony that exists for Production's irreplaceable rows. Production keeps
# its full backup-and-rehearsal pair.

on:
  workflow_dispatch:
    inputs:
      project_ref:
        description: Exact Development project ref confirmation
        required: true
      confirmation:
        description: Type APPLY-DEVELOPMENT-157-TO-158 to proceed
        required: true

permissions:
  contents: read

concurrency:
  group: development-157-to-158-rollout
  cancel-in-progress: false

env:
  EXPECTED_PROJECT_REF: iouzoutneyjpugbbtdem
  FORBIDDEN_PRODUCTION_REF: vkfnsqdyhvtwyqkisxhk
  CONFIRMATION_PHRASE: APPLY-DEVELOPMENT-157-TO-158
  SOURCE_CONTRACT: '157'
  TARGET_CONTRACT: '158'
  TARGET_VERSION: '20260811000000'
  TARGET_NAME: invite_code_hardening
  WORK_DIR: /tmp/development-157-to-158

jobs:
  rollout:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Refuse an unsafe dispatch or repository state
        env:
          INPUT_PROJECT_REF: ${{ inputs.project_ref }}
          INPUT_CONFIRMATION: ${{ inputs.confirmation }}
        shell: bash
        run: |
          set -euo pipefail
          [ "${INPUT_CONFIRMATION}" = "${CONFIRMATION_PHRASE}" ] || {
            echo "ERROR: confirmation phrase does not match ${CONFIRMATION_PHRASE}."
            exit 1
          }
          if [ "${INPUT_PROJECT_REF}" = "${FORBIDDEN_PRODUCTION_REF}" ]; then
            echo 'ERROR: this is the development lane. Production has its own pinned pair.'
            exit 1
          fi
          [ "${INPUT_PROJECT_REF}" = "${EXPECTED_PROJECT_REF}" ] || {
            echo "ERROR: only development project ${EXPECTED_PROJECT_REF} is permitted."
            exit 1
          }
          [ "${GITHUB_REF}" = 'refs/heads/main' ] || {
            echo 'ERROR: this workflow runs only from refs/heads/main.'
            exit 1
          }
          git fetch --no-tags origin main
          [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" ] || {
            echo 'ERROR: checked-out HEAD is not exact origin/main.'
            exit 1
          }
          [ -z "$(git status --porcelain=v1 --untracked-files=all)" ] || {
            echo 'ERROR: checkout is not clean.'
            exit 1
          }

      - name: Prove the repository still holds exactly the approved contract 158
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${WORK_DIR}"
          actual="$(git ls-files 'supabase/migrations/*.sql' | sort | sed -n '158p' | xargs -n1 basename)"
          [ "${actual}" = "${TARGET_VERSION}_${TARGET_NAME}.sql" ] || {
            echo "ERROR: repository row 158 is ${actual}, not the approved contract."
            exit 1
          }
          total="$(git ls-files 'supabase/migrations/*.sql' | wc -l | tr -d ' ')"
          [ "${total}" -ge "${TARGET_CONTRACT}" ] || {
            echo "ERROR: repository holds only ${total} migrations."
            exit 1
          }
          if [ "${total}" -gt "${TARGET_CONTRACT}" ]; then
            echo "Repository is at ${total}; this run is pinned to ${TARGET_CONTRACT}."
            echo 'Anything above the target is held back and is NOT applied here.'
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 22.22.2

      - uses: supabase/setup-cli@v1
        with:
          version: 2.84.2

      - name: Preflight the Development secret without printing it
        env:
          SUPABASE_DEV_DB_URL: ${{ secrets.SUPABASE_DEV_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${SUPABASE_DEV_DB_URL}" ] || {
            echo 'ERROR: repository secret SUPABASE_DEV_DB_URL is not set.'
            exit 1
          }
          case "${SUPABASE_DEV_DB_URL}" in
            *"${FORBIDDEN_PRODUCTION_REF}"*)
              echo 'ERROR: the development secret resolves to the production project.'
              exit 1
              ;;
            *"${EXPECTED_PROJECT_REF}"*) ;;
            *)
              echo 'ERROR: the development secret names neither known project.'
              exit 1
              ;;
          esac

      - name: Prove the live source is exactly contract 157
        env:
          SUPABASE_DEV_DB_URL: ${{ secrets.SUPABASE_DEV_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          count="$(supabase migration list --db-url "${SUPABASE_DEV_DB_URL}" 2>&1 \
            | awk -F'|' '$2 ~ /[0-9]/ { v = $2; gsub(/[^0-9]/, "", v); if (length(v) == 14) print v }' \
            | wc -l | tr -d ' ')"
          echo "Development currently holds ${count} applied migrations."
          [ "${count}" = "${SOURCE_CONTRACT}" ] || {
            echo "ERROR: Development is at ${count}, not the expected ${SOURCE_CONTRACT}."
            exit 1
          }

      - name: Hold back anything above the pinned target, then dry run
        env:
          SUPABASE_DEV_DB_URL: ${{ secrets.SUPABASE_DEV_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${WORK_DIR}/later-migrations"
          : > "${WORK_DIR}/moved-files.txt"
          for file in $(git ls-files 'supabase/migrations/*.sql' | sort); do
            filename="$(basename "${file}")"
            version="${filename:0:14}"
            if [[ "${version}" > "${TARGET_VERSION}" ]]; then
              mv "${file}" "${WORK_DIR}/later-migrations/${filename}"
              printf '%s\n' "${file}" >> "${WORK_DIR}/moved-files.txt"
            fi
          done
          if [ -s "${WORK_DIR}/moved-files.txt" ]; then
            echo 'Held back as ABOVE the pinned target, NOT applied by this run:'
            cat "${WORK_DIR}/moved-files.txt"
          fi

          supabase db push --db-url "${SUPABASE_DEV_DB_URL}" --dry-run \
            > "${WORK_DIR}/dry-run.txt" 2>&1
          cat "${WORK_DIR}/dry-run.txt"

          grep -oE '[0-9]{14}_[A-Za-z0-9_-]+\.sql' "${WORK_DIR}/dry-run.txt" \
            | awk '!seen[$0]++' > "${WORK_DIR}/pending.txt"
          expected="${TARGET_VERSION}_${TARGET_NAME}.sql"
          actual="$(cat "${WORK_DIR}/pending.txt")"
          [ "${actual}" = "${expected}" ] || {
            echo 'ERROR: the dry run is not exactly contract 158.'
            printf 'Expected:\n%s\nActual:\n%s\n' "${expected}" "${actual}"
            exit 1
          }

      - name: Apply contract 158
        env:
          SUPABASE_DEV_DB_URL: ${{ secrets.SUPABASE_DEV_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          supabase db push --db-url "${SUPABASE_DEV_DB_URL}" 2>&1 | tee "${WORK_DIR}/apply.txt"

      - name: Restore the repository migration tree in the runner
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "${WORK_DIR}/moved-files.txt" ]; then
            while IFS= read -r file; do
              [ -n "${file}" ] || continue
              filename="$(basename "${file}")"
              if [ -e "${WORK_DIR}/later-migrations/${filename}" ]; then
                mv "${WORK_DIR}/later-migrations/${filename}" "${file}"
              fi
            done < "${WORK_DIR}/moved-files.txt"
          fi

      - name: Say what to verify, rather than claiming it here
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '## Development applied contract 158'
            echo
            echo 'This job applied the migration. It does NOT verify it — a job'
            echo 'reporting on its own write is not independent evidence, which is'
            echo 'why every hosted claim in this repository comes from a separate'
            echo 'read-only query. Confirm before recording anything:'
            echo
            echo '- 158 rows ending `20260811000000_invite_code_hardening`;'
            echo '- `gen_invite_code()` returns twelve characters;'
            echo '- `get_league_preview` no longer returns `id`, `member_count` or `owner_name`;'
            echo '- `bonus_competitions_invite_code_shape`, `invite_code_registry_shape`'
            echo '  and `resolve_invite_code` all accept `{6,16}` — without which every'
            echo '  private competition creation raises `check_violation`;'
            echo '- `rotate_league_invite_code` exists and is executable by `authenticated` only.'
          } >> "${GITHUB_STEP_SUMMARY}"
