name: One-shot deploy Contract 190 to Production

# Connector bridge only. The authoritative rehearsal and rollout workflows stay
# workflow_dispatch-only and keep every Production safety assertion. This file
# exists because the connected GitHub app cannot itself invoke workflow_dispatch.
# A deliberate main-branch merge starts a fresh exact-head rehearsal, waits for
# it to succeed, and only then dispatches the existing guarded Production rollout.

on: push

permissions:
  contents: read
  actions: write

concurrency:
  group: production-189-to-190-rollout-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Rehearse exact main then dispatch guarded Production rollout
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_PROJECT_REF: vkfnsqdyhvtwyqkisxhk
          BACKUP_RUN_ID: '31785056556'
          REHEARSAL_WORKFLOW: production-189-to-190-rehearsal.yml
          ROLLOUT_WORKFLOW: production-189-to-190-rollout.yml
        shell: bash
        run: |
          set -euo pipefail

          if [ "${GITHUB_REF}" != 'refs/heads/main' ]; then
            echo "Skip: ${GITHUB_REF} is not main."
            exit 0
          fi

          message="$(jq -r '.head_commit.message // ""' "${GITHUB_EVENT_PATH}")"
          case "${message}" in
            'Ops: deploy Contract 190 to Production'*) ;;
            *) echo 'Skip: main push is not the dedicated Contract 190 Production deployment commit.'; exit 0 ;;
          esac

          exact_main() {
            local remote_sha
            remote_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
            [ "${remote_sha}" = "${GITHUB_SHA}" ] || {
              echo "ERROR: main moved to ${remote_sha}; refusing to continue from ${GITHUB_SHA}."
              exit 1
            }
          }

          find_exact_run() {
            local workflow="$1" after_epoch="$2"
            gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs?branch=main&event=workflow_dispatch&per_page=100" \
              --jq ".workflow_runs[] | select(.head_sha == \"${GITHUB_SHA}\") | select((.created_at | fromdateiso8601) >= ${after_epoch}) | .id" \
              | head -1
          }

          wait_for_run() {
            local run_id="$1" label="$2" status conclusion
            for _ in $(seq 1 120); do
              status="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq '.status')"
              if [ "${status}" = completed ]; then
                conclusion="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq '.conclusion')"
                [ "${conclusion}" = success ] || {
                  echo "ERROR: ${label} run ${run_id} completed with ${conclusion}."
                  exit 1
                }
                echo "${label} run ${run_id} succeeded."
                return 0
              fi
              sleep 10
            done
            echo "ERROR: ${label} run ${run_id} did not complete inside the bounded polling window."
            exit 1
          }

          exact_main
          rehearsal_after="$(date -u +%s)"
          gh workflow run "${REHEARSAL_WORKFLOW}" \
            --repo "${GITHUB_REPOSITORY}" \
            --ref main \
            -f project_ref="${EXPECTED_PROJECT_REF}" \
            -f confirmation=REHEARSE-PRODUCTION-189-TO-190 \
            -f backup_run_id="${BACKUP_RUN_ID}"

          rehearsal_id=''
          for _ in $(seq 1 30); do
            rehearsal_id="$(find_exact_run "${REHEARSAL_WORKFLOW}" "${rehearsal_after}" || true)"
            [ -n "${rehearsal_id}" ] && break
            sleep 2
          done
          [ -n "${rehearsal_id}" ] || { echo 'ERROR: exact-head rehearsal run was not discoverable.'; exit 1; }
          echo "Fresh exact-head rehearsal: ${rehearsal_id}."
          wait_for_run "${rehearsal_id}" Rehearsal

          # Re-read main after the multi-minute rehearsal. A newer merge must
          # force a fresh rehearsal instead of deploying a no-longer-exact head.
          exact_main
          rollout_after="$(date -u +%s)"
          gh workflow run "${ROLLOUT_WORKFLOW}" \
            --repo "${GITHUB_REPOSITORY}" \
            --ref main \
            -f project_ref="${EXPECTED_PROJECT_REF}" \
            -f confirmation=APPLY-PRODUCTION-189-TO-190 \
            -f backup_run_id="${BACKUP_RUN_ID}" \
            -f rehearsal_run_id="${rehearsal_id}"

          rollout_id=''
          for _ in $(seq 1 30); do
            rollout_id="$(find_exact_run "${ROLLOUT_WORKFLOW}" "${rollout_after}" || true)"
            [ -n "${rollout_id}" ] && break
            sleep 2
          done
          [ -n "${rollout_id}" ] || { echo 'ERROR: exact-head Production rollout run was not discoverable.'; exit 1; }
          echo "Guarded Production rollout: ${rollout_id}."
          wait_for_run "${rollout_id}" Rollout

          {
            echo '## Contract 190 Production dispatch completed'
            echo
            echo "- Exact main: \`${GITHUB_SHA}\`"
            echo "- Backup authority: \`${BACKUP_RUN_ID}\`"
            echo "- Fresh rehearsal: \`${rehearsal_id}\`"
            echo "- Guarded rollout: \`${rollout_id}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
