name: Cloud conductor smoke

on:
  pull_request:
    paths:
      - 'opencode.json'
      - '.opencode/**'
      - 'scripts/agent-tools/cloud-conductor-*.sh'
      - 'scripts/agent-tools/ox-review.sh'
      - 'scripts/agent-tools/claude-review.sh'
      - 'scripts/agent-tools/configure-claude-settings.mjs'
      - 'scripts/agent-tools/merge-cloud-env.mjs'
      - 'scripts/agent-tools/mcp-readiness.sh'
      - 'scripts/agent-tools/netlify-mcp-fallback.sh'
      - 'scripts/agent-tools/owner-task-push.sh'
      - 'scripts/agent-tools/owner-pr.sh'
      - 'docs/ops/persistent-cloud-conductor.md'
      - 'tests/scripts/cloudConductorConfiguration.test.ts'
      - 'tests/scripts/ownerModePermissions.test.ts'
      - 'config/agent-tools.json'
      - '.github/workflows/cloud-conductor-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'opencode.json'
      - '.opencode/**'
      - 'scripts/agent-tools/cloud-conductor-*.sh'
      - 'scripts/agent-tools/ox-review.sh'
      - 'scripts/agent-tools/claude-review.sh'
      - 'scripts/agent-tools/configure-claude-settings.mjs'
      - 'scripts/agent-tools/merge-cloud-env.mjs'
      - 'scripts/agent-tools/mcp-readiness.sh'
      - 'scripts/agent-tools/netlify-mcp-fallback.sh'
      - 'scripts/agent-tools/owner-task-push.sh'
      - 'scripts/agent-tools/owner-pr.sh'
      - 'docs/ops/persistent-cloud-conductor.md'
      - 'tests/scripts/cloudConductorConfiguration.test.ts'
      - 'tests/scripts/ownerModePermissions.test.ts'
      - 'config/agent-tools.json'
      - '.github/workflows/cloud-conductor-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Validate private cloud Conductor
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Harden runner (audit egress)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Read repository Node version
        id: versions
        shell: bash
        run: |
          set -euo pipefail
          echo "node=$(node -p "require('./package.json').engines.node")" >> "${GITHUB_OUTPUT}"

      - name: Set up repository Node version
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.versions.outputs.node }}
          package-manager-cache: false

      - name: Validate shell and repository guards
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/agent-tools/cloud-conductor-install.sh
          bash -n scripts/agent-tools/cloud-conductor-doctor.sh
          bash -n scripts/agent-tools/cloud-conductor-claude-install.sh
          bash -n scripts/agent-tools/ox-review.sh
          bash -n scripts/agent-tools/claude-review.sh
          bash -n scripts/agent-tools/owner-task-push.sh
          bash -n scripts/agent-tools/owner-pr.sh
          node -e "const c=require('./opencode.json'); if (c.default_agent !== 'predictor-conductor') process.exit(1)"
          npm ci
          npx vitest run tests/scripts/cloudConductorConfiguration.test.ts

      - name: Validate OpenCode loads all tracked agents
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./config/agent-tools.json').opencode.version")"
          npm install --global --prefix "${HOME}/.local" --no-fund --no-audit "opencode-ai@${version}"
          export PATH="${HOME}/.local/bin:${PATH}"
          opencode --version
          opencode debug config >/dev/null
          for agent in predictor-conductor predictor-builder predictor-critic predictor-visual-qa predictor-release-verifier; do
            opencode debug agent "$agent" >/dev/null
          done
          npx vitest run tests/scripts/ownerModePermissions.test.ts
          bash scripts/agent-tools/mcp-readiness.sh --config-only
          agents="$(opencode agent list)"
          printf '%s\n' "$agents"
          grep -q 'predictor-conductor' <<<"$agents"
          grep -q 'predictor-builder' <<<"$agents"
          grep -q 'predictor-critic' <<<"$agents"
          grep -q 'predictor-visual-qa' <<<"$agents"
          grep -q 'predictor-release-verifier' <<<"$agents"

      - name: Summary
        if: ${{ always() }}
        shell: bash
        run: |
          {
            echo '## Persistent cloud Conductor smoke'
            echo
            echo '- Cloud installer/doctor shell syntax validated for Ubuntu x86-64/ARM64 hosts.'
            echo '- Repository guard tests passed and predictor-conductor is the default web agent.'
            echo '- The centrally pinned OpenCode CLI loaded all five tracked agent definitions.'
            echo '- GPT lanes target the direct OpenAI provider rather than paid OpenRouter GPT.'
            echo '- The Ox critic is primary/read-only so the direct review bridge can capture its response reliably.'
            echo '- Claude remains an optional official-client subscription lane; CI installs/calls neither Claude nor a model.'
            echo '- Visual QA and release verification are read-only bounded subagents.'
            echo '- No provider credential is present in CI and no model request is made by this workflow.'
            echo '- No VM, Tailscale device, hosted environment or Production resource was mutated.'
          } >> "${GITHUB_STEP_SUMMARY}"
