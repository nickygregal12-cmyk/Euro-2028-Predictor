name: Reconcile auth recovery documentation

on:
  push:
    branches:
      - agent/add-auth-recovery-e2e

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/add-auth-recovery-e2e

      - name: Apply fail-closed documentation reconciliation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one occurrence, found {count}: {old!r}')
              file.write_text(text.replace(old, new), encoding='utf-8')

          replace_once(
              'README.md',
              'Browser E2E remains absent and is still a launch blocker.',
              'A dedicated Browser E2E gate rebuilds disposable local Supabase and runs authenticated desktop/mobile journeys for score persistence and protected clearing, submission settlement and conflicts, atomic bracket conflicts, post-lock rejection, signup confirmation and password recovery. Invitation/join, administrator and production smoke journeys remain open.',
          )

          current_status = 'docs/quality/current-status.md'
          replace_once(
              current_status,
              '| Feature-baseline identifiers | [`2026-07-24-feature-baseline-identifiers.md`](reconciliations/2026-07-24-feature-baseline-identifiers.md) |\n| Production baseline proof |',
              '| Feature-baseline identifiers | [`2026-07-24-feature-baseline-identifiers.md`](reconciliations/2026-07-24-feature-baseline-identifiers.md) |\n| Authenticated browser E2E | [`2026-07-24-auth-recovery-browser-e2e.md`](reconciliations/2026-07-24-auth-recovery-browser-e2e.md) |\n| Production baseline proof |',
          )
          replace_once(
              current_status,
              '| Current repository release-control baseline | `2bfe5d6b06519cf26929ba49a57b5a5861644e14` — PR #50 restored stable feature-baseline identifiers after final head CI run 217 passed |',
              '| Current repository release-control baseline | `8657ad9f9d015b08e2349fda4127b992d2024fa4` — PR #59 updated the current rollout guards after PR #58 repaired migration 31 for existing submissions and moved the app to React Router 8.3.0; production remains contract 20 |',
          )
          replace_once(
              current_status,
              '## Quality-governance position',
              '''## Authenticated browser E2E position\n\nThe repository now has a dedicated Playwright/Chromium gate against disposable local Supabase. Merged batches #53–#56 cover authenticated desktop/mobile route access, score save/reload/protected clear/reload, pending/failing/conflicted submission writes, two-device atomic bracket conflicts and recovery, and authoritative post-lock rejection. PR #61 adds public signup, local email confirmation, first-use welcome, ordinary sign-out/login, reset request, recovery-link handling, password replacement, old-password rejection and new-password login.\n\nPR #61 functional head `840c2e1982acb75f7a5446fe1fdad6f9f0a68f18` passed CI run `30125343793`, Database parity run `30125343795` and Browser E2E run `30125343872`. The browser run rebuilt all 35 migrations, passed every established authenticated journey and passed the new signup/recovery desktop lifecycle plus phone-width auth smoke.\n\nThis remains repository/disposable-development evidence only. It does not prove production compatibility, real SMTP/Turnstile configuration, private-league invitation joining or browser result administration.\n\n## Quality-governance position''',
          )
          replace_once(
              current_status,
              '| Real scored competition | **Not ready.** Production integrity controls and authenticated browser E2E remain incomplete. |',
              '| Real scored competition | **Not ready.** Repository browser E2E now covers the critical Original Predictor and authentication journeys, but production integrity controls, hosted smoke verification, invitations, administrator journeys, monitoring and recovery proof remain incomplete. |',
          )
          replace_once(
              current_status,
              '| Test assurance | No Playwright or equivalent authenticated browser E2E suite. Database parity now covers migrations, rollout SQL, the deployment contract and its trigger regression test. |',
              '| Test assurance | Dedicated disposable-local-Supabase Playwright coverage now includes authenticated routes, score persistence/clearing, submission barriers, bracket conflicts, lock rejection, signup confirmation and password recovery. Private-league invitation/join, result administration, browser accessibility and production smoke journeys remain open. |',
          )
          replace_once(
              current_status,
              '- 36 predictions: `8d76619fe4b44fdac17de1cc2afe5aaa`;',
              '- 36 predictions: `320cf25d62767dee307d3602212909af`;',
          )

          build_todo = 'docs/build-todo.md'
          replace_once(
              build_todo,
              '- [ ] Add the journey to Playwright/equivalent and close `REL-003`.',
              '- [x] Add immediate-final-edit, terminal failure and real conflict journeys to Playwright.\n- [ ] Close `REL-003` after compatible-production smoke evidence.',
          )
          replace_once(
              build_todo,
              '- [ ] Add the journey to Playwright/equivalent and close `DATA-005`.',
              '- [x] Add clear/reload, stale conflict and post-lock refusal journeys to Playwright.\n- [ ] Close `DATA-005` after migrations 21–35 and compatible-production smoke evidence.',
          )
          replace_once(
              build_todo,
              '''- [ ] Add Playwright or equivalent.\n- [ ] Cover auth/recovery, welcome, full entry, ties, bracket, submission settlement and score clearing.\n- [ ] Cover conflict resolution, leagues and result administration.\n- [ ] Run mobile, keyboard and accessibility journeys.\n- [ ] Make critical E2E a required merge/release gate.\n- [ ] Confirm branch protection and required checks.''',
              '''- [x] Add a dedicated Playwright/Chromium gate against disposable local Supabase.\n- [x] Cover signup confirmation, password recovery, welcome, full entry, ties, bracket, submission settlement and score clearing.\n- [x] Cover score and atomic-bracket conflict resolution plus post-lock rejection.\n- [ ] Cover private-league invitation/join and result administration.\n- [x] Run authenticated and signed-out phone-width journeys.\n- [ ] Add keyboard and browser accessibility journeys.\n- [x] Run Browser E2E as a dedicated pull-request workflow for relevant paths.\n- [ ] Confirm branch protection and required-check enforcement.''',
          )

          risk_register = 'docs/quality/risk-register.md'
          replace_once(
              risk_register,
              '**Feature-baseline identifiers:** [`reconciliations/2026-07-24-feature-baseline-identifiers.md`](reconciliations/2026-07-24-feature-baseline-identifiers.md)',
              '**Feature-baseline identifiers:** [`reconciliations/2026-07-24-feature-baseline-identifiers.md`](reconciliations/2026-07-24-feature-baseline-identifiers.md)  \n**Authenticated browser E2E:** [`reconciliations/2026-07-24-auth-recovery-browser-e2e.md`](reconciliations/2026-07-24-auth-recovery-browser-e2e.md)',
          )
          replace_once(
              risk_register,
              '| `TEST-001` | Critical database/browser rules lack executable integration assurance | **Partially resolved** | Disposable database CI, pgTAP and provider-level submission/score-clear tests exist; authenticated production-like browser E2E remains absent. |',
              '| `TEST-001` | Critical database/browser rules lack executable integration assurance | **Partially resolved — substantial disposable browser coverage** | A dedicated Playwright gate now proves authenticated routes, score save/clear/reload, submission settlement/failure/conflict, two-device atomic bracket recovery, post-lock rejection, signup confirmation, first-use welcome and password recovery against disposable local Supabase. Private-league invite/join, result administration, browser accessibility and production smoke evidence remain open. |',
          )

          reconciliation = Path('docs/quality/reconciliations/2026-07-24-auth-recovery-browser-e2e.md')
          reconciliation.write_text('''# Authentication recovery browser E2E\n\n**Date:** 24 July 2026  \n**Issue:** #52  \n**Pull request:** #61  \n**Branch:** `agent/add-auth-recovery-e2e`  \n**Finding:** `TEST-001`  \n**Status:** Repository/disposable-development browser evidence complete; hosted and remaining-journey evidence open\n\n## Purpose\n\nExtend the existing authenticated Browser E2E gate through the public account lifecycle without using hosted Supabase, real SMTP, production data or Netlify configuration.\n\n## Permanent implementation\n\n- a separate Playwright configuration runs on loopback port 4174 with development auto-login explicitly disabled;\n- local Supabase requires confirmation email and allows only the two loopback E2E application origins;\n- the workflow exports the local Mailpit URL and runs the original authenticated suite before the isolated auth suite;\n- a guarded Mailpit helper refuses non-HTTP, non-loopback or non-54324 targets, reads stored messages through the v1 API and filters the exact recipient address;\n- the desktop lifecycle covers signup, confirmation email, first-use welcome, sign-out, password login, reset request, recovery email, password replacement, old-password rejection and new-password login;\n- the mobile project covers the signed-out login, signup and reset surfaces;\n- executable repository tests protect the local-only target, separate auto-login policy, local confirmation configuration and expected lifecycle assertions.\n\n## Validation evidence\n\nFunctional head `840c2e1982acb75f7a5446fe1fdad6f9f0a68f18` passed:\n\n- **CI run 30125343793:** install, Git-less environment proof, guarded build, lint, complete Vitest suite and production dependency audit;\n- **Database parity run 30125343795:** disposable Supabase startup, all 35 migrations, database lint, every pgTAP suite and TypeScript/PostgreSQL parity;\n- **Browser E2E run 30125343872:** migrations/seed rebuild, local environment export, every established authenticated journey, complete signup/recovery lifecycle, phone-width auth smoke, diagnostics upload and no-backup teardown.\n\n## Defects exposed while building the gate\n\n1. The auth-only Playwright command originally repeated the existing account global setup. The isolated auth suite now creates only its own account and tournament prerequisite.\n2. Mailpit stored recipients use the `Address` field rather than the send API's `Email` field. The helper now matches the stored schema while retaining an `Email` fallback.\n3. Password labels also label their show/hide buttons. Tests now use exact textbox-role locators.\n4. Success panels use accessible `status` semantics rather than error `alert` semantics. Assertions now match the rendered contract.\n\n## Evidence boundary\n\nThis batch materially improves `TEST-001`; it does not close it. Remaining work includes private-league invitation/join, result administration, keyboard/browser accessibility and compatible-production smoke journeys. Production remains at database contract 20 and blocked by recovery evidence.\n\nNo hosted database, migration, deployment-contract value, scoring rule, real email service or production data was changed.\n''', encoding='utf-8')
          PY

      - name: Commit reconciled documentation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md docs/build-todo.md docs/quality/current-status.md docs/quality/risk-register.md docs/quality/reconciliations/2026-07-24-auth-recovery-browser-e2e.md
          git commit -m 'Reconcile authenticated browser E2E status'
          git push origin HEAD:agent/add-auth-recovery-e2e
