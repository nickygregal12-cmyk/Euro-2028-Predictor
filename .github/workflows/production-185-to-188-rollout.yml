name: Production 185 to 188 rollout

# One-shot guarded promotion of the Production contract boundary 185 -> 188.
#
# The owner authorised this Production migration on 13 August 2026, asking for
# Production to be taken from 185 to 188 so that contract 188's identity repair
# can be run against the corrupted forecasts Production generated that morning.
# That authorisation is what this file records; it is not a licence the workflow
# grants itself, and it does not extend to any other boundary.
#
# WHY THREE AT ONCE IS DEFENSIBLE: every one of contracts 186, 187 and 188 is
# ADDITIVE, so `check-migration-additive.mjs` runs here as a GATE rather than as
# the report the destructive 157 -> 158 promotion needed. If a future reader
# finds it softened, the boundary has changed and this file no longer describes
# it.
#
# THE DRY RUN ASSERTS EXACTLY THE THREE FILES BY NAME. "At least the ones I
# expected" would pass while promoting something nobody approved. A parallel AI
# Lab session has been asked not to merge a fourth migration while this boundary
# is in progress; being asked is not a control, so a fourth file fails the
# preflight rather than silently widening what Production receives.
#
# CONTRACT 187 IS THE ONE REDEFINITION WORTH NAMING. It generalises the
# Championship qualification gate IN PLACE rather than adding beside it, so the
# tournament's unchanged behaviour is a property this rollout PROVES rather than
# assumes: every tournament Championship must still resolve a group-stage span
# of exactly 3, and contract 169's tournament group table must still carry its
# `between 1 and 3` bound.
#
# WHAT THIS DOES NOT DO:
#
#   * it runs NO identity repair. Contract 188 installs
#     `ai.repair_provider_identity` and the quarantine authority; calling them is
#     a separate, operator-driven step, and the postflight proves both ledgers
#     are still empty afterwards. A migration that repaired on arrival would
#     make the repair unauditable;
#   * it makes ZERO provider calls. `ai.api_budget.collection_enabled` is
#     required to be `false` before the apply and asserted still `false` after,
#     and `ai.api_usage` must not move. Paid collection stays disabled through
#     the whole promotion;
#   * it changes NO cron schedule. The four `ai-odds-*` jobs are asserted
#     present and the total job count unchanged;
#   * it publishes no Euro 2028, launches no competition, draws no Championship,
#     imports no football and promotes no application.
#
# Remove this one-shot workflow after the hosted contract/evidence record has
# been reconciled.

on:
  workflow_dispatch:
    inputs:
      project_ref:
        description: Exact Production project ref confirmation
        required: true
      confirmation:
        description: Type APPLY-PRODUCTION-185-TO-188 to proceed
        required: true
      backup_run_id:
        description: Run id of the successful FRESH Production backup
        required: true
      rehearsal_run_id:
        description: Run id of the successful 185-to-188 rehearsal
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: production-migration-rollout
  cancel-in-progress: false

env:
  EXPECTED_PROJECT_REF: vkfnsqdyhvtwyqkisxhk
  FORBIDDEN_DEVELOPMENT_REF: iouzoutneyjpugbbtdem
  CONFIRMATION_PHRASE: APPLY-PRODUCTION-185-TO-188
  SOURCE_CONTRACT: '185'
  SOURCE_VERSION: '20260812070000'
  SOURCE_NAME: ai_lab_operational_loop
  TARGET_CONTRACT: '188'
  TARGET_VERSION: '20260813100000'
  TARGET_NAME: ai_lab_multi_model_evidence
  WORK_DIR: /tmp/production-185-to-188

jobs:
  rollout:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Refuse an unsafe dispatch or repository state
        env:
          INPUT_PROJECT_REF: ${{ inputs.project_ref }}
          INPUT_CONFIRMATION: ${{ inputs.confirmation }}
        shell: bash
        run: |
          set -euo pipefail
          [ "${INPUT_CONFIRMATION}" = "${CONFIRMATION_PHRASE}" ] || {
            echo "ERROR: confirmation phrase does not match ${CONFIRMATION_PHRASE}."
            exit 1
          }
          if [ "${INPUT_PROJECT_REF}" = "${FORBIDDEN_DEVELOPMENT_REF}" ]; then
            echo 'ERROR: that is the Development project.'
            exit 1
          fi
          [ "${INPUT_PROJECT_REF}" = "${EXPECTED_PROJECT_REF}" ] || {
            echo 'ERROR: project ref confirmation does not name the Production project.'
            exit 1
          }
          [ "${GITHUB_REF}" = 'refs/heads/main' ] || {
            echo 'ERROR: Production rollout runs only from refs/heads/main.'
            exit 1
          }
          git fetch --no-tags origin main
          [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" ] || {
            echo 'ERROR: checked-out HEAD is not exact origin/main.'
            exit 1
          }
          [ -z "$(git status --porcelain=v1 --untracked-files=all)" ] || {
            echo 'ERROR: checkout is not clean.'
            exit 1
          }
          mkdir -p "${WORK_DIR}"

      - name: Prove a successful backup and rehearsal exist
        env:
          GH_TOKEN: ${{ github.token }}
          BACKUP_RUN_ID: ${{ inputs.backup_run_id }}
          REHEARSAL_RUN_ID: ${{ inputs.rehearsal_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          # Checked against the API rather than asserted by whoever dispatched
          # this. "Take a backup first" is a rule that survives exactly as long
          # as the person in a hurry remembers it; every other guard here is
          # mechanical, so these two are as well.
          check_run() {
            local run_id="$1" want_workflow="$2" label="$3"
            local json conclusion path head_sha
            json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}")"
            conclusion="$(printf '%s' "${json}" | jq -r '.conclusion')"
            path="$(printf '%s' "${json}" | jq -r '.path')"
            head_sha="$(printf '%s' "${json}" | jq -r '.head_sha')"
            [ "${conclusion}" = 'success' ] || {
              echo "ERROR: ${label} run ${run_id} concluded '${conclusion}', not success."
              exit 1
            }
            [ "${path}" = "${want_workflow}" ] || {
              echo "ERROR: ${label} run ${run_id} is ${path}, not ${want_workflow}."
              exit 1
            }
            echo "${label} run ${run_id} verified: success, ${path}, head ${head_sha}."
          }
          check_run "${BACKUP_RUN_ID}" \
            '.github/workflows/production-backup.yml' 'Backup'
          check_run "${REHEARSAL_RUN_ID}" \
            '.github/workflows/production-185-to-188-rehearsal.yml' 'Rehearsal'

          # The rehearsal must have been run against THIS boundary's code. A
          # rehearsal of an earlier head proves nothing about what is about to
          # be applied.
          rehearsal_sha="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${REHEARSAL_RUN_ID}" --jq '.head_sha')"
          [ "${rehearsal_sha}" = "$(git rev-parse HEAD)" ] || {
            echo "ERROR: rehearsal ran at ${rehearsal_sha}, but this rollout is at $(git rev-parse HEAD)."
            echo 'Re-rehearse at the exact head being promoted.'
            exit 1
          }
          echo 'The rehearsal ran at exactly the head being promoted.'

          # And the backup must PRECEDE the rehearsal. A backup taken after the
          # rehearsal is not the state this promotion would be rolled back to,
          # and the ordering is the whole point of requiring both.
          backup_at="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${BACKUP_RUN_ID}" --jq '.created_at')"
          rehearsal_at="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${REHEARSAL_RUN_ID}" --jq '.created_at')"
          [ "${backup_at}" \< "${rehearsal_at}" ] || {
            echo "ERROR: backup ${backup_at} does not precede rehearsal ${rehearsal_at}."
            exit 1
          }
          echo "Sequence verified: backup ${backup_at} -> rehearsal ${rehearsal_at} -> this rollout."

      - name: Prove the repository still holds exactly the approved contract 188
        shell: bash
        run: |
          set -euo pipefail
          committed="$(git ls-files 'supabase/migrations/*.sql' | wc -l | tr -d ' ')"
          [ "${committed}" = "${TARGET_CONTRACT}" ] || {
            echo "ERROR: repository holds ${committed} migrations, expected ${TARGET_CONTRACT}."
            echo 'If a fourth migration has landed on main, the approved boundary has moved.'
            echo 'STOP: do not extend the Production boundary silently.'
            exit 1
          }
          declared="$(node -p "require('./config/deployment-contract.json').requiredMigrationCount")"
          [ "${declared}" = "${TARGET_CONTRACT}" ] || {
            echo "ERROR: deployment contract declares ${declared}, expected ${TARGET_CONTRACT}."
            exit 1
          }
          newest="$(git ls-files 'supabase/migrations/*.sql' | sort | tail -1)"
          [ "$(basename "${newest}")" = "${TARGET_VERSION}_${TARGET_NAME}.sql" ] || {
            echo "ERROR: newest migration is $(basename "${newest}"), expected ${TARGET_VERSION}_${TARGET_NAME}.sql."
            exit 1
          }
          echo "Repository is exactly contract ${TARGET_CONTRACT}."

      - name: Prove every migration in the range is additive, as a GATE
        shell: bash
        run: |
          set -euo pipefail
          # A GATE. The destructive 157 -> 158 rollout had to run this as a
          # REPORT because the checker would have refused it; this range is
          # additive throughout. A future reader finding this softened back to
          # a report should stop: the boundary has changed.
          files=''
          for file in $(git ls-files 'supabase/migrations/*.sql' | sort); do
            version="$(basename "${file}")"
            version="${version:0:14}"
            if [[ "${version}" > "${SOURCE_VERSION}" && ! "${version}" > "${TARGET_VERSION}" ]]; then
              files="${files} ${file}"
            fi
          done
          # Declared, not rewritten: the migration list is split on purpose; quoting passes one argument, not many. This is a spent one-shot promotion
          # script; changing what it DOES to satisfy a style rule would edit the
          # record of a past production apply. shellcheck only began seeing it
          # when SHA-pinning marked the file changed, so it is pre-existing.
          # shellcheck disable=SC2086
          count="$(printf '%s\n' ${files} | grep -c . || true)"
          [ "${count}" = "3" ] || {
            echo "ERROR: the range holds ${count} migrations, expected 3."
            # Declared, not rewritten: the migration list is split on purpose; quoting passes one argument, not many. This is a spent one-shot promotion
            # script; changing what it DOES to satisfy a style rule would edit the
            # record of a past production apply. shellcheck only began seeing it
            # when SHA-pinning marked the file changed, so it is pre-existing.
            # shellcheck disable=SC2086
            printf '%s\n' ${files}
            exit 1
          }
          echo 'The three migrations being promoted:'
          # Declared, not rewritten: the migration list is split on purpose; quoting passes one argument, not many. This is a spent one-shot promotion
          # script; changing what it DOES to satisfy a style rule would edit the
          # record of a past production apply. shellcheck only began seeing it
          # when SHA-pinning marked the file changed, so it is pre-existing.
          # shellcheck disable=SC2086
          printf '  %s\n' ${files}
          # Declared, not rewritten: the migration list is split on purpose; quoting passes one argument, not many. This is a spent one-shot promotion
          # script; changing what it DOES to satisfy a style rule would edit the
          # record of a past production apply. shellcheck only began seeing it
          # when SHA-pinning marked the file changed, so it is pre-existing.
          # shellcheck disable=SC2086
          node scripts/check-migration-additive.mjs ${files}
          echo 'All three are additive.'

      # Pinned to the same versions every proven pair has used. Both files in
      # the 172 -> 174 pair originally omitted them and the rehearsal died on
      # `supabase: command not found`; the PostgreSQL 17 client is here because
      # Ubuntu's default 16 `pg_dump` refuses against a 17.x server.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.22.2

      - uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf
        with:
          version: 2.109.1
          github-token: ${{ github.token }}

      - name: Install PostgreSQL 17 client tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17

      - name: Preflight the Production secret without printing it
        env:
          SUPABASE_PROD_DB_URL: ${{ secrets.SUPABASE_PROD_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${SUPABASE_PROD_DB_URL}" ] || {
            echo 'ERROR: repository secret SUPABASE_PROD_DB_URL is not set.'
            exit 1
          }
          case "${SUPABASE_PROD_DB_URL}" in
            *"${FORBIDDEN_DEVELOPMENT_REF}"*)
              echo 'ERROR: Production secret resolves to Development.'
              exit 1
              ;;
            *"${EXPECTED_PROJECT_REF}"*) ;;
            *)
              echo 'ERROR: Production secret does not name the expected Production project.'
              exit 1
              ;;
          esac

      - name: Capture the exact pre-apply Production state
        env:
          SUPABASE_PROD_DB_URL: ${{ secrets.SUPABASE_PROD_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          # Every relation read here exists at contract 185. A pre-apply probe
          # that reads a post-apply column is how the 151-to-157 rehearsal
          # failed on run 31445831137, and the fix was to stop asking early
          # rather than to relax the check.
          psql "${SUPABASE_PROD_DB_URL}" -X -q -v ON_ERROR_STOP=1 -A -t \
            -f - > "${WORK_DIR}/before.json" <<'VERIFY_SQL'
            select json_build_object(
              'migration_count', (select count(*) from supabase_migrations.schema_migrations),
              'latest_version', (select version from supabase_migrations.schema_migrations order by version desc limit 1),
              'latest_name', (select name from supabase_migrations.schema_migrations order by version desc limit 1),
              'auth_users', (select count(*) from auth.users),
              'profiles', (select count(*) from public.profiles),
              'tournaments', (select count(*) from public.tournaments),
              'teams', (select count(*) from public.teams),
              'matches', (select count(*) from public.matches),
              'entries', (select count(*) from public.entries),
              'match_predictions', (select count(*) from public.match_predictions),
              'leagues', (select count(*) from public.leagues),
              'league_members', (select count(*) from public.league_members),
              'score_events', (select count(*) from public.score_events),
              'entry_totals', (select count(*) from public.entry_totals),
              'game_memberships', (select count(*) from public.game_memberships),
              'bonus_competitions', (select count(*) from public.bonus_competitions),
              'season_fixtures', (select count(*) from public.season_fixtures),
              'season_predictions', (select count(*) from public.season_predictions),
              'player_action_items', (select count(*) from public.player_action_items),
              'reminder_deliveries', (select count(*) from public.reminder_deliveries),
              'ai_raw_matches', (select count(*) from ai.raw_matches),
              'ai_odds_api_events', (select count(*) from ai.odds_api_events),
              'ai_predictions', (select count(*) from ai.predictions),
              'ai_market_prices', (select count(*) from ai.market_prices),
              'ai_fixture_odds', (select count(*) from ai.fixture_odds),
              'ai_bets', (select count(*) from ai.bets),
              'ai_api_usage', (select count(*) from ai.api_usage),
              'ai_collection_enabled', (select collection_enabled from ai.api_budget limit 1),
              'ai_odds_cron_jobs', (select count(*) from cron.job where jobname like 'ai-odds%'),
              'cron_jobs', (select case when to_regclass('cron.job') is null then -1
                                        else (select count(*) from cron.job) end),
              'euro_state', (select state from public.euro_publication_state())
            )
          VERIFY_SQL
          cat "${WORK_DIR}/before.json"

          BEFORE_FILE="${WORK_DIR}/before.json" node --input-type=module <<'NODE'
          import fs from 'node:fs'
          const before = JSON.parse(fs.readFileSync(process.env.BEFORE_FILE, 'utf8'))
          const expected = {
            migration_count: Number(process.env.SOURCE_CONTRACT),
            latest_version: process.env.SOURCE_VERSION,
            latest_name: process.env.SOURCE_NAME,
          }
          for (const [key, want] of Object.entries(expected)) {
            if (String(before[key]) !== String(want)) {
              console.error(`ERROR: live Production ${key} is ${before[key]}, expected ${want}.`)
              console.error('Production is not the boundary this rollout was rehearsed against.')
              process.exit(1)
            }
          }
          // Paid collection is deliberately disabled while the identity
          // pipeline is known corrupt, and must stay disabled through the whole
          // promotion. Refusing here rather than merely asserting afterwards.
          if (![false, 'f', 'false'].includes(before.ai_collection_enabled)) {
            console.error(`ERROR: ai.api_budget.collection_enabled is ${before.ai_collection_enabled}; it must be disabled before this rollout runs.`)
            process.exit(1)
          }
          console.log('Live Production is exactly the rehearsed contract-185 source boundary.')
          console.log(`Paid collection is disabled. ${before.ai_odds_cron_jobs} ai-odds job(s) scheduled, ${before.cron_jobs} in total.`)
          NODE

      - name: Dry run, and refuse anything that is not exactly contracts 186 to 188
        env:
          SUPABASE_PROD_DB_URL: ${{ secrets.SUPABASE_PROD_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          # Anything ABOVE the pinned target is held back, so the dry run
          # describes what will actually be applied. Restored by the step after
          # the apply, whatever happens.
          mkdir -p "${WORK_DIR}/later-migrations"
          : > "${WORK_DIR}/moved-files.txt"
          for file in $(git ls-files 'supabase/migrations/*.sql' | sort); do
            filename="$(basename "${file}")"
            version="${filename:0:14}"
            if [[ "${version}" > "${TARGET_VERSION}" ]]; then
              mv "${file}" "${WORK_DIR}/later-migrations/${filename}"
              printf '%s\n' "${file}" >> "${WORK_DIR}/moved-files.txt"
            fi
          done
          if [ -s "${WORK_DIR}/moved-files.txt" ]; then
            echo 'Held back as ABOVE the pinned target:'
            cat "${WORK_DIR}/moved-files.txt"
          fi

          supabase migration list --db-url "${SUPABASE_PROD_DB_URL}" \
            | tail -20
          supabase db push --db-url "${SUPABASE_PROD_DB_URL}" --dry-run \
            > "${WORK_DIR}/dry-run.txt" 2>&1
          cat "${WORK_DIR}/dry-run.txt"

          grep -oE '[0-9]{14}_[A-Za-z0-9_-]+\.sql' "${WORK_DIR}/dry-run.txt" \
            | awk '!seen[$0]++' | sort > "${WORK_DIR}/pending.txt"

          printf '%s\n' \
            '20260812080000_cup_group_stage_span.sql' \
            '20260812090000_season_cup_qualification_driver.sql' \
            '20260813100000_ai_lab_multi_model_evidence.sql' \
            > "${WORK_DIR}/expected.txt"
          sort -o "${WORK_DIR}/expected.txt" "${WORK_DIR}/expected.txt"

          if ! diff -u "${WORK_DIR}/expected.txt" "${WORK_DIR}/pending.txt"; then
            echo 'ERROR: the Production dry run is not exactly contracts 186 to 188.'
            exit 1
          fi
          echo 'Dry run is exactly the three approved migrations.'

      - name: Apply exactly contracts 186 to 188
        env:
          SUPABASE_PROD_DB_URL: ${{ secrets.SUPABASE_PROD_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          supabase db push --db-url "${SUPABASE_PROD_DB_URL}" \
            2>&1 | tee "${WORK_DIR}/apply.txt"

      - name: Restore the repository migration tree in the runner
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          # Runs even when the apply failed. The verification below reads the
          # database rather than the tree.
          if [ -f "${WORK_DIR}/moved-files.txt" ]; then
            while IFS= read -r file; do
              [ -n "${file}" ] || continue
              filename="$(basename "${file}")"
              if [ -e "${WORK_DIR}/later-migrations/${filename}" ]; then
                mv "${WORK_DIR}/later-migrations/${filename}" "${file}"
              fi
            done < "${WORK_DIR}/moved-files.txt"
          fi

      - name: Verify exact contract-188 Production state and that nothing was lost
        env:
          SUPABASE_PROD_DB_URL: ${{ secrets.SUPABASE_PROD_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          # NAMED ROWS, not a count. On 11 August 2026 a `select count(*)` against
          # a hosted ledger returned a stale value for twenty-five minutes after an
          # apply had succeeded, while a row-level query on the same table in the
          # same session returned the truth immediately. A count is the shape that
          # looks most like proof and is the one that went stale.
          psql "${SUPABASE_PROD_DB_URL}" -X -q -v ON_ERROR_STOP=1 -A -t \
            -f - > "${WORK_DIR}/after.json" <<'VERIFY_SQL'
            -- Split across several jsonb_build_object calls and concatenated:
            -- PostgreSQL refuses more than 100 arguments to one function, and
            -- 75 keys is 150. Rehearsal run 31730622906 died here.
            select (
              jsonb_build_object(
              'migration_count', (select count(*) from supabase_migrations.schema_migrations),
              'latest_version', (select version from supabase_migrations.schema_migrations order by version desc limit 1),
              'latest_name', (select name from supabase_migrations.schema_migrations order by version desc limit 1),
              'range_rows_present', (
                select count(*) from supabase_migrations.schema_migrations
                 where version in ('20260812080000','20260812090000','20260813100000')),

              -- ============================== CONTRACT 186 ==============================
              'launch_table', (
                select count(*) from pg_tables
                 where schemaname = 'public' and tablename = 'bonus_cup_launches'),
              'launch_rls', (
                select c.relrowsecurity from pg_class c join pg_namespace n on n.oid = c.relnamespace
                 where n.nspname = 'public' and c.relname = 'bonus_cup_launches'),
              'launch_browser_grants', (
                select count(*) from information_schema.role_table_grants
                 where table_schema = 'public' and table_name = 'bonus_cup_launches'
                   and grantee in ('anon','authenticated')),
              'launch_immutable_trigger', (
                select count(*) from pg_trigger t join pg_class c on c.oid = t.tgrelid
                 where c.relname = 'bonus_cup_launches'
                   and t.tgname = 'bonus_cup_launches_immutable' and not t.tgisinternal),
              'span_last_sequence_fn', (
                select count(*) from pg_proc p join pg_namespace n on n.oid = p.pronamespace
                 where n.nspname = 'predictor_internal'
                   and p.proname = 'cup_group_stage_last_sequence'),
              'launch_rows', (select count(*) from public.bonus_cup_launches),

              -- ============================== CONTRACT 187 ==============================
              'span_fn', (
                select count(*) from pg_proc p join pg_namespace n on n.oid = p.pronamespace
                 where n.nspname = 'predictor_internal' and p.proname = 'cup_group_stage_span'),
              'knockout_windows_fn', (
                select count(*) from pg_proc p join pg_namespace n on n.oid = p.pronamespace
                 where n.nspname = 'predictor_internal'
                   and p.proname = 'ensure_season_cup_knockout_windows'),
              'season_finalise_fn', (
                select count(*) from pg_proc p join pg_namespace n on n.oid = p.pronamespace
                 where n.nspname = 'public' and p.proname = 'admin_finalise_season_cup_groups'),
              'season_finalise_authenticated', (
                select count(*) from information_schema.role_routine_grants
                 where routine_schema = 'public' and routine_name = 'admin_finalise_season_cup_groups'
                   and grantee = 'authenticated'),
              'season_finalise_anon', (
                select count(*) from information_schema.role_routine_grants
                 where routine_schema = 'public' and routine_name = 'admin_finalise_season_cup_groups'
                   and grantee in ('anon','PUBLIC')),
              'internal_cup_fns_browser_reachable', (
                select count(*) from information_schema.role_routine_grants
                 where routine_schema = 'predictor_internal'
                   and routine_name in ('cup_group_stage_span','cup_group_stage_last_sequence',
                                        'ensure_season_cup_knockout_windows')
                   and grantee in ('anon','authenticated','PUBLIC')),
              -- THE TOURNAMENT IS UNCHANGED, and contract 187 generalises IN
              -- PLACE, so this is proven rather than assumed.
              'tournament_cup_competitions', (
                select count(*) from public.bonus_competitions bc
                 where not predictor_internal.cup_is_league_season(bc.id)),
              'tournament_span_not_three', (
                select count(*) from public.bonus_competitions bc
                 where not predictor_internal.cup_is_league_season(bc.id)
                   and predictor_internal.cup_group_stage_span(bc.id) <> 3),
              'tournament_group_table_still_bounded', (
                select pg_get_functiondef(p.oid) ~ 'between 1 and 3'
                  from pg_proc p join pg_namespace n on n.oid = p.pronamespace
                 where n.nspname = 'predictor_internal' and p.proname = 'cup_final_group_tables'),
              'season_span_refuses_without_launch', (
                select pg_get_functiondef(p.oid) ~ 'raise[[:space:]]+exception'
                  from pg_proc p join pg_namespace n on n.oid = p.pronamespace
                 where n.nspname = 'predictor_internal' and p.proname = 'cup_group_stage_span'),

              -- ============================== CONTRACT 188 ==============================
              'ai_team_aliases_rows', (select count(*) from ai.team_aliases),
              'ai_canonical_fn', (
                select count(*) from pg_proc p join pg_namespace n on n.oid = p.pronamespace
                 where n.nspname = 'ai' and p.proname = 'canonical_from_odds_api'),
              'ai_valid_predictions_view', (
                select count(*) from pg_views where schemaname = 'ai' and viewname = 'valid_predictions'),
              'ai_new_tables', (
                select count(*) from pg_tables where schemaname = 'ai'
                   and tablename in ('recommendations','prediction_invalidations','provider_identity_repairs')),
              'ai_new_tables_rls', (
                select count(*) from pg_class c join pg_namespace n on n.oid = c.relnamespace
                 where n.nspname = 'ai' and c.relrowsecurity
                   and c.relname in ('recommendations','prediction_invalidations','provider_identity_repairs')),
              'ai_new_tables_empty', (
                select (select count(*) from ai.recommendations)
                     + (select count(*) from ai.prediction_invalidations)
                     + (select count(*) from ai.provider_identity_repairs)),
              'ai_repair_fn', (
                select count(*) from pg_proc p join pg_namespace n on n.oid = p.pronamespace
                 where n.nspname = 'ai' and p.proname = 'repair_provider_identity'),
              'ai_reconcile_budget_fn', (
                select count(*) from pg_proc p join pg_namespace n on n.oid = p.pronamespace
                 where n.nspname = 'ai' and p.proname = 'reconcile_api_budget'),
              'ai_quarantine_fn', (
                select count(*) from pg_proc p join pg_namespace n on n.oid = p.pronamespace
                 where n.nspname = 'ai' and p.proname = 'quarantine_identity_defective_predictions'),
              'ai_privileged_fns_browser_reachable', (
                select count(*) from information_schema.role_routine_grants
                 where routine_schema = 'ai'
                   and routine_name in ('repair_provider_identity','reconcile_api_budget',
                                        'quarantine_identity_defective_predictions')
                   and grantee in ('anon','authenticated','PUBLIC')),
              'ai_browser_table_dml', (
                select count(*) from information_schema.role_table_grants
                 where table_schema = 'ai' and grantee in ('anon','authenticated')),
              'ai_model_provenance_columns', (
                select count(*) from information_schema.columns
                 where table_schema = 'ai' and table_name = 'models'
                   and column_name in ('training_matches','component_families','uses_market')),
              'ai_prediction_columns', (
                select count(*) from information_schema.columns
                 where table_schema = 'ai' and table_name = 'predictions'
                   and column_name in ('model_views','data_confidence')),
              'ai_prediction_results_diagnosis', (
                select count(*) from information_schema.columns
                 where table_schema = 'ai' and table_name = 'prediction_results'
                   and column_name = 'diagnosis'),
              'ai_budget_soft_cap_fraction', (
                select count(*) from information_schema.columns
                 where table_schema = 'ai' and table_name = 'api_budget'
                   and column_name = 'soft_cap_fraction'),
              'admin_ai_rpcs', (
                select count(*) from pg_proc p join pg_namespace n on n.oid = p.pronamespace
                 where n.nspname = 'public'
                   and p.proname in ('admin_ai_recommendation_log','admin_ai_prediction_audit',
                                     'admin_ai_bet_builder_books','admin_ai_bet_builder_candidates')),
              'admin_ai_rpcs_authenticated', (
                select count(*) from information_schema.role_routine_grants
                 where routine_schema = 'public'
                   and routine_name in ('admin_ai_recommendation_log','admin_ai_prediction_audit',
                                        'admin_ai_bet_builder_books','admin_ai_bet_builder_candidates')
                   and grantee = 'authenticated'),
              'admin_ai_rpcs_anon', (
                select count(*) from information_schema.role_routine_grants
                 where routine_schema = 'public'
                   and routine_name in ('admin_ai_recommendation_log','admin_ai_prediction_audit',
                                        'admin_ai_bet_builder_books','admin_ai_bet_builder_candidates')
                   and grantee in ('anon','PUBLIC')),
              -- TYPES ONLY, in order. `pg_get_function_identity_arguments`
              -- renders parameter NAMES on this server, so asserting against it
              -- would pass or fail on a rename that changes no call signature.
              -- This is the signature a caller actually has to match.
              'bet_builder_candidates_identity_args', (
                select array_to_string(array(
                         select format_type(t, null) from unnest(p.proargtypes) t), ', ')
                  from pg_proc p join pg_namespace n on n.oid = p.pronamespace
                 where n.nspname = 'public' and p.proname = 'admin_ai_bet_builder_candidates'),

              -- THE DEFECT CONTRACT 188 WAS REWRITTEN TO AVOID, read off the
              -- INSTALLED definition rather than the migration text.
              'snapshot_uses_temp_table', (
                select pg_get_functiondef(p.oid) ~* 'create\s+(temporary|temp)\s+table'
                  from pg_proc p join pg_namespace n on n.oid = p.pronamespace
                 where n.nspname = 'public' and p.proname = 'record_ai_odds_snapshot')
              ) ||
              jsonb_build_object(
              'temp_table_lint_violations', (
                select count(*) from pg_proc p
                  join pg_namespace n on n.oid = p.pronamespace
                  join pg_language l on l.oid = p.prolang
                 where n.nspname in ('public','predictor_internal')
                   and p.prokind = 'f' and l.lanname in ('plpgsql','sql')
                   and (pg_get_functiondef(p.oid) ilike '%pg_temp.%'
                     or pg_get_functiondef(p.oid) ilike '%create temporary table%')),
              'snapshot_rederives_identity', (
                select pg_get_functiondef(p.oid) ~ 'canonical_from_odds_api'
                  from pg_proc p join pg_namespace n on n.oid = p.pronamespace
                 where n.nspname = 'public' and p.proname = 'record_ai_odds_snapshot'),

              -- PARITY IS NOT CORRECTNESS: every canonical target must exist in
              -- the vocabulary `ai.raw_matches` actually uses.
              'alias_resolutions', (
                select jsonb_object_agg(probe.src, coalesce(r.canonical, '<unmatched>'))
                  from (values ('Leicester City'),('Norwich City'),('West Bromwich Albion'),
                               ('Swansea City'),('Blackburn Rovers'),('Sheffield Wednesday'),
                               ('Queens Park Rangers'),('Huddersfield Town'),('Wimbledon'),
                               ('Raith Rovers')) as probe(src)
                  cross join lateral ai.canonical_from_odds_api(probe.src) r),
              'alias_targets_absent_from_history', (
                select count(*) from (
                  select r.canonical from (values ('Leicester City'),('Norwich City'),
                    ('West Bromwich Albion'),('Swansea City'),('Blackburn Rovers'),
                    ('Sheffield Wednesday'),('Queens Park Rangers'),('Huddersfield Town'),
                    ('Wimbledon'),('Raith Rovers')) as probe(src)
                    cross join lateral ai.canonical_from_odds_api(probe.src) r) resolved
                 where resolved.canonical is null
                    or not exists (select 1 from ai.raw_matches m
                                    where m.home_canonical = resolved.canonical
                                       or m.away_canonical = resolved.canonical)),

              -- NOTHING RAN ITSELF. Installing the repair authority and calling
              -- it are separate decisions; the repair is an operator action.
              'ai_repairs_recorded', (select count(*) from ai.provider_identity_repairs),
              'ai_predictions_invalidated', (select count(*) from ai.prediction_invalidations),
              'ai_recommendations', (select count(*) from ai.recommendations),

              -- ZERO PROVIDER CALLS, and collection still disabled.
              'ai_collection_enabled', (select collection_enabled from ai.api_budget limit 1),
              'ai_api_usage', (select count(*) from ai.api_usage),
              'ai_odds_cron_jobs', (select count(*) from cron.job where jobname like 'ai-odds%'),

              'cron_jobs', (select case when to_regclass('cron.job') is null then -1
                                        else (select count(*) from cron.job) end),
              'euro_state', (select state from public.euro_publication_state()),

              'auth_users', (select count(*) from auth.users),
              'profiles', (select count(*) from public.profiles),
              'tournaments', (select count(*) from public.tournaments),
              'teams', (select count(*) from public.teams),
              'matches', (select count(*) from public.matches),
              'entries', (select count(*) from public.entries),
              'match_predictions', (select count(*) from public.match_predictions),
              'leagues', (select count(*) from public.leagues),
              'league_members', (select count(*) from public.league_members),
              'score_events', (select count(*) from public.score_events),
              'entry_totals', (select count(*) from public.entry_totals),
              'game_memberships', (select count(*) from public.game_memberships),
              'bonus_competitions', (select count(*) from public.bonus_competitions),
              'season_fixtures', (select count(*) from public.season_fixtures),
              'season_predictions', (select count(*) from public.season_predictions),
              'player_action_items', (select count(*) from public.player_action_items),
              'reminder_deliveries', (select count(*) from public.reminder_deliveries),
              'ai_raw_matches', (select count(*) from ai.raw_matches),
              'ai_odds_api_events', (select count(*) from ai.odds_api_events),
              'ai_predictions', (select count(*) from ai.predictions),
              'ai_market_prices', (select count(*) from ai.market_prices),
              'ai_fixture_odds', (select count(*) from ai.fixture_odds),
              'ai_bets', (select count(*) from ai.bets)
              )
            )::text
          VERIFY_SQL
          cat "${WORK_DIR}/after.json"

          AFTER_FILE="${WORK_DIR}/after.json" BEFORE_FILE="${WORK_DIR}/before.json" \
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          const after = JSON.parse(fs.readFileSync(process.env.AFTER_FILE, 'utf8'))
          const before = JSON.parse(fs.readFileSync(process.env.BEFORE_FILE, 'utf8'))

          const expected = {
            migration_count: Number(process.env.TARGET_CONTRACT),
            latest_version: process.env.TARGET_VERSION,
            latest_name: process.env.TARGET_NAME,
            // The three, named. A count alone would pass on the wrong three.
            range_rows_present: 3,

            launch_table: 1,
            launch_rls: true,
            launch_browser_grants: 0,
            launch_immutable_trigger: 1,
            span_last_sequence_fn: 1,

            span_fn: 1,
            knockout_windows_fn: 1,
            season_finalise_fn: 1,
            season_finalise_authenticated: 1,
            season_finalise_anon: 0,
            internal_cup_fns_browser_reachable: 0,
            tournament_span_not_three: 0,
            tournament_group_table_still_bounded: true,
            season_span_refuses_without_launch: true,

            ai_canonical_fn: 1,
            ai_valid_predictions_view: 1,
            ai_new_tables: 3,
            ai_new_tables_rls: 3,
            ai_new_tables_empty: 0,
            ai_repair_fn: 1,
            ai_reconcile_budget_fn: 1,
            ai_quarantine_fn: 1,
            ai_privileged_fns_browser_reachable: 0,
            ai_browser_table_dml: 0,
            ai_model_provenance_columns: 3,
            ai_prediction_columns: 2,
            ai_prediction_results_diagnosis: 1,
            ai_budget_soft_cap_fraction: 1,
            admin_ai_rpcs: 4,
            admin_ai_rpcs_authenticated: 4,
            admin_ai_rpcs_anon: 0,
            bet_builder_candidates_identity_args:
              'text, text[], timestamp with time zone, timestamp with time zone, integer',

            snapshot_uses_temp_table: false,
            temp_table_lint_violations: 0,
            snapshot_rederives_identity: true,

            alias_targets_absent_from_history: 0,

            // The repair is an operator action, not a consequence of the apply.
            ai_repairs_recorded: 0,
            ai_predictions_invalidated: 0,
            ai_recommendations: 0,
          }
          for (const [key, want] of Object.entries(expected)) {
            if (String(after[key]) !== String(want)) {
              console.error(`ERROR: Production ${key} is ${after[key]}, expected ${want}.`)
              process.exit(1)
            }
          }

          // Paid collection stays OFF through the whole promotion.
          if (![false, 'f', 'false'].includes(after.ai_collection_enabled)) {
            console.error(`ERROR: ai.api_budget.collection_enabled is ${after.ai_collection_enabled}; this rollout must not re-enable paid collection.`)
            process.exit(1)
          }

          // The alias seed landed, and the named mappings are RIGHT — not
          // merely in parity with a second authority that agrees and is wrong.
          if (Number(after.ai_team_aliases_rows) < 90) {
            console.error(`ERROR: ai.team_aliases holds ${after.ai_team_aliases_rows} rows; the seed did not land.`)
            process.exit(1)
          }
          const wantAliases = {
            'Leicester City': 'Leicester',
            'Norwich City': 'Norwich',
            'West Bromwich Albion': 'West Brom',
            'Swansea City': 'Swansea',
            'Blackburn Rovers': 'Blackburn',
            'Sheffield Wednesday': 'Sheffield Weds',
            'Queens Park Rangers': 'QPR',
            'Huddersfield Town': 'Huddersfield',
            'Wimbledon': 'AFC Wimbledon',
            'Raith Rovers': 'Raith Rvs',
          }
          const got = after.alias_resolutions || {}
          for (const [src, want] of Object.entries(wantAliases)) {
            if (got[src] !== want) {
              console.error(`ERROR: ai.canonical_from_odds_api('${src}') is '${got[src]}', expected '${want}'.`)
              process.exit(1)
            }
          }

          // Unchanged rather than absolute: this range schedules nothing, so the
          // claim is that the number did not move. An absolute would fail for a
          // purely environmental reason, which is the trap the 172-to-174
          // rehearsal recorded when a restored dump held zero cron jobs.
          for (const key of ['cron_jobs', 'ai_odds_cron_jobs', 'euro_state']) {
            if (String(before[key]) !== String(after[key])) {
              console.error(`ERROR: ${key} moved ${before[key]} -> ${after[key]}; this range moves none of them.`)
              process.exit(1)
            }
          }
          if (after.euro_state !== 'hidden') {
            console.error(`ERROR: Euro publication state is ${after.euro_state}; this rollout publishes nothing.`)
            process.exit(1)
          }

          // ZERO PROVIDER CALLS: the usage ledger did not move.
          if (String(before.ai_api_usage) !== String(after.ai_api_usage)) {
            console.error(`ERROR: ai.api_usage moved ${before.ai_api_usage} -> ${after.ai_api_usage}; this rollout makes no provider request.`)
            process.exit(1)
          }

          // Every count the pre-apply step captured, compared. Additive by the
          // checker is a claim about the SQL; this is the claim about the data.
          // The AI relations are included: contract 188 installs the repair
          // authority and must not move a retained row by arriving.
          const counted = ['auth_users','profiles','tournaments','teams','matches','entries',
                           'match_predictions','leagues','league_members','score_events',
                           'entry_totals','game_memberships','bonus_competitions',
                           'season_fixtures','season_predictions','player_action_items',
                           'reminder_deliveries','ai_raw_matches','ai_odds_api_events',
                           'ai_predictions','ai_market_prices','ai_fixture_odds','ai_bets']
          for (const key of counted) {
            if (String(before[key]) !== String(after[key])) {
              console.error(`ERROR: ${key} moved ${before[key]} -> ${after[key]}; this range rewrites no row.`)
              process.exit(1)
            }
          }

          console.log(`Production is at contract ${after.migration_count}, all three rows named and present.`)
          console.log(`Contract 186: bonus_cup_launches present, RLS on, no browser grant, immutable trigger installed, ${after.launch_rows} launch row(s) backfilled.`)
          console.log(`Contract 187: ${after.tournament_cup_competitions} tournament Championship(s), every one resolving a span of exactly 3; contract 169's group table still bounded 1..3.`)
          console.log(`Contract 188: ${after.ai_team_aliases_rows} alias rows; every named mapping resolves, and every canonical target exists in ${after.ai_raw_matches} retained matches.`)
          console.log('record_ai_odds_snapshot uses no temporary table and re-derives identity; the temp-table lint is clean.')
          console.log(`Bet Builder candidate identity args: ${after.bet_builder_candidates_identity_args}.`)
          console.log(`Paid collection: ${after.ai_collection_enabled} (disabled). Provider requests made by this rollout: 0.`)
          console.log(`Repairs recorded: ${after.ai_repairs_recorded}. Predictions invalidated: ${after.ai_predictions_invalidated}. The repair is a separate operator action.`)
          console.log(`${after.cron_jobs} scheduled job(s), unchanged, of which ${after.ai_odds_cron_jobs} are ai-odds jobs.`)
          console.log(`Euro publication state: ${after.euro_state}.`)
          for (const key of counted) console.log(`  ${key}: ${after[key]} (unchanged)`)
          NODE

