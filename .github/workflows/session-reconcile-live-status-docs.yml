name: Session reconcile live migration status docs

on:
  push:
    branches:
      - ops/reconcile-live-status-docs-20260807

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ops/reconcile-live-status-docs-20260807

      - name: Reconcile current hosted migration wording
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)

          # AGENTS.md — current operational baseline only.
          path = Path('AGENTS.md')
          text = path.read_text()
          text = replace_once(
              text,
              '- production Supabase and the last published application remain at the Euro baseline contract;',
              '- production Supabase is hosted at contract 96 while the last published application remains at the Euro baseline contract;',
              'AGENTS production baseline bullet',
          )
          pattern = re.compile(
              r'Development Supabase is hosted at \*\*125\*\* — six behind, with contracts 126 to 131 pending\..*?Production remains at 63 and its promotion is not authorised\.',
              re.S,
          )
          replacement = (
              'Development Supabase is hosted at **131** — level with the repository, with no pending Development migrations. '
              'Guarded fast-lane run 31186564948 applied canonical contracts 126 to 131 on 7 August 2026 from exact main `50b01154`, '
              'after proving the Development target, the exact pending set and additive scope and taking the lightweight pre-apply snapshot; '
              'workflow parity and an independent migration-ledger read both ended at `20260806220000_period_standings_display_names`. '
              'Production Supabase is hosted at 96 and further promotion remains unauthorised.'
          )
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'AGENTS hosted baseline: expected one match, found {count}')
          text = text.replace(
              'Production remains at 63 and its promotion is not authorised.',
              'Production Supabase is hosted at 96 and further promotion remains unauthorised.',
          )
          path.write_text(text)

          # Operational inventory — update only the live section/table; historical sections stay historical.
          path = Path('docs/ops/ops-pending-migrations.md')
          text = path.read_text()
          text = replace_once(text, '## Current state — 6 August 2026', '## Current state — 7 August 2026', 'ops current-state date')
          pattern = re.compile(
              r'The repository is at \*\*contract 131\*\* and development is at \*\*125\*\* — .*?Their pgTAP suites `175_round_window_stale_refresh\.sql`, `176_season_cup_split_transition\.sql` and `177_season_fixture_result_entry\.sql` run in CI\'s Database parity job\.\n\n',
              re.S,
          )
          replacement = (
              'The repository and hosted Development are both at **contract 131**. Contracts 126–131 were applied on 7 August 2026 by guarded fast-lane evidence run `31186564948`, pinned to exact repository head `50b01154e5a6cfc2ebc1b2312eaceb42e8a39b57`. Before any hosted write the lane proved the target was Development project `iouzoutneyjpugbbtdem`, hard-refused Production, required exactly the six canonical pending versions `20260806170000` through `20260806220000`, passed the repository additive-migration checker, and took the ADR 0024 lightweight snapshot. `supabase db push` then applied all six; workflow parity and an independent Supabase ledger read both ended at `20260806220000_period_standings_display_names`. Evidence artifact `development-fast-lane-126-131-evidence` is retained for seven days as artifact `8997049916`. **Production is hosted at contract 96 after guarded Batch B retry run `31211668118`; further promotion remains unauthorised.**\n\n'
          )
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'ops live paragraph: expected one match, found {count}')
          text, count = re.subn(
              r'^\| Development Supabase `iouzoutneyjpugbbtdem` \|.*$',
              '| Development Supabase `iouzoutneyjpugbbtdem` | **131** | Guarded fast-lane run `31186564948` applied canonical contracts 126–131 on 7 August 2026; workflow parity and an independent ledger read both end at `20260806220000_period_standings_display_names`. | LEVEL WITH REPOSITORY |',
              text,
              count=1,
              flags=re.M,
          )
          if count != 1:
              raise SystemExit(f'ops Development table row: expected one match, found {count}')
          text, count = re.subn(
              r'^\| Production Supabase \| \*\*63\*\* \|.*$',
              '| Production Supabase | **96** | Guarded Batch B retry run `31211668118` applied canonical contracts 68–96 and post-apply parity ended at `20260804243000_cup_tie_settlement_refusal_order`; merged PR #575 is the machine-readable record. | PAUSED AT 96; FURTHER PROMOTION UNAUTHORISED |',
              text,
              count=1,
              flags=re.M,
          )
          if count != 1:
              raise SystemExit(f'ops Production table row: expected one match, found {count}')
          path.write_text(text)

          # Primary current-status authority.
          path = Path('docs/quality/current-status.md')
          text = path.read_text()
          text = replace_once(text, '**Status date:** 6 August 2026', '**Status date:** 7 August 2026', 'status date')
          text = replace_once(text, '| Last verified | 2026-08-06 |', '| Last verified | 2026-08-07 |', 'last verified')
          text = replace_once(
              text,
              '| Implementation truth | `config/deployment-contract.json` and `config/development-hosted-contract.json` are the machine-readable record; this file reads them rather than competing with them |',
              '| Implementation truth | `config/deployment-contract.json`, `config/development-hosted-contract.json` and `config/production-hosted-contract.json` are the machine-readable records; this file reads them rather than competing with them |',
              'implementation truth row',
          )
          marker = '## Product position\n'
          summary = 'Development Supabase is hosted at **131**, level with the repository; Production Supabase is hosted at **96** and further promotion remains unauthorised.\n\n'
          if summary not in text:
              text = replace_once(text, marker, summary + marker, 'current-status summary insertion')
          pattern = re.compile(
              r'Development Supabase is hosted at \*\*125\*\*, one behind the repository with contract 126 pending:.*?Production remains at \*\*63\*\*\.',
              re.S,
          )
          replacement = (
              'Development Supabase is hosted at **131**, level with the repository. Contracts 126–131 were applied on 7 August 2026 by guarded fast-lane run `31186564948`; workflow parity and an independent ledger read ended at `20260806220000_period_standings_display_names`. Production Supabase is hosted at **96** after guarded Batch B retry run `31211668118`; further promotion remains unauthorised.'
          )
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'current-status repository baseline: expected one match, found {count}')
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'current-status duplicate hosted baseline: expected one match, found {count}')
          text, count = re.subn(
              r'^\| Development Supabase `iouzoutneyjpugbbtdem` \|.*$',
              '| Development Supabase `iouzoutneyjpugbbtdem` | healthy Postgres 17. **Contract 131 applied and independently verified 7 August 2026**; guarded fast-lane run `31186564948` carried contracts 126–131 and ended at `20260806220000_period_standings_display_names`. | No migration pending; re-verify target identity and privileges before any future hosted write |',
              text,
              count=1,
              flags=re.M,
          )
          if count != 1:
              raise SystemExit(f'current-status Development target row: expected one match, found {count}')
          text, count = re.subn(
              r'^\| Production Supabase `vkfnsqdyhvtwyqkisxhk` \|.*$',
              '| Production Supabase `vkfnsqdyhvtwyqkisxhk` | **Contract 96 applied and independently verified 7 August 2026** after guarded Batch B retry run `31211668118`; machine record is `config/production-hosted-contract.json`. | Further promotion remains unauthorised; preserve the guarded rehearsal, backup, exact-range and post-apply checks |',
              text,
              count=1,
              flags=re.M,
          )
          if count != 1:
              raise SystemExit(f'current-status Production target row: expected one match, found {count}')
          text = text.replace(
              'while production Supabase remains 63',
              'while production Supabase is hosted at 96',
          )
          path.write_text(text)

          # Fail closed if the specific pre-rollout live claims survived.
          checks = {
              'AGENTS.md': ['Development Supabase is hosted at **125** — six behind'],
              'docs/ops/ops-pending-migrations.md': ['The repository is at **contract 131** and development is at **125**'],
              'docs/quality/current-status.md': ['Development Supabase is hosted at **125**, one behind the repository with contract 126 pending'],
          }
          for filename, stale_fragments in checks.items():
              content = Path(filename).read_text()
              for fragment in stale_fragments:
                  if fragment in content:
                      raise SystemExit(f'{filename}: stale live fragment survived: {fragment}')
          PY

      - name: Check documentation authorities
        run: node scripts/check-documentation-authorities.mjs

      - name: Validate diff
        run: git diff --check

      - name: Commit reconciled status and remove session workflow
        shell: bash
        run: |
          rm .github/workflows/session-reconcile-live-status-docs.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AGENTS.md docs/ops/ops-pending-migrations.md docs/quality/current-status.md .github/workflows/session-reconcile-live-status-docs.yml
          git diff --cached --check
          git commit -m "Reconcile live migration status docs"
          git push origin HEAD:ops/reconcile-live-status-docs-20260807
