name: Contract 134 RPC allowlist sync

on:
  push:
    branches:
      - agent/euro-002-publication-state-contract-134
    paths:
      - .github/workflows/contract134-rpc-allowlist-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/euro-002-publication-state-contract-134
          fetch-depth: 0
      - name: Register Contract 134 RPC grants
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('supabase/tests/080_function_privileges.sql')
          text = path.read_text()

          text = text.replace(
              "insert into expected_anon_functions (signature) values\n  ('get_public_capacity()');",
              "insert into expected_anon_functions (signature) values\n  ('get_public_capacity()'),\n  -- Contract 134: publication visibility is intentionally readable before auth\n  -- so the public-site/route guard can fail closed from server truth.\n  ('euro_publication_state()');",
              1,
          )

          anchor = "  ('admin_reject_initial_provider_fixtures(uuid,text,text)'),\n  ('admin_resolve_actual_third_place_tie(uuid,uuid[],text)');"
          replacement = "  ('admin_reject_initial_provider_fixtures(uuid,text,text)'),\n  -- Contract 134: the bounded read is public/authenticated; the mutation grant\n  -- only makes the owner RPC reachable. Its internal super_admin guard decides\n  -- whether a signed-in caller may actually advance publication.\n  ('euro_publication_state()'),\n  ('admin_transition_euro_publication_state(text,text,text)'),\n  ('admin_resolve_actual_third_place_tie(uuid,uuid[],text)');"
          if anchor not in text:
              raise SystemExit('authenticated allowlist anchor not found')
          text = text.replace(anchor, replacement, 1)

          service_anchor = "insert into expected_service_functions (signature)\nselect signature\nfrom expected_authenticated_functions\nwhere signature <> 'get_entry_submission_status(uuid)';"
          service_replacement = "insert into expected_service_functions (signature)\nselect signature\nfrom expected_authenticated_functions\nwhere signature not in (\n  'get_entry_submission_status(uuid)',\n  -- Contract 134 mutation remains browser-owner only; service_role needs only\n  -- the bounded state read for server-side publication guards.\n  'admin_transition_euro_publication_state(text,text,text)'\n);"
          if service_anchor not in text:
              raise SystemExit('service allowlist anchor not found')
          text = text.replace(service_anchor, service_replacement, 1)

          path.write_text(text)
          PY
      - name: Commit allowlist alignment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/tests/080_function_privileges.sql
          git commit -m "Contract 134: register publication RPC grants"
          git push origin HEAD:agent/euro-002-publication-state-contract-134
