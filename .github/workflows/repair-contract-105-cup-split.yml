name: Repair Contract 105 Cup split

on:
  push:
    branches:
      - claude/next-build-stage-aufrh6

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/next-build-stage-aufrh6

      - name: Apply fixture, cascade and trigger inventory corrections
        run: python scripts/repair-contract-105-cup-split-once.py

      - name: Commit corrected Contract 105
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add supabase/migrations/20260805010000_cup_split_group_tables.sql supabase/tests/156_cup_split_group_tables.sql tests/database-parity/cupSplitGroupTablesBoundary.test.ts docs/architecture/stage-c-trigger-bindings.md docs/architecture/stage-c-schema-coverage.md tests/database-parity/stageCTriggerBindingCoverage.test.ts
          git diff --cached --check
          git commit -m 'Close Contract 105 ancestry fixture and trigger controls'
          git push origin HEAD:claude/next-build-stage-aufrh6
