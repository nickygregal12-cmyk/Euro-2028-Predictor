name: Production contract 63 promotion

on:
  push:
    branches:
      - agent/post-lock-final-standings
    paths:
      - .github/workflows/production-contract-63-promotion.yml

permissions:
  contents: read

concurrency:
  group: production-contract-63-promotion
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      SUPABASE_PROD_DB_URL: ${{ secrets.SUPABASE_PROD_DB_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v2
        with:
          version: latest

      - name: Require production database URL
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_PROD_DB_URL:-}" || {
            echo "SUPABASE_PROD_DB_URL is not configured." >&2
            exit 1
          }

      - name: Capture and verify contract-60 preflight
        shell: bash
        run: |
          set -euo pipefail
          psql "$SUPABASE_PROD_DB_URL" -v ON_ERROR_STOP=1 -At -F '|' <<'SQL' | tee /tmp/preflight.txt
          select
            (select count(*)::integer from auth.users),
            (select count(*)::integer from public.profiles),
            (select count(*)::integer from public.entries),
            (select count(*)::integer from public.leagues),
            (select count(*)::integer from public.league_members),
            (select count(*)::integer from public.matches),
            (select count(*)::integer from public.match_predictions),
            (select count(*)::integer from public.bonus_competitions),
            (select count(*)::integer from public.bonus_competition_entrants),
            (select count(*)::integer from public.bonus_lms_selections),
            (select count(*)::integer from public.bonus_knockout_predictions);
          SQL

          test "$(psql "$SUPABASE_PROD_DB_URL" -v ON_ERROR_STOP=1 -Atc "select count(*) from supabase_migrations.schema_migrations")" = "60"
          test "$(psql "$SUPABASE_PROD_DB_URL" -v ON_ERROR_STOP=1 -Atc "select max(version) from supabase_migrations.schema_migrations")" = "20260729110000"

          echo "### Production preflight" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/preflight.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Apply canonical migrations 61 to 63
        shell: bash
        run: |
          set -euo pipefail
          supabase db push \
            --db-url "$SUPABASE_PROD_DB_URL" \
            --include-all \
            --yes

      - name: Verify contract 63 and preserved production data
        shell: bash
        run: |
          set -euo pipefail

          psql "$SUPABASE_PROD_DB_URL" -v ON_ERROR_STOP=1 -At -F '|' <<'SQL' | tee /tmp/postflight.txt
          select
            (select count(*)::integer from auth.users),
            (select count(*)::integer from public.profiles),
            (select count(*)::integer from public.entries),
            (select count(*)::integer from public.leagues),
            (select count(*)::integer from public.league_members),
            (select count(*)::integer from public.matches),
            (select count(*)::integer from public.match_predictions),
            (select count(*)::integer from public.bonus_competitions),
            (select count(*)::integer from public.bonus_competition_entrants),
            (select count(*)::integer from public.bonus_lms_selections),
            (select count(*)::integer from public.bonus_knockout_predictions);
          SQL

          diff -u /tmp/preflight.txt /tmp/postflight.txt
          test "$(psql "$SUPABASE_PROD_DB_URL" -v ON_ERROR_STOP=1 -Atc "select count(*) from supabase_migrations.schema_migrations")" = "63"
          test "$(psql "$SUPABASE_PROD_DB_URL" -v ON_ERROR_STOP=1 -Atc "select max(version) from supabase_migrations.schema_migrations")" = "20260729154931"

          psql "$SUPABASE_PROD_DB_URL" -v ON_ERROR_STOP=1 <<'SQL'
          do $$
          begin
            if not exists (
              select 1 from supabase_migrations.schema_migrations
              where version = '20260729122100' and name = 'prediction_consensus'
            ) then
              raise exception 'Contract 61 migration row is missing';
            end if;
            if not exists (
              select 1 from supabase_migrations.schema_migrations
              where version = '20260729122200' and name = 'final_standings_tiebreaks'
            ) then
              raise exception 'Contract 62 migration row is missing';
            end if;
            if not exists (
              select 1 from supabase_migrations.schema_migrations
              where version = '20260729154931' and name = 'prediction_consensus_minimum_cohort'
            ) then
              raise exception 'Contract 63 migration row is missing';
            end if;
            if to_regprocedure('public.get_prediction_consensus(uuid)') is null then
              raise exception 'Public consensus RPC is missing';
            end if;
            if to_regprocedure('predictor_internal.get_prediction_consensus_unsuppressed(uuid)') is null then
              raise exception 'Private consensus helper is missing';
            end if;
            if to_regprocedure('predictor_internal.standing_metrics(uuid)') is null then
              raise exception 'Final standings helper is missing';
            end if;
            if not has_function_privilege('authenticated', 'public.get_prediction_consensus(uuid)', 'execute') then
              raise exception 'Authenticated consensus privilege is missing';
            end if;
            if has_function_privilege('anon', 'public.get_prediction_consensus(uuid)', 'execute') then
              raise exception 'Anonymous consensus privilege is too broad';
            end if;
            if has_function_privilege('authenticated', 'predictor_internal.get_prediction_consensus_unsuppressed(uuid)', 'execute') then
              raise exception 'Browser role can bypass the cohort gate';
            end if;
            if has_function_privilege('authenticated', 'predictor_internal.standing_metrics(uuid)', 'execute') then
              raise exception 'Browser role can execute private standings metrics';
            end if;
          end;
          $$;
          SQL

          echo "### Production contract 63 verification" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/postflight.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
