name: AI selected challenger materialisation

# One policy-expansion authority: ai/train_selected_challengers.py. This workflow
# supplies only environment + version; it does not duplicate league settings.
# Development-first materialisation was completed and independently verified on
# 14 August 2026. Further runs are explicit dispatches only. Production is
# fail-closed unless the exact same code is running from main.
on:
  workflow_dispatch:
    inputs:
      target:
        description: Hosted project to materialise challengers in
        required: true
        default: development
        type: choice
        options:
          - development
          - production
      version:
        description: Immutable challenger version
        required: true
        default: selected-20260814-v2
        type: string

permissions:
  contents: read

env:
  DEVELOPMENT_PROJECT_REF: iouzoutneyjpugbbtdem
  PRODUCTION_PROJECT_REF: vkfnsqdyhvtwyqkisxhk

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      DEV_DB_URL: ${{ secrets.SUPABASE_DEV_DB_URL }}
      PROD_DB_URL: ${{ secrets.SUPABASE_PROD_DB_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ai/requirements.txt

      - name: Resolve target and fail closed
        shell: bash
        # Environment values, not template expansion: a dispatch input is
        # attacker-controllable in principle and this job reaches hosted
        # database URLs.
        env:
          INPUT_TARGET: ${{ inputs.target }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          target="${INPUT_TARGET}"
          version="${INPUT_VERSION}"
          case "$target" in
            development) url="${DEV_DB_URL}"; ref="${DEVELOPMENT_PROJECT_REF}" ;;
            production)
              if [ "${GITHUB_REF}" != refs/heads/main ]; then
                echo 'Production materialisation is allowed only from main.'
                exit 1
              fi
              url="${PROD_DB_URL}"; ref="${PRODUCTION_PROJECT_REF}" ;;
            *) echo "Unknown target $target"; exit 1 ;;
          esac
          if [ -z "$url" ]; then echo "Database secret missing for $target"; exit 1; fi
          case "$url" in *"$ref"*) ;; *) echo "Database URL does not name $target project $ref"; exit 1 ;; esac
          echo "::add-mask::$url"
          # Declared, not rewritten: individual redirects keep each appended line readable. Changing what this script DOES to
          # satisfy a style rule is the worse trade in a workflow holding hosted
          # database credentials. shellcheck only began seeing it when SHA-pinning
          # marked the file changed, so the finding is pre-existing, not new.
          # shellcheck disable=SC2129
          echo "DATABASE_URL=$url" >> "$GITHUB_ENV"
          echo "MATERIALIZE_TARGET=$target" >> "$GITHUB_ENV"
          echo "MATERIALIZE_VERSION=$version" >> "$GITHUB_ENV"
          echo "Materialising $version in $target ($ref)"

      - name: Install
        working-directory: ai
        run: pip install -r requirements.txt

      - name: Prove the package write surface
        working-directory: ai
        run: python check_write_scope.py

      - name: Capture lifecycle state before training
        working-directory: ai
        shell: bash
        run: |
          python - <<'PY' > /tmp/current-models-before
          from db import connect
          with connect() as conn:
              rows = conn.execute("select league,id from ai.models where status='current' order by league").fetchall()
          for row in rows:
              print(f"{row['league']}|{row['id']}")
          PY
          echo "Current models before: $(wc -l < /tmp/current-models-before)"

      - name: Materialise exactly the selected challenger policy
        working-directory: ai
        run: python train_selected_challengers.py --version "${MATERIALIZE_VERSION}" --skip-existing

      - name: Verify nine artefacts, provenance and reproducibility gates
        working-directory: ai
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from artifacts import ModelBundle
          from challenger_policy import CHALLENGER_POLICY, ordered_policy
          from db import connect, load_model_artifact
          from reproducibility import bundle_contract_fingerprint, verify_reference_gate

          version = os.environ['MATERIALIZE_VERSION']
          expected = dict(ordered_policy())
          with connect() as conn:
              rows = conn.execute("""
                  select id,league,version,family,status,training_matches,
                         eval_training_matches,final_trained_through,
                         features_version,feature_groups,half_life_days,
                         calibration_method,component_families,meta_model,
                         artifact_sha256,uses_market
                    from ai.models
                   where version=%s
                   order by league
              """, (version,)).fetchall()
          if len(rows) != 9:
              raise SystemExit(f'expected exactly 9 {version} rows, got {len(rows)}')
          seen = set()
          for row in rows:
              league = row['league']; seen.add(league); spec = expected[league]
              if row['status'] != 'challenger':
                  raise SystemExit(f'{league} crossed lifecycle boundary: {row["status"]}')
              if row['family'] != spec.family or int(row['half_life_days']) != spec.half_life_days:
                  raise SystemExit(f'{league} policy drift: {row["family"]}/{row["half_life_days"]} vs {spec}')
              if spec.family == 'ensemble':
                  if tuple(row['component_families'] or ()) != spec.base_families or row['meta_model'] != spec.meta:
                      raise SystemExit(f'{league} ensemble provenance drift')
              else:
                  if row['component_families'] is not None or row['meta_model'] is not None:
                      raise SystemExit(f'{league} unexpectedly carries ensemble provenance')

              bundle = ModelBundle.from_payload(load_model_artifact(str(row['id'])))
              if bundle.league != league or bundle.version != version or bundle.family != spec.family:
                  raise SystemExit(f'{league} artefact identity disagrees with database row')
              if int(bundle.half_life_days or 0) != spec.half_life_days:
                  raise SystemExit(f'{league} artefact half-life disagrees')
              if tuple(bundle.feature_groups) != tuple(row['feature_groups'] or ()):
                  raise SystemExit(f'{league} requested feature groups disagree')
              coverage = bundle.metadata.get('coverage_guard')
              if not coverage:
                  raise SystemExit(f'{league} artefact has no effective coverage provenance')
              if not row['artifact_sha256']:
                  raise SystemExit(f'{league} has no artefact hash')

              repro = bundle.metadata.get('reproducibility') or {}
              if repro.get('schema') != 1:
                  raise SystemExit(f'{league} has no verified reproducibility schema')
              data_sha = str(repro.get('training_data_sha256') or '')
              contract_sha = str(repro.get('bundle_contract_sha256') or '')
              if len(data_sha) != 64 or len(contract_sha) != 64:
                  raise SystemExit(f'{league} reproducibility fingerprints are incomplete')
              if contract_sha != bundle_contract_fingerprint(bundle):
                  raise SystemExit(f'{league} semantic bundle fingerprint disagrees')
              gate = repro.get('reference_gate') or {}
              verify_reference_gate(bundle, gate)
              if gate.get('bundle_contract_sha256') != contract_sha:
                  raise SystemExit(f'{league} reference gate targets a different bundle contract')
              if int(repro.get('training_rows') or 0) != int(row['training_matches']):
                  raise SystemExit(f'{league} reproducibility row count disagrees with model metadata')

              print('CHALLENGER', json.dumps({
                  'league': league, 'id': str(row['id']), 'family': row['family'],
                  'half_life_days': float(row['half_life_days']),
                  'components': row['component_families'], 'meta': row['meta_model'],
                  'requested_groups': row['feature_groups'], 'coverage': coverage,
                  'calibration': row['calibration_method'],
                  'eval_training_matches': row['eval_training_matches'],
                  'training_matches': row['training_matches'],
                  'final_trained_through': str(row['final_trained_through']),
                  'features_version': row['features_version'],
                  'artifact_sha256': row['artifact_sha256'], 'status': row['status'],
                  'training_data_sha256': data_sha,
                  'bundle_contract_sha256': contract_sha,
                  'reference_gate_manifest_sha256': gate.get('manifest_sha256'),
              }, default=str, separators=(',', ':')))
          if seen != set(CHALLENGER_POLICY):
              raise SystemExit(f'league set mismatch: {sorted(seen)}')
          PY

      - name: Prove zero automatic lifecycle changes
        working-directory: ai
        shell: bash
        run: |
          python - <<'PY' > /tmp/current-models-after
          from db import connect
          with connect() as conn:
              rows = conn.execute("select league,id from ai.models where status='current' order by league").fetchall()
          for row in rows:
              print(f"{row['league']}|{row['id']}")
          PY
          diff -u /tmp/current-models-before /tmp/current-models-after
          echo 'Current-model set is unchanged.'
