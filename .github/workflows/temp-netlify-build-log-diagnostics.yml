name: Temporary Netlify build log diagnostics

on:
  push:
    branches:
      - temp/netlify-build-log-diagnostics
    paths:
      - .github/workflows/temp-netlify-build-log-diagnostics.yml
      - .netlify-diagnostics/proxy.enc.b64
  pull_request:
    paths:
      - .github/workflows/temp-netlify-build-log-diagnostics.yml
      - .netlify-diagnostics/proxy.enc.b64

permissions:
  contents: read

jobs:
  fetch-build-log:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Restore diagnostics private key
        id: key-cache
        uses: actions/cache/restore@v4
        with:
          path: .deploy-key/private.pem
          key: netlify-build-log-diagnostics-key-v1

      - name: Create diagnostics key pair
        if: hashFiles('.netlify-diagnostics/proxy.enc.b64') == ''
        run: |
          set -euo pipefail
          mkdir -p .deploy-key .netlify-diagnostics
          if [ ! -s .deploy-key/private.pem ]; then
            openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:4096 \
              -out .deploy-key/private.pem
          fi
          chmod 600 .deploy-key/private.pem
          openssl pkey -in .deploy-key/private.pem -pubout \
            -out .netlify-diagnostics/public.pem

      - name: Save diagnostics private key
        if: hashFiles('.netlify-diagnostics/proxy.enc.b64') == '' && steps.key-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .deploy-key/private.pem
          key: netlify-build-log-diagnostics-key-v1

      - name: Upload diagnostics public key
        if: hashFiles('.netlify-diagnostics/proxy.enc.b64') == ''
        uses: actions/upload-artifact@v4
        with:
          name: netlify-build-log-diagnostics-public-key
          path: .netlify-diagnostics/public.pem
          retention-days: 1

      - name: Decrypt short-lived Netlify proxy
        if: hashFiles('.netlify-diagnostics/proxy.enc.b64') != ''
        run: |
          set -euo pipefail
          test -s .deploy-key/private.pem
          base64 -d .netlify-diagnostics/key.enc.b64 > /tmp/key.enc
          base64 -d .netlify-diagnostics/proxy.enc.b64 > /tmp/proxy.enc
          openssl pkeyutl -decrypt \
            -inkey .deploy-key/private.pem \
            -in /tmp/key.enc \
            -out /tmp/aes-key.bin \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256
          openssl enc -d -aes-256-cbc -pbkdf2 \
            -in /tmp/proxy.enc \
            -out /tmp/proxy-path.txt \
            -pass file:/tmp/aes-key.bin
          test -s /tmp/proxy-path.txt
          echo "::add-mask::$(cat /tmp/proxy-path.txt)"

      - name: Fetch failed Netlify build log
        if: hashFiles('.netlify-diagnostics/proxy.enc.b64') != ''
        env:
          BUILD_ID: 6a68c372aebd810008f6a597
        run: |
          set -euo pipefail
          raw_proxy="$(cat /tmp/proxy-path.txt)"
          proxy_base="${raw_proxy/https:\/\/netlify-mcp.netlify.app\/\/proxy\//https:\/\/netlify-mcp.netlify.app\/proxy\/}"
          echo "::add-mask::$raw_proxy"
          echo "::add-mask::$proxy_base"
          curl --fail --silent --show-error --location \
            --user-agent netlify-mcp \
            "${proxy_base%/}/api/v1/builds/${BUILD_ID}/log" \
            --output netlify-build.log
          test -s netlify-build.log
          cat netlify-build.log

      - name: Upload diagnostic log
        if: always() && hashFiles('.netlify-diagnostics/proxy.enc.b64') != ''
        uses: actions/upload-artifact@v4
        with:
          name: netlify-build-log-diagnostics
          path: netlify-build.log
          if-no-files-found: warn
          retention-days: 1
