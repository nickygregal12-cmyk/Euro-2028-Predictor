name: Contract 208 Production coordinator one-shot

# Temporary dispatcher/coordinator only. It never connects to Supabase itself.
# It is merged only after the canonical 205-to-208 rehearsal/rollout workflows
# and the verified Development-208 record are on main.
#
# The coordinator preserves the exact-head gate by dispatching rehearsal and,
# only after that succeeds, rollout from the SAME GITHUB_SHA. Any rehearsal
# failure or any movement of main stops before Production mutation.
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/contract-208-production-coordinator-one-shot.yml

permissions:
  contents: read
  actions: write

concurrency:
  group: production-205-to-208-coordinator
  cancel-in-progress: false

env:
  PRODUCTION_REF: vkfnsqdyhvtwyqkisxhk
  DEVELOPMENT_REF: iouzoutneyjpugbbtdem
  BACKUP_RUN_ID: '32312404053'
  REHEARSAL_WORKFLOW: production-205-to-208-rehearsal.yml
  ROLLOUT_WORKFLOW: production-205-to-208-rollout.yml

jobs:
  coordinate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Refuse unless every prerequisite is frozen at Contract 208
        shell: bash
        run: |
          set -euo pipefail
          [ "${GITHUB_REF}" = 'refs/heads/main' ] || { echo 'ERROR: coordinator runs only from main.'; exit 1; }
          git fetch --no-tags origin main
          [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" ] || { echo 'ERROR: coordinator checkout is not exact main.'; exit 1; }
          [ "$(node -p "require('./config/deployment-contract.json').requiredMigrationCount")" = '208' ] || { echo 'ERROR: repository is no longer Contract 208.'; exit 1; }
          [ "$(node -p "require('./config/development-hosted-contract.json').requiredMigrationCount")" -ge 208 ] || { echo 'ERROR: committed Development record is below 208.'; exit 1; }
          [ "$(node -p "require('./config/development-hosted-contract.json').projectRef")" = "${DEVELOPMENT_REF}" ] || { echo 'ERROR: Development record names the wrong project.'; exit 1; }
          [ "$(node -p "require('./config/production-hosted-contract.json').requiredMigrationCount")" = '205' ] || { echo 'ERROR: committed Production source is no longer 205.'; exit 1; }
          [ "$(node -p "require('./config/production-hosted-contract.json').projectRef")" = "${PRODUCTION_REF}" ] || { echo 'ERROR: Production record names the wrong project.'; exit 1; }
          test -f ".github/workflows/${REHEARSAL_WORKFLOW}" || { echo 'ERROR: 205-to-208 rehearsal workflow is not on main.'; exit 1; }
          test -f ".github/workflows/${ROLLOUT_WORKFLOW}" || { echo 'ERROR: 205-to-208 rollout workflow is not on main.'; exit 1; }

      - name: Re-prove the encrypted backup authority
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${BACKUP_RUN_ID}")"
          [ "$(jq -r '.conclusion' <<<"${run}")" = success ] || { echo 'ERROR: Production backup did not succeed.'; exit 1; }
          [ "$(jq -r '.path' <<<"${run}")" = '.github/workflows/production-backup.yml' ] || { echo 'ERROR: backup run is not Production backup.'; exit 1; }
          backup_sha="$(jq -r '.head_sha' <<<"${run}")"
          git merge-base --is-ancestor "${backup_sha}" HEAD || { echo 'ERROR: backup head is not an ancestor of coordinator head.'; exit 1; }
          artifacts="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${BACKUP_RUN_ID}/artifacts")"
          [ "$(jq '[.artifacts[] | select(.name == "production-backup-encrypted" and .expired == false)] | length' <<<"${artifacts}")" = 1 ] || { echo 'ERROR: fresh encrypted backup artifact is missing.'; exit 1; }

      - name: Dispatch read-only 205-to-208 rehearsal and wait for success
        id: rehearsal
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mark="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          gh api \
            --method POST \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/${REHEARSAL_WORKFLOW}/dispatches" \
            -f ref='main' \
            -f "inputs[project_ref]=${PRODUCTION_REF}" \
            -f 'inputs[confirmation]=REHEARSE-PRODUCTION-205-TO-208' \
            -f "inputs[backup_run_id]=${BACKUP_RUN_ID}"

          rehearsal_id=''
          for _ in $(seq 1 60); do
            runs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${REHEARSAL_WORKFLOW}/runs?event=workflow_dispatch&branch=main&per_page=20")"
            rehearsal_id="$(jq -r --arg sha "${GITHUB_SHA}" --arg mark "${mark}" '[.workflow_runs[] | select(.head_sha == $sha and .created_at >= $mark)] | sort_by(.created_at) | last | .id // empty' <<<"${runs}")"
            [ -n "${rehearsal_id}" ] && break
            sleep 2
          done
          [ -n "${rehearsal_id}" ] || { echo 'ERROR: could not identify dispatched rehearsal run.'; exit 1; }
          echo "rehearsal_run_id=${rehearsal_id}" >> "${GITHUB_OUTPUT}"
          echo "Rehearsal run: ${rehearsal_id}"

          for _ in $(seq 1 260); do
            run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${rehearsal_id}")"
            status="$(jq -r '.status' <<<"${run}")"
            conclusion="$(jq -r '.conclusion // empty' <<<"${run}")"
            if [ "${status}" = completed ]; then
              [ "${conclusion}" = success ] || { echo "ERROR: rehearsal ${rehearsal_id} concluded ${conclusion}. Production was not mutated."; exit 1; }
              echo "Rehearsal ${rehearsal_id} succeeded."
              exit 0
            fi
            sleep 15
          done
          echo 'ERROR: rehearsal did not complete inside coordinator window.'
          exit 1

      - name: Re-prove main has not moved since rehearsal
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          actual="$(git rev-parse origin/main)"
          [ "${actual}" = "${GITHUB_SHA}" ] || {
            echo "ERROR: main moved from ${GITHUB_SHA} to ${actual} after rehearsal. Refusing Production rollout."
            exit 1
          }

      - name: Dispatch guarded 205-to-208 Production rollout and wait for success
        id: rollout
        env:
          GH_TOKEN: ${{ github.token }}
          REHEARSAL_RUN_ID: ${{ steps.rehearsal.outputs.rehearsal_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          mark="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          gh api \
            --method POST \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/${ROLLOUT_WORKFLOW}/dispatches" \
            -f ref='main' \
            -f "inputs[project_ref]=${PRODUCTION_REF}" \
            -f 'inputs[confirmation]=APPLY-PRODUCTION-205-TO-208' \
            -f "inputs[backup_run_id]=${BACKUP_RUN_ID}" \
            -f "inputs[rehearsal_run_id]=${REHEARSAL_RUN_ID}"

          rollout_id=''
          for _ in $(seq 1 60); do
            runs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${ROLLOUT_WORKFLOW}/runs?event=workflow_dispatch&branch=main&per_page=20")"
            rollout_id="$(jq -r --arg sha "${GITHUB_SHA}" --arg mark "${mark}" '[.workflow_runs[] | select(.head_sha == $sha and .created_at >= $mark)] | sort_by(.created_at) | last | .id // empty' <<<"${runs}")"
            [ -n "${rollout_id}" ] && break
            sleep 2
          done
          [ -n "${rollout_id}" ] || { echo 'ERROR: could not identify dispatched Production rollout run.'; exit 1; }
          echo "rollout_run_id=${rollout_id}" >> "${GITHUB_OUTPUT}"
          echo "Production rollout run: ${rollout_id}"

          for _ in $(seq 1 200); do
            run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${rollout_id}")"
            status="$(jq -r '.status' <<<"${run}")"
            conclusion="$(jq -r '.conclusion // empty' <<<"${run}")"
            if [ "${status}" = completed ]; then
              [ "${conclusion}" = success ] || { echo "ERROR: Production rollout ${rollout_id} concluded ${conclusion}."; exit 1; }
              echo "Production rollout ${rollout_id} succeeded."
              exit 0
            fi
            sleep 15
          done
          echo 'ERROR: Production rollout did not complete inside coordinator window.'
          exit 1
