name: Session reconcile AGENTS PR 597

on:
  push:
    branches:
      - docs/live-authority-reconciliation-20260808

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: docs/live-authority-reconciliation-20260808
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Reconcile AGENTS hosted state
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('AGENTS.md')
          text = p.read_text()
          replacements = {
            '- Development Supabase and Production Supabase are hosted at contract 132, one migration behind the contract-133 repository candidate, while the last published application remains at the Euro baseline contract;':
            '- Development Supabase is hosted at contract 133 after the verified Development Fast Lane rollout; Production Supabase remains independently hosted at contract 132, while the last published application remains at the Euro baseline contract;',
            'Development Supabase is hosted at **132** — one migration behind this repository candidate until the authorised Contract 133 rollout is applied and verified.':
            'Development Supabase is hosted at **133** after Development Fast Lane run 31276698062 / #46 applied and verified `20260808003000_private_season_cup_player_reads.sql` from exact main `1138d0967bcff4168680980dc3352517f1e9c772`.',
            'Production Supabase is hosted at 132, one migration behind this repository candidate; Contract 133 promotion remains separately gated and must follow Development verification and explicit Production authorisation.':
            'Production Supabase is hosted at 132, one migration behind the repository and Development; Contract 133 promotion remains separately gated and requires explicit Production authorisation.',
            'Production Supabase is hosted at 132; Contract 133 remains repository-only until its guarded rollout is applied and verified.':
            'Production Supabase is hosted at 132; Contract 133 is verified in Development but has not been promoted to Production.'
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'expected AGENTS text not found: {old[:120]}')
              text = text.replace(old, new, 1)
          p.write_text(text)
          PY
      - name: Validate exact former failure
        run: npx vitest run tests/database-parity/liveCompetitionCallerBoundary.test.ts
      - name: Validate documentation freshness
        run: npx vitest run tests/scripts/documentationContractFreshness.test.ts
      - name: Regenerate NOW and verify current
        run: |
          npm run generate:now
          npm run check:now
      - name: Commit reconciliation and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/session-reconcile-agents-597.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AGENTS.md NOW.md
          git commit -m 'docs: reconcile AGENTS Development contract 133 state'
          git push origin HEAD:docs/live-authority-reconciliation-20260808
