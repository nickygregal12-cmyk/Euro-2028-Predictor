name: One-time 05:00 authority reconciliation

on:
  push:
    branches:
      - automation/2026-08-04-0500-authority-reconcile

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
      - name: Reconcile live authority to the machine record
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          import re

          record_path = Path('config/development-hosted-contract.json')
          record = json.loads(record_path.read_text())
          development = int(record['requiredMigrationCount'])
          production = int(record['productionContract'])
          latest_version = record['latestMigrationVersion']
          latest_name = record['latestMigrationName']
          project_ref = record['projectRef']

          if development != 78 or production != 63:
              raise SystemExit(f'Unexpected hosted contract record: development={development}, production={production}')

          status_path = Path('docs/quality/current-status.md')
          status = status_path.read_text()
          status = re.sub(r'^\*\*Status date:\*\* .*$', '**Status date:** 4 August 2026', status, flags=re.M)
          status = re.sub(
              r'^\| Repository contract \|.*$',
              f'| Repository contract | **{development}** — {development} canonical migrations through `{latest_version}_{latest_name}.sql`. Development hosted state is read from [`../../config/development-hosted-contract.json`](../../config/development-hosted-contract.json), currently contract **{development}** on `{project_ref}`; production remains contract **{production}** and promotion is not authorised. Non-production Netlify gaps are informational under ADR 0024; production retains the fatal contract gate |',
              status,
              flags=re.M,
          )
          status = re.sub(
              r'^\| Next executable issue \|.*$',
              '| Next executable issue | **Provider-ingestion custody from current `main`.** Rebuild strict provider decoders, archive-before-decode custody, the server-only Edge Function and canonical identity mapping without reviving stale PR #352 or #416 migrations. Domestic season work already reaches contract 78; remaining domestic work is the matchweek scheduler, LMS settlement job, Cup persistence and Phase-1-gated user surfaces. No C2 work or production write is authorised |',
              status,
              flags=re.M,
          )
          status = re.sub(
              rf'^\| Development Supabase `{re.escape(project_ref)}` \|.*$',
              f'| Development Supabase `{project_ref}` | Healthy Postgres 17. Canonical hosted state is recorded in [`../../config/development-hosted-contract.json`](../../config/development-hosted-contract.json): contract **{development}** through `{latest_version}_{latest_name}`, verified from the hosted migration ledger on 4 August 2026. Historical rollout runs remain evidence, not the live contract authority | Re-read the hosted migration ledger and target privileges before any operational reliance or further rollout |',
              status,
              flags=re.M,
          )
          status_path.write_text(status)

          agents_path = Path('AGENTS.md')
          agents = agents_path.read_text()
          agents = re.sub(
              r'^The repository is at \*\*contract \d+\*\*.*$',
              f'The repository contract comes from `config/deployment-contract.json`; hosted development state comes from `config/development-hosted-contract.json` (currently contract {development} on `{project_ref}`), while production remains contract {production}. Treat these as distinct facts. Hosted schema mutation still requires the applicable guarded workflow and verification; production promotion remains milestone-only and is not authorised merely to equalise numbers.',
              agents,
              flags=re.M,
          )
          agents_path.write_text(agents)

          ops = f'''# Hosted migration inventory and rollout status

This is the operational migration inventory. Machine-readable development hosted state is authoritative in [`../../config/development-hosted-contract.json`](../../config/development-hosted-contract.json); repository contract is authoritative in [`../../config/deployment-contract.json`](../../config/deployment-contract.json). Historical rollout reports are evidence only.

## Current state — 4 August 2026

| Environment | Contract | Evidence | Status |
| --- | ---: | --- | --- |
| Repository `main` | **{development}** | {development} canonical migrations through `{latest_version}_{latest_name}.sql` | MERGED |
| Development Supabase `{project_ref}` | **{development}** | Hosted migration ledger directly verified through `{latest_version}_{latest_name}`; machine record matches repository contract | VERIFIED AND ALIGNED |
| Production Supabase | **{production}** | Hosted migration ledger directly verified through `20260729154931_prediction_consensus_minimum_cohort` | PAUSED AND UNCHANGED |
| Netlify `euro28predictor` non-production contexts | repository-controlled | Preview and branch builds use the single active site. Development contract lag is informational under ADR 0024 | ACTIVE SITE ONLY |
| Netlify `euro28predictor` production | **{production} hosted declaration** | Production remains tied to the contract-{production} Euro baseline and retains the fatal contract gate | BLOCKED BY DESIGN |

The historic Netlify project `euro28-predictor-dev` is out of scope and must not be inspected as current state, configured or deployed to.

## Contracts 64–78

- **64:** Cup winner deletion semantics.
- **65:** Stage C1 competition-season foundation.
- **66:** C1b game catalogue and memberships.
- **67:** Matchweek lock scope.
- **68:** Season fixtures.
- **69:** Season predictions.
- **70:** Season scoring SQL parity.
- **71:** LMS pick resolution.
- **72:** LMS persistence.
- **73:** LMS round conclusion and season exhaustion.
- **74:** Season Cup rules.
- **75:** Neutral Cup points source.
- **76:** Neutral Cup settlement source.
- **77:** Season Cup sources.
- **78:** Circle-method season Cup league schedule.

All contracts 64–78 are applied to development. None is authorised for production merely to remove the intentional contract gap.

## Pending hosted work

1. Keep development and repository contract evidence aligned through `.github/workflows/development-hosted-status-followup.yml` after every successful fast-lane rollout.
2. Before the next development migration, verify the generated hosted-status PR merges and that this inventory, `AGENTS.md` and `docs/quality/current-status.md` still reference the machine record rather than a copied contract number.
3. Keep production Supabase and the production Netlify contract at {production} until a separately scoped, explicitly approved milestone release.
4. Do not use the historic `euro28-predictor-dev` Netlify project.

## Next implementation boundary

Provider-ingestion custody is the next durable cross-platform slice: strict decoders, archive-before-decode custody, server-only Edge Function execution and canonical identity mapping, rebuilt from current `main`. Stale PR #352/#416 migrations must not be reused.

## Related authority

- [`../quality/current-status.md`](../quality/current-status.md)
- [`../../AGENTS.md`](../../AGENTS.md)
- [`../../config/deployment-contract.json`](../../config/deployment-contract.json)
- [`../../config/development-hosted-contract.json`](../../config/development-hosted-contract.json)
- [`../adr/0024-development-environment-operating-model.md`](../adr/0024-development-environment-operating-model.md)
'''
          Path('docs/ops/ops-pending-migrations.md').write_text(ops)

          script = r'''import fs from 'node:fs'

const deployment = JSON.parse(fs.readFileSync('config/deployment-contract.json', 'utf8'))
const hosted = JSON.parse(fs.readFileSync('config/development-hosted-contract.json', 'utf8'))
const status = fs.readFileSync('docs/quality/current-status.md', 'utf8')
const agents = fs.readFileSync('AGENTS.md', 'utf8')
const inventory = fs.readFileSync('docs/ops/ops-pending-migrations.md', 'utf8')

const fail = (message) => {
  console.error(message)
  process.exitCode = 1
}

if (hosted.requiredMigrationCount > deployment.requiredMigrationCount) {
  fail(`Hosted development contract ${hosted.requiredMigrationCount} cannot lead repository contract ${deployment.requiredMigrationCount}.`)
}

if (hosted.productionPromotionAuthorised !== false) {
  fail('Production promotion must remain fail-closed in the hosted contract record.')
}

for (const [name, content] of [['current-status', status], ['AGENTS', agents], ['migration inventory', inventory]]) {
  if (!content.includes('config/development-hosted-contract.json')) {
    fail(`${name} must reference config/development-hosted-contract.json.`)
  }
}

if (/Development Supabase is hosted at contract \d+/i.test(status) || /Development Supabase is hosted at contract \d+/i.test(agents)) {
  fail('Live authority must not independently hard-code the development hosted contract.')
}

if (!inventory.includes(`| Development Supabase \`${hosted.projectRef}\` | **${hosted.requiredMigrationCount}** |`)) {
  fail('Migration inventory does not match the machine-readable hosted development contract.')
}

if (!inventory.includes(`| Production Supabase | **${hosted.productionContract}** |`)) {
  fail('Migration inventory does not match the recorded production contract.')
}

if (process.exitCode) process.exit(process.exitCode)
console.log(`Hosted contract authority aligned: repository ${deployment.requiredMigrationCount}, development ${hosted.requiredMigrationCount}, production ${hosted.productionContract}.`)
'''
          Path('scripts/check-hosted-contract-authority.mjs').write_text(script)

          gate = '''name: Hosted contract authority\n\non:\n  pull_request:\n    paths:\n      - AGENTS.md\n      - config/deployment-contract.json\n      - config/development-hosted-contract.json\n      - docs/quality/current-status.md\n      - docs/ops/ops-pending-migrations.md\n      - scripts/check-hosted-contract-authority.mjs\n      - .github/workflows/hosted-contract-authority.yml\n  push:\n    branches: [main]\n    paths:\n      - AGENTS.md\n      - config/deployment-contract.json\n      - config/development-hosted-contract.json\n      - docs/quality/current-status.md\n      - docs/ops/ops-pending-migrations.md\n      - scripts/check-hosted-contract-authority.mjs\n      - .github/workflows/hosted-contract-authority.yml\n\npermissions:\n  contents: read\n\njobs:\n  verify:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n      - uses: actions/setup-node@v4\n        with:\n          node-version: 22.22.2\n      - run: node scripts/check-hosted-contract-authority.mjs\n'''
          Path('.github/workflows/hosted-contract-authority.yml').write_text(gate)

          Path('.github/workflows/automation-0500-authority-reconcile.yml').unlink()
          PY
          node scripts/check-hosted-contract-authority.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AGENTS.md docs/quality/current-status.md docs/ops/ops-pending-migrations.md scripts/check-hosted-contract-authority.mjs .github/workflows
          git commit -m 'Control: align hosted contract authority at 78'
          git push origin HEAD
