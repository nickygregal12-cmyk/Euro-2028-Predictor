name: Repair contract 103 series default

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  repair:
    if: github.head_ref == 'agent/contract-103-competition-instance-lineage'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/contract-103-competition-instance-lineage

      - name: Repair series default and proof plan
        run: python scripts/repair-contract-103-default-once.py

      - name: Commit repaired default
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add supabase/migrations/20260804333000_competition_instance_lineage.sql supabase/tests/154_competition_instance_lineage.sql
          git diff --cached --check
          git commit -m 'Give new competition series a database default'
          git push origin HEAD:agent/contract-103-competition-instance-lineage
