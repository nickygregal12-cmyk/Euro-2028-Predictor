name: Production Access Probe

# Establishes, empirically and on a runner, which non-interactive exchange the
# Netlify site password accepts. It exists because the question cannot be
# answered from this repository or from an agent session:
#
#   * The agent session egress policy blocks euro28predictor.com outright
#     (CONNECT tunnel failed, response 403), so nothing local can reach the site.
#   * Netlify's site password protection is a login form, not HTTP Basic auth.
#     Basic-Auth-via-_headers is a different feature, and the two are widely
#     conflated. Guessing between them would produce a smoke that fails for a
#     reason nobody can distinguish from a bad release.
#
# It writes nothing, changes nothing and asserts nothing about the release. It
# makes read-only requests and reports status codes.
#
# THIS WORKFLOW IS DISPOSABLE. Delete it in the change that wires the winning
# mechanism into production-smoke.yml. It is not a standing capability.
#
# Secret handling, which is the whole risk surface here:
#   * The password is read from secrets.PRODUCTION_SITE_PASSWORD and is never
#     echoed, never interpolated into a printed string and never written to a
#     file that is uploaded.
#   * No response BODY is printed. A password-form response can echo submitted
#     input, and an authenticated response body is site content.
#   * Set-Cookie NAMES are printed; cookie VALUES are not, because a successful
#     exchange returns a session JWT.
#   * The cookie jar is written under RUNNER_TEMP and shredded in an always()
#     step. No artifact is uploaded by this workflow.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type PROBE-PRODUCTION-ACCESS to run.
        required: true

permissions:
  contents: read

concurrency:
  group: production-access-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Refuse without the explicit confirmation
        if: ${{ inputs.confirm != 'PROBE-PRODUCTION-ACCESS' }}
        run: |
          echo 'STOP: confirmation phrase did not match.' >&2
          exit 1

      - name: Probe candidate authentication mechanisms
        env:
          SITE_PASSWORD: ${{ secrets.PRODUCTION_SITE_PASSWORD }}
          ORIGIN: https://euro28predictor.com
        shell: bash
        run: |
          set -uo pipefail

          if [ -z "${SITE_PASSWORD:-}" ]; then
            echo 'STOP: secret PRODUCTION_SITE_PASSWORD is empty or not exposed to this workflow.' >&2
            exit 1
          fi

          TARGET="${ORIGIN}/release.json"
          JAR="${RUNNER_TEMP}/probe-cookies.txt"
          BODY="${RUNNER_TEMP}/probe-body.bin"
          HDRS="${RUNNER_TEMP}/probe-headers.txt"

          # Reports one candidate on a single line. Prints the status code and
          # whether the body looks like our release identity. NEVER prints the
          # body, and never prints the password.
          classify() {
            local label="$1" status="$2"
            local identity='no'
            if node -e '
              const fs = require("node:fs")
              try {
                const parsed = JSON.parse(fs.readFileSync(process.argv[1], "utf8"))
                process.exit(parsed && parsed.environment && parsed.commit ? 0 : 1)
              } catch { process.exit(1) }
            ' "${BODY}" 2>/dev/null; then
              identity='YES'
            fi
            printf 'CANDIDATE %-34s status=%-4s release_identity=%s\n' "${label}" "${status}" "${identity}"
          }

          probe_status() {
            curl --silent --show-error --location \
              --connect-timeout 10 --max-time 25 \
              --output "${BODY}" --write-out '%{http_code}' "$@" 2>/dev/null || echo '000'
          }

          echo '=== Baseline: what does an anonymous request actually get? ==='
          status="$(curl --silent --connect-timeout 10 --max-time 25 \
            --dump-header "${HDRS}" --output "${BODY}" \
            --write-out '%{http_code}' "${TARGET}" 2>/dev/null || echo '000')"
          classify 'anonymous' "${status}"

          # The single most informative datum: a WWW-Authenticate: Basic challenge
          # would settle the mechanism outright. Header NAMES and the challenge
          # scheme are safe to print; no credential appears in a challenge.
          echo '--- response headers relevant to authentication ---'
          grep -iE '^(www-authenticate|location|set-cookie|content-type):' "${HDRS}" \
            | sed -E 's/^([Ss]et-[Cc]ookie: *[^=]+)=.*/\1=<redacted>/' \
            || echo '(none present)'

          echo
          echo '=== Candidate exchanges ==='

          # 1. HTTP Basic auth, empty username. The form Netlify uses for
          #    Basic-Auth-via-_headers when only a password is configured.
          status="$(probe_status --user ":${SITE_PASSWORD}" "${TARGET}")"
          classify 'basic-auth (empty user)' "${status}"

          # 2. HTTP Basic auth, password as both fields. Some setups expect this.
          status="$(probe_status --user "${SITE_PASSWORD}:${SITE_PASSWORD}" "${TARGET}")"
          classify 'basic-auth (password as user)' "${status}"

          # 3. The documented shape for site-wide password protection: POST the
          #    password to the site, keep the cookie it returns, then request the
          #    target with that jar.
          rm -f "${JAR}"
          post_status="$(curl --silent --connect-timeout 10 --max-time 25 \
            --cookie-jar "${JAR}" --dump-header "${HDRS}" --output "${BODY}" \
            --write-out '%{http_code}' \
            --data-urlencode "password=${SITE_PASSWORD}" \
            "${ORIGIN}/" 2>/dev/null || echo '000')"
          echo "POST ${ORIGIN}/ -> status=${post_status}"
          echo '--- cookie names returned by the POST (values redacted) ---'
          if [ -s "${JAR}" ]; then
            awk '!/^#/ && NF >= 7 { print "  cookie: " $6 }' "${JAR}" | sort -u
          else
            echo '  (no cookies set)'
          fi
          status="$(probe_status --cookie "${JAR}" "${TARGET}")"
          classify 'form-post to / then cookie jar' "${status}"

          # 4. Same, but posting to the protected path rather than the root.
          rm -f "${JAR}"
          curl --silent --connect-timeout 10 --max-time 25 \
            --cookie-jar "${JAR}" --output /dev/null \
            --data-urlencode "password=${SITE_PASSWORD}" \
            "${TARGET}" >/dev/null 2>&1
          status="$(probe_status --cookie "${JAR}" "${TARGET}")"
          classify 'form-post to target then cookie jar' "${status}"

          echo
          echo '=== Read the table above ==='
          echo 'A candidate is the answer only if status=200 AND release_identity=YES.'
          echo 'A 200 with release_identity=no is the login page being served with'
          echo 'a success status, which is exactly the trap this probe exists to'
          echo 'catch: a smoke that trusted the status alone would pass on it.'

      - name: Shred the cookie jar
        if: ${{ always() }}
        shell: bash
        run: |
          set -uo pipefail
          find "${RUNNER_TEMP}" -maxdepth 1 -name 'probe-*' -type f -print0 \
            | xargs -0 -r shred --remove --zero 2>/dev/null || true
          echo 'Probe scratch files removed.'
