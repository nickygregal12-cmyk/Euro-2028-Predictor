name: Patch contract 55 production release state

on:
  push:
    branches:
      - release/contract55-production-live
    paths:
      - .github/workflows/patch-contract55-production-live.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/contract55-production-live
          fetch-depth: 0

      - name: Align permanent production controls and status
