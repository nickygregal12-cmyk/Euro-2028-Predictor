name: Workflow lint

# Static analysis of the workflows themselves.
#
# WHY THIS IS ITS OWN WORKFLOW rather than two steps in `ci.yml`. It has a
# different trigger. These tools read `.github/workflows/**` and nothing else,
# so running them on every application pull request would spend a runner to
# re-analyse files that did not change; and a workflow that only ever runs when
# workflows change is also the one most likely to be edited by somebody who is
# not thinking about YAML validity at the time.
#
# WHAT EACH ONE ANSWERS. They do not overlap:
#
#   - `actionlint` asks "is this workflow VALID" — expression syntax, unknown
#     contexts, bad `runs-on` labels, and shellcheck over every `run:` block. It
#     catches the class of defect that otherwise burns a rehearsal run to
#     discover, which matters here because some of these workflows take a
#     production backup before they fail.
#   - `zizmor` asks "is this workflow SAFE" — template-injection sinks where
#     untrusted input reaches a shell, over-broad `permissions`, unpinned
#     third-party actions, artifact poisoning, credential persistence. The
#     repository has 22 workflows and several hold production database
#     credentials, so a template-injection sink in one of them is a direct route
#     to those secrets.
#
# REPORT-ONLY TO BEGIN WITH, which is this repository's stated rule for a new
# analyser: a check becomes blocking once its false-positive rate and runtime
# are understood, not on the day it is introduced. Both are expected to have
# findings on first run — `zizmor` in particular will flag the unpinned actions
# that `ACQ-R19` already tracks and that could not be pinned from the authoring
# environment. Promoting these to blocking is its own change, with the baseline
# written down the way the Knip and Lighthouse baselines are.

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'

# Read-only. A linter that can write to the repository is a worse problem than
# the ones it finds, and `zizmor` flags exactly this pattern in other people's
# workflows.
permissions:
  contents: read

jobs:
  workflow-lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install actionlint
        # Installed through the Go module proxy rather than by piping the
        # project's install script from `main`, which is the supply-chain
        # pattern this job exists to discourage.
        #
        # `@latest` is deliberate and is a known weakness, recorded rather than
        # hidden: resolving and verifying a specific version was not possible
        # from the environment this workflow was authored in — the GitHub API
        # was unreachable — and inventing a version number that may not exist
        # would break the job rather than secure it, which is the same reasoning
        # `ACQ-R19` records for the unpinned actions elsewhere. Pin it when the
        # SHA-pinning work happens, from an environment that can verify it.
        run: go install github.com/rhysd/actionlint/cmd/actionlint@latest

      - name: actionlint
        continue-on-error: true
        # `-color` because the annotations are much easier to scan, and
        # actionlint runs shellcheck itself when it is present on the runner —
        # ubuntu-latest ships it.
        run: actionlint -color

      - name: Install zizmor
        # Pinned, because this one could be verified: 1.29.0 is the version
        # published on PyPI at the time of writing. An unpinned security
        # analyser is a supply-chain hole in the shape of a security tool.
        run: pipx install zizmor==1.29.0

      - name: zizmor
        continue-on-error: true
        # `--persona=regular` is the default sensitivity. `auditor` adds findings
        # that are informational rather than actionable and would bury the real
        # ones on a first run; raise it once the baseline is clean.
        #
        # No token is passed. Zizmor uses one only to resolve remote audits of
        # third-party actions, and this job deliberately grants `contents: read`
        # and nothing else — the offline audits are the ones that matter here.
        run: zizmor --persona=regular --format=plain .github/workflows/ .github/actions/
