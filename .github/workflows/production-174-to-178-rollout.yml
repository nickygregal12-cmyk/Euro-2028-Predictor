name: Production 174 to 178 rollout

# One-shot guarded promotion of the Production contract boundary 174 -> 178.
#
# The owner authorised this Production migration on 12 August 2026, in the
# session that built contracts 175 to 178, by asking for the batch to be merged
# and then rolled out to Production. That authorisation is what this file
# records; it is not a licence the workflow grants itself, and it does not
# extend to any other boundary.
#
# WHY FOUR AT ONCE IS DEFENSIBLE: every one of contracts 175 to 178 is
# ADDITIVE, so `check-migration-additive.mjs` runs here as a GATE rather than
# as the report the destructive 157 -> 158 promotion needed. If a future reader
# finds it softened, the boundary has changed and this file no longer describes
# it.
#
# NOTHING IN THE RANGE REDEFINES AN EXISTING FUNCTION. Five functions are
# created under names that did not previously exist, two tables are created in
# `predictor_internal`, and no relation, column, policy, trigger or grant is
# altered. That is unusually clean for a four-contract range and it is asserted
# below rather than assumed.
#
# THE DRY RUN ASSERTS EXACTLY THE FOUR FILES BY NAME. "At least the ones I
# expected" would pass while promoting something nobody approved.
#
# WHAT THIS DOES NOT DO, stated because the range makes it tempting to think
# otherwise: it schedules NO job. Contract 178's verifier has no caller by
# design, and giving it one is a separate decision — the postflight proves no
# scheduled command names it. It publishes no Euro 2028, launches no
# competition, imports no football and promotes no application.
#
# Remove this one-shot workflow after the hosted contract/evidence record has
# been reconciled.

on:
  workflow_dispatch:
    inputs:
      project_ref:
        description: Exact Production project ref confirmation
        required: true
      confirmation:
        description: Type APPLY-PRODUCTION-174-TO-178 to proceed
        required: true
      backup_run_id:
        description: Run id of the successful Production backup
        required: true
      rehearsal_run_id:
        description: Run id of the successful 174-to-178 rehearsal
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: production-migration-rollout
  cancel-in-progress: false

env:
  EXPECTED_PROJECT_REF: vkfnsqdyhvtwyqkisxhk
  FORBIDDEN_DEVELOPMENT_REF: iouzoutneyjpugbbtdem
  CONFIRMATION_PHRASE: APPLY-PRODUCTION-174-TO-178
  SOURCE_CONTRACT: '174'
  SOURCE_VERSION: '20260811234000'
  SOURCE_NAME: provider_calendar_change_proposals
  TARGET_CONTRACT: '178'
  TARGET_VERSION: '20260812003000'
  TARGET_NAME: shadow_scoring_verifier
  WORK_DIR: /tmp/production-174-to-178

jobs:
  rollout:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Refuse an unsafe dispatch or repository state
        env:
          INPUT_PROJECT_REF: ${{ inputs.project_ref }}
          INPUT_CONFIRMATION: ${{ inputs.confirmation }}
        shell: bash
        run: |
          set -euo pipefail
          [ "${INPUT_CONFIRMATION}" = "${CONFIRMATION_PHRASE}" ] || {
            echo "ERROR: confirmation phrase does not match ${CONFIRMATION_PHRASE}."
            exit 1
          }
          if [ "${INPUT_PROJECT_REF}" = "${FORBIDDEN_DEVELOPMENT_REF}" ]; then
            echo 'ERROR: that is the Development project.'
            exit 1
          fi
          [ "${INPUT_PROJECT_REF}" = "${EXPECTED_PROJECT_REF}" ] || {
            echo 'ERROR: project ref confirmation does not name the Production project.'
            exit 1
          }
          [ "${GITHUB_REF}" = 'refs/heads/main' ] || {
            echo 'ERROR: Production rollout runs only from refs/heads/main.'
            exit 1
          }
          git fetch --no-tags origin main
          [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" ] || {
            echo 'ERROR: checked-out HEAD is not exact origin/main.'
            exit 1
          }
          [ -z "$(git status --porcelain=v1 --untracked-files=all)" ] || {
            echo 'ERROR: checkout is not clean.'
            exit 1
          }
          mkdir -p "${WORK_DIR}"

      - name: Prove a successful backup and rehearsal exist
        env:
          GH_TOKEN: ${{ github.token }}
          BACKUP_RUN_ID: ${{ inputs.backup_run_id }}
          REHEARSAL_RUN_ID: ${{ inputs.rehearsal_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          # Checked against the API rather than asserted by whoever dispatched
          # this. "Take a backup first" is a rule that survives exactly as long
          # as the person in a hurry remembers it; every other guard here is
          # mechanical, so these two are as well.
          check_run() {
            local run_id="$1" want_workflow="$2" label="$3"
            local json conclusion path
            json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}")"
            conclusion="$(printf '%s' "${json}" | jq -r '.conclusion')"
            path="$(printf '%s' "${json}" | jq -r '.path')"
            [ "${conclusion}" = 'success' ] || {
              echo "ERROR: ${label} run ${run_id} concluded '${conclusion}', not success."
              exit 1
            }
            [ "${path}" = "${want_workflow}" ] || {
              echo "ERROR: ${label} run ${run_id} is ${path}, not ${want_workflow}."
              exit 1
            }
            echo "${label} run ${run_id} verified: success, ${path}."
          }
          check_run "${BACKUP_RUN_ID}" \
            '.github/workflows/production-backup.yml' 'Backup'
          check_run "${REHEARSAL_RUN_ID}" \
            '.github/workflows/production-174-to-178-rehearsal.yml' 'Rehearsal'

      - name: Prove the repository still holds exactly the approved contract 178
        shell: bash
        run: |
          set -euo pipefail
          committed="$(git ls-files 'supabase/migrations/*.sql' | wc -l | tr -d ' ')"
          [ "${committed}" = "${TARGET_CONTRACT}" ] || {
            echo "ERROR: repository holds ${committed} migrations, expected ${TARGET_CONTRACT}."
            exit 1
          }
          declared="$(node -p "require('./config/deployment-contract.json').requiredMigrationCount")"
          [ "${declared}" = "${TARGET_CONTRACT}" ] || {
            echo "ERROR: deployment contract declares ${declared}, expected ${TARGET_CONTRACT}."
            exit 1
          }
          newest="$(git ls-files 'supabase/migrations/*.sql' | sort | tail -1)"
          [ "$(basename "${newest}")" = "${TARGET_VERSION}_${TARGET_NAME}.sql" ] || {
            echo "ERROR: newest migration is $(basename "${newest}"), expected ${TARGET_VERSION}_${TARGET_NAME}.sql."
            exit 1
          }
          echo "Repository is exactly contract ${TARGET_CONTRACT}."

      - name: Prove every migration in the range is additive, as a GATE
        shell: bash
        run: |
          set -euo pipefail
          # A GATE. The destructive 157 -> 158 rollout had to run this as a
          # REPORT because the checker would have refused it; this range is
          # additive throughout. A future reader finding this softened back to
          # a report should stop: the boundary has changed.
          files=''
          for file in $(git ls-files 'supabase/migrations/*.sql' | sort); do
            version="$(basename "${file}")"
            version="${version:0:14}"
            if [[ "${version}" > "${SOURCE_VERSION}" && ! "${version}" > "${TARGET_VERSION}" ]]; then
              files="${files} ${file}"
            fi
          done
          count="$(printf '%s\n' ${files} | grep -c . || true)"
          [ "${count}" = "4" ] || {
            echo "ERROR: the range holds ${count} migrations, expected 4."
            printf '%s\n' ${files}
            exit 1
          }
          echo 'The four migrations being promoted:'
          printf '  %s\n' ${files}
          node scripts/check-migration-additive.mjs ${files}
          echo 'All four are additive.'

      # Pinned to the same versions the proven 157 -> 158 rollout used. Both
      # files in this pair originally omitted them; the rehearsal caught it on
      # its own runner, before this one could have reached Production without a
      # `supabase` binary.
      - uses: actions/setup-node@v7
        with:
          node-version: 22.22.2

      - uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf
        with:
          version: 2.109.1
          github-token: ${{ github.token }}

      - name: Install PostgreSQL 17 client tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17

      - name: Preflight the Production secret without printing it
        env:
          SUPABASE_PROD_DB_URL: ${{ secrets.SUPABASE_PROD_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${SUPABASE_PROD_DB_URL}" ] || {
            echo 'ERROR: repository secret SUPABASE_PROD_DB_URL is not set.'
            exit 1
          }
          case "${SUPABASE_PROD_DB_URL}" in
            *"${FORBIDDEN_DEVELOPMENT_REF}"*)
              echo 'ERROR: Production secret resolves to Development.'
              exit 1
              ;;
            *"${EXPECTED_PROJECT_REF}"*) ;;
            *)
              echo 'ERROR: Production secret does not name the expected Production project.'
              exit 1
              ;;
          esac

      - name: Capture the exact pre-apply Production state
        env:
          SUPABASE_PROD_DB_URL: ${{ secrets.SUPABASE_PROD_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          # Every relation read here exists at contract 174. A pre-apply probe
          # that reads a post-apply column is how the 151-to-157 rehearsal
          # failed on run 31445831137, and the fix was to stop asking early
          # rather than to relax the check. The cron count is captured because
          # this range schedules nothing and that has to be provable AFTER, not
          # merely intended before.
          psql "${SUPABASE_PROD_DB_URL}" -X -q -v ON_ERROR_STOP=1 -A -t -c "
            select json_build_object(
              'migration_count', (select count(*) from supabase_migrations.schema_migrations),
              'latest_version', (select version from supabase_migrations.schema_migrations order by version desc limit 1),
              'latest_name', (select name from supabase_migrations.schema_migrations order by version desc limit 1),
              'auth_users', (select count(*) from auth.users),
              'profiles', (select count(*) from public.profiles),
              'tournaments', (select count(*) from public.tournaments),
              'teams', (select count(*) from public.teams),
              'matches', (select count(*) from public.matches),
              'entries', (select count(*) from public.entries),
              'match_predictions', (select count(*) from public.match_predictions),
              'leagues', (select count(*) from public.leagues),
              'league_members', (select count(*) from public.league_members),
              'score_events', (select count(*) from public.score_events),
              'entry_totals', (select count(*) from public.entry_totals),
              'game_memberships', (select count(*) from public.game_memberships),
              'bonus_competitions', (select count(*) from public.bonus_competitions),
              'season_fixtures', (select count(*) from public.season_fixtures),
              'season_predictions', (select count(*) from public.season_predictions),
              'player_action_items', (select count(*) from public.player_action_items),
              'reminder_deliveries', (select count(*) from public.reminder_deliveries),
              'cron_jobs', (select case when to_regclass('cron.job') is null then -1
                                        else (select count(*) from cron.job) end),
              'euro_state', (select public.euro_publication_state() ->> 'state')
            )
          " > "${WORK_DIR}/before.json"
          cat "${WORK_DIR}/before.json"

          BEFORE_FILE="${WORK_DIR}/before.json" node --input-type=module <<'NODE'
          import fs from 'node:fs'
          const before = JSON.parse(fs.readFileSync(process.env.BEFORE_FILE, 'utf8'))
          const expected = {
            migration_count: Number(process.env.SOURCE_CONTRACT),
            latest_version: process.env.SOURCE_VERSION,
            latest_name: process.env.SOURCE_NAME,
          }
          for (const [key, want] of Object.entries(expected)) {
            if (String(before[key]) !== String(want)) {
              console.error(`ERROR: live Production ${key} is ${before[key]}, expected ${want}.`)
              console.error('Production is not the boundary this rollout was rehearsed against.')
              process.exit(1)
            }
          }
          console.log('Live Production is exactly the rehearsed contract-174 source boundary.')
          NODE

      - name: Dry run, and refuse anything that is not exactly contracts 175 to 178
        env:
          SUPABASE_PROD_DB_URL: ${{ secrets.SUPABASE_PROD_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          # Anything ABOVE the pinned target is held back, so the dry run
          # describes what will actually be applied. Restored by the step after
          # the apply, whatever happens.
          mkdir -p "${WORK_DIR}/later-migrations"
          : > "${WORK_DIR}/moved-files.txt"
          for file in $(git ls-files 'supabase/migrations/*.sql' | sort); do
            filename="$(basename "${file}")"
            version="${filename:0:14}"
            if [[ "${version}" > "${TARGET_VERSION}" ]]; then
              mv "${file}" "${WORK_DIR}/later-migrations/${filename}"
              printf '%s\n' "${file}" >> "${WORK_DIR}/moved-files.txt"
            fi
          done
          if [ -s "${WORK_DIR}/moved-files.txt" ]; then
            echo 'Held back as ABOVE the pinned target:'
            cat "${WORK_DIR}/moved-files.txt"
          fi

          supabase migration list --db-url "${SUPABASE_PROD_DB_URL}" \
            | tail -20
          supabase db push --db-url "${SUPABASE_PROD_DB_URL}" --dry-run \
            > "${WORK_DIR}/dry-run.txt" 2>&1
          cat "${WORK_DIR}/dry-run.txt"

          grep -oE '[0-9]{14}_[A-Za-z0-9_-]+\.sql' "${WORK_DIR}/dry-run.txt" \
            | awk '!seen[$0]++' | sort > "${WORK_DIR}/pending.txt"

          printf '%s\n' \
            '20260812000000_what_if_projection.sql' \
            '20260812001000_prediction_dna.sql' \
            '20260812002000_offline_draft_reconciliation.sql' \
            '20260812003000_shadow_scoring_verifier.sql' \
            > "${WORK_DIR}/expected.txt"
          sort -o "${WORK_DIR}/expected.txt" "${WORK_DIR}/expected.txt"

          if ! diff -u "${WORK_DIR}/expected.txt" "${WORK_DIR}/pending.txt"; then
            echo 'ERROR: the Production dry run is not exactly contracts 175 to 178.'
            exit 1
          fi
          echo 'Dry run is exactly the four approved migrations.'

      - name: Apply exactly contracts 175 to 178
        env:
          SUPABASE_PROD_DB_URL: ${{ secrets.SUPABASE_PROD_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          supabase db push --db-url "${SUPABASE_PROD_DB_URL}" \
            2>&1 | tee "${WORK_DIR}/apply.txt"

      - name: Restore the repository migration tree in the runner
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          # Runs even when the apply failed. The verification below reads the
          # database rather than the tree.
          if [ -f "${WORK_DIR}/moved-files.txt" ]; then
            while IFS= read -r file; do
              [ -n "${file}" ] || continue
              filename="$(basename "${file}")"
              if [ -e "${WORK_DIR}/later-migrations/${filename}" ]; then
                mv "${WORK_DIR}/later-migrations/${filename}" "${file}"
              fi
            done < "${WORK_DIR}/moved-files.txt"
          fi

      - name: Verify exact contract-178 Production state and that nothing was lost
        env:
          SUPABASE_PROD_DB_URL: ${{ secrets.SUPABASE_PROD_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          # NAMED ROWS, not a count. On 11 August 2026 a `select count(*)` against
          # a hosted ledger returned a stale value for twenty-five minutes after an
          # apply had succeeded, while a row-level query on the same table in the
          # same session returned the truth immediately. A count is the shape that
          # looks most like proof and is the one that went stale.
          psql "${SUPABASE_PROD_DB_URL}" -X -q -v ON_ERROR_STOP=1 -A -t -c "
            select json_build_object(
              'migration_count', (select count(*) from supabase_migrations.schema_migrations),
              'latest_version', (select version from supabase_migrations.schema_migrations order by version desc limit 1),
              'latest_name', (select name from supabase_migrations.schema_migrations order by version desc limit 1),
              'range_rows_present', (
                select count(*) from supabase_migrations.schema_migrations
                 where version in ('20260812000000','20260812001000',
                                   '20260812002000','20260812003000')),

              -- THE PROPERTY THIS ROLLOUT EXISTS TO PUT IN PRODUCTION. A verifier
              -- that names the implementation it verifies agrees with it by
              -- construction and reports a green tick for ever, which looks
              -- exactly like a working control. Read off the installed
              -- definition rather than trusted from the migration text.
              'verifier_is_independent', (
                select pg_get_functiondef(p.oid) !~ 'season_fixture_points'
                   and pg_get_functiondef(p.oid) !~ 'season_matchweek_points'
                  from pg_proc p join pg_namespace n on n.oid = p.pronamespace
                 where n.nspname = 'predictor_internal' and p.proname = 'shadow_matchweek_points'),
              'projection_reuses_authority', (
                select pg_get_functiondef(p.oid) ~ 'season_fixture_points'
                  from pg_proc p join pg_namespace n on n.oid = p.pronamespace
                 where n.nspname = 'predictor_internal' and p.proname = 'season_matchweek_projection'),
              'batch_has_no_second_write_path', (
                select pg_get_functiondef(p.oid) ~ 'save_season_prediction\('
                   and pg_get_functiondef(p.oid) !~* 'insert\s+into\s+public\.season_predictions'
                  from pg_proc p join pg_namespace n on n.oid = p.pronamespace
                 where n.nspname = 'public' and p.proname = 'save_season_predictions_batch'),

              'new_functions', (
                select count(*) from pg_proc p join pg_namespace n on n.oid = p.pronamespace
                 where n.nspname = 'public'
                   and p.proname in ('get_season_matchweek_projection','get_season_prediction_dna',
                                     'save_season_predictions_batch','run_shadow_scoring_verification',
                                     'admin_shadow_scoring_report')),
              'run_browser_reachable', (
                select count(*) from information_schema.role_routine_grants
                 where routine_schema = 'public' and routine_name = 'run_shadow_scoring_verification'
                   and grantee in ('anon','authenticated','PUBLIC')),
              'reads_browser_reachable', (
                select count(*) from information_schema.role_routine_grants
                 where routine_schema = 'public'
                   and routine_name in ('get_season_matchweek_projection','get_season_prediction_dna',
                                        'save_season_predictions_batch','admin_shadow_scoring_report')
                   and grantee = 'authenticated'),
              'reads_anon_reachable', (
                select count(*) from information_schema.role_routine_grants
                 where routine_schema = 'public'
                   and routine_name in ('get_season_matchweek_projection','get_season_prediction_dna',
                                        'save_season_predictions_batch','admin_shadow_scoring_report',
                                        'run_shadow_scoring_verification')
                   and grantee in ('anon','PUBLIC')),

              'new_internal_tables', (
                select count(*) from pg_tables
                 where schemaname = 'predictor_internal'
                   and tablename in ('shadow_scoring_runs','shadow_scoring_mismatches')),
              'new_tables_granted_to_browser', (
                select count(*) from information_schema.role_table_grants
                 where table_schema = 'predictor_internal'
                   and table_name in ('shadow_scoring_runs','shadow_scoring_mismatches')
                   and grantee in ('anon','authenticated')),
              'new_tables_empty', (
                select (select count(*) from predictor_internal.shadow_scoring_runs)
                     + (select count(*) from predictor_internal.shadow_scoring_mismatches)),

              -- No job was scheduled. The verifier deliberately has no caller.
              'verifier_scheduled', (
                select case when to_regclass('cron.job') is null then 0
                            else (select count(*) from cron.job
                                   where command like '%run_shadow_scoring_verification%') end),
              'cron_jobs', (select case when to_regclass('cron.job') is null then -1
                                        else (select count(*) from cron.job) end),

              'euro_state', (select public.euro_publication_state() ->> 'state'),

              'auth_users', (select count(*) from auth.users),
              'profiles', (select count(*) from public.profiles),
              'tournaments', (select count(*) from public.tournaments),
              'teams', (select count(*) from public.teams),
              'matches', (select count(*) from public.matches),
              'entries', (select count(*) from public.entries),
              'match_predictions', (select count(*) from public.match_predictions),
              'leagues', (select count(*) from public.leagues),
              'league_members', (select count(*) from public.league_members),
              'score_events', (select count(*) from public.score_events),
              'entry_totals', (select count(*) from public.entry_totals),
              'game_memberships', (select count(*) from public.game_memberships),
              'bonus_competitions', (select count(*) from public.bonus_competitions),
              'season_fixtures', (select count(*) from public.season_fixtures),
              'season_predictions', (select count(*) from public.season_predictions),
              'player_action_items', (select count(*) from public.player_action_items),
              'reminder_deliveries', (select count(*) from public.reminder_deliveries)
            )
          " > "${WORK_DIR}/after.json"
          cat "${WORK_DIR}/after.json"

          AFTER_FILE="${WORK_DIR}/after.json" BEFORE_FILE="${WORK_DIR}/before.json" \
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          const after = JSON.parse(fs.readFileSync(process.env.AFTER_FILE, 'utf8'))
          const before = JSON.parse(fs.readFileSync(process.env.BEFORE_FILE, 'utf8'))

          const expected = {
            migration_count: Number(process.env.TARGET_CONTRACT),
            latest_version: process.env.TARGET_VERSION,
            latest_name: process.env.TARGET_NAME,
            // The four, named. A count alone would pass on the wrong four.
            range_rows_present: 4,
            verifier_is_independent: true,
            projection_reuses_authority: true,
            batch_has_no_second_write_path: true,
            new_functions: 5,
            run_browser_reachable: 0,
            reads_browser_reachable: 4,
            reads_anon_reachable: 0,
            new_internal_tables: 2,
            new_tables_granted_to_browser: 0,
            new_tables_empty: 0,
            verifier_scheduled: 0,
          }
          for (const [key, want] of Object.entries(expected)) {
            if (String(after[key]) !== String(want)) {
              console.error(`ERROR: Production ${key} is ${after[key]}, expected ${want}.`)
              process.exit(1)
            }
          }

          // Unchanged rather than absolute: this range schedules nothing, so the
          // claim is that the number did not move. An absolute would fail for a
          // purely environmental reason, which is the trap the 172-to-174
          // rehearsal recorded when a restored dump held zero cron jobs.
          for (const key of ['cron_jobs', 'euro_state']) {
            if (String(before[key]) !== String(after[key])) {
              console.error(`ERROR: ${key} moved ${before[key]} -> ${after[key]}; this range moves neither.`)
              process.exit(1)
            }
          }
          if (after.euro_state !== 'hidden') {
            console.error(`ERROR: Euro publication state is ${after.euro_state}; this rollout publishes nothing.`)
            process.exit(1)
          }

          // Every count the pre-apply step captured, compared. Additive by the
          // checker is a claim about the SQL; this is the claim about the data.
          const counted = ['auth_users','profiles','tournaments','teams','matches','entries',
                           'match_predictions','leagues','league_members','score_events',
                           'entry_totals','game_memberships','bonus_competitions',
                           'season_fixtures','season_predictions','player_action_items',
                           'reminder_deliveries']
          for (const key of counted) {
            if (String(before[key]) !== String(after[key])) {
              console.error(`ERROR: ${key} moved ${before[key]} -> ${after[key]}; this range rewrites no row.`)
              process.exit(1)
            }
          }

          console.log(`Production is at contract ${after.migration_count}, all four rows named and present.`)
          console.log('The verifier names neither canonical scoring function; the projection names one.')
          console.log(`${after.cron_jobs} scheduled job(s), unchanged, and none of them the verifier.`)
          console.log(`Euro publication state: ${after.euro_state}.`)
          for (const key of counted) console.log(`  ${key}: ${after[key]} (unchanged)`)
          NODE

      - name: Say plainly what remains gated
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '## Production is at contract 178'
            echo
            echo 'Schema only. This rollout did NOT:'
            echo
            echo '- schedule any job. Contract 178 is a verifier with NO caller by design, and'
            echo '  the postflight proves no scheduled command names it. Giving it one is a'
            echo '  separate decision, not a consequence of the schema being present;'
            echo '- correct any banked total. The verifier records disagreements as evidence and'
            echo '  has no authority over a score;'
            echo '- publish Euro 2028 — contract 143 stays `hidden` and publication is an owner act;'
            echo '- launch any competition, draw any Championship or open any Last Man Standing;'
            echo '- promote the application. Nothing in the range is browser-reachable until a'
            echo '  build carrying it is published, which is a separate, separately approved step;'
            echo '- import any football.'
            echo
            echo 'Three of the five new functions are reachable by `authenticated` and resolve'
            echo 'their own boundary internally; `admin_shadow_scoring_report` refuses inside on'
            echo '`require_competition_admin()`; `run_shadow_scoring_verification` is'
            echo '`service_role` only. No anonymous role reaches any of them.'
            echo
            echo 'Reconcile `config/production-hosted-contract.json` from an independent read-only'
            echo 'ledger query that NAMES the expected rows rather than counting them.'
          } >> "${GITHUB_STEP_SUMMARY}"
