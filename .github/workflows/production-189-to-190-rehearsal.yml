name: Production 189 to 190 rehearsal

# Read-only rehearsal of Contract 190 against a disposable copy of Production.
# The encrypted backup remains the rollback authority; its private age key stays
# offline. This workflow independently reads Production only through dumps and
# applies the one approved migration to a disposable restore.

on:
  workflow_dispatch:
    inputs:
      project_ref:
        description: Exact Production project ref confirmation
        required: true
      confirmation:
        description: Type REHEARSE-PRODUCTION-189-TO-190 to proceed
        required: true
      backup_run_id:
        description: Run id of the successful fresh Production backup
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: production-189-to-190-rehearsal
  cancel-in-progress: false

env:
  EXPECTED_PROJECT_REF: vkfnsqdyhvtwyqkisxhk
  FORBIDDEN_DEVELOPMENT_REF: iouzoutneyjpugbbtdem
  CONFIRMATION_PHRASE: REHEARSE-PRODUCTION-189-TO-190
  SOURCE_CONTRACT: '189'
  SOURCE_VERSION: '20260813215920'
  SOURCE_NAME: ai_quarantined_evidence_reads
  TARGET_CONTRACT: '190'
  TARGET_VERSION: '20260814005000'
  TARGET_NAME: ai_actionable_bet_evidence
  WORK_DIR: /tmp/production-189-to-190-rehearsal
  LOCAL_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres

jobs:
  rehearse:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Refuse an unsafe dispatch or repository state
        env:
          INPUT_PROJECT_REF: ${{ inputs.project_ref }}
          INPUT_CONFIRMATION: ${{ inputs.confirmation }}
        shell: bash
        run: |
          set -euo pipefail
          [ "${INPUT_CONFIRMATION}" = "${CONFIRMATION_PHRASE}" ] || {
            echo "ERROR: confirmation phrase does not match ${CONFIRMATION_PHRASE}."
            exit 1
          }
          [ "${INPUT_PROJECT_REF}" != "${FORBIDDEN_DEVELOPMENT_REF}" ] || {
            echo 'ERROR: that is the Development project.'
            exit 1
          }
          [ "${INPUT_PROJECT_REF}" = "${EXPECTED_PROJECT_REF}" ] || {
            echo 'ERROR: project ref confirmation does not name Production.'
            exit 1
          }
          [ "${GITHUB_REF}" = 'refs/heads/main' ] || {
            echo 'ERROR: Production rehearsal runs only from refs/heads/main.'
            exit 1
          }
          git fetch --no-tags origin main
          [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" ] || {
            echo 'ERROR: checked-out HEAD is not exact origin/main.'
            exit 1
          }
          [ -z "$(git status --porcelain=v1 --untracked-files=all)" ] || {
            echo 'ERROR: checkout is not clean.'
            exit 1
          }
          mkdir -p "${WORK_DIR}"

      - name: Prove the fresh encrypted backup authority exists
        env:
          GH_TOKEN: ${{ github.token }}
          BACKUP_RUN_ID: ${{ inputs.backup_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${BACKUP_RUN_ID}")"
          conclusion="$(jq -r '.conclusion' <<<"${json}")"
          path="$(jq -r '.path' <<<"${json}")"
          backup_sha="$(jq -r '.head_sha' <<<"${json}")"
          created="$(jq -r '.created_at' <<<"${json}")"
          [ "${conclusion}" = success ] || { echo "ERROR: backup concluded ${conclusion}."; exit 1; }
          [ "${path}" = '.github/workflows/production-backup.yml' ] || {
            echo "ERROR: run is ${path}, not Production backup."; exit 1;
          }
          git merge-base --is-ancestor "${backup_sha}" HEAD || {
            echo "ERROR: backup head ${backup_sha} is not an ancestor of this rehearsal head."; exit 1;
          }
          artifacts="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${BACKUP_RUN_ID}/artifacts")"
          [ "$(jq '[.artifacts[] | select(.name == "production-backup-encrypted" and .expired == false)] | length' <<<"${artifacts}")" = 1 ] || {
            echo 'ERROR: fresh backup does not have exactly one live encrypted artifact.'; exit 1;
          }
          echo "Backup ${BACKUP_RUN_ID} verified: ${created}, head ${backup_sha}, encrypted artifact present."

      - name: Prove repository boundary is exactly 189 to 190
        shell: bash
        run: |
          set -euo pipefail
          committed="$(git ls-files 'supabase/migrations/*.sql' | wc -l | tr -d ' ')"
          declared="$(node -p "require('./config/deployment-contract.json').requiredMigrationCount")"
          newest="$(basename "$(git ls-files 'supabase/migrations/*.sql' | sort | tail -1)")"
          [ "${committed}" = "${TARGET_CONTRACT}" ] || { echo "ERROR: repository has ${committed} migrations."; exit 1; }
          [ "${declared}" = "${TARGET_CONTRACT}" ] || { echo "ERROR: deployment contract is ${declared}."; exit 1; }
          [ "${newest}" = "${TARGET_VERSION}_${TARGET_NAME}.sql" ] || { echo "ERROR: newest migration is ${newest}."; exit 1; }
          files=''
          for file in $(git ls-files 'supabase/migrations/*.sql' | sort); do
            version="$(basename "${file}")"; version="${version:0:14}"
            if [[ "${version}" > "${SOURCE_VERSION}" && ! "${version}" > "${TARGET_VERSION}" ]]; then
              files="${files} ${file}"
            fi
          done
          # Declared, not rewritten: the migration list is split on purpose; quoting passes one argument, not many. This is a spent one-shot promotion
          # script; changing what it DOES to satisfy a style rule would edit the
          # record of a past production apply. shellcheck only began seeing it
          # when SHA-pinning marked the file changed, so it is pre-existing.
          # shellcheck disable=SC2086
          [ "$(printf '%s\n' ${files} | grep -c . || true)" = 1 ] || {
            # Declared, not rewritten: the migration list is split on purpose; quoting passes one argument, not many. This is a spent one-shot promotion
            # script; changing what it DOES to satisfy a style rule would edit the
            # record of a past production apply. shellcheck only began seeing it
            # when SHA-pinning marked the file changed, so it is pre-existing.
            # shellcheck disable=SC2086
            echo 'ERROR: boundary does not contain exactly one migration.'; printf '%s\n' ${files}; exit 1;
          }
          # Declared, not rewritten: the migration list is split on purpose; quoting passes one argument, not many. This is a spent one-shot promotion
          # script; changing what it DOES to satisfy a style rule would edit the
          # record of a past production apply. shellcheck only began seeing it
          # when SHA-pinning marked the file changed, so it is pre-existing.
          # shellcheck disable=SC2086
          [ "$(basename ${files})" = "${TARGET_VERSION}_${TARGET_NAME}.sql" ] || {
            echo 'ERROR: the one migration is not Contract 190.'; exit 1;
          }
          # Declared, not rewritten: the migration list is split on purpose; quoting passes one argument, not many. This is a spent one-shot promotion
          # script; changing what it DOES to satisfy a style rule would edit the
          # record of a past production apply. shellcheck only began seeing it
          # when SHA-pinning marked the file changed, so it is pre-existing.
          # shellcheck disable=SC2086
          node scripts/check-migration-additive.mjs ${files}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.22.2

      - uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf
        with:
          version: 2.109.1
          github-token: ${{ github.token }}

      - name: Install PostgreSQL 17 client tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17

      - name: Preflight Production and prove live source is exactly 189
        env:
          SUPABASE_PROD_DB_URL: ${{ secrets.SUPABASE_PROD_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${SUPABASE_PROD_DB_URL}" ] || { echo 'ERROR: SUPABASE_PROD_DB_URL missing.'; exit 1; }
          case "${SUPABASE_PROD_DB_URL}" in
            *"${FORBIDDEN_DEVELOPMENT_REF}"*) echo 'ERROR: Production secret resolves to Development.'; exit 1 ;;
            *"${EXPECTED_PROJECT_REF}"*) ;;
            *) echo 'ERROR: Production secret does not name Production.'; exit 1 ;;
          esac
          psql "${SUPABASE_PROD_DB_URL}" -X -q -v ON_ERROR_STOP=1 -A -t -f - > "${WORK_DIR}/live.json" <<'SQL'
          select jsonb_build_object(
            'migration_count',(select count(*) from supabase_migrations.schema_migrations),
            'latest_version',(select version from supabase_migrations.schema_migrations order by version desc limit 1),
            'latest_name',(select name from supabase_migrations.schema_migrations order by version desc limit 1),
            'bets',(select count(*) from ai.bets),
            'valid_bets',(select count(*) from ai.valid_bets),
            'synthetic_valid',(select count(*) from ai.valid_bets vb left join ai.bookmakers bk on bk.code=vb.bookmaker where bk.code is null or not coalesce(bk.is_real_price,false) or bk.kind='aggregate'),
            'real_valid',(select count(*) from ai.valid_bets vb join ai.bookmakers bk on bk.code=vb.bookmaker where bk.is_real_price and bk.kind<>'aggregate'),
            'api_usage',(select count(*) from ai.api_usage),
            'collection_enabled',(select collection_enabled from ai.api_budget limit 1),
            'cron_jobs',(select count(*) from cron.job),
            'ai_odds_cron_jobs',(select count(*) from cron.job where jobname like 'ai-odds%'));
          SQL
          cat "${WORK_DIR}/live.json"
          LIVE_FILE="${WORK_DIR}/live.json" node --input-type=module <<'NODE'
          import fs from 'node:fs'
          const x=JSON.parse(fs.readFileSync(process.env.LIVE_FILE,'utf8'))
          const want={migration_count:Number(process.env.SOURCE_CONTRACT),latest_version:process.env.SOURCE_VERSION,latest_name:process.env.SOURCE_NAME}
          for (const [k,v] of Object.entries(want)) if (String(x[k])!==String(v)) throw new Error(`Production ${k}=${x[k]}, expected ${v}`)
          if (Number(x.synthetic_valid)<1) throw new Error('No synthetic actionable evidence remains to falsify on source Contract 189.')
          if (x.collection_enabled !== true) throw new Error('Paid collection is not enabled before rehearsal.')
          if (Number(x.ai_odds_cron_jobs)!==4) throw new Error(`Expected four ai-odds cron jobs, found ${x.ai_odds_cron_jobs}`)
          NODE

      - name: Dump Production and restore disposable copy
        env:
          SUPABASE_PROD_DB_URL: ${{ secrets.SUPABASE_PROD_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          supabase init --force --workdir "${WORK_DIR}" >/dev/null 2>&1 || true
          supabase start --workdir "${WORK_DIR}"
          BUNDLE="${WORK_DIR}/bundle"; ROLLOUT="${GITHUB_WORKSPACE}/scripts/database-rollout"; mkdir -p "${BUNDLE}"
          supabase db dump --db-url "${SUPABASE_PROD_DB_URL}" --file "${BUNDLE}/roles.sql" --role-only
          supabase db dump --db-url "${SUPABASE_PROD_DB_URL}" --file "${BUNDLE}/schema.sql"
          supabase db dump --db-url "${SUPABASE_PROD_DB_URL}" --file "${BUNDLE}/data.sql" --use-copy --data-only -x storage.buckets_vectors -x storage.vector_indexes
          /usr/lib/postgresql/17/bin/pg_dump --dbname "${SUPABASE_PROD_DB_URL}" --schema supabase_migrations --no-owner --no-privileges --file "${BUNDLE}/migration-history.sql"
          for f in roles.sql schema.sql data.sql migration-history.sql; do [ -s "${BUNDLE}/${f}" ] || { echo "ERROR: missing ${f}"; exit 1; }; done
          grep -Eq '(COPY|INSERT INTO)[[:space:]]+"?ai"?\."?bets"?' "${BUNDLE}/data.sql" || { echo 'ERROR: ai.bets missing from dump.'; exit 1; }
          psql "${LOCAL_DB_URL}" -X --single-transaction -v ON_ERROR_STOP=1 --file "${BUNDLE}/roles.sql"
          psql "${LOCAL_DB_URL}" -X --single-transaction -v ON_ERROR_STOP=1 --file "${ROLLOUT}/prepare-disposable-restore-target.sql"
          psql "${LOCAL_DB_URL}" -X --single-transaction -v ON_ERROR_STOP=1 --file "${BUNDLE}/schema.sql"
          psql "${LOCAL_DB_URL}" -X --single-transaction -v ON_ERROR_STOP=1 --command 'SET session_replication_role = replica' --file "${BUNDLE}/data.sql"
          psql "${LOCAL_DB_URL}" -X --single-transaction -v ON_ERROR_STOP=1 --file "${ROLLOUT}/managed-schema-customizations.sql"
          psql "${LOCAL_DB_URL}" -X --single-transaction -v ON_ERROR_STOP=1 --file "${BUNDLE}/migration-history.sql"
          restored="$(psql "${LOCAL_DB_URL}" -X -q -A -t -v ON_ERROR_STOP=1 -c 'select count(*) from supabase_migrations.schema_migrations')"
          [ "${restored}" = "${SOURCE_CONTRACT}" ] || { echo "ERROR: restored contract ${restored}."; exit 1; }

      - name: Measure snapshot before apply
        shell: bash
        run: |
          set -euo pipefail
          psql "${LOCAL_DB_URL}" -X -q -A -t -v ON_ERROR_STOP=1 -f - > "${WORK_DIR}/before.json" <<'SQL'
          select jsonb_build_object(
            'bets',(select count(*) from ai.bets),
            'valid_bets',(select count(*) from ai.valid_bets),
            'synthetic_valid',(select count(*) from ai.valid_bets vb left join ai.bookmakers bk on bk.code=vb.bookmaker where bk.code is null or not coalesce(bk.is_real_price,false) or bk.kind='aggregate'),
            'real_valid',(select count(*) from ai.valid_bets vb join ai.bookmakers bk on bk.code=vb.bookmaker where bk.is_real_price and bk.kind<>'aggregate'),
            'api_usage',(select count(*) from ai.api_usage),
            'collection_enabled',(select collection_enabled from ai.api_budget limit 1),
            'cron_fingerprint',(select md5(coalesce(string_agg(jobid::text||'|'||jobname||'|'||schedule||'|'||command||'|'||active::text,E'\n' order by jobid),'')) from cron.job));
          SQL
          cat "${WORK_DIR}/before.json"

      - name: Apply exactly Contract 190 to disposable copy
        shell: bash
        run: |
          set -euo pipefail
          supabase db push --db-url "${LOCAL_DB_URL}" --dry-run > "${WORK_DIR}/dry-run.txt" 2>&1
          cat "${WORK_DIR}/dry-run.txt"
          grep -oE '[0-9]{14}_[A-Za-z0-9_-]+\.sql' "${WORK_DIR}/dry-run.txt" | awk '!seen[$0]++' | sort > "${WORK_DIR}/pending.txt"
          printf '%s\n' "${TARGET_VERSION}_${TARGET_NAME}.sql" > "${WORK_DIR}/expected.txt"
          diff -u "${WORK_DIR}/expected.txt" "${WORK_DIR}/pending.txt" || { echo 'ERROR: dry run is not exactly Contract 190.'; exit 1; }
          supabase db push --db-url "${LOCAL_DB_URL}"

      - name: Run only the Contract 190 behavioral pgTAP suite
        shell: bash
        run: |
          set +e
          PGTAP_LOG="${WORK_DIR}/237-actionable-bet-evidence.log"
          TEST_REL="supabase/tests/237_actionable_bet_evidence.sql"
          mkdir -p "${WORK_DIR}/supabase/tests"
          cp "${GITHUB_WORKSPACE}/${TEST_REL}" "${WORK_DIR}/${TEST_REL}"
          cmp "${GITHUB_WORKSPACE}/${TEST_REL}" "${WORK_DIR}/${TEST_REL}"
          (
            cd "${WORK_DIR}"
            supabase test db "${TEST_REL}" --db-url "${LOCAL_DB_URL}"
          ) >"${PGTAP_LOG}" 2>&1
          status=$?
          cat "${PGTAP_LOG}"

          tests="$(grep -oE 'Tests=[0-9]+' "${PGTAP_LOG}" | tail -1 | cut -d= -f2 || true)"
          result="$(grep -oE 'Result: (PASS|FAIL)' "${PGTAP_LOG}" | tail -1 | awk '{print $2}' || true)"
          plan_started=false
          if grep -Eq '(^|[[:space:]])1\.\.14([[:space:]]|$)|Tests=14' "${PGTAP_LOG}"; then plan_started=true; fi

          if [ "${status}" -ne 0 ]; then
            excerpt="$(tail -n 80 "${PGTAP_LOG}" | tr '\n' ' ' | sed 's/%/%25/g')"
            echo "::error title=Contract 190 pgTAP failed::exit=${status}; tests=${tests:-0}; plan_started=${plan_started}; ${excerpt}"
            exit "${status}"
          fi

          if [ "${tests:-0}" != 14 ] || [ "${result:-}" != PASS ]; then
            excerpt="$(tail -n 80 "${PGTAP_LOG}" | tr '\n' ' ' | sed 's/%/%25/g')"
            echo "::error title=Contract 190 pgTAP invalid success::exit=${status}; tests=${tests:-0}; result=${result:-missing}; plan_started=${plan_started}; ${excerpt}"
            exit 1
          fi

          echo "Contract 190 pgTAP completed: 14/14 assertions PASS."

      - name: Verify installed Contract 190 behavior on Production snapshot
        shell: bash
        run: |
          set -euo pipefail
          psql "${LOCAL_DB_URL}" -X -q -A -t -v ON_ERROR_STOP=1 -f - > "${WORK_DIR}/after.json" <<'SQL'
          select jsonb_build_object(
            'migration_count',(select count(*) from supabase_migrations.schema_migrations),
            'latest_version',(select version from supabase_migrations.schema_migrations order by version desc limit 1),
            'latest_name',(select name from supabase_migrations.schema_migrations order by version desc limit 1),
            'target_row_present',(select count(*) from supabase_migrations.schema_migrations where version='20260814005000' and name='ai_actionable_bet_evidence'),
            'bets',(select count(*) from ai.bets),
            'valid_bets',(select count(*) from ai.valid_bets),
            'synthetic_valid',(select count(*) from ai.valid_bets vb left join ai.bookmakers bk on bk.code=vb.bookmaker where bk.code is null or not coalesce(bk.is_real_price,false) or bk.kind='aggregate'),
            'real_valid',(select count(*) from ai.valid_bets vb join ai.bookmakers bk on bk.code=vb.bookmaker where bk.is_real_price and bk.kind<>'aggregate'),
            'api_usage',(select count(*) from ai.api_usage),
            'collection_enabled',(select collection_enabled from ai.api_budget limit 1),
            'cron_fingerprint',(select md5(coalesce(string_agg(jobid::text||'|'||jobname||'|'||schedule||'|'||command||'|'||active::text,E'\n' order by jobid),'')) from cron.job),
            'valid_view_real_guard',(position('is_real_price' in pg_get_viewdef('ai.valid_bets'::regclass,true))>0 and position('aggregate' in pg_get_viewdef('ai.valid_bets'::regclass,true))>0),
            'insert_guard',(position('not v_real' in pg_get_functiondef('ai.reject_unbettable_price()'::regprocedure))>0 and position('aggregate' in pg_get_functiondef('ai.reject_unbettable_price()'::regprocedure))>0),
            'bet_builder_guard',(position('not v_book.is_real_price' in pg_get_functiondef('public.admin_ai_bet_builder_candidates(text,text[],timestamp with time zone,timestamp with time zone,integer)'::regprocedure))>0));
          SQL
          cat "${WORK_DIR}/after.json"
          BEFORE_FILE="${WORK_DIR}/before.json" AFTER_FILE="${WORK_DIR}/after.json" node --input-type=module <<'NODE'
          import fs from 'node:fs'
          const b=JSON.parse(fs.readFileSync(process.env.BEFORE_FILE,'utf8')), a=JSON.parse(fs.readFileSync(process.env.AFTER_FILE,'utf8'))
          const p=[]; const eq=(k,v)=>String(a[k])===String(v)||p.push(`${k}=${a[k]}, expected ${v}`)
          eq('migration_count',Number(process.env.TARGET_CONTRACT)); eq('latest_version',process.env.TARGET_VERSION); eq('latest_name',process.env.TARGET_NAME); eq('target_row_present',1)
          eq('bets',b.bets); eq('synthetic_valid',0); eq('real_valid',b.real_valid); eq('valid_bets',b.real_valid)
          eq('api_usage',b.api_usage); eq('collection_enabled',b.collection_enabled); eq('cron_fingerprint',b.cron_fingerprint)
          eq('valid_view_real_guard',true); eq('insert_guard',true); eq('bet_builder_guard',true)
          if (Number(b.synthetic_valid)<1) p.push('source snapshot had no synthetic actionable evidence')
          if (p.length) { console.error('REHEARSAL FAILED:\n - '+p.join('\n - ')); process.exit(1) }
          console.log(`Contract 190 rehearsal passed: base bets ${b.bets} preserved; actionable ${b.valid_bets} -> ${a.valid_bets}; synthetic ${b.synthetic_valid} -> 0.`)
          NODE

      - name: Shred plaintext dumps and stop disposable target
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -d "${WORK_DIR}/bundle" ]; then find "${WORK_DIR}/bundle" -type f -exec shred -u {} + 2>/dev/null || true; rm -rf "${WORK_DIR}/bundle"; fi
          supabase stop --no-backup --workdir "${WORK_DIR}" || true