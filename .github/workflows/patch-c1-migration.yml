name: Patch C1 migration

# One-shot branch helper. Removed immediately after the migration repair commit.
on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/patch-c1-migration.yml

permissions:
  contents: write

jobs:
  patch-migration:
    if: github.head_ref == 'agent/stage-c1-migration'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stage-c1-migration
      - name: Apply exact migration repairs
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('supabase/migrations/20260730235602_stage_c1_competition_season_foundation.sql')
          source = path.read_text()

          source = source.replace(
              "create or replace function public.enforce_entry_lock_generic()\nreturns trigger\nlanguage plpgsql\nset search_path = ''",
              "create or replace function public.enforce_entry_lock_generic()\nreturns trigger\nlanguage plpgsql\nsecurity definer\nset search_path = ''",
              1,
          )
          source = source.replace(
              "create or replace function public.enforce_entry_lock_scores()\nreturns trigger\nlanguage plpgsql\nset search_path = ''",
              "create or replace function public.enforce_entry_lock_scores()\nreturns trigger\nlanguage plpgsql\nsecurity definer\nset search_path = ''",
              1,
          )

          generic_old = """    if v_kickoff is null then
              raise exception 'This prediction is unavailable — the match has no scheduled kickoff'
                using errcode = 'check_violation';
            end if;

            select exists (
              select 1
              from public.competition_lock_events le
              where le.tournament_id = v_tournament
                and le.scope_type = 'match'
                and le.scope_key = v_match::text
            )
            into v_locked;

            if v_locked or clock_timestamp() >= v_kickoff then
              raise exception 'This prediction is locked — the match has kicked off'
                using errcode = 'check_violation';
            end if;"""
          generic_new = """    select exists (
              select 1
              from public.competition_lock_events le
              where le.tournament_id = v_tournament
                and le.scope_type = 'match'
                and le.scope_key = v_match::text
            )
            into v_locked;

            if v_locked
               or (v_kickoff is not null and clock_timestamp() >= v_kickoff)
            then
              raise exception 'This prediction is locked — the match has kicked off'
                using errcode = 'check_violation';
            end if;"""
          if generic_old not in source:
              raise SystemExit('generic kickoff block not found')
          source = source.replace(generic_old, generic_new, 1)

          score_old = """  if v_kickoff is null then
              raise exception 'This prediction is unavailable — the match has no scheduled kickoff'
                using errcode = 'check_violation';
            end if;

            select exists (
              select 1
              from public.competition_lock_events le
              where le.tournament_id = v_tournament
                and le.scope_type = 'match'
                and le.scope_key = new.match_id::text
            )
            into v_locked;

            if v_locked or clock_timestamp() >= v_kickoff then
              raise exception 'This prediction is locked — the match has kicked off'
                using errcode = 'check_violation';
            end if;"""
          score_new = """  select exists (
              select 1
              from public.competition_lock_events le
              where le.tournament_id = v_tournament
                and le.scope_type = 'match'
                and le.scope_key = new.match_id::text
            )
            into v_locked;

            if v_locked
               or (v_kickoff is not null and clock_timestamp() >= v_kickoff)
            then
              raise exception 'This prediction is locked — the match has kicked off'
                using errcode = 'check_violation';
            end if;"""
          if score_old not in source:
              raise SystemExit('score kickoff block not found')
          source = source.replace(score_old, score_new, 1)

          source += """

-- Constraint helpers must remain callable when an authorised role writes the
-- protected row, while trigger authorities keep their internal reads private.
grant execute on function predictor_internal.is_valid_timezone(text)
  to anon, authenticated, service_role;
revoke all on function public.enforce_entry_lock_generic()
  from public, anon, authenticated;
revoke all on function public.enforce_entry_lock_scores()
  from public, anon, authenticated;
"""

          path.write_text(source)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations/20260730235602_stage_c1_competition_season_foundation.sql
          git commit -m "Repair Stage C1 lock compatibility"
          git push origin HEAD:agent/stage-c1-migration
