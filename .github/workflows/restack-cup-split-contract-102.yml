name: Restack Cup split persistence as contract 102

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]

permissions:
  contents: write

jobs:
  restack:
    if: github.head_ref == 'claude/cup-split-stage-persistence'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/cup-split-stage-persistence
          fetch-depth: 0

      - name: Reapply the proven Cup persistence change after contract 101
        run: |
          git fetch origin 0c201c2dd785cc9dad3d7026743619e616037d77
          python - <<'PY'
          from pathlib import Path
          import json
          import re
          import subprocess

          OLD = '0c201c2dd785cc9dad3d7026743619e616037d77'

          def old(path: str) -> str:
              return subprocess.check_output(['git', 'show', f'{OLD}:{path}'], text=True)

          def write(path: str, text: str) -> None:
              target = Path(path)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(text)

          def replace_once(text: str, before: str, after: str, label: str) -> str:
              count = text.count(before)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              return text.replace(before, after)

          # Reapply the already-tested persistence contract after the reveal migration.
          migration = old('supabase/migrations/20260804293000_cup_split_stage_persistence.sql')
          migration = migration.replace('Contract 101', 'Contract 102').replace('contract 101', 'contract 102')
          write('supabase/migrations/20260804323000_cup_split_stage_persistence.sql', migration)

          parity = old('tests/database-parity/cupSplitStagePersistence.test.ts')
          parity = parity.replace('20260804293000_cup_split_stage_persistence.sql', '20260804323000_cup_split_stage_persistence.sql')
          parity = parity.replace('Contract 101', 'Contract 102').replace('contract 101', 'contract 102')
          write('tests/database-parity/cupSplitStagePersistence.test.ts', parity)

          pgtap = old('supabase/tests/151_cup_split_stage_persistence.sql')
          pgtap = pgtap.replace('Contract 101', 'Contract 102').replace('contract 101', 'contract 102')
          pgtap = pgtap.replace('c101', 'c102')
          write('supabase/tests/153_cup_split_stage_persistence.sql', pgtap)

          trigger_test = old('tests/database-parity/stageCTriggerBindingCoverage.test.ts')
          trigger_test = trigger_test.replace("contract 101's", "contract 102's")
          trigger_test = trigger_test.replace('Contract 101:', 'Contract 102:')
          write('tests/database-parity/stageCTriggerBindingCoverage.test.ts', trigger_test)

          trigger_doc = old('docs/architecture/stage-c-trigger-bindings.md')
          trigger_doc = trigger_doc.replace('Contract 101', 'Contract 102').replace('contract 101', 'contract 102')
          write('docs/architecture/stage-c-trigger-bindings.md', trigger_doc)

          # The old exact-head run found and corrected this live assertion-name drift.
          write(
              'docs/architecture/stage-c1-contract-classification.md',
              old('docs/architecture/stage-c1-contract-classification.md'),
          )

          contract_path = Path('config/deployment-contract.json')
          contract = json.loads(contract_path.read_text())
          contract['contractVersion'] = 102
          contract['requiredMigrationCount'] = 102
          contract['notes'] = (
              'Tagged repository baseline euro-2028-baseline remains contract 63. '
              'Contracts 64–100 establish the multi-competition season foundations, domestic game engines, '
              'Cup-neutral sources, provider custody and the two tournament-path corrections. Contract 101 '
              'removes obsolete shared-league gating from Euro post-lock reveal without widening pre-lock access. '
              'Contract 102 persists the Predictor Championship split as a distinct phase: phase-aware groups and '
              'memberships, parentage, a real split fixture stage and explicit protection of the existing tournament '
              'authorities. Hosted deployment remains separately guarded and is not claimed by this repository contract.'
          )
          contract_path.write_text(json.dumps(contract, indent=2) + '\n')

          seed_path = Path('e2e/seed-contract.ts')
          seed = seed_path.read_text()
          seed = replace_once(
              seed,
              " * journeys read these through the same RPCs and are unaffected before lock.\n */\nexport const SEED_REVIEWED_AT_CONTRACT = 101",
              " * journeys read these through the same RPCs and are unaffected before lock.\n *\n"
              " * Contract 102 makes the shared Cup store phase-aware. Existing tournament\n"
              " * groups and memberships default to `initial`, the Euro seed creates neither a\n"
              " * Cup draw nor a split row, and no browser grant or RPC signature changes.\n"
              " * Existing Cup reads and points sources are explicitly kept on the permanent\n"
              " * initial roster, so a seeded Euro user sees the same empty/not-entered Cup\n"
              " * state as before. The new parent/phase triggers fire only on Cup group or\n"
              " * fixture writes, none of which global setup performs.\n"
              " */\nexport const SEED_REVIEWED_AT_CONTRACT = 102",
              'seed review contract',
          )
          seed_path.write_text(seed)

          agents_path = Path('AGENTS.md')
          agents = agents_path.read_text()
          agents = re.sub(
              r'The repository is at \*\*contract 101\*\* through `20260804313000_euro_post_lock_reveal_scope\.sql`\.(.*?)production remains at 63\.',
              r'The repository is at **contract 102** through `20260804323000_cup_split_stage_persistence.sql`.\1production remains at 63. Contract 101 corrects Euro post-lock reveal; contract 102 persists the Predictor Championship split as a distinct phase while preserving the tournament Cup path.',
              agents,
              count=1,
              flags=re.S,
          )
          if '**contract 102**' not in agents:
              raise SystemExit('AGENTS contract line was not updated')
          agents_path.write_text(agents)

          ops_path = Path('docs/ops/ops-pending-migrations.md')
          ops = ops_path.read_text()
          ops = replace_once(
              ops,
              'The repository is at **contract 101**; development is at **97** and trails by four until the next fast-lane run.',
              'The repository is at **contract 102**; development is at **97** and trails by five until the next fast-lane run.',
              'ops headline',
          )
          ops = replace_once(
              ops,
              '| Repository `main` | **101** | Contract 101 removes the shared-league gate from Euro post-lock reveal, through `20260804313000_euro_post_lock_reveal_scope.sql` | MERGED, AWAITING DEVELOPMENT ROLLOUT |',
              '| Repository `main` | **102** | Contract 101 removes the shared-league gate from Euro post-lock reveal; contract 102 persists the Predictor Championship split stage and phase-aware group membership through `20260804323000_cup_split_stage_persistence.sql` | PR CANDIDATE, AWAITING MERGE AND DEVELOPMENT ROLLOUT |',
              'ops repository row',
          )
          ops = ops.replace('VERIFIED; FOUR CONTRACTS BEHIND THE REPOSITORY', 'VERIFIED; FIVE CONTRACTS BEHIND THE REPOSITORY')
          ops = ops.replace('ALIGNED WITH DEVELOPMENT, NOW ONE BEHIND THE REPOSITORY', 'ALIGNED WITH DEVELOPMENT, NOW FIVE BEHIND THE REPOSITORY')
          ops = replace_once(ops, '## Contracts 64–101', '## Contracts 64–102', 'ops contract heading')
          ops = replace_once(
              ops,
              '- **101:** Euro post-lock reveal stops gating on shared leagues (ADR 0025 decision 4). `get_rival_entry` and `get_h2h_rank_history` lose the gate outright; `get_player_profile` gains a lock condition as it loses the league one, because it had no lock gate on access and deleting the league gate alone would have widened pre-lock access. `get_league_match_picks` stays league scoped and contract 95 is untouched.',
              '- **101:** Euro post-lock reveal stops gating on shared leagues (ADR 0025 decision 4). `get_rival_entry` and `get_h2h_rank_history` lose the gate outright; `get_player_profile` gains a lock condition as it loses the league one, because it had no lock gate on access and deleting the league gate alone would have widened pre-lock access. `get_league_match_picks` stays league scoped and contract 95 is untouched.\n- **102:** Predictor Championship split-stage persistence. Groups identify `initial` or `split` phase and split groups retain their initial parent; membership is phase-aware so original and split rows coexist; `stage = \'split\'` fixtures carry a group and the overall Cup matchday. No points are copied into a starting total. Existing tournament reads remain on the initial roster and knockout authorities explicitly accept only playoff or knockout stages.',
              'ops contract 102 entry',
          )
          ops = ops.replace('contracts 98–101 are not yet', 'contracts 98–102 are not yet')
          ops = ops.replace('Contracts 98–101', 'Contracts 98–102')
          ops = ops.replace('contract 101 and must move', 'contract 102 and must move')
          ops_path.write_text(ops)

          status_path = Path('docs/quality/current-status.md')
          status = status_path.read_text()
          status = re.sub(
              r'\| Repository contract \| \*\*101\*\* — 101 canonical migrations through `20260804313000_euro_post_lock_reveal_scope\.sql`\. Development Supabase is hosted at \*\*97\*\*, applied 4 August 2026 by fast-lane run 30931550512 on `381e2d0`; production remains at \*\*63\*\*\. Development trails the repository by four contracts until 98–101 are rolled out\.',
              '| Repository contract | **102** — 102 canonical migrations through `20260804323000_cup_split_stage_persistence.sql`. Development Supabase is hosted at **97**, applied 4 August 2026 by fast-lane run 30931550512 on `381e2d0`; production remains at **63**. Development trails the repository by five contracts until 98–102 are rolled out.',
              status,
              count=1,
          )
          if '| Repository contract | **102**' not in status:
              raise SystemExit('status contract cell was not updated')
          status = status.replace('previews will say so until 98–101 are rolled out', 'previews will say so until 98–102 are rolled out')
          status = status.replace("Appendix D.2's reconciliation list predates contracts 94–101", "Appendix D.2's reconciliation list predates contracts 94–102")
          status = status.replace('Contracts 68–101 have since given two of the three games a database and one of them a reader:', 'Contracts 68–102 have since given two of the three games a database and one of them a reader:')
          status = status.replace(
              '| Predictor Cup | Cup stores and neutral sources (contracts 74–79) | **nothing** — `select_season_cup_format`, `settle_season_cup_tie`, `resolve_public_cup_launch` and `cup_league_schedule` all have zero call sites and zero trigger bindings | no |',
              '| Predictor Cup | Cup stores and neutral sources (contracts 74–79), plus contract 102 phase-aware groups, memberships and the distinct split fixture stage | **nothing yet drives the season lifecycle** — `select_season_cup_format`, `settle_season_cup_tie`, `resolve_public_cup_launch` and `cup_league_schedule` still have zero call sites and zero trigger bindings; contract 102 is persistence, not the split creator or scheduler | no |',
          )
          status = status.replace(
              "`bonus_cup_fixtures.stage` was deliberately NOT widened: a season split stage would immediately violate `bonus_cup_fixtures_group_shape`, which requires a non-group stage to carry neither `group_id` nor `matchday` while split rounds need both, so it waits for the split-execution slice that settles its shape.",
              "**Contract 102 now persists that split shape.** `bonus_cup_groups` identifies `initial` and `split` phases and links each split group to its initial parent; `bonus_cup_members` is phase-aware so the original row remains while a later split row coexists; and `bonus_cup_fixtures.stage = 'split'` carries both `group_id` and the overall Cup `matchday`. No starting-points column exists — the combined table remains a derived read across both fixture phases. Existing tournament points, qualification, Cup reads and knockout settlement are pinned to the permanent initial roster or to explicit `playoff`/`knockout` stages, so introducing `split` cannot double scores or enter the knockout path.",
          )
          status = status.replace(
              "and `admin_draw_predictor_cup` still hardcodes the tournament's format (groups of three and four across three windows), which is the split-execution slice waiting on the `bonus_cup_fixtures_group_shape` decision.",
              "and `admin_draw_predictor_cup` still hardcodes the tournament's format (groups of three and four across three windows). Contract 102 has now settled the shared split-stage persistence shape; the remaining season work is the split creator/scheduler and the derived table across both phases, not another storage decision.",
          )
          lines = status.splitlines()
          for index, line in enumerate(lines):
              if line.startswith('| Next executable issue |'):
                  lines[index] = '| Next executable issue | **Contract 102 represents the Cup split stage and phase-aware membership; the split creator, scheduler and combined standings read remain later Cup drivers.** The remaining ADR 0025 lifecycle work is the LMS restart, which first needs `bonus_competitions`\' availability/instance split. Contracts 98–102 all await a development fast-lane run. No provider credential, provider request, Edge Function deployment, C2 work or production write is authorised by repository inclusion. |'
                  break
          else:
              raise SystemExit('status next executable row was not found')
          status_path.write_text('\n'.join(lines) + '\n')
          PY

      - name: Commit the restacked contract and remove this workflow
        run: |
          rm .github/workflows/restack-cup-split-contract-102.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "Contract 102: persist the Predictor Championship split stage"
          git push origin HEAD:claude/cup-split-stage-persistence
