name: SEC-002 implementation

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - agent/safe-user-facing-errors

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/safe-user-facing-errors
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm
      - name: Apply safe error surfaces and remove temporary audit files
        run: python scripts/sec002-apply.tmp.py
      - name: Install dependencies
        run: npm ci
      - name: Guarded production build
        run: npm run build
      - name: Lint
        run: npm run lint
      - name: Full test suite
        run: npm run test
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Commit verified implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'feat: map internal failures to safe user messages'
          git push origin HEAD:agent/safe-user-facing-errors
