name: Account application runner

on:
  push:
    branches:
      - agent/account-privacy-controls
    paths:
      - .github/workflows/account-application-runner.yml

permissions:
  contents: write

# Existing branch workflow: this update triggers the runner after creation.
jobs:
  run-embedded-patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/account-privacy-controls

      - name: Execute embedded Account patch
        shell: python
        run: |
          from pathlib import Path
          from textwrap import dedent

          source = Path('.github/workflows/account-application-patch.yml').read_text()
          marker = '      - name: Build Account surface\n        shell: python\n        run: |\n'
          start = source.index(marker) + len(marker)
          end = source.index('\n      - name: Commit Account application', start)
          script = dedent(source[start:end])
          exec(compile(script, 'account-application-patch', 'exec'), {'__name__': '__main__'})

      - name: Commit Account application
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .env.example src
          git commit -m "Build private Account management surface"
          git push origin HEAD:agent/account-privacy-controls
