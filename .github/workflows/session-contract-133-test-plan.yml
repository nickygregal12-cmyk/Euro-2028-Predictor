name: Session Contract 133 Test Plan Fix

on:
  push:
    branches:
      - feature/championship-private-player-read-contract-133

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/championship-private-player-read-contract-133
      - name: Correct pgTAP plan
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('supabase/tests/185_private_season_cup_player_reads.sql')
          text = p.read_text()
          old = 'select plan(22);'
          if text.count(old) != 1:
              raise SystemExit('expected exactly one Contract 133 plan header')
          p.write_text(text.replace(old, 'select plan(25);'))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/tests/185_private_season_cup_player_reads.sql
          git commit -m 'test: correct Contract 133 pgTAP plan'
          git push origin HEAD:feature/championship-private-player-read-contract-133
