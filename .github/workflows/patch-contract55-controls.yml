              ('| Production Supabase | `vkfnsqdyhvtwyqkisxhk` — **contract 48** through `20260728122500_h2h_rank_history.sql`; remains locked at the milestone |', '| Production Supabase | `vkfnsqdyhvtwyqkisxhk` — exactly **contract 55** through `20260729030000_predictor_cup_group_scoring.sql`; preserved-data and privilege checks passed |'),
              ('| Netlify contexts | `dev`, `branch-deploy` and `deploy-preview` declare 55 and use development Supabase; `production` declares 48 and uses production Supabase |', '| Netlify contexts | all four contexts declare 55; non-production uses development Supabase and production uses production Supabase |'),
