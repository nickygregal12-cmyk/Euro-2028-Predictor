              ('| Bonus Games | **Development-delivered through B7b.** Platform, hub, shared knockout store, KO Predictor, tournament-format Last Man Standing, Predictor Cup draw/foundation and read-derived group scoring are represented by contracts 49–55. Predictor Cup knockouts remain B7c. |', '| Bonus Games | **Production-delivered through B7b.** Platform, hub, shared knockout store, KO Predictor, tournament-format Last Man Standing, Predictor Cup draw/foundation and read-derived group scoring are represented by contracts 49–55. Predictor Cup knockouts remain B7c. |'),
              ('- production backup/restore rehearsal and contract-48 release publication/smoke.', '- production backup/restore rehearsal, contracts 49–55 migration promotion and exact contract-55 release smoke.'),
              ('**Finish the contract-55 gate, then resume Stage 4 core experience**\n\n1. Complete PR #157 exact authenticated Browser E2E and contract-55 deploy-preview smoke, then merge.\n2. Merge PR #153 so the permanent manual Production Smoke workflow targets the verified contract-48 release.\n3. Continue Match Centre/tournament state resilience and fixture switching from current `main`.\n4. Follow with account/privacy/contact-admin and post-lock trends.\n5. Complete Predictor Cup B7c after the remaining Stage 4 core-experience tranche.\n6. Re-measure full recomputation at complete tournament result volume during the later dress rehearsal.', '**Resume Stage 4 core experience from the contract-55 production baseline**\n\n1. Continue Match Centre/tournament state resilience and fixture switching from current `main`.\n2. Follow with account/privacy/contact-admin and post-lock trends.\n3. Complete Predictor Cup B7c after the remaining Stage 4 core-experience tranche.\n4. Re-measure full recomputation at complete tournament result volume during the later dress rehearsal.'),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'Missing current-status text: {old!r}')
              text = text.replace(old, new)
          status.write_text(text)

          Path('docs/ops-pending-migrations.md').write_text('''# Hosted migration inventory and rollout status

