name: Patch contract 55 controls

on:
  push:
    branches:
      - release/align-contract55-controls
    paths:
      - .github/workflows/patch-contract55-controls.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/align-contract55-controls
          fetch-depth: 0

      - name: Align permanent controls and live status
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              if old not in text:
                  raise SystemExit(f'Missing expected text in {path}: {old!r}')
              file.write_text(text.replace(old, new))

          replace('.github/workflows/production-backup.yml', "EXPECTED_MIGRATION_COUNT: '48'", "EXPECTED_MIGRATION_COUNT: '55'")
          replace('.github/workflows/production-backup.yml', "EXPECTED_LATEST_MIGRATION_VERSION: '20260728122500'", "EXPECTED_LATEST_MIGRATION_VERSION: '20260729030000'")
          replace('.github/workflows/production-backup.yml', 'EXPECTED_LATEST_MIGRATION_NAME: h2h_rank_history', 'EXPECTED_LATEST_MIGRATION_NAME: predictor_cup_group_scoring')
          replace('tests/scripts/productionBackupWorkflow.test.ts', 'restored migration history at the contract-48 head', 'restored migration history at the contract-55 head')
          replace('tests/scripts/productionBackupWorkflow.test.ts', "EXPECTED_MIGRATION_COUNT: '48'", "EXPECTED_MIGRATION_COUNT: '55'")
          replace('tests/scripts/productionBackupWorkflow.test.ts', "EXPECTED_LATEST_MIGRATION_VERSION: '20260728122500'", "EXPECTED_LATEST_MIGRATION_VERSION: '20260729030000'")
          replace('tests/scripts/productionBackupWorkflow.test.ts', 'EXPECTED_LATEST_MIGRATION_NAME: h2h_rank_history', 'EXPECTED_LATEST_MIGRATION_NAME: predictor_cup_group_scoring')

          replace(
              'AGENTS.md',
              "Repository is at contract `55`; development Supabase and non-production Netlify are at `54` pending contract 55's parity and hosted application; production database and application are intentionally aligned and locked at contract `48` (the H2H rank-history milestone, released 28 July 2026).",
              'Repository, development Supabase, production Supabase and all Netlify contexts are aligned at contract `55`, the Bonus Games B2–B7b production milestone released on 28 July 2026.'
          )
          replace('AGENTS.md', '- development Supabase is `iouzoutneyjpugbbtdem` and records 54 canonical versions, with contract 55 pending hosted application;', '- development Supabase is `iouzoutneyjpugbbtdem` and records exactly 55 canonical versions;')
          replace('AGENTS.md', '- production Supabase is `vkfnsqdyhvtwyqkisxhk` and holds 48 canonical versions through `20260728122500_h2h_rank_history.sql` per the dated contract-48 release record;', '- production Supabase is `vkfnsqdyhvtwyqkisxhk` and records exactly 55 canonical versions through `20260729030000_predictor_cup_group_scoring.sql`;')
          replace('AGENTS.md', '- Netlify `dev`, `branch-deploy` and `deploy-preview` use development Supabase and declare `EURO28_DEPLOYED_DB_CONTRACT=54`;', '- Netlify `dev`, `branch-deploy` and `deploy-preview` use development Supabase and declare `EURO28_DEPLOYED_DB_CONTRACT=55`;')
          replace('AGENTS.md', '- Netlify `production` declares contract 48 and uses production Supabase;', '- Netlify `production` declares contract 55 and uses production Supabase;')
          replace('AGENTS.md', '- production remains milestone-locked and normal development must not publish or migrate it automatically;', '- production is re-locked at contract 55 and normal development must not publish or migrate it automatically;')
          replace('AGENTS.md', '- encrypted backup run `30264080847` passed disposable restore verification and its artifact was preserved off GitHub.', '- a fresh encrypted pre-promotion backup and disposable restore rehearsal passed immediately before contracts 49–55 were applied.')
          replace(
              'AGENTS.md',
