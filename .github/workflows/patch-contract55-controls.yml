              ('| Production smoke | exact contract-48 release identity, HTTP smoke and Chromium browser smoke passed; PR #153 permanently aligns the manual workflow to this milestone |', '| Production smoke | exact contract-55 release identity, HTTP smoke and Chromium browser smoke passed; the manual workflow now requires the exact release commit |'),
              ('Production is a controlled future-tournament target, not an active Euro 2028 service. Its database and application are aligned and locked at contract 48. Contracts 49–55 are development-only and must not be promoted to production without a later approved milestone gate.', 'Production is a controlled future-tournament target, not an active Euro 2028 service. Its database and application are aligned and re-locked at contract 55 after the approved Bonus Games milestone promotion.'),
