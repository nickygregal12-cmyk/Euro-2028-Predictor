name: Security tooling

# THE FILTER IS GONE, AND THAT IS WHAT MAKES THIS REQUIRABLE.
#
# A `paths:`-filtered workflow does not run on a pull request it does not match,
# so its check never posts. Requiring a context that never posts blocks that pull
# request for ever — `DOC-001`, then `OPS-012`. The quieter half is what leaving
# the filter costs: these contexts cannot be required at all, so a pull request
# that fails a secret scan merges on a green core CI that never ran one.
#
# `migration-safety.yml` and `database-parity.yml` moved their filters inward,
# because the work behind them is minutes long and worth skipping. These three
# jobs are seconds, and every one of them already decides for itself what to read
# from the pull request's own diff, so there is nothing left for a filter to save
# and it is simply removed.
#
# Removing it means the secret scan now sees a documentation-only pull request
# for the first time. That is the point: a secret pasted into a `.md` file is
# still a leaked secret, and the old filter had no pattern that matched one.
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  betterleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden runner (audit egress)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install verified Betterleaks v1.7.2
        shell: bash
        run: |
          set -euo pipefail
          archive=/tmp/betterleaks.tar.gz
          curl --fail --location --silent --show-error \
            'https://github.com/betterleaks/betterleaks/releases/download/v1.7.2/betterleaks_1.7.2_linux_x64.tar.gz' \
            --output "$archive"
          echo 'ea9ed6a4aa2845ac2e00c0eafbc841057631321d53c061d5a435cf33e6e9ddaf  /tmp/betterleaks.tar.gz' | sha256sum --check --strict
          mkdir -p /tmp/betterleaks
          tar -xzf "$archive" -C /tmp/betterleaks
          install -m 0755 /tmp/betterleaks/betterleaks /usr/local/bin/betterleaks
          betterleaks version
      - name: Scan pull-request additions for secrets
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git diff --unified=0 "$BASE_SHA...$HEAD_SHA" \
            | awk '/^\+\+\+ / { next } /^\+/ { sub(/^\+/, ""); print }' \
            | betterleaks stdin -v
      - name: Scan current main tree for secrets
        if: github.event_name != 'pull_request'
        run: betterleaks dir . -v

  actionlint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden runner (audit egress)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install verified actionlint v1.7.12
        shell: bash
        run: |
          set -euo pipefail
          archive=/tmp/actionlint.tar.gz
          curl --fail --location --silent --show-error \
            'https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz' \
            --output "$archive"
          echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  /tmp/actionlint.tar.gz' | sha256sum --check --strict
          mkdir -p /tmp/actionlint
          tar -xzf "$archive" -C /tmp/actionlint
          install -m 0755 /tmp/actionlint/actionlint /usr/local/bin/actionlint
      - name: Lint changed GitHub Actions
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mapfile -t workflows < <(
            git diff --diff-filter=d --name-only "$BASE_SHA...$HEAD_SHA" -- \
              '.github/workflows/*.yml' '.github/workflows/*.yaml'
          )
          if [ "${#workflows[@]}" -eq 0 ]; then
            echo 'No added or modified workflow files to lint.'
            exit 0
          fi
          printf 'actionlint will check:\n'
          printf '  %s\n' "${workflows[@]}"
          actionlint -color "${workflows[@]}"
      - name: Reject floating external action references
        run: node scripts/check-workflow-action-pins.mjs
      - name: Lint repository workflow tree
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -o pipefail
          actionlint -color

  zizmor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden runner (audit egress)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Audit GitHub Actions security
        uses: zizmorcore/zizmor-action@5f14fd08f7cf1cb1609c1e344975f152c7ee938d # v0.5.6
        with:
          advanced-security: false
          annotations: false

  gate:
    # THE NAME IS THE RULESET'S CONTEXT STRING. A ruleset matches a status check
    # on the check-run name, which for an Actions job is the job's `name:` alone,
    # so it is written in the `Workflow / Job` form the rule asks for. `CI /
    # Required merge gate` was renamed for exactly this reason after every pull
    # request sat waiting on a context nothing emitted.
    #
    # One aggregate rather than three required contexts, so adding or renaming a
    # security job is a change here and not a change to a hosted ruleset nobody
    # can read from a clone.
    name: Security tooling / Required security gate
    # ALWAYS. This context has to exist on every pull request, including the ones
    # where a job failed — a gate that vanished on failure would be
    # indistinguishable from one that passed.
    if: ${{ always() }}
    needs: [betterleaks, actionlint, zizmor]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      # Red, cancelled and absent are all "not proven", and none of them is a
      # pass. Unlike the parity and Conductor gates there is no "nothing to
      # measure" branch here, because these jobs are unconditional: every pull
      # request owes all three.
      - name: Refuse a security job that did not succeed
        if: >-
          ${{ needs.betterleaks.result != 'success'
          || needs.actionlint.result != 'success'
          || needs.zizmor.result != 'success' }}
        run: |
          echo 'ERROR: security tooling did not prove this pull request clean.'
          echo "betterleaks concluded '${{ needs.betterleaks.result }}'."
          echo "actionlint concluded '${{ needs.actionlint.result }}'."
          echo "zizmor concluded '${{ needs.zizmor.result }}'."
          exit 1

      - name: Report the three clean results
        run: echo 'betterleaks, actionlint and zizmor all succeeded.'
