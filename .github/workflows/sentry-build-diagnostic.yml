name: Sentry Build Diagnostic

on:
  pull_request:
    paths:
      - '.github/workflows/sentry-build-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm
      - run: npm ci
      - name: Capture compiler output
        id: build
        shell: bash
        run: |
          set +e
          npm run build > sentry-build.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload compiler output
        uses: actions/upload-artifact@v4
        with:
          name: sentry-build-diagnostic
          path: sentry-build.log
          if-no-files-found: error
          retention-days: 1
      - name: Preserve build result
        if: steps.build.outputs.status != '0'
        run: exit 1
