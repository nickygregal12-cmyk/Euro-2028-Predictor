name: Sentry Build Diagnostic

on:
  pull_request:
    paths:
      - '.github/workflows/sentry-build-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm
      - run: npm ci
      - name: Print compiler failure only
        shell: bash
        run: |
          set +e
          npm run build > /tmp/sentry-build.log 2>&1
          status=$?
          tail -n 80 /tmp/sentry-build.log
          exit "$status"
