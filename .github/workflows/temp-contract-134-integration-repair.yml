name: Temporary Contract 134 integration repair

on:
  push:
    branches:
      - agent/euro-002-publication-state-contract-134
    paths:
      - .github/workflows/temp-contract-134-integration-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/euro-002-publication-state-contract-134
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.22.2
          cache: npm
      - name: Repair exact integration authorities
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, expected=1):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f"{path}: expected {expected} occurrence(s), found {count}: {old!r}")
              p.write_text(text.replace(old, new))

          replace(
              'AGENTS.md',
              'The repository is at **contract 133** through `20260808003000_private_season_cup_player_reads.sql`.',
              'The repository is at **contract 134** through `20260809001500_euro_publication_state.sql`.',
          )
          replace(
              'docs/quality/current-status.md',
              'The repository candidate is **133**. Development Supabase and Production Supabase are both hosted at **132** after the verified Contract 132 rollouts; Contract 133 remains repository-only until its guarded Development rollout is applied and verified.',
              'The repository candidate is **134**. Development Supabase and Production Supabase are recorded here at **132** pending the separately queued hosted-authority reconciliation; Contract 134 remains repository-only and has not been applied to either hosted environment.',
          )
          replace(
              'docs/quality/current-status.md',
              '| Repository contract | **133** — 133 canonical migrations through `20260808003000_private_season_cup_player_reads.sql`.',
              '| Repository contract | **134** — 134 canonical migrations through `20260809001500_euro_publication_state.sql`. Contract 134 establishes the server-owned Euro publication lifecycle and bounded state/admin RPC boundary; it is repository-only.',
          )

          p = Path('supabase/tests/080_function_privileges.sql')
          text = p.read_text()
          needle = "insert into expected_service_functions (signature) values\n  ('capture_rank_history(uuid)'),"
          replacement = "insert into expected_service_functions (signature) values\n  -- Contract 134: service-side route/site guards may consume the same bounded\n  -- publication-state read as the browser; mutation remains authenticated owner-only.\n  ('euro_publication_state()'),\n  ('capture_rank_history(uuid)'),"
          if text.count(needle) != 1:
              raise SystemExit('080_function_privileges.sql: expected service allowlist insertion point exactly once')
          p.write_text(text.replace(needle, replacement))
          PY
          rm .github/workflows/temp-contract-134-integration-repair.yml
          npm ci
          npm run generate:now
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add AGENTS.md docs/quality/current-status.md supabase/tests/080_function_privileges.sql NOW.md .github/workflows/temp-contract-134-integration-repair.yml
          git commit -m "fix: align Contract 134 integration guards"
          git push origin HEAD:agent/euro-002-publication-state-contract-134
