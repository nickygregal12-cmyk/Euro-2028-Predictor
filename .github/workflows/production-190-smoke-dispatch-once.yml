name: One-shot smoke Contract 190 production sites

# Connector bridge only. The real Production Smoke workflow remains the
# authority: this file merely dispatches it for both ADR-0026 production sites
# after the verified Production-190 hosted record lands on main. Both live site
# results are required; one green bundle never stands in for the other.
#
# It is inert on every push except the single deliberately titled merge below.

on: push

permissions:
  contents: read
  actions: write

concurrency:
  group: production-190-smoke-dispatch-once
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Dispatch and require Euro and Hub Production Smoke
        env:
          GH_TOKEN: ${{ github.token }}
          SMOKE_WORKFLOW: production-smoke.yml
        shell: bash
        run: |
          set -euo pipefail

          if [ "${GITHUB_REF}" != 'refs/heads/main' ]; then
            echo "Skip: ${GITHUB_REF} is not main."
            exit 0
          fi

          message="$(jq -r '.head_commit.message // ""' "${GITHUB_EVENT_PATH}")"
          case "${message}" in
            'Ops: record Production 190 and smoke live sites'*) ;;
            *) echo 'Skip: main push is not the dedicated Production-190 hosted-record merge.'; exit 0 ;;
          esac

          exact_main() {
            local remote_sha
            remote_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
            [ "${remote_sha}" = "${GITHUB_SHA}" ] || {
              echo "ERROR: main moved to ${remote_sha}; refusing smoke authority for ${GITHUB_SHA}."
              exit 1
            }
          }

          find_exact_run() {
            local after_epoch="$1"
            gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/workflows/${SMOKE_WORKFLOW}/runs?branch=main&event=workflow_dispatch&per_page=100" \
              --jq ".workflow_runs[] | select(.head_sha == \"${GITHUB_SHA}\") | select((.created_at | fromdateiso8601) >= ${after_epoch}) | .id" \
              | head -1
          }

          dispatch_smoke() {
            local site="$1" after run_id
            after="$(date -u +%s)"
            gh workflow run "${SMOKE_WORKFLOW}" \
              --repo "${GITHUB_REPOSITORY}" \
              --ref main \
              -f site="${site}" \
              -f expected_commit="${GITHUB_SHA}" \
              -f expected_contract=190

            run_id=''
            for _ in $(seq 1 30); do
              run_id="$(find_exact_run "${after}" || true)"
              [ -n "${run_id}" ] && break
              sleep 2
            done
            [ -n "${run_id}" ] || {
              echo "ERROR: ${site} exact-head Production Smoke was not discoverable."
              exit 1
            }
            printf '%s\n' "${run_id}"
          }

          wait_for_run() {
            local run_id="$1" label="$2" status conclusion
            for _ in $(seq 1 150); do
              status="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq '.status')"
              if [ "${status}" = completed ]; then
                conclusion="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq '.conclusion')"
                [ "${conclusion}" = success ] || {
                  echo "ERROR: ${label} Production Smoke ${run_id} completed with ${conclusion}."
                  return 1
                }
                echo "${label} Production Smoke ${run_id} succeeded."
                return 0
              fi
              sleep 10
            done
            echo "ERROR: ${label} Production Smoke ${run_id} did not complete inside the bounded polling window."
            return 1
          }

          exact_main
          euro_id="$(dispatch_smoke euro)"
          # Ensure the second discovery window cannot select the first run when
          # GitHub timestamps both dispatches at second precision.
          sleep 2
          hub_id="$(dispatch_smoke hub)"

          wait_for_run "${euro_id}" Euro & euro_pid=$!
          wait_for_run "${hub_id}" Hub & hub_pid=$!
          euro_status=0
          hub_status=0
          wait "${euro_pid}" || euro_status=$?
          wait "${hub_pid}" || hub_status=$?
          [ "${euro_status}" -eq 0 ] && [ "${hub_status}" -eq 0 ] || exit 1

          exact_main
          {
            echo '## Contract 190 live-site smoke complete'
            echo
            echo "- Exact main: \`${GITHUB_SHA}\`"
            echo "- Euro Production Smoke: \`${euro_id}\`"
            echo "- Hub Production Smoke: \`${hub_id}\`"
            # Literal Markdown backticks belong in the summary.
            # shellcheck disable=SC2016
            echo '- Expected hosted/application contract: `190`'
          } >> "${GITHUB_STEP_SUMMARY}"
