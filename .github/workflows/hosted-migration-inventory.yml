name: Hosted migration inventory

on:
  pull_request:
    paths:
      - config/deployment-contract.json
      - config/development-hosted-contract.json
      - config/production-hosted-contract.json
      - docs/ops/ops-pending-migrations.md
      - scripts/check-hosted-migration-inventory.mjs
      - .github/workflows/hosted-migration-inventory.yml
  push:
    branches: [main]
    paths:
      - config/deployment-contract.json
      - config/development-hosted-contract.json
      - config/production-hosted-contract.json
      - docs/ops/ops-pending-migrations.md
      - scripts/check-hosted-migration-inventory.mjs
      - .github/workflows/hosted-migration-inventory.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.22.2
      - run: node scripts/check-hosted-migration-inventory.mjs
