name: Hosted migration inventory

on:
  pull_request:
    paths:
      - config/deployment-contract.json
      - config/development-hosted-contract.json
      - docs/ops/ops-pending-migrations.md
      - scripts/check-hosted-migration-inventory.mjs
      - .github/workflows/hosted-migration-inventory.yml
  push:
    branches: [main]
    paths:
      - config/deployment-contract.json
      - config/development-hosted-contract.json
      - docs/ops/ops-pending-migrations.md
      - scripts/check-hosted-migration-inventory.mjs
      - .github/workflows/hosted-migration-inventory.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
      - name: Patch contract 92 live status and restore this workflow
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 431 && github.head_ref == 'agent/provider-ingestion-contract-80'
        env:
          HEAD_REF: ${{ github.head_ref }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs'

          const path = 'docs/quality/current-status.md'
          let source = readFileSync(path, 'utf8')

          const replacements = [
            [
              /^\*\*Status date:\*\* 3 August 2026$/m,
              '**Status date:** 4 August 2026',
            ],
            [
              /^\| Repository contract \|.*$/m,
              '| Repository contract | **92** — 92 canonical migrations through `20260804203000_provider_ingestion_custody.sql`. Development Supabase is hosted at **89**, applied 4 August 2026 by fast-lane run 30911943023 on `c087f1d`, whose postflight reported `Development is at contract 89.`; production remains at **63**. Contracts 90–92 are additive pending migrations for the next ADR-0024 fast-lane run. Repository inclusion does not deploy `provider-poll`, configure a provider credential or call a provider. Non-production Netlify contexts retain their separately managed declaration, while production keeps the fatal contract gate. |',
            ],
            [
              /^\| Next executable issue \|.*$/m,
              '| Next executable issue | **Contract 92 provider-ingestion custody is the active repository candidate.** It adds strict decoders, archive-before-decode custody, append-only processing evidence and a server-only Edge Function boundary. Merge requires exact CI, Database parity, Browser E2E, hosted inventory and protected Netlify preview evidence. After merge, contracts 90–92 may be applied to Development through the ADR-0024 fast lane; no provider credential, provider request, Edge Function deployment, C2 work or production write is authorised by repository inclusion. |',
            ],
          ]

          for (const [pattern, replacement] of replacements) {
            const matches = source.match(new RegExp(pattern.source, pattern.flags + (pattern.flags.includes('g') ? '' : 'g')))
            if (matches?.length !== 1) {
              throw new Error(`Expected one match for ${pattern}, found ${matches?.length ?? 0}`)
            }
            source = source.replace(pattern, replacement)
          }

          writeFileSync(path, source)
          NODE

          git fetch --no-tags origin main
          git show origin/main:.github/workflows/hosted-migration-inventory.yml > .github/workflows/hosted-migration-inventory.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/quality/current-status.md .github/workflows/hosted-migration-inventory.yml
          git diff --cached --check
          git commit -m 'Align contract 92 live status'
          git push origin "HEAD:${HEAD_REF}"
      - run: node scripts/check-hosted-migration-inventory.mjs
