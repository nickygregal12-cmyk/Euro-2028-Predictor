name: Reconcile AI odds scheduler

# pg_cron jobs are hosted operational state rather than dump-carried schema
# state. Reconcile the Production scheduler from exact repository SQL and prove
# that reconciliation itself consumed no provider credit. The installed job is
# fixture-aware: it tightens collection cadence as a paid-covered kickoff gets
# closer while public.dispatch_ai_odds_polls() keeps the budget authority.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ai-odds-scheduler-reconcile.yml'
      - 'scripts/database-rollout/ai-odds-scheduler-reconcile.sql'
  schedule:
    - cron: '20 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-odds-scheduler-production
  cancel-in-progress: false

env:
  PRODUCTION_PROJECT_REF: vkfnsqdyhvtwyqkisxhk

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PROD_DB_URL: ${{ secrets.SUPABASE_PROD_DB_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'

      - name: Resolve Production and snapshot paid usage
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${PROD_DB_URL}" ]; then
            echo 'SUPABASE_PROD_DB_URL is not set.'
            exit 1
          fi
          case "${PROD_DB_URL}" in
            *"${PRODUCTION_PROJECT_REF}"*) ;;
            *) echo "SUPABASE_PROD_DB_URL does not name Production ${PRODUCTION_PROJECT_REF}."; exit 1 ;;
          esac
          echo "::add-mask::${PROD_DB_URL}"
          echo "DATABASE_URL=${PROD_DB_URL}" >> "$GITHUB_ENV"
          pip install 'psycopg[binary]>=3.2,<4'
          python - <<'PY' > /tmp/ai-odds-usage-before
          import os, psycopg
          with psycopg.connect(os.environ['PROD_DB_URL']) as conn:
              row = conn.execute(
                  "select count(*)::bigint, coalesce(max(called_at)::text, '') from ai.api_usage"
              ).fetchone()
          print(f"{row[0]}|{row[1]}")
          PY
          echo "Provider ledger before reconciliation: $(cat /tmp/ai-odds-usage-before)"

      - name: Reconcile hosted pg_cron state
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path
          import psycopg

          sql = Path('scripts/database-rollout/ai-odds-scheduler-reconcile.sql').read_text()
          with psycopg.connect(os.environ['DATABASE_URL'], autocommit=True) as conn:
              authority = conn.execute("""
                  select pg_get_functiondef(p.oid)
                    from pg_proc p
                    join pg_namespace n on n.oid = p.pronamespace
                   where n.nspname = 'public'
                     and p.proname = 'dispatch_ai_odds_polls'
              """).fetchone()
              if not authority:
                  raise SystemExit('public.dispatch_ai_odds_polls is missing in Production')
              function_def = authority[0]
              if 'public.ai_odds_budget_check' not in function_def:
                  raise SystemExit('dispatch authority no longer contains ai_odds_budget_check')
              if "'budget_or_collection_disabled'" not in function_def:
                  raise SystemExit('dispatch authority no longer fails closed when the budget gate denies collection')

              conn.execute(sql, prepare=False)
              rows = conn.execute("""
                  select jobid, jobname, schedule, active, command
                    from cron.job
                   where jobname like 'ai-odds-%'
                   order by jobid
              """).fetchall()
          if len(rows) != 1:
              raise SystemExit(f'expected exactly one ai-odds cron job, got {rows!r}')
          jobid, name, schedule, active, command = rows[0]
          if name != 'ai-odds-window-heartbeat' or schedule != '*/5 * * * *' or not active:
              raise SystemExit(f'unexpected reconciled scheduler row: {rows[0]!r}')
          if 'dispatch_ai_odds_polls(true)' not in command:
              raise SystemExit('fixture-aware heartbeat must bypass only the legacy Tuesday/Friday clock window')
          print(f'Reconciled heartbeat job {jobid}: {schedule}, active={active}, database_budget_guard=verified')
          PY

      - name: Prove reconciliation made zero provider calls
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' > /tmp/ai-odds-usage-after
          import os, psycopg
          with psycopg.connect(os.environ['DATABASE_URL']) as conn:
              row = conn.execute(
                  "select count(*)::bigint, coalesce(max(called_at)::text, '') from ai.api_usage"
              ).fetchone()
          print(f"{row[0]}|{row[1]}")
          PY
          echo "Provider ledger after reconciliation: $(cat /tmp/ai-odds-usage-after)"
          diff -u /tmp/ai-odds-usage-before /tmp/ai-odds-usage-after

      - name: Summary
        if: success()
        shell: bash
        run: |
          {
            echo '## AI odds scheduler reconciled'
            echo
            # Declared, not rewritten: backticks are literal markdown for the step summary and must not expand. shellcheck only began seeing this
            # when SHA-pinning marked the file changed, so it is pre-existing.
            # shellcheck disable=SC2016
            echo '- Production holds one active `ai-odds-window-heartbeat` job.'
            echo '- Legacy Tuesday/Friday DST-twin jobs are absent.'
            echo '- Reconciliation itself made zero provider calls.'
            # Declared, not rewritten: backticks are literal markdown for the step summary and must not expand. shellcheck only began seeing this
            # when SHA-pinning marked the file changed, so it is pre-existing.
            # shellcheck disable=SC2016
            echo '- Fixture-aware cron bypasses only the legacy Tuesday/Friday clock window; the live dispatch function is verified to keep `ai_odds_budget_check` and fail closed when collection is denied.'
            echo '- The heartbeat runs every five minutes but only dispatches when a paid-covered fixture is inside 24 hours and the freshness-aware cadence is due.'
            echo '- Cadence is at most 10h (>8h to kickoff), 50m (2–8h), and 10m (≤2h).'
          } >> "$GITHUB_STEP_SUMMARY"