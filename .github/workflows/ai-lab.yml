name: AI Lab development jobs

on:
  schedule:
    - cron: '30 5 * * *'
    - cron: '0 23 * * *'
    - cron: '0 7 * * 1'
    - cron: '30 16 * * 5'
    - cron: '30 17 * * 5'
    - cron: '30 12 * * 2'
    - cron: '30 13 * * 2'
  workflow_dispatch:
    inputs:
      task:
        description: Development-only job
        required: true
        default: predict
        type: choice
        options: [import, predict, evaluate, train, free-odds, value, settle, odds-plan]

permissions:
  contents: read

concurrency:
  group: ai-lab-development
  cancel-in-progress: false

env:
  EXPECTED_PROJECT_REF: iouzoutneyjpugbbtdem
  FORBIDDEN_PRODUCTION_REF: vkfnsqdyhvtwyqkisxhk

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      DATABASE_URL: ${{ secrets.SUPABASE_DEV_DB_URL }}
      AI_ENV: development
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ai/requirements.txt
      - name: Refuse missing or non-Development database configuration
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${DATABASE_URL}" ] || { echo 'SUPABASE_DEV_DB_URL is not set'; exit 1; }
          case "${DATABASE_URL}" in
            *"${FORBIDDEN_PRODUCTION_REF}"*) echo 'Refusing Production'; exit 1 ;;
            *"${EXPECTED_PROJECT_REF}"*) ;;
            *) echo 'Database URL does not name the Development project'; exit 1 ;;
          esac
      - name: Install
        working-directory: ai
        run: pip install -r requirements.txt
      - name: Resolve task
        id: task
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = workflow_dispatch ]; then
            echo "name=${{ inputs.task }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = '30 5 * * *' ]; then
            echo 'name=morning' >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = '0 23 * * *' ]; then
            echo 'name=evening' >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = '0 7 * * 1' ]; then
            echo 'name=train' >> "$GITHUB_OUTPUT"
          else
            echo 'name=free-odds' >> "$GITHUB_OUTPUT"
          fi
      - name: Import history and predict
        if: steps.task.outputs.name == 'morning'
        working-directory: ai
        run: |
          python fetch_history.py --all-divisions --seasons 2627
          python sync_fixtures.py
          for L in EPL ECH EL1 EL2 ENL SPL SCH SL1 SL2; do
            python evaluate.py --league "$L"
            python predict.py --league "$L" || echo "no current model for $L"
          done
      - name: Evaluate and settle
        if: steps.task.outputs.name == 'evening'
        working-directory: ai
        run: |
          for L in EPL ECH EL1 EL2 ENL SPL SCH SL1 SL2; do python evaluate.py --league "$L"; done
          for L in EPL ECH EL1 EL2 ENL SPL SCH SL1 SL2; do python settle_bets.py --league "$L"; done
      - name: Collect free fixture odds and find value
        if: steps.task.outputs.name == 'free-odds'
        working-directory: ai
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = schedule ]; then
            day="$(TZ=Europe/London date +%u)"
            hour="$(TZ=Europe/London date +%H)"
            { [ "$day" = 2 ] && [ "$hour" = 13 ]; } || \
            { [ "$day" = 5 ] && [ "$hour" = 17 ]; } || exit 0
          fi
          python sync_fixtures.py
          python fetch_fixtures_odds.py
          for L in EPL ECH EL1 EL2 ENL SPL SCH SL1 SL2; do
            python find_value.py --league "$L" || echo "no current model for $L"
          done
      - name: Run manual task
        if: github.event_name == 'workflow_dispatch'
        working-directory: ai
        shell: bash
        run: |
          case "${{ steps.task.outputs.name }}" in
            import) python fetch_history.py --all-divisions ;;
            predict) for L in EPL ECH EL1 EL2 ENL SPL SCH SL1 SL2; do python predict.py --league "$L" || true; done ;;
            evaluate) for L in EPL ECH EL1 EL2 ENL SPL SCH SL1 SL2; do python evaluate.py --league "$L"; done ;;
            value) for L in EPL ECH EL1 EL2 ENL SPL SCH SL1 SL2; do python find_value.py --league "$L" || true; done ;;
            settle) for L in EPL ECH EL1 EL2 ENL SPL SCH SL1 SL2; do python settle_bets.py --league "$L"; done ;;
            odds-plan) python odds_api.py plan ;;
            train|free-odds) ;;
          esac
      - name: Train challengers
        if: steps.task.outputs.name == 'train'
        working-directory: ai
        run: |
          stamp="$(date -u +%Y%m%d)"
          python fetch_history.py --all-divisions
          for L in EPL ECH EL1 EL2 ENL SPL SCH SL1 SL2; do
            python train.py --league "$L" --family poisson --version "auto-$stamp"
          done
      - name: Keep reports and convenience artefacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ai-lab-${{ github.run_id }}
          path: |
            ai/models/*.joblib
            ai/reports/*.json
          retention-days: 30
          if-no-files-found: ignore
