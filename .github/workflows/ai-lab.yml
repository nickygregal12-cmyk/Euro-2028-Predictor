name: AI Lab jobs

# The hosted AI Lab is a Production analytical subsystem. Scheduled provider
# collection, history refreshes, training, prediction and settlement run against
# Production. Development remains available only as an explicit manual target
# for bounded experiments that do not need live provider collection.
#
# The package writes to schema `ai` and nowhere else; check_write_scope.py is
# run before a hosted credential is resolved. Production additionally fails
# closed unless SUPABASE_PROD_DB_URL names the expected Production project.

on:
  # Changing this workflow on main also gives an empty Production AI Lab one
  # idempotent bootstrap opportunity. Each bootstrap stage checks hosted state
  # first, so later workflow edits do not re-fetch history or retrain merely
  # because this trigger fires again.
  push:
    branches:
      - main
    paths:
      - '.github/workflows/ai-lab.yml'
  schedule:
    - cron: '30 5 * * *'
    - cron: '0 23 * * *'
    - cron: '0 7 * * 1'
    - cron: '30 16 * * 5'
    - cron: '30 17 * * 5'
    - cron: '30 12 * * 2'
    - cron: '30 13 * * 2'
  workflow_dispatch:
    inputs:
      target:
        description: Which hosted project to run against
        required: true
        default: production
        type: choice
        options:
          - production
          - development
      task:
        description: Job to run
        required: true
        default: predict
        type: choice
        options:
          - bootstrap
          - import
          - predict
          - evaluate
          - train
          - free-odds
          - value
          - settle
          - odds-plan
          - ablate

permissions:
  contents: read

concurrency:
  # Schedules and the bootstrap-on-workflow-change are Production. Development
  # can only be selected deliberately through workflow_dispatch.
  group: ai-lab-${{ inputs.target || 'production' }}
  cancel-in-progress: false

env:
  DEVELOPMENT_PROJECT_REF: iouzoutneyjpugbbtdem
  PRODUCTION_PROJECT_REF: vkfnsqdyhvtwyqkisxhk

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      AI_ENV: ${{ inputs.target || 'production' }}
      DEV_DB_URL: ${{ secrets.SUPABASE_DEV_DB_URL }}
      PROD_DB_URL: ${{ secrets.SUPABASE_PROD_DB_URL }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ai/requirements.txt

      - name: Prove the package writes to schema ai and nowhere else
        working-directory: ai
        run: python check_write_scope.py

      - name: Resolve and verify the target database
        shell: bash
        run: |
          set -euo pipefail
          case "${AI_ENV}" in
            development) url="${DEV_DB_URL}"; ref="${DEVELOPMENT_PROJECT_REF}"; secret=SUPABASE_DEV_DB_URL ;;
            production)  url="${PROD_DB_URL}"; ref="${PRODUCTION_PROJECT_REF}"; secret=SUPABASE_PROD_DB_URL ;;
            *) echo "Unknown target '${AI_ENV}'"; exit 1 ;;
          esac
          if [ -z "${url}" ]; then
            echo "Target is ${AI_ENV} but repository secret ${secret} is not set."
            exit 1
          fi
          case "${url}" in
            *"${ref}"*) ;;
            *) echo "${secret} does not name the ${AI_ENV} project ref ${ref}"; exit 1 ;;
          esac
          echo "::add-mask::${url}"
          echo "DATABASE_URL=${url}" >> "$GITHUB_ENV"
          echo "Target ${AI_ENV}, project ${ref}"

      - name: Install
        working-directory: ai
        run: pip install -r requirements.txt

      - name: Resolve task
        id: task
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = workflow_dispatch ]; then
            echo "name=${{ inputs.task }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = push ]; then
            echo 'name=bootstrap-if-empty' >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = '30 5 * * *' ]; then
            echo 'name=morning' >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = '0 23 * * *' ]; then
            echo 'name=evening' >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = '0 7 * * 1' ]; then
            echo 'name=train' >> "$GITHUB_OUTPUT"
          else
            echo 'name=free-odds' >> "$GITHUB_OUTPUT"
          fi

      - name: Bootstrap empty Production AI Lab
        if: steps.task.outputs.name == 'bootstrap-if-empty'
        working-directory: ai
        shell: bash
        run: |
          set -euo pipefail
          if [ "${AI_ENV}" != production ]; then
            echo "Automatic bootstrap is Production-only."
            exit 1
          fi

          # Read state once without invoking a provider. The subsequent stages
          # run only for missing Production data, making this trigger safe and
          # preventing repeated API/feed work on future workflow edits.
          python - <<'PY' > /tmp/ai_bootstrap_state
          from db import connect
          with connect() as conn:
              row = conn.execute("""
                  select
                    (select count(*) from ai.raw_matches) as history,
                    (select count(*) from ai.fixtures) as fixtures,
                    (select count(*) from ai.fixture_odds) as odds,
                    (select count(*) from ai.models) as models
              """).fetchone()
          for key in ("history", "fixtures", "odds", "models"):
              print(f"{key}={int(row[key])}")
          PY
          source /tmp/ai_bootstrap_state
          echo "Production state before bootstrap: history=${history}, fixtures=${fixtures}, odds=${odds}, models=${models}"

          if [ "${history}" -eq 0 ]; then
            python fetch_history.py --all-divisions
          else
            echo "History already present; skipping historical import."
          fi

          if [ "${fixtures}" -eq 0 ]; then
            python sync_fixtures.py
          else
            echo "Fixtures already present; skipping fixture bootstrap."
          fi

          if [ "${odds}" -eq 0 ]; then
            # Free Football-Data fixture prices only. This bootstrap does not
            # invoke the paid Odds API.
            python fetch_fixtures_odds.py
          else
            echo "Fixture odds already present; skipping odds bootstrap."
          fi

          if [ "${models}" -eq 0 ]; then
            stamp="$(date -u +%Y%m%dT%H%MZ)"
            ./run_leagues.sh train.py --family poisson --version "auto-${stamp}" --walk-forward
          else
            echo "Models already present; skipping challenger bootstrap."
          fi

      - name: Import history and predict
        if: steps.task.outputs.name == 'morning'
        working-directory: ai
        run: |
          python fetch_history.py --all-divisions --seasons current
          python sync_fixtures.py
          status=0
          ./run_leagues.sh evaluate.py || status=1
          ./run_leagues.sh predict.py || status=1
          exit "$status"

      - name: Evaluate and settle
        if: steps.task.outputs.name == 'evening'
        working-directory: ai
        run: |
          status=0
          ./run_leagues.sh evaluate.py || status=1
          ./run_leagues.sh settle_bets.py || status=1
          exit "$status"

      - name: Collect free fixture odds and find value
        if: steps.task.outputs.name == 'free-odds'
        working-directory: ai
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = schedule ]; then
            day="$(TZ=Europe/London date +%u)"
            hour="$(TZ=Europe/London date +%H)"
            { [ "$day" = 2 ] && [ "$hour" = 13 ]; } || \
            { [ "$day" = 5 ] && [ "$hour" = 17 ]; } || exit 0
          fi
          python sync_fixtures.py
          python fetch_fixtures_odds.py
          ./run_leagues.sh find_value.py

      - name: Run manual task
        if: github.event_name == 'workflow_dispatch'
        working-directory: ai
        shell: bash
        run: |
          case "${{ steps.task.outputs.name }}" in
            import) python fetch_history.py --all-divisions ;;
            predict) ./run_leagues.sh predict.py ;;
            evaluate) ./run_leagues.sh evaluate.py ;;
            value) ./run_leagues.sh find_value.py ;;
            settle) ./run_leagues.sh settle_bets.py ;;
            odds-plan) python odds_api.py plan ;;
            ablate)
              status=0
              for L in EPL SPL EL2; do
                python ablate.py --league "$L" || status=1
              done
              exit "$status" ;;
            bootstrap|train|free-odds) ;;
          esac

      - name: Train challengers
        if: steps.task.outputs.name == 'train' || steps.task.outputs.name == 'bootstrap'
        working-directory: ai
        shell: bash
        run: |
          stamp="$(date -u +%Y%m%dT%H%MZ)"
          python fetch_history.py --all-divisions
          if [ "${{ steps.task.outputs.name }}" = bootstrap ]; then
            python sync_fixtures.py
            python fetch_fixtures_odds.py
          fi
          ./run_leagues.sh train.py --family poisson --version "auto-$stamp" --walk-forward

      - name: Keep reports and convenience artefacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ai-lab-${{ github.run_id }}
          path: |
            ai/models/*.joblib
            ai/reports/*.json
          retention-days: 30
          if-no-files-found: ignore
