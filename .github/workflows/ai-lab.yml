name: AI Lab jobs

# The hosted AI Lab is a Production analytical subsystem. Scheduled provider
# collection, history refreshes, training, prediction and settlement run against
# Production. Development remains available only as an explicit manual target
# for bounded experiments that do not need live provider collection.
#
# The package writes to schema `ai` and nowhere else; check_write_scope.py is
# run before a hosted credential is resolved. Production additionally fails
# closed unless SUPABASE_PROD_DB_URL names the expected Production project.

on:
  # Changing the Production reconciliation path on main gives the live lab an
  # idempotent activation pass. Existing history, fixtures, odds and models are
  # detected before any provider/feed work, so this trigger does not waste
  # collection calls or retrain merely because implementation changed.
  push:
    branches:
      - main
    paths:
      - '.github/workflows/ai-lab.yml'
      - 'ai/reconcile_paid_fixture_evidence.py'
  schedule:
    - cron: '30 5 * * *'
    - cron: '0 23 * * *'
    # TWO training passes a week, not one, and the second is the one that keeps
    # the invariant. Football-Data publishes a weekend's results on the FOLLOWING
    # morning, so the Monday 07:00 pass runs before them: the artefact trained at
    # 08:04 on Monday 17 August 2026 ended at 8 August for most leagues and at
    # 2 May for ECH and EL1, whose own divisions had not started, and the next
    # training was the following Monday — after the weekend it was meant to
    # inform. The Tuesday pass runs once the morning import has landed, so the
    # deployment artefact carries last weekend before this weekend is priced.
    # Both go through train_selected_challengers.py and the same verified
    # artefact, provenance and selected-policy gates; the model family and window
    # per league are unchanged, only the data window advances.
    - cron: '0 7 * * 1'
    - cron: '30 8 * * 2'
    # The Production database dispatches the paid odds poll at :30. Run the
    # repository reconciliation fifteen minutes later so it consumes retained
    # responses rather than racing the provider poll.
    - cron: '45 16 * * 5'
    - cron: '45 17 * * 5'
    - cron: '45 12 * * 2'
    - cron: '45 13 * * 2'
  workflow_dispatch:
    inputs:
      target:
        description: Which hosted project to run against
        required: true
        default: production
        type: choice
        options:
          - production
          - development
      study:
        description: Which experiments study to run (task=experiments or research)
        required: false
        default: half-life
        type: choice
        options:
          - half-life
          - time-weighting
          - elo-transition
          - elo-margin
          - ensemble
          - calibration
          - regime-weighting
          - gbm-diagnostic
          - base-model
          - league-diagnostic
          - market-ou
          - newcomer-transfer
          - coverage-guard
      league:
        description: Which league the study covers (task=research only; `all` is the nine)
        required: false
        default: all
        type: choice
        options:
          - all
          - EPL
          - ECH
          - EL1
          - EL2
          - ENL
          - SPL
          - SCH
          - SL1
          - SL2
      base_families:
        description: >-
          Ensemble components (task=research, study=ensemble). `default` is
          whatever ENSEMBLE_BASE_FAMILIES currently holds; the others are the
          predeclared component sets the ensemble question is asked with.
        required: false
        default: default
        type: choice
        options:
          - default
          - poisson elo
          - poisson elo logistic
          - poisson elo gbm
      groups:
        description: Which candidate feature family to ablate (task=research-ablate)
        required: false
        default: discipline
        type: choice
        options:
          - discipline
          - halftime
          - performance
          - congestion
      task:
        description: Job to run
        required: true
        default: predict
        type: choice
        options:
          - bootstrap
          - import
          - predict
          - evaluate
          - train
          - free-odds
          - value
          - settle
          - odds-plan
          - ablate
          # Provider-free. Walks retained events, fixtures, prices and the
          # derived odds projection back into agreement with the alias
          # authority, then quarantines the forecasts built on a broken one.
          - repair-identity
          # Paired walk-forward studies for the decisions that are not
          # feature groups. Reads only; trains no deployable model and
          # promotes nothing. `study` chooses which question is asked.
          - experiments
          # The same studies over a chosen league or all nine, with the
          # database session opened READ-ONLY and no --record. It exists
          # because the studies need the forty-six thousand historical rows
          # that a workstation cannot egress, and running them here must not
          # be able to leave a mark on the environment that holds them.
          - research
          # The same read-only plane, for the question that is not a study:
          # does a candidate feature family earn its place in DEFAULT_GROUPS.
          # A separate arm rather than a pseudo-study because `ablate.py` is a
          # different script with a different comparison, and because the
          # study selector is asserted to equal experiments.py's own registry.
          - research-ablate

permissions:
  contents: read

concurrency:
  # Schedules and the bootstrap-on-reconciliation-change are Production.
  # Development can only be selected deliberately through workflow_dispatch.
  group: ai-lab-${{ inputs.target || 'production' }}
  cancel-in-progress: false

env:
  DEVELOPMENT_PROJECT_REF: iouzoutneyjpugbbtdem
  PRODUCTION_PROJECT_REF: vkfnsqdyhvtwyqkisxhk

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      AI_ENV: ${{ inputs.target || 'production' }}
      DEV_DB_URL: ${{ secrets.SUPABASE_DEV_DB_URL }}
      PROD_DB_URL: ${{ secrets.SUPABASE_PROD_DB_URL }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ai/requirements.txt

      - name: Prove the package writes to schema ai and nowhere else
        working-directory: ai
        run: python check_write_scope.py

      - name: Resolve and verify the target database
        shell: bash
        run: |
          set -euo pipefail
          case "${AI_ENV}" in
            development) url="${DEV_DB_URL}"; ref="${DEVELOPMENT_PROJECT_REF}"; secret=SUPABASE_DEV_DB_URL ;;
            production)  url="${PROD_DB_URL}"; ref="${PRODUCTION_PROJECT_REF}"; secret=SUPABASE_PROD_DB_URL ;;
            *) echo "Unknown target '${AI_ENV}'"; exit 1 ;;
          esac
          if [ -z "${url}" ]; then
            echo "Target is ${AI_ENV} but repository secret ${secret} is not set."
            exit 1
          fi
          case "${url}" in
            *"${ref}"*) ;;
            *) echo "${secret} does not name the ${AI_ENV} project ref ${ref}"; exit 1 ;;
          esac
          echo "::add-mask::${url}"
          echo "DATABASE_URL=${url}" >> "$GITHUB_ENV"
          echo "Target ${AI_ENV}, project ${ref}"

      - name: Install
        working-directory: ai
        run: pip install -r requirements.txt

      # Contract 188 added `ai.valid_predictions`, and every read that produces
      # or consumes a forecast now goes through it rather than through
      # `ai.predictions`. A database below 188 cannot serve those reads.
      #
      # This matters most on the `push` trigger: merging a change to this file
      # starts a Production run, and if the migration has not been applied the
      # run would fail inside prediction with an "undefined relation" that reads
      # like a code defect rather than like a pending rollout. It SKIPS rather
      # than fails, because a scheduled job that turns red every morning until
      # somebody promotes a migration is noise, and noise is what gets a red
      # tick ignored. Import, training and the read-only studies do not touch
      # the new objects and are deliberately not gated on this.
      - name: Check the target holds the contract the forecasting path needs
        id: schema
        shell: bash
        run: |
          set -euo pipefail
          # NAME THE MISSING OBJECT. This gate was written as one boolean and
          # one fixed message, and on 13 August 2026 it refused a Production
          # that genuinely held contract 188 — run 31740574108 — reporting
          # "below contract 188 (ai.valid_predictions absent)" when the view was
          # present. The real fault was the probe: `to_regproc` takes a bare
          # function NAME, so `to_regproc('ai.canonical_from_odds_api(text)')`
          # returns null for a function that exists, and the gate could never
          # pass on any environment. `to_regprocedure` is the one that accepts a
          # signature. A gate that reports a cause it did not measure is worse
          # than one that reports nothing, because it sends the reader to the
          # database instead of to the probe — so each object is now measured
          # and named separately.
          probe="$(python - <<'PY'
          import os, psycopg
          with psycopg.connect(os.environ["DATABASE_URL"]) as conn:
              view, fn = conn.execute(
                  "select to_regclass('ai.valid_predictions') is not null,"
                  "       to_regprocedure('ai.canonical_from_odds_api(text)') is not null"
              ).fetchone()
          missing = [n for n, ok in
                     (("ai.valid_predictions", view),
                      ("ai.canonical_from_odds_api(text)", fn)) if not ok]
          print(("true" if not missing else "false") + "|" + ", ".join(missing))
          PY
          )"
          ready="${probe%%|*}"
          missing="${probe#*|}"
          echo "ready=${ready}" >> "$GITHUB_OUTPUT"
          if [ "${ready}" != true ]; then
            echo "::notice::${AI_ENV} is below contract 188 — missing: ${missing}. Prediction, evaluation and value selection are skipped until it is applied. Nothing was collected, trained or written."
          fi

      - name: Resolve task
        id: task
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = workflow_dispatch ]; then
            echo "name=${{ inputs.task }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = push ]; then
            echo 'name=bootstrap-if-empty' >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = '30 5 * * *' ]; then
            echo 'name=morning' >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = '0 23 * * *' ]; then
            echo 'name=evening' >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = '0 7 * * 1' ]; then
            echo 'name=train' >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = '30 8 * * 2' ]; then
            echo 'name=train' >> "$GITHUB_OUTPUT"
          else
            echo 'name=free-odds' >> "$GITHUB_OUTPUT"
          fi

      - name: Bootstrap empty Production AI Lab
        if: steps.task.outputs.name == 'bootstrap-if-empty' && steps.schema.outputs.ready == 'true'
        working-directory: ai
        shell: bash
        run: |
          set -euo pipefail
          if [ "${AI_ENV}" != production ]; then
            echo "Automatic bootstrap is Production-only."
            exit 1
          fi

          python - <<'PY' > /tmp/ai_bootstrap_state
          from db import connect
          with connect() as conn:
              row = conn.execute("""
                  select
                    (select count(*) from ai.raw_matches) as history,
                    (select count(*) from ai.fixtures) as fixtures,
                    (select count(*) from ai.fixture_odds) as odds,
                    (select count(*) from ai.models) as models
              """).fetchone()
          for key in ("history", "fixtures", "odds", "models"):
              print(f"{key}={int(row[key])}")
          PY
          source /tmp/ai_bootstrap_state
          echo "Production state before bootstrap: history=${history}, fixtures=${fixtures}, odds=${odds}, models=${models}"

          if [ "${history}" -eq 0 ]; then
            python fetch_history.py --all-divisions
          else
            echo "History already present; skipping historical import."
          fi

          if [ "${fixtures}" -eq 0 ]; then
            python sync_fixtures.py
          else
            echo "Fixtures already present; skipping free fixture bootstrap."
          fi

          if [ "${odds}" -eq 0 ]; then
            # Free Football-Data fixture prices only. This bootstrap does not
            # invoke the paid Odds API.
            python fetch_fixtures_odds.py
          else
            echo "Fixture odds already present; skipping free odds bootstrap."
          fi

          # Consumes retained Production evidence only; never calls a provider.
          python reconcile_paid_fixture_evidence.py

          if [ "${models}" -eq 0 ]; then
            stamp="$(date -u +%Y%m%dT%H%MZ)"
            python train_selected_challengers.py --version "auto-${stamp}"
          else
            echo "Models already present; skipping challenger bootstrap."
          fi

      - name: Activate Production forecasts after bootstrap reconciliation
        if: steps.task.outputs.name == 'bootstrap-if-empty' && steps.schema.outputs.ready == 'true'
        working-directory: ai
        shell: bash
        run: |
          set -euo pipefail
          # A paid poll may have retained future events after the free fixture
          # feed was last published. Reconcile them before deciding what can be
          # predicted; this makes no API call.
          python reconcile_paid_fixture_evidence.py
          current_models="$(python - <<'PY'
          from db import connect
          with connect() as conn:
              row = conn.execute("select count(*) as n from ai.models where status='current'").fetchone()
          print(int(row['n']))
          PY
          )"
          if [ "${current_models}" -eq 0 ]; then
            echo "No current Production models yet; bootstrap created challengers only."
            exit 0
          fi
          echo "${current_models} current Production models found; generating forecasts and value selections."
          ./run_leagues.sh predict.py
          ./run_leagues.sh find_value.py

      - name: Import history, predict and settle
        if: steps.task.outputs.name == 'morning' && steps.schema.outputs.ready == 'true'
        working-directory: ai
        run: |
          python fetch_history.py --all-divisions --seasons current
          python sync_fixtures.py
          python reconcile_paid_fixture_evidence.py
          status=0
          ./run_leagues.sh evaluate.py || status=1
          # Settle HERE, not only in the evening pass. Football-Data publishes a
          # weekend's results on the following morning, so ai.fixtures only turns
          # `played` inside this job — on 18 August 2026 that happened at 09:23,
          # nearly ten hours after the 23:31 settle run of the 17th had correctly
          # reported nothing to settle. Every settle job in the ledger therefore
          # read {"settled": 0} while 87 played bets waited, and the record looked
          # like a broken settler rather than a slow provider. Settling in the
          # same pass that imports the results closes that window; the job is
          # idempotent, so the evening pass remains a harmless second chance.
          ./run_leagues.sh settle_bets.py || status=1
          ./run_leagues.sh predict.py || status=1
          exit "$status"

      - name: Evaluate and settle
        if: steps.task.outputs.name == 'evening' && steps.schema.outputs.ready == 'true'
        working-directory: ai
        run: |
          status=0
          ./run_leagues.sh evaluate.py || status=1
          ./run_leagues.sh settle_bets.py || status=1
          exit "$status"

      - name: Collect free fixture odds and find value
        if: steps.task.outputs.name == 'free-odds' && steps.schema.outputs.ready == 'true'
        working-directory: ai
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = schedule ]; then
            day="$(TZ=Europe/London date +%u)"
            hour="$(TZ=Europe/London date +%H)"
            { [ "$day" = 2 ] && [ "$hour" = 13 ]; } || \
            { [ "$day" = 5 ] && [ "$hour" = 17 ]; } || exit 0
          fi
          python sync_fixtures.py
          # The Production paid poll ran fifteen minutes before this scheduled
          # job. Consume its retained fixtures/prices; do not call it again.
          python reconcile_paid_fixture_evidence.py
          python fetch_fixtures_odds.py
          ./run_leagues.sh find_value.py

      - name: Run manual task
        if: github.event_name == 'workflow_dispatch'
        working-directory: ai
        shell: bash
        run: |
          case "${{ steps.task.outputs.name }}" in
            import) python fetch_history.py --all-divisions ;;
            # These three read `ai.valid_predictions`. A manual dispatch
            # against a database below contract 188 says so rather than
            # failing inside psycopg with an undefined relation.
            predict|evaluate|value)
              if [ "${{ steps.schema.outputs.ready }}" != true ]; then
                echo "Refusing ${{ steps.task.outputs.name }}: ${AI_ENV} is below contract 188."
                exit 1
              fi
              case "${{ steps.task.outputs.name }}" in
                predict) python reconcile_paid_fixture_evidence.py; ./run_leagues.sh predict.py ;;
                evaluate) ./run_leagues.sh evaluate.py ;;
                value) python reconcile_paid_fixture_evidence.py; ./run_leagues.sh find_value.py ;;
              esac ;;
            # Provider-free identity repair over retained rows. It needs the
            # contract too, and makes no request of any kind.
            repair-identity)
              if [ "${{ steps.schema.outputs.ready }}" != true ]; then
                echo "Refusing repair-identity: ${AI_ENV} is below contract 188."
                exit 1
              fi
              python repair_identity.py --apply ;;
            settle) ./run_leagues.sh settle_bets.py ;;
            odds-plan) python odds_api.py plan ;;
            ablate)
              status=0
              for L in EPL SPL EL2; do
                python ablate.py --league "$L" || status=1
              done
              exit "$status" ;;
            # Same three leagues as `ablate`, and for the same reason: a
            # paired verdict per league beats a sweep nobody reads. Every
            # study writes its report and, with --record, a row in
            # ai.feature_experiments — including a null result.
            experiments)
              status=0
              for L in EPL SPL EL2; do
                python experiments.py --league "$L" \
                  --study "${{ inputs.study }}" --record || status=1
              done
              exit "$status" ;;
            # Bulk read-only research over a chosen league or all nine.
            #
            # Provider-free by construction: no fetch_history.py,
            # sync_fixtures.py, fetch_fixtures_odds.py or odds_api.py appears
            # in this branch, so it cannot spend a request of any kind.
            #
            # Read-only by enforcement rather than by convention. AI_READ_ONLY
            # opens the session with default_transaction_read_only=on, so an
            # insert raises read_only_sql_transaction from PostgreSQL; and
            # experiments.py refuses --record outright under it, so the
            # contradictory request fails before the study runs rather than
            # twenty minutes later. It writes its JSON reports to the runner
            # and they leave as artefacts.
            research)
              export AI_READ_ONLY=1
              # The ensemble question is asked of a COMPONENT SET, so the set
              # is a dispatch input rather than whatever the source default
              # happens to be on the day. `default` passes nothing, which is
              # what makes "the shipped ensemble" itself measurable.
              families=()
              if [ "${{ inputs.study }}" = ensemble ] \
                 && [ "${{ inputs.base_families }}" != default ]; then
                read -r -a families <<< "${{ inputs.base_families }}"
                families=(--base-families "${families[@]}")
              fi
              if [ "${{ inputs.league }}" = all ]; then
                ./run_leagues.sh experiments.py --study "${{ inputs.study }}" \
                  ${families[@]+"${families[@]}"}
              else
                python experiments.py --league "${{ inputs.league }}" \
                  --study "${{ inputs.study }}" ${families[@]+"${families[@]}"}
              fi ;;
            # `ablate.py` has no --record and writes nothing at all, so the
            # read-only session is belt and braces rather than the only guard.
            # It is exported anyway: the guarantee this arm offers must not
            # depend on a property of a script it merely happens to call.
            research-ablate)
              export AI_READ_ONLY=1
              if [ "${{ inputs.league }}" = all ]; then
                ./run_leagues.sh ablate.py --groups "${{ inputs.groups }}"
              else
                python ablate.py --league "${{ inputs.league }}" \
                  --groups "${{ inputs.groups }}"
              fi ;;
            bootstrap|train|free-odds) ;;
          esac

      - name: Train challengers
        if: steps.task.outputs.name == 'train' || steps.task.outputs.name == 'bootstrap'
        working-directory: ai
        shell: bash
        run: |
          stamp="$(date -u +%Y%m%dT%H%MZ)"
          python fetch_history.py --all-divisions
          if [ "${{ steps.task.outputs.name }}" = bootstrap ]; then
            python sync_fixtures.py
            python reconcile_paid_fixture_evidence.py
            python fetch_fixtures_odds.py
          fi
          # The 14-Aug guarded study selected family/window per league. This
          # creates those nine configurations as challengers; promotion remains
          # a separate admin/human action.
          python train_selected_challengers.py --version "auto-$stamp"

      # A nine-league study prints roughly two hundred lines, of which about
      # eighteen carry a number. The artefact holds the reports, but reading it
      # needs a credential the reader of a log does not have, so the run's own
      # findings were only ever recoverable by paging the log. This restates
      # them compactly at the end. It reads files the run just wrote, touches
      # no database and changes no result.
      - name: Digest the study reports into the log
        if: always() && github.event_name == 'workflow_dispatch'
        working-directory: ai
        run: |
          python - <<'PY'
          import glob, json, os
          paths = sorted(glob.glob("reports/*.json"))
          if not paths:
              print("no study reports written by this task")
          for path in paths:
              with open(path) as handle:
                  print(f"DIGEST {os.path.basename(path)} "
                        f"{json.dumps(json.load(handle), separators=(',', ':'), default=str)}")
          PY

      - name: Keep reports and convenience artefacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ai-lab-${{ github.run_id }}
          path: |
            ai/models/*.joblib
            ai/reports/*.json
          retention-days: 30
          if-no-files-found: ignore
