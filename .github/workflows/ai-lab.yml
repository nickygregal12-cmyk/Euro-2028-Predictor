name: AI Lab jobs

# Which environment the lab runs against is a choice, not a constant.
#
# The lab writes to schema `ai` and to nothing else — `check_write_scope.py`
# proves that against the package's own source and is the first thing this
# workflow runs, on every target. ADR 0029 gives `ai` no authority over
# platform fixtures, results, scoring, locks, standings, progression,
# memberships or player predictions, so the blast radius of running against a
# hosted project is that project's `ai` schema.
#
# Production is where the live competitions are — Premier League 2026/27 and
# Scottish Premiership 2026/27 — and where the paid odds budget is enabled, so
# it is a legitimate target rather than a mistake to guard against. It runs
# only when the owner supplies `SUPABASE_PROD_DB_URL`; until then every
# production run refuses before installing anything.
#
# The scheduled target comes from the `AI_LAB_SCHEDULED_TARGET` repository
# variable so it can be moved without editing this file. Unset means
# development, which is the safe default rather than the useful one.

on:
  schedule:
    - cron: '30 5 * * *'
    - cron: '0 23 * * *'
    - cron: '0 7 * * 1'
    - cron: '30 16 * * 5'
    - cron: '30 17 * * 5'
    - cron: '30 12 * * 2'
    - cron: '30 13 * * 2'
  workflow_dispatch:
    inputs:
      target:
        description: Which hosted project to run against
        required: true
        default: development
        type: choice
        options:
          - development
          - production
      task:
        description: Job to run
        required: true
        default: predict
        type: choice
        options:
          # bootstrap is the empty-lab path: history, fixtures, prices and one
          # challenger per league in a single run. It promotes nothing.
          - bootstrap
          - import
          - predict
          - evaluate
          - train
          - free-odds
          - value
          - settle
          - odds-plan
          - ablate

permissions:
  contents: read

concurrency:
  # One target at a time. Keyed on the target so a Production run and a
  # Development run do not queue behind one another for no reason.
  group: ai-lab-${{ inputs.target || vars.AI_LAB_SCHEDULED_TARGET || 'development' }}
  cancel-in-progress: false

env:
  DEVELOPMENT_PROJECT_REF: iouzoutneyjpugbbtdem
  PRODUCTION_PROJECT_REF: vkfnsqdyhvtwyqkisxhk

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      AI_ENV: ${{ inputs.target || vars.AI_LAB_SCHEDULED_TARGET || 'development' }}
      DEV_DB_URL: ${{ secrets.SUPABASE_DEV_DB_URL }}
      PROD_DB_URL: ${{ secrets.SUPABASE_PROD_DB_URL }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ai/requirements.txt
      - name: Prove the package writes to schema ai and nowhere else
        # First, before any credential is resolved and before anything is
        # installed. A run that could write outside `ai` must not reach a
        # hosted project at all, and that is a property of the source rather
        # than of anyone's care.
        working-directory: ai
        run: python check_write_scope.py
      - name: Resolve and verify the target database
        shell: bash
        run: |
          set -euo pipefail
          case "${AI_ENV}" in
            development) url="${DEV_DB_URL}"; ref="${DEVELOPMENT_PROJECT_REF}"; secret=SUPABASE_DEV_DB_URL ;;
            production)  url="${PROD_DB_URL}"; ref="${PRODUCTION_PROJECT_REF}"; secret=SUPABASE_PROD_DB_URL ;;
            *) echo "Unknown target '${AI_ENV}'"; exit 1 ;;
          esac
          if [ -z "${url}" ]; then
            echo "Target is ${AI_ENV} but the repository secret ${secret} is not set."
            echo "Add it in Settings → Secrets and variables → Actions, or choose another target."
            exit 1
          fi
          # The URL must name the project the target claims. This is what stops
          # a Development secret quietly pointing at Production, or the reverse,
          # which is the environment crossing the repository forbids outright.
          case "${url}" in
            *"${ref}"*) ;;
            *) echo "${secret} does not name the ${AI_ENV} project ref ${ref}"; exit 1 ;;
          esac
          echo "::add-mask::${url}"
          echo "DATABASE_URL=${url}" >> "$GITHUB_ENV"
          echo "Target ${AI_ENV}, project ${ref}"
      - name: Install
        working-directory: ai
        run: pip install -r requirements.txt
      - name: Resolve task
        id: task
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = workflow_dispatch ]; then
            echo "name=${{ inputs.task }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = '30 5 * * *' ]; then
            echo 'name=morning' >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = '0 23 * * *' ]; then
            echo 'name=evening' >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = '0 7 * * 1' ]; then
            echo 'name=train' >> "$GITHUB_OUTPUT"
          else
            echo 'name=free-odds' >> "$GITHUB_OUTPUT"
          fi
      - name: Import history and predict
        if: steps.task.outputs.name == 'morning'
        working-directory: ai
        run: |
          # 'current' rather than a literal season code. A hard-coded 2627
          # would keep fetching a finished season from 1 July 2027 onwards:
          # HTTP 200, a healthy row count, a succeeded job_run, and never
          # another result to grade or bet to settle.
          python fetch_history.py --all-divisions --seasons current
          python sync_fixtures.py
          # Grading a finished fixture and predicting the next one are
          # independent, so a failure in one is reported without cancelling
          # the other. The step still ends red.
          status=0
          ./run_leagues.sh evaluate.py || status=1
          ./run_leagues.sh predict.py || status=1
          exit "$status"
      - name: Evaluate and settle
        if: steps.task.outputs.name == 'evening'
        working-directory: ai
        run: |
          status=0
          ./run_leagues.sh evaluate.py || status=1
          ./run_leagues.sh settle_bets.py || status=1
          exit "$status"
      - name: Collect free fixture odds and find value
        if: steps.task.outputs.name == 'free-odds'
        working-directory: ai
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = schedule ]; then
            day="$(TZ=Europe/London date +%u)"
            hour="$(TZ=Europe/London date +%H)"
            { [ "$day" = 2 ] && [ "$hour" = 13 ]; } || \
            { [ "$day" = 5 ] && [ "$hour" = 17 ]; } || exit 0
          fi
          python sync_fixtures.py
          python fetch_fixtures_odds.py
          ./run_leagues.sh find_value.py
      - name: Run manual task
        if: github.event_name == 'workflow_dispatch'
        working-directory: ai
        shell: bash
        run: |
          case "${{ steps.task.outputs.name }}" in
            import) python fetch_history.py --all-divisions ;;
            predict) ./run_leagues.sh predict.py ;;
            evaluate) ./run_leagues.sh evaluate.py ;;
            value) ./run_leagues.sh find_value.py ;;
            settle) ./run_leagues.sh settle_bets.py ;;
            odds-plan) python odds_api.py plan ;;
            # One league at a time, and only a few: the point is a
            # paired verdict per family, not a sweep. EPL is the
            # deepest market, SPL the one closest to its closing
            # line, EL2 the largest sample.
            ablate)
              status=0
              for L in EPL SPL EL2; do
                python ablate.py --league "$L" || status=1
              done
              exit "$status" ;;
            bootstrap|train|free-odds) ;;
          esac
      - name: Train challengers
        if: steps.task.outputs.name == 'train' || steps.task.outputs.name == 'bootstrap'
        working-directory: ai
        shell: bash
        run: |
          # Minutes, not just the date. `ai.models` is UNIQUE (league, version),
          # so a date-only stamp means the second training run of any day
          # cannot insert — measured on Development on 13 August 2026, where a
          # re-run failed for all nine leagues with UniqueViolation on
          # (SL2, auto-20260813). That makes the Monday job unrepeatable: a
          # run that dies halfway cannot be retried, because the leagues that
          # already succeeded now block it.
          stamp="$(date -u +%Y%m%dT%H%MZ)"
          python fetch_history.py --all-divisions
          # Bootstrap is the first-run path: an empty lab needs its fixtures
          # and its prices as well as its history, because a challenger nobody
          # can compare to an upcoming fixture proves nothing. Training itself
          # is identical, and neither task promotes anything — a model becomes
          # current only through admin_ai_promote_model, with a written reason.
          if [ "${{ steps.task.outputs.name }}" = bootstrap ]; then
            python sync_fixtures.py
            python fetch_fixtures_odds.py
          fi
          # --walk-forward, because a single two-season holdout has a standard
          # error of roughly 0.02 on log loss and most feature changes are
          # smaller than that. Without folds the weekly job cannot tell an
          # improvement from a lucky split, and it is the only validation
          # anybody looks at.
          ./run_leagues.sh train.py --family poisson --version "auto-$stamp" \
            --walk-forward
      - name: Keep reports and convenience artefacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ai-lab-${{ github.run_id }}
          path: |
            ai/models/*.joblib
            ai/reports/*.json
          retention-days: 30
          if-no-files-found: ignore
