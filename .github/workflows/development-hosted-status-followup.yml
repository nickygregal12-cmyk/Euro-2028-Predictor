name: Development hosted-status follow-up

on:
  workflow_run:
    workflows: [Development fast-lane rollout]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  record-hosted-contract:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.22.2

      # THE RECORD REACHING `main` IS THE JOB; THE PULL REQUEST IS ONLY ONE ROUTE THERE.
      #
      # On 6 August 2026 this step pushed a correct contract-120 record and then
      # died on `gh pr create`, because the repository forbids GitHub Actions
      # from creating pull requests. The permission block above was already
      # right — that setting is not something a workflow can grant itself. With
      # `set -euo pipefail` the refusal failed the job *after* the push, so a
      # correct record sat on a branch nobody was told about while `main` went
      # on reporting the previous contract to every agent that read it.
      #
      # So PR creation is best-effort from here. If it is refused, the run says
      # so loudly — an issue, a job summary and the exact command to finish the
      # job by hand — and still exits successfully, because the record was
      # written and pushed and that part did not fail. A stranded-but-announced
      # record is recoverable in a minute; a stranded-and-silent one is the
      # defect this comment exists to prevent.
      - name: Update the machine-readable hosted contract and open a PR
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          expected="$(node -p "require('./config/deployment-contract.json').requiredMigrationCount")"
          latest_file="$(git ls-files 'supabase/migrations/*.sql' | sort | tail -1)"
          latest_base="$(basename "${latest_file}" .sql)"
          latest_version="${latest_base%%_*}"
          latest_name="${latest_base#*_}"

          EXPECTED="${expected}" LATEST_VERSION="${latest_version}" LATEST_NAME="${latest_name}" node --input-type=module <<'NODE'
          import fs from 'node:fs'

          const path = 'config/development-hosted-contract.json'
          const current = JSON.parse(fs.readFileSync(path, 'utf8'))
          current.requiredMigrationCount = Number(process.env.EXPECTED)
          current.latestMigrationVersion = process.env.LATEST_VERSION
          current.latestMigrationName = process.env.LATEST_NAME
          current.verifiedAt = new Date().toISOString()
          current.evidence = {
            source: 'Development fast-lane rollout',
            workflowRunId: Number(process.env.SOURCE_RUN_ID),
            repositoryHead: process.env.SOURCE_HEAD_SHA
          }
          // THIS RECORD STATES DEVELOPMENT. IT DOES NOT STATE PRODUCTION AT ALL.
          //
          // It used to carry `productionContract` and
          // `productionPromotionAuthorised`. First as literals — `= 63`, true
          // when written and silently false from the next production rollout
          // onwards, which put four unmergeable contract-declaration changes on
          // origin at once. Then as values READ from the production record here,
          // which fixed the source and kept the copy: this job runs after a
          // DEVELOPMENT rollout, so a PRODUCTION rollout left the copy behind
          // with nothing to refresh it. That is how `NOW.md` came to report
          // production at 145 on 10 August 2026 while production stood at 151,
          // with `npm run check:now` agreeing, because it regenerated from the
          // same stale copy.
          //
          // Every reader now reads `config/production-hosted-contract.json`
          // directly. Do not reintroduce a copy here to save them the read —
          // `scripts/generate-now.mjs` fails closed on one, deliberately.
          delete current.productionContract
          delete current.productionPromotionAuthorised
          fs.writeFileSync(path, `${JSON.stringify(current, null, 2)}\n`)
          NODE

          if git diff --quiet -- config/development-hosted-contract.json; then
            echo 'Hosted status already matches the successful rollout.'
            exit 0
          fi

          branch="automation/development-hosted-contract-${SOURCE_RUN_ID}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b "${branch}"
          git add config/development-hosted-contract.json
          git commit -m "Record development hosted contract ${expected}"
          git push origin "${branch}"
          title="Docs: record development hosted contract ${expected}"
          production_contract="$(node -p "require('./config/production-hosted-contract.json').requiredMigrationCount")"
          body="Generated after successful Development fast-lane rollout run ${SOURCE_RUN_ID}. Updates the machine-readable hosted contract only; production remains contract ${production_contract} and unauthorised for promotion."

          # `|| pr_failed=1` rather than an unguarded call: the branch is
          # already pushed by this point, so a refusal here must not discard
          # the run's real output.
          pr_failed=0
          gh pr create --base main --head "${branch}" --title "${title}" --body "${body}" || pr_failed=1

          if [ "${pr_failed}" -eq 0 ]; then
            echo "Opened a pull request for ${branch}."
            exit 0
          fi

          echo "::warning::Could not open a pull request for ${branch}. The record is pushed and needs a human or agent to merge it."

          {
            echo "## Hosted contract ${expected} recorded, pull request NOT opened"
            echo
            echo "The machine-readable hosted contract was updated and pushed to \`${branch}\`,"
            echo "but this run could not open a pull request for it. The usual cause is the"
            echo "repository setting that forbids GitHub Actions from creating pull requests;"
            echo "the workflow's own permissions are already correct and cannot override it."
            echo
            echo "**\`main\` still reports the previous hosted contract until this branch lands.**"
            echo
            echo "To finish by hand:"
            echo
            echo '```'
            echo "gh pr create --base main --head ${branch} \\"
            echo "  --title '${title}'"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

          # An issue, because a job summary is only seen by whoever opens the
          # run. Its failure must not fail the job either — the summary above
          # has already recorded everything needed to recover.
          gh issue create \
            --title "Hosted contract ${expected} is recorded on a branch but not on main" \
            --body "$(printf '%s\n' \
              "Development fast-lane rollout run ${SOURCE_RUN_ID} succeeded and the follow-up recorded hosted contract ${expected} on \`${branch}\`." \
              "" \
              "Opening the pull request was refused, so \`main\` still reports the previous hosted contract. Agents reading only \`main\` will repeat the stale number until this lands." \
              "" \
              "Close this by merging \`${branch}\` into \`main\`. No hosted mutation is involved — the rollout already happened; this is the record of it." \
              "" \
              "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}")" \
            || echo "::warning::Could not create the follow-up issue either. The job summary holds the recovery command."

      # ---------------------------------------------------------------------
      # OPS-011: the Netlify contract value, which drifts after every rollout.
      # ---------------------------------------------------------------------
      #
      # `EURO28_DEPLOYED_DB_CONTRACT` tells `validate-deployment-contract.mjs`
      # which contract the target database holds. It is a Netlify environment
      # variable — not a repository value — and it is maintained by hand, so it
      # goes stale the moment a rollout moves the database past it. That is the
      # open half of `OPS-011`, and it is the same failure class as `OPS-010`:
      # correct evidence exists and nothing carries it to where it is read.
      #
      # A trailing value does not fail a non-production build — the validator
      # deliberately waves it through and reports what is unavailable, because
      # failing would be the circular gate ADR 0024 removed. Which is exactly
      # why it is easy to miss: previews report a contract gap that does not
      # exist, weakening release evidence for as long as nobody notices.
      #
      # THE THREE NON-PRODUCTION CONTEXTS ONLY. `production` is never passed to
      # anything here, and a guard below refuses if it ever appears in the list:
      # production's value is what its promotion gate reads, and moving it is a
      # production configuration change. `dev-server` is left blank on purpose
      # so it fails closed, and is not in the list either.
      #
      # ALWAYS RUNS, AND RUNS LAST. The hosted record was pushed by the step
      # above; a failure here must not discard that, which is the lesson this
      # workflow already carries about not letting a later refusal throw away an
      # earlier success.
      - name: Align the Netlify non-production contract value, or say exactly what is stale
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail
          expected="$(node -p "require('./config/deployment-contract.json').requiredMigrationCount")"
          contexts="dev branch-deploy deploy-preview"

          for ctx in ${contexts}; do
            if [ "${ctx}" = "production" ] || [ "${ctx}" = "dev-server" ]; then
              echo "::error::Refusing to touch the ${ctx} context."
              exit 1
            fi
          done

          if [ -z "${NETLIFY_AUTH_TOKEN}" ] || [ -z "${NETLIFY_SITE_ID}" ]; then
            # THE ACTIONABLE MISMATCH, which is the half of OPS-011's closure
            # that is reachable without credentials this repository does not
            # hold. It fails rather than warns: a warning on a green run is how
            # this value went stale in the first place.
            {
              echo "## Netlify \`EURO28_DEPLOYED_DB_CONTRACT\` needs raising to ${expected}"
              echo
              echo "Hosted Development is now at contract **${expected}** (rollout run \`${SOURCE_RUN_ID}\`),"
              echo "and this job cannot update Netlify because \`NETLIFY_AUTH_TOKEN\` and/or"
              echo "\`NETLIFY_SITE_ID\` are not set as repository secrets."
              echo
              echo "**Three non-production contexts. Do not touch \`production\` or \`dev-server\`.**"
              echo
              echo '```bash'
              for ctx in ${contexts}; do
                echo "netlify env:set EURO28_DEPLOYED_DB_CONTRACT ${expected} --context ${ctx}"
              done
              echo '```'
              echo
              echo "A trailing value does not fail a preview build — the validator waves a"
              echo "non-production trail through on purpose — so nothing else will report this."
            } >> "${GITHUB_STEP_SUMMARY}"

            gh issue create \
              --title "Netlify EURO28_DEPLOYED_DB_CONTRACT is behind hosted Development (${expected})" \
              --body "$(printf '%s\n' \
                "Hosted Development reached contract ${expected} through rollout run ${SOURCE_RUN_ID}." \
                "" \
                "The Netlify variable \`EURO28_DEPLOYED_DB_CONTRACT\` is maintained by hand and is now stale for the three non-production contexts. A trailing value does NOT fail a preview build, so no other check will report it." \
                "" \
                "Run, for each of \`dev\`, \`branch-deploy\` and \`deploy-preview\` — and for none of the others:" \
                "" \
                '```' \
                "netlify env:set EURO28_DEPLOYED_DB_CONTRACT ${expected} --context <context>" \
                '```' \
                "" \
                "Do not change \`production\`: its value is what the promotion gate reads. Leave \`dev-server\` blank; it fails closed by design." \
                "" \
                "Set \`NETLIFY_AUTH_TOKEN\` and \`NETLIFY_SITE_ID\` as repository secrets to have this job do it automatically." \
                "" \
                "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}")" \
              || echo "::warning::Could not open the follow-up issue; the job summary holds the commands."

            echo "::error::Netlify EURO28_DEPLOYED_DB_CONTRACT must be raised to ${expected} for dev, branch-deploy and deploy-preview. See the job summary for the exact commands."
            exit 1
          fi

          # With credentials: set each non-production context, then READ IT BACK.
          # Writing and assuming is what a hand-maintained value already does.
          failed=0
          for ctx in ${contexts}; do
            npx --yes netlify-cli@latest env:set EURO28_DEPLOYED_DB_CONTRACT "${expected}" \
              --context "${ctx}" --site "${NETLIFY_SITE_ID}" >/dev/null

            actual="$(npx --yes netlify-cli@latest env:get EURO28_DEPLOYED_DB_CONTRACT \
              --context "${ctx}" --site "${NETLIFY_SITE_ID}" | tr -d '[:space:]')"

            if [ "${actual}" != "${expected}" ]; then
              echo "::error::Netlify ${ctx} still reports EURO28_DEPLOYED_DB_CONTRACT=${actual}, expected ${expected}."
              failed=1
            else
              echo "Netlify ${ctx}: EURO28_DEPLOYED_DB_CONTRACT=${actual}."
            fi
          done

          {
            echo "## Netlify non-production contract value"
            echo
            echo "Set to **${expected}** and read back for \`dev\`, \`branch-deploy\` and \`deploy-preview\`."
            echo "\`production\` and \`dev-server\` were not touched."
          } >> "${GITHUB_STEP_SUMMARY}"

          exit "${failed}"
