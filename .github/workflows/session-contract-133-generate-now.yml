name: Session Contract 133 Generate NOW

on:
  push:
    branches:
      - feature/contract-133-private-championship-restack

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/contract-133-private-championship-restack
      - uses: actions/setup-node@v7
        with:
          node-version: 22.22.2
          cache: npm
      - run: npm ci
      - name: Regenerate NOW.md from repository authorities
        run: npm run generate:now
      - name: Commit generated state
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code NOW.md && exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add NOW.md
          git commit -m 'Contract 133: regenerate NOW state'
          git push origin HEAD:feature/contract-133-private-championship-restack
