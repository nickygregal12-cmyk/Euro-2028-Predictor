name: Restack competition lineage as contract 103

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  restack:
    if: github.head_ref == 'agent/contract-103-competition-instance-lineage'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/contract-103-competition-instance-lineage
          fetch-depth: 0

      - name: Reapply PR 454 on current main without touching its branch
        shell: bash
        run: |
          set -euo pipefail
          target='supabase/migrations/20260804333000_competition_instance_lineage.sql'
          if [[ -f "$target" ]]; then
            echo 'Contract 103 restack already present.'
            exit 0
          fi

          git fetch origin 11293aba7ff154d710bb5712a1ee53b272384ff2

          python - <<'PY'
          from pathlib import Path
          import json
          import re
          import subprocess

          OLD = '11293aba7ff154d710bb5712a1ee53b272384ff2'

          def old(path: str) -> str:
              return subprocess.check_output(['git', 'show', f'{OLD}:{path}'], text=True)

          def write(path: str, text: str) -> None:
              target = Path(path)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(text)

          def replace_once(text: str, before: str, after: str, label: str) -> str:
              count = text.count(before)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              return text.replace(before, after)

          # The proven schema change from PR #454, renumbered after Cup contract 102.
          migration = old('supabase/migrations/20260804323000_competition_instance_lineage.sql')
          migration = migration.replace('Contract 102', 'Contract 103')
          migration = migration.replace(
              'The restart lifecycle is contract 104, and contract 103 teaches',
              'The restart lifecycle is contract 105, and contract 104 teaches',
          )
          migration = migration.replace('Contract 103 moves the single-row lookups', 'Contract 104 moves the single-row lookups')
          migration = migration.replace('`153_competition_instance_lineage.sql`', '`154_competition_instance_lineage.sql`')
          migration = migration.replace(
              'the failure this session has already found three times\n-- (`get_my_cup` at 98, the bonus rederive functions at 100, and the membership\n-- key contract 101 declined to widen).',
              'the failure class already exposed by `get_my_cup` at 98 and the Bonus\n-- rederive functions at 100.',
          )
          write('supabase/migrations/20260804333000_competition_instance_lineage.sql', migration)

          pgtap = old('supabase/tests/153_competition_instance_lineage.sql')
          pgtap = pgtap.replace('Contract 102', 'Contract 103')
          pgtap = pgtap.replace('contract 103', 'contract 104')
          pgtap = pgtap.replace('pre-contract-102', 'pre-contract-103')
          write('supabase/tests/154_competition_instance_lineage.sql', pgtap)

          # Machine contract.
          contract_path = Path('config/deployment-contract.json')
          contract = json.loads(contract_path.read_text())
          if contract.get('contractVersion') != 102 or contract.get('requiredMigrationCount') != 102:
              raise SystemExit(f'expected repository contract 102, found {contract.get("contractVersion")}/{contract.get("requiredMigrationCount")}')
          contract['contractVersion'] = 103
          contract['requiredMigrationCount'] = 103
          contract['notes'] = (
              'Tagged repository baseline euro-2028-baseline remains contract 63. '
              'Contracts 64–101 establish the multi-competition season foundations, provider custody, tournament corrections and Euro post-lock reveal. '
              'Contract 102 persists the Predictor Championship split as a distinct phase while preserving the tournament Cup path. '
              'Contract 103 makes repeating competition instances representable through live-instance uniqueness, series lineage, completion reasons and one server-only live-instance resolver. '
              'Hosted deployment remains separately guarded and is not claimed by this repository contract.'
          )
          contract_path.write_text(json.dumps(contract, indent=2) + '\n')

          # Standing instructions.
          agents_path = Path('AGENTS.md')
          agents = agents_path.read_text()
          agents = replace_once(
              agents,
              'The repository is at **contract 102** through `20260804323000_cup_split_stage_persistence.sql`. Development Supabase is hosted at contract 97, applied 4 August 2026 by fast-lane run 30931550512 on `381e2d0`; production remains at 63. Contract 101 corrects Euro post-lock reveal; contract 102 persists the Predictor Championship split as a distinct phase while preserving the tournament Cup path. The repository contract and the hosted contracts are distinct facts. Any hosted schema mutation requires the guarded rollout workflow, explicit owner approval and the applicable preflight.',
              'The repository is at **contract 103** through `20260804333000_competition_instance_lineage.sql`. Development Supabase is hosted at contract 97, applied 4 August 2026 by fast-lane run 30931550512 on `381e2d0`; production remains at 63. Contract 101 corrects Euro post-lock reveal; contract 102 persists the Predictor Championship split; contract 103 makes repeating competition instances representable without yet creating a restart. The repository contract and the hosted contracts are distinct facts. Any hosted schema mutation requires the guarded rollout workflow, explicit owner approval and the applicable preflight.',
              'AGENTS repository contract line',
          )
          agents_path.write_text(agents)

          # Target-design baseline index: preserve the Cup row and add lineage.
          design_path = Path('docs/design/README.md')
          design = design_path.read_text()
          design = replace_once(
              design,
              '`main` is at **101 migrations / 76 pgTAP suites** — contracts 94–101 landed on',
              '`main` is at **103 migrations / 78 pgTAP suites** — contracts 94–103 landed on',
              'design baseline count',
          )
          design = replace_once(
              design,
              '| 101 | Euro post-lock reveal stops gating on shared leagues |',
              '| 101 | Euro post-lock reveal stops gating on shared leagues |\n| 102 | Predictor Championship split-stage persistence and phase-aware membership |\n| 103 | repeating competition instances — live-instance uniqueness and series lineage |',
              'design contract table',
          )
          design_path.write_text(design)

          # Operational migration authority.
          ops_path = Path('docs/ops/ops-pending-migrations.md')
          ops = ops_path.read_text()
          ops = replace_once(
              ops,
              'The repository is at **contract 102**; development is at **97** and trails by five until the next fast-lane run.',
              'The repository is at **contract 103**; development is at **97** and trails by six until the next fast-lane run.',
              'ops headline',
          )
          old_repo_row = '| Repository `main` | **102** | Contract 101 removes the shared-league gate from Euro post-lock reveal; contract 102 persists the Predictor Championship split stage and phase-aware group membership through `20260804323000_cup_split_stage_persistence.sql` | PR CANDIDATE, AWAITING MERGE AND DEVELOPMENT ROLLOUT |'
          new_repo_row = '| Repository `main` | **103** | Contract 102 persists the Predictor Championship split stage; contract 103 makes repeating competition instances representable through `20260804333000_competition_instance_lineage.sql` | PR CANDIDATE, AWAITING MERGE AND DEVELOPMENT ROLLOUT |'
          ops = replace_once(ops, old_repo_row, new_repo_row, 'ops repository row')
          ops = ops.replace('VERIFIED; FIVE CONTRACTS BEHIND THE REPOSITORY', 'VERIFIED; SIX CONTRACTS BEHIND THE REPOSITORY')
          ops = ops.replace('ALIGNED WITH DEVELOPMENT, NOW FIVE BEHIND THE REPOSITORY', 'ALIGNED WITH DEVELOPMENT, NOW SIX BEHIND THE REPOSITORY')
          ops = replace_once(ops, '## Contracts 64–102', '## Contracts 64–103', 'ops contract heading')
          ops = replace_once(
              ops,
              '- **102:** Predictor Championship split-stage persistence. Groups identify `initial` or `split` phase and split groups retain their initial parent; membership is phase-aware so original and split rows coexist; `stage = \'split\'` fixtures carry a group and the overall Cup matchday. No points are copied into a starting total. Existing tournament reads remain on the initial roster and knockout authorities explicitly accept only playoff or knockout stages.',
              '- **102:** Predictor Championship split-stage persistence. Groups identify `initial` or `split` phase and split groups retain their initial parent; membership is phase-aware so original and split rows coexist; `stage = \'split\'` fixtures carry a group and the overall Cup matchday. No points are copied into a starting total. Existing tournament reads remain on the initial roster and knockout authorities explicitly accept only playoff or knockout stages.\n- **103:** A competition can happen more than once (ADR 0025 decision 1 prerequisite). The total `(tournament_id, game_key)` key becomes a partial unique index over live instances; `bonus_competitions` gains series lineage and a bounded `completion_reason`; and `predictor_internal.live_competition_id` becomes the one server-only definition of the live row. Nothing in this contract creates a successor — callers move in contract 104 and the restart driver follows in contract 105.',
              'ops contract 103 entry',
          )
          ops = ops.replace('contracts 98–102 are not yet', 'contracts 98–103 are not yet')
          ops = ops.replace('Contracts 98–102 have not been applied', 'Contracts 98–103 have not been applied')
          ops = ops.replace('trail the repository at contract 102', 'trail the repository at contract 103')
          ops_path.write_text(ops)

          # Current implementation authority.
          status_path = Path('docs/quality/current-status.md')
          status = status_path.read_text()
          old_contract_cell = next((line for line in status.splitlines() if line.startswith('| Repository contract | **102**')), None)
          if old_contract_cell is None:
              raise SystemExit('current-status contract 102 row not found')
          new_contract_cell = old_contract_cell.replace(
              '**102** — 102 canonical migrations through `20260804323000_cup_split_stage_persistence.sql`',
              '**103** — 103 canonical migrations through `20260804333000_competition_instance_lineage.sql`',
          ).replace(
              'trails the repository by five contracts until 98–102 are rolled out',
              'trails the repository by six contracts until 98–103 are rolled out',
          ).replace(
              'previews will say so until 98–102 are rolled out',
              'previews will say so until 98–103 are rolled out',
          )
          status = replace_once(status, old_contract_cell, new_contract_cell, 'current-status contract row')
          status = status.replace("predates contracts 94–102", "predates contracts 94–103")
          lines = status.splitlines()
          for index, line in enumerate(lines):
              if line.startswith('| Next executable issue |'):
                  lines[index:index + 1] = [
                      '| LMS restart lifecycle — **prerequisite represented at contract 103** | ADR 0025 decision 1 requires a new competition row rather than wiping the completed one. Contract 103 makes that representable without yet creating it: `(tournament_id, game_key)` is unique only across live instances; every row belongs to a series with sequence and predecessor lineage; `completion_reason` distinguishes a win, restart and abandonment; and one revoked `predictor_internal.live_competition_id` function defines the current instance. Hosted evidence found no completed competition in either project, so the partial key is equivalent to the replaced total key today. |',
                      '| Next executable issue | **Contract 104:** move every single-row `(tournament_id, game_key)` reader onto `predictor_internal.live_competition_id` before a successor can exist. **Then contract 105:** add the idempotent advisory-locked wipeout restart driver, complete the predecessor as `no_winner_restarted`, create the successor, re-enter prior entrants, copy no selections/cycles/projections/windows, and record the immutable restart event. The Cup split creator, scheduler and combined standings remain a separate later Cup slice. Contracts 98–103 await a development fast-lane run; no hosted write is authorised by repository inclusion. |',
                  ]
                  break
          else:
              raise SystemExit('current-status next executable row not found')
          status_path.write_text('\n'.join(lines) + '\n')

          # Seed compatibility declaration.
          seed_path = Path('e2e/seed-contract.ts')
          seed = seed_path.read_text()
          seed = replace_once(
              seed,
              ' */\nexport const SEED_REVIEWED_AT_CONTRACT = 102',
              ' *\n * Contract 103 adds competition-instance lineage, a bounded completion reason\n * and live-instance uniqueness. Existing seeded competitions backfill as\n * sequence one of a series that is themselves; none is completed, so the new\n * partial key permits nothing the replaced total key forbade. The resolver is\n * server-only and no successor can be created by this contract, leaving every\n * seeded browser journey unchanged.\n */\nexport const SEED_REVIEWED_AT_CONTRACT = 103',
              'seed review contract',
          )
          seed_path.write_text(seed)
          PY

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add AGENTS.md config/deployment-contract.json docs/design/README.md \
            docs/ops/ops-pending-migrations.md docs/quality/current-status.md \
            e2e/seed-contract.ts supabase/migrations/20260804333000_competition_instance_lineage.sql \
            supabase/tests/154_competition_instance_lineage.sql
          git diff --cached --check
          git commit -m 'Contract 103: make competition instances repeatable'
          git push origin HEAD:agent/contract-103-competition-instance-lineage
