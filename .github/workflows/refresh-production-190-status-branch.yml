name: Temporary refresh Production 190 status mirrors

on:
  push:
    branches:
      - agent/record-production-190-and-smoke

permissions:
  contents: write

jobs:
  refresh:
    if: "${{ startsWith(github.event.head_commit.message, 'Ops: refresh Production 190 status mirrors') }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/record-production-190-and-smoke
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22.22.2

      - name: Refresh bounded current-state inventory and generated NOW
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('docs/ops/ops-pending-migrations.md')
          text = path.read_text()

          replacements = [
              (
                  '**Repository only by this record:** Development and Production remain hosted at **189** until the dedicated rollout.',
                  '**Hosted position now:** Production is verified at **190** through the guarded rollout below; Development remains at **189** and no Contract-190 Development rollout is claimed by this record.',
              ),
              (
                  '## Current state — repository and both hosted databases at 189 (13 August 2026)',
                  '## Current state — repository 190, Production 190, Development 189 (14 August 2026)',
              ),
              (
                  '> **Current hosted boundary — contract 185 on both Supabase projects (12 August 2026):**',
                  '> **Historical hosted boundary — contract 185 on both Supabase projects (12 August 2026):**',
              ),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one current-state marker, found {count}: {old[:80]}')
              text = text.replace(old, new)

          rows = {
              r'^\| Repository candidate \| \*\*189\*\* \|.*$': '| Repository candidate | **190** | 190 canonical migrations through `20260814005000_ai_actionable_bet_evidence.sql`; Contract 190 makes actionable bet evidence real-bookmaker-only while retaining historical aggregate rows in the base tables. | LEVEL WITH PRODUCTION; DEVELOPMENT ONE CONTRACT BEHIND |',
              r'^\| Development Supabase `iouzoutneyjpugbbtdem` \| \*\*189\*\* \|.*$': '| Development Supabase `iouzoutneyjpugbbtdem` | **189** | Hosted Contract 189 remains the Development boundary. No Contract-190 Development rollout is claimed by this Production close-out. | ONE CONTRACT BEHIND REPOSITORY; PAID COLLECTION OFF |',
              r'^\| Production Supabase \| \*\*189\*\* \|.*$': '| Production Supabase | **190** | `vkfnsqdyhvtwyqkisxhk`; guarded rollout [31807942945](https://github.com/nickygregal12-cmyk/Euro-2028-Predictor/actions/runs/31807942945) from exact `main` `c54d5b2`, gated on encrypted backup [31785056556](https://github.com/nickygregal12-cmyk/Euro-2028-Predictor/actions/runs/31785056556) and fresh exact-head rehearsal [31807550563](https://github.com/nickygregal12-cmyk/Euro-2028-Predictor/actions/runs/31807550563). Independent postflight names `20260814005000 ai_actionable_bet_evidence`; 49 historical bets retained, 0 actionable valid bets at verification, 0 synthetic actionable evidence, provider usage unchanged at 10 and all four paid-odds schedules still active. | LEVEL; PAID COLLECTION ON |',
          }
          for pattern, replacement in rows.items():
              text, count = re.subn(pattern, replacement, text, count=1, flags=re.MULTILINE)
              if count != 1:
                  raise SystemExit(f'expected exactly one table row for pattern: {pattern}')

          old_para = re.compile(
              r'^\*\*Contract 189 is applied to both environments and nothing is pending\.\*\*.*?\n\n(?=\*\*The repair was installed uncalled, and has since been called\.\*\*)',
              flags=re.MULTILINE | re.DOTALL,
          )
          new_para = (
              '**Contract 190 is applied to Production; Development remains at Contract 189.** '
              'Production Contract 190 is the single additive `20260814005000_ai_actionable_bet_evidence.sql` boundary: '
              'it keeps historical bet rows immutable while excluding synthetic aggregate/reference books from actionable betting evidence and refusing future unbettable aggregate writes. '
              'Development has not been promoted to 190 in this close-out, so the repository and Production are level at 190 while Development is one contract behind. '
              'That is an explicit hosted-state difference, not a hidden pending Production migration.\n\n'
          )
          text, count = old_para.subn(new_para, text, count=1)
          if count != 1:
              raise SystemExit('expected exactly one Contract-189 current-state paragraph')

          path.write_text(text)
          PY

          node scripts/generate-now.mjs
          rm .github/workflows/refresh-production-190-status-branch.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/ops/ops-pending-migrations.md NOW.md .github/workflows/refresh-production-190-status-branch.yml
          git diff --cached --check
          git commit -m 'Ops: regenerate Production 190 status mirrors'
          git push origin HEAD:agent/record-production-190-and-smoke
