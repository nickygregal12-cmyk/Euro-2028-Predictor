name: Contract 55 canonical export

on:
  push:
    branches:
      - reconcile/contract54-source-discovery
    paths:
      - .github/workflows/contract54-source-discovery.yml
  pull_request:
    paths:
      - .github/workflows/contract54-source-discovery.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      SOURCE_REF: claude/apply-patch-gckf6v
    steps:
      - uses: actions/checkout@v4

      - name: Export exact canonical migration files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p canonical-migrations
          for filename in \
            20260728230000_last_man_standing.sql \
            20260729010000_predictor_cup_foundation.sql \
            20260729030000_predictor_cup_group_scoring.sql
          do
            path="supabase/migrations/${filename}"
            encoded_path="${path//\//%2F}"
            gh api "repos/${REPO}/contents/${encoded_path}?ref=${SOURCE_REF}" \
              --jq '.content' | base64 -d > "canonical-migrations/${filename}"
            test -s "canonical-migrations/${filename}"
          done
          sha256sum canonical-migrations/*.sql | tee canonical-migrations/SHA256SUMS

      - name: Upload canonical migrations
        uses: actions/upload-artifact@v4
        with:
          name: contract53-55-canonical-migrations
          path: canonical-migrations/
          retention-days: 1
