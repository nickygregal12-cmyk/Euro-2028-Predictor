name: Contract 54 source discovery

on:
  push:
    branches:
      - reconcile/contract54-source-discovery
    paths:
      - .github/workflows/contract54-source-discovery.yml
  pull_request:
    paths:
      - .github/workflows/contract54-source-discovery.yml

permissions:
  contents: read
  pull-requests: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - name: Locate canonical contract 53 and 54 sources
        shell: bash
        run: |
          set -euo pipefail
          : > contract54-source-findings.txt
          mapfile -t branches < <(
            gh api --paginate "repos/${REPO}/branches?per_page=100" --jq '.[].name'
          )
          printf 'Scanned %s branches.\n' "${#branches[@]}" | tee -a contract54-source-findings.txt

          for branch in "${branches[@]}"; do
            for path in \
              supabase/migrations/20260728230000_last_man_standing.sql \
              supabase/migrations/20260729010000_predictor_cup_foundation.sql \
              config/deployment-contract.json
            do
              encoded_path="${path//\//%2F}"
              if gh api "repos/${REPO}/contents/${encoded_path}?ref=${branch}" \
                --jq '.content' >/tmp/content.b64 2>/dev/null
              then
                printf '\n=== branch: %s | path: %s ===\n' "$branch" "$path" \
                  | tee -a contract54-source-findings.txt
                base64 -d /tmp/content.b64 | tee -a contract54-source-findings.txt
                printf '\n' >> contract54-source-findings.txt
              fi
            done
          done

          printf '\n=== open pull requests ===\n' | tee -a contract54-source-findings.txt
          gh api --paginate "repos/${REPO}/pulls?state=open&per_page=100" \
            --jq '.[] | [.number,.head.ref,.head.sha,.title] | @tsv' \
            | tee -a contract54-source-findings.txt

      - name: Upload findings
        uses: actions/upload-artifact@v4
        with:
          name: contract54-source-findings
          path: contract54-source-findings.txt
          retention-days: 1
