name: React Router advisory repair

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/npm-audit-diagnostic.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'src/**'
      - 'tests/**'
      - 'e2e/**'

permissions:
  contents: write

jobs:
  repair-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Replace compatibility-package imports
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          allowed = {'.js', '.jsx', '.mjs', '.cjs', '.ts', '.tsx'}
          excluded = {'.git', 'node_modules', 'dist', 'coverage', 'playwright-report', 'test-results'}
          changed = []

          for path in Path('.').rglob('*'):
              if not path.is_file() or path.suffix not in allowed:
                  continue
              if any(part in excluded for part in path.parts):
                  continue
              text = path.read_text()
              updated = text.replace('react-router-dom', 'react-router')
              if updated != text:
                  path.write_text(updated)
                  changed.append(str(path))

          print('\n'.join(changed) if changed else 'No compatibility-package imports remained.')
          PY

      - name: Install patched React Router v8 package
        shell: bash
        run: |
          set -euo pipefail
          npm uninstall react-router-dom
          npm install --save-exact react-router@8.3.0

      - name: Record installed React Router versions
        shell: bash
        run: |
          set +e
          npm ls react-router react-router-dom --all > /tmp/react-router-tree.txt 2>&1
          cat /tmp/react-router-tree.txt
          exit 0

      - name: Capture production dependency audit
        shell: bash
        run: |
          set +e
          npm audit --omit=dev --json > /tmp/npm-audit-fixed.json 2> /tmp/npm-audit-fixed.stderr
          status=$?
          echo "$status" > /tmp/npm-audit-fixed.status
          cat /tmp/npm-audit-fixed.stderr
          echo "npm audit exit status: $status"
          exit 0

      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-fixed
          path: |
            /tmp/react-router-tree.txt
            /tmp/npm-audit-fixed.json
            /tmp/npm-audit-fixed.stderr
            /tmp/npm-audit-fixed.status
          if-no-files-found: error
          retention-days: 7

      - name: Require a clean production dependency audit
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat /tmp/npm-audit-fixed.status)" = "0"

      - name: Verify application build, lint and tests
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          npm run lint
          npm test

      - name: Commit package and import migration
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail

          if git diff --quiet; then
            echo 'React Router v8 migration is already committed.'
            exit 0
          fi

          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json src tests e2e 2>/dev/null || true
          git commit -m 'Migrate to patched React Router v8'
          git push origin "HEAD:${HEAD_BRANCH}"
