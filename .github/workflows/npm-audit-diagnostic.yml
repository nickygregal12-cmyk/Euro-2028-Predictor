name: React Router advisory repair

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/npm-audit-diagnostic.yml'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: write

jobs:
  repair-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Pin React Router DOM outside the advisory range
        run: npm install --save-exact react-router-dom@7.11.0

      - name: Record installed React Router versions
        shell: bash
        run: |
          set +e
          npm ls react-router-dom react-router --all > /tmp/react-router-tree.txt 2>&1
          cat /tmp/react-router-tree.txt
          exit 0

      - name: Capture repaired production dependency audit
        shell: bash
        run: |
          set +e
          npm audit --omit=dev --json > /tmp/npm-audit-fixed.json 2> /tmp/npm-audit-fixed.stderr
          status=$?
          echo "$status" > /tmp/npm-audit-fixed.status
          cat /tmp/npm-audit-fixed.stderr
          echo "npm audit exit status: $status"
          exit 0

      - name: Upload repaired audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-fixed
          path: |
            /tmp/react-router-tree.txt
            /tmp/npm-audit-fixed.json
            /tmp/npm-audit-fixed.stderr
            /tmp/npm-audit-fixed.status
          if-no-files-found: error
          retention-days: 7

      - name: Require a clean production dependency audit
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat /tmp/npm-audit-fixed.status)" = "0"

      - name: Verify application build, lint and tests
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          npm run lint
          npm test

      - name: Commit package and lockfile repair
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail

          if git diff --quiet -- package.json package-lock.json; then
            echo 'React Router advisory repair is already committed.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git commit -m 'Pin React Router outside CSRF advisory range'
          git push origin "HEAD:${HEAD_BRANCH}"
