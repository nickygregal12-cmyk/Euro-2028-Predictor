name: Record Development 213 generated state

on:
  push:
    branches:
      - temp-ignore

permissions:
  contents: write

jobs:
  generate:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: temp-ignore
          fetch-depth: 0
      - name: Regenerate current-state surfaces and retire this helper
        shell: bash
        run: |
          set -euo pipefail
          node scripts/generate-now.mjs
          rm .github/workflows/record-development-213-generated-state.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add config/development-hosted-contract.json NOW.md docs/quality/current-status.md .github/workflows/record-development-213-generated-state.yml
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m 'docs: regenerate Development 213 current-state surfaces'
          git push origin HEAD:temp-ignore
