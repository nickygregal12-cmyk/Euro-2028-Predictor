name: AI Lab tests

on:
  pull_request:
    paths:
      - 'ai/**'
      - 'supabase/functions/provider-poll/**'
      # Matched by name rather than by exact timestamp. The literal
      # 20260812060000_ai_lab_operational_loop.sql stood here and named no file
      # in the repository: the migration landed at 20260812070000 after a
      # rebase, and 20260812060000 is cup_group_qualification. This suite
      # therefore did not run for the contract it exists to guard, and would
      # have run for an unrelated Championship change.
      #
      # `*_ai_*` rather than `*_ai_lab_*`: three of the five AI Lab contracts
      # name the subsystem without the word "lab" — ai_quarantined_evidence_
      # reads, ai_actionable_bet_evidence and ai_canonical_bet_evidence — and
      # those are the three that decide what counts as betting evidence. The
      # narrower pattern did not run this suite for any of them.
      - 'supabase/migrations/*_ai_*.sql'
      - '.github/workflows/ai-lab*.yml'
      - 'config/deployment-contract.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-and-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_lab_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ai_lab_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ai_lab_test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ai_lab_test
      AI_ENV: test
    steps:
      - name: Harden runner (audit egress)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install the locked test and analytics environment
        # ai/uv.lock includes DuckDB deliberately: analytics tests use
        # importorskip, so omitting the group would turn missing coverage green.
        run: bash scripts/agent-tools/ai-sync.sh test
      - name: Compile, lint and prove the package write boundary
        working-directory: ai
        run: |
          python -m compileall -q .
          ruff check .
          # The same guard the job workflow runs before it resolves a hosted
          # credential. Here it is a review gate; there it is a runtime one.
          python check_write_scope.py
      - name: Run unit plus database lifecycle tests with branch coverage
        working-directory: ai
        run: pytest --cov=. --cov-branch --cov-report=term-missing -q
      - name: Audit the resolved Python lock
        working-directory: ai
        run: |
          uv export --locked --no-dev --format requirements-txt \
            --output-file /tmp/ai-locked-requirements.txt >/dev/null
          pip-audit --require-hashes -r /tmp/ai-locked-requirements.txt
