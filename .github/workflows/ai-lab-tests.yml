name: AI Lab tests

on:
  pull_request:
    paths:
      - 'ai/**'
      - 'supabase/functions/provider-poll/**'
      # Matched by name rather than by exact timestamp. The literal
      # 20260812060000_ai_lab_operational_loop.sql stood here and named no file
      # in the repository: the migration landed at 20260812070000 after a
      # rebase, and 20260812060000 is cup_group_qualification. This suite
      # therefore did not run for the contract it exists to guard, and would
      # have run for an unrelated Championship change.
      - 'supabase/migrations/*_ai_lab_*.sql'
      - '.github/workflows/ai-lab*.yml'
      - 'config/deployment-contract.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-and-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_lab_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ai_lab_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ai_lab_test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ai_lab_test
      AI_ENV: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ai/requirements.txt
      - name: Install Python dependencies
        working-directory: ai
        # requirements-analytics.txt carries the offline DuckDB layer. It is a
        # separate file so the training pipeline does not depend on it, and it
        # is installed here so `ai/analytics` is genuinely exercised rather
        # than skipped: its suite calls importorskip, which would turn a
        # missing dependency into a silent pass.
        run: pip install -r requirements.txt -r requirements-analytics.txt pytest
      - name: Compile and run unit plus database lifecycle tests
        working-directory: ai
        run: |
          python -m compileall -q .
          # The same guard the job workflow runs before it resolves a hosted
          # credential. Here it is a review gate; there it is a runtime one.
          python check_write_scope.py
          pytest -q
