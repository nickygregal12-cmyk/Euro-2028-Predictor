[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22.22.2"

[context.deploy-preview.environment]
  VITE_UI_PUBLIC_LANDING = "true"
  VITE_UI_SEASON_MATCH_PREDICTOR = "true"

# Known application routes answer 200. Anything else reaches the final 404
# rewrite and renders the SPA NotFoundPage without becoming a soft 200.

[[redirects]]
  from = "/"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/auth/login"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/auth/signup"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/auth/reset"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/auth/update-password"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/welcome"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/play"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/matches"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/leagues"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/more"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/fixtures"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/league"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/account"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/profile"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/more/points"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/more/scoring"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/admin"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/admin/results"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/admin/users"
  to = "/index.html"
  status = 200

# Static competition children precede the parameterised competition root.
[[redirects]]
  from = "/competitions/:competitionSlug/:seasonSlug/games/match-predictor/standings"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/competitions/:competitionSlug/:seasonSlug/games/match-predictor"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/competitions/:competitionSlug/:seasonSlug/games/championship/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/competitions/:competitionSlug/:seasonSlug/games/lms"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/competitions/:competitionSlug/:seasonSlug/games"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/competitions/:competitionSlug/:seasonSlug/play"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/competitions/:competitionSlug/:seasonSlug/matches"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/competitions/:competitionSlug/:seasonSlug/leagues"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/competitions/:competitionSlug/:seasonSlug"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/join/:code"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/league/:id"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/h2h/:rivalId"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/profile/:playerId"
  to = "/index.html"
  status = 200

# Old Euro/tournament and old domestic game routes are intentionally absent.
# They fall through to the ordinary weekly 404 rather than receiving a 200.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 404

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://*.ingest.sentry.io https://*.ingest.us.sentry.io https://*.ingest.de.sentry.io; frame-src https://challenges.cloudflare.com; worker-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; frame-ancestors 'none'; upgrade-insecure-requests"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-XSS-Protection = "0"
