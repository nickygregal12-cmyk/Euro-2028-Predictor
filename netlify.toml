  status = 200

[[redirects]]
  from = "/competitions/:competitionSlug/:seasonSlug/games/championship/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/competitions/:competitionSlug/:seasonSlug/games/lms"
  to = "/index.html"
  status = 200

[[redirects]]
