# TWO NETLIFY SITES SHARE THIS FILE, because ADR 0026 builds two products from
# one `main` commit: the weekly Football Prediction Hub and the Euro 2028
# Predictor, on separate domains.
#
# WHAT SEPARATES THEM IS NOT IN THIS FILE, and must not be. `VITE_SITE_VARIANT`,
# `VITE_PUBLIC_SITE_ORIGIN` and `VITE_SIBLING_SITE_ORIGIN` are set PER SITE in
# each Netlify site's own environment variables (Site configuration → Environment
# variables). A `[build.environment]` value here would apply to both sites, so
# putting the variant here would give both deployments the same product — which
# is exactly the failure the seam exists to prevent.
#
#   Hub site:  VITE_SITE_VARIANT=hub   VITE_PUBLIC_SITE_ORIGIN=https://predictorhub.netlify.app
#   Euro site: VITE_SITE_VARIANT=euro  VITE_PUBLIC_SITE_ORIGIN=https://euro28predictor.com
#
# An origin may be intentionally absent in a local/non-hosted build; hosted sites
# should set their own address explicitly. `scripts/validate-netlify-environment.mjs`
# refuses malformed configured origins and refuses a site variant that is neither
# supported value, so these failures cannot silently publish the wrong metadata.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22.22.2"

  # ---- Stage 14, the Football Hub cutover ---------------------------------
  #
  # EVERY CONTEXT, INCLUDING PRODUCTION. These were deploy-preview-only while
  # the cutover was a rehearsal; `config/vnext-programme.json` now carries
  # `productionCutoverAuthorized: true`, and all three hosted environments are
  # level at Contract 208, so the reads these surfaces make exist everywhere
  # they run.
  #
  # ONE PER DESTINATION, NOT ONE FOR THE HUB. Setting any single value here to
  # anything but "true" restores that one legacy journey on the next deploy —
  # the legacy route components are all still mounted — with no migration, no
  # backfill and no data rollback. That is the release gate this programme
  # works to, and it is why nine lines is the right shape rather than one.
  #
  # THEY APPLY TO BOTH DEPLOYMENTS AND THAT IS SAFE. `netlify.toml` is shared,
  # but every flag below gates a DOMESTIC competition route, and the Euro
  # deployment's own journeys sit behind `TournamentJourney` and are untouched.
  # The variant itself stays a per-site variable for the reason recorded at the
  # top of this file.
  VITE_UI_PUBLIC_LANDING = "true"
  VITE_UI_SEASON_MATCH_PREDICTOR = "true"
  VITE_UI_FOOTBALL_HUB_HOME = "true"
  VITE_UI_FOOTBALL_HUB_MATCHES = "true"
  VITE_UI_FOOTBALL_HUB_GAMES = "true"
  VITE_UI_FOOTBALL_HUB_LEAGUES = "true"
  VITE_UI_FOOTBALL_HUB_PLAYER_PROFILE = "true"
  VITE_UI_FOOTBALL_HUB_DISCOVERY = "true"
  VITE_UI_FOOTBALL_HUB_ACCOUNT = "true"
  VITE_UI_FOOTBALL_HUB_LMS = "true"
  VITE_UI_FOOTBALL_HUB_CHAMPIONSHIP = "true"
  VITE_UI_FOOTBALL_HUB_PREDICTOR = "true"
  VITE_UI_FOOTBALL_HUB_ONBOARDING = "true"
  VITE_UI_FOOTBALL_HUB_INVITE = "true"

