[build.environment]
  NODE_VERSION = "22.22.2"

# SPA routing.
#
# Every rule below rewrites to the same SPA entry point; only the HTTP status
# differs. Known application routes answer 200; anything else falls through to
# the final catch-all and answers 404, so a nonexistent URL is no longer
# indexable as a real page (SEO-001, soft 404s).
#
# Real files are never shadowed by these rules. Netlify serves an existing file
# — /assets/*, /release.json, /robots.txt, /sitemap.xml, the favicons — before
# applying a redirect, unless the rule sets `force = true`. Do not add `force`
# to any rule here; it would break asset delivery and the release identity that
# production smoke reads.
#
# This list is kept honest by tests/app/spaRoutingStatus.test.ts, which reads
# the routes out of src/App.tsx and fails if one is missing, unknown or ordered
# so that a parameterised rule shadows a static sibling. Add a route to
# src/App.tsx and this file, in the same change.
#
# Static routes first, then parameterised ones: Netlify applies the first
# matching rule, so `/league/:id` must not intercept `/league/overall`.

[[redirects]]
  from = "/"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/auth/login"
  to = "/index.html"
  status = 200

