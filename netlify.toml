  to = "/index.html"
  status = 200

# One fixture's own Match Centre. It must answer 200 rather than fall to the
# catch-all: a shared or unfurled link to a match is one of the addresses most
# likely to be followed from outside the application.
[[redirects]]
  from = "/competitions/:competitionSlug/:seasonSlug/matches/:fixtureId"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/competitions/:competitionSlug/:seasonSlug/leagues"
  to = "/index.html"
  status = 200

# The matchday television screen (INNOV-006). A 200 because it is an address a
# host opens directly on a shared device, often typed or bookmarked rather than
# navigated to; who may read it is still the server's decision and the signed-in
# guard's, and this redirect makes neither.
[[redirects]]
  from = "/competitions/:competitionSlug/:seasonSlug/tv"
  to = "/index.html"
  status = 200

# One player's season inside a competition (contract 151). A 200 because it is
# linked from private-league surfaces and the Match Centre and can be reloaded
# or shared between co-members; who may actually READ it is the server's
# decision, and this redirect makes none.
[[redirects]]
  from = "/competitions/:competitionSlug/:seasonSlug/players/:playerId"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/competitions/:competitionSlug/:seasonSlug"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/join/:code"
  to = "/index.html"
  status = 200

# About & Disclaimer. Public, and a deep link a rights holder or an app store
# reviewer may arrive at directly, so it answers 200 rather than a 404 that
# happens to render.
[[redirects]]
  from = "/about"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/league/:id"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/h2h/:rivalId"
  to = "/index.html"
  status = 200

# The Euro tournament's own profiles, under `/tournament/` since the platform
# profile took `/profile`. Their route guard is `TournamentJourney`, not this
# file: a 200 here is a served document, never an authorisation.
[[redirects]]
  from = "/tournament/profile"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/tournament/profile/:playerId"
  to = "/index.html"
  status = 200

# Old Euro/tournament and old domestic game routes are intentionally absent.
# They fall through to the ordinary weekly 404 rather than receiving a 200.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 404

[[headers]]
  for = "/*"
  [headers.values]
    # `connect-src` includes api.pwnedpasswords.com for the AUTH-002 breach-corpus
    # check. Without the permission the check fails SILENTLY — the browser blocks
    # the request, `pwnedPassword.ts` fails open by design and returns 0, and the
    # control is simply absent with nothing in the application to notice. That is
    # why the permission and the code that needs it are asserted against each
    # other in `contentSecurityPolicyParity.test.ts` rather than maintained by
    # hand on two sides. Only the k-anonymous five-character hash prefix is ever
    # sent to it; see the module header for why that discloses nothing.
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self' https://api.pwnedpasswords.com https://*.supabase.co wss://*.supabase.co https://*.ingest.sentry.io https://*.ingest.us.sentry.io https://*.ingest.de.sentry.io; frame-src https://challenges.cloudflare.com; worker-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; frame-ancestors 'none'; upgrade-insecure-requests"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-XSS-Protection = "0"
