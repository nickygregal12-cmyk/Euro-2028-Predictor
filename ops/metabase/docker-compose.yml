# Local / self-hosted Metabase for internal analytics.
#
# NOT DEPLOYED. This file is a reproducible way to run Metabase against a
# NON-PRODUCTION database on a machine you control. Nothing in this repository
# provisions a hosted Metabase, and no such instance exists.
#
#   docker compose --env-file .env -f ops/metabase/docker-compose.yml up
#
# Read docs/ops/metabase-analytics.md before pointing this at any database
# holding real players.

services:
  # Metabase keeps its own questions, dashboards and users here. It is
  # deliberately NOT the application database: letting a BI tool write its
  # internal state into the product's database gives it a write grant it must
  # never have, and entangles two backup and migration stories.
  metabase-appdb:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: metabase
      POSTGRES_USER: metabase
      # Local-only container password. Supplied from the environment so no
      # value is committed; see .env.example.
      POSTGRES_PASSWORD: ${METABASE_APPDB_PASSWORD:?set METABASE_APPDB_PASSWORD}
    volumes:
      - metabase-appdb-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U metabase -d metabase']
      interval: 10s
      timeout: 5s
      retries: 10

  metabase:
    image: metabase/metabase:v0.56.9
    restart: unless-stopped
    depends_on:
      metabase-appdb:
        condition: service_healthy
    ports:
      # Bound to loopback on purpose. This tool reads analytics over real
      # players; publishing it on 0.0.0.0 would put an unauthenticated setup
      # wizard on every interface the host has.
      - '127.0.0.1:3000:3000'
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabase
      MB_DB_PORT: 5432
      MB_DB_USER: metabase
      MB_DB_PASS: ${METABASE_APPDB_PASSWORD:?set METABASE_APPDB_PASSWORD}
      MB_DB_HOST: metabase-appdb
      # Metabase phones home by default.
      MB_ANON_TRACKING_ENABLED: 'false'
      MB_SEND_NEW_SSO_USER_ADMIN_EMAIL: 'false'
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl --fail --silent http://localhost:3000/api/health || exit 1
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s

volumes:
  metabase-appdb-data:

# The analytics connection is added through the Metabase UI, not here. It uses
# the metabase_readonly role from analytics-views.sql, whose password is set
# out of band and never written to a file in this repository.
