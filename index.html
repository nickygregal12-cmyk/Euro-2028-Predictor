<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Favicons. Browsers that support SVG use favicon.svg; favicon.ico
         (16/32/48) is the raster fallback; apple-touch-icon for iOS home screen.
         (No web-app manifest — PWA treatment is parked in the roadmap.) -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Generated per deployment; do not author tags here. See
         src/app/site/documentMetadata.ts. Theme-colour hexes there must match
         --bg in src/styles/tokens.css. -->
    <!-- SITE METADATA: generated -->
    <title>Predictor Hub</title>
    <!-- /SITE METADATA -->

    <!-- Fonts are self-hosted (src/styles/fonts.css) — no render-blocking external
         font stylesheet and no third-party font-CDN connection on the critical path. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
